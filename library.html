  --vt-on-accent2:#04202F; --vt-marker:#EE8A83;
  --vt-deep:#4A9CCB; --vt-soft:#142C3A;
  --hl1:rgba(255,213,79,.30); --hl2:rgba(129,199,132,.30); --hl3:rgba(100,181,246,.30);

  --vt-page:#F5ECD7; --vt-surface:#FBF4E4; --vt-surface2:#EFE3C8;

  --vt-shadow:0 18px 45px rgba(90,60,20,.14);
  --vt-focus:#5C3A17;
  --vt-on-accent:#FFFFFF; --vt-accent-ink:#6A421B; --vt-accent2-ink:#8E2F29;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--vt-page);color:var(--vt-ink);font-family:var(--ez-ui-font);-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--vt-focus);outline-offset:2px}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--vt-surface);border-bottom:1px solid var(--vt-line);min-height:56px;flex:none}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{min-width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:var(--vt-accent-ink);background:var(--vt-surface2);padding:0 10px;white-space:nowrap}
.ibtn[aria-pressed="true"]{background:var(--vt-accent);color:var(--vt-on-accent)}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:880px;margin:0 auto;padding:16px}
.search{width:100%;height:46px;border-radius:14px;border:1px solid var(--vt-line);background:var(--vt-surface);padding:0 14px;font-size:16px}
.hero{border-radius:var(--vt-radius-sig);background:var(--vt-soft);padding:36px 20px 18px;text-align:center;margin-bottom:14px}
.hero h2{margin:0 0 6px;font-family:var(--vt-font);font-size:26px;color:var(--vt-accent-ink)}
.hero p{margin:0;color:var(--vt-muted);font-size:14px}
.sec-title{font-size:15px;color:var(--vt-muted);margin:18px 2px 8px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.cont{flex:none;width:210px;scroll-snap-align:start;background:var(--vt-surface);border:1px solid var(--vt-line);border-radius:var(--vt-radius);padding:12px;text-align:right}
.cont b{display:block;font-family:var(--vt-font);font-size:16px;line-height:1.5;max-height:3em;overflow:hidden}
.cont span{font-size:13px;color:var(--vt-muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cat{background:var(--vt-surface);border:1px solid var(--vt-line);border-radius:var(--vt-radius);padding:14px 12px;text-align:right;min-height:78px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 0 var(--vt-line)}
.cat b{font-size:15px;line-height:1.45}
.cat span{font-size:13px;color:var(--vt-muted)}
.cat.empty{opacity:.55}
.results{margin-top:8px}
.item{display:block;width:100%;text-align:right;padding:10px 12px;border-bottom:1px solid var(--vt-line);background:var(--vt-surface)}
.item b{display:block;font-family:var(--vt-font);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item span{font-size:13px;color:var(--vt-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tools{display:flex;gap:8px;padding:10px 16px;background:var(--vt-surface);border-bottom:1px solid var(--vt-line);flex:none}
.tools input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--vt-line);background:var(--vt-page);padding:0 12px;font-size:16px}
.tools select{height:42px;border-radius:12px;border:1px solid var(--vt-line);background:var(--vt-page);padding:0 8px}
.vlist{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.vlist .item{position:absolute;right:0;left:0;height:64px}
.muted{color:var(--vt-muted)}
.note{background:var(--vt-soft);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.7;margin:12px 0}
.card{background:var(--vt-surface);border:1px solid var(--vt-line);border-radius:var(--vt-radius);padding:16px;box-shadow:var(--vt-shadow)}
.card h2{font-family:var(--vt-font);font-size:22px;line-height:1.6;margin:0 0 4px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0 0;font-size:14px}
.card dt{color:var(--vt-muted)}
.card dd{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;border-radius:14px;background:var(--vt-accent);color:var(--vt-on-accent);font-size:16px;font-weight:600}
.btn.ghost{background:var(--vt-surface2);color:var(--vt-accent-ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.toc{list-style:none;margin:0;padding:0}
.toc li button,.toc li span{display:block;width:100%;text-align:right;padding:8px 4px;border-bottom:1px solid var(--vt-line);font-family:var(--vt-font);font-size:15px;line-height:1.6}
.toc li[data-d="2"]{padding-right:14px}.toc li[data-d="3"]{padding-right:28px}.toc li[data-d="4"]{padding-right:42px}.toc li[data-d="5"]{padding-right:56px}.toc li.deep{padding-right:66px}
.toc small{color:var(--vt-muted);font-family:var(--ez-ui-font)}
.msg{padding:28px 16px;text-align:center;color:var(--vt-muted)}
/* ---------- search (ORDER-108B) ---------- */
.sbox{display:flex;gap:8px;align-items:center}
.sbox select{height:46px;border-radius:14px;border:1px solid var(--vt-line);background:var(--vt-surface);padding:0 8px;font-size:15px;flex:none;max-width:40%}
.sbox .search{flex:1;min-width:0}
.sbox .ask{flex:none;height:46px;border-radius:14px;padding:0 12px;background:var(--vt-surface2);color:var(--vt-accent-ink);font-size:14px;white-space:nowrap}
.sscope{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.sscope button{padding:6px 12px;border-radius:999px;background:var(--vt-surface2);font-size:13px}
.sscope button[aria-pressed="true"]{background:var(--vt-accent);color:var(--vt-on-accent)}
.snote{font-size:13px;color:var(--vt-muted);margin:8px 2px 0}
.hit{display:block;width:100%;text-align:right;padding:10px 12px;border-bottom:1px solid var(--vt-line);background:var(--vt-surface)}
.hit .snip{display:block;font-family:var(--vt-font);font-size:16px;line-height:1.8;color:var(--vt-ink)}
.hit .src{display:block;font-size:13px;color:var(--vt-muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
mark.qh{background:var(--hl1);color:inherit;border-radius:3px;outline:1px solid var(--vt-accent2);outline-offset:0}
.more{display:block;margin:12px auto}
.ssheet{position:fixed;inset:0;z-index:45;background:var(--vt-page);display:flex;flex-direction:column}
.ssheet .wrap{width:100%}
/* ---------- reader: one printed page per screen (ORDER-108B 4b) ---------- */
.rd{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--vt-page)}
.rd-view{flex:1;position:relative;overflow:hidden;touch-action:pan-y}
.rd-stage{position:absolute;inset:0;display:flex;flex-direction:row;justify-content:center;gap:0;will-change:transform}
.rd-stage.anim{transition:transform .22s ease,opacity .22s ease}
.scr{position:relative;height:100%;display:flex;flex-direction:column;padding:12px 16px 10px;overflow:hidden;
  font-family:var(--vt-font);font-size:calc(19px * var(--rd-scale) * var(--fit,1));line-height:var(--rd-lh);text-align:justify;overflow-wrap:break-word}
.rd-stage .scr{flex:0 0 auto}
.rd-stage.two .scr + .scr{box-shadow:inset -1px 0 0 var(--vt-line)}
.scr.blank{visibility:hidden}
.scr-clip{overflow:hidden;flex:none;position:relative}
.scr-clip > .pg-body,.scr-clip > .pg-foot{position:relative}
.scr-foot{margin-top:auto;flex:none;padding-top:.5em}
.pg-mark{display:block;text-align:center;margin:0 0 8px;font-family:var(--ez-ui-font);font-size:12px;line-height:1.4;flex:none}
.pg-mark span{display:inline-block;border:1px solid var(--vt-line);border-radius:999px;padding:2px 10px;color:var(--vt-muted);background:var(--vt-surface)}
.pg-mark.bm span{border-color:var(--vt-accent2);color:var(--vt-accent2-ink)}
.pg-mark.cont span{border-style:dashed}
.pg-body{white-space:pre-line}
.pg-foot{white-space:pre-line;font-size:.8em;line-height:1.7;color:var(--vt-muted)}
.foot-rule{border-top:1px solid var(--vt-muted);width:30%;margin:0 0 .4em auto;opacity:.7}
.rd-measure{position:absolute;visibility:hidden;pointer-events:none;top:0;right:0;contain:layout}
.rd-edge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--vt-muted);font-size:14px}
.s-title{color:var(--vt-accent2-ink);font-weight:700}
.s-red{color:var(--vt-accent2)}
.s-matn{color:var(--vt-accent-ink);font-weight:700;background:var(--vt-soft);border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 2px}
mark{color:inherit;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.h1{background:var(--hl1)}mark.h2{background:var(--hl2)}mark.h3{background:var(--hl3)}
mark.has-note{border-bottom:2px dotted var(--vt-accent2)}
.rd-bar{display:flex;align-items:center;gap:10px;padding:8px 16px;padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--vt-line);background:var(--vt-surface);font-size:13px;color:var(--vt-muted);flex:none;min-height:40px}
.rd-bar .where{flex:1;color:var(--vt-ink)}
.rd-bar .ibtn{height:30px;min-width:30px;font-size:12px;border-radius:10px}
.selbar{position:fixed;left:50%;transform:translateX(-50%);top:64px;z-index:30;display:flex;gap:8px;align-items:center;background:var(--vt-surface);border:1px solid var(--vt-line);box-shadow:var(--vt-shadow);border-radius:999px;padding:6px 10px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--vt-line)}
.dot.h1{background:#FFD54F}.dot.h2{background:#81C784}.dot.h3{background:#64B5F6}
.dot[aria-pressed="true"]{border-color:var(--vt-ink)}
.drawer{position:fixed;inset:0;z-index:40;display:flex}
.drawer .shade{flex:1;background:rgba(0,0,0,.35)}
.drawer .panel{width:min(92vw,420px);background:var(--vt-surface);height:100%;display:flex;flex-direction:column;box-shadow:var(--vt-shadow)}
.tabs{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--vt-line);flex-wrap:wrap}
.tabs button{padding:8px 12px;border-radius:10px;background:var(--vt-surface2);font-size:14px}
.tabs button[aria-selected="true"]{background:var(--vt-accent);color:var(--vt-on-accent)}
.panel .body{flex:1;overflow:auto;padding:12px 14px}
.field{display:flex;gap:8px;align-items:center;margin:10px 0}
.field input{width:90px;height:42px;border-radius:10px;border:1px solid var(--vt-line);background:var(--vt-page);padding:0 10px;font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:10px;background:var(--vt-surface2)}
.seg button[aria-pressed="true"]{background:var(--vt-accent);color:var(--vt-on-accent)}
.nrec{border:1px solid var(--vt-line);border-radius:14px;padding:10px 12px;margin:8px 0;background:var(--vt-page)}
.nrec q{display:block;font-family:var(--vt-font);font-size:15px;line-height:1.7;quotes:none;border-right:4px solid var(--hl1);padding-right:8px}
.nrec q.h2{border-color:#81C784}.nrec q.h3{border-color:#64B5F6}
.nrec p{margin:6px 0 0;font-size:14px;white-space:pre-wrap}
.nrec .meta{font-size:12px;color:var(--vt-muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nrec .meta button{color:var(--vt-accent-ink);font-size:13px;padding:4px 6px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--vt-surface);border-radius:var(--vt-radius);padding:16px;width:min(100%,460px)}
.modal textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--vt-line);background:var(--vt-page);padding:10px;font-size:16px;line-height:1.7}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--vt-ink);color:var(--vt-page);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px}
/* ITEM 74 -- the page chrome in a left-to-right language; the reader stage keeps its own dir=rtl */
html[dir=ltr] .cat,html[dir=ltr] .item,html[dir=ltr] .toc li button,html[dir=ltr] .toc li span,html[dir=ltr] .hit{text-align:left}
html[dir=ltr] .toc li[data-d="2"]{padding-right:0;padding-left:14px}html[dir=ltr] .toc li[data-d="3"]{padding-right:0;padding-left:28px}html[dir=ltr] .toc li[data-d="4"]{padding-right:0;padding-left:42px}
html[dir=ltr] .nrec q{border-right:0;padding-right:0;border-left:4px solid var(--hl1);padding-left:8px}
</style>

  // ---------------- search (ORDER-108B) ----------------
  // Literal search only (title, author, words); smart search lives in Ezik's chat.
  // ctx: { catId, bookId, scope, openHit(hit, terms), onDone() } -> { el, focus() }
  function searchPanel(ctx) {
    var PAGE = 20;
    var st = { mode: 'text', scope: ctx.scope || 'all', offset: 0, seq: 0, last: null };
    var mode = el('select', { 'aria-label': T('smode_label') }, [
      el('option', { value: 'text', text: T('smode_text') }),

    var root = el('div', { class: 'spanel' }, [form, scopes, info, results]);
    function placeholder() {
      var p = st.mode === 'text' ? T('sph_text') : st.mode === 'author' ? T('sph_author') : T('search_ph');
      input.setAttribute('placeholder', p); input.setAttribute('aria-label', p);
    }
    function scopeId() { return st.scope === 'section' ? ctx.catId : st.scope === 'book' ? ctx.bookId : null; }
    function paintScopes() {
      scopes.innerHTML = '';
      var opts = [['all', T('scope_all')]];
      if (ctx.catId) opts.push(['section', T('scope_section')]);
      if (ctx.bookId) opts.push(['book', T('scope_book')]);
      scopes.classList.toggle('hidden', opts.length < 2);
      opts.forEach(function (o) {
        scopes.appendChild(el('button', { type: 'button', 'aria-pressed': st.scope === o[0] ? 'true' : 'false', text: o[1],
          on: { click: function () { st.scope = o[0]; paintScopes(); run(true); } } }));
      });
    }
    function hitItem(h, terms) {
      var snip = el('span', { class: 'snip' });
      if (h.cut_start) snip.appendChild(document.createTextNode('… '));
      C.snippetSegments(h.snippet, h.highlights).forEach(function (s) {
        snip.appendChild(s.hit ? el('mark', { class: 'qh', text: s.t }) : document.createTextNode(s.t));
      });
      if (h.cut_end) snip.appendChild(document.createTextNode(' …'));
      var where = markLabel(h.numbering, { seq: h.seq, vol: h.vol, page: h.page });
      return el('button', { class: 'hit', type: 'button', on: { click: function () {
        if (ctx.openHit) ctx.openHit(h, terms);
        else go('#/read/' + h.book_id + '/' + h.seq + '/' + encodeURIComponent(terms.join(' ')));
        if (ctx.onDone) ctx.onDone();
      } } }, [snip, el('span', { class: 'src', text: D(h.title) + ' · ' + where })]);
    }
    function authorItem(a) {
      return el('button', { class: 'item', type: 'button', on: { click: function () { showAuthor(a); } } },
        [el('b', { text: D(a.author) }), el('span', { text: T('books_n', { n: D(a.count) }) })]);
    }
    function showAuthor(a) {
      var my = ++st.seq;
      results.innerHTML = ''; info.textContent = T('loading');
      api(C.buildSearchPath({ mode: 'author', q: a.key, scope: st.scope, id: scopeId(), expand: 1, limit: 1 })).then(function (j) {
        if (my !== st.seq) return;
        var r = j.results.filter(function (x) { return x.key === a.key; })[0] || a;
        info.textContent = D(r.author) + ' · ' + T('books_n', { n: D(r.count) });
        results.appendChild(el('button', { class: 'btn ghost', type: 'button', style: 'margin:8px 0', text: T('s_all_authors'), on: { click: function () { run(true); } } }));
        (r.books || []).forEach(function (b) { results.appendChild(bookItem({ book_id: b.book_id, title: b.title, author: r.author, death_hijri: b.death_hijri })); });
      }).catch(function () { if (my === st.seq) errorView(results, function () { showAuthor(a); }); });
    }
    function run(reset) {
      var q = input.value.trim();
      if (reset) { st.offset = 0; }
      if (!q) { ++st.seq; results.innerHTML = ''; info.textContent = ''; return; }
      var my = ++st.seq;
      if (reset) { results.innerHTML = ''; info.textContent = T('loading'); }
      var path = C.buildSearchPath({ mode: st.mode, q: q, scope: st.scope, id: scopeId(), offset: st.offset, limit: PAGE });
      api(path).then(function (j) {
        if (my !== st.seq) return;
        var old = results.querySelector('.more'); if (old) old.remove();
        if (st.offset === 0) results.innerHTML = '';
        if (j.refused) { info.textContent = T('s_refused'); return; }
        if (!j.total) { info.textContent = st.mode === 'text' ? T('none_text') : st.mode === 'author' ? T('none_author') : T('search_none'); return; }
        info.textContent = T('s_total', { n: D(j.total) }) + (j.truncated ? ' · ' + T('s_window', { n: D(j.window) }) : '');
        j.results.forEach(function (r) {
          results.appendChild(st.mode === 'text' ? hitItem(r, j.terms || []) : st.mode === 'author' ? authorItem(r) : bookItem(r));
        });
        if (j.more) results.appendChild(el('button', { class: 'btn ghost more', type: 'button', text: T('s_more'), on: { click: function () { st.offset += PAGE; run(false); } } }));
      }).catch(function () { if (my === st.seq) { info.textContent = ''; errorView(results, function () { run(true); }); } });
    }
    var timer = null;
    input.addEventListener('input', function () {
      clearTimeout(timer);
      // words go to the full-text index: wait for a pause (or Enter); titles and authors answer as you type
      timer = setTimeout(function () { run(true); }, st.mode === 'text' ? 700 : 260);

    form.addEventListener('submit', function (e) { e.preventDefault(); clearTimeout(timer); run(true); try { input.blur(); } catch (x) {} });
    mode.addEventListener('change', function () { st.mode = mode.value; placeholder(); run(true); });
    ask.addEventListener('click', function () {
      var q = input.value.trim();
      var hook = window.EzikLibrary && window.EzikLibrary.askEzik;
      if (typeof hook === 'function') { try { hook(q); } catch (e) { toast(T('ask_note')); } }
      else { info.textContent = T('ask_note'); toast(T('ask_note')); }
    });
    placeholder(); paintScopes();
    return { el: root, focus: function () { try { input.focus(); } catch (e) {} } };
  }

  function viewReader(bookId, startSeq, hlTerms) {
    var WIN = 4, MAXLOADED = 24;
    var book = null, pages = {}, loaded = null, bookNotes = [], dead = false, busy = false;
    var plans = {}, planKey = '', geo = null;      // seq -> { scale, screens:[{body,foot}], offsets:[] }
    var items = [], idx = 0, two = false, gen = 0;      // gen: bumped on every jump; stale fetches are dropped
    var terms = hlTerms && hlTerms.length ? hlTerms : null;
    var prefs = readerPrefs(); applyReaderPrefs(prefs);
    var rd = el('div', { class: 'rd' });
    var titleEl = el('h1', { text: T('loading') });
    var bmBtn = el('button', { class: 'ibtn', 'aria-pressed': 'false', text: T('bookmark') });

      el('button', { class: 'ibtn', text: T('contents'), on: { click: function () { openDrawer('toc'); } } }),
      bmBtn, twoBtn,
      el('button', { class: 'ibtn', 'aria-label': T('settings'), text: 'Aa', on: { click: function () { openDrawer('settings'); } } })
    ]);
    var view = el('div', { class: 'rd-view' });
    var stage = el('div', { class: 'rd-stage one', dir: 'rtl' });
    var measureBox = el('div', { class: 'rd-measure', 'aria-hidden': 'true' });
    view.appendChild(stage); view.appendChild(measureBox);
    var where = el('span', { class: 'where', 'aria-live': 'polite' });
    var counter = el('span', {});
    var hlBtn = el('button', { class: 'ibtn hidden', text: T('hl_clear'), on: { click: function () { terms = null; hlBtn.classList.add('hidden'); show(); } } });
    var bar = el('footer', { class: 'rd-bar' }, [where, hlBtn, counter]);

    if (terms) hlBtn.classList.remove('hidden');

    // ---- geometry and measuring ----
    function geometry() {

          var ls = el('div', { class: 'seg' });
          [[1.6, 'ls_tight'], [1.9, 'ls_normal'], [2.3, 'ls_wide']].forEach(function (o) {
            ls.appendChild(el('button', { 'aria-pressed': p.lh === o[0] ? 'true' : 'false', text: T(o[1]), on: { click: function () { setP({ scale: p.scale, lh: o[0] }); } } }));
          });
          panelBody.appendChild(ls);
          panelBody.appendChild(el('h4', { text: T('mode') }));
          var md = el('div', { class: 'seg' }); var cm = LS.get(K_MODE, null);
          [['day', 'mode_day'], ['night', 'mode_night'], ['sepia', 'mode_sepia'], [null, 'mode_follow']].forEach(function (o) {
            md.appendChild(el('button', { 'aria-pressed': cm === o[0] ? 'true' : 'false', text: T(o[1]), on: { click: function () { if (o[0]) LS.set(K_MODE, o[0]); else LS.del(K_MODE); applyMode(); paint(); } } }));
          });
          panelBody.appendChild(md);
        }
      }
      var panel = el('div', { class: 'panel' }, [tabs, panelBody]);
      dr.appendChild(panel);
      dr.appendChild(el('div', { class: 'shade', on: { click: close } }));
      document.body.appendChild(dr);
      paint();
    }

    // ---- boot ----
    Promise.all([api('books/' + encodeURIComponent(bookId)), notes.listByBook(bookId)]).then(function (res) {
      if (dead) return;
      book = res[0]; bookNotes = res[1];
      titleEl.textContent = D(book.title); document.title = D(book.title) + ' - ' + T('app_title');
      if (book.access !== 'full') { stage.appendChild(el('p', { class: 'note', text: T('card_only_reader') })); setTimeout(function () { go('#/book/' + bookId); }, 1200); return; }
      var p = getPos(bookId);
      var seq = startSeq && startSeq >= 1 ? Math.min(startSeq, book.pages) : p ? p.seq : 1;
      var anchor = p && p.seq === seq && !startSeq ? { seq: seq, part: p.part || 0, offset: p.offset || 0 } : { seq: seq, part: 0, offset: 0 };
      openAt(seq, anchor);
    }).catch(function () { errorView(stage, function () { route(); }); });

    return {
      destroy: function () {
        dead = true; savePosition();
        document.removeEventListener('keydown', onKey); document.removeEventListener('selectionchange', onSel);
        window.removeEventListener('resize', onResize); hideSelbar();
        Array.prototype.forEach.call(document.querySelectorAll('.drawer,.modal,.ssheet'), function (x) { x.remove(); });
      }
    };
  }

  // ---------------- notes UI ----------------
  function noteEditor(rec, onSaved, onDeleted) {
    var ta = el('textarea', { placeholder: T('note_ph'), 'aria-label': T('note_ph') });
    ta.value = rec.note || '';
    var colors = el('div', { class: 'seg', style: 'margin:10px 0' });
    var color = rec.color || 'h1';
    ['h1', 'h2', 'h3'].forEach(function (c) {
      colors.appendChild(el('button', { class: 'dot ' + c, 'aria-label': T('hl_color') + ' ' + c.slice(1), 'aria-pressed': c === color ? 'true' : 'false', on: { click: function (e) {
        color = c; Array.prototype.forEach.call(colors.children, function (b) { b.setAttribute('aria-pressed', b === e.currentTarget ? 'true' : 'false'); });
      } } }));
    });
    var box = el('div', { class: 'box' }, [
      el('h3', { style: 'margin:0 0 8px', text: T('note_title') }),
      rec.text ? el('q', { style: 'display:block;font-family:var(--vt-font);margin-bottom:8px;color:var(--vt-muted)', text: rec.text }) : null,
      rec.type !== 'bookmark' ? colors : null, ta,
      el('div', { class: 'actions' }, [
        el('button', { class: 'btn', text: T('save'), on: { click: function () { notes.update(rec.id, { note: ta.value, color: color }).then(function (r) { md.remove(); toast(T('saved')); if (onSaved) onSaved(r); }); } } }),
        el('button', { class: 'btn ghost', text: T('delete'), on: { click: function () { if (!confirm(T('confirm_delete'))) return; notes.remove(rec.id).then(function () { md.remove(); if (onDeleted) onDeleted(); }); } } }),
        el('button', { class: 'btn ghost', text: T('cancel'), on: { click: function () { md.remove(); } } })
      ])
    ]);
    var md = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' }, [box]);
    document.body.appendChild(md);
    ta.focus();
  }
  function recWhere(r) {
    if (r.page == null) return T('mark_seq', { s: D(r.seq) });
    return markLabel(r.numbering, { seq: r.seq, vol: r.vol, page: r.page });
  }
  function notesList(target, bookId, onOpen, onChange) {
    target.innerHTML = '';
    target.appendChild(el('p', { class: 'msg', text: T('loading') }));
    (bookId ? notes.listByBook(bookId) : notes.listAll()).then(function (list) {
      target.innerHTML = '';
      if (!list.length) { target.appendChild(el('p', { class: 'msg', text: T('notes_empty') })); return; }
      var lastBook = null;
      list.forEach(function (r) {
        if (!bookId && r.book_id !== lastBook) { lastBook = r.book_id; target.appendChild(el('h3', { class: 'sec-title', text: D(r.book_title || r.book_id) })); }
        var kind = r.type === 'bookmark' ? T('t_bookmark') : r.type === 'note' ? T('t_note') : T('t_highlight');
        var box = el('div', { class: 'nrec' }, [
          r.text ? el('q', { class: r.color || '', text: r.text }) : null,
          r.note ? el('p', { text: r.note }) : null,
          el('div', { class: 'meta' }, [
            el('span', { text: kind + ' · ' + recWhere(r) }),
            el('button', { text: T('open'), on: { click: function () { if (onOpen) onOpen(r); else go('#/read/' + r.book_id + '/' + r.seq); } } }),
            el('button', { text: T('edit'), on: { click: function () { noteEditor(r, function () { notesList(target, bookId, onOpen, onChange); if (onChange) onChange(); }, function () { notesList(target, bookId, onOpen, onChange); if (onChange) onChange(); }); } } }),
            el('button', { text: T('delete'), on: { click: function () { if (!confirm(T('confirm_delete'))) return; notes.remove(r.id).then(function () { notesList(target, bookId, onOpen, onChange); if (onChange) onChange(); }); } } })
          ])
        ]);
        target.appendChild(box);
      });
    }).catch(function () { errorView(target, function () { notesList(target, bookId, onOpen, onChange); }); });
  }
  function viewNotes(bookId) {
    $app.appendChild(topBar(T('my_notes'), '#/', []));
    var body = el('div', { class: 'wrap' });
    $app.appendChild(el('main', { class: 'scroll' }, [body]));
    if (bookId) {
      body.appendChild(el('div', { class: 'seg', style: 'margin-bottom:8px' }, [
        el('button', { text: T('all_books'), on: { click: function () { go('#/notes'); } } }),
        el('button', { 'aria-pressed': 'true', text: T('this_book') })
      ]));
    }
    var list = el('div');
    body.appendChild(list);
    notesList(list, bookId, null, null);
    return {};
  }

  // ---------------- Ezik (ORDER-108C) ----------------
  // Back to Ezik lands on its sections (the same resume key quest.html's home link writes) --
  // unless the reader came from a conversation (ORDER-108D D2): then Ezik reopens that one.
  function backToEzik() {
    try {
      if (!sessionStorage.getItem('ezik_resume_thread_v1')) sessionStorage.setItem('ezik_resume_section_v1', 'home');
    } catch (e) {}
    location.href = '/';
  }
  // B5: "ask Ezik" opens Ezik's chat with the question in the composer, NOT sent. The question
  // travels in this tab's sessionStorage, never in a URL, so no server log ever carries it.
  window.EzikLibrary.askEzik = function (query) {
    var q = String(query == null ? '' : query).trim().slice(0, 1000);
    try {
      if (q) sessionStorage.setItem('ezik_ask_prefill_v1', q);
      sessionStorage.removeItem('ezik_resume_section_v1');
    } catch (e) {}
    location.href = '/';
  };
  // B1: deep links. The query is removed from the address once read, so a reload keeps the
  // reader where they went next instead of snapping back to the cited page.
  var link = C.parseDeepLink(location.search);
  if (link) {
    var rest = location.search.replace(/^\?/, '').split('&').filter(function (kv) {
      return kv && !/^(book|vol|page|seq)(=|$)/.test(kv);
    }).join('&');
    var clean = location.pathname + (rest ? '?' + rest : '');
    var enc = encodeURIComponent(link.book);
    var first = link.seq ? '#/read/' + enc + '/' + link.seq : '#/book/' + enc;
    try { history.replaceState(null, '', clean + first); } catch (e) { location.hash = first; }
    if (link.page) {
      api('books/' + enc + '/locate?page=' + link.page + (link.vol ? '&vol=' + link.vol : ''), true).then(function (j) {
        if (!j || !j.seq || location.hash !== first) return;
        if (!j.exact) toast(T('jump_near'));
        var to = '#/read/' + enc + '/' + j.seq;
        try { history.replaceState(null, '', clean + to); route(); } catch (e) { location.replace(to); }
      }).catch(function () {});
    }
  }

  document.title = T('app_title');
  route();
})();
</script>
</body>
