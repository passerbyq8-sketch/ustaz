     is not a third shape: it is the same entry, the same class, the same gap, mark, title,
     sub and chevron, the same 44px tap floor and the same 4px/2px padding -- one shape that
     now looks the same on both viewports instead of one that only shrank on the small one. */
  .ezsug-card{width:auto;align-self:flex-start;max-width:100%;box-sizing:border-box;min-height:44px;display:flex;align-items:center;
    gap:10px;padding:4px 2px;border-radius:0;background:transparent;
    border:0;color:var(--a3-ink);font-family:var(--ez-ui-font);
    cursor:pointer;text-align:start}
  .ezsug-body{display:flex;flex-direction:column;min-width:0;flex:1}
  .ezsug-title{font-weight:800;font-size:14.5px;line-height:1.4;color:var(--a3-ink)}
  .ezsug-sub{font-size:12px;line-height:1.5;color:var(--a3-muted);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .ezsug-mark{flex-shrink:0;display:inline-flex;color:var(--a3-blue)}
  .ezsug-go{flex-shrink:0;display:inline-flex;color:var(--a3-muted)}
  .ezsug-pill{flex-shrink:0;min-height:40px;display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:999px;background:var(--a3-surface);
    border:1px solid var(--a3-line);color:var(--a3-ink);font-family:var(--ez-ui-font);
    font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}
  /* ========================================================================
     S113 -- THE ISTANA VOICE ROOM.

     The call screen was a navy-to-black gradient over the whole viewport with a 180px pulsing
     circle floating in the middle of it and two 76px round buttons at the foot. Nothing about
     the CALL moved: the recogniser, the endpoints, the payload, the barriers, the cleanup and
     every handler are the ones that shipped. What moved is the room they happen in -- a bounded
     rail, a bounded stage on its own measure, and a bounded dock.

     WHAT THIS BLOCK MAY NOT DO, and does not:
       * no background-image, no gradient, no repeat and no url() anywhere -- the page is the
         solid --vt-page the identity declares, white in light and a deep navy-blue in dark;
       * no selector below can match html, body or :root -- every one is a .ezcall- class, and
         .ezcall- exists nowhere else in the file;
       * it draws no ::before / ::after and states no `content`, so nothing can be painted over
         the room by a rule the reader cannot see;
       * it declares NO colour of its own at all. Every value is an a3 token, in scope because
         the screen root carries .ezhome -- the idiom EzShell, the mushaf chrome and the chat
         already use.

     REDUCED MOTION IS NOT TOUCHED HERE. The ring's animation is decided in JS, by the shipped
     `reduceMotion` read of the platform query, and it stays there: adding a .ezcall- selector to
     the @media (prefers-reduced-motion) block would break the rule that every selector in it is
     an S98 class, and would move a mechanism this phase has no business moving.
     ===================================================================== */
  .ezcall{--ezcall-measure:880px;--ezcall-stage:720px}
  /* 1. THE TOP RAIL -- bounded and centred, ON the page rather than across it. */
  .ezcall-rail{flex-shrink:0;display:flex;justify-content:center;box-sizing:border-box;
    padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px))
      8px calc(12px + env(safe-area-inset-left,0px))}
  .ezcall-rail-inner{width:100%;max-width:var(--ezcall-measure);box-sizing:border-box;display:flex;
    align-items:center;gap:10px;min-height:52px;padding:5px 8px;background:var(--a3-surface);
    border:1px solid var(--a3-line);border-radius:20px 20px 13px 13px;box-shadow:var(--a3-shadow)}
  .ezcall-brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;
    font-family:var(--ez-ui-font);font-weight:800;font-size:16.5px;color:var(--a3-ink)}
  .ezcall-brand-arch{width:14px;height:18px;flex-shrink:0;border:2px solid var(--a3-blue);
    border-radius:60% 60% 12% 12%;border-bottom-color:transparent}
  .ezcall-brand-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ezcall-icon{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;padding:0;border-radius:12px;background:transparent;
    border:1px solid transparent;color:var(--a3-ink);cursor:pointer;font-family:inherit;line-height:1}
  .ezcall-icon:hover{background:var(--a3-ice)}
  .ezcall-icon:focus-visible{outline:3px solid var(--ez-focus);outline-offset:2px}
  /* 2. THE ROOM. The stage is centred in the space that is there rather than given a hero of
     its own, so a phone and a 2048px desk both open on a composition instead of a white field
     with something small in the middle of it. */
  .ezcall-body{flex:1;min-height:0;overflow-y:auto;box-sizing:border-box;display:flex;
    align-items:center;justify-content:center;
    padding:10px max(14px, calc((100% - var(--ezcall-measure)) / 2)) 14px}
  .ezcall-stage{width:100%;max-width:var(--ezcall-stage);box-sizing:border-box;display:flex;
    flex-direction:column;align-items:center;gap:10px;padding:26px 18px 22px;text-align:center;
    background:var(--a3-surface);border:1px solid var(--a3-line);
    border-radius:40px 40px 18px 18px;box-shadow:var(--a3-shadow)}
  /* on a desk the room breathes rather than leaving the panel a small card adrift in white --
     the same bounds, more air inside them. */
  @media (min-width:900px){.ezcall-stage{gap:14px;padding:40px 26px 34px}}
  .ezcall-note{max-width:420px;font-size:12px;line-height:1.6;color:var(--a3-muted)}
  /* the state marker. It is STRUCTURE -- the bar's width is what changes with the state, and
     the colour follows it; there is no gradient and nothing animates. */
  .ezcall-mark{width:34px;height:3px;border-radius:2px;background:var(--a3-line)}
  .ezcall-mark.is-listening{width:64px;background:var(--a3-cyan)}
  .ezcall-mark.is-thinking{width:20px;background:var(--a3-muted)}
  .ezcall-mark.is-speaking{width:46px;background:var(--a3-blue)}
  /* 3. THE DOCK -- in flow, bounded on the stage's own measure, so the two controls stay
     together in the middle of a wide display instead of drifting to its two edges. */
  .ezcall-dock{flex-shrink:0;display:flex;justify-content:center;box-sizing:border-box;
    padding:0 max(12px, calc((100% - var(--ezcall-measure)) / 2))
      calc(12px + env(safe-area-inset-bottom,0px))}
  .ezcall-dock-inner{width:100%;max-width:var(--ezcall-stage);box-sizing:border-box;display:flex;
    align-items:center;justify-content:center;gap:16px;padding:10px;background:var(--a3-surface);
    border:1px solid var(--a3-line);border-radius:13px 13px 20px 20px;box-shadow:var(--a3-lift)}
  .ezcall-btn:focus-visible{outline:3px solid var(--ez-focus);outline-offset:2px}
  .ezcall-alert{width:100%}
  /* ========================================================================
     S114 -- THE ISTANA SAVED ANSWERS.

     The favourites screen was a legacy strip header over a single 14px-padded column: one card
     under another, full width, on a 2048px desk as on a phone. It is a rail, a small masthead
     and a CATALOGUE now, all three bounded to one measure.

     WHY COLUMNS AND NOT A GRID. A saved reply is as tall as it is -- one is two lines, the next
     is a folded essay with a source card under it. A grid row either stretches every card to the
     tallest in that row or leaves a ragged band beneath the short ones, and the review named both
     ("دون بطاقات فارغة أو ممدودة"). CSS columns pack by height instead: each card keeps its own
     height, break-inside holds it whole, and the browser balances what is left. The column COUNT
     is the only thing the viewport decides.

     WHAT THIS BLOCK MAY NOT DO, and does not:
       * no background-image, no gradient, no repeat and no url() anywhere;
       * no selector can match html, body or :root -- every one is a .ezfav- class, and .ezfav-
         exists nowhere else in the file;
       * it draws no ::before / ::after and states no `content`;
       * it declares NO colour of its own. The root carries .ezhome, so every value is an a3
         token -- the idiom EzShell, the mushaf chrome, the chat and the call room already use.
     Nothing here reads, writes, orders or filters a record: this is where the cards SIT.
     ===================================================================== */
  .ezfav{--ezfav-measure:1100px}
  /* 1. THE TOP RAIL -- bounded, and it carries the screen's real back control, text and all. */
  .ezfav-rail{flex-shrink:0;display:flex;justify-content:center;box-sizing:border-box;
    padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px))
      8px calc(12px + env(safe-area-inset-left,0px))}
  .ezfav-rail-inner{width:100%;max-width:var(--ezfav-measure);box-sizing:border-box;display:flex;
    align-items:center;gap:10px;min-height:52px;padding:5px 8px;background:var(--a3-surface);
    border:1px solid var(--a3-line);border-radius:20px 20px 13px 13px;box-shadow:var(--a3-shadow)}
  .ezfav-back{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
    min-height:44px;padding:0 12px;border-radius:12px;background:transparent;
    border:1px solid transparent;color:var(--a3-ink);cursor:pointer;
    font-family:var(--ez-ui-font);font-size:15px;font-weight:700;line-height:1}
  .ezfav-back:hover{background:var(--a3-ice)}
  .ezfav-back:focus-visible{outline:3px solid var(--ez-focus);outline-offset:2px}
  .ezfav-brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;
    font-family:var(--ez-ui-font);font-weight:800;font-size:16.5px;color:var(--a3-ink)}
  .ezfav-brand-arch{width:14px;height:18px;flex-shrink:0;border:2px solid var(--a3-blue);
    border-radius:60% 60% 12% 12%;border-bottom-color:transparent}
  .ezfav-brand-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 2. THE COLUMN, and the small masthead that holds the one control this screen has. */
  .ezfav-wrap{width:100%;max-width:var(--ezfav-measure);margin:0 auto;box-sizing:border-box}
  .ezfav-masthead{display:flex;align-items:center;gap:12px;box-sizing:border-box;
    padding:12px 14px;margin:0 0 14px;background:var(--a3-ice);
    border:1px solid var(--a3-line);border-radius:34px 34px 16px 16px}
  .ezfav-crest{width:26px;height:32px;flex-shrink:0;box-sizing:border-box;
    border:2px solid var(--a3-blue);border-radius:60% 60% 14% 14%;border-bottom-color:transparent}
  .ezfav-mast-field{flex:1;min-width:0}
  /* 3. THE CATALOGUE. One column on a phone, two from a tablet, three from a desk. */
  .ezfav-cat{column-gap:14px}
  @media (min-width:760px){.ezfav-cat{column-count:2}}
  @media (min-width:1180px){.ezfav-cat{column-count:3}}
  .ezfav-card{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;
    margin:0 0 14px;overflow:hidden}
  /* the card is a HEAD, a reading body and a foot -- three bands with their own surfaces, not a
     padded box with a date floating at the top of it. */
  .ezfav-head{display:flex;align-items:center;gap:8px;padding:9px 14px;
    background:var(--a3-ice);border-bottom:1px solid var(--a3-line)}
  .ezfav-head-mark{width:11px;height:14px;flex-shrink:0;border:2px solid var(--a3-cyan);
    border-radius:60% 60% 12% 12%;border-bottom-color:transparent}
  .ezfav-read{padding:14px}
  .ezfav-foot{padding:10px 14px;border-top:1px solid var(--a3-line)}
  /* 4. THE EMPTY STATE -- a bounded composition, never a blank page. */
  .ezfav-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;min-height:52vh;padding:28px 16px;text-align:center}
  .ezfav-empty-crest{width:58px;height:70px;box-sizing:border-box;display:flex;
    align-items:center;justify-content:center;border:2px solid var(--a3-blue);
    border-bottom-color:var(--a3-line);border-radius:60% 60% 14% 14%;background:var(--a3-ice)}
  .ezfav-empty-in{width:15px;height:20px;box-sizing:border-box;border:2px solid var(--a3-cyan);
    border-radius:60% 60% 12% 12%;border-bottom-color:transparent}
  .ezfav-empty-text{max-width:420px;font-size:14.5px;line-height:1.9;color:var(--a3-muted)}
  /* ========================================================================
     S115 -- THE LAST FOUR SCREENS AND THE THREE BARRIERS.

     What is left of the pre-identity app: the boot screen, the first-run welcome, the parents'
     panel and its PIN gate, and the three barriers that stand in front of the chat and the call.
     They shared one legacy idiom -- a white card with a gradient button on a washed page, and a
     strip header borrowed from the dashboard -- and this block replaces it with three bounded
     istana vocabularies. Nothing about what any of them DOES is here: not a handler, not a
     condition, not a step, not a storage key, not a word.

     FOUR VOCABULARIES, deliberately separate rather than one shared blob:
       .ezload-  the boot mark
       .ezonb-   the first-run welcome
       .ezgate-  the card family: the two PIN gates, the three barriers, the two modals
       .ezparent- the parents' panel
     None of them can match html, body or :root, none attaches an image, a gradient or a repeat,
     none draws a ::before or ::after, and none states a colour of its own except the two scrims,
     which need an alpha no token carries. Colour comes from the a3 set, in scope because every
     root below carries .ezhome.
