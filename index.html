// ONE PIN sheet, reached from two places: selecting a locked depth tier, and entering the
// call. The PIN is typed, POSTed once and discarded -- only the returned token is kept.
//
// The child barrier (CHILD_VOICE_ENABLED / childVoiceBlocked) sits ABOVE this sheet in every
// caller, so a child profile gets the "being prepared" notice and is never even offered the
// chance to unlock. This sheet is not the lock either: api/unlock.js rate-limits attempts and
// api/ask.js ignores an unearned tier regardless of what the UI shows.
function UnlockSheet({ onUnlocked, onBack }) {
  const [pin, setPin] = useState('');
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (busy || !pin) return;
    setBusy(true); setMsg('');
    try {
      const r = await fetch('/api/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ pin, deviceId: getDeviceId() }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d && d.token) { storeFounderToken(d.token); setPin(''); onUnlocked(); return; }
      // The SERVER owns the wording. A wrong code, a day lockout and an unreachable store are
      // three different truths and only it knows which -- so show its message verbatim and
      // never an invented generic line.
      setMsg((d && d.message) || '');
    } catch (e) {
      // A network failure carries no server message; leave the sheet up rather than invent a
      // second copy of wording the server owns.
      setMsg('');
    }
    setPin(''); setBusy(false);
  };
  return (
    <div className="theme-dark ezhome ezgate" style={s.onboardingContainer}>
      <div className="ezgate-wrap"><div className="ezgate-card" style={s.onboardingCard}>
        <div className="ezgate-crest" aria-hidden="true"><span style={s.bigEmoji}>{'\uD83D\uDD10'}</span></div>
        <div style={s.onboardingTitle}>{'\u0627\u0644\u0631\u0645\u0632 \u0645\u0637\u0644\u0648\u0628'}</div>
        <div style={s.onboardingSubtitle}>{'\u0623\u062F\u062E\u0644 \u0631\u0645\u0632 \u0627\u0644\u0641\u062A\u062D \u0644\u0644\u0645\u062A\u0627\u0628\u0639\u0629.'}</div>
        <input type="password" inputMode="numeric" value={pin} onChange={(e) => setPin(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && submit()} placeholder="••••" autoFocus
          style={{ ...s.onboardingInput, textAlign: 'center', letterSpacing: '0.5em', borderColor: msg ? 'var(--a3-cyan)' : 'var(--a3-line)' }} />
        {msg && <div className="ezgate-err">{msg}</div>}
        <button onClick={submit} disabled={busy} style={{ ...s.primaryBtn, opacity: busy ? 0.5 : 1 }}>{'\u0641\u062A\u062D'}</button>
        <button onClick={onBack} style={s.secondaryBtn}>{'\u0631\u062C\u0648\u0639'}</button>
      </div></div>
    </div>
  );
}

function Onboarding({ onStart }) {
  const uiLang = useEzLang();
  const [name, setName] = useState('');
  const [birthYear, setBirthYear] = useState('');
  const [gender, setGender] = useState(null);
  const toLatinDigits = (str) => String(str || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  // Neutral age screen (step 4a): we ask the BIRTH YEAR — a fact with no "right" answer —
  // never "are you an adult?". Age is DERIVED from it and passed on unchanged; the band
  // thresholds and profile shape stay untouched (startChat re-derives the same birthYear).
  const CUR_YEAR = new Date().getFullYear();
  const yearNum = parseInt(toLatinDigits(birthYear), 10);
  const derivedAge = CUR_YEAR - yearNum;
  const ageValid = Number.isInteger(yearNum) && derivedAge >= 4 && derivedAge <= 99;
  const canStart = !!(name.trim() && gender && ageValid);
  // D92: the parental gate is NOT an entry condition for anyone. Onboarding hands the derived
  // age straight to startChat -- no arithmetic at boot, on the chat, or for a teen/adult profile
  // at any point. The gate itself is untouched and still stands at the one real boundary a child
  // profile can cross: an external URL leaving the app (see SourceCard).
  const requestStart = (n) => {
    onStart(name, n, gender);
  };
  const submit = () => { if (canStart) requestStart(derivedAge); };
  return (
    <div className="theme-dark ezhome ezonb" style={s.welcomeContainer}>
      <div style={s.welcomeInner}>
        <div className="ezonb-card" style={s.welcomeCard}>
        {/* S13.1b-welcome-single
            S115: the 88px red square became a bounded arch holding the SAME mark. Every field,
            every choice, their order, their validation and the single onStart call below are
            byte-for-byte the ones that shipped. */}
        {/* S116 -- the language choice, and this is the ONLY screen outside Settings that
            offers it. A reader who has not made a profile yet can switch before typing a
            thing; once the profile exists this card is never shown again, and Settings is
            where the choice lives from then on. */}
        <EzLangControl variant="onboarding" />
        <div className="ezonb-crest" style={s.welcomeLogoSquare}>
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="var(--a3-blue)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></svg>
        </div>
        <div style={s.welcomeTitle}>عزك</div>
        <div style={s.welcomeGreeting}>{ezT('onboarding.welcome')}</div>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="الاسم" {...(uiLang === 'ar' ? null : { placeholder: ezT('onboarding.name') })} style={s.welcomeInput} autoFocus />
        <div className="ezonb-row">
          <button onClick={() => setGender('male')} style={{ ...s.welcomePrimaryBtn, background: gender === 'male' ? 'var(--accent-fill)' : 'var(--a3-ice)', color: gender ==='male' ? 'var(--on-accent)' : 'var(--a3-ink)' }}>{ezT('onboarding.male')}</button>
          <button onClick={() => setGender('female')} style={{ ...s.welcomePrimaryBtn, background: gender === 'female' ? 'var(--accent-fill)' : 'var(--a3-ice)', color: gender ==='female' ? 'var(--on-accent)' : 'var(--a3-ink)' }}>{ezT('onboarding.female')}</button>
        </div>
        <input value={birthYear} onChange={(e) => setBirthYear(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') submit(); }} placeholder="سنة الميلاد — مثال ٢٠١٥" {...(uiLang === 'ar' ? null : { placeholder: ezT('onboarding.birthYear') })} type="text" inputMode="numeric" pattern="[0-9]*" maxLength={4} style={s.welcomeInput} />
        {birthYear.trim() && !ageValid && <div className="ezgate-err">{ezT('onboarding.yearError')}</div>}
        <button onClick={submit} disabled={!canStart} className="welcome-primary" style={{ ...s.welcomePrimaryBtn, opacity: canStart ? 1 : 0.4 }}>{ezT('onboarding.start')}</button>
        </div>
      </div>
    </div>
  );
}

function ParentGate({ pinInput, setPinInput, pinError, setPinError, onSuccess, onBack }) {
  // 'probing' يُعرَضُ كوضعِ تحقُّق: فشلٌ آمنٌ للإغلاق. تعذُّرُ سؤالِ الخادمِ لا يفتحُ بابَ الإنشاءِ أبدًا،
  // وإلا لكان قطعُ الشبكةِ طريقًا إلى وضعِ رمزٍ جديدٍ فوقَ لوحةِ أهلٍ قائمة.
  const [mode, setMode] = useState('probing');            // 'probing' | 'verify' | 'create'
  const [adultOk, setAdultOk] = useState(false);
  const [challenge] = useState(() => ({ a: 2 + Math.floor(Math.random() * 8), b: 2 + Math.floor(Math.random() * 8) })); // single digit, same as the welcome gate
  const [confirmPin, setConfirmPin] = useState('');
  const [busy, setBusy] = useState(false);
  const [errMsg, setErrMsg] = useState('رمز خاطئ');
  const fail = (msg) => { setErrMsg(msg); setPinError(true); setTimeout(() => setPinError(false), 1800); };
  useEffect(() => {
    let alive = true;
    (async () => {
      let serverHas = null;                               // null = لم نعرف ⇐ نُعامِلُه معاملةَ «عنده رمز»
      try {
        const r = await parentCodeCall({ action: 'status' });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d && typeof d.hasCode === 'boolean') serverHas = d.hasCode;
      } catch (e) {}
      // سجلٌّ في الخادمِ ⇐ البصمةُ القديمةُ لا معنى لها بعدَ اليوم، فتُمحى هنا لا بعدَ نجاحٍ فقط.
      if (serverHas === true) clearLegacyParentHash();
      // جهازٌ يحملُ بصمةً قديمةً ولا سجلَّ له ⇐ وضعُ تحقُّقٍ لتجريَ الهجرةُ الصامتة، لا وضعُ
      // إنشاءٍ يطلبُ رمزًا جديدًا من أهلٍ يحفظونَ رمزَهم.
      const needVerify = serverHas !== false || !!readLegacyParentHash();
      if (alive) setMode(needVerify ? 'verify' : 'create');
    })();
    return () => { alive = false; };
  }, []);
  const verify = async () => {
    if (busy || mode === 'probing') return;
    setBusy(true);
    try {
      const legacyHash = readLegacyParentHash();
      const r = await parentCodeCall(Object.assign({ action: 'verify', pin: pinInput }, legacyHash ? { legacyHash } : {}));
      const d = await r.json().catch(() => ({}));
      setBusy(false);
      if (r.ok && d && d.ok) { clearLegacyParentHash(); setPinInput(''); onSuccess(); return; }
      // الخادمُ يملكُ الصياغة: رمزٌ خاطئ، وقفلُ محاولاتِ اليوم، وتعذُّرُ التحقُّقِ ثلاثُ حقائقَ
      // مختلفة، وهو وحدَه يعرفُ أيَّها وقع — فتُعرَضُ رسالتُه كما هي.
      fail((d && d.message) || 'رمز خاطئ');
    } catch (e) {
      setBusy(false);
      // انقطاعُ الشبكةِ لا يحملُ رسالةَ خادم، ولومُ الأهلِ بـ«رمزٍ خاطئ» كذبٌ عليهم.
      fail('تعذّر التحقّق الآن. جرّب بعد قليل.');
    }
  };
  const create = async () => {
    if (busy) return;
    if (!/^[0-9]{4,}$/.test(pinInput)) return fail('اختر ٤ أرقام على الأقل');
    if (pinInput !== confirmPin) return fail('الرمزان غير متطابقان');
    setBusy(true);
    try {
      const r = await parentCodeCall({ action: 'set', pin: pinInput });
      const d = await r.json().catch(() => ({}));
      setBusy(false);
      if (r.ok && d && d.ok) { clearLegacyParentHash(); setConfirmPin(''); onSuccess(); return; }
      fail((d && d.message) || 'تعذّر الحفظ');
    } catch (e) { setBusy(false); fail('تعذّر الحفظ'); }
  };
  const hasPin = mode !== 'create';
  // D92: unchanged for a child profile -- this is a real boundary (the parents-only panel) and the
  // gate belongs here. An adult or teen profile setting its own PIN meets no arithmetic, per the
  // ruling that no teen or adult profile faces a challenge at any point.
  if (mode === 'create' && !adultOk && PARENTAL_GATE_ENABLED && childProfileActive()) return <AdultGate a={challenge.a} b={challenge.b} onPass={() => setAdultOk(true)} onCancel={onBack} />;
  return (
    <div className="theme-dark ezhome ezgate" style={s.onboardingContainer}>
      <div className="ezgate-wrap"><div className="ezgate-card" style={s.onboardingCard}>
        <div className="ezgate-crest" aria-hidden="true"><span style={s.bigEmoji}>🔒</span></div>
        <div style={s.onboardingTitle}>{hasPin ? 'لوحة الأهل' : 'إنشاء رمز لوحة الأهل'}</div>
        <div style={s.onboardingSubtitle}>{hasPin ? 'أدخل رمز الدخول' : 'اختر رمزاً من ٤ أرقام على الأقل — لن يُعرض، فاحفظه في مكان آمن'}</div>
        <input type="password" inputMode="numeric" value={pinInput} onChange={(e) => setPinInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && hasPin && verify()} placeholder="••••" style={{ ...s.onboardingInput, textAlign: 'center', letterSpacing: '0.5em', borderColor: pinError ? 'var(--a3-cyan)' : 'var(--a3-line)' }} autoFocus />
        {!hasPin && <input type="password" inputMode="numeric" value={confirmPin} onChange={(e) => setConfirmPin(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && create()} placeholder="أعد الرمز" style={{ ...s.onboardingInput, textAlign: 'center', letterSpacing: '0.5em', borderColor: pinError ? 'var(--a3-cyan)' : 'var(--a3-line)' }} />}
        {pinError && <div className="ezgate-err">{errMsg}</div>}
        {/* مُعطَّلٌ ريثما نعرفُ من الخادمِ أيَّ وضعٍ نحن فيه، وريثما يعودُ نداءٌ جارٍ: ضغطةٌ
            مزدوجةٌ على «دخول» محاولتان تُحسَبان على الجهازِ والعنوانِ معًا. */}
        <button onClick={hasPin ? verify : create} disabled={busy || mode === 'probing'} style={{ ...s.primaryBtn, opacity: (busy || mode === 'probing') ? 0.5 : 1 }}>{hasPin ? 'دخول' : 'حفظ الرمز'}</button>
        <button onClick={onBack} style={s.secondaryBtn}>رجوع</button>
      </div></div>
    </div>
  );
}

// قفل الإنفاق — مطالبةٌ بسيطة على نمط لوحة الأهل. تُقارَن بصمة SHA-256 للرمز المُدخَل
// بالثابت SPEND_GATE_SHA256؛ لا يُخزَّن الرمز نفسه أبداً. النجاح يفتح القفل ويُحفَظ لهذا الجهاز.
function SpendGate({ onUnlock, onExit }) {
  const [code, setCode] = useState('');
  const [err, setErr] = useState(false);
  const submit = async () => {
    try { if ((await hashPin(code)) === SPEND_GATE_SHA256) { onUnlock(); return; } } catch (e) {}
    setErr(true); setTimeout(() => setErr(false), 1800);
  };
  return (
    <div className="theme-dark ezhome ezgate" style={s.onboardingContainer}>
      <div className="ezgate-wrap"><div className="ezgate-card" style={s.onboardingCard}>
        <div className="ezgate-crest" aria-hidden="true"><span style={s.bigEmoji}>🔒</span></div>
        <div style={s.onboardingTitle}>رمز الدخول</div>
        <div style={s.onboardingSubtitle}>أدخل رمز الدخول لتفعيل المحادثة</div>
        <input type="password" inputMode="numeric" value={code} onChange={(e) => setCode(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && submit()} placeholder="••••" style={{ ...s.onboardingInput, textAlign: 'center', letterSpacing: '0.5em', borderColor: err ? 'var(--a3-cyan)' : 'var(--a3-line)' }} autoFocus />
        {err && <div className="ezgate-err">رمز خاطئ</div>}
        <button onClick={submit} style={s.primaryBtn}>دخول</button>
        <button onClick={onExit} style={s.secondaryBtn}>رجوع</button>
      </div></div>
    </div>
  );
}

// D88 -- the settings sheet. It carries .theme-dark itself so it is themed by the same scoped
// palette the chat uses; reached from the drawer's gear. The choice is written through
// applyTheme, the one code path that also runs at boot, and persisted immediately.

// ---- S105 ISTANA SHELL START --------------------------------------------------------------
// THE SHARED ISTANA SHELL. Presentation only, and deliberately empty of judgement: it owns no
// navigation state, reads no storage, holds no screen logic and invents no handler. A screen
// hands it a title, its OWN back handler and whatever action buttons it already had; the shell
// decides only where those sit and how wide the column is.
//
// The root carries .ezhome, which is what puts the --a3-* token set in scope for everything
// inside -- the same scope the home and the adhkar screens use, so a screen adopting the shell
// gets the identity and the dark palette without declaring a colour of its own.
function EzShell({ title, onBack, backLabel, actions, children }) {
  return (
    <div className="theme-dark ezhome" style={s.ezshContainer}>
      <div className="ezsh-nav">
        <div className="ezsh-nav-inner">
          <div className="ezsh-nav-side">
            {onBack ? (
              <button type="button" className="ezhome-focus" onClick={onBack} style={s.ezshNavBtn}
                aria-label={backLabel}>{A2_ICON_BACK}</button>
            ) : null}
          </div>
          <span className="ezsh-brand">
            <span className="ezsh-brand-arch" aria-hidden="true" />
            <span>{title}</span>
          </span>
          <div className="ezsh-nav-side is-end">{actions || null}</div>
        </div>
      </div>
      <div style={s.ezshScroll}>
        <div className="ezsh-wrap">{children}</div>
      </div>
    </div>
  );
}
// One group inside the shell: a heading, a bounded Iznik marker, the screen's own controls,
// and the hint the screen already showed. `wide` is the only layout choice a tenant makes.
function EzShellGroup({ title, hint, wide, children }) {
  return (
    <section className={wide ? 'ezsh-group is-wide' : 'ezsh-group'}>
      <div className="adhkar3" style={s.ezshGroup}>
        <div style={s.ezshGroupHead}>
          <span style={s.ezshGroupMark} aria-hidden="true" />
          <div style={s.settingsLabel}>{title}</div>
        </div>
        {children}
        {hint ? <div style={s.settingsHint}>{hint}</div> : null}
      </div>
    </section>
  );
}
// ---- S105 ISTANA SHELL END ----------------------------------------------------------------

// ============================================================
// SETTINGS -- الخصوصية والذكاء الاصطناعي
// ============================================================
// The permanent home of the consent decision, so a reader who agreed on day one can find, read
// and undo it on day two. Apple 5.1.1(i) requires the withdrawal to be as reachable as the grant.
const EZ_AIS_TITLE = 'الخصوصية والذكاء الاصطناعي';
const EZ_AIS_ON = 'الحالة: مُفعَّلة — تمت الموافقة على مشاركة البيانات مع خدمات الذكاء الاصطناعي.';
const EZ_AIS_OFF = 'الحالة: غير مفعَّلة — لم تتم الموافقة، ولا تُرسَل أيّ بيانات إلى خدمات الذكاء الاصطناعي.';
const EZ_AIS_BY_GUARDIAN = 'المُوافِق: ولي الأمر.';
const EZ_AIS_BY_USER = 'المُوافِق: المستخدم.';
// Same bidi lesson as the version line, seen in the same screenshot: a long Latin run inside an
// RTL sentence pushes the Arabic full stop to the paragraph's logical end, so the last line read
// ".Search". The vendor names are one LTR run and are isolated as one; the sentence keeps its
// Arabic label and drops the trailing stop, which had nowhere correct to sit.
const EZ_AIS_PROVIDERS_LABEL = 'الجهات:';
const EZ_AIS_PROVIDERS_NAMES = 'Anthropic (Claude) — ElevenLabs — Brave Search';
const EZ_AIS_PROVIDERS = EZ_AIS_PROVIDERS_LABEL + ' ' + EZ_AIS_PROVIDERS_NAMES;
const EZ_AIS_WITHDRAW = 'سحب الموافقة وإيقاف ميزات الذكاء الاصطناعي';
const EZ_AIS_REVIEW = 'مراجعة الموافقة وتشغيل ميزات الذكاء الاصطناعي';
const EZ_AIS_KEEP = 'سحب الموافقة يوقف الإرسال المستقبليّ فوراً، ولا يحذف محادثاتك المحفوظة على هذا الجهاز.';

function SettingsSheet({ theme, onTheme, onBack, onOpenControl, a11y, onA11y, onA11yReset, aiConsent, aiConsentBy, onWithdrawAI, onReviewAI }) {
  // S90 -- التحكم. The single row that leads to the parental area, and the ONLY thing left in
  // the app that opens the PIN gate. Everything above it -- the theme/dark choice and the
  // interface style -- is reached without a PIN, which is the whole point of this screen: a
  // parent's lock is not a lock on the appearance of the app. The label is built from escapes in
  // a JS expression, never a quoted JSX attribute, so the file stays ASCII-safe either side.
  const A_CONTROL = ezT('settings.control');
  // S105: the screen title and the appearance heading, lifted to constants so the shell and
  // the guard name the same strings the screen already showed.
  const A_SETTINGS = ezT('settings.title');
  const A_APPEARANCE = ezT('settings.appearance');   // U+0627 U+0644 U+062A U+062D U+0643 U+0645
  // D89: this entry is rendered ONLY while a valid founder token is held. hasFounderToken() is
  // read here, at render, and never from a cached flag -- the rule every other gate in this file
  // follows. It is a VISIBILITY rule, not the lock: api/unlock.js refuses a set-pin call that
  // arrives without a token no matter what this UI chooses to draw.
  const canSetPin = hasFounderToken();
  // Read ONCE, at mount, from the one reader -- the same rule pin1/pin2 below follow. The value
  // only ever changes through applyWatermarkOpacity, so what is on screen, what is on the
  // document root and what is in the store cannot disagree.
  const [wmOpacity, setWmOpacity] = useState(readWatermarkOpacity);
  // Read once at mount from the one reader, written through the one writer -- the watermark
  // rule exactly. The switch shows the RESOLVED behaviour, so an `auto` device shows the
  // state it is actually in rather than a third word the reader never chose.
  const [enterPref, setEnterPref] = useState(readEnterPref);
  const enterIsTouch = ezikComposerIsTouch();
  const enterSendsNow = ezikEnterSends(enterPref, enterIsTouch);
  const [pin1, setPin1] = useState('');
  const [pin2, setPin2] = useState('');
  const [pinMsg, setPinMsg] = useState('');
  const [pinBusy, setPinBusy] = useState(false);
  const savePin = async () => {
    if (pinBusy) return;
    // The ONLY check made here, because the server is sent one value and never sees the second
    // field. Length, shape and authorisation are the server's to judge and the server's to word.
    if (pin1 !== pin2) { setPinMsg(ezT('pin.mismatch')); return; }
    setPinBusy(true); setPinMsg('');
    try {
      const r = await fetch('/api/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...capHeaders() },   // carries the founder token
        credentials: 'same-origin',
        body: JSON.stringify({ action: 'set-pin', pin: pin1, deviceId: getDeviceId() }),
      });
      const d = await r.json().catch(() => ({}));
      const good = r.ok && d && d.ok === true;
      // The SERVER owns every refusal's wording: a missing token, a short code and an
      // unreachable store are three different truths and only it knows which.
      setPinMsg(good ? ezT('pin.changed') : ((d && d.message) || ''));
      if (good) { setPin1(''); setPin2(''); }
    } catch (e) {
      setPinMsg('');   // a network failure carries no server message; do not invent one
    }
    setPinBusy(false);
  };
  const Opt = ({ value, label }) => (
    <button
      onClick={() => onTheme(value)}
      aria-pressed={theme === value}
      style={{ ...s.themeOpt, ...(theme === value ? s.themeOptActive : {}) }}
    >
      <span style={{ ...s.themeSwatch, background: value === 'dark' ? '#171B24' : '#FFFFFF', borderColor: value === 'dark' ? '#2A313D' : '#E5EBF5' }} />
      <span>{label}</span>
    </button>
  );
  // S102 -- THE ACTIVE APPLICATION DESIGN. This is a STATEMENT, not a chooser: there is one
  // reachable design in this correction stage, so there is no radiogroup, no aria-checked, no
  // click handler and nothing focusable here. qibla_13 appears once, as a disabled line that
  // says it is coming -- it is a <div>, it is aria-disabled, it cannot be tabbed to and there
  // is no code path from this card that could write it. Journey and Deck appear nowhere.
  const visualTheme = useEzikVisualTheme();
  return (
    <EzShell title={A_SETTINGS} onBack={onBack} backLabel={A2_BACK}>
      {/* S105 -- the SAME controls, the same handlers, the same keys and the same accessible
          names as before; what changed is that they sit in bounded groups inside the shared
          shell instead of five full-width slabs. Not one control was simplified away. */}
      <div className="ezsh-grid">
        <EzShellGroup title={A_APPEARANCE} hint={ezT('settings.savedOnDevice')}>
          <div style={s.themeRow}>
            <Opt value="light" label={ezT('settings.themeLight')} />
            <Opt value="dark" label={ezT('settings.themeDark')} />
          </div>
        </EzShellGroup>
        {/* S116 -- the interface language. ONE compact row inside the shell every other
            setting uses: the group's own heading is the label, and the control sits at the
            inline end showing the current choice. No second design, no pair of full-width
            buttons, and the theme, the reading preferences and the control row are untouched. */}
        <EzShellGroup title={ezT('settings.language')}>
          <div className="ezlang-row"><EzLangControl variant="settings" /></div>
        </EzShellGroup>
        {/* S102 -- the active application design. One statement, one disabled line. */}
        <EzShellGroup title={EZ_VT_TITLE}>
          {visualTheme === EZIK_VISUAL_THEME_ISTANA && (
          <div style={s.vtActiveRow}>
            <span style={s.vtActiveMark} aria-hidden="true" />
            <span style={s.vtActiveBody}>
              <span style={s.vtActiveName}>{EZ_VT_ISTANA}</span>
              <span style={s.vtActiveState}>{EZ_VT_ACTIVE}</span>
            </span>
          </div>
          )}
          <div style={s.vtSoonRow} aria-disabled="true">
            <span style={s.vtSoonName}>{EZ_VT_QIBLA}</span>
            <span style={s.vtSoonTag}>{EZ_VT_SOON}</span>
          </div>
        </EzShellGroup>
        {/* S99 -- the three accessibility preferences, byte-for-byte the controls that shipped:
            same roles, same aria-checked, same handlers, same profile-scoped writes. */}
        {/* NOT wide: measured at 1440 and 2048, spanning both columns stretched each switch
            row to about 800px with the label at one edge and the toggle at the other. A settings
            row read across a desk is a worse control, not a bigger one. */}
        <EzShellGroup title={EZIK_A11Y_TITLE} hint={ezT('settings.savedOnDevice')}>
          <div style={s.a11yGroupLabel}>{EZIK_A11Y_FS_LABEL}</div>
          <div style={s.themeRow} role="radiogroup" aria-label={EZIK_A11Y_FS_LABEL}>
            {[['normal', EZIK_A11Y_FS_NORMAL], ['large', EZIK_A11Y_FS_LARGE], ['xlarge', EZIK_A11Y_FS_XLARGE]].map(([v, label]) => (
              <button
                key={v}
                type="button"
                role="radio"
                aria-checked={a11y.fontSize === v ? 'true' : 'false'}
                onClick={() => onA11y({ fontSize: v })}
                className="ez-a11y-opt"
                style={{ ...s.a11yOpt, ...(a11y.fontSize === v ? s.themeOptActive : {}) }}
              >
                {label}
              </button>
            ))}
          </div>
          <button
            type="button"
            role="switch"
            aria-checked={a11y.reading ? 'true' : 'false'}
            onClick={() => onA11y({ reading: !a11y.reading })}
            className="ez-a11y-opt"
            style={s.a11ySwitchRow}
          >
            <span style={s.a11ySwitchText}>
              <span style={s.a11ySwitchTitle}>{EZIK_A11Y_READ}</span>
              <span style={s.a11ySwitchHint}>{EZIK_A11Y_READ_HINT}</span>
            </span>
            <span style={{ ...s.a11ySwitch, ...(a11y.reading ? s.a11ySwitchOn : {}) }} aria-hidden="true">
              <span style={{ ...s.a11yKnob, ...(a11y.reading ? s.a11yKnobOn : {}) }} />
            </span>
          </button>
          <button
            type="button"
            role="switch"
            aria-checked={a11y.reduceMotion ? 'true' : 'false'}
            onClick={() => onA11y({ reduceMotion: !a11y.reduceMotion })}
            className="ez-a11y-opt"
            style={s.a11ySwitchRow}
          >
            <span style={s.a11ySwitchText}>
              <span style={s.a11ySwitchTitle}>{EZIK_A11Y_MOTION}</span>
              <span style={s.a11ySwitchHint}>{EZIK_A11Y_MOTION_HINT}</span>
            </span>
            <span style={{ ...s.a11ySwitch, ...(a11y.reduceMotion ? s.a11ySwitchOn : {}) }} aria-hidden="true">
              <span style={{ ...s.a11yKnob, ...(a11y.reduceMotion ? s.a11yKnobOn : {}) }} />
            </span>
          </button>
          <button type="button" onClick={onA11yReset} className="ez-a11y-opt" style={s.a11yReset}>{EZIK_A11Y_RESET}</button>
        </EzShellGroup>
        {/* WHAT `Enter` DOES. One switch over the one preference, and it writes an EXPLICIT
            word: flipping it stores send/newline rather than leaving the device to be asked
            again. The hint line states the rule in full, including the half that is not
            negotiable -- an Enter the keyboard is using to finish a word never sends. */}
        <EzShellGroup title={ezT('settings.enter')} hint={ezT('settings.savedOnDevice')}>
          <button
            type="button"
            role="switch"
            aria-checked={enterSendsNow ? 'true' : 'false'}
            onClick={() => setEnterPref(writeEnterPref(enterSendsNow ? 'newline' : 'send'))}
            className="ezik-focus"
            style={s.a11ySwitchRow}
          >
            <span style={s.a11ySwitchText}>
              <span style={s.a11ySwitchTitle}>{ezT('settings.enter.sends')}</span>
              <span style={s.a11ySwitchHint}>{enterSendsNow ? ezT('settings.enter.sendsHint') : ezT('settings.enter.newlineHint')}</span>
            </span>
            <span style={{ ...s.a11ySwitch, ...(enterSendsNow ? s.a11ySwitchOn : {}) }} aria-hidden="true">
              <span style={{ ...s.a11yKnob, ...(enterSendsNow ? s.a11yKnobOn : {}) }} />
            </span>
          </button>
        </EzShellGroup>
        {/* THE WATERMARK'S STRENGTH. Three presets and a fine slider over the SAME number, so
            there is one value and not two: a preset writes 0.2 / 0.5 / 0.8 and the slider writes
            anything between; whichever moved last is what both controls then show. It is applied
            LIVE by writing --ezwm-o on the document root, and persisted per device by the one
            writer above -- this screen owns no copy of the value and reads the store once, at
            mount, exactly as the sheet's other local state does. Nothing here is sent anywhere.
            The buttons deliberately reuse the reading-preference option styling rather than
            adding a colour of their own; the group sits AFTER the reading preferences, which is
            also what keeps it outside the region the visual-identity gate reads. */}
        <EzShellGroup title={ezT('settings.watermark')} hint={ezT('settings.savedOnDevice')}>
          <div style={s.themeRow} role="radiogroup" aria-label={ezT('settings.watermark')}>
            {[[EZIK_WM_PRESETS[0], ezT('settings.watermark.light')],
              [EZIK_WM_PRESETS[1], ezT('settings.watermark.medium')],
              [EZIK_WM_PRESETS[2], ezT('settings.watermark.bold')]].map(([v, label]) => (
              <button
                key={v}
                type="button"
                role="radio"
                aria-checked={wmOpacity === v ? 'true' : 'false'}
                onClick={() => setWmOpacity(applyWatermarkOpacity(v))}
                className="ezik-focus"
                style={{ ...s.a11yOpt, ...(wmOpacity === v ? s.themeOptActive : {}) }}
              >
                {label}
              </button>
            ))}
          </div>
          <div style={s.a11yGroupLabel}>{ezT('settings.watermark.fine')}</div>
          <input
            type="range"
            min={EZIK_WM_MIN}
            max={1}
            step={0.01}
            value={wmOpacity}
            onChange={(e) => setWmOpacity(applyWatermarkOpacity(e.target.value))}
            aria-label={ezT('settings.watermark.fine')}
            className="ezik-focus"
            style={s.wmSlider}
          />
        </EzShellGroup>
        {/* الخصوصية والذكاء الاصطناعي -- the consent decision, stated and reversible. It is NOT
            behind the PIN gate: a reader must be able to withdraw without an adult's code, and
            Apple requires the withdrawal to be as reachable as the grant. */}
        <EzShellGroup title={EZ_AIS_TITLE}>
          <div style={s.aicStatusRow}>{aiConsent === EZ_AI_CONSENT_GRANTED ? EZ_AIS_ON : EZ_AIS_OFF}</div>
          {aiConsent === EZ_AI_CONSENT_GRANTED && (
            <div style={s.aicNote}>{aiConsentBy === 'guardian' ? EZ_AIS_BY_GUARDIAN : EZ_AIS_BY_USER}</div>
          )}
          <div style={s.aicNote}>{EZ_AIS_PROVIDERS_LABEL + ' '}<span style={s.aicProvider}>{EZ_AIS_PROVIDERS_NAMES}</span></div>
          <AIConsentVersion style={s.aicNote} />
          <AIConsentLinks />
          {aiConsent === EZ_AI_CONSENT_GRANTED
            ? (<>
                <button type="button" onClick={onWithdrawAI} style={s.aicWithdrawBtn}>{EZ_AIS_WITHDRAW}</button>
                <div style={s.aicNote}>{EZ_AIS_KEEP}</div>
              </>)
            : <button type="button" onClick={onReviewAI} style={s.aicWithdrawBtn}>{EZ_AIS_REVIEW}</button>}
        </EzShellGroup>
        {/* S90 -- the one row that opens the PIN gate. Same handler, same accessible name. */}
        <EzShellGroup title={A_CONTROL}>
          <button type="button" onClick={onOpenControl} style={s.settingsNavBtn} aria-label={A_CONTROL}>
            <span>{A_CONTROL}</span>
            <span style={s.settingsNavChev} aria-hidden="true">{'\u2039'}</span>
          </button>
        </EzShellGroup>
        {/* D89 -- change the unlock PIN. Rendered ONLY with a founder token in hand. */}
        {canSetPin && (
        <EzShellGroup title={ezT('pin.groupTitle')}>
          <input type="password" inputMode="numeric" autoComplete="new-password" value={pin1}
            onChange={(e) => setPin1(e.target.value)} placeholder={ezT('pin.new')} style={s.settingsInput} />
          <input type="password" inputMode="numeric" autoComplete="new-password" value={pin2}
            onChange={(e) => setPin2(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') savePin(); }}
            placeholder={ezT('pin.confirm')} style={s.settingsInput} />
          {pinMsg && <div style={s.settingsMsg}>{pinMsg}</div>}
          <button onClick={savePin} disabled={pinBusy || !pin1 || !pin2}
            style={{ ...s.settingsSaveBtn, opacity: (pinBusy || !pin1 || !pin2) ? 0.5 : 1 }}>{ezT('common.save')}</button>
        </EzShellGroup>
        )}
      </div>
    </EzShell>
  );
}

// Live call screen (Layer 2 — one automatic turn; presentational, driven by App state)

// callState is owned by App and driven by real audio events (tap → listening → thinking →

function CallScreen({ profileName, gender, callState, heard, isMuted, error, onToggleMute, onTalk, onExit }) {
  // Accessibility: respect reduced-motion — fall back to a static (non-pulsing) ring.
  const reduceMotion = (typeof window !== 'undefined' && window.matchMedia)

  // S113: the four labels are the ones that shipped. They were COMPUTED and never drawn -- `cs`

  // state title below is that shipped label, rendered; it is not a new string and it is never a

  const STATES = {
    idle:      { label: 'اضغط للتحدّث',       ring: 'var(--a3-line)',  speed: '3.6s' },
    listening: { label: 'أستمع إليك...',     ring: 'var(--a3-cyan)',  speed: '2.4s' },

  // Layer 3: the avatar stays tappable while the tutor is thinking/speaking — tapping there is the
  // manual interrupt ("my turn"). Disabled only when muted, or during 'listening' (no-op as before).
  const canTalk = !isMuted && (callState === 'idle' || callState === 'thinking' || callState === 'speaking');
  // The one line under the emblem, and it is the SAME line that shipped: the interim transcript
  // while actually listening, or the muted notice. It is rendered only when it has something to
  // say, so an idle call shows the state instead of an empty band. Nothing that was hidden for
  // privacy is revealed by it -- the condition is byte-for-byte the shipped one.
  const hint = callState === 'listening' && heard ? heard : (isMuted ? CALL_TXT.MUTED_HINT : '');

  return (
    <div className="theme-dark ezhome ezcall" style={s.callContainer}>
      {/* S113 -- THE TOP RAIL. Bounded and centred, carrying the screen's own name and the REAL
          way out: onExit, the same handler the «إنهاء» control below has always called, which
          resolves through goEzikBack. No handler was invented and none was removed. */}

            <div style={ringStyle} />
            <div style={s.callAvatar}><MoonStarsIcon size={56} color="var(--a3-blue)" /></div>
          </div>
          {/* THE REAL STATE, said out loud: جاهز / يستمع / يفكر / يتحدّث, straight off callState. */}
          <div style={s.callStatusLabel}>{cs.label}</div>
          <span className={'ezcall-mark is-' + callState} aria-hidden="true" />
          {profileName && <div style={s.callSubLabel}>{profileName}</div>}

          {hint ? <div style={s.callHint}>{hint}</div> : null}
          <div className="ezcall-note">{CALL_TXT.DISCLAIMER}</div>

              It keeps its own bounded panel inside the stage, and says exactly what it always said. */}
          {error ? <div style={s.callErrorBanner} className="ezcall-alert" role="alert">{error}</div> : null}

const MEM = {

  PICKER_HEADING: 'اختر سورةً لتبدأ الحفظ',

  REVEAL_LABEL: 'الكشف',

/* 14.1 */
// Standalone mushaf reader. NOT part of MemorizeScreen -- separate tile, separate screen.
// Reuses SurahCard verbatim: it already loads the mushaf, sources the basmalah from
// getVerseText(1,1) (never hand-written), skips it for al-Fatiha (it IS ayah 1) and
// at-Tawbah (it has none), stamps every ayah with U+06DD + its Arabic-Indic number, and
// carries the full-surah recitation button. No new Quran-text path is introduced here.
/* 14.2 */
// صفحةٌ واحدةٌ من المصحف. كلُّ خانةٍ في التخطيط تُجلب كلمتَها من المصحف المحروس.
/* 14.2f2 */
// ضبطُ السطر — وهو ما يجعل الصفحة مصحفاً لا نصّاً.
// كلُّ كلمةٍ عنصرُ flex مستقلّ، و justify-content:space-between يفرد ما بينها حتى
// يمتدّ السطرُ من حافةٍ لحافة. وكان لنا حجمٌ واحدٌ للصفحة يُقاس بأضيقِ سطرٍ فيها،
// فيَنقُص ما سواه عن عرضه ويُملأ الفارقُ فراغاً. الآن لكلِّ سطرٍ حجمُه: يفي بعرضه
// بحروفه لا بفراغه، والتفاوتُ بين أسطر الصفحة محصورٌ بـ+١٨٪ فوق أصغرها — فلا
// يصغر سطرٌ عمّا كان، ولا تتبعثر الصفحة. ولا يلتفّ سطرٌ أبداً، ولا يُقصّ حرف.
// القياس يجري قبل الرسم (useLayoutEffect) فلا تُرى قفزة. ولو فشل القياس لأيّ
// سبب، نرسم بحجم الأساس — مقروءاً. لا نُخفي المصحف أبداً.
const PG_BASE_FS = 22;    // حجمُ القياس. النتيجة تُشتقّ منه ولا يُستعمل كما هو.
const PG_GAP_EM = 0.22;   // أدنى فجوةٍ بين كلمتين، نسبةً للخطّ (تكبر وتصغر معه)
const PG_LINE_H = 1.75;   // ارتفاعُ السطر. يدخل في حساب السقف الرأسيّ وفي النمط معاً.
// خطُّ المصحف في موضعٍ واحد: يستعمله النمطُ المرسوم والقياسُ الخفيّ معاً. لو افترقا
// بحرفٍ لقِسنا خطّاً ورسمنا آخر، وسقط الثابتُ العالميّ كلُّه بصمت. لا خطَّ جديداً هنا.
const PG_FONT = "'Amiri Quran', 'Amiri', serif";

/* Session 51 -- ONE font size for all 604 pages.
 * ---------------------------------------------------------------------------
 * الحجمُ كان يُشتقّ من أضيق سطرٍ *داخل الصفحة الواحدة*، فاختلف من صفحةٍ لصفحة:
 * النساء ٧٩ كبيرةٌ والتين ٥٩٧ صغيرة. والمصحفُ المطبوع حجمُه واحدٌ في الـ٦٠٤.
 * فصار المقياسُ عالمياً: أعرضُ أسطر المصحف كلِّه تُقاس مرّةً واحدة، ومنها ثابتٌ
 * واحد K يحكم كلَّ صفحة. القياسُ مرّةٌ لكلّ جلسةٍ (ولكلّ عرضِ حاوية)، لا مرّةً
 * لكلّ صفحة: فتحُ صفحةٍ لا يقيس مئةً وخمسين سطراً، بل يقرأ K المخزَّن.
 */
const PG_CAND_N = 150;    // عددُ المرشّحين. ١٥٠ لا ٤٠: تقديرُ المحارف تقريبيٌّ للعربية
const PG_AVG_CH = 0.5;    // عرضُ المحرف الوسطيّ بالـem — لتحويل الفجوة إلى «محارف»
let PG_K = null;          // الثابتُ العالميّ: أكبرُ تكبيرٍ يسعه أعرضُ سطرٍ في المصحف
let PG_K_BOX = 0;         // العرضُ الذي قيس عنده. اختلافُه ⟹ إبطالٌ وإعادةُ قياس
let PG_K_MS = 0;          // كلفةُ القياس الأولى بالمللي ثانية — للتقرير لا للمنطق
const PG_GUARD_PAGES = new Set();   // صفحاتٌ اضطرّ فيها حارسُ الفيض لتصغيرٍ خاصّ

// العلاماتُ لا تُقدّم القلم، فلا تدخل في كلفة السطر. (الحركاتُ · الصغرى · علاماتُ الوقف)
const pgAdvChars = (t) => {
  let n = 0;
  for (const ch of t) {
    const u = ch.codePointAt(0);
    if (!((u >= 0x064b && u <= 0x065f) || u === 0x0670 || (u >= 0x06d6 && u <= 0x06ed))) n++;
  }
  return n;
};

// خاناتُ السطر ← ما يُرسم فيه فعلاً. مصدرٌ واحدٌ للتصيير وللقياس معاً: لو افترقا
// لقِسنا سطراً غيرَ الذي نرسم. كلُّ حرفٍ من __quranData وحده — لا نصَّ بأيدينا.
const pgLineTokens = (ln) => {
  const parts = [];
  if (!ln || !ln.w) return parts;
  for (const loc of ln.w) {
    const a = loc.split(':');
    const sn = parseInt(a[0], 10), an = parseInt(a[1], 10), wi = parseInt(a[2], 10);
    const words = wordsOfAyah(sn, an);
    const w = words[wi - 1];
    if (w === undefined) continue;                 // لا يقع — ٧٧٤٢٩/٧٧٤٢٩ مبرهَنة
    parts.push(w);
    if (wi === words.length) parts.push('۝' + toArabicDigits(an));  // آخرُ كلمةٍ ← رقمُ الآية
  }
  return parts;
};

// (أ) المرشّحون — من البيانات وحدها، بلا DOM. كلفةُ السطر = محارفُه ذواتُ العرض
// زائدَ فجواتِه محسوبةً بالمحارف. تقديرٌ تقريبيّ يُرتّب فقط؛ الحكمُ للقياس الحقيقيّ
// بعده، ولذا نأخذ ١٥٠ لا الأعرضَ وحده: خطأُ الترتيب يُبتلع في الهامش.
let __pgCands = null;
const pgCandidates = () => {
  if (__pgCands) return __pgCands;
  if (!__layoutData || !__layoutData.p || !__quranData) return null;
  const gapCh = PG_GAP_EM / PG_AVG_CH;
  const all = [];
  for (const pg of __layoutData.p) {
    for (const ln of pg.l) {
      if (ln.t !== 't') continue;
      const parts = pgLineTokens(ln);
      if (!parts.length) continue;
      let cost = (parts.length - 1) * gapCh;
      for (const p of parts) cost += pgAdvChars(p);
      all.push({ cost, parts });
    }
  }
  if (!all.length) return null;
  all.sort((a, b) => b.cost - a.cost);
  __pgCands = all.slice(0, PG_CAND_N).map((x) => x.parts);
  return __pgCands;
};

// (ب) القياسُ الحقيقيّ — مرّةً واحدة. المرشّحون يُصيَّرون خارج الشاشة بعرض الصفحة
// نفسِه وبأنماط السطر والكلمة نفسِها وبحجم الأساس، فيؤخذ أضيقُ نسبةٍ فيهم.
// خارج الشاشة لا مخفيّاً بـdisplay:none — المخفيُّ لا يُقاس أصلاً.
const pgMeasureK = (box) => {
  if (PG_K !== null && PG_K_BOX === box) return PG_K;
  if (!(box > 0) || typeof document === 'undefined') return null;
  const cands = pgCandidates();
  if (!cands) return null;
  const t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  const host = document.createElement('div');
  host.setAttribute('aria-hidden', 'true');
  host.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none;width:' + box + 'px;';
  const rows = [];
  for (let i = 0; i < cands.length; i++) {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-direction:row;align-items:baseline;justify-content:space-between;width:100%;direction:rtl;white-space:nowrap;line-height:' + PG_LINE_H + ';font-size:' + PG_BASE_FS + 'px;font-family:' + PG_FONT + ';';
    const parts = cands[i];
    for (let j = 0; j < parts.length; j++) {
      const sp = document.createElement('span');
      sp.style.cssText = 'flex-shrink:0;white-space:nowrap;';
      sp.textContent = parts[j];
      row.appendChild(sp);
    }
    host.appendChild(row);
    rows.push(row);
  }
  document.body.appendChild(host);
  let k = Infinity;
  try {
    for (let i = 0; i < rows.length; i++) {
      const kids = rows[i].children;
      if (!kids.length) continue;
      let content = 0;
      for (let j = 0; j < kids.length; j++) content += kids[j].offsetWidth;
      content += (kids.length - 1) * (PG_BASE_FS * PG_GAP_EM);
      if (content > 0) { const r = box / content; if (r < k) k = r; }
    }
  } finally {
    if (host.parentNode) host.parentNode.removeChild(host);
  }
  if (!isFinite(k) || !(k > 0)) return null;
  PG_K = k;
  PG_K_BOX = box;
  PG_K_MS = ((typeof performance !== 'undefined' && performance.now) ? performance.now() : 0) - t0;
  return k;
};

// إبطالٌ صريح: تدويرُ الشاشة (تغيّرُ العرض) أو وصولُ الخطّ بعد قياسٍ بخطٍّ بديل.
// كلاهما يجعل K المخزَّن كذباً — والكذبُ هنا يعمّ الـ٦٠٤ لا صفحةً واحدة.
const pgInvalidateK = () => { PG_K = null; PG_K_BOX = 0; PG_GUARD_PAGES.clear(); };
// نافذةُ فحصٍ للمالك وحدها: قراءةٌ محضة، لا يقرأها منطقُ التطبيق ولا يتفرّع عليها.
try { window.__mushafFit = { k: () => PG_K, box: () => PG_K_BOX, ms: () => PG_K_MS, guard: () => Array.from(PG_GUARD_PAGES) }; } catch (e) {}

/* 14.6 */
// Session 74 -- PHASE ONE: the official Madinah mushaf page, drawn as one image.
// Session 76 -- PUBLISHED: this is now what a first-time visitor sees.
// ---------------------------------------------------------------------------
// ON BY DEFAULT. A device that has never touched the key gets the official page, and that
// single line is the whole of what session 76 changed. The escape did not move: opening
// the app with ?mushafsvg=0 writes '0' to the key and that device keeps the text reader
// for good. When the flag is off MushafSheet returns <MushafPage> with the same four
// props and nothing else happens: no image element, no request, no style, no prefetch.
//
// Phase one is a STILL PAGE. No ayah tap, no highlight, no selection, no audio. An <img>

    let guard = Infinity;
    for (let r = 0; r < rows.length; r++) {
      const kids = rows[r].children;
      const b = rows[r].clientWidth;
      if (!b || !kids.length) continue;
      let content = 0;
      for (let k = 0; k < kids.length; k++) content += kids[k].offsetWidth;
      content += (kids.length - 1) * (PG_BASE_FS * PG_GAP_EM);
      if (!(content > 0)) continue;
      const f = PG_BASE_FS * (b / content);
      if (f < guard) guard = f;
    }
    if (isFinite(guard) && guard > 0) {
      const g = Math.max(8, Math.min(40, Math.floor(guard * 0.99)));
      if (g < uni) { uni = g; PG_GUARD_PAGES.add(page.n); }
    }
    // (د) الملاءمة الرأسيّة: مجموعُ الأسطر بالحجم الواحد، مضافاً إليه ارتفاعُ ما ليس
    // سطراً (رأسٌ · بسملةٌ · فاصل) كما قيس من الـDOM. فإن فاض ضُرب الحجمُ بنسبةٍ
    // واحدة — والصفحةُ تصغر معاً ولا ينكسر تناسبُها.
    const kidsPage = el.children;
    let otherH = 0;
    for (let c = 0; c < kidsPage.length; c++)
      if (!kidsPage[c].hasAttribute('data-l')) otherH += kidsPage[c].offsetHeight;
    const room = el.clientHeight;
    const total = rows.length * uni * PG_LINE_H * 1.06 + otherH;
    if (room > 0 && total > room)
      uni = Math.max(8, Math.min(40, Math.floor(uni * (room / total) * 0.99)));
    // (هـ) الفائضُ الرأسيّ — كما استقرّ في c4393fe بلا تغيير في جوهره. الحجمُ يُقاس
    // بالعرض وحده، فيبقى في الطول فائضٌ في أكثر الصفحات. توزيعُه فراغاً يبعثر السطور،
    // وتكويمُه فوق وتحت يترك الإطارَ خاوياً — والوجهُ استهلاكُه: يرتفع تباعدُ السطر
    // وحدَه حتى يملأ النصُّ إطارَه، ولا يُمَسّ الحجم.
    // السقفُ ٢٫٠× قاطعٌ — رُفع من ١٫٥× في ١٤٫٥. الورقةُ لمّا صارت تملأ خانتَها اتّسع
    // ما تحتها من فائض، وكان السقفُ القديم يردُّه فراغاً مكوَّماً داخل الإطار؛ فرفعُه
    // يصرفه تباعداً بين السطور. ولا يُجاوز ٢٫٠ بحال: بلا سقفٍ تنفرط الصفحةُ الشحيحة —
    // سطران في خانةٍ كاملة — إلى سطرين متباعدين لا يُقرآن نصّاً واحداً.
    // avail يطرح حشوةَ الصفحة، بخلاف room أعلاه: زيادةُ التباعد لا تصغّر حجماً، أمّا
    // مسُّ room فيغيّر ما تحكم به الملاءمةُ الرأسيّة.
    let lead = PG_LINE_H;
    let pad = 0;
    try {
      const cs = window.getComputedStyle(el);
      pad = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    } catch (e) { pad = 0; }
    const avail = room - pad;
    const textH = rows.length * uni * PG_LINE_H * 1.06 + otherH;
    if (avail > 0 && textH > 0 && textH < avail) lead = Math.min(PG_LINE_H * 2.0, PG_LINE_H * (avail / textH));
    // البسملةُ تتبع الحجمَ الواحد — ولم يعد ثَمَّ وسيطٌ تتبعه، فالأسطرُ كلُّها سواء.
    setFit({ uni, lead, basmala: Math.round(uni * 0.92) });
  }, [fit]);

  // قبل القياس تُرسم الصفحة كلُّها بحجم الأساس مفرودةً — وهي حالةُ القياس نفسها.
  const basmalaFs = fit ? fit.basmala : Math.round(PG_BASE_FS * 0.92);
  const out = [];
  const done = {};   /* 14.2f4 */  // رأسٌ حُقن لهذه السورة على هذه الصفحة — فلا يُحقن مرّتين
  for (let i = 0; i < page.l.length; i++) {
    const ln = page.l[i];
    if (ln.t === 't') {
      // سطرٌ يفتتح سورةً بلا بسملةٍ في المصدر (٨١ و٨٥) ← الرأسُ ثمّ البسملةُ فوقه.
      // أمّا السور التي للمصدر بسملتُها (١٠ و٨٢ و٨٦) فرأسُها يُحقن عند سطر البسملة
      // نفسِه، فوقَه — لا هنا. وإلّا نزل الرأسُ تحت البسملة، وانقلب ترتيبُ المصحف.
      const op = ln.w[0].split(':');
      if (op[1] === '1' && op[2] === '1') {
        const sn0 = parseInt(op[0], 10);
        if (needHeader && needHeader[sn0] && !done[sn0]) {
          done[sn0] = 1;
          out.push(<div key={'h' + i} style={s.pgHeader}>{'سُورَةُ ' + SURAH_NAMES[sn0]}</div>);
        }
        if (needBasmala && needBasmala[sn0])
          out.push(<div key={'b' + i} style={{ ...s.pgBasmala, fontSize: basmalaFs }}>{getVerseText(1, 1) || ''}</div>);
      }
      // نفسُ الدالّة التي بها اختير المرشّحون وقيسوا — فلا يفترق المرسومُ عن المقيس.
      const parts = pgLineTokens(ln);
      // حجمٌ واحدٌ لكلّ سطرٍ في الصفحة، وهو نفسُه في الـ٦٠٤ إلا حيث عمل الحارس.
      // و space-between دائماً بلا استثناء: السطرُ يمتدّ من حافةٍ لحافة كالمطبوع.
      const lfs = fit ? fit.uni : PG_BASE_FS;
      out.push(
        <div key={i} data-l={i} style={{ ...s.pgLine, fontSize: lfs, lineHeight: fit ? fit.lead : PG_LINE_H, gap: PG_GAP_EM + 'em' }}>
          {parts.map((p, j) => <span key={j} style={s.pgWord}>{p}</span>)}
        </div>
      );
    } else if (ln.t === 'h') {
      const sn = headerSurah[page.n + ':' + ln.n];
      out.push(<div key={i} style={sn ? s.pgHeader : s.pgBlank}>{sn ? 'سُورَةُ ' + SURAH_NAMES[sn] : ''}</div>);
    } else {
      // ترتيبُ المصحف لا يُقلب: الرأسُ، ثمّ البسملةُ، ثمّ أوّلُ آية.
      // فإن كانت هذه بسملةَ سورةٍ أسقط المصدرُ رأسَها (١٠ يونس · ٨٢ الانفطار · ٨٦ الطارق)
      // حُقن الرأسُ هنا — فوقها. سورةُ البسملة تُشتقّ من أوّل خانةٍ بعدها، لا من لافتة.
      let sb = 0;
      for (let j = i + 1; j < page.l.length; j++) {
        const nx = page.l[j];
        if (nx.t !== 't' || !nx.w || !nx.w.length) continue;
        const b0 = nx.w[0].split(':');
        if (b0[1] === '1' && b0[2] === '1') sb = parseInt(b0[0], 10);
        break;
      }
      if (sb && needHeader && needHeader[sb] && !done[sb]) {
        done[sb] = 1;
        out.push(<div key={'h' + i} style={s.pgHeader}>{'سُورَةُ ' + SURAH_NAMES[sb]}</div>);
      }
      // البسملة من getVerseText(1,1) — لا نكتب نصّاً قرآنياً بيدنا أبداً.
      out.push(<div key={i} style={{ ...s.pgBasmala, fontSize: basmalaFs }}>{getVerseText(1, 1) || ''}</div>);
    }
  }
  // 14.5 — الورقةُ تملأ خانتَها ولا تعانق نصَّها. عناقُ الأمس كان يهبط بالإطار إلى طول
  // المحتوى فيترك فوقه وتحته شريطَين من لون الخلفيّة — ١٠٩px فوق و١٠٤px تحت في ٥٠٦
  // صفحاتٍ من الـ٦٠٤. فالإطارُ الآن ١٠٠٪ في الحالين، والفراغُ يسكن داخلَه لا حولَه:
  // justifyContent:center يوسّط الكتلةَ بين حاشيتين متساويتين، والمعيَّنُ مسمورٌ في القدم.
  // ولأنّ الطولَ لم يعد يتبدّل بعد القياس، فحالةُ القياس هي حالةُ العرض نفسُها — وهذا
  // أمتنُ ممّا كان: room يُقرأ من الخانة التي سيسكنها النصُّ فعلاً، لا من خانةٍ ستنكمش.
  const frameSt = s.pgFrame;
  const pageSt = s.pgPage;
  return (
    <div style={frameSt}>
      <div ref={ref} style={pageSt}>{out}</div>
      <PageDecor n={page.n} />
    </div>
  );
}

// Session 51 -- the page dressing: four corner brackets and the page medallion.
// It hangs off the frame WRAPPER, never off pgPage. The fit measurement divides by
// pgPage's element-child count (byHeight, ~4900), so a decorative child inside the page
// would silently shrink the Quran text on every page. pointerEvents:none throughout --
// the page drag belongs to the viewport and must pass straight through the ornament.
function PageDecor({ n }) {
  const corner = (extra) => (
    <svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="var(--red-lift)" strokeWidth="1.2" strokeLinecap="round" aria-hidden="true" style={{ position: 'absolute', pointerEvents: 'none', ...extra }}>
      <path d="M13 1H4a3 3 0 0 0-3 3v9" />
    </svg>
  );
  return (
    <React.Fragment>
      {corner({ top: 3, left: 3 })}
      {corner({ top: 3, right: 3, transform: 'scaleX(-1)' })}
      {corner({ bottom: 3, left: 3, transform: 'scaleY(-1)' })}
      {corner({ bottom: 3, right: 3, transform: 'scale(-1,-1)' })}
      <div style={s.pgMedal}>{toArabicDigits(n)}</div>
    </React.Fragment>
  );
}

// Session 51 -- the mushaf bookmark (the thread). One flat device key: the child profile
// carries no stable identifier, and adding one for this feature is out of scope. The key is
// cleared alongside the other three in resetAll, so a wiped profile inherits no bookmark.
const MUSHAF_BOOKMARK_KEY = 'mushaf_bookmark_v1';
// Returns null on the slightest doubt -- missing key, damaged JSON, non-integer or
// out-of-range page or surah -- and never surfaces an error to the reader.
function readMushafBookmark() {
  try {
    const raw = localStorage.getItem(MUSHAF_BOOKMARK_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || typeof o !== 'object') return null;
    if (!Number.isInteger(o.p) || o.p < 1 || o.p > 604) return null;
    if (!Number.isInteger(o.s) || o.s < 1 || o.s > 114) return null;
    return { p: o.p, s: o.s };
  } catch (e) { return null; }
}
function writeMushafBookmark(pg, sr) {
  try { localStorage.setItem(MUSHAF_BOOKMARK_KEY, JSON.stringify({ p: pg, s: sr })); } catch (e) {}
}

// ---------------------------------------------------------------------------
// Session 82 -- THE THREAD THAT PLACES ITSELF, and the daily wird beside it.
//
// Three device-local keys, and all three are device-local ONLY. Nothing below is read by
// any request builder, no value here is ever attached to a prompt, a header or a body, and
// no network call exists anywhere in this block. resetAll removes all three.
//
// The manual bookmark above is UNTOUCHED and stays the reader's own deliberate mark: it is
// written by one button and by nothing else. The last page is the opposite kind of thing --
// the app remembers where you were whether you asked it to or not -- so it gets its own key,
// its own reader, its own writer and its own row. The two never share storage or a glyph.
// ---------------------------------------------------------------------------
const MUSHAF_LAST_PAGE_KEY = 'mushaf_last_page_v1';
// Same shape as the bookmark and the same refusal to guess: any doubt at all -- no key,
// damaged JSON, a non-object, a non-integer or an out-of-range page or surah -- returns
// null, and the resume row simply is not drawn. Read and parse are wrapped SEPARATELY so a
// storage that throws on getItem is answered before JSON is ever asked anything.
function readMushafLastPage() {
  let raw = null;
  try { raw = localStorage.getItem(MUSHAF_LAST_PAGE_KEY); } catch (e) { return null; }
  if (!raw) return null;
  let o = null;
  try { o = JSON.parse(raw); } catch (e) { return null; }
  if (!o || typeof o !== 'object') return null;
  if (!Number.isInteger(o.p) || o.p < 1 || o.p > 604) return null;
  if (!Number.isInteger(o.s) || o.s < 1 || o.s > 114) return null;
  return { p: o.p, s: o.s };
}
// Validated BEFORE the write, so a bad pair is never persisted for the reader above to have
// to reject later. A storage that throws costs nothing: the page is still on the screen.
function writeMushafLastPage(pg, sr) {
  if (!Number.isInteger(pg) || pg < 1 || pg > 604) return;
  if (!Number.isInteger(sr) || sr < 1 || sr > 114) return;
  try { localStorage.setItem(MUSHAF_LAST_PAGE_KEY, JSON.stringify({ p: pg, s: sr })); } catch (e) {}
}

// The daily target: a decimal integer string, 1..604, and ABSENCE IS A REAL ANSWER. "No
// target" is not a broken state to be repaired on the next read -- it is the state the
// reader gets by default and the state the picker can return them to for good.
const WIRD_TARGET_KEY = 'mushaf_wird_target_v1';
// Canonical decimal only. ' 5', '5 ', '5.0', '-5', '05', '', 'abc' and Arabic-Indic digits
// as STORED text are all refused: the picker normalises before it writes, so anything
// non-canonical in the key was not written by this build and is not trusted.
function readWirdTarget() {
  let raw = null;
  try { raw = localStorage.getItem(WIRD_TARGET_KEY); } catch (e) { return null; }
  if (typeof raw !== 'string' || !/^[0-9]+$/.test(raw)) return null;
  const n = parseInt(raw, 10);
  if (!(n >= 1 && n <= 604)) return null;
  if (String(n) !== raw) return null;
  return n;
}
function writeWirdTarget(n) {
  if (!Number.isInteger(n) || n < 1 || n > 604) return;
  try { localStorage.setItem(WIRD_TARGET_KEY, String(n)); } catch (e) {}
}
function clearWirdTarget() {
  try { localStorage.removeItem(WIRD_TARGET_KEY); } catch (e) {}
}

// Today's completed pages: { d: 'YYYY-MM-DD', pages: [distinct 1..604] }.
const WIRD_DAY_KEY = 'mushaf_wird_day_v1';
// 8 seconds on the page, continuously, or it did not count. Short enough that ordinary
// reading credits every page; long enough that paging past twenty sheets looking for a
// surah credits none of them but the one you stopped on.
const WIRD_DWELL_MS = 8000;
const WIRD_TARGET_PRESETS = [1, 2, 5, 10, 20];
// DEVICE-LOCAL, and deliberately not toISOString. The day boundary a reader lives by is
// their own midnight, not UTC's: east of Greenwich toISOString would roll the wird over in
// the middle of the evening, and west of it the small hours would still count as yesterday.
// getFullYear/getMonth/getDate are the local calendar and nothing else is consulted.
function wirdDayKey(d) {
  const t = d || new Date();
  const y = t.getFullYear();
  const m = t.getMonth() + 1;
  const day = t.getDate();
  return String(y) + '-' + (m < 10 ? '0' : '') + String(m) + '-' + (day < 10 ? '0' : '') + String(day);
}
// Anything that is not today's well-formed record reads as TODAY'S EMPTY RECORD -- a record
// from another local date, damaged JSON, a missing key, a non-array `pages`, a storage that
// throws. Yesterday's wird is never today's progress and never an error message either.
// Pages are filtered, range-checked and de-duplicated on the way out, so the count can only
// be the number of distinct real pages and can never exceed 604.
function readWirdDay() {
  const today = wirdDayKey();
  let raw = null;
  try { raw = localStorage.getItem(WIRD_DAY_KEY); } catch (e) { return { d: today, pages: [] }; }
  if (!raw) return { d: today, pages: [] };
  let o = null;
  try { o = JSON.parse(raw); } catch (e) { return { d: today, pages: [] }; }
  if (!o || typeof o !== 'object') return { d: today, pages: [] };
  if (o.d !== today) return { d: today, pages: [] };
  if (!Array.isArray(o.pages)) return { d: today, pages: [] };
  const seen = Object.create(null);
  const pages = [];
  for (const v of o.pages) {
    if (!Number.isInteger(v) || v < 1 || v > 604) continue;
    if (seen[v]) continue;
    seen[v] = 1;
    pages.push(v);
  }
  return { d: today, pages: pages };
}
// The only writer of the daily key. A page already credited today writes NOTHING, so
// returning to it -- or paging back and forth over it all afternoon -- cannot inflate the
// count. An invalid page writes nothing either. localStorage only: no request, no beacon.
function markWirdPageRead(pg) {
  const rec = readWirdDay();
  if (!Number.isInteger(pg) || pg < 1 || pg > 604) return rec;
  if (rec.pages.indexOf(pg) !== -1) return rec;
  const next = { d: rec.d, pages: rec.pages.concat([pg]) };
  try { localStorage.setItem(WIRD_DAY_KEY, JSON.stringify(next)); } catch (e) {}
  return next;
}
// The picker's own normalisation. Character for character the acceptance the page-jump box
// uses -- Arabic-Indic and Latin digits, whitespace stripped -- but its OWN function, so
// that jumpGo below is left exactly as it is and the page jump cannot change behaviour.
function wirdNormalizeDigits(v) {
  return String(v == null ? '' : v).replace(/\s+/g, '').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}

// القارئ المُصفَّح — صفحةٌ لكلّ شاشة، ٦٠٤ صفحة، بأسطر مصحف المدينة.
// الاتّجاه: المصحفُ يُقلب من اليسار إلى اليمين، فجرُّ الورقة يميناً يكشف التالية.
function PagedMushaf({ startSurah, startPage, onExit }) {
  const [state, setState] = useState('loading');   // loading | ok | fail
  const [page, setPage] = useState(1);
  const [drag, setDrag] = useState(0);
  const [slide, setSlide] = useState(0);
  const [anim, setAnim] = useState(false);
  // 75/B2 -- immersive chrome: two bars the page can take the whole screen from.
  // 77 -- but they INTRODUCE THEMSELVES BEFORE THEY HIDE. They start VISIBLE for everybody,
  // so a reader opening the mushaf for the first time sees the sura name, the bookmark, the
  // page bar and the way back -- and they collapse ONCE, after that reader turns the first
  // page. The gesture teaches itself: you see the furniture, you turn a page, it makes room,
  // and a tap brings it back. Before 77 the flag decided the initial value, so from 7a4a2aa
  // -- when the flag became everybody -- a first-time reader met a page with no way back on it.
  //
  // Unconditional `true` is SAFER for the fallback, not riskier. With the flag off the tap
  // toggle is gated (see onEnd) and readerTurnedPage refuses to write, so the initialiser
  // remains the only writer the fallback ever reaches and its bars stay pinned visible
  // exactly as they are today.
  const [chromeOn, setChromeOn] = useState(true);
  // The one-shot latch is a REF, not state: a re-render cannot re-fire it, and it is never
  // read during rendering so it cannot be stale. commit() lands twice on purpose (the
  // transitionend and the fallback timer both call land), and the latch is what makes the
  // second landing free.
  //
  // It is called from the two places the READER moves the page and from nowhere else:
  // land() for a committed swipe and for the prev/next buttons, and jumpTo() for a jump.
  // Deliberately NOT a useEffect on `page`. There is a third writer of `page` -- the load
  // effect above, which sets the opening page from the surah index -- and an effect on
  // `page` would fire for it, collapsing the bars before the reader had touched anything,
  // which is the defect this replaces. The epoch bump from a screen rotation or a font load
  // never touches `page` at all, so it cannot reach this either.
  const chromeAuto = useRef(false);
  // 78 -- the image prototype is a page reader too, so it collapses the bars after the
  // first turn exactly as the SVG reader does. With the prototype off the condition is
  // character for character what it was.
  const readerTurnedPage = () => {
    if ((!MUSHAF_SVG_ON && !MADINA_IMG_ON) || chromeAuto.current) return;
    chromeAuto.current = true;
    setChromeOn(false);
  };
  // 75/E -- null means FIT, and fit means no transform on the element at all rather than a
  // scale of 1. That is what makes "a second double tap returns to fit, exactly" true by
  // construction: there is nothing left to accumulate a rounding error in.
  const [zoom, setZoom] = useState(null);   // null | { k, tx, ty }
  const idx = useRef(null);
  const tapRef = useRef({ t: 0, x: 0, y: 0, timer: null });
  const slotRef = useRef(null);
  const touch = useRef({ x: 0, y: 0, on: false, lock: null });
  const timer = useRef(null);
  // الثابتُ العالميّ يُبطَل في حالتين لا ثالثة، وكلتاهما تجعله كذباً يعمّ الـ٦٠٤:
  //   • تغيّرُ عرض النافذة (تدويرُ الشاشة) — الخانةُ صارت غيرَها.
  //   • وصولُ خطّ المصحف بعد قياسٍ جرى بخطٍّ بديل — الحروفُ صارت غيرَها.
  // ارتفاعُ النافذة وحده لا يُبطل شيئاً: شريطُ المتصفّح يطلع وينزل فيغيّره بلا سبب.
  // الإبطالُ يرفع epoch، وهي في مفاتيح الصفحات الثلاث، فتُعاد ملاءمتُها وحدها.
  const [epoch, setEpoch] = useState(0);
  useEffect(() => {
    let alive = true;
    let w = window.innerWidth;
    const redo = () => { if (!alive) return; pgInvalidateK(); setEpoch((e) => e + 1); };
    const onResize = () => { if (window.innerWidth !== w) { w = window.innerWidth; redo(); } };
    window.addEventListener('resize', onResize);
    // لو كان الخطُّ حاضراً سلفاً (مخزَّناً) فلا إبطالَ ولا إعادةَ قياسٍ بلا سبب.
    try {
      if (document.fonts && document.fonts.ready && document.fonts.status !== 'loaded')
        document.fonts.ready.then(redo);
    } catch (e) {}
    return () => { alive = false; window.removeEventListener('resize', onResize); };
  }, []);

  useEffect(() => {
    let alive = true;
    Promise.all([loadQuran(), loadLayout()])
      .then(() => {
        if (!alive) return;
        idx.current = buildLayoutIndex();
        setPage(startPage || idx.current.startPage[startSurah] || 1);
        setState('ok');
      })
