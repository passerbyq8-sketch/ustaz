// ============================================================
// تحليل الرسائل ذات البطاقات (verse/hadith/steps/suggestions)
// ============================================================
// يحذف أي وسم معروف (<verse>/<hadith>/<steps>/<suggestions>) فُتِح ولم يُغلَق — يحدث
// عند اقتطاع الردّ منتصف الوسم — وأي بقايا "<...>" يتيمة في آخر النص، كي لا يتسرّب
// ترميز خام إلى الطفل (عرض) ولا إلى ElevenLabs (صوت). مستقلّ تماماً عن max_tokens.
const KNOWN_TAG_NAMES = Object.freeze([
  'verse', 'surah', 'hadith', 'steps', 'suggestions',
  'board', 'document', 'source', 'dhikr', 'worship',
]);
const KNOWN_TAGS = KNOWN_TAG_NAMES.join('|');
// سجلُّ الإنقاذ: كلُّ مرّةٍ أفرغ فيها التنظيفُ نصًّا خادميًّا غيرَ فارغٍ فأُنقِذ بدلَ أن يُمحى.
// يبقى في الذاكرة للعميل وللحارس؛ لا يُرسَل إلى أيِّ خادم.
const EZIK_TAG_RESCUES = [];

// ============================================================
// §٢ (C) — «هذا الجوابُ لم يكتملْ»: العلامةُ التي يرسلُها الخادم، والقراءةُ التي يقرؤها العميل
// ============================================================
// THE DEFECT THIS ANSWERS, MEASURED LIVE: a reply cut IN THE MIDDLE OF A WORD arrived wearing the
// closing review mark, so it read as finished. The client had no way to know otherwise — nothing on
// the wire said whether the model had stopped or been stopped — and so it said nothing.
//
// api/ask.js appends `<incomplete/>` and NOTHING ELSE when, and only when, the round that wrote the
// delivered text ended on something other than `end_turn`. It is deliberately not a sentence: the
// wording belongs to this file, in the reader's own language, beside the button that acts on it.
//
// IT IS NOT IN `KNOWN_TAG_NAMES`, and that is on purpose. `stripIncompleteTags` cuts from the first
// UNCLOSED known tag to the end of the text — a self-closing marker would look exactly like that to
// it, and the answer after it would be deleted to remove a marker whose whole contract is that
// nothing is deleted. So it is stripped by name, in the three readers that do not already strip
// every angle bracket (`toPlainText` and `formatForStreamPreview` do).
//
// TWO REGEXPS AND NOT ONE: `.test()` on a /g regexp carries `lastIndex` between calls, so the same
// constant used for both would answer TRUE and FALSE alternately on the identical string.
const EZIK_INCOMPLETE_STRIP = /<incomplete\s*\/?>/gi;
const EZIK_INCOMPLETE_TEST = /<incomplete\s*\/?>/i;
const ezikStripIncomplete = (t) => String(t == null ? '' : t).replace(EZIK_INCOMPLETE_STRIP, '');
const ezikAnswerIncomplete = (t) => typeof t === 'string' && EZIK_INCOMPLETE_TEST.test(t);

// تعقيمٌ آمنٌ للنصِّ الذي كان سيُمحى بالكامل: تُنزَع الأقواسُ الزاويّةُ وما بينها، ويبقى النثر.
//
// الحذفُ بمدى الوسمِ لا بذيلِ النصّ (أ-٦/١). كان سطرُ الآيةِ والسورةِ يحذفُ من الوسمِ إلى آخرِ
// النصِّ كلِّه، فجوابٌ من ١٣٠ حرفًا فيه ٥٥ حرفَ نثرٍ بعدَ آيةٍ مقطوعةٍ كان يصلُ صفرًا: العرضُ
// والصوتُ وسجلُّ الأهلِ كلُّها فارغة. ونحن لا نمنعُ إلا نصَّ التلاوةِ نفسَه — لأنّ التلاوةَ
// يتلوها القارئُ الحقيقيُّ بصوته ولا نخترعُ لها نصًّا من عندنا — أمّا النثرُ الذي يليها فليس
// تلاوةً ولا علاقةَ له بالوسم، فيعيش.
//
// فالمدى: من فتحِ الوسمِ إلى إغلاقِه المطابقِ إن وُجد؛ وإن كان الوسمُ مقطوعًا بلا إغلاق فإلى
// أوّلِ «<» أو أوّلِ سطرٍ جديد — أيُّهما أسبق. وهذا يُبقي كلَّ ما بعدَ السطرِ سليمًا.
const VERSE_TAG_EXTENT = /<(verse|surah)\b[^>]*>(?:[\s\S]*?<\/\1>|[^<\n]*)/g;
const rescueTruncated = (text) => String(text || '')
  .replace(VERSE_TAG_EXTENT, ' ')
  .replace(/<[^>]*>/g, ' ')
  // §٤ (D): the same correction as in `stripIncompleteTags` below, and for the same reason —
  // this pass runs over the same text, and a cut that crosses a line loses the same answer.
  .replace(/<\/?[A-Za-z][^>\n]*$/g, ' ')
  .replace(/[^\S\n]+/g, ' ')
  .replace(/ ?\n ?/g, '\n')
  .trim();

// opts.rescue — للقُرّاءِ الذين يقرأون النصَّ النهائيَّ وحدَهم (العرضُ والصوتُ وسجلُّ الأهل).
// المسارُ المتدفّقُ لا يمرّره: الوسمُ الناقصُ أثناءَ التدفّقِ حالةٌ طبيعيّةٌ والقصُّ فيه صواب.
const stripIncompleteTags = (text, opts) => {
  if (!text || typeof text !== 'string') return text || '';
  let t = text;
  // ٠. طَبِّع وسمَي الآية/السورة ذاتيَّي الإغلاق (<verse .../>، <surah .../>) إلى صيغةٍ
  //    مُغلَقة حتى لا يَعدّهما كاشفُ الوسوم الناقصة وسماً مقطوعاً فيحذفهما. (كلاهما فارغ بلا نصّ.)
  t = t.replace(/<(verse|surah)([^>]*?)\s*\/>/g, '<$1$2></$1>');
  // ١. أول وسم معروف مفتوح بلا إغلاق مطابق → احذف من بدايته حتى نهاية النص.
  const openRe = new RegExp(`<(${KNOWN_TAGS})\\b`, 'g');
  let m, cut = -1;
  while ((m = openRe.exec(t)) !== null) {
    const closeRe = new RegExp(`</${m[1]}>`, 'g');
    closeRe.lastIndex = m.index;
    if (!closeRe.test(t)) { cut = m.index; break; }
  }
  if (cut >= 0) t = t.slice(0, cut);
  // ٢. «<» مقطوعٌ في آخرِ النصِّ بلا «>» مطابق (مثل «<ver» أو «<verse surah=») → يُحذَف.
  //
  // ── §٤ (D): القصُّ لا يعبرُ سطرًا، والفتحةُ لا تكونُ وسمًا إلّا بحرف ─────────
  //
  // العطبُ مقيسٌ في جولةِ المتصفّحِ على شجرةٍ صحيحةِ الخادم: قارئٌ طلبَ دالّةَ زكاةٍ فوصلَه
  // الجوابُ كاملًا من الخادم، ثمَّ قطعَه هذا السطرُ عند `if (amount ` ومحا ما بعدَه كلَّه —
  // ثمانيةَ أسطرٍ من الكودِ وخاتمةَ الجوابِ العربيّة. لأنَّ `[^>]*` يبتلعُ الأسطر، و`$` بلا
  // رايةِ `m` هو آخرُ النصِّ لا آخرُ السطر: فأوّلُ «<» لا «>» بعدَه في المتنِ كلِّه يمحو الباقي.
  // وعلامةُ «أصغر من» في الكودِ هي هذا بعينِه.
  //
  // والتصحيحُ بنيويٌّ من وجهين، وكلاهما مأخوذٌ من نصِّ الغرضِ المكتوبِ أعلاه:
  //   آخرُ السطر  — «في آخرِ النصّ» بعدَ قطعِ البثِّ يعني ألّا شيءَ بعدَه، فلا سطرَ بعدَه أصلًا
  //   حرفٌ بعدَ «<» — «<ver» وسمٌ مقطوع، و«< nisab» مسافةٌ ثمَّ اسمٌ: ليست وسمًا في أيِّ لغة
  //
  // ولا يفوتُ هذا شيئًا ممّا كانَ يمسكُه: الوسمُ المعروفُ المفتوحُ — ولو تامَّ الاسمِ في وسطِ
  // النصِّ — قد قصَّه البندُ ١ قبلَ الوصولِ إلى هنا؛ فالباقي لهذا البندِ اسمٌ مقطوعٌ لا يقعُ
  // إلّا حيثُ انقطعَ البثُّ، أي في آخرِ سطرٍ من المتن.
  t = t.replace(/<\/?[A-Za-z][^>\n]*$/, '');
  // ٣. الإنقاذ (X-014): إن كان الخادمُ قد سلّم نصًّا فيه كلامٌ حقيقيّ، وأفرغه التنظيفُ
  //    بالكامل — وهذا يقع حين يكون الوسمُ المقطوعُ أوَّلَ النصِّ فيصيرُ موضعُ القصِّ صفرًا —
  //    فالطفلُ يرى فقاعةً فارغةً ويسمعُ صمتًا، وهو أسوأُ من نصٍّ منقوصٍ مُعقَّم. نعرضُ النثرَ
  //    الباقيَ بعد تعقيمٍ آمن، ونُسجِّلُ أنّ الجوابَ وصل منقوصًا.
  const out = t;
  if (opts && opts.rescue && out.trim() === '' && text.trim() !== '') {
    const tagMatch = new RegExp(`<(${KNOWN_TAGS})\\b`).exec(text);
    const rescued = rescueTruncated(text);
    // التسجيلُ دائمًا (أ-٦/٢). كان `if (rescued)` يحرسُ الدفعَ في السجلِّ كما يحرسُ العودة، فحين
    // لم يبقَ نثرٌ يُنقَذ لم يُكتَبْ شيءٌ في أيِّ مكان: الفقاعةُ تفرغُ والسجلُّ يقولُ إنّ شيئًا لم
    // يقع. أسوأُ الحالتينِ هي التي لا أثرَ لها. فالسجلُّ الآن يُكتَبُ في الحالتين، والفرقُ في
    // `reason` وفي `chars`، وتبقى العودةُ مشروطةً بوجودِ نثرٍ فعلاً.
    EZIK_TAG_RESCUES.push({
      tag: tagMatch ? tagMatch[1] : 'unknown',
      reason: rescued ? 'truncated-tag-emptied-reply' : 'truncated-tag-emptied-reply-unrescuable',
      chars: rescued.length,
      rescued: rescued.length > 0,
    });
    if (rescued) return rescued;
  }
  return out;
};

// ============================================================
// عنوانُ الخطوات — من الجواب، لا من قالبٍ ثابت
// ============================================================
// كان فوق كلِّ قائمةِ خطواتٍ عنوانٌ واحدٌ لا يتغيّر: «خُطُوَاتٌ تُسَاعِدُك». فحين كانت القائمةُ
// أعذارًا شرعيّةً لهجرِ الفراش، قرأ صاحبُ السؤال عنوانًا لا علاقةَ له بما تحته. قرارُ المالك:
// «ماله داعي الجمله هذي اصلا، لازم تكون كلمه بديله حسب الصياغ وتتماشى معاه، وليست جمله تظهر
// في كل مره». فالعنوانُ صار خاصّيّةً يزوِّدها النموذجُ من صلبِ الموضوع — وإن غابت فلا عنوانَ
// أصلًا. لا سقوطَ إلى عبارةٍ ثابتة: عبارةٌ ثابتةٌ خاطئةٌ أسوأُ من لا عبارة.
// أربعةُ مطابعَ تقرأ هذه الدالّةَ نفسَها: البطاقةُ المرئيّة (StepsCard)، والصوتُ (formatForTTS)،
// وسجلُّ الأهل (formatForLog)، والنسخُ إلى الحافظة (REPLY_SERIALIZERS.steps).
const readStepsTitle = (attrsStr) => {
  const m = String(attrsStr || '').match(/title=["']([^"']*)["']/);
  return m ? m[1].trim() : '';
};

// ============================================================
// «رَوَى {المخرِّج}» — والمخرِّجُ مخرِّجٌ لا درجة
// ============================================================
// العطبُ المقيس: نموذجٌ ملأ narrator بالدرجةِ نفسِها، فطُبع «رَوَى متفق عليه» ثمّ «متفق عليه»
// درجةً تحته — الدرجةُ مرّتين، وإحداهما بصيغةٍ مكسورةٍ لا تُقرأ عربيّةً.
// هنا نصلحُ الطباعةَ فقط: إن كان narrator لفظَ درجةٍ لا اسمَ مخرِّج، أو ساوى ruling بعد
// التطبيع، فلا يُطبَعُ سطرُ «رَوَى …»، وتُطبَعُ الدرجةُ مرّةً واحدة (ونرفعُ اللفظَ إلى خانةِ
// الدرجةِ إن كانت خاليةً، كيلا تضيعَ الدرجةُ أصلًا). أمّا صدقُ التخريجِ نفسِه — نموذجٌ يضع
// «متفق عليه» على ما ليس في الصحيحين — فعطبُ توليدٍ خارجَ نطاقِ هذا المطبع.
const normalizeAttribution = (s) => String(s || '')
  .replace(/[ً-ْٰـ]/g, '')   // تشكيل وتطويل
  .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
  .replace(/[^ء-ي\s]/g, ' ')
  .replace(/\s+/g, ' ')
  .trim();
// ألفاظُ الدرجاتِ التي شوهدت — أو تُشبِهُ ما شوهد — في خانةِ المخرِّج. مطابقةٌ تامّةٌ بعد
// التطبيع لا احتواء: «الحسن البصريّ» مخرِّجٌ لا درجة، و«حسن» وحدَها درجة.
const RULING_PHRASES = new Set([
  'متفق عليه', 'متفق علي صحته', 'رواه الشيخان', 'اخرجه الشيخان',
  'صحيح', 'حسن', 'ضعيف', 'حسن صحيح', 'صحيح لغيره', 'حسن لغيره',
  'ضعيف جدا', 'موضوع', 'منكر', 'مرسل', 'متواتر', 'شاذ',
  'اسناده صحيح', 'اسناده حسن', 'اسناده ضعيف',
].map(normalizeAttribution));
// «حسّنه الألباني» / «صحّحه ابن باز» / «ضعّفه الألباني» — درجةٌ منسوبةٌ لا مخرِّج.
const RULING_VERB_RE = /^(حسنه|صححه|ضعفه|حسن|صحح|ضعف)\s/;
const isRulingPhrase = (s) => {
  const n = normalizeAttribution(s);
  if (!n) return false;
  return RULING_PHRASES.has(n) || RULING_VERB_RE.test(n);
};
// ── «رَوَى رواه البخاري» (قرار ١١) ─────────────────────────────────────────
// البطاقةُ تطبعُ «رَوَى {المخرِّج}»، والنموذجُ يملأُ الخانةَ أحيانًا بالجملةِ كاملةً —
// «رواه البخاري» — فيخرجُ الفعلُ مرّتين. المطلوبُ الاسمُ وحدَه، فتُنزَعُ البادئةُ ويبقى.
//
// مُطبَّعةً لا حرفيّة: النموذجُ يكتبُ عربيّةً مشكولةً، فـ«رَوَاهُ» و«رواه» و«خرّجه» و«خرجه»
// و«أخرجه» و«اخرجه» حالةٌ واحدةٌ بعد التطبيع — وثلاثةُ مدخلاتٍ تكفي للستّة.
const NARRATION_VERBS = new Set(['رواه', 'أخرجه', 'خرّجه'].map(normalizeAttribution));
// القرارُ يُتَّخَذُ على الصورةِ المطبَّعةِ والقصُّ يقعُ على الأصل، فيحتفظُ الاسمُ برسمِه
// وتشكيلِه كما ورد: «رواه البخاريُّ» ⟹ «البخاريُّ» لا «البخاري».
const stripNarrationVerb = (s) => {
  const raw = String(s || '').trim();
  const sp = raw.search(/\s/);
  // كلمةٌ واحدةٌ لا تكونُ فعلًا واسمًا، فلا يُنزَعُ منها شيءٌ — وإلّا أفرغنا الخانةَ كلَّها.
  if (sp === -1) return raw;
  if (!NARRATION_VERBS.has(normalizeAttribution(raw.slice(0, sp)))) return raw;
  return raw.slice(sp + 1).trim();
};
/**
 * تُرجِعُ ما يُطبَعُ فعلًا لبطاقةِ حديث: مخرِّجٌ (أو لا شيء) ودرجةٌ (أو لا شيء).
 * @param {string} narrator قيمةُ narrator كما وردت من النموذج
 * @param {string} ruling قيمةُ ruling كما وردت من النموذج
 * @returns {{narrator: string, ruling: string}}
 */
const resolveHadithAttribution = (narrator, ruling) => {
  let n = String(narrator || '').trim();
  let r = String(ruling || '').trim();
  if (n && isRulingPhrase(n)) { if (!r) r = n; n = ''; }
  else {
    // النزعُ بعدَ فحصِ الدرجةِ لا قبلَه، والترتيبُ مقصود: «رواه الشيخان» لفظُ درجةٍ مسجَّلٌ
    // في RULING_PHRASES، ونزعُ بادئتِه أوّلًا كان يُحيلُه اسمًا «الشيخان» ويُبطِلُ قاعدةً قائمة.
    n = stripNarrationVerb(n);
    if (n && r && normalizeAttribution(n) === normalizeAttribution(r)) { n = ''; }
  }
  return { narrator: n, ruling: r };
};

// مفتاح تجريبي (A/B) — صحّحه إلى true لمقارنة النطق بلا تشكيل في المتصفح:
// عند true نُرسِل لـ ElevenLabs نصّاً مُجرَّداً من كل تشكيل (نطق MSA نثريّ فقط —
// القرآن يُتلى من القارئ لا من الذكاء الاصطناعي، فالتجريد آمن هنا). النصّ المعروض
// للطفل وللأهل يبقى مُشَكَّلاً بالكامل. السبب: عناقيد الشدّة (التَّشْرِيك = تّ+شْ)
// تُسبّب تأتأة في eleven_multilingual_v2. هذا تطبيع للمُدخَل الصوتي فقط.
const STRIP_TASHKEEL_FOR_TTS = false;
const TTS_TASHKEEL_ENABLED = false; // false = skip Haiku tashkeel add-call for speech (pre-diacritized canonical text unaffected); flip true to restore original behavior
const CALL_STREAM_SPEECH = true; // false = classic (speak full reply after generation). true = stream complete prose sentences BEFORE the first tag as they arrive (first-audio latency win); tags + trailing prose still handled by buildAudioSequence at finish.
// Tashkeel is stripped from the tutor's prose by default (the owner's call), but NEVER from a
// Quranic span: anything between the ornate parentheses U+FD3F..U+FD3E is scripture and is left
// byte-for-byte as it came. Everything outside them loses the harakat marks only.
const QURAN_SPAN_RE = /\uFD3F[\s\S]*?\uFD3E/g;
const HARAKAT_RE = /[\u064B-\u0652\u0670]/g;
const stripTashkeelOutsideQuran = (s) => {
  const src = s || '';
  let out = '';
  let last = 0;
  let m;
  QURAN_SPAN_RE.lastIndex = 0;
  while ((m = QURAN_SPAN_RE.exec(src)) !== null) {
    out += src.slice(last, m.index).replace(HARAKAT_RE, '');
    out += m[0];
    last = m.index + m[0].length;
  }
  return out + src.slice(last).replace(HARAKAT_RE, '');
};
const miniBtnStyle = { display: 'inline-flex', alignItems: 'center', gap: 5, background: 'none', border: '1px solid var(--line)', borderRadius: 8, padding: '4px 8px', fontSize: 12, cursor: 'pointer', fontFamily: 'inherit', color: 'inherit', opacity: 0.7 };
// D91. Two live-browser failures the in-process harness could not see:
//
// (1) WHEN the text is built. It used to be built during MessageBubble's render. But the
//     canonical stores (quran / adhkar / worship) fill asynchronously AFTER the cards mount,
//     and each card holds its resolved text in its OWN state -- so the store landing re-renders
//     the CARD and never its parent. The render-time string therefore froze whatever had not
//     arrived at first paint: an ayah, a whole surah, the adhkar list, the salah card. A
//     worship-only reply froze to the empty string, and this button then hid itself entirely.
//     getText is now invoked on the TAP, seconds later, reading the very stores the cards read.
//
// (2) WHETHER the write actually happened. navigator.clipboard.writeText REJECTS in an Android
//     WebView, on an insecure origin, and without a user gesture. The old code treated the mere
//     PRESENCE of the API as success-or-nothing: on rejection it fell into catch(e){} and did
//     not try the legacy path, so the button did nothing at all and said nothing at all. And on
//     the legacy path it ignored execCommand's return value, so a REFUSED copy still flashed
//     "copied" -- indistinguishable, to the owner, from a broken serializer.
const CopyReplyButton = ({ text, getText }) => {
  const [flash, setFlash] = useState('');            // '' | 'ok' | 'fail'
  if (!text) return null;
  // The legacy path is not a relic: it is the ONLY path that works where the Clipboard API is
  // present but refuses. Returns true only when the document actually reports the copy done.
  const legacyCopy = (payload) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = payload;
      ta.setAttribute('readonly', '');               // keeps the mobile keyboard shut
      ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0';
      ta.style.width = '1px'; ta.style.height = '1px'; ta.style.padding = '0';
      ta.style.border = 'none'; ta.style.outline = 'none'; ta.style.boxShadow = 'none';
      ta.style.background = 'transparent'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { ta.setSelectionRange(0, String(payload).length); } catch (e) {}   // iOS needs the range
      const done = document.execCommand('copy') === true;
      document.body.removeChild(ta);
      return done;
    } catch (e) { return false; }
  };
  const doCopy = async () => {
    const payload = (typeof getText === 'function') ? getText() : text;
    if (!payload) { setFlash('fail'); setTimeout(() => setFlash(''), 1500); return; }
    let wrote = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(payload);
        wrote = true;
      }
    } catch (e) { wrote = false; }                   // a refusal is not the end -- fall through
    if (!wrote) wrote = legacyCopy(payload);
    setFlash(wrote ? 'ok' : 'fail');                 // never claim a write that did not happen
    setTimeout(() => setFlash(''), 1500);
  };
  return <button type="button" onClick={doCopy} aria-label={'\u0646\u0633\u062E'} style={miniBtnStyle}>{flash === 'ok' ? '\u062A\u0645 \u0627\u0644\u0646\u0633\u062E' : flash === 'fail' ? '\u062A\u0639\u0630\u0651\u0631\u064E \u0627\u0644\u0646\u0633\u062E' : '\u0646\u0633\u062E'}</button>;
};// The Web Speech engine ends a session on every pause and the next one starts a fresh
// transcript. Concatenating the two halves raw welded the last word of one onto the first
// word of the next. Every seam goes through this joiner instead.
const joinSpeech = (a, b) => { const l = a || ''; const r = b || ''; if (!l) return r; if (!r) return l; return (/\s$/.test(l) || /^\s/.test(r)) ? l + r : l + ' ' + r; };
const stripAllTashkeel = (s) => (s || '').replace(/[ً-ْٰ]/g, '');

// تصدير محتوى HTML كملفّ Word (.doc): Word/Docs يعرضان العربيّة RTL بأنفسهما،
// فنتخطّى مشكلة تشكيل العربيّة في توليد PDF داخل المتصفّح. (نمط تنزيل قياسيّ عبر <a download>)
const downloadAsWord = (filename, title, bodyHtml) => {
  const html = '\ufeff<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'
    + '<head><meta charset="utf-8"><title>' + title + '</title>'
    + '<style>@page{size:A4;margin:2cm} body{font-family:"Arial","Amiri",serif;direction:rtl;text-align:right;line-height:1.9;font-size:14pt;color:#222} h1{color:#12327A;font-size:20pt} h2{color:#12327A;font-size:15pt} h3{color:#12327A;font-size:13pt} h4{color:#12327A;font-size:12pt} ul,ol{margin-right:1em} strong{font-weight:bold} table{border-collapse:collapse;width:100%;margin:8pt 0} th,td{border:1px solid #999;padding:4pt 8pt;text-align:right} th{background:#EDF1FA;color:#12327A}</style>'
    + '</head><body dir="rtl" lang="ar">' + bodyHtml + '</body></html>';
  const blob = new Blob([html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = /\.doc$/.test(filename) ? filename : filename + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

// يهرّب رموز HTML كي لا يُحقَن ترميزٌ من المحتوى (احتياطًا)
const escapeHtml = (s) => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const toPlainText = (s) => String(s || '')
  .replace(/<[^>]+>/g, ' ')                 // any leftover angle tag
  .replace(/^#{1,6}\s+/gm, '')              // # .. ###### headings
  .replace(/\*\*([^*]+)\*\*/g, '$1')        // **bold**
  .replace(/^\s*[-•*]\s+/gm, '')            // bullet markers
  .replace(/^\s*\|.*\|\s*$/gm, '')          // markdown table rows
  .replace(/[﴿﴾]/g, '')                     // Quran ornament brackets
  .replace(/[ \t]{2,}/g, ' ')
  .replace(/\n{3,}/g, '\n\n')
  .trim();

const inlineFmt = (s) => escapeHtml(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

const printAsPdf = async (title, bodyHtml) => {
  const area = document.getElementById('print-area');
  if (!area) return;
  area.innerHTML = '<h1>' + escapeHtml(title) + '</h1>' + bodyHtml;
  // S97: html2pdf is no longer a boot-blocking <script>; it is warmed on idle after the first
  // paint. Awaiting the same promise here is what keeps this path's RESULT identical -- the only
  // case that waits is a tap in the first second, and it still produces the same file.
  if (window.__ezikVendor) { try { await window.__ezikVendor('html2pdf'); } catch (e) {} }
  if (!window.html2pdf) { document.title = title; window.print(); return; } // fallback if CDN failed
  const opt = {
    margin: [12, 12, 12, 12],
    filename: (title || 'مستند') + '.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'] }
  };
  const target = area.cloneNode(true);
  target.style.display = 'block';
  target.style.direction = 'rtl';
  target.style.textAlign = 'right';
  target.style.padding = '0';
  window.html2pdf().set(opt).from(target).save().then(() => { area.innerHTML = ''; }).catch(() => { area.innerHTML = ''; });
};

// يحوّل محتوى المستند (فقرات، عناوين بـ# أو ##، نقاط بـ- أو •) إلى HTML للتصدير
const docToHtml = (md) => {
  const lines = String(md || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;
  const isSep = (s) => /^[\s|:-]+$/.test(s.trim()) && s.includes('-') && s.includes('|');
  const parseRow = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
  while (i < lines.length) {
    const t = lines[i].trim();
    if (!t) { i++; continue; }
    if (t.includes('|') && i + 1 < lines.length && isSep(lines[i + 1])) {
      const headers = parseRow(t);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim() && lines[i].includes('|')) { rows.push(parseRow(lines[i])); i++; }
      let tbl = '<table><thead><tr>' + headers.map((h) => '<th>' + inlineFmt(h) + '</th>').join('') + '</tr></thead>';
      if (rows.length) tbl += '<tbody>' + rows.map((r) => '<tr>' + r.map((c) => '<td>' + inlineFmt(c) + '</td>').join('') + '</tr>').join('') + '</tbody>';
      tbl += '</table>';
      out.push(tbl); continue;
    }
    let m;
    if ((m = t.match(/^####\s+(.*)$/))) { out.push('<h4>' + inlineFmt(m[1]) + '</h4>'); i++; continue; }
    if ((m = t.match(/^###\s+(.*)$/))) { out.push('<h3>' + inlineFmt(m[1]) + '</h3>'); i++; continue; }
    if ((m = t.match(/^##\s+(.*)$/)))  { out.push('<h2>' + inlineFmt(m[1]) + '</h2>'); i++; continue; }
    if ((m = t.match(/^#\s+(.*)$/)))   { out.push('<h1>' + inlineFmt(m[1]) + '</h1>'); i++; continue; }
    if (/^[-•*]\s+/.test(t)) {
      const items = [];
      while (i < lines.length && /^[-•*]\s+/.test(lines[i].trim())) { items.push('<li>' + inlineFmt(lines[i].trim().replace(/^[-•*]\s+/, '')) + '</li>'); i++; }
      out.push('<ul>' + items.join('') + '</ul>'); continue;
    }
    if (/^\d+[.)]\s+/.test(t)) {
      const items = [];
      while (i < lines.length && /^\d+[.)]\s+/.test(lines[i].trim())) { items.push('<li>' + inlineFmt(lines[i].trim().replace(/^\d+[.)]\s+/, '')) + '</li>'); i++; }
      out.push('<ol>' + items.join('') + '</ol>'); continue;
    }
    out.push('<p>' + inlineFmt(t) + '</p>'); i++;
  }
  return out.join('\n');
};

// ============================================================
// deriveCaps — single source of truth for age-band capability gating.
// The band threshold is taken VERBATIM from the prompt builder, which now lives
// server-side in lib/system-prompt.js — same three bands (young 4–13 /
// teen 13–17 / adult 18+). Every UI gate reads a flag here instead of an inline
// age check. `call` is intentionally NOT a plain flag — it is band-AND-parent-gated
// and computed at the call site (see App: directConvoAllowed).
// ============================================================
function deriveCaps(age) {
  const ageNum = parseInt(age, 10) || 0;
  const band = ageNum >= 18 ? 'adult' : ageNum >= 13 ? 'teen' : 'young';
  return {
    band,
    memorize: true,
    recite:   true,
    upload:   band !== 'young',   // hidden for young by BAND (no parent override)
    export:   band !== 'young',   // preserves current >=11 behavior exactly
  };
}

// ============================================================
// standingNoticeKey — أيُّ تنبيهٍ دائمٍ يراه هذا القارئ (§٥).
//
// الحالُ قبلَ اليوم: سطرٌ واحدٌ بلا شرطٍ البتّة، فكلُّ بالغٍ يقرأُ «راجِعْ ما يهمُّك مع
// والديك». والشرطُ هنا مبنيٌّ على ما يقيسُه التطبيقُ فعلًا — نطاقُ deriveCaps المشتقُّ من
// سنةِ الميلادِ المخزّنة — لا على حقلٍ جديدٍ يُخمَّن. البالغُ (١٨+) يرى الصيغةَ بلا
// «والديك»، والصغيرُ واليافعُ يريانِها كما هي بحرفِها، وهو الاختيارُ الذي يجري عليه هذا
// الملفُّ في كلِّ فرقٍ آخرَ من نوعِه (`band !== 'young'` في deriveCaps وتوأمُه في
// WorshipCard): مَن يعيشُ في بيتِ أبويهِ تُقالُ له.
//
// A PURE FUNCTION ON PURPOSE. guards/standing-notice-band-guard.cjs lifts it out of the shipped
// babel block and drives both arms, so the rule is asserted where it lives instead of being
// re-described in a regex over this file.
// ============================================================
function standingNoticeKey(band) {
  return band === 'adult' ? 'chat.standingNoticeAdult' : 'chat.standingNotice';
}

// ============================================================
// childVoiceBlocked — الحكمُ الوحيدُ لحاجزِ صوتِ الأطفال (غ‑٣). fail-closed:
// لا ملفّ / ملفٌّ تالف / رميةُ استثناء ⇒ مقفول. يقرأ المرآةَ لا حالةَ الرسم،
// كي لا يُفتحَ الميكروفونُ في دورةٍ يكون فيها profile ما يزال بائتاً.
// ============================================================
function childVoiceBlocked() {
  if (CHILD_VOICE_ENABLED) return false;
  try {
    const p = voiceProfileRef.current;
    if (!p) return true;                       // fail-closed
    return deriveCaps(p.age).band === 'young';
  } catch (e) { return true; }                 // fail-closed
}

// تنبيهُ الحاجز — يحتذي نمطَ التنبيهات القائم (رسالةٌ غيرُ معطِّلة تُمسح بعد ٦ ثوانٍ).
// لا يوحي بخطأ، ولا يطلب عمراً أكبر، ولا يذكر مزوّداً.
function showChildVoiceNotice(setMsg) {
  try {
    setMsg(CHILD_VOICE_NOTICE);
    setTimeout(() => { try { setMsg(''); } catch (e) {} }, 6000);
  } catch (e) {}
}

// ============================================================
// XI-04 — الوسمُ شارةٌ لا محارفُ في المتن (the review mark is a badge)
// ============================================================
// WHAT WAS MEASURED. In 10 browser rounds of 10 on 17 August the final sheet carried, as raw
// characters in the prose, the line «【فهم لا فتوى】 ما تقدم فهم مبني على ما بين يدي في هذه
// الدورة، لا فتوى مسندة إلى مفت بعينه.», and one round carried a second mark INSIDE a paragraph
// («…وإن توضأ منها احتياطا فحسن لا واجب. 【فهم لا نص منقول】»). The copy button put the 【】
// brackets on the clipboard verbatim. Every ANGLE-bracket tag was drawn as a card in the same ten
// rounds; this was the one mark the client had no renderer for, so it fell through as text.
//
// THE MEANING STAYS, THE SHAPE CHANGES. The mark is lifted into its own segment and drawn as a
// badge beside the cards, and the clipboard receives its words without the brackets.
//
// TWO SHAPES, AND THEY ARE THE ONLY TWO lib/output-reviewer.js PRODUCES:
//   (a) `tag()` appends the bare mark AFTER the sentence it is about  -> the mark closes a line
//   (b) a NOTICE is `mark + ' ' + sentence` as its own output entry   -> the mark opens a line
// So the rest of the line is the badge's body ONLY when the mark OPENS the line. Anything else —
// a mark that turns up mid-sentence from some future writer — takes no body and the prose around
// it is left exactly where it was, rather than being swallowed into a badge.
const EZIK_NOTICE_RE = /【([^】\n]{1,80})】/u;
const EZIK_NOTICE_ALL = /【([^】\n]{1,80})】/gu;

const ezikLiftNotices = (segments) => {
  const out = [];
  (segments || []).forEach((seg) => {
    if (!seg || seg.type !== 'text' || !EZIK_NOTICE_RE.test(seg.content || '')) { out.push(seg); return; }
    const prose = [];
    const notices = [];
    String(seg.content).split('\n').forEach((line) => {
      if (!EZIK_NOTICE_RE.test(line)) { prose.push(line); return; }
      const labels = [];
      const stripped = line
        .replace(EZIK_NOTICE_ALL, (all, label) => { labels.push(label.trim()); return ''; })
        .replace(/[ \t]{2,}/g, ' ')
        .trim();
      const opensLine = /^\s*【/.test(line);
      labels.forEach((label, i) => notices.push({
        type: 'notice', label, content: (opensLine && i === 0) ? stripped : '',
      }));
      if (!opensLine && stripped) prose.push(stripped);
    });
    const kept = prose.join('\n').replace(/\n{3,}/g, '\n\n').trim();
    if (kept) out.push({ type: 'text', content: kept });
    notices.forEach((notice) => out.push(notice));
  });
  return out;
};

const parseRichMessage = (text, viewerAge) => {
  // Tolerate a <document> whose </document> never arrived (stream/token cutoff): close it so it still renders as a card.
  { const _d = text.search(/<document\b[^>]*>/); if (_d !== -1 && text.indexOf('</document>', _d) === -1) text = text + '</document>'; }
  if (!text || typeof text !== 'string') {
    return { segments: [{ type: 'text', content: text || '' }], suggestions: [] };
  }
  // §٢ (C): علامةُ «لم يكتمل» تُقرأ في شريطِ الإجراءات لا في فقاعةِ الجواب، فتُنزَع هنا أوّلاً —
  // قبل `stripIncompleteTags`، لأنّها لو بقيت لبَدَت له وسماً مفتوحاً بلا إغلاق.
  text = ezikStripIncomplete(text);
  // نُنظّف الترميز الناقص قبل التحليل كي لا يظهر "<verse surah=..." كنصّ خام للطفل
  text = stripIncompleteTags(text, { rescue: true });
  const segments = [];
  let suggestions = [];
  let remaining = text;

  // أنماط الوسوم
  const tagPattern = new RegExp(`<(${KNOWN_TAGS})([^>]*)>([\\s\\S]*?)</\\1>`, 'g');
  let lastIndex = 0;
  let match;
  while ((match = tagPattern.exec(text)) !== null) {
    // إضافة النص العادي قبل الوسم
    if (match.index > lastIndex) {
      const plainText = text.slice(lastIndex, match.index).trim();
      if (plainText) segments.push({ type: 'text', content: plainText });
    }
    const tagName = match[1];
    const attrsStr = match[2] || '';
    const content = (match[3] || '').trim();
    if (tagName === 'verse') {
      const surahMatch = attrsStr.match(/surah=["']([^"']+)["']/);
      const surahNumMatch = attrsStr.match(/surah_num=["']([^"']+)["']/);
      const ayahMatch = attrsStr.match(/ayah=["']([^"']+)["']/);
      segments.push({
        type: 'verse',
        content,
        surah: surahMatch ? surahMatch[1] : '',
        surahNum: surahNumMatch ? surahNumMatch[1] : '',
        ayah: ayahMatch ? ayahMatch[1] : '',
      });
    } else if (tagName === 'surah') {
      // سورة كاملة أو مدًى متّصل — بطاقة واحدة، نصّ متّصل، زرّ تلاوة واحد
      const numMatch = attrsStr.match(/num=["']([^"']+)["']/);
      const fromMatch = attrsStr.match(/from=["']([^"']+)["']/);
      const toMatch = attrsStr.match(/to=["']([^"']+)["']/);
      segments.push({
        type: 'surah',
        num: numMatch ? numMatch[1] : '',
        from: fromMatch ? fromMatch[1] : '',
        to: toMatch ? toMatch[1] : '',
      });
    } else if (tagName === 'hadith') {
      const narratorMatch = attrsStr.match(/narrator=["']([^"']+)["']/);
      const rulingMatch = attrsStr.match(/ruling=["']([^"']+)["']/);
      segments.push({
        type: 'hadith',
        content,
        narrator: narratorMatch ? narratorMatch[1] : '',
        ruling: rulingMatch ? rulingMatch[1] : '',
      });
    } else if (tagName === 'dhikr') {
      const dhikrIdMatch = attrsStr.match(/id=["']([^"']+)["']/);
      segments.push({
        type: 'dhikr',
        catId: dhikrIdMatch ? dhikrIdMatch[1] : '',
      });
    } else if (tagName === 'worship') {
      const worshipIdMatch = attrsStr.match(/id=["']([^"']+)["']/);
      segments.push({
        type: 'worship',
        id: worshipIdMatch ? worshipIdMatch[1] : '',
      });
    } else if (tagName === 'source') {
      const siteMatch = attrsStr.match(/site=["']([^"']+)["']/);
      const urlMatch = attrsStr.match(/url=["']([^"']+)["']/);
      segments.push({
        type: 'source',
        content,
        site: siteMatch ? siteMatch[1] : '',
        url: urlMatch ? urlMatch[1] : '',
      });
    } else if (tagName === 'steps') {
      const items = content.split('\n')
        .map(l => l.trim())
        .filter(l => l)
        .map(l => l.replace(/^[-•*]\s*/, '').trim())
        .filter(l => l);
      segments.push({ type: 'steps', items, title: readStepsTitle(attrsStr) });
    } else if (tagName === 'suggestions') {
      const items = content.split('\n')
        .map(l => l.trim())
        .filter(l => l)
        .map(l => l.replace(/^[-•*]\s*/, '').trim())
        .filter(l => l);
      suggestions = items;
    } else if (tagName === 'board') {
      segments.push({ type: 'board', content });
    } else if (tagName === 'document') {
      const titleMatch = attrsStr.match(/title=["']([^"']+)["']/);
      if (deriveCaps(viewerAge).export) {
        segments.push({ type: 'document', title: titleMatch ? titleMatch[1] : 'مستند', content });
      } else {
        segments.push({ type: 'text', content: toPlainText((titleMatch ? titleMatch[1] + '\n\n' : '') + content) });
      }
    }
    lastIndex = match.index + match[0].length;
  }
  // ما بعد آخر وسم
  if (lastIndex < text.length) {
    const plainText = text.slice(lastIndex).trim();
    if (plainText) segments.push({ type: 'text', content: plainText });
  }
  // إن لم نجد وسوماً، النص كله نصّ عادي
  if (segments.length === 0 && !suggestions.length) {
    segments.push({ type: 'text', content: text.trim() });
  }
  // XI-04: the review mark leaves the prose here, LAST — after every card has been separated, so
  // a mark that landed inside a hadith or a source body is not lifted out of a card it belongs to.
  return { segments: ezikLiftNotices(segments), suggestions };
};

// ============================================================
// تحضير النص للصوت (إزالة الوسوم، إنشاء سياق طبيعي)
// ============================================================
const formatForTTS = (text) => {
  if (!text) return '';
  // §٢ (C): العلامةُ لا تُنطَق. هي شارةٌ عن الجواب لا جملةٌ منه، كوسمِ المراجعةِ سواءً بسواء.
  // وقبلَ `stripIncompleteTags` لأنّها لو بقيت لعُدَّت وسماً مقطوعاً فحُذِف ما بعدها.
  // نحذف أي وسم ناقص/بقايا "<...>" قبل أي معالجة كي لا يصل ترميز خام إلى ElevenLabs
  let t = stripIncompleteTags(ezikStripIncomplete(text), { rescue: true });
  // إزالة وسم الاقتراحات بالكامل (UI فقط، لا يُنطق)
  t = t.replace(/<suggestions[^>]*>[\s\S]*?<\/suggestions>/g, '');
  // إزالة بطاقة المصدر بالكامل (UI فقط: شريحة نقرٍ مرئيّة) — لا يُنطَق الرابطُ ولا العنوانُ أبداً، كالاقتراحات
  t = t.replace(/<source[^>]*>[\s\S]*?<\/source>/g, ' ');
  // إزالة الآيات بالكامل من نص الصوت — التلاوة يسمعها الطفل من قارئ حقيقي عبر زر "استمع للتلاوة"،
  // ولا ينطقها صوت الذكاء الاصطناعي أبداً. نستبدلها بمسافة كي يبقى الكلام المحيط متّصلاً.
  t = t.replace(/<verse[^>]*>[\s\S]*?<\/verse>/g, ' ');
  // وكذلك السورة الكاملة: يتلوها القارئ الحقيقي عبر الزرّ، لا ينطقها المربّي
  t = t.replace(/<surah[^>]*>[\s\S]*?<\/surah>/g, ' ');
  // الذكر: يُقرأ من صوت حصن المسلم عبر زرّ البطاقة، لا يُنطَق من المربّي
  t = t.replace(/<dhikr[^>]*>[\s\S]*?<\/dhikr>/g, ' ');
  t = t.replace(/<dhikr[^>]*\/?>/g, ' ');
  // اللوح: يُعرَض مكتوبًا ولا يُنطَق (كالآيات) — يبقى الشرحُ المنطوقُ كلماتٍ سهلة
  t = t.replace(/<board[^>]*>[\s\S]*?<\/board>/g, ' ');
  // المستند: يُقرأ ويُصدَّر مكتوبًا، فلا يُنطَق كاملًا — نستبدله بعبارةٍ قصيرة
  t = t.replace(/<document[^>]*>[\s\S]*?<\/document>/g, ' هذا مستندٌ مكتوبٌ، يمكن قراءتُه وتصديرُه. ');
  t = t.replace(/<document[^>]*>[\s\S]*$/g, ' هذا مستندٌ مكتوبٌ، يمكن قراءتُه وتصديرُه. ');
  // تحويل الأحاديث إلى نص طبيعي للنطق — يجب أن يسبق تجريدَ الأقواس الزاويّة أدناه، وإلا فُقِد الوسم.
  // متسامحٌ مع ترتيب الخصائص وغيابها: نستخرج narrator وruling كلاًّ على حدة، ولا نلفظ أسماء الوسوم نفسها.
  t = t.replace(/<hadith([^>]*)>([\s\S]*?)<\/hadith>/g, (_, attrs, content) => {
    const nm = attrs.match(/narrator=["']([^"']+)["']/);
    const rm = attrs.match(/ruling=["']([^"']+)["']/);
    // الدرجةُ لا تُنطَقُ مرّتين، ولا يُنطَقُ «رَوَى متفق عليه».
    const att = resolveHadithAttribution(nm ? nm[1] : '', rm ? rm[1] : '');
    const body = content.trim();
    let out = att.narrator ? ` رَوَى ${att.narrator}: ${body}.` : ` ${body}.`;
    if (att.ruling) out += ` ${att.ruling}.`;
    return out + ' ';
  });
  // تحويل الخطوات إلى نص طبيعي للنطق — كذلك قبل تجريد الأقواس. نسمح بخصائص اختياريّة على الوسم المفتوح.
  t = t.replace(/<steps([^>]*)>([\s\S]*?)<\/steps>/g, (_, attrs, content) => {
    const items = content.split('\n').map(l => l.trim()).filter(l => l).map(l => l.replace(/^[-•*]\s*/, '').trim()).filter(l => l);
    if (!items.length) return '';
    // العنوانُ من الجواب إن وُجد، وإلّا فالخطواتُ تُنطَقُ بلا عنوانٍ أصلًا.
    const title = readStepsTitle(attrs);
    return (title ? ' ' + title + ': ' : ' ') + items.join(' ثُمَّ ') + '. ';
  });
  // <worship> is resolved to the frozen cell text up-front (resolveWorshipTags).
  // Any tag surviving to here -> a single space (silence): never the raw tag, never model text.
  t = t.replace(/<worship[^>]*>[\s\S]*?<\/worship>/g, ' ');
  t = t.replace(/<worship[^>]*\/?>/g, ' ');
  // ── §٤ — الوسمُ لا يُنطَق (the review mark is a label, not a sentence) ──────
  // K-5/XI-04 made 【…】 a badge on the SCREEN and took the brackets off the CLIPBOARD. The voice
  // was outside that item's scope and was left as it was, so a listener still heard «فهمٌ لا فتوى»
  // read out inside the answer — the one reader of the four still being handed the raw mark.
  // It is a label ABOUT the answer, not a sentence OF it, and nothing else on this page speaks the
  // name of a tag: every angle-bracket tag above is either rewritten to natural speech or silenced.
  //
  // THE INFORMATION IS NOT TAKEN FROM THE READER. The badge is still drawn (`ezikLiftNotices`),
  // and the notice's own sentence — «ما تقدّم فهمٌ مبنيٌّ على ما بين يديّ في هذه الدورة، لا فتوى
  // مسنَدةٌ إلى مفتٍ بعينِه.» — is prose, and is still spoken in full. Only the bracketed LABEL goes.
  //
  // A SPACE AND NOT AN EMPTY STRING. `tag()` appends the mark straight after the full stop
  // («…لا واجبٌ.【فهمٌ لا نصٌّ منقول】»), so deleting it to nothing would weld the sentence that
  // precedes it to the one that follows and ElevenLabs would read the two as a single word.
  t = t.replace(EZIK_NOTICE_ALL, ' ');
  t = t.replace(/^#{1,6}\s+/gm, '').replace(/\*\*([^*]+)\*\*/g, '$1').replace(/[﴿﴾«»""“”‹›\[\]<>]/g, ' ').replace(/[ \t]{2,}/g, ' ');
  // Keep links opaque while pronunciation-only math substitutions run. In particular, neither a
  // trig name in a path nor any slash/query operator in a URL is spoken as mathematics.
  const protectedUrls = [];
  t = t.replace(/\b(?:https?:\/\/|www\.)[^\s<>"'﴿﴾]+/gi, (url) => {
    const token = '\uE000' + String.fromCharCode(0xE100 + protectedUrls.length) + '\uE001';
    protectedUrls.push({ token, url });
    return token;
  });
  // رموزٌ ودوالُّ رياضيّةٌ خارج <board> → أسماؤها المتعارَف عليها (شبكة أمان للنطق)
  const trigNames = { cos: ' كوساين ', sin: ' ساين ', tan: ' تانجنت ' };
  t = t
       .replace(/(^|[^\p{L}\p{N}_])(cos|sin|tan)(?=$|[^\p{L}\p{N}_])/giu,
         (_all, left, name) => left + trigNames[name.toLowerCase()])
       .replace(/π/g, ' باي ').replace(/°/g, ' درجة ').replace(/√/g, ' الجذر التربيعيّ لـ ')
       .replace(/×/g, ' في ').replace(/÷/g, ' على ').replace(/\//g, ' على ')
       .replace(/\+/g, ' زائد ').replace(/−/g, ' ناقص ').replace(/=/g, ' يساوي ')
       .replace(/≤/g, ' أصغر أو يساوي ').replace(/≥/g, ' أكبر أو يساوي ').replace(/≠/g, ' لا يساوي ')
       .replace(/²/g, ' تربيع ').replace(/³/g, ' تكعيب ').replace(/\^/g, ' أُس ').replace(/%/g, ' بالمئة ')
       .replace(/½/g, ' نصف ').replace(/⅓/g, ' ثلث ').replace(/⅔/g, ' ثلثين ').replace(/¼/g, ' ربع ').replace(/¾/g, ' ثلاثة أرباع ');
  // شبكة أمان أخيرة (دفاعٌ في العمق): أيّ اسمِ وسمٍ إنجليزيّ ناجٍ — بقايا وسمٍ مشوّهٍ فلَتَ من
  // المحوّلات أعلاه — يُحذَف كي لا يُنطَق أبداً. نطابق كلماتِ ASCII وحدها عبر \b…\b، فلا يُمَسّ
  // النصُّ العربيّ إطلاقاً (لا حدودَ كلماتٍ ASCII داخله).
  /* tts-num-words */
  // الأعداد المكتوبة رقمًا في النثر المنطوق (خارج <board> المجرَّد أعلاه) → كلماتٍ عربيّةً كي
  // ينطقها ElevenLabs صحيحةً بدل تلعثمٍ رقمًا-رقمًا. العرضُ المرئيُّ لا يتأثّر (نصُّ الصوت فقط)،
  // وأرقامُ <board> لا تُقرأ أصلًا لأنّها حُذِفت قبل هذا السطر.
  {
    const _ones  = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة'];
    const _tens  = ['', 'عشرة', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
    const _teens = ['عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
    const _huns  = ['', 'مئة', 'مئتان', 'ثلاثمئة', 'أربعمئة', 'خمسمئة', 'ستمئة', 'سبعمئة', 'ثمانمئة', 'تسعمئة'];
    const _digitWord = ['صفر', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة'];
    const _three = (n) => {
      const out = [];
      const h = Math.floor(n / 100), r = n % 100;
      if (h) out.push(_huns[h]);
      if (r) {
        if (r < 10) out.push(_ones[r]);
        else if (r < 20) out.push(_teens[r - 10]);
        else { const u = r % 10, tn = Math.floor(r / 10); out.push(u ? _ones[u] + ' و' + _tens[tn] : _tens[tn]); }
      }
      return out.join(' و');
    };
    const _int = (n) => {
      if (n === 0) return 'صفر';
      const out = [];
      const th = Math.floor(n / 1000), r = n % 1000;
      if (th) out.push(th === 1 ? 'ألف' : th === 2 ? 'ألفان' : _three(th) + ' آلاف');
      if (r) out.push(_three(r));
      return out.join(' و');
    };
    const _dbd  = (s) => s.split('').map((d) => _digitWord[+d]).join(' ');
    const _norm = (s) => s.replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
    t = t.replace(/[٠-٩0-9]+(?:[.٫‚][٠-٩0-9]+)?/g, (tok) => {
      const m = tok.match(/^([٠-٩0-9]+)(?:[.٫‚]([٠-٩0-9]+))?$/);
      if (!m) return tok;
      const ip = _norm(m[1]), fp = m[2] ? _norm(m[2]) : null;
      const n = parseInt(ip, 10);
      const iw = (ip.length <= 4 && n <= 9999) ? _int(n) : _dbd(ip);
      return ' ' + (fp === null ? iw : iw + ' فاصلة ' + _dbd(fp)) + ' ';
    });
  }
  t = t.replace(/\b(steps|hadith|narrator|ruling|suggestions|source|verse|surah|board|document)\b/gi, ' ');
  // تنظيف الفراغات
  t = t.replace(/\s+/g, ' ').trim();
  for (const { token, url } of protectedUrls) t = t.split(token).join(url);
  return t;
};

// ============================================================
// تجهيز النص لسجل الأهل (عرض فقط) — مثل formatForTTS لكنه يُبقي نصّ الآية مقروءاً
// ============================================================
// الصوت يحذف الآية (يسمعها الطفل من القارئ)، أما الأهل فيجب أن يَرَوا نصّها في السجلّ.
const formatForLog = (text) => {
  if (!text) return '';
  // §٢ (C): والسجلُّ كذلك — الشارةُ للشاشةِ لا لِنصِّ السجلّ، ونزعُها هنا قبلَ التنظيفِ العامّ.
  // نفس التنظيف: لا نُظهِر للأهل في السجلّ أيّ وسم ناقص أو بقايا "<...>" خام
  let t = stripIncompleteTags(ezikStripIncomplete(text), { rescue: true });
  t = t.replace(/<suggestions[^>]*>[\s\S]*?<\/suggestions>/g, '');
  // المصدر: نُبقي عنوانه نصّاً مقروءاً في سجلّ الأهل (للتحقّق) ونُسقِط الرابط — لا نعرض URL خاماً
  t = t.replace(/<source[^>]*>([\s\S]*?)<\/source>/g, (_, title) => {
    const s = (title || '').trim();
    return s ? ` [المصدر: ${s}] ` : ' ';
  });
  // الآية: نصّها الكنسي من المصحف المُحمَّل (لا من النموذج). إن لم يكن مُحمَّلاً بعد،
  // نعرض المرجع فقط. نتجاهل أيّ نصّ بداخل الوسم تماماً (قد يرسله النموذج خطأً).
  t = t.replace(/<verse([^>]*)>([\s\S]*?)<\/verse>/g, (_, attrs) => {
    const sNum = resolveSurahNumber(
      (attrs.match(/surah=["']([^"']+)["']/) || [])[1],
      (attrs.match(/surah_num=["']([^"']+)["']/) || [])[1]
    );
    const aNum = parseInt((attrs.match(/ayah=["']([^"']+)["']/) || [])[1], 10);
    const name = sNum ? SURAH_NAMES[sNum] : '';
    const ref = [name && `سورة ${name}`, aNum >= 1 && `آية ${aNum}`].filter(Boolean).join('، ');
    const canon = (sNum && aNum >= 1) ? getVerseText(sNum, aNum) : null;
    return canon ? ` «${canon}»${ref ? ` (${ref})` : ''} ` : (ref ? ` [${ref}] ` : ' ');
  });
  // السورة: مرجعٌ مختصرٌ للأهل (الاسم + المدى إن كان جزئياً) — لا نصّ خام
  t = t.replace(/<surah([^>]*)>([\s\S]*?)<\/surah>/g, (_, attrs) => {
    const sNum = resolveSurahNumber(undefined, (attrs.match(/num=["']([^"']+)["']/) || [])[1]);
    const name = sNum ? SURAH_NAMES[sNum] : '';
    const from = parseInt((attrs.match(/from=["']([^"']+)["']/) || [])[1], 10);
    const to = parseInt((attrs.match(/to=["']([^"']+)["']/) || [])[1], 10);
    const rangePart = (from >= 1 && to >= 1) ? `، الآيات ${from}–${to}` : '';
    return name ? ` [تلاوة سورة ${name}${rangePart}] ` : ' ';
  });
  // الحديث والخطوات: نفس تحويل الصوت كي يبقى السجلّ مقروءاً
  // متسامحٌ مع ترتيبِ الخصائصِ وغيابِها كنظيرِه الصوتيّ: كان يشترطُ narrator ثمّ ruling بهذا
  // الترتيبِ حصرًا، فحديثٌ بلا درجةٍ كان يتسرّبُ إلى سجلِّ الأهل وسمًا خامًا.
  t = t.replace(/<hadith([^>]*)>([\s\S]*?)<\/hadith>/g, (_, attrs, content) => {
    const nm = attrs.match(/narrator=["']([^"']+)["']/);
    const rm = attrs.match(/ruling=["']([^"']+)["']/);
    const att = resolveHadithAttribution(nm ? nm[1] : '', rm ? rm[1] : '');
    const body = content.trim();
    let out = att.narrator ? ` رَوَى ${att.narrator}: ${body}.` : ` ${body}.`;
    if (att.ruling) out += ` ${att.ruling}.`;
    return out + ' ';
  });
  // كان يطابقُ `<steps>` عاريةً فقط — فأيُّ خاصّيّةٍ عليها (وعنوانُ الخطواتِ خاصّيّةٌ الآن)
  // كانت تُفلِتُ الوسمَ خامًا إلى سجلِّ الأهل.
  t = t.replace(/<steps([^>]*)>([\s\S]*?)<\/steps>/g, (_, attrs, content) => {
    const items = content.split('\n').map(l => l.trim()).filter(l => l).map(l => l.replace(/^[-•*]\s*/, '').trim()).filter(l => l);
    if (!items.length) return '';
    const title = readStepsTitle(attrs);
    return (title ? ' ' + title + ': ' : ' ') + items.join(' ثُمَّ ') + '. ';
  });
  // ── §٣ — الوسمُ شارةٌ في السجلِّ أيضًا، لا محارفُ خامّ (the mark is a badge here too) ──
  //
  // WHAT WAS STILL WRONG, AND WHY THIS SURFACE WAS THE ONE LEFT. K-5/XI-04 made 【…】 a badge on the
  // SCREEN and took the ornate brackets off the CLIPBOARD; §٤ of the A-3 round took them out of the
  // VOICE. The parents' log was the fourth reader and kept them verbatim, so the surface a parent
  // opens in order to check what their child was told still showed the one defect the owner named
  // about the mark: its shape, «بين قوسينِ غريبين».
  //
  // THE INFORMATION IS NOT TAKEN FROM THE PARENT — that is the whole difference between this and
  // the voice. The voice DROPS the label because a label is not a sentence to be read aloud; the
  // log KEEPS it, because a parent checking an answer needs to know it was understanding rather
  // than a sourced fatwa. Only the shape changes.
  //
  // AND THE SHAPE IT CHANGES TO IS THIS SURFACE'S OWN BADGE, NOT A NEW INVENTION. §٣ allows «شارةٌ
  // أو ما يقومُ مقامَها في سياقِ السجلّ», and the log is a plain-text surface — `formatForLog`
  // returns a string that is rendered into one <div>, so there is no element to draw. What this
  // function already does for every other label it emits is exactly the answer: the source becomes
  // ` [المصدر: …] `, a verse reference becomes ` [سورة …، آية …] `, a recitation becomes
  // ` [تلاوة سورة …] `. So the review mark becomes ` [فهمٌ لا فتوى] ` — set off as a label, in the
  // idiom the parent is already reading on the same line, and without the ornate pair.
  //
  // MATCHED BY THE BRACKETS AND NOT BY THE LABEL TEXT, for the reason §٤ measured: the same label
  // is written with two different mark orders inside lib/output-reviewer.js (shadda before damma at
  // :9, after it at :669) — one NFC, one glyph, different code units — so any match on the label's
  // text would miss one of them. EZIK_NOTICE_ALL is the same constant the screen badge and the
  // voice both use, so all four readers agree on what a mark IS.
  //
  // SPACES ON BOTH SIDES, NOT NONE: `tag()` appends the mark straight after the full stop
  // («…لا واجبٌ.【فهمٌ لا نصٌّ منقول】»), and the whitespace fold below collapses the pair to one.
  t = t.replace(EZIK_NOTICE_ALL, (_all, label) => ' [' + String(label || '').trim() + '] ');
  t = t.replace(/\s+/g, ' ').trim();
  return t;
};

// ============================================================
// Live stream preview: clean prose only — hides all known tags and any leftover "<...>"
// so no raw markup (<surah ...>/<verse ...>) flashes while streaming. Lightweight; display only.
// ============================================================
const formatForStreamPreview = (text) => {
  if (!text) return '';
  let t = stripIncompleteTags(text); // drops the first unclosed known tag + any truncated trailing "<..."
  t = t.replace(/<suggestions[^>]*>[\s\S]*?<\/suggestions>/g, '');
  t = t.replace(/<verse[^>]*>[\s\S]*?<\/verse>/g, ' ');
  t = t.replace(/<surah[^>]*>[\s\S]*?<\/surah>/g, ' ');
  t = t.replace(/<hadith[^>]*>[\s\S]*?<\/hadith>/g, ' ');
  t = t.replace(/<steps[^>]*>[\s\S]*?<\/steps>/g, ' ');
  t = t.replace(/<source[^>]*>[\s\S]*?<\/source>/g, ' '); // hide the source chip (tag + inner title) while streaming
  t = t.replace(/<\/?[a-z][^>]*>/gi, ' '); // any remaining tag
  // S93: horizontal whitespace collapses, NEWLINES SURVIVE. They used to be flattened with
  // everything else, which was harmless while the preview was one run of plain text — but the
  // preview is laid out now, and a heading, a list item and a table row are all defined by the
  // line they sit on. Blank runs are still capped at one, so nothing gapes mid-stream.
  t = t.replace(/[^\S\n]+/g, ' ');   // every whitespace EXCEPT the newline
  t = t.replace(/[ \t]*\n[ \t]*/g, '\n');
  return t.replace(/\n{3,}/g, '\n\n').trim();
};

// ============================================================
// التطبيق
// ============================================================
// ============================================================
// S100 -- THE VISUAL IDENTITY. A THIRD KEY, INDEPENDENT OF THE OTHER TWO.
//
// The app now stores three presentational choices, and they do not know about each other:
//   murabbi_theme_v1      light | dark          -- the colour MODE          (readStoredTheme)
//   ezik_ui_style_v1      journey | deck        -- the home/adhkar LAYOUT   (readEzikUiStyle)
//   ezik_visual_theme_v1  qibla_13 | istana_33  -- the visual IDENTITY      (below)
// Not one line in this block reads or writes either of the other two keys, and neither of
// them reads this one, so all eight combinations are reachable and none of them is a special
// case. A user who saved 'deck' last year still gets deck; a user who saved 'light' still
// gets light; both of them now also get an identity, and it is istana_33 until they say
// otherwise. Choosing an identity does not disturb either older choice.
//
// The reader is TOTAL in the same sense readEzikUiStyle is: an absent key, an unknown word, a
// value of the wrong type and a storage that throws all answer istana_33. Every localStorage
// touch has its own try/catch, so a locked or full storage can change what is SAVED and never
// what is SHOWN. There is no migration and nothing to migrate: this key has never existed.
//
// WHERE IT LANDS. The identity is one attribute on <html>, and the stylesheet does the rest
// (see the S100 block in <style>). It is set THREE times, deliberately: by the boot script
// before the first paint so there is no flash of the other identity; by the writer, before it
// saves, so the press repaints on the spot; and by the hook's effect, which is what makes a
// choice made in ANOTHER TAB arrive here -- the 'storage' event fires only in the other tab.
// Applying it is idempotent, so the three paths cannot fight.
// ============================================================
// S102 -- A PRE-RELEASE KEY BUMP, not a migration. ezik_visual_theme_v1 was never deployed:
// the only devices carrying it are the ones this session's own visual tests wrote qibla_13
// onto, which is exactly why the app opened green. v1 is therefore not read, not migrated
// and not honoured -- it is only DELETED, alongside v2, when a user erases their data.
const EZIK_VISUAL_THEME_KEY = 'ezik_visual_theme_v2';
const EZIK_VISUAL_THEME_KEY_V1 = 'ezik_visual_theme_v1';   // read by nothing; removed on erase
const EZIK_UI_STYLE_KEY_DEAD = 'ezik_ui_style_v1';          // read by nothing; removed on erase
// qibla_13 keeps its token groundwork in the stylesheet for the next batch, but it is NOT a
// reachable value here: the reader does not accept it, the writer normalises it away and
// Settings offers no control that can produce it.
const EZIK_VISUAL_THEME_ISTANA = 'istana_33';
const EZIK_VISUAL_THEME_DEFAULT = EZIK_VISUAL_THEME_ISTANA;
const EZIK_VISUAL_THEME_EVENT = 'ezik-visual-theme';
const EZIK_VISUAL_THEME_ATTR = 'data-ezik-visual-theme';

function readEzikVisualTheme() {
  let raw = null;
  try { raw = localStorage.getItem(EZIK_VISUAL_THEME_KEY); } catch (e) { return EZIK_VISUAL_THEME_DEFAULT; }
  if (raw === EZIK_VISUAL_THEME_ISTANA) return raw;
  return EZIK_VISUAL_THEME_DEFAULT;
}
function applyEzikVisualTheme(v) {
  const next = (v === EZIK_VISUAL_THEME_ISTANA) ? v : EZIK_VISUAL_THEME_DEFAULT;
  try { document.documentElement.setAttribute(EZIK_VISUAL_THEME_ATTR, next); } catch (e) {}
  return next;
}
function writeEzikVisualTheme(v) {
  // paint first, save second: the attribute is what the user sees, and a storage that refuses
  // the write must not also refuse the repaint.
  const next = applyEzikVisualTheme(v);
  try { localStorage.setItem(EZIK_VISUAL_THEME_KEY, next); } catch (e) {}
  try { window.dispatchEvent(new CustomEvent(EZIK_VISUAL_THEME_EVENT, { detail: next })); } catch (e) {}
  return next;
}
function useEzikVisualTheme() {
  const [vtheme, setVtheme] = useState(readEzikVisualTheme);
  useEffect(() => {
    // Both listeners re-READ rather than trust what they were handed, so an event carrying a
    // value this build does not accept still lands on istana_33 instead of on that value.
    const onLocal = () => setVtheme(readEzikVisualTheme());
    const onStorage = (e) => { if (!e || !e.key || e.key === EZIK_VISUAL_THEME_KEY) setVtheme(readEzikVisualTheme()); };
    window.addEventListener(EZIK_VISUAL_THEME_EVENT, onLocal);
    window.addEventListener('storage', onStorage);
    return () => {
      window.removeEventListener(EZIK_VISUAL_THEME_EVENT, onLocal);
      window.removeEventListener('storage', onStorage);
    };
  }, []);
  useEffect(() => { applyEzikVisualTheme(vtheme); }, [vtheme]);
  return vtheme;
}

  ];
}
