<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1D4ED8">
<!-- S96: the UA reads this BEFORE any CSS parses, so it knows a dark rendering is supported and
     paints its default canvas accordingly instead of assuming white. -->
<meta name="color-scheme" content="light dark">
<!-- S96 THEME BOOT. This MUST stay above every <link rel="stylesheet">.
     It used to sit below the Google Fonts link, and that was the white-flash bug: per the HTML
     spec a <script> does not execute until all PENDING STYLESHEETS have loaded, because it might
     query computed style. So on a cold launch this script waited on fonts.googleapis.com over
     mobile data -- and for that whole second the document had no data-theme, no parsed <style>,
     and the UA painted its default WHITE canvas before the dark app appeared underneath it.
     The old comment claimed it ran "BEFORE the stylesheet that reacts to it"; that was true of
     the inline <style> below and missed the external one above.
     Three things are set here, in order of when they matter:
       colorScheme  -- the UA's own canvas/scrollbar/form default, honoured before CSS
       background   -- an inline paint on <html>, so the very first frame is already the right
                       colour even if the stylesheet has not arrived
       data-theme   -- what the stylesheet keys off once it does arrive
     Fails to light, exactly as before. -->
<script>(function(){try{var t=localStorage.getItem('murabbi_theme_v1');if(t!=='dark'&&t!=='light'){t='light';}var d=document.documentElement;d.setAttribute('data-theme',t);d.style.colorScheme=t;d.style.background=(t==='dark'?'#0E1116':'#F1F6FD');var m=document.querySelector('meta[name="theme-color"]');if(m){m.setAttribute('content',t==='dark'?'#0E1116':'#1D4ED8');}}catch(e){}})();(function(){try{var v=localStorage.getItem('ezik_visual_theme_v1');if(v!=='qibla_13'&&v!=='istana_33'){v='istana_33';}document.documentElement.setAttribute('data-ezik-visual-theme',v);}catch(e){}})();</script>
<!-- S99: the reading preferences, applied BEFORE the first paint for the same reason the theme is.
     Read here and the interface draws once at the chosen size; read after React mounts and the
     user watches it resize. It reads the active profile's id from the profile the app already
     stores, touches nothing else, and every failure path leaves the defaults in place. -->
<script>(function(){try{var p=null;try{p=JSON.parse(localStorage.getItem('child_profile')||'null');}catch(e){}var pk=(p&&typeof p.pid==='string'&&p.pid)?p.pid:'anon';var m=null;try{m=JSON.parse(localStorage.getItem('ezik_reading_prefs_v1')||'null');}catch(e){}var r=(m&&typeof m==='object'&&!Array.isArray(m))?m[pk]:null;if(!r||typeof r!=='object'){return;}var S={normal:1,large:1.14,xlarge:1.28};var f=(typeof r.fontSize==='string'&&S[r.fontSize])?r.fontSize:'normal';var d=document.documentElement;d.style.setProperty('--ez-fs',String(S[f]));d.setAttribute('data-ez-fs',f);if(r.reading===true){d.setAttribute('data-ez-read','1');}if(r.reduceMotion===true){d.setAttribute('data-ez-motion','reduce');}}catch(e){}})();</script>

<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>عزك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Session 74 -- the mushaf asset origin. Inert when the flag is off: a preconnect is a
     hint, it fetches nothing. Bare form (not crossorigin) on purpose -- the page SVG is
     loaded as an <img> src, a no-CORS request, which will not reuse a CORS-mode socket. -->
<link rel="preconnect" href="https://mushaf.almurabbi.app">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&family=Amiri+Quran&family=Noto+Kufi+Arabic:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red:#1D4ED8; --red-deep:#12327A; --red-lift:#2AA6DE; --red-soft:#E6EEFB;
    --black:#141414; --ink:#1A1A1A; --muted:#6E6E6E; --nav-off:#93A0B8;
    --white:#FFFFFF; --page:#F1F6FD; --line:#E5EBF5; --tint:#EDF1FA;
    --scholar:#6B4A2B; --radius-card:22px; --radius-btn:16px;
    /* D88. Three tokens split roles that ONE token used to carry. Every light value below
       is byte-for-byte the value those sites already resolved to, so LIGHT RENDERS EXACTLY
       AS IT DID BEFORE THIS PHASE. Only the dark block gives them a second value.
       --on-accent   foreground sitting ON the blue accent   (was --white, which also means 'card')
       --accent-fill solid accent UNDER white text           (was --red, which also means 'accent text')
       --verse-ink   the ayah text on the verse card         (was --red-deep, which is also a gradient END) */
    --on-accent:#FFFFFF; --accent-fill:#1D4ED8; --verse-ink:#12327A;
    /* S95. A FOURTH split of the same kind, for the same reason. --red-deep was carrying three
       jobs at once: accent TEXT on a page or card, a solid/gradient FILL under white text, and
       a STROKE on the mushaf's hardcoded paper. Those three want opposite things the moment the
       page goes dark -- text must get lighter, fill and stroke must stay dark. --accent-ink is
       the text role, and its light value is byte-for-byte the #12327A those sites already
       resolved to, so LIGHT DOES NOT MOVE. Only the dark block gives it a second value.
       --mushaf-desk / --madina-desk: the surface the Quran sheet lies ON. The sheet itself is
       never inverted -- the desk around it is. */
    --accent-ink:#12327A; --mushaf-desk:#EDE7DB; --madina-desk:#FDFDFD;
    /* the on-colour for the .adhkar3/.ezhome accent fill. In dark that fill becomes a LIGHT
       blue, so white-on-it drops to 2.7:1 -- the ink has to darken instead. */
    --a3-on-blue:#FFFFFF;
    /* the warn banner (a failed reply, a blocked mic) and the wird pill that floats over the
       mushaf desk. Both were literals; both light values below are those literals unchanged. */
    --warn-bg:#FFF4E5; --warn-line:#F0C674; --warn-ink:#8B5A00;
    --wird-pill:rgba(255,255,255,0.92);
    /* the pre-React boot paint. The loading screen is the only thing drawn before the chat. */
    --boot-bg:linear-gradient(135deg, #F1F6FD 0%, #E5EBF5 100%);
    /* S100. Four more role splits of exactly the kind D88 and S95 made, and for the same
       reason: a visual theme has to be able to move ONE of these jobs without dragging the
       others with it. Every light value below is byte-for-byte what those sites already
       resolved to, so with no theme attribute the page renders as it did before this phase.
         --ez-ui-font    the interface face. Was the literal 'Tajawal', sans-serif, repeated
                         in 47 inline styles and in body{}. Amiri and Amiri Quran are NOT in
                         here: the Quran's own face is not a themeable choice.
         --ez-focus      the keyboard focus ring. Was --red-lift on three rules and --a3-cyan
                         on a fourth, so a theme could not repaint the ring without also
                         repainting a gradient end and a decorative dot. Now it cannot.
         --ez-radius-sig the SIGNATURE radius of the one hero component. Was the literal 18.
         --welcome-*     the first-run welcome surface. Its background was --black and its
                         text was --on-accent/--nav-off, which is why the two could never
                         move together; in dark --black even resolved LIGHT under white text. */
    --ez-ui-font:'Tajawal', sans-serif;
    --ez-focus:#2AA6DE; --ez-radius-sig:18px;
    --welcome-bg:#141414; --welcome-ink:#FFFFFF; --welcome-ink2:#93A0B8;
    /* The settings PREVIEWS. Two swatch sets, one per visual theme, so a preview can show the
       identity a user has NOT selected. They are literals on purpose -- a preview that read
       the live tokens would draw the same two cards twice -- and they are declared here rather
       than inline so no style key carries a hardcoded colour. They do not follow data-theme:
       the preview shows the LIGHT face of each theme, which is what the choice is about. */
    --vtp-q-page:#FFFFFF; --vtp-q-surface:#F8FBFA; --vtp-q-line:#D6E3DF;
    --vtp-q-accent:#006B61; --vtp-q-accent2:#C48A27; --vtp-q-ink:#123C37;
    --vtp-i-page:#FFFFFF; --vtp-i-surface:#FFFDFC; --vtp-i-line:#C8DDE2;
    --vtp-i-accent:#0B5F8E; --vtp-i-accent2:#C43E38; --vtp-i-ink:#10364E;
    color-scheme: light;
  }
  /* D88 DARK. Document level: only the boot paint and the browser's own UI colours, so a
     stored dark theme is on screen before the first pixel and there is no light flash. */
  :root[data-theme="dark"] { --boot-bg:#0E1116; color-scheme: dark; }
  :root[data-theme="dark"] body { background:#0E1116; }
  /* S95 DARK, DOCUMENT-WIDE. This block used to be `:root[data-theme="dark"] .theme-dark`, and
     that selector WAS the bug: only the chat container, the settings sheet, the home and the
     adhkar ever carried .theme-dark, so onboarding, the parental dashboard, the mushaf chrome,
     the memoriser, the call screen and every dialog kept the LIGHT palette while the user had
     asked for dark. Dark mode was opt-in per subtree, and most subtrees never opted in.
     It now sits on :root, so custom properties inherit into every screen and a surface has to
     opt OUT rather than opt in. Exactly one thing opts out, and it is named below:
       .mushaf-paper -- the Quran sheet. A page of the Quran is a page; the brief forbids
                        inverting it, so the sheet keeps its light tokens and the DESK around it
                        goes dark instead (--mushaf-desk / --madina-desk).
     .theme-dark is left on the elements that carry it: it is now inert, and removing it would
     touch markup this change has no reason to touch. */
  :root[data-theme="dark"] {
    --red:#5B8DEF; --red-deep:#2B4FA8; --red-lift:#2AA6DE; --red-soft:#18243C;
    --black:#F2F4F8; --ink:#E6EAF2; --muted:#9AA4B5; --nav-off:#6B7689;
    --white:#171B24; --page:#0E1116; --line:#2A313D; --tint:#1E242F;
    --scholar:#8A6136;
    --on-accent:#FFFFFF; --accent-fill:#2E56C4; --verse-ink:#A8C6FF;
    /* accent TEXT has to lighten as the page darkens; the FILL and the mushaf STROKE must not,
       which is why they are no longer the same token. The desk darkens; the sheet does not. */
    --accent-ink:#A8C6FF; --mushaf-desk:#15171C; --madina-desk:#15171C;
    --a3-on-blue:#0A1020;
    --warn-bg:#3A2A12; --warn-line:#7A5A1E; --warn-ink:#F5C97A;
    --wird-pill:rgba(23,27,36,0.92);
    /* S100. The welcome surface, which had no dark value at all: it painted var(--black),
       and --black INVERTS, so choosing dark turned the first-run screen #F2F4F8 while its
       title stayed --on-accent white. White on near-white. It has its own tokens now. */
    --welcome-bg:#0E1116; --welcome-ink:#F2F4F8; --welcome-ink2:#9AA4B5;
    color-scheme: dark;
  }
  /* The Quran sheet opts out, and only the sheet. Everything it paints -- the paper, the rules,
     the corner motifs, the page medal -- is measured against a light background, so the tokens
     it reads are pinned back to their light values here. This is the SAME mechanism .adhkar3
     already uses (a scoped re-declaration), not a second theme system. */
  :root[data-theme="dark"] .mushaf-paper {
    --red:#1D4ED8; --red-deep:#12327A; --red-lift:#2AA6DE; --red-soft:#E6EEFB;
    --ink:#1A1A1A; --muted:#6E6E6E; --white:#FFFFFF; --line:#E5EBF5; --tint:#EDF1FA;
    --accent-ink:#12327A; --on-accent:#FFFFFF; --accent-fill:#1D4ED8;
    color-scheme: light;
  }
  /* Session 13.1 Welcome/Onboarding reskin - press state for the red primary CTA */
  .welcome-primary:active { background: var(--red-deep) !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: var(--ez-ui-font);
    background: var(--page);
    direction: rtl;
    -webkit-font-smoothing: antialiased;
  }
  #root { height: 100vh; height: 100dvh; }
  input:focus { outline: none; border-color: var(--red-deep) !important; }
  button { font-family: inherit; }
  button:active { transform: scale(0.97); }
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  /* Live call screen ring pulse (Layer 1) */
  @keyframes callPulse {
    0%, 100% { transform: scale(0.92); opacity: 0.55; }
    50% { transform: scale(1.08); opacity: 1; }
  }
  /* S95: a rendered reply is drawn on --white, which is now dark in dark mode, so its headings
     and its table cannot stay pinned to #12327A/#EDF1FA. Light values are unchanged. */
  .doc-rendered h1{font-size:18px;color:var(--accent-ink);margin:10px 0 6px}
  .doc-rendered h2{font-size:16px;color:var(--accent-ink);margin:9px 0 5px}
  .doc-rendered h3{font-size:14.5px;color:var(--accent-ink);margin:8px 0 4px}
  .doc-rendered h4{font-size:13.5px;color:var(--accent-ink);margin:7px 0 4px}
  .doc-rendered p{margin:6px 0}
  .doc-rendered ul,.doc-rendered ol{margin:6px 1.2em 6px 0;padding:0}
  .doc-rendered li{margin:3px 0}
  .doc-rendered strong{font-weight:700}
  .doc-rendered table{border-collapse:collapse;width:100%;margin:8px 0}
  .doc-rendered th,.doc-rendered td{border:1px solid var(--line);padding:5px 8px;text-align:right}
  .doc-rendered th{background:var(--tint);color:var(--accent-ink)}
  /* Session 84 -- Adhkar UI V2. Exactly two things an inline style cannot express: a media
     query and :focus-visible. Both selectors are NEW class names used only by the two V2
     components, so ?adhkarui=0 (the S13.3-A screen, which carries neither class) renders
     byte-identically with these rules present. The grid is 2 columns on a phone and steps to
     3 then 4 on wider displays -- never more, so a tile never shrinks to a chip on a desktop. */
  .adhkar2-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media (min-width:600px){.adhkar2-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:900px){.adhkar2-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  /* Keyboard only: :focus-visible does not fire on touch, so the ring appears for a tabbing
     reader and never as a stuck outline after a tap. Drawn in a token, so it stays visible
     on the white top row, on the white cards and on the reading surface alike. */
  .adhkar2-focus:focus-visible{outline:3px solid var(--ez-focus);outline-offset:2px}
  /* S98 -- the reply controls (fold, quote, quick actions, favourites, search). The same
     keyboard-only ring the adhkar screens use, in the same token, so it stays visible on the
     bubble surface and on the drawer alike. Touch never sees it; a tabbing reader always does. */
  .ezik-focus:focus-visible{outline:3px solid var(--ez-focus);outline-offset:2px}
  /* S98 -- reduced motion. Everything this phase adds is motionless BY CONSTRUCTION: no
     keyframes, no transition, no smooth scroll, and the fold chevron flips in one step. The rule
     below is the belt to that braces -- it neutralises any animation or transition on an S98
     surface should one ever be added -- and it is scoped to the two S98 class names ALONE. A
     blanket `*{animation:none}` is deliberately NOT written: the mushaf's page turn resolves a
     promise on animationend, and freezing it would hang that screen forever (see the S-note at
     the flip-scheduler). Nothing outside these two classes is touched. */
  @media (prefers-reduced-motion: reduce) {
    .ezik-focus, .ezik-focus *, .ezik-panel, .ezik-panel * { animation: none !important; transition: none !important; }
  }
  /* S99 -- READING MODE. It opens the lines up and nothing else: no colour moves, no element is
     hidden, no card or source or button is touched, and the text itself is not altered by a single
     character. Line-height is the one property that makes a long Arabic paragraph comfortable, and
     it is the only one this mode changes. Scoped to the prose surfaces by class so a card body, a
     button label and the mushaf page are all outside it. */
  :root[data-ez-read="1"] .ez-prose { line-height: 2.15 !important; letter-spacing: 0.15px; }
  :root[data-ez-read="1"] .ez-prose p,
  :root[data-ez-read="1"] .ez-prose li { margin-block: 0.5em; }
  /* S99 -- REDUCED MOTION, the LOCAL preference. The media query above answers the platform
     setting; this answers the switch in الإعدادات, and the two are deliberately separate rules so
     either one alone is enough. Both stop at DECORATION: the typing dots keep animating, because
     a loading indicator that stands still is a broken loading indicator, and the mushaf page turn
     keeps its animation because it resolves a promise on animationend and freezing it would hang
     that screen forever. */
     A CLASS, NOT AN ATTRIBUTE MATCH. The first version of this rule selected the animated
     elements with [style*="fadeIn"], which forces the style engine to substring-search the inline
     style attribute of EVERY element on every recalculation. Measured, interleaved: it cost
     +0.74 ms on opening the menu (Welch t=2.41 over 325 opens a side) because the drawer is fifty
     elements with long inline styles. `ez-anim` marks the four places that actually animate, and
     the cost went with it. */
  :root[data-ez-motion="reduce"] { scroll-behavior: auto !important; }
  :root[data-ez-motion="reduce"] .ez-anim { animation: none !important; }
  :root[data-ez-motion="reduce"] .ezik-focus,
  :root[data-ez-motion="reduce"] .ezik-focus *,
  :root[data-ez-motion="reduce"] .ezik-panel,
  :root[data-ez-motion="reduce"] .ezik-panel * { animation: none !important; transition: none !important; }
  /* S99 -- the keyboard focus ring, on every control this phase touches. Same token, same shape
     as the ring the adhkar screens and the S98 controls already use. */
  .ez-a11y-opt:focus-visible { outline: 3px solid var(--ez-focus); outline-offset: 2px; }
  /* Session 85/86 -- the DUAL STYLE palette, and it is a SCOPED token set, not a global one:
     every declaration below lives on .adhkar3 and .ezhome, classes carried only by the four
     adhkar presentation components and the two home ones, so nothing outside them -- not the
     mushaf paper, not the chat, not the call screen, not DhikrCard, not V1 -- can read one of
     these values. Session 86 added the second selector and changed nothing else in the two
     rules; every value in them is the value session 85 shipped. Light is pure white cards on
     a very pale ice-blue page with royal blue, navy and a restrained cyan accent; there is no
     ivory, cream, tan, gold, brown or green in either row. Dark keeps the SAME structure on
     cool navy surfaces, so the reading surface stays usable without a warm paper anywhere. */
  /* Session 86 -- .ezhome joins the SAME scoped token set, because the selector now governs
     Home and Adhkar together and the two surfaces must not drift apart. It is a NEW class
     carried only by the two home presentation components: the chat container, the call
     screen, DhikrCard, the mushaf paper and V1 carry neither class, so not one of them can
     read a value from here. Nothing global is declared; the two selectors below are the
     whole of the addition. */
  .adhkar3,.ezhome{--a3-page:#F4F9FF;--a3-surface:#FFFFFF;--a3-line:#E1EAF9;--a3-ice:#DCEAFB;
    --a3-ink:#0B2455;--a3-muted:#5A6B8A;--a3-blue:#2454D7;--a3-navy:#0B2455;--a3-cyan:#20C7E8;
    --a3-soft:#EEF4FE;--a3-shadow:0 2px 12px rgba(36,84,215,0.07);--a3-lift:0 8px 26px rgba(36,84,215,0.11)}
  :root[data-theme="dark"] .adhkar3,:root[data-theme="dark"] .ezhome{--a3-page:#0A1020;--a3-surface:#121A2C;--a3-line:#263554;--a3-ice:#1C2A45;
    --a3-ink:#E7EEFB;--a3-muted:#A2B2CE;--a3-blue:#6E9BFF;--a3-navy:#0A1020;--a3-cyan:#3FD6F5;
    --a3-soft:#18233A;--a3-shadow:0 2px 12px rgba(0,0,0,0.34);--a3-lift:0 8px 26px rgba(0,0,0,0.42)}
  /* The two things an inline style cannot express, both of them scoped to .ezhome-* class
     names that exist nowhere else in this file. The journey path is two balanced columns on
     a phone already (cards alternate around the route), so a wide display only needs the
     reading column to stop being a phone-width ribbon. S87: the quick-row grid went out with
     the duplicated row it laid out -- every module is drawn once, by the deck itself. */
  .ezhome-wrap{width:100%;max-width:640px;margin:0 auto}
  @media (min-width:900px){.ezhome-wrap{max-width:900px}}
  .ezhome-focus:focus-visible{outline:3px solid var(--ez-focus);outline-offset:2px}
  /* ========================================================================
     S100 -- THE VISUAL THEMES. A THIRD SETTING, INDEPENDENT OF THE OTHER TWO.

     There are now three orthogonal choices and they compose in every combination:
       murabbi_theme_v1      light | dark              -- the COLOUR MODE
       ezik_ui_style_v1      journey | deck            -- the home/adhkar LAYOUT
       ezik_visual_theme_v1  qibla_13 | istana_33      -- the VISUAL IDENTITY (this block)
     Nothing below reads or writes either of the first two keys, and neither of them reads
     this one. 2 x 2 x 2 = eight renderings, and all eight are real.

     THE SHAPE OF IT. Each identity declares its own --vt-* namespace and NOTHING ELSE
     declares one; a second block then MAPS the app's existing role tokens onto that
     namespace. That is why no screen had to be repainted by hand and why a screen added
     later inherits the identity for free: it reads --page, --white, --ink like every other
     screen, and --page is already var(--vt-page) by the time it mounts. The mapping block
     sits AFTER :root[data-theme="dark"] and carries the same specificity, so it wins on
     order; the .adhkar3/.ezhome mapping sits after the dark .adhkar3 rule for the same
     reason. Both facts are load-bearing -- do not move these rules up the file.

     THE BACKGROUND INVARIANT. In light, --vt-page is #FFFFFF in BOTH identities, and it is
     a solid colour: there is no background-image, no gradient, no repeating anything, no
     ::before ornament and no watermark on any page root in this block. --boot-bg, which is
     a gradient in the base palette, is flattened to that same solid page. Theme geometry is
     allowed only INSIDE bounded components, which is what --vt-radius-sig is for: in
     istana_33 it turns the one hero component into an Ottoman arch, and it is a border
     radius on that component, not a pattern behind the app.

     THE QURAN OPTS OUT, in light as well as in dark. .mushaf-paper already pinned itself
     back to the base light tokens under data-theme=dark; it now does the same under a visual
     theme, so the sheet, its rules, its corner motifs and its medal are the same pixels in
     all eight renderings. The DESK the sheet lies on is chrome and does follow the identity.
     ===================================================================== */
  :root[data-ezik-visual-theme="qibla_13"]{
    --vt-page:#FFFFFF; --vt-surface:#F8FBFA; --vt-surface2:#EDF3F1;
    --vt-ink:#123C37; --vt-muted:#5E716D;
    --vt-accent:#006B61; --vt-accent2:#C48A27;
    --vt-line:#D6E3DF;
    --vt-radius:18px; --vt-radius-sig:18px;
    --vt-shadow:0 16px 48px rgba(0,84,76,.10);
    --vt-focus:#00544C;
    /* derived roles, each one a job the identity tokens above cannot do on their own:
       -ink   accent as TEXT on a light surface, which has to clear 4.5:1
       -deep  accent as the far end of a fill under white text
       -soft  accent at chip strength, a surface and never a text colour
       accent2 is the gold: at #C48A27 it is decoration, so its TEXT role is a darker gold. */
    --vt-on-accent:#FFFFFF; --vt-accent-ink:#00544C; --vt-accent2-ink:#6E4B0E;
    --vt-on-accent2:#0E2B27;
    --vt-deep:#03453F; --vt-soft:#E4EFEC;
    --vt-font:'Noto Kufi Arabic', Tahoma, sans-serif;
  }
  /* Dark stays dark: the page is a deep pine, not an inverted white. Specificity (0,3,0)
     against the light block's (0,2,0), so the mode wins wherever the two disagree. */
  :root[data-theme="dark"][data-ezik-visual-theme="qibla_13"]{

<!-- S97 PERF. html2pdf.bundle (906KB) and mammoth.browser (636KB) used to sit RIGHT HERE as two
     render-blocking <script> tags, and nothing on the first screen touches either of them:
     html2pdf is reached only by «تصدير PDF» inside a document card, and mammoth only by attaching
     a .docx. Measured cold on a 4x-throttled mobile profile with the network taken out of the
     picture entirely, parsing and executing those two bundles cost 813ms and 204ms BEFORE
     DOMContentLoaded could fire -- a quarter of the whole boot -- and on real mobile data they
     also put 1.5MB in front of the first paint.
     Each is now fetched the first time its own feature is actually used, and never otherwise, so
     a session that never exports a PDF never pays for html2pdf at all. Both call sites await this
     same promise before their existing checks, so the OUTPUT is unchanged -- the same PDF, the
     same extracted text; only the first use of each tool waits for its download.
     An eager warm-on-idle was measured first and REJECTED: parsing 1.5MB right after the first
     paint landed inside the user's first interactions and cost +37% on closing the side menu and
     +28% on back, which is a worse trade than a one-time wait on a deliberate, rare export.
     The URLs, the SRI hashes and the crossorigin mode are byte-for-byte the ones the tags carried,
     so the supply-chain pin is unchanged -- recon-audit reads these literals. A load failure
     resolves null, which lands on the same `!window.html2pdf` / `!window.mammoth` fallbacks that
     already existed for a dead CDN. -->
<script>
window.__ezikVendor = (function () {
  var pending = {};
  var SRC = {
    html2pdf: ['https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js', 'sha384-aBc0BOllaGWrQx51DYt978St/L7B+21jzNGc4N/jnGD0NxGwj8S/ftRgW0AkXIak'],
    mammoth: ['https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js', 'sha384-t9eMqh3OtJXZhvLtmol8r2+23t6vg1GDo1UeyP55BEQdCI67GW2u8Nso+Yzo5m9r']
  };
  function load(name) {
    if (window[name]) return Promise.resolve(window[name]);
    if (pending[name]) return pending[name];
    pending[name] = new Promise(function (resolve) {
      var spec = SRC[name];
      if (!spec) return resolve(null);
      var s = document.createElement('script');
      s.src = spec[0];
      s.integrity = spec[1];
      s.crossOrigin = 'anonymous';
      s.async = true;
      s.onload = function () { resolve(window[name] || null); };
      s.onerror = function () { resolve(null); };
      document.head.appendChild(s);
    });
    return pending[name];
  }
  return load;
})();
</script>

const normalizeForRecite = (str) => (str || '')
  .replace(/[ً-ٰٟۖ-ۭـ]/g, '')
  .replace(/[آأإٱ]/g, 'ا')
  .replace(/ة/g, 'ه')
  .replace(/ى/g, 'ي')
  .replace(/\s+/g, ' ')
  .trim();
// Tokenize on whitespace AFTER normalizing — standalone pause-mark glyphs normalize to '' and
// are dropped by filter(Boolean), so they never count as words.
const tokenizeForRecite = (str) => normalizeForRecite(str).split(/\s+/).filter(Boolean);

const collapseRepeats = (text) => {
  let words = (text || '').split(/\s+/).filter(Boolean);
  if (words.length < 3) return text;
  let changed = true, guard = 0;
  while (changed && guard++ < 12) {
    changed = false;
    for (let w = 1; w <= 4; w++) {
      const out = [];
      let i = 0;
      while (i < words.length) {
        let reps = 1;
        while (i + (reps + 1) * w <= words.length) {
          let same = true;
          for (let j = 0; j < w; j++) {
            if (words[i + j] !== words[i + reps * w + j]) { same = false; break; }
          }
          if (!same) break;
          reps++;
        }
        if (reps >= 3) {
          for (let r = 0; r < 2; r++)
            for (let j = 0; j < w; j++) out.push(words[i + j]);
          i += reps * w;
          changed = true;
        } else {
          out.push(words[i]);
          i++;
        }
      }
      words = out;
    }
  }
  return words.join(' ');
};

// Lenient per-word similarity: a heard word this close to an expected word counts as correct.
// False red in the Quran is worse than a missed slip (Musaed), so the bar is forgiving.
const RECITE_LENIENT_THRESHOLD = 0.8;

// Normalized Levenshtein ratio (1 - dist/maxLen) on two already-normalized tokens. Cheap
// single-row DP; ayat are short.
const wordSim = (a, b) => {
  if (a === b) return 1;
  if (!a || !b) return 0;
  const m = a.length, n = b.length;
  let prev = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
    }
    prev = cur;
  }
  const maxLen = Math.max(m, n);
  return maxLen === 0 ? 1 : 1 - prev[n] / maxLen;
};

// Word-level alignment of the child's heard tokens against the expected ayah tokens, via LCS
// with (wordSim >= threshold) as the equality predicate (tolerates near-misses, skips, extras,
// minor order wobble). Returns a per-expected-word state:
//   'matched'  — part of the alignment (child said a close-enough word) → black
//   'mismatch' — BEFORE the furthest matched index but not aligned (reached past it, got it
//                wrong/substituted/skipped) → red
//   'pending'  — at/after the furthest matched index (not reached yet) → dim, NEVER red
// "pending never red" biases hard against false reds: silence / slow pace shows dim, not wrong.
const alignRecite = (expected, heard) => {
  const m = expected.length, n = heard.length;
  if (m === 0) return [];
  const close = (e, h) => wordSim(e, h) >= RECITE_LENIENT_THRESHOLD;
  // dp[i][j] = LCS length of expected[i..], heard[j..]
  const dp = Array.from({ length: m + 1 }, () => new Int32Array(n + 1));
  for (let i = m - 1; i >= 0; i--) {
    for (let j = n - 1; j >= 0; j--) {
      dp[i][j] = close(expected[i], heard[j])
        ? dp[i + 1][j + 1] + 1
        : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const matched = new Array(m).fill(false);
  let i = 0, j = 0;
  while (i < m && j < n) {
    if (close(expected[i], heard[j])) { matched[i] = true; i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
    else j++;
  }
  let furthest = -1;
  for (let k = 0; k < m; k++) if (matched[k]) furthest = k;
  const states = new Array(m);
  for (let k = 0; k < m; k++) states[k] = matched[k] ? 'matched' : (k < furthest ? 'mismatch' : 'pending');
  return states;
};

// Reused verbatim from the chat/call mic's not-supported message (line ~1526) — not new copy.
const RECITE_NO_SR = '🚫 متصفحك لا يدعم التعرف على الصوت. استخدم Chrome أو Safari.';

// خريطة مطبَّعة تُبنى مرة واحدة من SURAH_NUMBERS للبحث المرن بالاسم
const SURAH_NUMBERS_NORM = {};
for (const _k in SURAH_NUMBERS) { SURAH_NUMBERS_NORM[normalizeArabic(_k)] = SURAH_NUMBERS[_k]; }

// خريطة عكسية رقم→اسم (أول اسم لكل رقم = الاسم الأساسي) — لعنوان بطاقة الآية
// عندما يرسل النموذج surah_num فقط بلا اسم سورة.
const SURAH_NAMES = {};
for (const _name in SURAH_NUMBERS) { const _n = SURAH_NUMBERS[_name]; if (!SURAH_NAMES[_n]) SURAH_NAMES[_n] = _name; }

// Revelation place per the standard Egyptian (1924) mushaf header classification.
// These 28 surahs are Medinan (مدنية); all others are Meccan (مكية).
const MEDINAN_SURAHS = new Set([2,3,4,5,8,9,13,22,24,33,47,48,49,55,57,58,59,60,61,62,63,64,65,66,76,98,99,110]);
const revelationLabel = (n) => MEDINAN_SURAHS.has(n) ? 'مدنية' : 'مكية';

// ============================================================
// المصحف الكنسي (Hafs/Uthmani) — يُحمَّل مرة واحدة من /quran-uthmani.json
// ============================================================
// مصدر موثوق (quran.com text_uthmani، مطابق لترقيم تلاوة القارئ في everyayah).
// نصّ الآية يُعرَض من هذا المصدر فقط — لا من مخرجات النموذج أبداً.
// مفتاح الوصول: `${surahNum}:${ayah}` بالأرقام الصحيحة (نفس مفاتيح رابط الصوت).
let __quranData = null;       // الكائن المُحمَّل (مخزَّن في الذاكرة)
let __quranPromise = null;    // وعدٌ جارٍ لمنع جلب مكرّر
const loadQuran = () => {
  if (__quranData) return Promise.resolve(__quranData);
  if (!__quranPromise) {
    // Promise.resolve().then(...) يضمن أنّ أيّ خطأ (حتى غياب fetch) يصبح رفضاً
    // لا رميةً متزامنة — فلا ينكسر استدعاء loadQuran().catch(...) أبداً.
    __quranPromise = Promise.resolve()
      .then(() => fetch('/quran-uthmani.json'))
      .then((r) => { if (!r.ok) throw new Error('quran fetch ' + r.status); return r.json(); })
      .then((d) => { __quranData = d; return d; })
      .catch((e) => { __quranPromise = null; throw e; }); // اسمح بإعادة المحاولة لاحقاً
  }
  return __quranPromise;
};
// نصّ الآية الكنسي أو null (لا يقع أبداً على نصّ النموذج)
const getVerseText = (sNum, aNum) => {
  if (!__quranData || !(sNum >= 1) || !(aNum >= 1)) return null;
  return __quranData[`${sNum}:${aNum}`] || null;
};
// ============================================================
// أذكار حصن المسلم — تُحمَّل مرة واحدة (كنمط loadQuran). النصّ يأتي حصراً من
// adhkar.json المجلوب من حصن المسلم، لا من النموذج — كالآيات تماماً.
// ============================================================
let __adhkarData = null;      // { byId: {id -> dhikr}, byCat: {catId -> [dhikr]} }
let __adhkarPromise = null;
const loadAdhkar = () => {
  if (__adhkarData) return Promise.resolve(__adhkarData);
  if (!__adhkarPromise) {
    __adhkarPromise = Promise.resolve()
      .then(() => fetch('/adhkar.json'))
      .then((r) => { if (!r.ok) throw new Error('adhkar fetch ' + r.status); return r.json(); })
      .then((raw) => {
        const byId = {}, byCat = {};
        (raw.adhkar || []).forEach((d) => {
          byId[d.id] = d;
          (byCat[d.categoryId] = byCat[d.categoryId] || []).push(d);
        });
        __adhkarData = { byId, byCat, categories: raw.categories || [] };
        return __adhkarData;
      })
      .catch((e) => { __adhkarPromise = null; throw e; });
  }
  return __adhkarPromise;
};
// worship-display.json — the CLIENT-rendered worship text. Loaded once (same shape as
// loadAdhkar). GENERATED from worship-golden.json by build-worship-display.cjs; never the model.
let __worshipData = null;     // { cells: { "id:band" -> { rawHash, band, chars, text } } }
let __worshipPromise = null;
const loadWorship = () => {
  if (__worshipData) return Promise.resolve(__worshipData);
  if (!__worshipPromise) {
    __worshipPromise = Promise.resolve()
      .then(() => fetch('/worship-display.json'))
      .then((r) => { if (!r.ok) throw new Error('worship fetch ' + r.status); return r.json(); })
      .then((raw) => {
        __worshipData = raw;
        return __worshipData;
      })
      .catch((e) => { __worshipPromise = null; throw e; });
  }
  return __worshipPromise;
};

const resolveWorshipTags = async (text, band) => {
  if (!text || text.indexOf('<worship') === -1) return text;
  let data = null;
  try { data = await loadWorship(); } catch (e) { data = null; }
  const arm = (band === 'adult' || band === 'teen') ? 'adult' : 'young';
  return text.replace(/<worship([^>]*)>[\s\S]*?<\/worship>/g, (_w, attrs) => {
    const m = attrs.match(/id=["']([^"']+)["']/);
    const cell = m && data && data.cells && data.cells[m[1] + ':' + arm];
    return (cell && cell.text) ? ' ' + cell.text + ' ' : ' ';
  });
};
// كل أذكار بابٍ بعددِ التكرار والصوت، أو [] (لا يقع أبداً على نصّ النموذج)
const getDhikrByCategory = (catId) => {
  if (!__adhkarData) return [];
  return __adhkarData.byCat[parseInt(catId, 10)] || [];
};
// عدد آيات سورة من المصحف المُحمَّل (عدّ المفاتيح ذات البادئة `${num}:`)؛ 0 إن لم يُحمَّل.
const getSurahAyahCount = (sNum) => {
  if (!__quranData || !(sNum >= 1)) return 0;
  const prefix = `${sNum}:`;
  let c = 0;
  for (const k in __quranData) if (k.startsWith(prefix)) c++;
  return c;
};
// تحويل الأرقام إلى أرقام عربية-هندية (٠١٢…) لفواصل الآيات ۝ واللُّصوقات
const toArabicDigits = (n) => String(n).replace(/[0-9]/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);

// يُرجع رقم السورة (1..114) أو null. يفضّل surah_num الرقمي، ثم يبحث بالاسم.
const resolveSurahNumber = (surahName, surahNum) => {
  const n = parseInt(surahNum, 10);
  if (n >= 1 && n <= 114) return n;
  if (!surahName) return null;
  const raw = String(surahName).trim();
  if (SURAH_NUMBERS[raw]) return SURAH_NUMBERS[raw];
  // إزالة بادئة "سورة" إن وُجدت ثم البحث في الخريطة المطبَّعة
  const norm = normalizeArabic(raw).replace(/^سوره?\s+/, '').replace(/^سورة\s+/, '').trim();
  return SURAH_NUMBERS_NORM[norm] || null;
};

/* 14.2 */
// ============================================================
// تخطيط مصحف المدينة — /mushaf-layout.json (٦٠٤ صفحة).
// ============================================================
// الملفّ لا يحمل حرفاً قرآنياً واحداً: مواقع كلماتٍ وحدود أسطرٍ فقط ("سورة:آية:كلمة").
// الرباط مبرهَن ومحروس بـ layout-guard.cjs (البوّابة الخامسة):
//   ٦٢٣٦/٦٢٣٦ آية  ·  ٧٧٤٢٩/٧٧٤٢٩ كلمة تنزل في خانتها.
// كلُّ حرفٍ يراه القارئ يأتي من __quranData وحده — كالآيات في المحادثة تماماً.
let __layoutData = null;
let __layoutPromise = null;
const loadLayout = () => {
  if (__layoutData) return Promise.resolve(__layoutData);
  if (!__layoutPromise) {
    __layoutPromise = Promise.resolve()
      .then(() => fetch('/mushaf-layout.json'))
      .then((r) => { if (!r.ok) throw new Error('layout fetch ' + r.status); return r.json(); })
      .then((d) => { __layoutData = d; return d; })
      .catch((e) => { __layoutPromise = null; throw e; }); // اسمح بإعادة المحاولة
  }
  return __layoutPromise;
};

// "حرفٌ عربيّ" — لا علامة. هذه القاعدةُ بعينها هي التي بُرهن بها الرباط في
// layout-guard.cjs. لو اختلف تقطيعُ العارض عن عدّاد الحارس بحرفٍ واحد، نزلت
// الكلمةُ في الخانة الخطأ بصمت — والعدد يبقى صحيحاً. فلا تمسّها.
const __isArabicLetter = (cp) =>
  (cp >= 0x0621 && cp <= 0x063A) ||   // الهمزة .. الغين
  (cp >= 0x0641 && cp <= 0x064A) ||   // الفاء .. الياء (التطويل 0x0640 مستبعَد)
  (cp >= 0x0671 && cp <= 0x06D3);     // ألف الوصل والحروف الممتدّة
const __hasLetter = (t) => { for (const ch of t) if (__isArabicLetter(ch.codePointAt(0))) return true; return false; };

// الوصلات الأربع: خانةٌ واحدة في المصحف تبتلع كلمتين («بَعْدَ مَا» و«إِلْ يَاسِينَ»).
// ليست عطلاً — المصدر يقولها بنفسه. الرقم = رقم الخانة التي تبتلع التي بعدها.
const __LIGATURES = { '2:181': 3, '8:6': 4, '13:37': 8, '37:130': 3 };

// تقطيع الآية إلى كلمات بحيث كلمة[i] == خانة[i+1] في التخطيط.
// العلاماتُ تلتصق في اتّجاهين — وهذا ليس تفصيلاً تجميلياً:
//   • علامة الوقف (ۖ ۗ ۚ ۛ) والسجدة (۩) تلتصق بما قبلها.
//   • ۞ (رأس الربع) تفتتح ١٩٩ آية ولا شيءَ قبلها — فتلتصق بما بعدها.
// لو التصقت ۞ بما قبلها (ولا شيءَ قبلها) لصارت كلمةً بذاتها، فانزاح كلُّ شيءٍ
// بعدها خانةً واحدة، وسقطت آخرُ كلمةٍ من ١٩٩ آية. مقيسٌ، لا مفترَض.
const __wordCache = {};
const wordsOfAyah = (sNum, aNum) => {
  const key = sNum + ':' + aNum;
  if (__wordCache[key]) return __wordCache[key];
  const text = getVerseText(sNum, aNum);
  if (!text) return [];
  const out = [];
  let lead = '';
  for (const tok of text.split(/\s+/)) {
    if (!tok) continue;
    if (__hasLetter(tok)) { out.push(lead ? lead + ' ' + tok : tok); lead = ''; }
    else if (out.length) out[out.length - 1] += ' ' + tok;   // وقف/سجدة → إلى الخلف
    else lead = lead ? lead + ' ' + tok : tok;               // ۞ → إلى الأمام
  }
  if (key in __LIGATURES) { const i = __LIGATURES[key] - 1; out.splice(i, 2, out[i] + ' ' + out[i + 1]); }
  __wordCache[key] = out;
  return out;
};

// فهرسٌ يُبنى مرّةً واحدة من التخطيط:
//   startPage[سورة]  = أوّل صفحةٍ تبدأ فيها.
//   headerSurah["صفحة:سطر"] = السورة التي يُعلنها سطرُ الرأس.
// كلاهما مشتقٌّ من المواقع، لا من لافتات المصدر — لافتاتُ الرؤوس فيه مكسورةٌ في
// ١٨ موضعاً (تسمّي السورة التي انتهت لا التي تبدأ) وزائدةٌ في موضع. ولهذا لا
// يحمل mushaf-layout.json أيَّ لافتةٍ أصلاً: أرقامُ صفحاتٍ وأسطرٍ ومواقعُ كلماتٍ فقط.
// ورأسٌ لا تليه آيةٌ أولى = رأسٌ زائد → لا نرسم له اسماً كاذباً.
let __layoutIndex = null;
const buildLayoutIndex = () => {
  if (__layoutIndex) return __layoutIndex;
  const startPage = {}, headerSurah = {};
  const flat = [];
  for (const pg of __layoutData.p) for (const ln of pg.l) flat.push({ p: pg.n, ln });
  for (let i = 0; i < flat.length; i++) {
    const F = flat[i];
    if (F.ln.t === 't') {
      for (const loc of F.ln.w) {
        const a = loc.split(':');
        if (a[1] === '1' && a[2] === '1') { const sn = parseInt(a[0], 10); if (!startPage[sn]) startPage[sn] = F.p; }
      }
    } else if (F.ln.t === 'h') {
      for (let j = i + 1; j < flat.length; j++) {
        const nx = flat[j].ln;
        if (nx.t !== 't' || !nx.w || !nx.w.length) continue;
        const a = nx.w[0].split(':');
        if (a[1] === '1' && a[2] === '1') headerSurah[F.p + ':' + F.ln.n] = parseInt(a[0], 10);
        break;
      }
    }
  }
  /* 14.2f3 */
  // ماذا أسقط المصدر؟ نمشي من أوّل كلمةٍ في كلّ سورة إلى الوراء فوق أسطر الرأس
  // والبسملة الملاصقة. مقيسٌ من البيانات نفسها، لا من قائمةٍ مكتوبةٍ بيدنا:
  //   خمسُ سورٍ بلا رأس  : ١٠ · ٨١ · ٨٢ · ٨٥ · ٨٦
  //   سورتان بلا بسملة  : ٨١ (التكوير) · ٨٥ (البروج)
  // والفاتحة والتوبة استثناءان صحيحان: بسملةُ الفاتحة آيتُها الأولى، والتوبة بلا بسملة.
  // عرضُ سورةٍ بلا بسملتها نقصٌ في المصحف لا في الشكل — فنحقنها من getVerseText(1,1)
  // ومن SURAH_NAMES. ولا نكتب حرفاً قرآنياً بأيدينا، هنا ولا في أيّ موضع.
  const firstLine = {};
  for (let i = 0; i < flat.length; i++) {
    const F = flat[i];
    if (F.ln.t !== 't') continue;
    for (const loc of F.ln.w) {
      const a = loc.split(':');
      if (a[1] === '1' && a[2] === '1') { const sn = parseInt(a[0], 10); if (firstLine[sn] === undefined) firstLine[sn] = i; }
    }
  }
  const needHeader = {}, needBasmala = {};
  for (let sn = 1; sn <= 114; sn++) {
    const i = firstLine[sn];
    if (i === undefined) continue;
    let hasH = false, hasB = false, j = i - 1;
    while (j >= 0 && (flat[j].ln.t === 'h' || flat[j].ln.t === 'b')) {
      if (flat[j].ln.t === 'h') hasH = true;
      if (flat[j].ln.t === 'b') hasB = true;
      j--;
    }
    if (!hasH) needHeader[sn] = 1;
    if (!hasB && sn !== 1 && sn !== 9) needBasmala[sn] = 1;
  }
  __layoutIndex = { startPage, headerSurah, needHeader, needBasmala };
  return __layoutIndex;
};

/* 14.3 */
// ============================================================
// فهرس المصحف — صفحةُ بدءٍ لكلّ سورة ولكلّ جزء.
// ============================================================
// أوّلُ آيةٍ في كلّ جزء هي الثابتُ الوحيد هنا. أمّا الصفحاتُ فلا تُكتب بيدٍ أبداً:
// تُستخرَج من مواقع الكلمات كما تُستخرَج رؤوسُ السور — صفحةُ السورة أوّلُ صفحةٍ
// تحمل «س:١:١»، وصفحةُ الجزء الصفحةُ التي تنزل فيها أوّلُ كلمةٍ من أوّلِ آياته.

const JUZ_FIRST_AYAH = {
  1: '1:1', 2: '2:142', 3: '2:253', 4: '3:92', 5: '4:24',
  6: '4:148', 7: '5:82', 8: '6:111', 9: '7:88', 10: '8:41',
  11: '9:93', 12: '11:6', 13: '12:53', 14: '15:1', 15: '17:1',
  16: '18:75', 17: '21:1', 18: '23:1', 19: '25:21', 20: '27:56',
  21: '29:46', 22: '33:31', 23: '36:28', 24: '39:32', 25: '41:47',
  26: '46:1', 27: '51:31', 28: '58:1', 29: '67:1', 30: '78:1',
};

// صفوفُ الفهرس مرتَّبةً: بالصفحة، ثمّ الجزءُ قبل السورة عند التساوي، ثمّ بالرقم.
// تُبنى مرّةً واحدة — لا في كلّ رسم.
let __mushafNav = null;
const buildMushafNav = () => {
  if (__mushafNav) return __mushafNav;
  const startPage = buildLayoutIndex().startPage;
  const wordPage = {};
  for (const pg of __layoutData.p) for (const ln of pg.l) {
    if (ln.t !== 't' || !ln.w) continue;
    for (const loc of ln.w) if (!(loc in wordPage)) wordPage[loc] = pg.n;
  }
  const rows = [];
  for (let sn = 1; sn <= 114; sn++) {
    const p = startPage[sn];
    if (!p) return null;
    rows.push({ k: 's', n: sn, p });
  }
  let prev = 0;
  for (let jz = 1; jz <= 30; jz++) {
    const ref = JUZ_FIRST_AYAH[jz];
    const p = wordPage[ref + ':1'];
    if (!p || p <= prev) return null;
    prev = p;
    rows.push({ k: 'j', n: jz, p, s: parseInt(ref.split(':')[0], 10) });
  }
  if (rows.length !== 144) return null;
  rows.sort((a, b) => a.p - b.p || (a.k === b.k ? a.n - b.n : (a.k === 'j' ? -1 : 1)));
  __mushafNav = rows;
  return rows;
};

// ما يُرسَم قبل وصول التخطيط: السورُ وحدها بلا رقمِ صفحة. خانةُ الرقم محجوزةٌ في
// النمط، فلا تقفز القائمةُ حين تصل الأرقام.
const MUSHAF_NAV_FALLBACK = Array.from({ length: 114 }, (_, i) => ({ k: 's', n: i + 1, p: 0 }));

// ============================================================
// قصّ السجلّ قبل إرساله للـ API (Sliding Window)
// ============================================================
// نُرسل آخر ٦ جولات (= ١٢ رسالة) فقط للـ API:
// — يمنع 429 Rate Limit الذي حصل في الاختبار الميداني
// — يُقلّل استهلاك Tokens بشكل ملحوظ مع إبقاء السياق كافياً للحوار
// — كامل السجلّ يبقى محفوظاً في الواجهة وفي localStorage للأهل
const MAX_HISTORY_PAIRS = 6;

const sliceHistoryForAPI = (messages) => {
  if (!messages || messages.length === 0) return [];
  const maxMessages = MAX_HISTORY_PAIRS * 2;
  let sliced = messages.slice(-maxMessages);
  // الـ Anthropic API يتطلب أن يبدأ السجلّ برسالة user — احذف أيّ assistant في البداية
  while (sliced.length > 0 && sliced[0].role !== 'user') {
    sliced = sliced.slice(1);
  }
  return sliced;
};

// ============================================================
// Body-size budget — the client must measure what the server measures (item 1 / defects 44+45).
// ============================================================
// Mirror of the server's hard INPUT cap. MUST equal MAX_CHAT_BODY_BYTES in lib/ratelimit.js:239;
// recon-audit.cjs FAILs if the two ever drift. The server 413s any POST body whose
// Buffer.byteLength(JSON.stringify(body),'utf8') exceeds this, so the client sizes the body the
// SAME way and trims/refuses BEFORE sending — the child never sees a silent 413.
const SERVER_MAX_CHAT_BODY_BYTES = 2 * 1024 * 1024;
// The client stays strictly UNDER the server: 64 KB headroom absorbs re-stringify slack + headers,
// so a body the client accepts can never 413 the server. The client is never more permissive.
const CLIENT_BODY_HEADROOM = 64 * 1024;
const CLIENT_BUDGET = SERVER_MAX_CHAT_BODY_BYTES - CLIENT_BODY_HEADROOM;

// Size a candidate outgoing body EXACTLY as the server does (api/chat.js:30, api/ask.js:150):
// Buffer.byteLength(JSON.stringify(body),'utf8'). TextEncoder yields identical UTF-8 byte counts.
const bodyByteSize = (body) => new TextEncoder().encode(JSON.stringify(body)).length;

// Byte-driven history fit. mkBody(msgs) assembles the REAL outgoing body; drop the OLDEST messages
// until it fits CLIENT_BUDGET, measured the server's way. Never touches the system prompt (not part
// of `messages`) nor the newest message (msgs[last], the current user turn).
const fitMessagesToBudget = (mkBody, messages) => {
  let msgs = messages.slice();
  while (msgs.length > 1 && bodyByteSize(mkBody(msgs)) > CLIENT_BUDGET) {
    msgs = msgs.slice(1); // drop oldest turn; keep the system prompt + the newest user message
  }
  return msgs;
};

// File gate, budget half (defect 45): the per-type cap is not the only ceiling. Once the ~111KB
// system prompt + history already fill CLIENT_BUDGET, even a small file 413s the server. Model the
// REAL /api/ask body this attachment would produce (base64 inflation lives inside attachBlock.data)
// and return an Arabic refusal naming the conversation-size bound + the real remaining room if it
// would not fit; null if it fits. Effective ceiling = min(per-type cap, this).
const attachOverBudget = (attachBlock, messages, profile) => {
  const p = profile || {};
  const system = buildSystemPrompt(p.name, p.age, p.gender, 'chat');
  const band = deriveCaps(p.age).band;
  const mk = (msgs) => ({ max_tokens: 4096, stream: true, system, messages: msgs, band });
  const toApi = (arr) => sliceHistoryForAPI(arr).map(m => ({ role: m.role, content: m.content }));
  const userWith = { role: 'user', content: [attachBlock, { type: 'text', text: 'اشرح لي هذا' }] };
  const baseBytes = bodyByteSize(mk(toApi(messages || [])));
  const withBytes = bodyByteSize(mk(toApi([...(messages || []), userWith])));
  if (withBytes <= CLIENT_BUDGET) return null;
  const room = Math.max(0, CLIENT_BUDGET - baseBytes); // bytes that were free for this attachment
  const need = withBytes - baseBytes;                  // bytes this attachment actually adds
  const kb = (n) => Math.max(0, Math.round(n / 1024));
  return 'المحادثة طويلة ولم يبقَ متّسعٌ كافٍ لهذا الملف في هذه الرسالة (المتبقّي نحو ' + kb(room) + ' ك.ب، والملف يحتاج نحو ' + kb(need) + ' ك.ب). ابدأ محادثةً جديدة أو أرسل ملفًّا أصغر.';
};

// Item A: the largest RAW file of a base64-sent type that could ever fit CLIENT_BUDGET on an EMPTY
// conversation -- system prompt, JSON envelope, and base64 inflation (4 chars per 3 bytes) all
// counted. Derived here, never typed. Text types (txt/docx) are CLIPPED before sending, so their
// file size never inflates the body; their true ceiling is the product policy limit (theoretical
// = unbounded). Returns { ceilingBytes, bound } where bound names WHICH ceiling won: 'budget' (the
// live message capacity) or 'policy' (the type's product limit). ceilingBytes = min(policy, theoretical).
const deriveTypeCeiling = (kind, policyBytes, profile) => {
  const BASE64_MEDIA = { pdf: 'application/pdf', image: 'image/jpeg' };
  const media = BASE64_MEDIA[kind];
  if (!media) return { ceilingBytes: policyBytes, bound: 'policy' }; // clipped text: policy IS the true ceiling
  const p = profile || {};
  const system = buildSystemPrompt(p.name, p.age, p.gender, 'chat');
  const band = deriveCaps(p.age).band;
  const block = { type: kind === 'pdf' ? 'document' : 'image', source: { type: 'base64', media_type: media, data: '' } };
  const body = { max_tokens: 4096, stream: true, system, band, messages: [{ role: 'user', content: [block, { type: 'text', text: 'اشرح لي هذا' }] }] };
  const overhead = bodyByteSize(body);                          // the whole empty-convo body minus the base64 data
  const maxBase64Chars = Math.max(0, CLIENT_BUDGET - overhead); // base64 chars (== bytes) that still fit
  const theoreticalRaw = Math.floor(maxBase64Chars / 4) * 3;    // invert base64: 3 raw bytes per 4 chars
  return theoreticalRaw < policyBytes ? { ceilingBytes: theoreticalRaw, bound: 'budget' } : { ceilingBytes: policyBytes, bound: 'policy' };
};

// Item A: render a byte count as an Arabic size string (Arabic-Indic digits) -- computed at the
// moment it is shown, never a literal.
const humanBytesAr = (n) => toArabicDigits(n >= 1024 * 1024 ? (n / (1024 * 1024)).toFixed(1) + ' ميغابايت' : Math.max(1, Math.round(n / 1024)) + ' كيلوبايت');

// Item A: a per-type "too big" refusal naming the THREE things a trustworthy limit must state:
// (1) which bound refused it -- the live message capacity ('سعة الرسالة') or the type's product
// limit ('حدّ النوع') -- (2) the TRUE current ceiling, and (3) the file's own size. All computed.
const fileTooBigMsg = (typeLabel, fileSize, ceilingBytes, bound) => {
  const why = bound === 'budget' ? 'سعة الرسالة' : 'حدّ النوع';
  return typeLabel + ' أكبر من المسموح به الآن. الحدّ الحاليّ نحو ' + humanBytesAr(ceilingBytes) +
    ' (السقف من: ' + why + ')، وحجم ملفك نحو ' + humanBytesAr(fileSize) + '. الرجاء ملفًّا أصغر.';
};

// Plain-text view of a message's content (string, or [image,text] array) for logs.
const contentToText = (content) => {
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) {
    const t = content.find(b => b && b.type === 'text');
    const img = content.some(b => b && b.type === 'image');
    return (img ? '📷 ' : '') + (t ? t.text : '');
  }
  return '';
};

// Read an image File → downscale to ≤1568px long edge, normalize to JPEG, return
// { media_type, data } (base64, no prefix). Keeps uploads well under the 5MB API limit.
const fileToImageBlock = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1568;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) { const s = MAX / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const out = canvas.toDataURL('image/jpeg', 0.85);
      resolve({ media_type: 'image/jpeg', data: out.slice(out.indexOf(',') + 1) });
    };
    img.onerror = reject;
    img.src = reader.result;
  };
  reader.onerror = reject;
  reader.readAsDataURL(file);
});

const fileToBase64 = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => {
    const s = String(reader.result);
    resolve(s.slice(s.indexOf(',') + 1)); // strip the "data:...;base64," prefix
  };
  reader.onerror = () => reject(reader.error);
  reader.readAsDataURL(file);
});

// ============================================================
// Daily question cap — client half (directive 78). NO IP anywhere in this feature.
// ============================================================
// One stable uuid per browser profile, minted on first use. It is HALF the identity: the
// server also sets an httpOnly cookie (mrb_did) that it can read and this script cannot.
// So clearing localStorage alone does NOT reset the day's allowance, and clearing cookies
// alone does not either — only clearing BOTH does. That is the declared ceiling of a
// no-IP design, not a defect.
const DEVICE_ID_KEY = 'mrb_device_v1';
const FOUNDER_TOKEN_KEY = 'mrb_founder_v1';
// Must satisfy the server's /^[A-Za-z0-9_-]{8,64}$/ (lib/daycap.js safeId) or the server
// treats it as ABSENT and leans on the cookie counter alone.
const DEVICE_ID_RE = /^[A-Za-z0-9_-]{8,64}$/;
const getDeviceId = () => {
  try {
    let id = localStorage.getItem(DEVICE_ID_KEY);
    if (!id || !DEVICE_ID_RE.test(id)) {
      id = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : ('d-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));
      localStorage.setItem(DEVICE_ID_KEY, id);
    }
    return id;
  } catch (e) {
    // Private mode / storage blocked: send nothing and let the cookie counter carry the cap.
    return null;
  }
};

// Extra headers for a capped request. The founder TOKEN may be present; the founder PIN
// never travels — the token is base64url(HMAC(FOUNDER_SECRET, deviceId)), minted elsewhere.
// Absent or invalid token = counted like anyone.
const capHeaders = () => {
  const h = {};
  const id = getDeviceId();
  if (id) h['x-murabbi-device'] = id;
  try { const t = localStorage.getItem(FOUNDER_TOKEN_KEY); if (t) h['x-murabbi-founder'] = t; } catch (e) {}
  return h;
};

// Unlock token (directive 82). Kept in the SAME key capHeaders() already reads
// x-murabbi-founder from, so one successful PIN lifts the daily cap, the deep tiers and the
// call together -- there is no second notion of "unlocked" to drift. The PIN itself is NEVER
// stored, logged or put in a URL; only this token is, and it is useless without the server's
// FOUNDER_SECRET. Every gate calls hasFounderToken() directly rather than reading a cached
// flag, so no guard can ever act on a stale value.
const hasFounderToken = () => { try { return !!localStorage.getItem(FOUNDER_TOKEN_KEY); } catch (e) { return false; } };
const storeFounderToken = (t) => { try { localStorage.setItem(FOUNDER_TOKEN_KEY, t); } catch (e) {} };

const getFriendlyError = (type, gender) => {
  const bucket = FRIENDLY_ERRORS[type] || FRIENDLY_ERRORS.general;
  return bucket[gender === 'female' ? 'female' : 'male'];
};

// ============================================================
// تحليل الرسائل ذات البطاقات (verse/hadith/steps/suggestions)
// ============================================================
// يحذف أي وسم معروف (<verse>/<hadith>/<steps>/<suggestions>) فُتِح ولم يُغلَق — يحدث
// عند اقتطاع الردّ منتصف الوسم — وأي بقايا "<...>" يتيمة في آخر النص، كي لا يتسرّب
// ترميز خام إلى الطفل (عرض) ولا إلى ElevenLabs (صوت). مستقلّ تماماً عن max_tokens.
const KNOWN_TAGS = 'verse|surah|hadith|steps|suggestions|source|dhikr';
const stripIncompleteTags = (text) => {
  if (!text || typeof text !== 'string') return text || '';
  let t = text;
  // ٠. طَبِّع وسمَي الآية/السورة ذاتيَّي الإغلاق (<verse .../>، <surah .../>) إلى صيغةٍ
  //    مُغلَقة حتى لا يَعدّهما كاشفُ الوسوم الناقصة وسماً مقطوعاً فيحذفهما. (كلاهما فارغ بلا نصّ.)
  t = t.replace(/<(verse|surah)([^>]*?)\s*\/>/g, '<$1$2></$1>');
  // ١. أول وسم معروف مفتوح بلا إغلاق مطابق → احذف من بدايته حتى نهاية النص.
  const openRe = new RegExp(`<(${KNOWN_TAGS})\\b`, 'g');
  let m, cut = -1;
  while ((m = openRe.exec(t)) !== null) {
    const closeRe = new RegExp(`</${m[1]}>`, 'g');
    closeRe.lastIndex = m.index;
    if (!closeRe.test(t)) { cut = m.index; break; }
  }
  if (cut >= 0) t = t.slice(0, cut);
  // ٢. "<" مقطوع في آخر النص بلا ">" مطابق (مثل "<ver" أو "<verse surah=") → احذفه.
  t = t.replace(/<[^>]*$/, '');
  return t;
};

// مفتاح تجريبي (A/B) — صحّحه إلى true لمقارنة النطق بلا تشكيل في المتصفح:
// عند true نُرسِل لـ ElevenLabs نصّاً مُجرَّداً من كل تشكيل (نطق MSA نثريّ فقط —
// القرآن يُتلى من القارئ لا من الذكاء الاصطناعي، فالتجريد آمن هنا). النصّ المعروض
// للطفل وللأهل يبقى مُشَكَّلاً بالكامل. السبب: عناقيد الشدّة (التَّشْرِيك = تّ+شْ)
// تُسبّب تأتأة في eleven_multilingual_v2. هذا تطبيع للمُدخَل الصوتي فقط.
const STRIP_TASHKEEL_FOR_TTS = false;
const TTS_TASHKEEL_ENABLED = false; // false = skip Haiku tashkeel add-call for speech (pre-diacritized canonical text unaffected); flip true to restore original behavior
const CALL_STREAM_SPEECH = true; // false = classic (speak full reply after generation). true = stream complete prose sentences BEFORE the first tag as they arrive (first-audio latency win); tags + trailing prose still handled by buildAudioSequence at finish.
// Tashkeel is stripped from the tutor's prose by default (the owner's call), but NEVER from a
// Quranic span: anything between the ornate parentheses U+FD3F..U+FD3E is scripture and is left
// byte-for-byte as it came. Everything outside them loses the harakat marks only.
const QURAN_SPAN_RE = /\uFD3F[\s\S]*?\uFD3E/g;
const HARAKAT_RE = /[\u064B-\u0652\u0670]/g;
const stripTashkeelOutsideQuran = (s) => {
  const src = s || '';
  let out = '';
  let last = 0;
  let m;
  QURAN_SPAN_RE.lastIndex = 0;
  while ((m = QURAN_SPAN_RE.exec(src)) !== null) {
    out += src.slice(last, m.index).replace(HARAKAT_RE, '');
    out += m[0];
    last = m.index + m[0].length;
  }
  return out + src.slice(last).replace(HARAKAT_RE, '');
};
const miniBtnStyle = { display: 'inline-flex', alignItems: 'center', gap: 5, background: 'none', border: '1px solid var(--line)', borderRadius: 8, padding: '4px 8px', fontSize: 12, cursor: 'pointer', fontFamily: 'inherit', color: 'inherit', opacity: 0.7 };
// D91. Two live-browser failures the in-process harness could not see:
//
// (1) WHEN the text is built. It used to be built during MessageBubble's render. But the
//     canonical stores (quran / adhkar / worship) fill asynchronously AFTER the cards mount,
//     and each card holds its resolved text in its OWN state -- so the store landing re-renders
//     the CARD and never its parent. The render-time string therefore froze whatever had not
//     arrived at first paint: an ayah, a whole surah, the adhkar list, the salah card. A
//     worship-only reply froze to the empty string, and this button then hid itself entirely.
//     getText is now invoked on the TAP, seconds later, reading the very stores the cards read.
//
// (2) WHETHER the write actually happened. navigator.clipboard.writeText REJECTS in an Android
//     WebView, on an insecure origin, and without a user gesture. The old code treated the mere
//     PRESENCE of the API as success-or-nothing: on rejection it fell into catch(e){} and did
//     not try the legacy path, so the button did nothing at all and said nothing at all. And on
//     the legacy path it ignored execCommand's return value, so a REFUSED copy still flashed
//     "copied" -- indistinguishable, to the owner, from a broken serializer.
const CopyReplyButton = ({ text, getText }) => {
  const [flash, setFlash] = useState('');            // '' | 'ok' | 'fail'
  if (!text) return null;
  // The legacy path is not a relic: it is the ONLY path that works where the Clipboard API is
  // present but refuses. Returns true only when the document actually reports the copy done.
  const legacyCopy = (payload) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = payload;
      ta.setAttribute('readonly', '');               // keeps the mobile keyboard shut
      ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0';
      ta.style.width = '1px'; ta.style.height = '1px'; ta.style.padding = '0';
      ta.style.border = 'none'; ta.style.outline = 'none'; ta.style.boxShadow = 'none';
      ta.style.background = 'transparent'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { ta.setSelectionRange(0, String(payload).length); } catch (e) {}   // iOS needs the range
      const done = document.execCommand('copy') === true;
      document.body.removeChild(ta);
      return done;
    } catch (e) { return false; }
  };
  const doCopy = async () => {
    const payload = (typeof getText === 'function') ? getText() : text;
    if (!payload) { setFlash('fail'); setTimeout(() => setFlash(''), 1500); return; }
    let wrote = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(payload);
        wrote = true;
      }
    } catch (e) { wrote = false; }                   // a refusal is not the end -- fall through
    if (!wrote) wrote = legacyCopy(payload);
    setFlash(wrote ? 'ok' : 'fail');                 // never claim a write that did not happen
    setTimeout(() => setFlash(''), 1500);
  };
  return <button type="button" onClick={doCopy} aria-label={'\u0646\u0633\u062E'} style={miniBtnStyle}>{flash === 'ok' ? '\u062A\u0645 \u0627\u0644\u0646\u0633\u062E' : flash === 'fail' ? '\u062A\u0639\u0630\u0651\u0631\u064E \u0627\u0644\u0646\u0633\u062E' : '\u0646\u0633\u062E'}</button>;
};// The Web Speech engine ends a session on every pause and the next one starts a fresh
// transcript. Concatenating the two halves raw welded the last word of one onto the first
// word of the next. Every seam goes through this joiner instead.
const joinSpeech = (a, b) => { const l = a || ''; const r = b || ''; if (!l) return r; if (!r) return l; return (/\s$/.test(l) || /^\s/.test(r)) ? l + r : l + ' ' + r; };
const stripAllTashkeel = (s) => (s || '').replace(/[ً-ْٰ]/g, '');

// تصدير محتوى HTML كملفّ Word (.doc): Word/Docs يعرضان العربيّة RTL بأنفسهما،
// فنتخطّى مشكلة تشكيل العربيّة في توليد PDF داخل المتصفّح. (نمط تنزيل قياسيّ عبر <a download>)
const downloadAsWord = (filename, title, bodyHtml) => {
  const html = '\ufeff<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'
    + '<head><meta charset="utf-8"><title>' + title + '</title>'
    + '<style>@page{size:A4;margin:2cm} body{font-family:"Arial","Amiri",serif;direction:rtl;text-align:right;line-height:1.9;font-size:14pt;color:#222} h1{color:#12327A;font-size:20pt} h2{color:#12327A;font-size:15pt} h3{color:#12327A;font-size:13pt} h4{color:#12327A;font-size:12pt} ul,ol{margin-right:1em} strong{font-weight:bold} table{border-collapse:collapse;width:100%;margin:8pt 0} th,td{border:1px solid #999;padding:4pt 8pt;text-align:right} th{background:#EDF1FA;color:#12327A}</style>'
    + '</head><body dir="rtl" lang="ar">' + bodyHtml + '</body></html>';
  const blob = new Blob([html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = /\.doc$/.test(filename) ? filename : filename + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

// يهرّب رموز HTML كي لا يُحقَن ترميزٌ من المحتوى (احتياطًا)

const toPlainText = (s) => String(s || '')
  .replace(/<[^>]+>/g, ' ')                 // any leftover angle tag
  .replace(/^#{1,6}\s+/gm, '')              // # .. ###### headings
  .replace(/\*\*([^*]+)\*\*/g, '$1')        // **bold**
  .replace(/^\s*[-•*]\s+/gm, '')            // bullet markers
  .replace(/^\s*\|.*\|\s*$/gm, '')          // markdown table rows
  .replace(/[﴿﴾]/g, '')                     // Quran ornament brackets
  .replace(/[ \t]{2,}/g, ' ')
  .replace(/\n{3,}/g, '\n\n')
  .trim();

const inlineFmt = (s) => escapeHtml(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

const printAsPdf = async (title, bodyHtml) => {
  const area = document.getElementById('print-area');
  if (!area) return;
  area.innerHTML = '<h1>' + escapeHtml(title) + '</h1>' + bodyHtml;
  // S97: html2pdf is no longer a boot-blocking <script>; it is warmed on idle after the first
  // paint. Awaiting the same promise here is what keeps this path's RESULT identical -- the only
  // case that waits is a tap in the first second, and it still produces the same file.
  if (window.__ezikVendor) { try { await window.__ezikVendor('html2pdf'); } catch (e) {} }
  if (!window.html2pdf) { document.title = title; window.print(); return; } // fallback if CDN failed
  const opt = {
    margin: [12, 12, 12, 12],
    filename: (title || 'مستند') + '.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'] }
  };
  const target = area.cloneNode(true);
  target.style.display = 'block';
  target.style.direction = 'rtl';
  target.style.textAlign = 'right';
  target.style.padding = '0';
  window.html2pdf().set(opt).from(target).save().then(() => { area.innerHTML = ''; }).catch(() => { area.innerHTML = ''; });
};

// يحوّل محتوى المستند (فقرات، عناوين بـ# أو ##، نقاط بـ- أو •) إلى HTML للتصدير
const docToHtml = (md) => {
  const lines = String(md || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;
  const isSep = (s) => /^[\s|:-]+$/.test(s.trim()) && s.includes('-') && s.includes('|');
  const parseRow = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
  while (i < lines.length) {
    const t = lines[i].trim();
    if (!t) { i++; continue; }
    if (t.includes('|') && i + 1 < lines.length && isSep(lines[i + 1])) {
      const headers = parseRow(t);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim() && lines[i].includes('|')) { rows.push(parseRow(lines[i])); i++; }
      let tbl = '<table><thead><tr>' + headers.map((h) => '<th>' + inlineFmt(h) + '</th>').join('') + '</tr></thead>';
      if (rows.length) tbl += '<tbody>' + rows.map((r) => '<tr>' + r.map((c) => '<td>' + inlineFmt(c) + '</td>').join('') + '</tr>').join('') + '</tbody>';
      tbl += '</table>';
      out.push(tbl); continue;
    }
    let m;
    if ((m = t.match(/^####\s+(.*)$/))) { out.push('<h4>' + inlineFmt(m[1]) + '</h4>'); i++; continue; }
    if ((m = t.match(/^###\s+(.*)$/))) { out.push('<h3>' + inlineFmt(m[1]) + '</h3>'); i++; continue; }
    if ((m = t.match(/^##\s+(.*)$/)))  { out.push('<h2>' + inlineFmt(m[1]) + '</h2>'); i++; continue; }
    if ((m = t.match(/^#\s+(.*)$/)))   { out.push('<h1>' + inlineFmt(m[1]) + '</h1>'); i++; continue; }
    if (/^[-•*]\s+/.test(t)) {
      const items = [];
      while (i < lines.length && /^[-•*]\s+/.test(lines[i].trim())) { items.push('<li>' + inlineFmt(lines[i].trim().replace(/^[-•*]\s+/, '')) + '</li>'); i++; }
      out.push('<ul>' + items.join('') + '</ul>'); continue;
    }
    if (/^\d+[.)]\s+/.test(t)) {
      const items = [];
      while (i < lines.length && /^\d+[.)]\s+/.test(lines[i].trim())) { items.push('<li>' + inlineFmt(lines[i].trim().replace(/^\d+[.)]\s+/, '')) + '</li>'); i++; }
      out.push('<ol>' + items.join('') + '</ol>'); continue;
    }
    out.push('<p>' + inlineFmt(t) + '</p>'); i++;
  }
  return out.join('\n');
};

// ============================================================
// deriveCaps — single source of truth for age-band capability gating.
// The band threshold is taken VERBATIM from buildSystemPrompt (young 4–13 /
// teen 13–17 / adult 18+). Every UI gate reads a flag here instead of an inline
// age check. `call` is intentionally NOT a plain flag — it is band-AND-parent-gated
// and computed at the call site (see App: directConvoAllowed).
// ============================================================
function deriveCaps(age) {
  const ageNum = parseInt(age, 10) || 0;
  const band = ageNum >= 18 ? 'adult' : ageNum >= 13 ? 'teen' : 'young';
  return {
    band,
    memorize: true,
    recite:   true,
    upload:   band !== 'young',   // hidden for young by BAND (no parent override)
    export:   band !== 'young',   // preserves current >=11 behavior exactly
  };
}

// ============================================================
// childVoiceBlocked — الحكمُ الوحيدُ لحاجزِ صوتِ الأطفال (غ‑٣). fail-closed:
// لا ملفّ / ملفٌّ تالف / رميةُ استثناء ⇒ مقفول. يقرأ المرآةَ لا حالةَ الرسم،
// كي لا يُفتحَ الميكروفونُ في دورةٍ يكون فيها profile ما يزال بائتاً.
// ============================================================
function childVoiceBlocked() {
  if (CHILD_VOICE_ENABLED) return false;
  try {
    const p = voiceProfileRef.current;
    if (!p) return true;                       // fail-closed
    return deriveCaps(p.age).band === 'young';
  } catch (e) { return true; }                 // fail-closed
}
