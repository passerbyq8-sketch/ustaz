function Home({ profile, onOpenMenu, onOpenMemorize, onOpenAdhkar, onOpenMushaf, onOpenFatwa, onOpenSettings }) {
  // THE OWNER. Every prop it was handed is handed straight on, and the treasure entry resolves
  // to the same href it always did. There is no second router here and no duplicated navigation
  // state -- the two components above receive these handlers and call them unchanged.
  const g = getHomeGreeting();
  // GENUINE local progress, or nothing at all. These are the MUSHAF'S OWN helpers reading the
  // mushaf's own keys, so the numbers are ones the reader itself wrote; when no real daily
  // target is stored the line is absent rather than invented, and no other module on this
  // screen claims progress of any kind. Nothing here writes, and nothing here transmits.
  const wt = readWirdTarget();
  const wd = readWirdDay();
  const wird = (wt && wd && Array.isArray(wd.pages)) ? { done: Math.min(wd.pages.length, wt), target: wt } : null;
  const view = {
    name: profile?.name,
    greeting: g,
    wird: wird,
    // S118: onOpenChat is gone from this object because the home no longer holds a chat
    // control of its own. The chat is entered from the menu the bar opens, on the menu's own
    // «محادثة جديدة» row, which is the app's ONE new-conversation entry and always was.
    onOpenMenu: onOpenMenu,
    onOpenMemorize: onOpenMemorize,
    onOpenAdhkar: onOpenAdhkar,
    onOpenMushaf: onOpenMushaf,
    onOpenFatwa: onOpenFatwa,
    onOpenSettings: onOpenSettings,
    onOpenTreasure: () => { window.location.href = '/quest.html'; },
  };
  // S87 -- THE MODULE SET IS BUILT HERE, ONCE, AND NOWHERE ELSE. Both styles receive this exact
  // array; neither may call ezHomeModules itself. One descriptor per module means one rendered
  // element per module, whichever style is on -- there is no second collection to fall out of
  // sync with this one, and no second callback bound to the same action.
  const home = { ...view, modules: ezHomeModules(view) };
  // S102 -- ONE DESIGN. The journey/deck presentation system is gone from the file, not
  // hidden behind a flag: its two home components, its three shared parts, its key, its
  // reader, its writer, its hook, its event and its Settings control were all removed in the
  // same commit as this line, and a reference sweep proved every one of them dead first. A
  // stale ezik_ui_style_v1 value may still sit in a user's storage; nothing reads it, so it
  // cannot make a legacy screen reachable. There is exactly one home now.
  // S101 -- THE IDENTITY DECIDES THE STRUCTURE. istana_33 is a design, not a palette laid
  // over the older one, so it gets its own component and neither legacy home is constructed
  // for it. The layout key is still read above and still stored: a device that saved "deck"
  // keeps "deck", is not migrated, and sees the deck again the moment it selects qibla_13.
  // qibla_13 is untouched by this batch and still chooses between the two components below.
  return <EzikIstanaHome {...home} />;
}

// ============================================================
// OFFICIAL FATWA SEARCH -- READ ONLY
// ============================================================
// The browser speaks only to Ezik's own /api/v1 contract. vercel.json rewrites that path to
// the fixed, bounded server-side proxy; the second service is never contacted by the client.
// Search still asks for the same complete official record and never calls a model.
const EZIK_FATWA_API_BASE = '';

async function ezikFatwaFetch(path, signal) {
  const response = await fetch(EZIK_FATWA_API_BASE + path, {
    method: 'GET',
    headers: { Accept: 'application/json' },
    signal,
  });
  let payload = null;
  try { payload = await response.json(); } catch (e) {}
  if (!response.ok || !payload || payload.ok !== true) {
    const code = payload && payload.error && payload.error.code;
    throw new Error(code || ('fatwa_http_' + response.status));
  }
  return payload;
}

const EZIK_FATWA_ACTIONS = [
  ['simplify', 'fatwa.action.simplify'],
  ['example', 'fatwa.action.example'],
  ['explain', 'fatwa.action.explain'],
  ['quiz', 'fatwa.action.quiz'],
];

function ezikFatwaNumber(value) {
  try { return Number(value).toLocaleString(ezLangGet() === 'ar' ? 'ar' : 'en'); }
  catch (e) { return String(value); }
}

function ezikFatwaPublicUrl(value) {
  try {
    const url = new URL(String(value || ''));
    return (url.protocol === 'https:' || url.protocol === 'http:') ? url.href : '';
  } catch (e) { return ''; }
}

function EzikFatwaResult({ fatwa }) {
  const content = (fatwa && fatwa.content) || {};
  const question = content.question || '';
  const answer = content.answer || content.answerExcerpt || '';
  const audio = (fatwa && fatwa.audio) || {};
  const scholar = (fatwa && fatwa.scholar) || {};
  const source = (fatwa && fatwa.source) || {};
  const sourceUrl = ezikFatwaPublicUrl(source.canonicalUrl || source.url);
  const audioUrl = ezikFatwaPublicUrl(audio.url);
  // A machine transcript of the scholar's own clip is neither a written fatwa nor
  // a published text, so it is never shown as one: it is labelled, its notice is
  // printed above the words, and the clip it came from is offered as the original.
  const isTranscript = content.type === 'auto_transcript_official_video';
  return (
    <article className="ezf-card">
      <header className="ezf-card-head">
        <h2 className="ezf-title">{fatwa.title}</h2>
        <div className="ezf-meta">
          <span className="ezf-tag">{scholar.shortName || scholar.name || ezT('fatwa.defaultScholar')}</span>
          <span>{isTranscript
            ? ezT('fatwa.transcriptTag')
            : (audio.available ? ezT('fatwa.audioAvailable') : ezT('fatwa.textOnly'))}</span>
        </div>
      </header>
      {isTranscript ? (
        <p className="ezf-notice">{ezT('fatwa.transcriptNotice')}</p>
      ) : null}
      {isTranscript ? (
        <h3 className="ezf-section-title">{ezT('fatwa.transcriptBody')}</h3>
      ) : question ? (
        <React.Fragment>
          <h3 className="ezf-section-title">{ezT('fatwa.question')}</h3>
          <p className="ezf-copy">{question}</p>
          <h3 className="ezf-section-title">{ezT('fatwa.answer')}</h3>
        </React.Fragment>
      ) : (
        <h3 className="ezf-section-title">{ezT('fatwa.officialText')}</h3>
      )}
      <p className="ezf-copy">{answer}</p>
      {audio.available && audioUrl ? (
        <audio className="ezf-audio" controls preload="none" src={audioUrl}
          aria-label={ezT('fatwa.audioAria')} />
      ) : null}
      {sourceUrl ? (
        <a className="ezhome-focus ezf-source" href={sourceUrl} target="_blank"
          rel="noopener noreferrer">
          {isTranscript ? ezT('fatwa.watchVideo') : ezT('fatwa.source')}</a>
      ) : null}
      <div className="ezf-actions">
        {EZIK_FATWA_ACTIONS.map(([id, key]) => (
          <button key={id} type="button" className="ezf-action" disabled
            aria-disabled="true" title={ezT('fatwa.action.disabled')}>{ezT(key)}</button>
        ))}
      </div>
    </article>
  );
}

// THE WHOLE SHELF, NOT ONLY WHAT WAS SEARCHED FOR. Picking a scholar -- or "all fatwas",
// which is the selector's own first entry and not a scholar -- lists every fatwa there is,
// alphabetically, ten to a page. The search box never leaves: it stays above the list and
// works the same in either mode, and leaving a search puts the reader back on the page of
// the shelf they were standing on, because the browse state is never thrown away.
//
// Not one character of this list is authored here. Ordering, paging and totals are the
// service's answer; this screen renders it and calls no model, exactly as search does.
const EZIK_FATWA_ALL = 'all';
const EZIK_FATWA_PAGE_SIZE = '10';

// THE SELECTOR REMEMBERS WHO IT LISTED LAST TIME. The registry answer is one network
// round trip away -- measured at ~1.2s warm and ~2.9s on a cold function -- and until it
// lands the selector can only offer its seed. So the last good list is kept the way the
// mushaf keeps its position, and drawn immediately on the next open while the live
// request revalidates behind it. Same refusal to guess as readMushafLastPage: no key,
// damaged JSON, a non-array, an empty array or a malformed entry all return null, and the
// screen falls back to the seed exactly as it did before this cache existed.
const EZIK_FATWA_SCHOLARS_KEY = 'ezik_fatwa_scholars_v1';

function readCachedScholars() {
  let raw = null;
  try { raw = localStorage.getItem(EZIK_FATWA_SCHOLARS_KEY); } catch (e) { return null; }
  if (!raw) return null;
  let o = null;
  try { o = JSON.parse(raw); } catch (e) { return null; }
  if (!Array.isArray(o) || !o.length) return null;
  const list = [];
  for (const item of o) {
    if (!item || typeof item !== 'object') return null;
    if (typeof item.id !== 'string' || !item.id) return null;
    if (typeof item.shortName !== 'string' || !item.shortName) return null;
    list.push({ id: item.id, shortName: item.shortName });
  }
  return list;
}

function writeCachedScholars(list) {
  try { localStorage.setItem(EZIK_FATWA_SCHOLARS_KEY, JSON.stringify(list)); } catch (e) {}
}

function FatwaScreen({ onBack }) {
  const [scholars, setScholars] = useState(
    () => readCachedScholars() || [{ id: 'binbaz', shortName: '' }]);
  // THE SCREEN OPENS ON EVERYTHING. "All fatwas" is the opening selection, so the first thing
  // a reader sees is page one of the whole alphabet rather than one scholar's shelf; narrowing
  // to a single scholar is one choice away in the same selector. It is not a scholar, so it
  // needs no registry entry and survives a registry that never answers -- and Ibn Baz stays
  // first among the named scholars, exactly where he was.
  const [scholar, setScholar] = useState(EZIK_FATWA_ALL);
  const [query, setQuery] = useState('');
  const [lastQuery, setLastQuery] = useState('');
  const [results, setResults] = useState([]);
  const [pagination, setPagination] = useState(null);
  const [searched, setSearched] = useState(false);
  const [loading, setLoading] = useState(false);
  const [failed, setFailed] = useState(false);
  const searchRequest = useRef(null);
  const [browsing, setBrowsing] = useState([]);
  const [browsePages, setBrowsePages] = useState(null);
  const [browseLoading, setBrowseLoading] = useState(false);
  const [browseFailed, setBrowseFailed] = useState(false);
  const [openUid, setOpenUid] = useState('');
  const browseRequest = useRef(null);

  // The selector is fed by the registry so Ibn Uthaymeen can be added server-side later. Until
  // that first response arrives, Ibn Baz is already selectable; a registry failure adds no
  // warning panel to the deliberately spare empty screen.
  useEffect(() => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 45000);
    ezikFatwaFetch('/api/v1/scholars', controller.signal).then((payload) => {
      const list = Array.isArray(payload.scholars)
        ? payload.scholars.filter((item) => item && item.id && (item.shortName || item.name))
        : [];
      if (!list.length) return;
      const next = list.map((item) => ({ id: String(item.id), shortName: String(item.shortName || item.name) }));
      setScholars(next);
      writeCachedScholars(next);
      setScholar((current) => (current === EZIK_FATWA_ALL || list.some((item) => String(item.id) === current))
        ? current : String(list[0].id));
    }).catch(() => {}).finally(() => clearTimeout(timer));
    return () => { clearTimeout(timer); controller.abort(); };
  }, []);

  useEffect(() => () => {
    if (searchRequest.current) searchRequest.current.abort();
    if (browseRequest.current) browseRequest.current.abort();
  }, []);

  // The shelf is fetched for whatever is selected, including the moment the screen opens, so
  // a reader who has typed nothing still has something to read. A failure here leaves the
  // search box exactly as usable as it was.
  const runBrowse = async (page) => {
    if (browseRequest.current) browseRequest.current.abort();
    const controller = new AbortController();
    browseRequest.current = controller;
    const timer = setTimeout(() => controller.abort(), 60000);
    setBrowseLoading(true);
    setBrowseFailed(false);
    setOpenUid('');
    const params = new URLSearchParams({
      scholar,
      page: String(page || 1),
      limit: EZIK_FATWA_PAGE_SIZE,
      view: 'full',
    });
    try {
      const payload = await ezikFatwaFetch('/api/v1/fatwas/browse?' + params.toString(), controller.signal);
      if (browseRequest.current !== controller) return;
      setBrowsing(Array.isArray(payload.results) ? payload.results : []);
      setBrowsePages(payload.pagination || { page: 1, total: 0, totalPages: 0, hasPrevious: false, hasNext: false });
    } catch (error) {
      if (browseRequest.current !== controller) return;
      setBrowsing([]);
      setBrowsePages(null);
      setBrowseFailed(true);
    } finally {
      clearTimeout(timer);
      if (browseRequest.current === controller) {
        browseRequest.current = null;
        setBrowseLoading(false);
      }
    }
  };

  useEffect(() => { runBrowse(1); }, [scholar]);

  const runSearch = async (page, fixedQuery) => {
    const term = String(fixedQuery == null ? query : fixedQuery).trim();
    if (!term || loading) return;
    if (searchRequest.current) searchRequest.current.abort();
    const controller = new AbortController();
    searchRequest.current = controller;
    const timer = setTimeout(() => controller.abort(), 60000);
    setLastQuery(term);
    setSearched(true);
    setLoading(true);
    setFailed(false);
    setResults([]);
    setPagination(null);
    const params = new URLSearchParams({
      q: term,
      scholar,
      page: String(page || 1),
      limit: '10',
      view: 'full',
    });
    try {
      const payload = await ezikFatwaFetch('/api/v1/fatwas/search?' + params.toString(), controller.signal);
      if (searchRequest.current !== controller) return;
      setResults(Array.isArray(payload.results) ? payload.results : []);
      setPagination(payload.pagination || { page: 1, total: 0, totalPages: 0, hasPrevious: false, hasNext: false });
    } catch (error) {
      if (searchRequest.current !== controller) return;
      setFailed(true);
    } finally {
      clearTimeout(timer);
      if (searchRequest.current === controller) {
        searchRequest.current = null;
        setLoading(false);
      }
    }
  };

  const selectScholar = (event) => {
    setScholar(event.target.value);
    setResults([]);
    setPagination(null);
    setSearched(false);
    setFailed(false);
  };

  // Leaving a search restores the shelf rather than reloading it: the page the reader was on
  // is still in state, so the way back is instant and lands exactly where they left.
  const backToBrowse = () => {
    if (searchRequest.current) searchRequest.current.abort();
    searchRequest.current = null;
    setResults([]);
    setPagination(null);
    setSearched(false);
    setFailed(false);
    setLoading(false);
  };

  let status = null;
  let statusFailed = false;
  if (searched) {
    if (loading) status = ezT('fatwa.loading');
    else if (failed) { status = ezT('fatwa.error'); statusFailed = true; }
    else if (pagination && pagination.total === 0) status = ezT('fatwa.none');
    else if (pagination && pagination.total > 0) {
      status = ezT('fatwa.summary', {
        total: ezikFatwaNumber(pagination.total),
        page: ezikFatwaNumber(pagination.page),
        pages: ezikFatwaNumber(pagination.totalPages),
      });
    }
  } else if (browseLoading) status = ezT('fatwa.browseLoading');
  else if (browseFailed) { status = ezT('fatwa.error'); statusFailed = true; }
  else if (browsePages && browsePages.total === 0) status = ezT('fatwa.browseEmpty');
  else if (browsePages) {
    status = ezT('fatwa.browseSummary', {
      total: ezikFatwaNumber(browsePages.total),
      page: ezikFatwaNumber(browsePages.page),
      pages: ezikFatwaNumber(browsePages.totalPages),
    });
  }

  return (
    <div className="theme-dark ezhome ezf" style={s.ezfContainer}>
      <div className="ezsh-nav">
        <div className="ezsh-nav-inner">
          <div className="ezsh-nav-side">
            <button type="button" className="ezhome-focus" onClick={onBack}
              style={s.ezshNavBtn} aria-label={ezT('common.back')}>{A2_ICON_BACK}</button>
          </div>
          <span aria-hidden="true" />
          <div className="ezsh-nav-side is-end" />
        </div>
      </div>
      <div style={s.ezshScroll}>
        <main className="ezf-wrap">
          <form className="ezf-controls" role="search" onSubmit={(event) => {
            event.preventDefault();
            runSearch(1);
          }}>
            <label className="ezf-field" htmlFor="ezf-scholar">
              <span className="ezf-label">{ezT('fatwa.scholarLabel')}</span>
              <select id="ezf-scholar" className="ezhome-focus ezf-select"
                value={scholar} onChange={selectScholar}>
                <option value={EZIK_FATWA_ALL}>{ezT('fatwa.allScholars')}</option>
                {scholars.map((item) => (
                  <option key={item.id} value={item.id}>{item.shortName || ezT('fatwa.defaultScholar')}</option>
                ))}
              </select>
            </label>
            <div className="ezf-search">
              <input className="ezhome-focus ezf-input" type="search" dir="auto" required maxLength="180"
                value={query} onChange={(event) => setQuery(event.target.value)}
                placeholder={ezT('fatwa.searchPlaceholder')} aria-label={ezT('fatwa.searchAria')} />
              <button type="submit" className="ezhome-focus ezf-submit"
                disabled={loading}>{ezT('fatwa.searchButton')}</button>
            </div>
          </form>

          {status ? <div className={'ezf-status' + (statusFailed ? ' is-error' : '')}
            role={statusFailed ? 'alert' : 'status'} aria-live="polite">{status}</div> : null}

          {searched ? (
            <React.Fragment>
              <button type="button" className="ezhome-focus ezf-back"
                onClick={backToBrowse}>{ezT('fatwa.backToBrowse')}</button>
              {results.length ? (
                <section className="ezf-results" aria-label={ezT('fatwa.searchAria')}>
                  {results.map((fatwa) => <EzikFatwaResult key={fatwa.uid} fatwa={fatwa} />)}
                </section>
              ) : null}
            </React.Fragment>
          ) : browsing.length ? (
            <section className="ezf-list" aria-label={ezT('fatwa.browseAria')}>
              {browsing.map((fatwa) => {
                const isOpen = openUid === fatwa.uid;
                const named = (fatwa.scholar && (fatwa.scholar.shortName || fatwa.scholar.name)) || '';
                return (
                  <React.Fragment key={fatwa.uid}>
                    <button type="button" aria-expanded={isOpen}
                      className={'ezhome-focus ezf-row' + (isOpen ? ' is-open' : '')}
                      title={isOpen ? ezT('fatwa.closeFatwa') : ezT('fatwa.openFatwa')}
                      onClick={() => setOpenUid(isOpen ? '' : fatwa.uid)}>
                      <span className="ezf-row-title">{fatwa.title}</span>
                      {scholar === EZIK_FATWA_ALL && named
                        ? <span className="ezf-row-mark">{named}</span> : null}
                    </button>
                    {isOpen ? <div className="ezf-open"><EzikFatwaResult fatwa={fatwa} /></div> : null}
                  </React.Fragment>
                );
              })}
            </section>
          ) : null}

          {searched && pagination && pagination.totalPages > 1 ? (
            <nav className="ezf-pager" aria-label={ezT('fatwa.page', {
              page: ezikFatwaNumber(pagination.page), pages: ezikFatwaNumber(pagination.totalPages)
            })}>
              <button type="button" className="ezhome-focus ezf-page-btn"
                disabled={loading || !pagination.hasPrevious}
                onClick={() => runSearch(pagination.page - 1, lastQuery)}>{ezT('fatwa.previous')}</button>
              <span className="ezf-page-text">{ezT('fatwa.page', {
                page: ezikFatwaNumber(pagination.page), pages: ezikFatwaNumber(pagination.totalPages)
              })}</span>
              <button type="button" className="ezhome-focus ezf-page-btn"
                disabled={loading || !pagination.hasNext}
                onClick={() => runSearch(pagination.page + 1, lastQuery)}>{ezT('fatwa.next')}</button>
            </nav>
          ) : null}

          {!searched && browsePages && browsePages.totalPages > 1 ? (
            <nav className="ezf-pager" aria-label={ezT('fatwa.page', {
              page: ezikFatwaNumber(browsePages.page), pages: ezikFatwaNumber(browsePages.totalPages)
            })}>
              <button type="button" className="ezhome-focus ezf-page-btn"
                disabled={browseLoading || !browsePages.hasPrevious}
                onClick={() => runBrowse(browsePages.page - 1)}>{ezT('fatwa.previous')}</button>
              <span className="ezf-page-text">{ezT('fatwa.page', {
                page: ezikFatwaNumber(browsePages.page), pages: ezikFatwaNumber(browsePages.totalPages)
              })}</span>
              <button type="button" className="ezhome-focus ezf-page-btn"
                disabled={browseLoading || !browsePages.hasNext}
                onClick={() => runBrowse(browsePages.page + 1)}>{ezT('fatwa.next')}</button>
            </nav>
          ) : null}
        </main>
      </div>
    </div>
  );
}

// ============================================================
// EZIK ADHKAR UI V2 -- the premium Arabic RTL redesign of the adhkar browse screen.
// ------------------------------------------------------------
// THE SWITCH, and it has the same shape as MADINA_IMG_ON below: the parameter ANSWERS
// rather than merely writing, so an explicit '1' or '0' returns straight from the URL and
// never consults storage at all. A stale key, a value some other build wrote, a quota-full
// setItem or a storage that throws cannot make ?adhkarui=0 keep V2 on or ?adhkarui=1 keep
// it off. The write is still attempted, in its own try/catch, so the answer survives the
// next visit without the parameter -- but the write failing changes nothing about THIS visit.
//
//   no adhkarui parameter -> V2   (unless this device stored an explicit refusal)
//   ?adhkarui=1           -> V2
//   ?adhkarui=0           -> V1   (the S13.3-A screen, immediate rollback, sticks on device)
//
// V1 IS NOT EDITED. AdhkarScreenV1 below is the previous component with its name changed and
// not one other byte touched, so the rollback path is the old screen itself and not a
// reconstruction of it. V2 is additive: new component, new style keys, no shared mutable state.
//
// NO DEVOTIONAL CONTENT IS AUTHORED, REWRITTEN OR REORDERED HERE. Every title, every dhikr
// body, every repetition target and every audio URL is read from adhkar.json through the same
// loadAdhkar() store the old screen and the chat card read, rendered in the store's own order.
// The only strings this file adds are chrome: the back label, the search placeholder, the
// empty-result line, the source attribution and the listen/stop labels -- and each one is
// LIFTED, code point for code point, from the V1 screen or from DhikrCard. Not one of them
// is a new phrase. They are hoisted into named constants below so the difference between
// chrome and content is visible at a glance and so a future edit cannot drift one of them
// away from the V1 wording without the constant showing it.
const ADHKAR_UI_V2_KEY = 'adhkar_ui_v2';   // device key. '0' = V1, anything else = V2
const readAdhkarUiFlag = () => {
  let p = null;
  try { p = new URLSearchParams(window.location.search).get('adhkarui'); } catch (e) { p = null; }
  if (p === '1' || p === '0') {
    try { localStorage.setItem(ADHKAR_UI_V2_KEY, p); } catch (e) {}
    return p === '1';
  }
  // No parameter: the default is V2, and only a stored, well-formed refusal turns it off.
  try { return localStorage.getItem(ADHKAR_UI_V2_KEY) !== '0'; } catch (e) { return true; }
};
const ADHKAR_UI_V2_ON = readAdhkarUiFlag();

// Session 85 -- the royal-blue header pattern that used to live here is GONE with the band it
// painted. Neither new design draws a large filled blue rectangle: both open with a compact
// pure-white top row, so there is no gradient stack, no lattice and no band left to build.

// Chrome strings. Every one of them is a string the app ALREADY shows on this journey
// (V1 header/search/empty, DhikrCard label/meta/buttons); none is new devotional text.
// A2_TITLE is the one intentional wording change on this screen, and it is chrome, not
// content: the V2 header names the screen for the du'a it opens onto.
const A2_BRAND  = 'عزك';
const A2_TITLE  = 'الأدعية';
let A2_BACK = ezT("common.back");
const A2_SEARCH = 'ابحث عن ذكر';
const A2_EMPTY  = 'لا نتائج';
const A2_SOURCE = 'حصن المسلم';
const A2_LISTEN = 'استماع';
const A2_STOP   = 'إيقاف';
// Byte-for-byte the meta line V1 renders: the same two words around the same Arabic-Indic digits.
const a2Repeat = (n) => 'تُقال ' + toArabicDigits(n) + ' مرّات';
// A module-level COPY of the V1 search normaliser, so V2 filters identically without reaching
// into V1's closure and without V1 changing. Same replacements, same order, same result.
const adhkarNormAr = (str) => String(str || '')
  .replace(/[ؐ-ًؚ-ٰٟ]/g, '')
  .replace(/[أإآ]/g, 'ا')
  .replace(/ى/g, 'ي')
  .replace(/ؤ/g, 'و')
  .replace(/ئ/g, 'ي')
  .replace(/ة/g, 'ه');

// ============================================================
// ADHKAR UI V2 -- DEVICE-LOCAL STATE. Three keys, and everything true of them is true of all
// three: they are written and read ONLY by the two V2 components below and by resetAll, they
// hold IDENTIFIERS AND INTEGERS AND NOTHING ELSE, and no line of this file passes any of them
// to fetch(), to a request body, to a server handler, to an analytics call or to anything that
// builds an AI payload. There is no beacon, no sync, no background transmission and nothing to
// transmit: a dhikr, a title, a source and an audio URL all stay in adhkar.json, and what is
// stored is '<categoryId>:<index>' plus a count. Clearing the keys loses counters; it cannot
// lose devotional text, because none was ever put there.
const ADHKAR_PROGRESS_KEY = 'adhkar_daily_progress_v1';
const ADHKAR_FAVORITES_KEY = 'adhkar_favorites_v1';
const ADHKAR_USAGE_KEY = 'adhkar_usage_v1';
const ADHKAR_DAILY_GOAL = 8;

// The identifier, and it is deliberately (category id, position) rather than d.id: it is stable
// for a given store, it is two integers, and it says nothing about what the item contains.
const A2_ID_RE = /^[0-9]+:[0-9]+$/;
const adhkarItemKey = (catId, i) => String(catId) + ':' + String(i);
// DEVICE-LOCAL day, not toISOString: the day a reader lives by is their own midnight. Same
// reasoning, and the same three getters, as wirdDayKey -- and its OWN function, so the mushaf
// wird keeps every byte of its behaviour whatever happens here.
function adhkarDayKey(d) {
  const t = d || new Date();
  const y = t.getFullYear();
  const m = t.getMonth() + 1;
  const day = t.getDate();
  return String(y) + '-' + (m < 10 ? '0' : '') + String(m) + '-' + (day < 10 ? '0' : '') + String(day);
}
// THE COUNT THE DHIKR ITSELF STATES.
//
// The store's `repeat` field is right when it is there, and it is missing from items whose own
// text ends by naming the number: «(سبع مرات)» on one and «(ثلاثَ مرَّاتٍ)» on another, while the
// record says repeat:1. The counter then offered 0/1 for a dhikr the reader can see is said seven
// times. That is the defect, and it is fixed by READING the text, not by editing adhkar.json --
// the two copies of that file are compared byte for byte by a gate, and picking a number for a
// religious text is not a decision this file gets to make.
//
// WHAT IT WILL MATCH, and it is deliberately narrow: a parenthesised group at the very END of the
// text, containing exactly a number word and the word "مرة"/"مرات", with the diacritics stripped
// first. Nothing else. A group followed by more parentheses does not match, which is how
// «واتفل على يسارك (ثلاثاً)))» is left alone -- that three governs the spitting inside the hadith,
// not the recitation of the dhikr. A group with extra words does not match either, so
// «(مائةَ مرَّةٍ إذا أصبحَ)» falls back to its stored 100 rather than being re-read.
//
// MEASURED over the shipped adhkar.json, all 267 items: nine name a trailing count. Six of those
// nine ALSO carry a stored repeat, and the number read from the text equals the stored number in
// all six -- zero disagreements. The remaining three are the defect: ids 83 and 148 move from
// 1 to 7, and id 130 from 1 to 3. No other item's target moves by one.
const A2_TASHKEEL_RE = /[\u064B-\u0652\u0670\u06D6-\u06ED\u0640]/g;
const A2_TAIL_PAREN_RE = /\(([^()]{1,30})\)\s*[.\u060C\u061B]?\s*$/;
const A2_REPEAT_UNIT_RE = /^مر(?:ة|ات)$/;
// Only words that name a number greater than one: a group that resolves to 1 is no instruction at
// all, and this must never be able to LOWER a target.
const A2_REPEAT_WORDS = {
  'مرتين': 2,
  'ثلاث': 3, 'ثلاثا': 3,
  'أربع': 4, 'اربع': 4,
  'خمس': 5, 'ست': 6, 'سبع': 7, 'ثمان': 8, 'تسع': 9,
  'عشر': 10, 'عشرا': 10,
  'مائة': 100, 'مئة': 100,
};
const adhkarTextRepeat = (text) => {
  const t = String(text || '').replace(A2_TASHKEEL_RE, '');
  const m = A2_TAIL_PAREN_RE.exec(t);
  if (!m) return 0;
  const parts = m[1].split(/\s+/).filter(Boolean);
  if (parts.length === 1) return parts[0] === 'مرتين' ? 2 : 0;
  if (parts.length !== 2 || !A2_REPEAT_UNIT_RE.test(parts[1])) return 0;
  const n = A2_REPEAT_WORDS[parts[0]];
  return (n && n > 1) ? n : 0;
};

// The item's REAL repetition target. THE STORED NUMBER STILL WINS whenever it says anything at
// all: a record that carries repeat:3 is answered with 3 and the text is not consulted. The text
// is read only where the record is silent -- repeat missing, zero, unparseable or 1 -- and only
// through the narrow reader above. A missing repeat with a silent text is one recitation, exactly
// as before. Nothing here can invent a target the item does not state in one place or the other.
const adhkarTarget = (d) => {
  const n = parseInt(d && d.repeat, 10);
  if (Number.isFinite(n) && n > 1) return n;
  const fromText = adhkarTextRepeat(d && d.text);
  if (fromText > 1) return fromText;
  return (Number.isFinite(n) && n > 0) ? n : 1;
};

// { d: 'YYYY-MM-DD', n: { '<catId>:<index>': count } }. Anything that is not TODAY'S well-formed
// record reads as today's EMPTY record: a record from another local date, damaged JSON, a
// missing key, a non-object map, a storage that throws. That is the whole of the day rollover --
// no timer, no midnight listener, no cleanup pass; the first read after the local date changes
// simply does not recognise yesterday and starts the day at zero. Keys that do not match the
// identifier shape and counts that are not positive integers are dropped on the way out, so a
// hand-edited store cannot produce a count the UI would then present as devotion performed.
function readAdhkarProgress() {
  const today = adhkarDayKey();
  const empty = { d: today, n: {} };
  let raw = null;
  try { raw = localStorage.getItem(ADHKAR_PROGRESS_KEY); } catch (e) { return empty; }
  if (!raw) return empty;
  let o = null;
  try { o = JSON.parse(raw); } catch (e) { return empty; }
  if (!o || typeof o !== 'object' || o.d !== today) return empty;
  if (!o.n || typeof o.n !== 'object') return empty;
  const n = {};
  for (const k of Object.keys(o.n)) {
    if (!A2_ID_RE.test(k)) continue;
    const v = o.n[k];
    if (!Number.isInteger(v) || v < 1) continue;
    n[k] = v;
  }
  return { d: today, n: n };
}
const adhkarCountOf = (rec, catId, i) => (rec && rec.n && rec.n[adhkarItemKey(catId, i)]) || 0;
// The ONLY writer of the progress key. One press is one increment: it adds exactly 1 and it
// refuses at the target, so a held finger, a double tap or a replayed click cannot carry an
// item past its real repetition count. localStorage only -- no request, no beacon.
function bumpAdhkarCount(catId, i, target) {
  const rec = readAdhkarProgress();
  const key = adhkarItemKey(catId, i);
  if (!A2_ID_RE.test(key)) return rec;
  const cap = (Number.isInteger(target) && target > 0) ? target : 1;
  const cur = rec.n[key] || 0;
  if (cur >= cap) return rec;
  const n = Object.assign({}, rec.n);
  n[key] = cur + 1;
  const next = { d: rec.d, n: n };
  try { localStorage.setItem(ADHKAR_PROGRESS_KEY, JSON.stringify(next)); } catch (e) {}
  return next;
}
// COMPLETE means the item's own target was reached, and nothing else means it. Both counters
// below resolve every stored count against the REAL item it names and skip any key that no
// longer resolves, so a renumbered store shows fewer completions rather than phantom ones.
function adhkarCatDone(rec, catId, items) {
  if (!rec || !Array.isArray(items)) return 0;
  let done = 0;
  for (let i = 0; i < items.length; i++) {
    if (adhkarCountOf(rec, catId, i) >= adhkarTarget(items[i])) done += 1;
  }
  return done;
}
function adhkarCompletedToday(rec, byCat) {
  if (!rec || !rec.n || !byCat) return 0;
  let done = 0;
  for (const k of Object.keys(rec.n)) {
    const parts = k.split(':');
    const list = byCat[parseInt(parts[0], 10)];
    if (!Array.isArray(list)) continue;
    const item = list[parseInt(parts[1], 10)];
    if (!item) continue;
    if (rec.n[k] >= adhkarTarget(item)) done += 1;
  }
  return done;
}

// Favourites: an ARRAY OF IDENTIFIERS. No text, no title, no audio URL, no timestamp. Entries
// that are not well-formed identifiers, and duplicates, are dropped on read.
function readAdhkarFavorites() {
  let raw = null;
  try { raw = localStorage.getItem(ADHKAR_FAVORITES_KEY); } catch (e) { return []; }
  if (!raw) return [];
  let o = null;
  try { o = JSON.parse(raw); } catch (e) { return []; }
  if (!Array.isArray(o)) return [];
  const out = [];
  for (const v of o) {
    if (typeof v !== 'string' || !A2_ID_RE.test(v)) continue;
    if (out.indexOf(v) !== -1) continue;
    out.push(v);
  }
  return out;
}
function toggleAdhkarFavorite(key) {
  const cur = readAdhkarFavorites();
  if (!A2_ID_RE.test(key)) return cur;
  const at = cur.indexOf(key);
  const next = at === -1 ? cur.concat([key]) : cur.slice(0, at).concat(cur.slice(at + 1));
  try { localStorage.setItem(ADHKAR_FAVORITES_KEY, JSON.stringify(next)); } catch (e) {}
  return next;
}

// Usage: { '<catId>': timesOpened }. The single call site is the category-open handler, so the
// count is literally "how many times this device opened this door" and is incremented nowhere
// else -- not on render, not on search, not on scroll. It never leaves the device, and the home
// screen shows the section only when the map already has a real entry, so a fresh install sees
// no most-used strip rather than a fabricated one.
function readAdhkarUsage() {
  let raw = null;
  try { raw = localStorage.getItem(ADHKAR_USAGE_KEY); } catch (e) { return {}; }
  if (!raw) return {};
  let o = null;
  try { o = JSON.parse(raw); } catch (e) { return {}; }
  if (!o || typeof o !== 'object' || Array.isArray(o)) return {};
  const out = {};
  for (const k of Object.keys(o)) {
    if (!/^[0-9]+$/.test(k)) continue;
    const v = o[k];
    if (!Number.isInteger(v) || v < 1) continue;
    out[k] = v;
  }
  return out;
}
function bumpAdhkarUsage(catId) {
  const cur = readAdhkarUsage();
  const k = String(catId);
  if (!/^[0-9]+$/.test(k)) return cur;
  const next = Object.assign({}, cur);
  next[k] = (next[k] || 0) + 1;
  try { localStorage.setItem(ADHKAR_USAGE_KEY, JSON.stringify(next)); } catch (e) {}
  return next;
}
// Most-used, resolved against the REAL category list: a stored id with no category is skipped,
// and a category with no stored count never appears. Ties keep the store's own order because
// Array#sort is stable, so the strip cannot reorder itself between two equal counts.

// Session 86 -- THE ADHKAR-ONLY DESIGN KEY IS GONE. adhkar_design_v1 was never deployed, so

// A compact WINDOW of real positions around the current one. A category of four hundred items
// does not become four hundred dots: the window is at most A3_WINDOW marks wide, it slides so
// the current position stays inside it, and every number it yields is a real index into the
// real item list -- it shortens the DRAWING, never the category.
const A3_WINDOW = 7;
function adhkarWindow(len, idx, size) {
  const n = Math.max(0, parseInt(len, 10) || 0);
  const w = Math.min(n, Math.max(1, parseInt(size, 10) || 1));
  if (w <= 0) return [];
  const at = Math.min(Math.max(0, parseInt(idx, 10) || 0), n - 1);
  const start = Math.max(0, Math.min(at - Math.floor(w / 2), n - w));
  const out = [];
  for (let i = 0; i < w; i++) out.push(start + i);
  return out;
}

function AdhkarScreenV2({ onBack }) {
  // Session 85. THIS COMPONENT IS STILL THE ONLY OWNER OF BROWSE STATE. The store, the query,
  // the selection, today's progress, the usage map and the favourite identifiers are loaded,
  // read and written here exactly as before; the two home components below receive them as
  // props and render them. There is no second loader, no second storage path and no copy of
  // any of these values kept anywhere else -- switching design switches which component draws
  // this state, and touches none of it. Session 86: the hook is the APPLICATION one, so the
  // style this screen draws in is the style the home screen draws in -- one key, one event.
  // The WHOLE store is kept now, not just db.categories: the daily card resolves each stored
  // count against the real item it names, and byCat is where those items are. Still one
  // loadAdhkar() call, still the store's own objects, still no reshaping of any of them.
  const [db, setDb] = useState(null);
  const [query, setQuery] = useState('');
  const [searchOpen, setSearchOpen] = useState(false);
  const [selected, setSelected] = useState(null);
  const [startAt, setStartAt] = useState(0);
  const [prog, setProg] = useState(readAdhkarProgress);
  const [usage, setUsage] = useState(readAdhkarUsage);
  const [favs, setFavs] = useState(readAdhkarFavorites);
  useEffect(() => {
    let alive = true;
    loadAdhkar().then((d) => { if (alive) setDb(d || { categories: [], byCat: {} }); })
      .catch(() => { if (alive) setDb({ categories: [], byCat: {} }); });
    return () => { alive = false; };
  }, []);
  const cats = db ? (db.categories || []) : null;
  // Same filter as V1: normalise both sides, substring, and an empty query keeps EVERY
  // category in the store's own order. Nothing is ranked and nothing is hidden.
  const q = adhkarNormAr(query).trim();
  const list = (cats || []).filter((c) => !q || adhkarNormAr(c.title).includes(q));
  // THE ONLY usage write in the app, and it is still on the OPEN -- one increment per opened
  // door, whichever design drew the door. The optional second argument is a real index inside
  // the category the caller already resolved (the favourites list opens at the saved item);
  // anything else opens at the first item, and nothing here can point past the category.
  const open = (c, at) => {
    setUsage(bumpAdhkarUsage(c.id));
    const n = parseInt(at, 10);
    setStartAt(Number.isFinite(n) && n > 0 ? n : 0);
    setSelected(c);
  };
  // ===== closeAdhkarDetail -- THE ADHKAR'S OWN NESTED CLOSER =====
  // It closes the OPEN CATEGORY (with the item being read inside it) and reveals this browse
  // screen; it does not leave the adhkar, and only the browse screen's own back does that. It
  // touches no storage: the counters, the favourites and the per-category open counts are
  // RE-READ from the same keys the reader just wrote, so returning shows exactly what the
  // counter recorded -- including a day that rolled over mid-session -- and nothing is cleared,
  // reset or re-mounted. Audio and share belong to the reader and stop with it, as they always
  // did. S87: this is also what a hardware/browser back runs first while a category is open.
  const closeAdhkarDetail = () => {
    setSelected(null);
    setProg(readAdhkarProgress());
    setFavs(readAdhkarFavorites());
    setUsage(readAdhkarUsage());
  };
  useEzikBackLayer(!!selected, closeAdhkarDetail);
  // S91: the reader's own back presses the application back, which spends the entry this layer
  // took when it opened and then runs closeAdhkarDetail through the registry -- the same closer,
  // reached by the same route the device button uses.
  if (selected) return <AdhkarCategoryV2 cat={selected} startAt={startAt} onBack={ezikGoBack} />;
  // COMPLETED means target reached, counted over distinct items, and capped for DISPLAY at the
  // goal -- min(done, 8) of 8. A ninth completion is real and is not shown as a ninth eighth.
  const done = adhkarCompletedToday(prog, db && db.byCat);
  // ONE view object, handed to whichever home is drawn. Both receive the same store, the same
  // filtered list, the same progress record and the same handlers -- there is nothing a home
  // component can compute that the other cannot, and nothing either of them may write.
  const view = {
    onBack: onBack,
    cats: cats,
    list: list,
    query: query,
    setQuery: setQuery,
    // The row is open while it is asked for OR while a query is live, so a filter can never be
    // in force with no visible way to clear it; closing it clears the query and restores the
    // full list. Both designs share this one handler, so a query survives a design switch.
    searchOpen: searchOpen || query.length > 0,
    onToggleSearch: () => {
      const next = !(searchOpen || query.length > 0);
      setSearchOpen(next);
      if (!next) setQuery('');
    },
    onOpen: open,
    prog: prog,
    byCat: (db && db.byCat) || {},
    usage: usage,
    favs: favs,
    done: done,
  };
  // The whole of the style switch on this screen: which component receives the state above.
  // S103: the istana catalogue is the whole of the answer. Both legacy browse designs were
  // deleted in the same commit as this line; nothing else referenced either of them.
  return <IstanaAdhkarBrowse {...view} />;
}

// Real per-category standing, read off the SAME progress record the counter writes. A category
// the store does not resolve reports zero of zero and is drawn as untouched -- never as begun.
function a3CatStanding(prog, cat, byCat) {
  const items = byCat ? byCat[parseInt(cat.id, 10)] : null;
  const total = Array.isArray(items) ? items.length : 0;
  const done = total ? adhkarCatDone(prog, cat.id, items) : 0;
  return { total: total, done: done, full: total > 0 && done >= total, started: done > 0 };
}

}
