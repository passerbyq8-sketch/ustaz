        if (abortRef.current === controller) { clearSearchingHint(); setIsLoading(false); setStreamingText(null); }
        return;
      }
      reply = getFriendlyError('network', profile?.gender);
    }
    if (abortRef.current !== controller) return; // a newer request owns the UI — leave its state alone
    abortRef.current = null;
    clearSearchingHint();
    setStreamingText(null);
    const aiMsg = { role: 'assistant', content: reply, timestamp: new Date().toISOString() };
    const final = [...updated, aiMsg];
    setMessages(final);
    // S98: THIS LINE IS THE STREAMING TRANSITION — setStreamingText(null) two lines up retires the
    // live preview and this push puts the finished reply in its place. Recording the position here
    // is what keeps a long answer at the length it was just read at, instead of collapsing under
    // the reader the moment it finished arriving. Batched with the setMessages above, so the
    // bubble's first commit already knows it is open and there is no intermediate folded frame.
    markStreamedOpen(final.length - 1);
    saveMessages(final);
    setIsLoading(false);
    if (voiceMode) speakReply(reply); // audio runs on the final full text — not during the stream
  };

  // ============================================================
  // THE SECTION SUGGESTIONS -- three ways out of an empty chat, above the composer
  // ============================================================
  // WHAT THEY ARE. Three of the app's own sections, each opened by the SAME handler the home
  // screen uses for it: الفتاوى -> setScreen('fatwa'), رحلة الكنوز -> /quest.html, المصحف ->
  // setScreen('mushaf'). No fourth entry: the brief allows a lessons section only if one already
  // exists, and this app has no lessons section -- the five modules are memorize, adhkar,
  // mushaf, treasure and fatwa, and none of them is that. The labels and the one-line
  // descriptions are the module strings the home already shows, so they translate with the rest
  // of the interface and no new wording enters the app.
  //
  // WHAT THEY ARE NOT. They send nothing, they do not touch the composer's text, and they are
  // not a suggestion the MODEL made -- <suggestions> inside a reply is a different thing
  // rendered elsewhere by MessageBubble, and this neither replaces nor imitates it.
  const sectionSuggestions = [
    { id: 'fatwa', label: EZH_FATWA, icon: EZH_ICON_FATWA, go: () => setScreen('fatwa') },
    { id: 'treasure', label: EZH_TREASURE, icon: EZH_ICON_TREASURE, go: () => { window.location.href = '/quest.html'; } },
    { id: 'mushaf', label: EZH_MUSHAF, icon: EZH_ICON_MUSHAF, go: () => setScreen('mushaf') },
  ];
  // THE THIRD STATE IS ABSENCE. One expression decides it, and each term is a separate promise
  // the brief makes: an empty thread (a conversation with anything in it keeps them hidden --
  // and a stream implies a question, so messages is never empty during one), nothing being
  // streamed, and NOT ONE typed character. Because it reads the live value of `input`, clearing
  // the text brings them straight back, and because `composerFocused` only chooses the SHAPE,
  // blurring an empty composer returns the stack rather than the row.
  const sectionSuggestVisible = messages.length === 0 && streamingText === null && input.length === 0;

  // ============================================================
  // S98 — الإجراءات السريعة والاقتباس (quick actions + quote)
  // ============================================================
  // A quick action IS a message. It goes through sendMessage above and nothing else, so the model
  // tier, the depth mode, the sourcing policy and the sliding history window are all whatever the
  // composer would have used for the same sentence typed by hand.
  //
  // ONE PRESS, ONE SEND. `isLoading` alone could not promise that: it is state, and two clicks
  // dispatched inside one task both read the value from before React committed the first. This
  // ref flips SYNCHRONOUSLY on the first press, so the second finds it already taken. It is
  // released when the turn ends, which is exactly when isLoading goes back to false.
  const quickBusyRef = useRef(false);
  useEffect(() => { if (!isLoading) quickBusyRef.current = false; }, [isLoading]);
  const runQuickAction = (prompt) => {
    if (quickBusyRef.current || isLoading || streamingText !== null) return;
    quickBusyRef.current = true;
    sendMessage(prompt);
  };

  // ── STREAM-P4 §٣/٢: THE COMPOSER'S `Enter`, IN ONE PLACE ──────────────────
  //
  // FOUR TESTS, IN THIS ORDER, AND THE ORDER IS THE RULE:
  //
  //  1. NOT AN `Enter` AT ALL — nothing to decide.
  //  2. THE KEYBOARD IS STILL COMPOSING. An IME, and every predictive Arabic keyboard, uses
  //     `Enter` to ACCEPT the candidate it is offering. Sending there submits the half of the
  //     question that had been typed so far, which is the most-reported version of this defect
  //     and the reason this test comes before every other one.
  //  3. `Shift+Enter` IS A NEWLINE. Unchanged, on every device.
  //  4. AND THEN WHAT THE READER ASKED FOR. `enterSends` is the resolved preference, and its
  //     person writes a second line, and the button beside the field is how they send. The
  //     reverse — the shipped behaviour until now — costs a question every time somebody
  //     reaches for a new paragraph. الإعدادات can now overrule the guess in either
  //     direction; it cannot overrule tests 1..3, which run first and are not preferences.
  //
  // AND THE KEY IS LABELLED HONESTLY. `enterKeyHint` is what puts «send» or a return arrow on
  // the on-screen keyboard's corner key; leaving it saying «send» on a path where `Enter`
  // writes a newline is the keyboard promising something the app then declines to do.
  const onComposerKeyDown = (e) => {
    if (e.key !== 'Enter') return;
    if (composingRef.current || e.nativeEvent?.isComposing
      || e.which === 229 || e.keyCode === 229) return;
    if (e.shiftKey) return;
    if (!enterSends) return;
    e.preventDefault();
    e.target.style.height = 'auto';
    sendMessage(input);
  };
  // The reader's actual device, recorded from the event rather than inferred from the viewport.
  // Guarded so an unchanged value costs no render: this fires on every press of the field.
  const onComposerPointerDown = (e) => {
    const touch = e.pointerType === 'touch' || e.pointerType === 'pen';
    if (touch !== inputIsTouch) setInputIsTouch(touch);
  };
  // Where the quick actions may appear, and it is deliberately ONE place: under the newest reply,
  // when that reply is finished, is the assistant's, is not one of the client's own error lines,
  // and the conversation actually has a question in it (so the boot greeting never grows a «بسّط»).
  const lastMsg = messages.length ? messages[messages.length - 1] : null;
  const quickActionsVisible = !!lastMsg
    && lastMsg.role === 'assistant'
    && !isLoading
    && streamingText === null
    && !ezikIsErrorReply(lastMsg.content)
    && messages.some((m) => m && m.role === 'user');

  // ============================================================
  // S98 PERF — the bubble's props are PINNED
  // ============================================================
  // MEASURED, and this is what it is for. Adding a quote button and a star to every reply put two
  // more buttons and an icon into each of a 120-turn thread's bubbles, and the composer's state
  // lives on App — so a single keystroke rebuilt and reconciled all of them. Interleaved before/
  // after over 440 keystrokes: 1.20 ms -> 1.60 ms, +33%, Welch t=14.4. Small in absolute terms and
  // real beyond any doubt, which is exactly the kind of drift that accumulates until someone
  // measures a 60 ms keystroke and cannot say which of ten sessions caused it.
  //
  // THE FIX IS TO STOP RE-RENDERING THE THREAD AT ALL, not to shave the new buttons. Every handler
  // a bubble takes is pinned to one identity for the life of the app and reaches the CURRENT
  // implementation through a ref that is refreshed after each render — the same latest-ref pattern
  // useEzikBackLayer and the spend gate already use here. With the callbacks stable and the rest of
  // the props primitives (or the message object itself, whose identity the thread preserves),
  // React.memo on MessageBubble makes a keystroke re-render the composer and nothing else.
  //
  // It is safe for the cards precisely because none of them depends on a parent re-render: every
  // async card — verse, surah, dhikr, worship — holds its own state and its own effect and
  // re-renders itself when its store lands.
  // MOVED UP from beside submitReport, and it must stay above every `if (screen === ...) return`.
  // The effect below closes over it, and an effect callback runs AFTER the component function has
  // returned — so on the loading screen, where App returns long before the old position was ever
  // reached, the binding was still in its temporal dead zone and the first commit threw «Cannot
  // access 'openReport' before initialization». The same trap S94 documents for newChat.
  const openReport = (aiMsg, prevMsg) => {
    const aiText = aiMsg && typeof aiMsg.content === 'string' ? aiMsg.content : '';
    let userText = '';
    if (prevMsg && prevMsg.role === 'user') {
      const c = prevMsg.content;
      if (typeof c === 'string') userText = c;
      else if (Array.isArray(c)) { const t = c.find(b => b && b.type === 'text'); userText = t ? t.text : ''; }
    }
    setReportFor({ ai: aiText, user: userText });
  };

  const bubbleFnRef = useRef({});
  useEffect(() => {
    bubbleFnRef.current = {
      send: sendMessage,
      playVerse: playVerseManual,
      playSurah: playSurahManual,
      stopAudio: cancelAudio,
      speak: speakReply,
      toggleTashkeel: toggleTashkeel,
      quote: quoteReply,
      favorite: toggleFavoriteReply,
      report: openReport,
      messages: messages,
    };
  });
  const cbSuggestion = React.useCallback((sg) => bubbleFnRef.current.send(sg), []);
  const cbPlayVerse = React.useCallback((sNum, aNum) => bubbleFnRef.current.playVerse(sNum, aNum), []);
  const cbPlaySurah = React.useCallback((sNum, from, to) => bubbleFnRef.current.playSurah(sNum, from, to), []);
  const cbStopAudio = React.useCallback(() => bubbleFnRef.current.stopAudio(), []);
  const cbPlayMessage = React.useCallback((t) => bubbleFnRef.current.speak(t), []);
  const cbToggleTashkeel = React.useCallback(() => bubbleFnRef.current.toggleTashkeel(), []);
  const cbQuote = React.useCallback((t) => bubbleFnRef.current.quote(t), []);
  const cbFavorite = React.useCallback((m, idx) => bubbleFnRef.current.favorite(m, idx), []);
  // The report needs the reply AND the question before it, which used to be closed over per bubble.
  // The index is a stable prop; the pair is looked up on the tap, off the current thread.
  const cbReport = React.useCallback((idx) => {
    const ms = bubbleFnRef.current.messages || [];
    bubbleFnRef.current.report(ms[idx], idx > 0 ? ms[idx - 1] : null);
  }, []);

  // THE QUOTE. It writes to the composer and moves the caret there — no send, no store, and the
  // reply it was taken from is not altered in any way. Text already typed is KEPT: the quote is
  // appended below it after a blank line, so nothing a child was in the middle of writing is lost.
  const quoteReply = (clean) => {
    const block = ezikBuildQuote(clean);
    if (!block) return;
    setInput((prev) => ezikComposeWithQuote(prev, block));
    // After the value lands, not before — otherwise the caret is placed in the old text.
    setTimeout(() => {
      const el = inputElRef.current;
      if (!el) return;
      try { el.focus(); const n = String(el.value || '').length; el.setSelectionRange(n, n); } catch (e) {}
    }, 0);
  };

  // ============================================================
  // Live voice-call mode (Layer 2) — ONE automatic turn
  // ============================================================
  // Reuses the existing brain (callAI + sliceHistoryForAPI; the prompt itself is the server's
  // since D02ب) and audio-out
  // (speakReply / cancelAudio). A dedicated callRecognitionRef is fully isolated from the dictation
  // mic. Call onresult writes ONLY to callTranscriptRef / callHeard — never to the chat `input`.

  // ===== Layer 3: 45s inactivity auto-end (silent — no spoken goodbye) =====
  const clearInactivityTimer = () => {
    if (inactivityTimerRef.current) { clearTimeout(inactivityTimerRef.current); inactivityTimerRef.current = null; }
  };
  // Silent auto-end. setScreen('chat') fires the call useEffect cleanup, which stops rec,
  // aborts the in-flight callAI, cancels audio, and bumps callGenRef (invalidating continuations).
  const endCallSilently = () => {
    clearInactivityTimer();
    if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
    callActiveRef.current = false;
    try { callRecognitionRef.current?.stop(); } catch (e) {}
    if (abortRef.current) { try { abortRef.current.abort(); } catch (e) {} }
    cancelAudio();
    setScreen('chat');
  };
  // (Re)start the 45s idle clock. Armed on a FRESH listening turn and on detected speech only —
  // NOT on the silence self-close re-arm (that passes armIdleClock=false), so genuine silence
  // accumulates toward the 45s end instead of resetting on every engine self-close.
  const armInactivityTimer = () => {
    // The idle clock runs ONLY while we are actually listening. A late SR result arriving during
    // thinking/playback used to re-arm it, and 45s later it exited the call MID-ANSWER.
    if (!callActiveRef.current) return;
    clearInactivityTimer();
    const genAtArm = callGenRef.current;
    inactivityTimerRef.current = setTimeout(() => {
      if (callGenRef.current !== genAtArm) return; // call ended/changed → bail
      endCallSilently();
    }, 45000);
  };

  // Start (or re-arm) a listen turn. armIdleClock=true resets the 45s idle clock (a fresh turn);
  // the silence self-close re-arm passes false so silence keeps counting toward the auto-end.
  const startCallListening = (armIdleClock = true) => {
    if (callMutedRef.current) return; // muted = do not listen
    if (childVoiceBlocked()) return; // غ‑٣: مقفول ⇒ لا فتحَ ميكروفونٍ (صامت — التنبيهُ يظهر بدل الشاشة)
    if (!hasValidAIConsent()) return; // بلا موافقة: لا ميكروفون. شاشةُ المكالمةِ نفسُها مستبدَلةٌ بوضعِ المحلّيّ
    if (!hasFounderToken()) return; // directive 82: no unlock token => the mic never opens
    if (CALL_STT_CLOUD) {
      callTranscriptRef.current = '';
      callBaseTextRef.current = '';
      setCallHeard('');
      callActiveRef.current = true;
      setCallState('listening');
      startCloudListening();
      if (armIdleClock) armInactivityTimer();
      return;
    }
    const rec = callRecognitionRef.current;
    if (!rec) return;
    callTranscriptRef.current = '';
    callBaseTextRef.current = '';
    setCallHeard('');
    callActiveRef.current = true;
    setCallState('listening');
    // Re-read here too: startCallListening is re-entered on every turn of a call that may have
    // been running for minutes, and the check at the top of this function ran on the first one.
    if (ezStartRecognition(rec)) {
      if (CALL_VAD) { vadLastVoiceRef.current = Date.now(); ensureVad(); }
      if (armIdleClock) armInactivityTimer();
    } else { callActiveRef.current = false; setCallState('idle'); }
  };

  // End the active listen turn and route it to the brain. Guarded so the silence timer and
  // recognition.onend can never both fire a turn (double-send guard via callActiveRef).
  const endCallTurnNow = () => {
    if (!callActiveRef.current) return;
    callActiveRef.current = false;
    if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
    try { callRecognitionRef.current?.stop(); } catch (e) {}
    const text = collapseRepeats((callBaseTextRef.current + ' ' + callTranscriptRef.current).trim());
    if (!text) { setCallState('idle'); return; } // never send an empty turn
    if (callTurnRef.current) callTurnRef.current(text);
  };

  // One full call turn — mirrors sendMessage exactly: pushes the same user+assistant messages to
  // the SHARED messages array (so the Q&A shows in chat history and guardrails are identical), then
  // speaks the reply via the existing speakReply(). No setInput, no streamingText bubble.
  const runCallTurn = async (text) => {
    const myGen = callGenRef.current; // capture the call session; re-arm after playback only if still valid
    setCallHeard('');
    setCallState('thinking');
    clearInactivityTimer(); // child is engaged (thinking/speaking) — pause the idle clock
    cancelAudio();
    if (abortRef.current) abortRef.current.abort();
    const userMsg = { role: 'user', content: text, timestamp: new Date().toISOString() };
    const updated = [...messages, userMsg];
    // Do NOT commit the user msg to messages here. It is written together with the reply on
    // success (final = [...updated, aiMsg]). So an interrupted/superseded turn leaves NO orphan
    // user message -> fixes empty-reply-in-transcript AND the abandoned-question-answered-later bug.
    const apiHistory = sliceHistoryForAPI(updated);
    const controller = new AbortController();
    abortRef.current = controller;
    let reply;
    let callStream = null; // CALL_STREAM_SPEECH: lazily-created streaming session (off -> stays null; classic speakReply used)
    try {
      reply = await callAI(apiHistory, profile, {
        signal: controller.signal, mode: 'call',
        ...(CALL_STREAM_SPEECH ? { onDelta: (full) => { if (abortRef.current !== controller) return; if (!callStream) { callStream = createCallSpeechStream(); setCallState('speaking'); } callStream.feed(full); } } : {}),
      });
    } catch (e) {
      if (e.name === 'AbortError') return; // exited mid-turn — do not write state
      reply = getFriendlyError('network', profile?.gender);
    }
    if (abortRef.current !== controller) return; // superseded or call exited
    abortRef.current = null;
    const aiMsg = { role: 'assistant', content: reply, timestamp: new Date().toISOString() };
    const final = [...updated, aiMsg];
    setMessages(final);
    saveMessages(final);
    setCallState('speaking');
    if (CALL_STREAM_SPEECH && callStream) await callStream.finish(reply); // stream: flush remainder + await playback drain (same completion contract)
    else await speakReply(reply); // completion hook -- resolves when playback fully finishes
    // Layer 3 guarded auto-rearm. speakReply cannot reject and resolves only after playback ends.
    if (callGenRef.current !== myGen) return;                   // End/exit or session change during playback → do NOT re-arm
    if (callActiveRef.current) return;                          // a manual interrupt already re-opened the mic → don't double-arm
    if (callMutedRef.current) { setCallState('idle'); return; } // muted → idle; user re-arms manually
    if (childVoiceBlocked()) { setCallState('idle'); return; }   // غ‑٣: لا إعادةَ تسليحٍ بعد الحجب
    startCallListening();                                       // continuous: reopen the mic for the next turn
  };

  // Keep callTurnRef pointing at the latest runCallTurn so the (once-created) SR handlers always
  // see the current messages/profile rather than a stale closure.
  useEffect(() => { callTurnRef.current = runCallTurn; });

  // Mute toggle — actually gates the mic: muted = stop/suppress listening (not just visual).
  const toggleCallMute = () => {
    setIsCallMuted((m) => {
      const next = !m;
      callMutedRef.current = next;
      if (next) {
        callActiveRef.current = false;
        if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
        clearInactivityTimer(); // leaving listening (muted) — stop the idle clock; user re-arms manually
        try { callRecognitionRef.current?.stop(); } catch (e) {}
        if (CALL_STT_CLOUD) stopCloudAll(); // mute must STOP capturing, not merely ignore the audio
        setCallState((csNow) => (csNow === 'listening' ? 'idle' : csNow));
      }
      return next;
    });
  };

  // Avatar tap = "my turn". Layer 3 makes it state-aware: it is the manual interrupt (no voice
  // barge-in). Tapping during think/speak cancels the tutor and opens the mic; from idle it starts.
  const onCallTalk = () => {
    if (callMutedRef.current) return;
    if (callState === 'thinking' || callState === 'speaking') {
      // Manual interrupt: cancel the in-flight turn + tutor audio, then open the mic for the child.
      if (abortRef.current) abortRef.current.abort(); // thinking: aborts callAI -> runCallTurn bails at the AbortError guard (before re-arm)
      cancelAudio();                                  // speaking: stops playback (speakReply resolves; EDIT-A re-arm suppressed by its callActiveRef guard)
      startCallListening();
      return;
    }
    if (callState === 'idle') startCallListening();
    // 'listening' → no-op (unchanged from Layer 2)
  };

  // Call-screen lifecycle: create/tear down the dedicated recognition with the call screen.
  // On entry: force the dictation mic OFF and stop any audio so the two can never fight.
  // On exit: stop recognition, clear the timer, abort any in-flight turn, and stop audio.
  useEffect(() => {
    if (screen !== 'call') return;
    if (childVoiceBlocked()) return; // غ‑٣: لا يُبنى معرِّفُ كلامٍ أصلاً — الرسمُ يعرض التنبيهَ بدل الشاشة
    // No consent, no call session: neither the Web Speech engine nor the cloud recorder is built,
    // so no microphone permission is requested. The screen itself is already the local-mode
    // notice by this point; this is the second, independent barrier behind it.
    if (!hasValidAIConsent()) return;
    if (!hasFounderToken()) return; // directive 82: no token => the call session is never built
    callGenRef.current++; // ENTER: open a new call session (invalidates any stale continuation)
    const SR = ezSpeechEngine();
    // CLOUD STT DOES NOT USE SpeechRecognition AT ALL. It records with MediaRecorder and
    // transcribes in api/stt.js, so demanding SR here refused the ENTIRE call screen over a
    // dependency the live path never touches -- every engine without Web Speech (Android
    // WebView shells, Firefox) got a "your browser is not supported" banner and a dead call,
    // while the path that would have worked was never even started. Only the Web Speech
    // FALLBACK may require SR.
    if (!SR && !CALL_STT_CLOUD) {
      showCallError('🚫 متصفحك لا يدعم التعرف على الصوت. استخدم Chrome أو Safari.');
      return;
    }
    setVoiceError(''); // entering a call clears any stale banner from the chat screen
    // Force the dictation mic off (never modify it — just ensure it is not running).
    shouldListenRef.current = false;
    try { recognitionRef.current?.stop(); } catch (e) {}
    cancelAudio();
    callActiveRef.current = false;
    callTranscriptRef.current = '';
    setCallHeard('');
    setCallState('idle');

    // `rec` is NULL when the engine has no Web Speech and the cloud path is carrying the call.
    // The three handlers below are still DEFINED either way (they are the fallback's behaviour,
    // unchanged), but they are only WIRED when there is an engine to fire them.
    const rec = ezNewRecognition();
    if (rec) {
      rec.lang = 'ar-SA';
      rec.continuous = true;     // interim events keep resetting the silence timer (smoother end-of-turn)
      rec.interimResults = true;
    }
    const onRecResult = (event) => {
      // This ar-SA engine emits multiple isFinal results where each later final RE-INCLUDES the
      // earlier final text (cumulative restatement), so concatenating all finals double-counts.
      // Merge instead: a final that extends what we have (starts with the accumulated text) REPLACES
      // it; a final already covered is skipped; only a genuinely new (non-overlapping) final is
      // appended. Correct for this cumulative engine AND standard segmented engines.
      let finalText = '', interim = '';
      for (let i = 0; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          const seg = t.trim();
          if (!seg) continue;
          if (!finalText) finalText = seg;
          else if (seg.startsWith(finalText)) finalText = seg;        // cumulative restatement -> replace
          else if (finalText.startsWith(seg)) { /* shorter prefix already covered -> skip */ }
          else finalText = finalText + ' ' + seg;                     // genuine new segment -> append
        } else {
          interim += t;
        }
      }
      callTranscriptRef.current = finalText;
      setCallHeard((finalText + interim).trim()); // feedback only — NEVER setInput
      // Layer 3: actual speech this event → child present → reset the 45s idle clock.
      if ((finalText + interim).trim()) armInactivityTimer();
      // Reset the end-of-turn debounce on any speech activity.
      if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
      silenceTimerRef.current = setTimeout(() => {
        // Fire only with a non-empty transcript; silence on an empty turn keeps listening.
        if (callActiveRef.current && (callBaseTextRef.current + callTranscriptRef.current).trim()) endCallTurnNow();
      }, vadOkRef.current ? 86400000 : CALL_SILENCE_MS);
    };
    const onRecEnd = () => {
      // Chrome owns onend and fires it on its own schedule (short Arabic pauses, engine timeouts).
      // It must NEVER end a turn: doing so shipped truncated questions to the model.
      // The CLIENT-OWNED silence timer is the SOLE turn-ender. onend only RESTARTS the recognizer,
      // carrying this session's transcript into callBaseTextRef first (the proven dictation pattern).
      if (!callActiveRef.current) return;                  // turn already ended, or call exited
      if (childVoiceBlocked()) {                         // غ‑٣: لا إعادةَ تشغيلٍ بعد الحجب — أوقفِ الحلقة
        callActiveRef.current = false;
        setCallState('idle');
        return;
      }
      callBaseTextRef.current = (callBaseTextRef.current + ' ' + callTranscriptRef.current).trim();
      callTranscriptRef.current = '';                      // new SR session => results[] restarts at 0
      // RESTART-GAP GUARD: the recognizer is DEAF between sessions, so that window must not be
      // counted as user silence. Re-arm the silence timer here with a longer grace deadline;
      // the first onresult of the new session restores the normal CALL_SILENCE_MS cadence.
      // The timer still SURVIVES the restart and stays the sole turn-ender - it only gets a fair
      // deadline instead of counting a window in which nobody could have been heard.
      if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
      silenceTimerRef.current = setTimeout(() => {
        if (callActiveRef.current && (callBaseTextRef.current + callTranscriptRef.current).trim()) endCallTurnNow();
      }, vadOkRef.current ? 86400000 : CALL_RESTART_GRACE_MS);
      const genAtEnd = callGenRef.current;
      const tryStart = (attempt) => {
        if (childVoiceBlocked()) return;                 // غ‑٣: الحجبُ يقطع محاولاتِ إعادةِ التشغيل الخمس
        // A withdrawal mid-call must also break the FIVE-ATTEMPT BACKOFF, not just the first try:
        // each retry is a fresh setTimeout that would otherwise keep reaching for the microphone
        // for three quarters of a second after the reader revoked consent.
        if (!hasValidAIConsent()) { ezKillRecognizer(rec); callActiveRef.current = false; setCallState('idle'); return; }
        if (callGenRef.current !== genAtEnd) return;       // call ended/changed
        if (!callActiveRef.current) return;                // turn ended during the gap
        if (!ezStartRecognition(rec) && attempt < 5) setTimeout(() => tryStart(attempt + 1), 150);  // never leave the mic dead
      };
      setTimeout(() => tryStart(0), 120);
    };
    const onRecError = (event) => {
      if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
      callActiveRef.current = false;
      setCallHeard('');
      setCallState('idle');
      // A denied mic is fatal and MUST be said. 'no-speech'/'aborted' are routine and stay quiet.
      const fatal = ['not-allowed', 'audio-capture', 'service-not-allowed'];
      if (fatal.includes(event.error)) {
        showCallError(event.error === 'audio-capture'
          ? '🎤 الميكروفون غير متاح على هذا الجهاز.'
          : '🚫 لم يُمنح إذن الميكروفون. افتح إعدادات التطبيق واسمح بالميكروفون ثم أعد الدخول للمكالمة.');
      } else if (event.error === 'network') {
        showCallError('📡 انقطع الاتّصال بمحرّك التعرّف على الصوت. تحقّق من الإنترنت ثم أعد المحاولة.');
      }
    };
    if (rec) { rec.onresult = onRecResult; rec.onend = onRecEnd; rec.onerror = onRecError; }
    callRecognitionRef.current = rec;
    startCallListening();    // child just enters and talks - no button

    return () => {
      callGenRef.current++; // EXIT: invalidate every in-flight continuation (re-arm / backoff / inactivity)
      callActiveRef.current = false;
      if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
      clearInactivityTimer();
      // Clear the banner WITH its dismiss timer. Cancelling the timer alone would strand a
      // call-mode error on the chat screen with nothing left running to ever take it down.
      if (callErrorTimerRef.current) { clearTimeout(callErrorTimerRef.current); callErrorTimerRef.current = null; }
      setVoiceError('');
      ezKillRecognizer(rec);   // handlers first, then abort+stop, and drop it from the live registry
      stopCloudAll();   // EXIT must release the recorder + the mic track, SR path or not
      callRecognitionRef.current = null;
      if (abortRef.current) { try { abortRef.current.abort(); } catch (e) {} }
      cancelAudio();
      callMutedRef.current = false;
      setIsCallMuted(false);
      setCallHeard('');
      setCallState('idle');
    };
  }, [screen]);

  // Toggle the parental direct-conversation lock. Locking writes 'true'; unlocking REMOVES the key
  // (absence = allowed default — we never persist 'false').
  const toggleDirectConvoLock = () => setDirectConvoLocked(prev => {
    const next = !prev;
    try { if (next) localStorage.setItem('directConvoLocked', 'true'); else localStorage.removeItem('directConvoLocked'); } catch (e) {}
    return next;
  });

  const resetAll = () => {
    if (confirm('هل أنت متأكد من حذف كل البيانات؟')) {
      localStorage.removeItem('child_profile');
      // S92 -- "delete all my data" has to mean the SAVED CONVERSATIONS too: every stored body,
      // the index that lists them, and the single legacy thread the old 'messages' key held.
      ezikClearAllChats();
      // S98 -- and the saved replies, which live in their own key precisely BECAUSE they survive a
      // deleted conversation. Nothing else clears them, so this line is the only way they go.
      ezikClearAllFavs();
      // S99 -- and the reading preferences, which are per-profile device settings and go with
      // everything else this button clears.
      ezikClearAllA11y();
      localStorage.removeItem('directConvoLocked');
      localStorage.removeItem(MUSHAF_BOOKMARK_KEY);
      localStorage.removeItem('mushaf_pos_v1');   // Session 51 -- one-shot sweep of the pre-bookmark name
      // Session 82 -- the three device-local mushaf keys go with everything else. "Delete all
      // my data" has to mean the last page, the daily target and today's progress too.
      localStorage.removeItem(MUSHAF_LAST_PAGE_KEY);
      localStorage.removeItem(WIRD_TARGET_KEY);
      localStorage.removeItem(WIRD_DAY_KEY);
      // Session 84 -- the three device-local adhkar keys, added to this list and to nothing
      // else. "Delete all my data" has to mean today's counters, the favourite identifiers
      // and the per-category open counts too. Three removals; no other reset behaviour moves.
      localStorage.removeItem(ADHKAR_PROGRESS_KEY);
      localStorage.removeItem(ADHKAR_FAVORITES_KEY);
      localStorage.removeItem(ADHKAR_USAGE_KEY);
      // Session 86 -- and the APPLICATION UI STYLE with them, the one key that now governs the
      // home screen and the adhkar screens together. Removing it is enough: the reader is total,
      // so an absent key IS 'journey', and the event tells every mounted screen -- the home, the
      // adhkar browse, the adhkar reader and the settings row -- to re-read now rather than at
      // the next mount. The chat screen does not listen for it and is unaffected either way.
      // S102 -- the obsolete layout key goes with them. Nothing reads it any more, so this
      // is housekeeping rather than behaviour: it stops a dead value outliving the feature.
      try { localStorage.removeItem(EZIK_UI_STYLE_KEY_DEAD); } catch (e) {}
      // S100 -- and the VISUAL IDENTITY, on the same terms. Removing the key is enough: the
      // reader is total, so an absent key IS istana_33. The attribute is repainted here rather
      // than waiting for a mount, because the screen behind this dialog is still on screen.
      try { localStorage.removeItem(EZIK_VISUAL_THEME_KEY); } catch (e) {}
      try { localStorage.removeItem(EZIK_VISUAL_THEME_KEY_V1); } catch (e) {}
      applyEzikVisualTheme(EZIK_VISUAL_THEME_DEFAULT);
      try { window.dispatchEvent(new CustomEvent(EZIK_VISUAL_THEME_EVENT, { detail: EZIK_VISUAL_THEME_DEFAULT })); } catch (e) {}
      setDirectConvoLocked(false);
      setProfile(null);
      voiceProfileRef.current = null;           // غ‑٣: حذفُ البيانات يُعيد الحاجزَ إلى المقفول
      setMessages([]);
      chatIdRef.current = null;
      setChatId(null);
      setChatList([]);
      setScreen('onboarding');
    }
  };

  // THE CONSENT SCREEN (Apple 5.1.1(i) / 5.1.2(i)). Shown to anyone who has not answered THIS
  // version of the disclosure, and again on demand from Settings ("review the choice"). Keyed on
  // the independent consent record, NOT on profile age, so an existing profiled reader sees it too
  // and nobody is wiped or forced to re-onboard. Gated on `profile` so it lands at the END of
  // onboarding, never over the onboarding form itself.
  //
  // Showing this screen sends NOTHING. It is drawn from strings in this file; no request of any
  // kind is issued by rendering it, and the boot greeting is already refused by callAI's own
  // consent check until a grant is recorded.
  const aiConsentDecided = aiConsent === EZ_AI_CONSENT_GRANTED || aiConsent === EZ_AI_CONSENT_DECLINED;
  if (profile && (!aiConsentDecided || aiConsentReview)) return (
    <AIConsentGate
      age={profile.age}
      current={aiConsent}
      onGrant={grantAIConsent}
      onDecline={declineAIConsent}
      onBack={aiConsentDecided ? () => setAiConsentReview(false) : null}
    />
  );
  // S118 -- ONE MENU, DRAWN BY TWO SCREENS. This block used to sit inside the chat's own
  // return, below the `if (screen === ...)` ladder, so `openDrawer()` from anywhere else set
  // state that nothing rendered. It is LIFTED, not copied: there is still exactly one panel,
  // one overlay, one search box, one conversation list and one history entry, and every
  // handler inside it is the handler it already was. The home's three-bar button and the
  // chat's rail button call the same openDrawer.
  //
  // It is a function and not a value so that it is read at RENDER time: the returns below it
  // each call it, and nothing above it has to know the drawer exists.
  //
  // D85: the drawer. Order is fixed: new chat, القائمة (the existing home screen -- the
  // mushaf, the adhkar, the memorizer and the quest are all reached from there), then the
  // profile entry pinned at the bottom. It used to have a second, duplicate control beside
  // it; that one is gone and the ONE row opens the account area the home screen opens.
  // The theme settings screen is phase C and is deliberately not built here.
  //
  // S118 -- THE TOKEN CARRIER, and it is not decoration: without it the menu is INVISIBLE on the
  // home. MEASURED, on the first render of this lift: the panel and its scrim came up with no
  // surface and no shadow and the home showed straight through the rows. The colours are not
  // literals anywhere in this file -- .ezc-drawer paints var(--a3-surface) / var(--a3-line) /
  // var(--a3-lift), and the scrim paints var(--ezc-scrim). --a3-* are declared on .ezhome and
  // --ezc-scrim on .ezc, and while this markup lived inside the chat's return it sat inside BOTH.
  // Rendered beside <Home/> it sits inside neither, so every one of those var() calls resolved to
  // nothing. The two classes are named here, on ONE element, so the menu resolves the very same
  // tokens from either screen and no value is written twice. It is a plain div: it creates no
  // containing block, so the fixed positioning underneath it is untouched.
  const ezikDrawer = () => drawerOpen && (
      <div className="ezhome ezc">
        <div onClick={() => closeDrawerWith(null)} className="ezc-drawer-ov" />
        {/* S112: the panel is a side drawer on a phone and an INSET, bounded panel from a desk
            upward -- it never becomes a full-screen sheet over the conversation behind it. The
            order of the entries, the handlers they call, the ids they carry and the store they
            read are untouched; only the surface they sit on is new. */}
        <div className="ezc-drawer" role="dialog" aria-modal="true">
          <div className="ezc-drawer-head">
            <span className="ezc-drawer-arch" aria-hidden="true" />
            <span>{A2_BRAND}</span>
          </div>
          <div style={s.drawerTop}>
            {/* S98: the search box. Local only — what is typed here is matched against the
                conversations already on this device and is never sent anywhere. It is rendered
                before the entries so it is the first thing under the thumb. */}
            <div style={s.drawerSearchWrap}>
              <input
                type="search"
                value={chatQuery}
                onChange={(e) => setChatQuery(e.target.value)}
                placeholder={EZIK_SEARCH_PH}
                aria-label={EZIK_SEARCH_ARIA}
                className="ezik-focus"
                style={s.drawerSearch}
              />
            </div>
            <button onClick={() => closeDrawerWith(startChatFromMenu)} style={s.drawerItem}>
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 11.5a8.5 8.5 0 0 1-11.8 7.8L3 21l1.7-6.2A8.5 8.5 0 1 1 21 11.5z" />
                <line x1="12" y1="8" x2="12" y2="14" />
                <line x1="9" y1="11" x2="15" y2="11" />
              </svg>
              <span>{ezT('chat.newConversation') || '\u0645\u062d\u0627\u062f\u062b\u0629 \u062c\u062f\u064a\u062f\u0629'}</span>
            </button>
            <button onClick={() => closeDrawerWith(() => setScreen('home'))} style={s.drawerItem}>
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
              </svg>
              <span>{ezT('navigation.menu') || '\u0627\u0644\u0642\u0627\u0626\u0645\u0629'}</span>
            </button>
            {/* S98: \u00ab\u0627\u0644\u0645\u0641\u0636\u0644\u0629\u00bb. The count comes from state that was read once at mount, so
                opening the menu reads no store and parses no JSON. */}
            <button onClick={() => closeDrawerWith(() => openEzikSheet('favorites'))} style={s.drawerItem} className="ezik-focus">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 17.3l-5.4 3 1-6-4.4-4.3 6-.9L12 3.5l2.8 5.6 6 .9-4.4 4.3 1 6z" />
              </svg>
              <span style={{ flex: 1, minWidth: 0 }}>{EZIK_FAV_TITLE}</span>
              {myFavs.length > 0 && <span style={s.drawerBadge}>{myFavs.length}</span>}
            </button>
            {/* S92: THE HISTORY. \u00ab\u0645\u062d\u0627\u062f\u062b\u0629 \u062c\u062f\u064a\u062f\u0629\u00bb stays the one and only new-chat entry -- this
                section adds the saved conversations UNDER the existing items and duplicates
                none of them. The order is the store's: pinned first, then the most recent.
                S112: it is still the store's order and still ONE mapping of it -- a pinned
                conversation is MARKED (.ezc-row.is-pinned) rather than moved into a second
                list, so nothing here re-sorts, filters or slices what the store returned.
                The section itself is absent while there is nothing to show; the empty line
                below takes its place. */}
            {/* S98: WHILE A SEARCH IS RUNNING the results replace the conversation list and
                nothing else on the menu moves. Opening a result goes through the SAME
                closeDrawerWith(openSavedChat) the ordinary row uses \u2014 so it spends the menu's
                history entry and lands at the end of the conversation exactly as S97 requires,
                with no second navigation path and no new scroll behaviour. */}
            {chatResults !== null && (
              <>
                <div style={s.drawerSectionLabel}>{EZIK_SEARCH_RESULTS}</div>
                {chatResults.length === 0 && <div style={s.drawerEmpty}>{EZIK_SEARCH_NONE}</div>}
                {chatResults.map((r) => (
                  <div key={r.id} className={r.id === chatId ? 'ezc-row is-on' : 'ezc-row'} style={s.drawerResultRow}>
                    <button onClick={() => closeDrawerWith(() => openSavedChat(r.id))} style={s.drawerResultBtn} title={r.title} className="ezik-focus">
                      <span style={s.drawerResultTitle}>{r.title}</span>
                      {r.snippet && <span style={s.drawerSnippet}>{r.snippet}</span>}
                      {r.at ? <span style={s.drawerResultDate}>{ezikShortDate(r.at)}</span> : null}
                    </button>
                  </div>
                ))}
              </>
            )}
            {chatResults === null && chatList.length > 0 && (
              <>
                <div style={s.drawerSectionLabel}>{'\u0627\u0644\u0645\u062d\u0627\u062f\u062b\u0627\u062a'}</div>
                {chatList.map((c) => (
                  <div key={c.id} className={'ezc-row' + (c.id === chatId ? ' is-on' : '') + (c.pinned ? ' is-pinned' : '')} style={s.drawerChatRow}>
                    {chatPendingDelete === c.id ? (
                      /* The confirmation, and it replaces the row it belongs to rather than
                         covering the menu -- so what is about to be deleted stays readable. */
                      <>
                        <span style={s.drawerConfirmText}>{'\u062d\u0630\u0641 \u0647\u0630\u0647 \u0627\u0644\u0645\u062d\u0627\u062f\u062b\u0629\u061f'}</span>
                        <button onClick={() => deleteSavedChat(c.id)} style={s.drawerConfirmYes}>{'\u062d\u0630\u0641'}</button>
                        <button onClick={() => setChatPendingDelete(null)} style={s.drawerConfirmNo}>{'\u0625\u0644\u063a\u0627\u0621'}</button>
                      </>
                    ) : (
                      <>
                        <button onClick={() => closeDrawerWith(() => openSavedChat(c.id))} style={s.drawerChatOpen} title={c.title}>
                          {c.pinned && (
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--red)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
                              <path d="M12 17v5" /><path d="M9 10.8V5h6v5.8l2.5 3.2h-11L9 10.8z" />
                            </svg>
                          )}
                          <span style={s.drawerChatTitle}>{c.title}</span>
                        </button>
                        <button onClick={() => pinSavedChat(c.id)} style={s.drawerChatIcon} aria-label={c.pinned ? '\u0625\u0644\u063a\u0627\u0621 \u0627\u0644\u062a\u062b\u0628\u064a\u062a' : '\u062a\u062b\u0628\u064a\u062a'}>
                          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={c.pinned ? 'var(--red)' : 'var(--muted)'} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M12 17v5" /><path d="M9 10.8V5h6v5.8l2.5 3.2h-11L9 10.8z" />
                          </svg>
                        </button>
                        <button onClick={() => setChatPendingDelete(c.id)} style={s.drawerChatIcon} aria-label={'\u062d\u0630\u0641'}>
                          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M3 6h18" /><path d="M8 6V4h8v2" /><path d="M6 6l1 14h10l1-14" />
                          </svg>
                        </button>
                      </>
                    )}
                  </div>
                ))}
              </>
            )}
            {/* S112: and when there is nothing saved the menu SAYS so, instead of ending in a
                blank space that reads as a list that failed to load. It is one line of the
                store's own vocabulary; no row, no id and no write. */}
            {chatResults === null && chatList.length === 0 && (
              <div style={s.drawerEmpty}>{EZIK_CHATS_EMPTY}</div>
            )}
          </div>
          {/* THE PINNED FOOTER, and it is ONE row now. It used to be two: the profile entry and,
              beside it, a small round button drawn as a ringed disc with eight rays. MEASURED:
              that button was not a theme toggle and touched no theme key -- its handler was
              closeDrawerWith(() => openEzikSheet('settings')), character for character the
              profile row's own handler, so the two controls opened the identical destination
              and the reader had to choose between them for nothing. The second one is gone.
  
              THE ACCESSIBLE NAME MOVED WITH IT. «الإعدادات» was that button's aria-label, and
              it is the name of what this row DOES -- it is the app's one door to the account
              area. It now sits on the row that survived, which is why a reader (and every
              guard that reaches settings by accessible name) still finds the entry exactly
              where it was. The cost is stated rather than hidden: a screen reader announces
              this row as «الإعدادات» and no longer reads the profile name, which stays on
              screen for everyone who can see it. */}
          <div style={s.drawerPinned}>
            <button onClick={() => closeDrawerWith(() => openEzikSheet('settings'))} style={s.drawerProfile} aria-label={ezT('navigation.settings2')}>
              <span style={s.drawerAvatar}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--on-accent)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-6 8-6s8 2 8 6" /></svg>
              </span>
              <span style={s.drawerProfileName}>{profile?.name}</span>
            </button>
          </div>
        </div>
      </div>
  );

  // S115: the boot mark is a bounded arch instead of a 48px emoji. The animation, its keyframe,
  // its duration and the style key that carries it are the ones that shipped, so reduced motion
  // behaves exactly as it did and no timer, wait or step was added to the boot.
  if (screen === 'loading') return <div className="theme-dark ezhome ezload" style={s.loadingScreen}><div style={s.loadingSpinner} className="ezload-mark" aria-hidden="true"><span className="ezload-mark-in" /></div></div>;
  if (screen === 'onboarding') return <Onboarding onStart={startChat} />;
  // قفل الإنفاق: المطالبة تظهر فقط أمام الشاشتين اللتين تُنفقان (المحادثة/المكالمة) وحين يكون القفل مفعّلاً وغير مفتوح.
  // القفل المُعطَّل (٦٤ صفراً) ⇒ spendGateOpenState=true دائماً ⇒ لا تظهر هذه السطر أبداً. أما 0b (المصحف/المحفّظ/الأذكار) فتبقى مفتوحة.
  if ((screen === 'chat' || screen === 'call') && !spendGateOpenState) return <SpendGate onUnlock={unlockSpendGate} onExit={() => setScreen('home')} />;
  // REFUSED, or a disclosure the reader has not answered: the two screens that SEND are replaced
  // by a named local-mode notice -- never a blank page and never a chat box that silently does
  // nothing. Everything that does not send (المصحف، الأذكار، كنوز المعرفة، الإعدادات) is BELOW
  // this line and is untouched, which is the point: refusing is a real choice, not a dead app.
  if ((screen === 'chat' || screen === 'call') && aiConsent !== EZ_AI_CONSENT_GRANTED) return (
    <AILocalModeNotice
      onReview={() => openEzikSheet('settings')}
      onMushaf={() => setScreen('mushaf')}
      onAdhkar={() => setScreen('adhkar')}
      onTreasure={() => { window.location.href = '/quest.html'; }}
      onBack={() => setScreen('home')}
    />
  );
  // S87: the home's chat entry is the FAB in its own bottom bar and nothing else -- the chat is
  // opened by an explicit chat action, and no back path resolves to it. The profile entry records
  // home as its opener through openEzikSheet, so the gate's back comes back HERE.
  // S92: the FAB is the explicit entry into the chat, so it opens a NEW, EMPTY thread -- the same
  // rule the app's own boot follows. Nothing is lost by it: the thread being left was filed at its
  // first question and is in the menu. The BACK path out of home also lands on the chat, and it
  // does not come through here, so returning from home never wipes the thread underneath it.
  // S118: the home hands its bar the SAME openDrawer the chat's rail calls, and draws the SAME
  // ezikDrawer() the chat draws -- one panel, one state, one history entry. It no longer takes
  // an onOpenChat: the chat is entered from that menu's «محادثة جديدة» row.
  if (screen === 'home') return (
    <>
      <Home profile={profile} onOpenMenu={openDrawer} onOpenMemorize={() => setScreen('memorize')} onOpenAdhkar={() => setScreen('adhkar')} onOpenMushaf={() => setScreen('mushaf')} onOpenFatwa={() => setScreen('fatwa')} onOpenSettings={() => openEzikSheet('settings')} />
      {ezikDrawer()}
    </>
  );
  // S87: the three sheets resolve their back through goEzikBack, which returns them to the screen
  // recorded when they were opened (home or the chat drawer) and to home when nothing valid was.
  // The gate still clears its own PIN field first -- that is its state, not navigation.
  if (screen === 'parentGate') return <ParentGate pinInput={pinInput} setPinInput={setPinInput} pinError={pinError} setPinError={setPinError} onSuccess={() => { setPinInput(''); setPinError(false); replaceEzikScreen('parentDashboard'); }} onBack={() => { setPinInput(''); setPinError(false); goEzikBack(); }} />;
  // S92: the dashboard reads the SAVED conversations, not the thread that happens to be open --
  // the chat opens empty now, so the open thread is no longer the child's record. Read here, at
  // the moment the dashboard is drawn, so it costs nothing on any other screen.
  if (screen === 'parentDashboard') return <ParentDashboard profile={profile} messages={ezikProfileTranscript(ezikProfileKey(profileRef.current))} onBack={goEzikBack} onReset={resetAll} directConvoLocked={directConvoLocked} onToggleDirectConvo={toggleDirectConvoLock} />;
  // D88/S90: the settings sheet, and it is now the ONE door to the account area -- the home
  // screen's الإعدادات item, the drawer's gear and the drawer's profile entry all open THIS,
  // immediately and with no PIN. The parental screen it used to stand in front of has not moved
  // an inch or lost its lock: it is reached from the التحكم row inside, which is the only thing
  // in the app that still opens the gate.
  if (screen === 'settings') return <SettingsSheet theme={theme} onTheme={chooseTheme} onBack={goEzikBack} onOpenControl={() => openEzikSheet('parentGate')} a11y={a11y} onA11y={setA11y} onA11yReset={resetA11y} aiConsent={aiConsent} aiConsentBy={aiConsentGrantedBy()} onWithdrawAI={declineAIConsent} onReviewAI={() => setAiConsentReview(true)} />;
  // S98: المفضلة. A sheet, opened from the chat's drawer, handed everything it draws.
  if (screen === 'favorites') return <FavoritesScreen items={shownFavs} total={myFavs.length} query={favQuery} onQuery={setFavQuery} searching={favResults !== null} liveChatIds={liveChatIds} onBack={goEzikBack} onOpenChat={openFavoriteChat} onRemove={removeFavorite} age={profile?.age} tashkeel={tashkeelOn} />;
  // غ‑٣: ملفُّ طفلٍ (أو ملفٌّ يتعذّر تحديدُه) لا يدخل شاشةَ المكالمة — يُعرَض التنبيهُ ومعه طريقُ رجوع.
  // S90: the three call-screen exits resolve through goEzikBack like every other back control.
  // The DESTINATION is unchanged -- the table sends 'call' to the chat, which is its documented
  // contract and genuinely the entry underneath it -- but the history entry the call pushed is
  // now spent on the way out instead of being left behind to absorb a later press.
  if (screen === 'call' && childVoiceBlocked()) return <ChildVoiceNotice onBack={goEzikBack} />;
  // CALL UNLOCK (directive 82). Sits at the SCREEN transition, immediately AFTER the child
  // barrier above, so a child profile always gets the notice and is never shown a PIN sheet.
  // This decides only what is DISPLAYED; the mic itself is held shut by the guards inside
  // startCallListening and the call useEffect, because that effect runs on [screen] whatever
  // this chain renders -- a screen that mounts unlocked would otherwise be a mic that opens.
  if (screen === 'call' && !hasFounderToken()) return <UnlockSheet onUnlocked={() => setFounderUnlocked(true)} onBack={goEzikBack} />;
  // `error` is what makes a failed call SAY something: voiceError was rendered on the chat screen
  // ONLY, so every banner a call raised was written to a view the user was not looking at.
  if (screen === 'call') return <CallScreen profileName={profile?.name} gender={profile?.gender} callState={callState} heard={callHeard} isMuted={isCallMuted} error={voiceError} onToggleMute={toggleCallMute} onTalk={onCallTalk} onExit={goEzikBack} />;
  // المحفّظ — full screen (mirrors CallScreen). Quran playback reuses the App-scoped manual
  // entry points (playVerseManual/playSurahManual) passed down as props; no new audio code.
  // S87 -- THE FEATURE SECTIONS. Each hands goEzikBack to its OWN section-level back
  // control, so the visible button and the hardware button resolve through the same table: a
  // nested layer (drill / open surah / opened adhkar category) closes first and the section is
  // retained, and only a back taken from the section's own top level goes home.
  if (screen === 'memorize') return <MemorizeScreen profile={profile} onExit={goEzikBack} onPlayVerse={playVerseManual} onPlaySurah={playSurahManual} onStopAudio={cancelAudio} />;
  if (screen === 'mushaf') return <MushafScreen selected={selectedSurah} setSelected={setSelectedSurah} onBack={goEzikBack} onPlaySurah={playSurahManual} onStopAudio={cancelAudio} />;
  if (screen === 'adhkar') return <AdhkarScreen onBack={goEzikBack} />;
  if (screen === 'fatwa') return <FatwaScreen onBack={goEzikBack} />;

  // Single-source capability flags for the chat UI. `directConvoAllowed` layers the parental lock
  // on top of the band: young is allowed unless the parent explicitly locked it; teen/adult always
  // allowed (the lock does not apply to them).
  const caps = deriveCaps(profile?.age);
  const directConvoAllowed = caps.band === 'young' ? !directConvoLocked : true;

  // S112: what the top rail says. It is the REAL title -- the one the store filed for the
  // conversation that is open, read off the list the menu already holds -- and the app's own
  // name while the thread is new and has no conversation yet. Nothing is invented here, nothing
  // is written, and no store is opened: chatList is state that refreshChatList already fills.
  const ezcOpenChat = chatId ? chatList.find((c) => c.id === chatId) : null;
  const ezcTitle = (ezcOpenChat && ezcOpenChat.title) ? ezcOpenChat.title : A2_BRAND;

  // Report button (step 2b). Opens the flag modal for a given assistant reply, capturing the
  // user question that preceded it (messages[i-1]) for context. Client only -- POSTs to api/report.
  // The size guard MEASURES real UTF-8 bytes and halves ai then user until the body is under
  // 20000 bytes -- comfortably below the server 21812-byte cap -- so a 413 is structurally
  // impossible, not merely unlikely. It never assumes "1 char = 2 bytes". Returns ok|rate|fail;
  // the modal maps those to messages that NEVER claim success on anything but a real 200.
  const submitReport = async (reason, note) => {
    const R = reportFor || {};
    let a = (typeof R.ai === 'string' ? R.ai : '').slice(0, 3500);
    let u = (typeof R.user === 'string' ? R.user : '').slice(0, 3500);
    const enc = new TextEncoder();
    const build = () => JSON.stringify({ reason, note: (note || '').slice(0, 500), ai: a, user: u, band: caps.band, mode: 'chat' });
    let body = build();
    let n = 0;
    while (enc.encode(body).length > 20000 && n < 40) {
      if (n % 2 === 0) a = a.slice(0, Math.floor(a.length / 2));
      else u = u.slice(0, Math.floor(u.length / 2));
      body = build();
      n++;
    }
    try {
      const resp = await fetch('/api/report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
      if (resp.status === 200) return 'ok';
      if (resp.status === 429) return 'rate';
      return 'fail';
    } catch (e) {
      return 'fail';
    }
  };

  return (
    <div className="theme-dark ezhome ezc" style={s.chatContainer}>
      {/* THE WATERMARK. One element, behind everything, reachable by nothing: aria-hidden so no
          reader is told about it, pointer-events:none so no tap can land on it, and z-index:-1
          inside this root's stacking context so it paints over the page colour and under every
          piece of chrome. The small crest that used to sit in the empty state is gone with it --
          the mark is the same mark, drawn once, large, and behind the whole conversation. */}
      <div className="ezwm" aria-hidden="true" />
      {/* D85: the chat top bar carries exactly ONE control -- the drawer menu. The old home,
          call, speaker and lock buttons are gone. Per-reply audio already sits beneath every
          reply, so the header speaker was redundant; the other three moved into the drawer
          (القائمة and the pinned profile/settings row). */}
      {/* S112: and it is a BOUNDED CARD on the page now, not the navy gradient slab that ran the
          full width of the viewport. Not one control was added or removed by that move: the same
          single button, the same openDrawer handler, the same accessible name. What it gained is
          a title, and the title is the real one -- see ezcTitle above. */}
      <div className="ezc-rail">
        <div className="ezc-rail-inner">
          <button onClick={openDrawer} className="ezc-icon" aria-label={'\u0641\u062a\u062d \u0627\u0644\u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u062c\u0627\u0646\u0628\u064a\u0629'}
            {...(uiLang === 'ar' ? null : { 'aria-label': ezT('navigation.openMenu') })}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <span className="ezc-brand">
            <span className="ezc-brand-arch" aria-hidden="true" />
            <span className="ezc-brand-text">{ezcTitle}</span>
          </span>
        </div>
      </div>

      <div ref={messagesAreaRef} onScroll={onMessagesScroll} className={'ezc-scroll' + (pinnedAskIndex == null ? '' : ' ezc-askpinned')} style={s.messagesArea}>
        {/* S112 -- THE EMPTY STATE. A NEW thread shows this and nothing else IN THE TRANSCRIPT:
            no old messages, no history list, no card of any kind and no devotional text. It is
            drawn INSIDE the transcript and centred in the space that is already there, so the
            composer does not move and the screen never turns back into a second home. It is gone
            the moment there is anything to read, including the first token of a stream.
            The section suggestions added later are NOT here and are not part of this: they live
            in the composer dock, below the transcript, and they carry no devotional text. */}
        {messages.length === 0 && streamingText === null && (
          <div className="ezc-empty">
            <div className="ezc-empty-title">{A2_BRAND}</div>
          </div>
        )}
        {messages.map((m, i) => (
          /* STREAM-P4 §٣/١: a zero-height marker immediately BEFORE the pinned question, which
             is what the pin measures against. It is a bare element rather than a ref threaded
             into MessageBubble because that component's props are deliberately pinned for
             performance (see S98 PERF below) and adding a per-render ref to them would undo
             that on every message in the thread, to locate one of them. */
          <React.Fragment key={i}>
            {i === pinnedAskIndex && <div ref={pinAnchorRef} aria-hidden="true" data-ezik-ask-pin="" />}
            <MessageBubble index={i} tashkeel={tashkeelOn} onToggleTashkeel={cbToggleTashkeel} message={m} onSuggestionClick={cbSuggestion} onPlayVerse={cbPlayVerse} onPlaySurah={cbPlaySurah} onStopAudio={cbStopAudio} onPlayMessage={cbPlayMessage} age={profile?.age} onReport={cbReport} onQuote={cbQuote} onFavorite={cbFavorite} isFavorite={favFlags[i]} defaultOpen={streamedOpen.has(i)} foldEpoch={threadEpoch} />
          </React.Fragment>
        ))}
        {/* S98: the quick actions. They are rendered ONCE, here, under the newest reply — not
            inside MessageBubble — so an old conversation does not carry a strip beneath every one
            of its 60 answers, and a keystroke in the composer cannot re-render 60 of them. They
            are laid out IN the scroller, above the end sentinel, so they scroll with the thread
            and can never cover the composer or the tool row. */}
        {/* §٢ (C): THE READER IS TOLD THE ANSWER STOPPED SHORT, IN A LINE, BESIDE «كمّل».
            It sits immediately above the strip that carries that button, so the fact and the act
            are one glance apart. `role="status"` because it is news about what is already on the
            screen — a screen reader announces it without being moved to it, and it is never
            focusable, because there is nothing here to press. Rendered from the SERVER'S signal
            (`<incomplete/>`, appended only when the writing round ended on other than end_turn) and
            never from the length or the last character of the text: this client cannot tell a short
            answer from a cut one, and a client that guesses is the defect wearing our own face. */}
        {quickActionsVisible && ezikAnswerIncomplete(lastMsg.content) && (
          <div style={s.incompleteNotice} role="status">{ezT('chat.qa.incomplete')}</div>
        )}
        {quickActionsVisible && (
          <div style={s.quickRow} role="group" aria-label={ezT("chat.quickActions")}>
            {EZIK_QUICK_ACTIONS.map((qa) => (
              <button
                key={qa.key}
                type="button"
                onClick={() => runQuickAction(qa.prompt)}
                disabled={isLoading}
                className="ezik-focus"
                style={{ ...s.quickBtn, opacity: isLoading ? 0.5 : 1 }}
              >
                {qa.label}
              </button>
            ))}
          </div>
        )}
        {streamingText !== null && (
          <div className="ezc-turn is-ai">
          <div style={{ ...s.messageBubble, ...s.assistantBubble }}>
            {formatForStreamPreview(streamingText)
              /* S93: the live preview formats too, so a heading or a bold phrase does not appear
                 as ## and ** for a second and then re-flow when the reply settles. The renderer
                 only formats constructs whose closing side has arrived, so the half-written tail
                 of the stream stays literal text instead of flickering. */
              ? <div style={s.bubbleText}><EzikMarkdown text={formatForStreamPreview(streamingText)} /></div>
              : searchingSources
                ? <div style={s.searchingHint}>
                    {/* XI-02: read from the dictionary, so the string a reader sees exists in
                        exactly one place and cannot drift back into a promise of a search. */}
                    <span>{ezT('chat.searchingSources')}</span>
                    <span style={s.dot}>●</span>
                    <span style={{ ...s.dot, animationDelay: '0.2s' }}>●</span>
                    <span style={{ ...s.dot, animationDelay: '0.4s' }}>●</span>
                  </div>
                : <div style={s.typingDots}>
                    <span style={s.dot}>●</span>
                    <span style={{ ...s.dot, animationDelay: '0.2s' }}>●</span>
                    <span style={{ ...s.dot, animationDelay: '0.4s' }}>●</span>
                  </div>}
          </div>
          </div>
        )}
        {/* STREAM-P4 §٣/١: the room that lets a SHORT answer still carry its question to the top.
            It is zero except while a turn is live, and it shrinks to zero by itself as a long
            answer fills the viewport, so on the common case it never exists at all. It sits
            ABOVE the end sentinel so that scrollIntoView on that sentinel — which is what the
            follow effect uses once the pin has let go — still lands at the true end. */}
        {/* `flexShrink: 0` is not decoration. This scroller is a COLUMN FLEXBOX — that is what the
            auto margin above it works through — and a flex item with a height and no content is
            shrinkable by default. MEASURED: the pin computed the room correctly and asked for
            410px, React rendered it, and flexbox took every pixel back the same frame; the
            element existed with an offsetHeight of 0 while `scrollHeight` never moved, so the
            spacer «did not work» in a way no amount of arithmetic would have explained. */}
        {askPinPad > 0 && <div ref={askPadElRef} aria-hidden="true" data-ezik-ask-pad="" style={{ height: askPinPad, flexShrink: 0 }} />}
        <div ref={messagesEndRef} />
      </div>

      {/* S112 -- THE COMPOSER DOCK. One bounded card on the same measure as the transcript,
          holding the pieces that were four separate full-width strips: the error banner, the
          attachment chip, the composer row, the tool row and the standing disclaimer. It is IN
          FLOW, exactly as those strips were, so it consumes its own height and can never cover
          the last reply -- there is no fixed positioning and no floating control on this screen.
          Nothing inside it was rewired: every handler, every disabled test and the Enter /
          Shift+Enter contract are the ones that shipped. */}
      <div className="ezc-dock">
        <div className="ezc-dock-inner">
      {/* ONE LIST, TWO SHAPES, and the shape is a class on the container -- the entries below are
          mapped ONCE whichever state is on, so a card and a pill can never drift apart or offer
          different destinations. Pressing one is a navigation and nothing else: no send, no
          write to the composer, no request. onMouseDown is defaulted away so that pressing a
          pill cannot blur the composer first, re-lay the strip as cards, and move the control
          out from under the pointer before the click lands. */}
      {sectionSuggestVisible && (
        <div className={composerFocused ? 'ezsug is-row' : 'ezsug'} role="group" aria-label={ezT('navigation.menu')}>
          {sectionSuggestions.map((sg) => (
            <button
              key={sg.id}
              type="button"
              onMouseDown={(e) => e.preventDefault()}
              onClick={sg.go}
              className={composerFocused ? 'ezsug-pill ezik-focus' : 'ezsug-card ezik-focus'}
              data-ezik-section-suggestion={sg.id}
            >
              <span className="ezsug-mark" aria-hidden="true">{sg.icon}</span>
              {composerFocused ? <span>{sg.label}</span> : (
                <>
                  <span className="ezsug-body">
                    <span className="ezsug-title">{sg.label}</span>
                    <span className="ezsug-sub">{EZIST_SUB[sg.id]}</span>
                  </span>
                  <span className="ezsug-go" aria-hidden="true">{EZH_ICON_GO}</span>
                </>
              )}
            </button>
          ))}
        </div>
      )}
      {voiceError && <div style={s.errorBanner}>{voiceError}</div>}

      {pendingImage && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 10px' }}>
          {(pendingImage.kind === 'image' || pendingImage.kind === undefined) ? (
            <img src={`data:${pendingImage.media_type};base64,${pendingImage.data}`} style={{ height: 56, borderRadius: 8, border: '1px solid var(--line)' }} />
          ) : (
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '6px 10px', borderRadius: 8, border: '1px solid var(--line)', background: 'var(--tint)', fontSize: 14 }}>
              <span>📄</span>
              <span>{pendingImage.name}</span>
              <span style={{ color: 'var(--muted)', fontSize: 12 }}>{pendingImage.kind === 'pdf' ? 'PDF' : 'نصّ'}</span>
            </span>
          )}
          <button onClick={() => setPendingImage(null)} style={{ background: 'none', border: 'none', color: 'var(--red-lift)', fontSize: 18, cursor: 'pointer' }} aria-label={ezT("chat.removeImage")}>×</button>
        </div>
      )}
      <div style={s.inputBar}>
        <textarea
          ref={inputElRef}
          rows={1}
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={onComposerKeyDown}
          onPointerDown={onComposerPointerDown}
          onFocus={() => setComposerFocused(true)}
          onBlur={() => setComposerFocused(false)}
          onCompositionStart={() => { composingRef.current = true; }}
          onCompositionEnd={() => { composingRef.current = false; }}
          enterKeyHint={enterSends ? 'send' : 'enter'}
          style={s.input}
          disabled={isLoading || isListening}
        />
        <button onClick={() => sendMessage(input)} disabled={isLoading || (!input.trim() && !pendingImage)} style={{ ...s.sendBtn, opacity: isLoading || !input.trim() ? 0.4 : 1 }}>
          <SendIcon size={20} color="var(--on-accent)" />
        </button>
      </div>

      {/* D87: the tool row -- ONE line beneath the composer. The page is RTL, so the first
          group paints at the RIGHT ([+] then the model selector) and the second at the LEFT
          (mic then live call). Nothing here is new machinery. The [+] drives the SAME two
          hidden file inputs and the SAME onPickImage that already shipped. The selector is the
          SAME depthMode cycle and opens the SAME UnlockSheet through unlockAsk -- there is no
          second PIN surface. The mic is the SAME startListening/stopListening, untouched. The
          call button only sets the screen: the EXISTING screen chain then applies the child
          barrier FIRST and the founder token SECOND, so a child gets the notice and is never
          offered the PIN sheet. */}
      {/* image-only input */}
      <input ref={fileInputRef} type="file" accept="image/*" onChange={onPickImage} style={{ display: 'none' }} />
      {/* document input (PDF / TXT) */}
      <input ref={docInputRef} type="file" accept=".pdf,application/pdf,.txt,text/plain,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onChange={onPickImage} style={{ display: 'none' }} />
      <div style={s.toolBar}>
        <div style={s.toolGroup}>
          {caps.upload && (
          <div style={{ position: 'relative', display: 'inline-flex' }}>
            {attachMenuOpen && (
              <>
                {/* backdrop: closes menu on outside click */}
                <div onClick={() => setAttachMenuOpen(false)} style={{ position: 'fixed', inset: 0, zIndex: 40 }} />
                {/* menu: opens above the button (the tool row is at the bottom) */}
                <div style={{ position: 'absolute', bottom: '120%', right: 0, zIndex: 41, background: 'var(--white)', border: '1px solid var(--line)', borderRadius: 12, boxShadow: 'var(--a3-lift)', padding: 6, minWidth: 168, display: 'flex', flexDirection: 'column', gap: 2 }}>
                  <button
                    onClick={() => { setAttachMenuOpen(false); if (fileInputRef.current) fileInputRef.current.click(); }}
                    style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: 'none', border: 'none', borderRadius: 8, cursor: 'pointer', fontSize: 15, color: 'var(--ink)', width: '100%', textAlign: 'right' }}
                  >
                    <span style={{ fontSize: 18 }}>{'\uD83D\uDDBC\uFE0F'}</span><span>{ezT('chat.attachImage')}</span>
                  </button>
                  <button
                    onClick={() => { setAttachMenuOpen(false); if (docInputRef.current) docInputRef.current.click(); }}
                    style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: 'none', border: 'none', borderRadius: 8, cursor: 'pointer', fontSize: 15, color: 'var(--ink)', width: '100%', textAlign: 'right' }}
                  >
                    <span style={{ fontSize: 18 }}>{'\uD83D\uDCC4'}</span><span>{ezT('chat.attachFile')}</span>
                  </button>
                </div>
              </>
            )}
            <button
              onClick={() => setAttachMenuOpen(v => !v)}
              disabled={isLoading || isListening}
              style={{ ...s.toolBtn, opacity: (isLoading || isListening) ? 0.4 : 1 }}
              aria-label={'\u0625\u0631\u0641\u0627\u0642 \u0645\u0644\u0641 \u0623\u0648 \u0635\u0648\u0631\u0629'}
              {...(uiLang === 'ar' ? null : { 'aria-label': ezT('chat.attach') })}
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--red)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
          )}
          {/* Model selector. RENDERED FOR EVERY BAND so موجز is always available; the two deep
              tiers keep their EXISTING 18+ visibility -- a non-adult sees the chip fixed on
              موجز and cannot cycle into them. For an adult the cycle is byte-for-byte the
              one that shipped, including the UnlockSheet hand-off through setUnlockAsk. */}
          <button
            onClick={() => {
              if (caps.band !== 'adult') return;                  // 18+ visibility on the deep tiers is unchanged
              const next = depthMode === 'brief' ? 'detailed' : depthMode === 'detailed' ? (SCHOLAR_ENABLED ? 'scholar' : 'brief') : 'brief';
              // The two deep tiers additionally require the unlock token to be SELECTED. This is
              // not the lock: api/ask.js drops an unearned depth server-side no matter what the
              // UI does. It only stops a user selecting a tier that would silently do nothing.
              if ((next === 'detailed' || next === 'scholar') && !hasFounderToken()) { setUnlockAsk(next); return; }
              setDepthMode(next);
            }}
            disabled={isLoading || caps.band !== 'adult'}
            title={caps.band === 'adult' ? ezT('chat.depthHint') : undefined}
            aria-label={depthMode === 'brief' ? ezT('chat.depthBrief') : depthMode === 'detailed' ? ezT('chat.depthDetailed') : ezT('chat.depthScholar')}
            style={{
              ...s.sendBtn,
              background: depthMode === 'brief' ? 'var(--tint)' : depthMode === 'detailed' ? 'var(--red)' : 'var(--scholar)',
              opacity: isLoading ? 0.4 : 1,
              cursor: caps.band === 'adult' ? 'pointer' : 'default',
              fontSize: 13,
              fontWeight: 700,
              color: depthMode === 'brief' ? 'var(--red)' : 'var(--white)',
              minWidth: 52,
              whiteSpace: 'nowrap',
              paddingInline: 10,
            }}
          >
            {depthMode === 'brief' ? ezT('chat.depthBrief') : depthMode === 'detailed' ? ezT('chat.depthDetailed') : ezT('chat.depthScholar')}
          </button>
        </div>
        <div style={s.toolGroup}>
          <button
            onClick={isListening ? stopListening : startListening}
            disabled={isLoading}
            aria-label={'\u0625\u0645\u0644\u0627\u0621 \u0635\u0648\u062a\u064a'}
            {...(uiLang === 'ar' ? null : { 'aria-label': ezT('chat.dictate') })}
            className="ez-anim"
            style={{
              ...s.micBtn,
              background: isListening ? 'var(--red-deep)' : 'var(--tint)',
              animation: isListening ? 'pulse 1.2s ease-in-out infinite' : 'none',
              opacity: isLoading ? 0.4 : 1,
            }}
          >
            {isListening ? <MicOffIcon size={20} color="var(--on-accent)" /> : <MicIcon size={20} color="var(--red)" />}
          </button>
          {/* Live call -- the entry D85 removed, restored here. It sets the screen and NOTHING
              else, which is precisely how the guard ORDER is preserved: the screen chain runs
              childVoiceBlocked() -> ChildVoiceNotice BEFORE hasFounderToken() -> UnlockSheet.
              directConvoAllowed is the parental lock that wrapped this button before D85. */}
          {directConvoAllowed && (
          <button
            onClick={() => setScreen('call')}
            disabled={isLoading || isListening}
            aria-label={'\u0645\u0643\u0627\u0644\u0645\u0629 \u0635\u0648\u062a\u064a\u0629 \u0645\u0628\u0627\u0634\u0631\u0629'}
            {...(uiLang === 'ar' ? null : { 'aria-label': ezT('chat.call') })}
            style={{ ...s.toolBtn, opacity: (isLoading || isListening) ? 0.4 : 1 }}
          >
            <PhoneCallIcon size={20} color="var(--red)" />
          </button>
          )}
        </div>
      </div>
      <div className="ezc-note">{ezT(standingNoticeKey(caps.band))}</div>
        </div>
      </div>
      {/* S118: the one menu, defined once above the screen ladder. */}
      {ezikDrawer()}
