      {reportFor && <ReportModal onClose={() => setReportFor(null)} onSubmit={submitReport} />}
      {unlockAsk && <UnlockSheet onUnlocked={() => { setFounderUnlocked(true); setDepthMode(unlockAsk); setUnlockAsk(null); }} onBack={() => setUnlockAsk(null)} />}
    </div>
  );
}

// Per-message listen button (opt-in TTS). Mirrors VerseCard's play/stop pattern:
// local `playing` state; unified App audio via onPlayMessage (speakReply), which
// resolves when playback ends or is cancelled; onStopAudio (cancelAudio) stops it.
// The reply is spoken through the SAME pipeline (formatForTTS -> smart tashkeel
// skip -> tts), so the shipped audio rate-limit governs it. Verses inside the
// reply are recited by the reciter exactly as in the old auto-play path.
function MessageListenButton({ text, onPlayMessage, onStopAudio }) {
  const [playing, setPlaying] = useState(false);
  if (!text || !onPlayMessage) return null;
  const toggle = () => {
    if (playing) { if (onStopAudio) onStopAudio(); setPlaying(false); return; }
    setPlaying(true);
    Promise.resolve(onPlayMessage(text))
      .then(() => setPlaying(false))
      .catch(() => setPlaying(false));
  };
  return (
    <button
      type="button"
      onClick={toggle}
      aria-label={playing ? 'إيقاف الصوت' : 'استمع للرد'}
      style={{ display: 'inline-flex', alignItems: 'center', gap: 5, background: 'transparent', color: 'var(--red)', border: '1px solid var(--line)', borderRadius: 8, padding: '4px 10px', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}
    >
      {playing ? <PauseIcon size={13} /> : <PlayIcon size={13} />}
      <span>{playing ? 'إيقاف' : 'استمع'}</span>
    </button>
  );
}

// ============================================================
// D90 -- plain-text serialization of a reply, for the copy button.
// ============================================================
// MessageBubble renders ONE component per segment type. This table produces ONE plain-text form
// per segment type, from the SAME segment objects and the SAME stores those cards read -- so the
// clipboard carries what is on the screen, in display order. It renders nothing and changes no
// component; it is a serializer only.
//
// TASHKEEL: the toggle touches PROSE ONLY. MessageBubble applies stripTashkeelOutsideQuran to
// seg.type==='text' and to NOTHING else -- every card body is drawn verbatim. So card bodies are
// copied verbatim too. Stripping an ayah or a hadith here would put on the clipboard something
// that was never on the screen, and would strip harakat from canonical scripture, which
// stripTashkeelOutsideQuran only protects when it is wrapped in U+FD3F..U+FD3E ornaments.
//
// ASYNC BODIES: verse/surah/dhikr/worship segments carry no text of their own -- their cards
// resolve it from the canonical stores after a fetch. We read the SAME module caches through the
// SAME accessors (getVerseText / __adhkarData / __worshipData). A cache not yet filled means the
// card is not showing that text either, so the body is omitted and what IS on screen is copied.
// A verse's seg.content -- the MODEL's wording -- is deliberately never used, exactly as
// VerseCard never uses it.
const REPLY_LINE = (parts) => parts.filter((x) => x && String(x).trim()).join('\n');
const REPLY_SERIALIZERS = {
  text: (sg, ctx) => (ctx.tashkeel ? sg.content : stripTashkeelOutsideQuran(sg.content)),
  verse: (sg) => {
    const sNum = resolveSurahNumber(sg.surah, sg.surahNum);
    const aNum = parseInt(sg.ayah, 10);
    const surahName = sg.surah || (sNum ? SURAH_NAMES[sNum] : '');
    const body = (sNum && aNum >= 1) ? getVerseText(sNum, aNum) : null;   // canonical only
    const meta = [surahName ? '\u0633\u0648\u0631\u0629 ' + surahName : '', sg.ayah ? '\u0622\u064A\u0629 ' + sg.ayah : '']
      .filter(Boolean).join('\u060C ');
    return REPLY_LINE(['\u0642\u064E\u0627\u0644\u064E \u0627\u0644\u0644\u0647\u064F \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649', body, meta]);
  },
  surah: (sg) => {
    const sNum = resolveSurahNumber(undefined, sg.num);
    const surahName = sNum ? SURAH_NAMES[sNum] : '';
    const head = '\u0642\u064E\u0627\u0644\u064E \u0627\u0644\u0644\u0647\u064F \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649' + (surahName ? ' \u2014 \u0633\u064F\u0648\u0631\u064E\u0629\u064F ' + surahName : '');
    const count = sNum ? getSurahAyahCount(sNum) : 0;
    let body = '', meta = '';
    if (count) {
      let f = parseInt(sg.from, 10); if (!(f >= 1)) f = 1;
      let t = parseInt(sg.to, 10); if (!(t >= 1) || t > count) t = count;
      if (f <= t) {
        const pieces = [];
        if (f === 1 && sNum !== 1 && sNum !== 9) { const b = getVerseText(1, 1); if (b) pieces.push(b); }
        let missing = false;
        for (let a = f; a <= t; a++) {
          const vt = getVerseText(sNum, a);

          : '\u0633\u0648\u0631\u0629 ' + surahName + '\u060C \u0627\u0644\u0622\u064A\u0627\u062A ' + toArabicDigits(f) + '\u2013' + toArabicDigits(t);
      }

  },
  hadith: (sg) => {
    const att = resolveHadithAttribution(sg.narrator, sg.ruling);
    return REPLY_LINE([att.narrator ? '\u0631\u064E\u0648\u064E\u0649 ' + att.narrator : '\u0645\u0646 \u0627\u0644\u0633\u0646\u0629 \u0627\u0644\u0646\u0628\u0648\u064A\u0629', sg.content, att.ruling]);
  },
  dhikr: (sg) => {
    const db = (typeof __adhkarData !== 'undefined') ? __adhkarData : null;
    const list = (db && db.byCat && db.byCat[parseInt(sg.catId, 10)]) || [];
    if (!list.length) return '';
    const head = ((list[0] && list[0].category) || '\u0630\u0643\u0631') + ' \u2014 \u062D\u0635\u0646 \u0627\u0644\u0645\u0633\u0644\u0645';
    return REPLY_LINE([head].concat(list.map((d) => REPLY_LINE([
      d.text, d.repeat > 1 ? '\u062A\u064F\u0642\u0627\u0644 ' + toArabicDigits(d.repeat) + ' \u0645\u0631\u0651\u0627\u062A' : '',
    ]))));

  worship: (sg, ctx) => {
    const d = (typeof __worshipData !== 'undefined') ? __worshipData : null;
    const arm = (ctx.band === 'young') ? 'young' : 'adult';   // byte-for-byte WorshipCard's ternary
    const cell = d && d.cells && d.cells[sg.id + ':' + arm];
    return (cell && cell.text) ? cell.text : '';
  },
  source: (sg) => {
    let host = (sg.site || '').trim();
    if (!host && sg.url) { try { host = new URL(sg.url).hostname.replace(/^www\./, ''); } catch (e) { host = ''; } }
    const label = host || '\u0627\u0644\u0645\u0635\u062F\u0631';
    const text = (sg.content || '').trim();
    // The url is the REFERENCE. A fiqh answer pasted into a message without it is incomplete,
    // and the chip's own href is the only place it exists on screen.
    return REPLY_LINE([text ? label + ' \u2014 ' + text : label, sg.url || '']);
  },
  // The heading comes from the ANSWER (the tag's title), or there is no heading at all. It used
  // to be one fixed sentence printed above every list -- see readStepsTitle for what that cost.
  steps: (sg) => REPLY_LINE(((sg.title || '').trim() ? [(sg.title || '').trim()] : []).concat(
    (sg.items || []).map((it, i) => (i + 1) + '. ' + it))),   // matches the card's <ol> decimal marks
  board: (sg) => sg.content,
  // XI-04: THE CLIPBOARD CARRIES THE MEANING WITHOUT THE BRACKETS. The reader copied 【】 verbatim
  // before this, which is the one thing §٥ names about the clipboard. What it says is kept — it is
  // on the screen and it is about the answer — and the ornate brackets, which were never anything
  // but a transport marker between the reviewer and this renderer, are not.
  notice: (sg) => [sg.label, sg.content].map((x) => String(x || '').trim()).filter(Boolean).join(' '),
  document: (sg) => REPLY_LINE([sg.title || '\u0645\u0633\u062A\u0646\u062F', toPlainText(sg.content)]),
};
// Every type MessageBubble can render must have an entry above. A new card added to the renderer
// without one lands here and is announced -- loudly, and visibly in the copied text -- instead of
// vanishing from the clipboard the way every card did before this directive.
const serializeReply = (segments, ctx) => {
  const out = [];
  (segments || []).forEach((sg) => {
    const fn = sg && REPLY_SERIALIZERS[sg.type];
    if (!fn) {
      try { console.error('[copy] no serializer for segment type:', sg && sg.type); } catch (e) {}
      out.push('[' + ((sg && sg.type) || 'unknown') + ': not serialized]');
      return;
    }
    const piece = fn(sg, ctx || {});
    if (piece && String(piece).trim()) out.push(String(piece).trim());
  });
  return out.join('\n\n');
};

// ============================================================
// S98 — طيُّ الردود الطويلة (long-reply folding)
// ============================================================
// A long reply is a wall the child has to scroll past to reach the next thing. This folds the
// PROSE of one and nothing else. Three properties make it safe, and each is load-bearing:
//
//   1. IT IS A VIEW, NOT AN EDIT. It returns a SECOND segment array to draw. `segments` — the one
//      the clipboard, the voice, the export and the stored thread all read — is never touched, so
//      a folded reply copies, speaks and exports in full exactly as an unfolded one does.
//   2. ONLY seg.type === 'text' FOLDS. parseRichMessage has already lifted every verse, hadith,
//      source, dhikr, worship, steps, board and document out into its own segment; those are
//      copied through untouched, so a source card, an ayah, a hadith, the steps, a warning board
//      and the suggestions are all on screen WHILE it is folded. There is no line-clamp anywhere:
//      clamping the bubble would have hidden precisely those cards.
//   3. THE CUT IS ON A BOUNDARY. A markdown string cut mid-construct renders as debris, so the
//      cut walks back to a blank line, then a line end, then a word end — and if it landed inside
//      a fenced block it closes the fence, because an unclosed fence would swallow the ellipsis.
//
// THE THRESHOLD, and why it is 900 / 320. Measured off the shipped layout rather than picked: the
// bubble draws at s.bubbleText — fontSize 15, lineHeight 1.85 (27.75px a line) — inside a bubble
// whose content box is ~273px on a 360px phone (14px area padding either side, bubble maxWidth
// 92%, 16px bubble padding either side). Arabic in Tajawal averages ~0.48em of advance, so a line
// carries ~38 characters. The chat's visible area on a 640px-tall phone is ~380px ≈ 13 lines ≈
// ~520 characters — ONE screenful. 900 is therefore "clearly longer than a screenful" (~24 lines)
// and never folds a reply that already fitted; 320 (~8 lines, ~230px) is a preview long enough to
// decide by and still shorter than the screen it saves.
const EZIK_FOLD_MIN_CHARS = 900;    // total prose length past which a completed reply folds
const EZIK_FOLD_HEAD_CHARS = 320;   // prose shown while it is folded
// One pair of labels for the two places a reply folds — the chat bubble and the favourites card —
// so the two can never drift into saying different things about the same control.
const EZIK_FOLD_SHOW = 'chat.foldShow';   // a translation KEY now, read through ezT()
const EZIK_FOLD_HIDE = 'chat.foldHide';   // a translation KEY now, read through ezT()

function ezikProseLength(segments) {
  let n = 0;
  for (let i = 0; i < (segments || []).length; i++) {
    if (segments[i] && segments[i].type === 'text') n += String(segments[i].content || '').length;
  }
  return n;
}

// Cut markdown at or before `budget`, on the safest boundary available. The 0.4 floors stop a
// pathological single-paragraph reply (no blank line, no newline) from collapsing to almost
// nothing just because the only boundary found sat near the start.
function ezikFoldCut(src, budget) {
  const t = String(src == null ? '' : src);
  if (t.length <= budget) return t;
  const window = t.slice(0, budget);
  let at = window.lastIndexOf('\n\n');
  if (at < budget * 0.4) { const nl = window.lastIndexOf('\n'); if (nl > at) at = nl; }
  if (at < budget * 0.4) { const sp = window.lastIndexOf(' '); if (sp > at) at = sp; }
  let cut = (at > 0 ? window.slice(0, at) : window).replace(/\s+$/, '');
  if (!cut) cut = window;
  // An odd number of fence lines means the cut fell INSIDE a code block: close it, or every
  // following character in the bubble is drawn as code.
  if (((cut.match(/^\s*```/gm) || []).length) % 2 === 1) cut += '\n```';
  return cut + ' …';
}

// The folded view, or null when there is nothing worth folding. Null is the signal the bubble
// reads to decide whether the toggle exists at all — a short reply never grows one.
function ezikFoldSegments(segments, minChars, headChars) {
  const list = segments || [];
  if (ezikProseLength(list) <= minChars) return null;
  let budget = headChars;
  let changed = false;
  const out = [];
  for (let i = 0; i < list.length; i++) {
    const sg = list[i];
    if (!sg || sg.type !== 'text') { out.push(sg); continue; }   // every card is kept, always
    const body = String(sg.content == null ? '' : sg.content);
    // A hidden segment leaves a HOLE rather than closing the gap: the bubble keys its children by
    // index, so dropping an entry would renumber every card after it and remount them — a verse
    // card would refetch and a dhikr card would re-read its store on every toggle. A null draws
    // nothing and keeps all the later indices exactly where the unfolded view has them.
    if (budget <= 0) { changed = true; out.push(null); continue; }
    if (body.length <= budget) { out.push(sg); budget -= body.length; continue; }
    out.push({ type: 'text', content: ezikFoldCut(body, budget) });
    budget = 0;
    changed = true;
  }
  return changed ? out : null;
}

// ============================================================
// S98 — الإجراءات السريعة (quick actions under the last completed reply)
// ============================================================
// Five follow-ups, and every one of them is an ORDINARY QUESTION: the label is pressed, the
// sentence below is handed to the SAME sendMessage the composer calls, and from that point the
// turn is indistinguishable from one the child typed. No endpoint, no flag, no depth change, no

let EZIK_QUICK_ACTIONS = [
  { key: 'simplify', label: ezT('chat.qa.simplify'),    prompt: 'بسّط لي الإجابة السابقة بكلمات أسهل، مع الحفاظ على المعنى والمصدر الشرعي إن وُجد.' },

// A reply the CLIENT wrote to report its own failure is not something to offer «بسّط» under.
// FRIENDLY_ERRORS is the closed table those replies come from, so matching against it is exact
// and needs no marker on the message — which matters, because a marker would change the shape of
// what is stored. (A server-worded day-cap message arrives as an ordinary 200 reply and is by
// design indistinguishable from an answer; the client cannot and does not guess at it.)
const EZIK_ERROR_REPLIES = (function () {
  const out = [];
  Object.keys(FRIENDLY_ERRORS).forEach((k) => {
    const b = FRIENDLY_ERRORS[k];
    if (b && b.male) out.push(b.male);
    if (b && b.female) out.push(b.female);

})();
const ezikIsErrorReply = (t) => typeof t === 'string' && EZIK_ERROR_REPLIES.indexOf(t.trim()) !== -1;

// ============================================================
// S98 — اقتباس الرد (quote a reply into the composer)
// ============================================================
// It puts text in the box and moves the caret there. It sends NOTHING, it stores nothing, and it
// leaves whatever the child had already typed exactly where it was.
const EZIK_QUOTE_MAX = 500;
const EZIK_QUOTE_LABEL = 'اقتباس';
let EZIK_QUOTE_ARIA = ezT("chat.quoteAria");
function ezikBuildQuote(clean) {
  let t = String(clean == null ? '' : clean).replace(/\s+/g, ' ').trim();
  if (!t) return '';
  if (t.length > EZIK_QUOTE_MAX) {
    t = t.slice(0, EZIK_QUOTE_MAX).replace(/\s+\S*$/, '').replace(/\s+$/, '') + ' …';
  }
  return '« ' + t + ' »';
}
// WHERE A QUOTE LANDS. Kept as a pure rule rather than a line buried inside the handler, because
// the one thing it must never do — throw away what the child had already typed — is worth being
// able to state and to test on its own. Existing text is kept and the quotation is appended under
// it after a blank line; an empty box simply receives the quotation.
function ezikComposeWithQuote(prev, block) {
  const had = String(prev == null ? '' : prev);
  if (!block) return had;
  return had.trim() ? had.replace(/\s+$/, '') + '\n\n' + block + '\n' : block + '\n';
}

// ============================================================
// S93 — عارض Markdown للعرض فقط (display-only Markdown)
// ============================================================
// The model writes ordinary Markdown — **bold**, ## headings, - lists, ---, | tables — and the
// bubble printed those characters at the child. This turns them into layout instead. It is a
// DISPLAY layer and nothing else: the raw reply is still what is stored, what is sent back as
// history, what the clipboard copies and what the voice reads. Only the JSX changed.
//
// IT NEVER PARSES HTML AND IT NEVER INJECTS ANY. There is no dangerouslySetInnerHTML in it, and
// no path that turns a string into markup: every output is a React element or a string child, so
// anything HTML-shaped in the reply — <script>, an <img onerror=…>, an <iframe> — arrives as a
// TEXT node and is escaped by React exactly as it is today. Markdown's own raw-HTML passthrough
// is deliberately NOT implemented; there is nowhere for model-authored HTML to become an element.
//
// IT RUNS AFTER THE CARDS ARE SEPARATED. parseRichMessage has already lifted every verse, hadith,
// source, dhikr, board, steps and document out into its own card before this is reached, so it
// only ever sees seg.type === 'text' prose and no card body can be reformatted by it.
//
// IT IS SAFE ON A HALF-WRITTEN LINE. While a reply streams, the tail is arbitrary: an unclosed
// **, a table whose delimiter row has not arrived, a heading with no text yet. EVERY rule below
// requires its closing side before it formats anything, so an unfinished construct renders as the
// literal characters it is made of and never swallows the rest of the message.

// The inline rules. Each needs its CLOSING delimiter present, which is what makes a streaming
// tail safe. `pre` names a leading group that is context, not part of the match.
const EZ_MD_INLINE = [
  // EVERY delimiter must HUG its content: an opener is followed by a non-space and a closer is
  // preceded by one. That single rule is what keeps «٥ * ٣ = ١٥ و٢ * ٤ = ٨» as arithmetic instead
  // of turning the middle of it into italics — the asterisks there are surrounded by spaces, so
  // neither one can open anything.
  { re: /`([^`\n]+)`/, tag: 'code', literal: true },
  { re: /\*\*(\S|\S[^\n]*?\S)\*\*/, tag: 'strong' },
  { re: /__(\S|\S[^\n]*?\S)__/, tag: 'strong' },
  { re: /~~(\S|\S[^\n]*?\S)~~/, tag: 'del' },
  // A single * is italic only between word boundaries, so a stray asterisk stays a stray asterisk.
  { re: /(^|[\s(\[«"'،؛:.!?؟])\*(\S|\S[^*\n]*?\S)\*(?=$|[\s)\]»"'،؛:.!?؟])/, tag: 'em', group: 2, pre: 1 },
];

// Inline pass: emit the EARLIEST match, recurse into its content, continue after it. Anything the
// rules do not claim is returned as a plain string child, which React escapes.
function ezMdInline(text, keyPrefix) {
  const out = [];
  let rest = String(text == null ? '' : text);
  let k = 0;
  let guard = 0;
  while (rest && guard++ < 600) {
    let best = null;
    for (let i = 0; i < EZ_MD_INLINE.length; i++) {
      const rule = EZ_MD_INLINE[i];
      const mm = rule.re.exec(rest);
      if (!mm) continue;
      const at = mm.index + (rule.pre ? mm[rule.pre].length : 0);
      if (!best || at < best.at) best = { at: at, mm: mm, rule: rule };
    }
    if (!best) break;
    const head = rest.slice(0, best.at);
    if (head) out.push(head);
    const rule = best.rule;
    const inner = best.mm[rule.group || 1];
    const key = keyPrefix + 'i' + (k++);
    const consumed = best.mm[0].length - (rule.pre ? best.mm[rule.pre].length : 0);
    // Code spans are literal by definition — nothing inside them is a rule.
    out.push(React.createElement(rule.tag, { key: key, style: rule.literal ? s.mdCode : undefined },
      rule.literal ? inner : ezMdInline(inner, key)));
    rest = rest.slice(best.at + consumed);
  }
  if (rest) out.push(rest);
  return out;
}

// One paragraph line, and the <br/> that separates it from the next — a single newline inside a
// paragraph is a line break here, because a reply written for a child means it as one.
function ezMdLines(lines, keyPrefix) {
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    if (i) out.push(React.createElement('br', { key: keyPrefix + 'br' + i }));
    const parts = ezMdInline(lines[i], keyPrefix + 'l' + i);
    for (let j = 0; j < parts.length; j++) out.push(parts[j]);
  }
  return out;
}

const EZ_MD_HR = /^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/;
const EZ_MD_HEAD = /^\s*(#{1,6})\s+(.+?)\s*#*\s*$/;
const EZ_MD_UL = /^(\s*)[-*+]\s+(.*)$/;
const EZ_MD_OL = /^(\s*)(\d{1,9})[.)]\s+(.*)$/;
const EZ_MD_QUOTE = /^\s*>\s?(.*)$/;
const EZ_MD_FENCE = /^\s*```+\s*[A-Za-z0-9+#_-]*\s*$/;
// The delimiter row is what PROMOTES a line of pipes into a table. Until it arrives the header
// line is still an ordinary paragraph, which is exactly what a half-streamed table should be.
const EZ_MD_TABLE_SEP = /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?\s*$/;

function ezMdIsBlockStart(line) {
  return !line.trim() || EZ_MD_HR.test(line) || EZ_MD_HEAD.test(line) || EZ_MD_UL.test(line) ||
         EZ_MD_OL.test(line) || EZ_MD_QUOTE.test(line) || EZ_MD_FENCE.test(line);
}
function ezMdSplitRow(row) {
  let r = String(row).trim();
  if (r.charAt(0) === '|') r = r.slice(1);
  if (r.charAt(r.length - 1) === '|') r = r.slice(0, -1);
  return r.split('|').map((c) => c.trim());
}
// LOGICAL alignment, not physical. The page is RTL, so a leading colon means "the edge the text
// starts at" and a trailing one means "the edge it ends at"; start/end let the direction decide,
// and an undecorated column simply starts where the language starts.
function ezMdAlign(cell) {
  const c = String(cell).trim();
  const l = c.charAt(0) === ':';
  const r = c.charAt(c.length - 1) === ':';
  if (l && r) return 'center';
  if (r) return 'end';
  return 'start';
}

// A table only exists once the DELIMITER ROW has arrived AND declares the same number of columns
// the header did. Both halves matter: the row is what promotes a line of pipes into a table, and
// the column count is what stops a half-typed «| --» mid-stream from doing it early. Returns the
// parsed header and alignments, or null — and the paragraph gatherer asks the very same question,
// so the two can never disagree about where a table begins.
function ezMdTableAt(lines, i) {
  if (i + 1 >= lines.length) return null;
  const head = lines[i];
  const sep = lines[i + 1];
  if (head.indexOf('|') === -1 || sep.indexOf('-') === -1 || !EZ_MD_TABLE_SEP.test(sep)) return null;
  const cells = ezMdSplitRow(head);
  const align = ezMdSplitRow(sep).map(ezMdAlign);
  if (align.length !== cells.length) return null;
  return { head: cells, align: align };

// The block pass. Returns an array of React elements — never a string of markup.
function ezMdBlocks(text) {
  const src = String(text == null ? '' : text).replace(/\r\n?/g, '\n');
  const lines = src.split('\n');
  const out = [];
  let i = 0;
  let key = 0;
  const K = () => 'b' + (key++);
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    // fenced code — the body is literal, and an unclosed fence still renders what has arrived

      const body = [];
      i++;

      if (i < lines.length) i++;

        React.createElement('code', null, body.join('\n'))));
      continue;
    }

    if (EZ_MD_HR.test(line)) { out.push(React.createElement('hr', { key: K(), style: s.mdHr })); i++; continue; }

    const h = line.match(EZ_MD_HEAD);

      const lvl = h[1].length;

      out.push(React.createElement('div', { key: k, style: (lvl <= 1 ? s.mdH1 : lvl === 2 ? s.mdH2 : s.mdH3), role: 'heading', 'aria-level': lvl },

      const align = tbl.align;

      const rows = [];
      while (i < lines.length && lines[i].trim() && lines[i].indexOf('|') !== -1 && !EZ_MD_HR.test(lines[i])) {
        rows.push(ezMdSplitRow(lines[i]));
        i++;

      const k = K();
      out.push(React.createElement('div', { key: k, style: s.mdTableWrap },
        React.createElement('table', { style: s.mdTable },
          React.createElement('thead', null,
            React.createElement('tr', null, head.map((c, j) =>
              React.createElement('th', { key: j, style: Object.assign({}, s.mdTh, { textAlign: align[j] || 'right' }) },
                ezMdInline(c, k + 'h' + j))))),
          React.createElement('tbody', null, rows.map((r, ri) =>
            React.createElement('tr', { key: ri }, head.map((_, j) =>
              React.createElement('td', { key: j, style: Object.assign({}, s.mdTd, { textAlign: align[j] || 'right' }) },
                ezMdInline(r[j] == null ? '' : r[j], k + 'r' + ri + 'c' + j)))))))));
      continue;
    }

    // blockquote
    if (EZ_MD_QUOTE.test(line)) {
      const body = [];
      while (i < lines.length && EZ_MD_QUOTE.test(lines[i])) { body.push(lines[i].match(EZ_MD_QUOTE)[1]); i++; }
      const k = K();
      out.push(React.createElement('div', { key: k, style: s.mdQuote }, ezMdLines(body, k)));
      continue;
    }

    // lists — a following indented line continues the item it belongs to
    if (EZ_MD_UL.test(line) || EZ_MD_OL.test(line)) {
      // A line begins with either a digit or a bullet, never both, so the two cannot disagree.
      const isOrdered = EZ_MD_OL.test(line);
      const items = [];
      const startAt = isOrdered ? parseInt(line.match(EZ_MD_OL)[2], 10) : 1;
      while (i < lines.length) {
        const cur = lines[i];
        const mu = cur.match(EZ_MD_UL);
        const mo = cur.match(EZ_MD_OL);
        const sameKind = isOrdered ? (!!mo && !mu) : !!mu;
        if (sameKind) { items.push([isOrdered ? mo[3] : mu[2]]); i++; continue; }
        if (items.length && cur.trim() && /^\s{2,}/.test(cur) && !ezMdIsBlockStart(cur)) {
          items[items.length - 1].push(cur.trim()); i++; continue;
        }
        break;
      }
      const k = K();
      out.push(React.createElement(isOrdered ? 'ol' : 'ul',
        { key: k, style: isOrdered ? s.mdOl : s.mdUl, start: isOrdered && startAt !== 1 ? startAt : undefined },
        items.map((it, ii) => React.createElement('li', { key: ii, style: s.mdLi }, ezMdLines(it, k + 'i' + ii)))));
      continue;
    }

    // paragraph — everything up to a blank line or the start of another block
    const para = [line];
    i++;
    while (i < lines.length && lines[i].trim() && !ezMdIsBlockStart(lines[i]) && !ezMdTableAt(lines, i)) {
      para.push(lines[i]); i++;
    }
    const k = K();
    out.push(React.createElement('div', { key: k, style: s.mdP }, ezMdLines(para, k)));
  }
  return out;
}

// The component the bubble renders. Memoised on the string, because the whole thread re-renders
// on every streaming delta and a settled reply must not be re-parsed for each one.
const EzikMarkdown = React.memo(function EzikMarkdown({ text }) {
  const t = String(text == null ? '' : text);
  if (!t.trim()) return null;
  const blocks = ezMdBlocks(t);
  if (!blocks.length) return null;
  return React.createElement(React.Fragment, null, blocks);
});

// THE ONE PLACE A SEGMENT BECOMES AN ELEMENT.
// Lifted out of MessageBubble in S98 so the favourites screen can show a saved reply through the
// EXACT renderer the chat uses. A second, parallel renderer there is what would eventually leak a
// raw <verse …> at a reader — this makes that impossible by construction, because there is only
// one mapping and both callers go through it. Behaviour is byte-identical to the map it replaces:
// same components, same props, same index keys, same null for a folded-away prose segment.
// The JSX below is byte-for-byte the map it replaces, down to the names `tashkeel`, `age`,
// `onPlayVerse`, `onPlaySurah` and `onStopAudio` — which is deliberate. markdown-guard pins the
// exact form of the prose site and counts the display sites of EzikMarkdown; keeping the shape
// identical means this refactor moves the code without loosening a single thing that gate holds.
function ezikRenderSegments(segments, ctx) {
  const { tashkeel, age, onPlayVerse, onPlaySurah, onStopAudio } = (ctx || {});
  return (segments || []).map((seg, i) => {
    if (!seg) return null;   // S98: a folded-away prose segment, holding its index open
    if (seg.type === 'text') {
      // S93: PROSE ONLY, and the last thing that happens to it. The cards were separated above,
      // the tashkeel toggle has already had its say (it removes diacritics and touches no Markdown
      // character), and what remains is turned into layout for the eye. seg.content itself is
      // untouched — the clipboard, the voice and the stored thread all still read the raw text,
      // which is why an old saved conversation formats too: the formatting is computed here, at
      // display, from text that was never rewritten.
      // S99: `ez-prose` marks THE prose of a reply — the one surface reading mode opens up. Cards
      // do not carry it, so an ayah, a hadith and a source keep their own measured spacing.
      return <div key={i} className="ez-prose" style={s.bubbleText}><EzikMarkdown text={tashkeel ? seg.content : stripTashkeelOutsideQuran(seg.content)} /></div>;
    }
    if (seg.type === 'verse') {
      return <VerseCard key={i} surah={seg.surah} surahNum={seg.surahNum} ayah={seg.ayah} onPlayVerse={onPlayVerse} onStopAudio={onStopAudio} />;
    }
    if (seg.type === 'surah') {
      return <SurahCard key={i} num={seg.num} from={seg.from} to={seg.to} onPlaySurah={onPlaySurah} onStopAudio={onStopAudio} />;
    }
    if (seg.type === 'hadith') {
      return <HadithCard key={i} content={seg.content} narrator={seg.narrator} ruling={seg.ruling} />;
    }
    if (seg.type === 'source') {
      return <SourceCard key={i} site={seg.site} url={seg.url} content={seg.content} />;
    }
    if (seg.type === 'dhikr') {
      return <DhikrCard key={i} catId={seg.catId} />;
    }
    if (seg.type === 'worship') {
      return <WorshipCard key={i} id={seg.id} band={deriveCaps(age).band} />;
    }
    if (seg.type === 'steps') {
      return <StepsCard key={i} items={seg.items} title={seg.title} />;
    }
    if (seg.type === 'board') {
      return <BoardCard key={i} content={seg.content} />;
    }
    if (seg.type === 'document') {
      return <DocumentCard key={i} title={seg.title} content={seg.content} age={age} />;
    }
    if (seg.type === 'notice') {
      return <ReviewNotice key={i} label={seg.label} content={seg.content} />;
    }
    return null;
  });
}

// S98 PERF: MEMOISED. Every prop below is either a primitive, the message object itself (whose
// identity the thread preserves across a re-render) or a callback App pins to one identity — so a
// keystroke in the composer re-renders the composer and NOT the thread. See the note beside the
// pinned callbacks in App for the measurement that made this necessary.
const MessageBubble = React.memo(function MessageBubble({ message, index, onSuggestionClick, onPlayVerse, onPlaySurah, onStopAudio, onPlayMessage, age, onReport, tashkeel, onToggleTashkeel, onQuote, onFavorite, isFavorite, defaultOpen, foldEpoch }) {
  const isUser = message.role === 'user';
  // S97 PERF. This parse used to run on EVERY render of EVERY assistant bubble, and the chat's
  // composer state lives on App -- so a single keystroke re-parsed the whole thread. On a 120-turn
  // conversation that was ~60 full re-parses per typed character, and nothing about them changed.
  // parseRichMessage is a pure function of exactly the two inputs in the dependency list: it reads
  // the text and the viewer's age band and returns segment DESCRIPTORS. It touches no store. The
  // cards that DO read stores (dhikr, worship, verse) are separate components below and still
  // re-render and re-read on every pass, exactly as before -- so the D91 note further down ("the
  // stores the cards read are still filling while this runs") is untouched by caching descriptors.
  // TWO things about the shape of this, both load-bearing:
  //   - it sits ABOVE the isUser early return, because bubbles are keyed by INDEX: React reuses
  //     the instance at index i across conversations, and if the role at that index flips
  //     user<->assistant a hook below the return would change the hook COUNT and React would throw.
  //   - it still must not RUN for a user bubble: a user turn carrying an attachment has an ARRAY
  //     content, and parseRichMessage calls text.search() before its own typeof guard, so parsing
  //     one would throw. The branch is inside the callback, so the hook stays unconditional.
  const { segments, suggestions } = React.useMemo(
    () => (isUser ? { segments: [], suggestions: [] } : parseRichMessage(message.content, age)),
    [isUser, message.content, age]);
  // S98 THE FOLD. Two hooks, both unconditional and both ABOVE the isUser return, for the same
  // reason the memo above is: bubbles are keyed by index, so React reuses the instance at index i
  // when a conversation is replaced, and a hook below the return would change the hook COUNT the
  // moment the role at that index flipped.
  //
  // WHERE THE FOLD STARTS is App's to say (`defaultOpen`): a reply that just finished streaming in
  // this thread opens EXPANDED, everything else opens folded. WHAT THE USER DID TO IT since is
  // this component's to remember, and it overrides the default in either direction — so the button
  // works on a streamed reply exactly as it does on a restored one.
  //
  // The override carries the THREAD EPOCH as its key. Bubbles are keyed by index, so React reuses
  // the instance at index i whenever the thread is replaced; without a key, a reply the reader had
  // expanded would hand that state to whatever reply later occupied the slot — and, since a
  // reopened conversation holds the very same text at the very same index, a text key could not
  // tell the two apart either. The epoch can: it changes on exactly the two events that replace a
  // thread. Everything else appends, so an epoch that has not changed means the same thread. It is
  // UI state and it is deliberately not stored: reopening the app folds every long reply again.
  const [foldOverride, setFoldOverride] = React.useState(null);   // { epoch, open } | null
  const foldView = React.useMemo(
    () => (isUser ? null : ezikFoldSegments(segments, EZIK_FOLD_MIN_CHARS, EZIK_FOLD_HEAD_CHARS)),
    [isUser, segments]);
  // S112: THE TWO TURNS ARE DIFFERENT STRUCTURES, not two colours of one. A user turn is a
  // COMPACT card held to one side of the column and to a fraction of its width -- it is a thing
  // said, and it is short. An assistant turn is a full-measure READING SHEET, stretched across
  // the whole column with room for prose, cards and the sources beneath them. The two are told
  // apart by shape at a glance, with the page reversed or the colours inverted.
  if (isUser) {
    const c = message.content;
    if (Array.isArray(c)) {
      const imgBlock = c.find(b => b && b.type === 'image');
      const txtBlock = c.find(b => b && b.type === 'text');
      return (
        <div className="ezc-turn is-user">
        <div className="ez-anim" style={{ ...s.messageBubble, ...s.userBubble, animation: 'fadeIn 0.3s ease-out' }}>
          {imgBlock && <img src={`data:${imgBlock.source.media_type};base64,${imgBlock.source.data}`} style={{ maxWidth: '100%', borderRadius: 10, marginBottom: txtBlock ? 8 : 0, display: 'block' }} />}
          {txtBlock && txtBlock.text}
        </div>
        </div>
      );
    }
    return <div className="ezc-turn is-user"><div className="ez-anim" style={{ ...s.messageBubble, ...s.userBubble, animation: 'fadeIn 0.3s ease-out' }}>{c}</div></div>;
  }
  // رسالة الأستاذ: بطاقاتها مفصولةٌ أعلاه قبل أن يعمل عارضُ Markdown
  // D90: the clipboard carries EVERY rendered block, in display order. D91: it is built on the
  // TAP, not here, because the stores the cards read are still filling while this runs.
  const buildCopyText = () => serializeReply(segments, { tashkeel, band: deriveCaps(age).band });
  // S98: the fold decides only what is DRAWN. buildCopyText above, the listen button below and
  // every export path all read `segments` / message.content — the WHOLE reply — so a folded reply
  // is copied, spoken and exported in full.
  const canFold = !!foldView;
  const overrideActive = !!foldOverride && foldOverride.epoch === foldEpoch;
  const foldOpen = canFold && (overrideActive ? foldOverride.open : !!defaultOpen);
  const shownSegments = (canFold && !foldOpen) ? foldView : segments;
  return (
    <div className="ez-anim" style={{ animation: 'fadeIn 0.3s ease-out', display: 'flex', flexDirection: 'column', alignItems: 'stretch', gap: 8, maxWidth: '100%' }}>
      {/* S112: the reading sheet. Every segment the reply produced is still drawn here, in the
          order ezikRenderSegments returns them and by the SAME single renderer -- the prose, the
          ayah, the hadith and the source chips beneath them. Nothing was reordered, moved out or
          re-grouped; what changed is that the sheet is now the full width of a bounded column
          instead of 92% of an unbounded viewport. */}
      <div className="ezc-ans" style={{ ...s.assistantBubble, maxWidth: '100%', /* 13.4-b2 */ padding: '16px 18px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        {ezikRenderSegments(shownSegments, { tashkeel, age, onPlayVerse, onPlaySurah, onStopAudio })}
        {/* S98: the toggle lives INSIDE the bubble, under the prose it governs, so it reads as
            part of the reply rather than as a fourth action button. It exists only when there is
            something folded away — a short reply never grows one. */}
        {canFold && (
          <button
            type="button"
            onClick={() => setFoldOverride({ epoch: foldEpoch, open: !foldOpen })}
            aria-expanded={foldOpen ? 'true' : 'false'}
            aria-label={ezT(foldOpen ? EZIK_FOLD_HIDE : EZIK_FOLD_SHOW)}
            className="ezik-focus"
            style={s.foldToggle}
          >
            <span>{ezT(foldOpen ? EZIK_FOLD_HIDE : EZIK_FOLD_SHOW)}</span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, transform: foldOpen ? 'rotate(180deg)' : 'none' }}>
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
        )}
      </div>
      {/* S112: the reply's own action rail -- a small row belonging to the sheet above it, at the
          reading edge of the column. It is not a floating bar and it is not per-screen furniture:
          the same buttons, the same handlers, the same aria-pressed, and not one action that was
          not already here. */}
      <div className="ezc-acts" style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', justifyContent: 'flex-start', padding: '0 2px' }}>
        <MessageListenButton text={message.content} onPlayMessage={onPlayMessage} onStopAudio={onStopAudio} />
        {/* text= decides only VISIBILITY, and is deliberately store-independent: the raw reply
            always exists, so the button can no longer vanish because a fetch had not landed. */}
        <CopyReplyButton text={String(message.content || '').trim()} getText={buildCopyText} />
        {/* S98: the quote button hands over the SAME clean text the clipboard gets (cards
            serialized, no tag ever reaches it), trimmed to a preview and dropped into the
            composer. It sends nothing. */}
        {onQuote && (
          <button type="button" onClick={() => onQuote(buildCopyText())} aria-label={EZIK_QUOTE_ARIA} className="ezik-focus" style={miniBtnStyle}>{EZIK_QUOTE_LABEL}</button>
        )}
        {/* S98: the star. `isFavorite` is a boolean handed DOWN — this component never reads a
            store, never parses JSON and never scans a list to draw it. */}
        {onFavorite && (
          <button
            type="button"
            onClick={() => onFavorite(message, index)}
            aria-pressed={isFavorite ? 'true' : 'false'}
            aria-label={isFavorite ? EZIK_FAV_DEL : EZIK_FAV_ADD}
            className="ezik-focus"
            style={{ ...miniBtnStyle, opacity: isFavorite ? 1 : 0.7, borderColor: isFavorite ? 'var(--red)' : 'var(--line)', color: isFavorite ? 'var(--red)' : 'inherit' }}
          >
            <svg width="13" height="13" viewBox="0 0 24 24" fill={isFavorite ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <path d="M12 17.3l-5.4 3 1-6-4.4-4.3 6-.9L12 3.5l2.8 5.6 6 .9-4.4 4.3 1 6z" />
            </svg>
          </button>
        )}
        <button type="button" onClick={onToggleTashkeel} aria-label={'\u062A\u0634\u0643\u064A\u0644'} style={{ ...miniBtnStyle, opacity: tashkeel ? 1 : 0.7, borderColor: tashkeel ? 'var(--red)' : 'var(--line)' }}>{'\u062A\u0634\u0643\u064A\u0644'}</button>
        <button type="button" onClick={() => onReport && onReport(index)} aria-label={ezT("chat.report")} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, background: 'transparent', color: 'var(--muted)', border: '1px solid var(--line)', borderRadius: 8, padding: '4px 10px', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          <span>بلّغ</span>
        </button>
      </div>
      {suggestions && suggestions.length > 0 && (
        <div style={s.suggestionsInline}>
          {suggestions.map((sg, i) => (
            <button key={i} onClick={() => onSuggestionClick && onSuggestionClick(sg)} style={s.suggestionChipSmall}>
              {sg}
            </button>
          ))}
        </div>
      )}
    </div>
  );
});

// ============================================================
// S98 — شاشة المفضلة (the favourites screen)
// ============================================================
// It draws ONLY what it is handed: the records, and the set of conversation ids that still exist.
// It reads no store, parses no JSON and owns no copy of anything — so it cannot disagree with the
// menu badge, and a record whose conversation was deleted is a data question answered before this
// component is reached rather than a crash inside it.
//
// A saved reply is drawn through ezikRenderSegments, the SAME renderer the chat bubble uses, so
// its ayah, hadith and source card appear here exactly as they did in the conversation and no raw
// tag can reach the reader by a second path.
// One saved reply's body, and it folds exactly as the chat bubble does — through the same
// ezikFoldSegments and the same toggle. Without it a single long favourite filled several screens
// and pushed its own copy/remove/open buttons far below the fold, which made the list unusable at
// the one length that most needs saving.
function FavoriteReplyBody({ segments, age, tashkeel }) {
  const [open, setOpen] = useState(false);
  const folded = React.useMemo(
    () => ezikFoldSegments(segments, EZIK_FOLD_MIN_CHARS, EZIK_FOLD_HEAD_CHARS),
    [segments]);
  const shown = (folded && !open) ? folded : segments;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      {ezikRenderSegments(shown, { tashkeel, age })}
      {folded && (
        <button
          type="button"
          onClick={() => setOpen(!open)}
          aria-expanded={open ? 'true' : 'false'}
          aria-label={ezT(open ? EZIK_FOLD_HIDE : EZIK_FOLD_SHOW)}
          className="ezik-focus"
          style={{ ...s.foldToggle, alignSelf: 'flex-start' }}
        >
          <span>{ezT(open ? EZIK_FOLD_HIDE : EZIK_FOLD_SHOW)}</span>
        </button>
      )}
    </div>
  );
}

// S114: the same component, on istana chrome. It is handed the SAME props, in the SAME order the
// owner already computed them, and it still reads no store, parses no JSON and owns no copy of
// anything. `items` is mapped once, exactly as it arrives -- there is no sort, no filter, no
// slice and no reverse anywhere on this screen; the newest-first order is myFavs' and the search
// order is ezikSearchFavs'. Nothing below writes a byte.
//
// THE RAIL's back control is the shipped one: same handler, same visible «← رجوع», so the name a
// reader hears and the target a test clicks are both unchanged. The MASTHEAD is small and it is
// useful -- it holds the one control this screen has. The CATALOGUE is .ezfav-cat in <style>: the
// column count is the only thing the viewport decides, and every card keeps its own height.
function FavoritesScreen({ items, liveChatIds, onBack, onOpenChat, onRemove, age, tashkeel, query, onQuery, searching, total }) {
  return (
    <div className="theme-dark ezhome ezfav" style={s.favScreen}>
      <div className="ezfav-rail">
        <div className="ezfav-rail-inner">
          <button onClick={onBack} className="ezfav-back ezik-focus">{EZIK_BACK}</button>
          <span className="ezfav-brand">
            <span className="ezfav-brand-arch" aria-hidden="true" />
            <span className="ezfav-brand-text">{EZIK_FAV_HEADING}</span>
          </span>
        </div>
      </div>
      <div style={s.favBody}>
       <div className="ezfav-wrap">
        {/* S98/S114: the same local search over the records ALREADY IN MEMORY, in the masthead. */}
        {total > 0 && (
          <div className="ezfav-masthead">
            <span className="ezfav-crest" aria-hidden="true" />
            <div className="ezfav-mast-field">
            <input
              type="search"
              value={query}
              onChange={(e) => onQuery(e.target.value)}
              placeholder={EZIK_FAV_SEARCH_PH}
              aria-label={EZIK_FAV_SEARCH_ARIA}
              className="ezik-focus"
              style={s.drawerSearch}
            />
            </div>
          </div>
        )}
        {total === 0 && (
          <div className="ezfav-empty">
            <span className="ezfav-empty-crest" aria-hidden="true"><span className="ezfav-empty-in" /></span>
            {ezLangGet() === 'ar'
              ? <div className="ezfav-empty-text">{EZIK_FAV_EMPTY}</div>
              : <div className="ezfav-empty-text">{ezT('favorites.empty')}</div>}
          </div>
        )}
        {total > 0 && searching && items.length === 0 && <div style={s.drawerEmpty}>{EZIK_SEARCH_NONE}</div>}
        <div className="ezfav-cat">
        {items.map((f) => {
          const parsed = parseRichMessage(f.text, age);
          const alive = !!f.chatId && liveChatIds.has(f.chatId);
          const when = ezikFavDate(f.at);
          return (
            <div key={f.id} className="ezfav-card" style={s.favCard}>
              <div className="ezfav-head">
                <span className="ezfav-head-mark" aria-hidden="true" />
                {when && <div style={s.favMeta}>{when}</div>}
              </div>
              <div className="ezfav-read">
              <FavoriteReplyBody segments={parsed.segments} age={age} tashkeel={tashkeel} />
              </div>
              <div className="ezfav-foot" style={s.favRow}>
                <CopyReplyButton
                  text={String(f.text || '').trim()}
                  getText={() => serializeReply(parsed.segments, { tashkeel, band: deriveCaps(age).band })}
                />
                <button type="button" onClick={() => onRemove(f.id)} aria-label={EZIK_FAV_DEL} className="ezik-focus" style={s.favBtn}>
                  {EZIK_FAV_REMOVE}
                </button>
                {/* The original conversation. When it is gone the row SAYS so instead of
                    offering a button that would do nothing — and nothing here can throw on a
                    missing conversation, because the only thing consulted is a Set of ids. */}
                {alive ? (
                  <button type="button" onClick={() => onOpenChat(f.chatId)} aria-label={EZIK_FAV_OPEN_CHAT} className="ezik-focus" style={s.favBtn}>
                    {EZIK_FAV_OPEN_CHAT}
                  </button>
                ) : (
                  <span style={{ ...s.favBtn, ...s.favBtnOff }}>{EZIK_FAV_CHAT_GONE}</span>
                )}
              </div>
            </div>
          );
        })}
        </div>
       </div>
      </div>
    </div>
  );
}

// Flag-a-reply modal (step 2b). Copies AdultGate's overlay+card pattern (the app's one existing
// floating popup) so there is no second modal idiom. The four reason keys below are the server's
// literal keys -- labels are shown, keys are sent. The result text is honest: only a real 200 says
// "delivered"; a 429 or any other outcome says it did NOT arrive (the server fails closed on
// purpose, and the client must not paper over that with a false smile).
function ReportModal({ onClose, onSubmit }) {
  const [reason, setReason] = useState('');
  const [note, setNote] = useState('');
  const [status, setStatus] = useState('idle'); // idle | sending | ok | rate | fail
  const REASON_OPTIONS = [
    { key: 'wrong_info', label: 'معلومةٌ خاطئة' },
    { key: 'wrong_ruling', label: 'حكمٌ شرعيٌّ خاطئ' },
    { key: 'inappropriate', label: 'محتوًى غيرُ مناسب' },
    { key: 'other', label: 'شيءٌ آخر' },
  ];
  const send = async () => {
    if (!reason || status === 'sending') return;
    setStatus('sending');
    const r = await onSubmit(reason, note);
    setStatus(r);
  };
  const overlay = { position: 'fixed', inset: 0, zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20, background: 'rgba(30,30,30,0.6)' };
  if (status === 'ok') {
    return (
      <div style={overlay}>
        <div style={{ ...s.onboardingCard, maxWidth: 360 }}>
          <div style={s.bigEmoji}>✅</div>
          <div style={s.onboardingTitle}>وصل بلاغُك. شكرًا لك.</div>
          <button onClick={onClose} style={s.primaryBtn}>إغلاق</button>
        </div>
      </div>
    );
  }
  return (
    <div style={overlay}>
      <div style={{ ...s.onboardingCard, maxWidth: 360 }}>
        <div style={s.bigEmoji}>🚩</div>
        <div style={s.onboardingTitle}>بلّغ عن هذا الردّ</div>
        <div style={s.onboardingSubtitle}>اختر السبب، وأضِف ملاحظةً إن شئت.</div>

function VerseCard({ surah, surahNum, ayah, onPlayVerse, onStopAudio }) {
  const [playing, setPlaying] = useState(false);
  const [audioFailed, setAudioFailed] = useState(false);
  // نصّ الآية يأتي حصراً من المصحف الكنسي المُحمَّل، لا من النموذج.
  const [verseText, setVerseText] = useState('');
  const [textState, setTextState] = useState('loading'); // loading | ok | fail
  const audioRef = useRef(null); // fallback محلي فقط (إن لم تُمرَّر دوال المنسِّق)

  const sNum = resolveSurahNumber(surah, surahNum);
  const aNum = parseInt(ayah, 10);
  const canPlay = !!sNum && aNum >= 1;
  const surahName = surah || (sNum ? SURAH_NAMES[sNum] : '');
  const pad3 = (x) => String(x).padStart(3, '0');
  const audioUrl = canPlay
    ? `https://everyayah.com/data/${QURAN_RECITER}/${pad3(sNum)}${pad3(aNum)}.mp3`
    : null;

  // جلب نصّ الآية الكنسي مرة واحدة (مُخزَّن في الذاكرة). عند الفشل: لا نصّ —
  // نعرض المرجع وزرّ التلاوة فقط، ولا نقع أبداً على نصّ النموذج أو ترميز خام.
  useEffect(() => {
    let alive = true;
    if (!canPlay) { setTextState('fail'); return; }
    loadQuran()
      .then(() => {
        if (!alive) return;
        const t = getVerseText(sNum, aNum);
        if (t) { setVerseText(t); setTextState('ok'); }
        else { setTextState('fail'); }
      })
      .catch(() => { if (alive) setTextState('fail'); });
    return () => { alive = false; };
  }, [sNum, aNum, canPlay]);

  // إيقاف صوت fallback المحلي وتنظيفه عند إزالة البطاقة
  useEffect(() => () => { if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; } }, []);

  // إعادة تشغيل يدوية — عبر منسِّق App: يُوقف كلام المربّي أولاً ثم يُعيد التلاوة.
  // الزر الآن «تكرار» يدوي؛ التلاوة تُشغَّل تلقائياً ضمن تسلسل الردّ في App.
  const togglePlay = () => {
    // مسار المنسِّق الموحَّد (الاستخدام الفعلي في المحادثة)
    if (onPlayVerse) {
      if (playing) {
        if (onStopAudio) onStopAudio();
        setPlaying(false);
        return;
      }
      setAudioFailed(false);
      setPlaying(true);
      Promise.resolve(onPlayVerse(sNum, aNum))
        .then((res) => { setPlaying(false); if (res && res.failed) setAudioFailed(true); })
        .catch(() => { setPlaying(false); setAudioFailed(true); });
      return;
    }
    // fallback محلي (لو رُكِّبت البطاقة خارج المحادثة بدون دوال المنسِّق)
    setAudioFailed(false);
    if (!audioRef.current) {
      const audio = new Audio(audioUrl);
      audio.onended = () => setPlaying(false);
      audio.onerror = () => { setPlaying(false); setAudioFailed(true); };
      audioRef.current = audio;
    }
    const audio = audioRef.current;
    if (playing) {
      audio.pause();
      setPlaying(false);
    } else {
      setPlaying(true);
      const p = audio.play();
      if (p && p.catch) p.catch(() => { setPlaying(false); setAudioFailed(true); });
    }
  };

  return (
    <div style={s.verseCard}>
      <div style={s.verseCardLabel}>
        <span>قَالَ اللهُ تَعَالَى</span>
      </div>
      {textState === 'ok' && <div style={s.verseText}>{verseText}</div>}
      <div style={s.verseFooter}>
        {(surahName || ayah) && (
          <div style={s.verseMeta}>
            {surahName && `سورة ${surahName}`}{surahName && ayah && '، '}{ayah && `آية ${ayah}`}
          </div>
        )}
        {canPlay && (
          <button
            type="button"
            onClick={togglePlay}
            style={s.versePlayBtn}
            aria-label={playing ? 'إيقاف التلاوة' : 'تشغيل التلاوة'}
          >
            {playing ? <PauseIcon size={14} /> : <PlayIcon size={14} />}
            <span>{playing ? 'إيقاف' : 'استمع للتلاوة'}</span>
          </button>
        )}
      </div>
      {audioFailed && <div style={s.verseAudioError}>تعذّر تحميل التلاوة</div>}
    </div>
  );
}

// بطاقة السورة الكاملة (أو مدًى متّصل): نصّ واحد متّصل بأرقام آيات ۝، وزرّ تلاوة واحد.
// النصّ من المصحف الكنسي حصراً؛ عند الفشل نعرض الاسم والمدى فقط (لا نصّ نموذج ولا ترميز خام).
function SurahCard({ num, from, to, onPlaySurah, onStopAudio }) {
  const [playing, setPlaying] = useState(false);
  const [audioFailed, setAudioFailed] = useState(false);
  const [body, setBody] = useState('');
  const [state, setState] = useState('loading'); // loading | ok | fail
  const [range, setRange] = useState({ from: 0, to: 0, whole: false });

  const sNum = resolveSurahNumber(undefined, num);
  const surahName = sNum ? SURAH_NAMES[sNum] : '';

  useEffect(() => {
    let alive = true;
    if (!sNum) { setState('fail'); return; }
    loadQuran()
      .then(() => {
        if (!alive) return;
        const count = getSurahAyahCount(sNum);
        if (!count) { setState('fail'); return; }
        let f = parseInt(from, 10); if (!(f >= 1)) f = 1;
        let t = parseInt(to, 10); if (!(t >= 1) || t > count) t = count;
        if (f > t) { setState('fail'); return; }
        setRange({ from: f, to: t, whole: f === 1 && t === count });
        const pieces = [];
        // البسملة (للسورة كاملة من الآية ١) — غير مرقّمة، إلا الفاتحة (آية ١) والتوبة (لا بسملة).
        // نُعيد استخدام نصّ البسملة الكنسي getVerseText(1,1) — لا نكتب نصّاً قرآنياً يدوياً.
        if (f === 1 && sNum !== 1 && sNum !== 9) {
          const basmala = getVerseText(1, 1);
          if (basmala) pieces.push(basmala);
        }
        let missing = false;
        for (let a = f; a <= t; a++) {
          const vt = getVerseText(sNum, a);
          if (!vt) { missing = true; break; }
          pieces.push(`${vt} ۝${toArabicDigits(a)}`); // آية + رقمها داخل زخرفة نهاية الآية
        }
        if (missing) { setState('fail'); return; }
        setBody(pieces.join(' '));
        setState('ok');
      })
      .catch(() => { if (alive) setState('fail'); });
    return () => { alive = false; };
  }, [sNum, from, to]);

  const metaLabel = !surahName ? ''
    : range.whole ? `سورة ${surahName}`
    : (range.from ? `سورة ${surahName}، الآيات ${toArabicDigits(range.from)}–${toArabicDigits(range.to)}` : `سورة ${surahName}`);

  const togglePlay = () => {
    if (!onPlaySurah) return;
    if (playing) {
      if (onStopAudio) onStopAudio();
      setPlaying(false);
      return;
    }
    setAudioFailed(false);
    setPlaying(true);
    Promise.resolve(onPlaySurah(sNum, range.from || 1, range.to || null))
      .then((res) => { setPlaying(false); if (res && res.failed) setAudioFailed(true); })
      .catch(() => { setPlaying(false); setAudioFailed(true); });
  };

  return (
    <div style={s.verseCard}>
      <div style={s.verseCardLabel}>
        <span>قَالَ اللهُ تَعَالَى{surahName ? ` — سُورَةُ ${surahName}` : ''}</span>
      </div>
      {state === 'ok' && <div style={s.surahText}>{body}</div>}
      <div style={s.verseFooter}>
        {metaLabel && <div style={s.verseMeta}>{metaLabel}</div>}
        {sNum && (
          <button
            type="button"
            onClick={togglePlay}
            style={s.versePlayBtn}
            aria-label={playing ? 'إيقاف التلاوة' : 'تشغيل التلاوة كاملة'}
          >
            {playing ? <PauseIcon size={14} /> : <PlayIcon size={14} />}
            <span>{playing ? 'إيقاف' : 'استمع للتلاوة (كاملة)'}</span>
          </button>
        )}
      </div>
      {audioFailed && <div style={s.verseAudioError}>تعذّر تحميل التلاوة</div>}
    </div>
  );
}

// بطاقة المصدر: شريحةُ عزوٍ قابلةٌ للنقر في نهاية الجواب — أوّلُ رابطٍ خارجيٍّ في التطبيق.
// تُظهِر اسمَ النطاق (site) ثمّ وصفاً عربيّاً موجزاً (المحتوى)، وتفتح url في تبويبٍ جديد.
function SourceCard({ site, url, content }) {
  // D92: this chip is the app's ONLY external navigation -- tapping it leaves for the system
  // browser (a Custom Tab in the standalone/TWA shell, which the web side cannot intercept, so
  // the decision has to be made here). Google's Families policy puts a parental gate exactly
  // here, and before D92 there was none. The hook sits above the missing-url early return so the
  // hook order is stable on every render.
  const [gate, setGate] = useState(null);
  // اسمُ النطاق للعرض: نُفضّل site، وإلا نشتقّه من رابط الصفحة إن أمكن.
  let host = (site || '').trim();
  if (!host && url) {
    try { host = new URL(url).hostname.replace(/^www\./, ''); } catch (e) { host = ''; }
  }
  const label = host || 'المصدر';
  const text = (content || '').trim() || host || url || '';
  const body = [
    <span key="site" style={s.sourceChipSite}>{label}</span>,
    text ? <span key="text" style={s.sourceChipText}>{text}</span> : null,
    <span key="arrow" style={s.sourceChipArrow} aria-hidden="true">↗</span>,
  ];
  // حمايةٌ من رابطٍ مفقود: بلا url نرسم شريحةً نصّيّةً غير قابلةٍ للنقر — لا <a href=""> أبداً.
  if (!url) {
    return <div style={s.sourceChip}>{body}</div>;
  }
  const chipStyle = { ...s.sourceChip, ...s.sourceChipLink };
  if (!(PARENTAL_GATE_ENABLED && childProfileActive())) {
    return (
      <a href={url} target="_blank" rel="noopener noreferrer" style={chipStyle}>
        {body}
      </a>
    );
  }
  // The href stays real, so long-press / copy-link still behave. Only the tap is intercepted:
  // the navigation happens in onPass, which is itself a button click, so no popup blocker fires.
  return (
    <>
      <a href={url} target="_blank" rel="noopener noreferrer" style={chipStyle}
        onClick={(e) => { e.preventDefault(); setGate({ a: 2 + Math.floor(Math.random() * 8), b: 2 + Math.floor(Math.random() * 8) }); }}>
        {body}
      </a>
      {gate && <AdultGate a={gate.a} b={gate.b}
        onPass={() => { setGate(null); try { window.open(url, '_blank', 'noopener,noreferrer'); } catch (e) {} }}
        onCancel={() => setGate(null)} />}
    </>
  );
}

function WorshipCard({ id, band }) {
  const [display, setDisplay] = useState(null);

      .then((d) => { if (alive) setDisplay(d); })
      .catch(() => { if (alive) setFailed(true); });

  }, []);
  // arm: byte-for-byte the prompt's own ternary (band === 'young'). A teen (13-17) takes the

// childProfileActive -- is the ACTIVE stored profile a child (young band)? SourceCard is a leaf
// and carries no profile prop, so the judgement is read from storage at call time, the same way
// childVoiceBlocked reads its mirror. fail-closed: no readable profile => treat as a child, so a
// broken read raises the gate rather than opening the door. Nothing renders a source chip before
// onboarding, so this is never consulted at boot.
function childProfileActive() {
  try {
    const raw = localStorage.getItem('child_profile');
    if (!raw) return true;
    return deriveCaps(JSON.parse(raw).age).band === 'young';
  } catch (e) { return true; }
}

const PARENTAL_GATE_ENABLED = true; // Session 08: gate off during testing - MUST be true before store release
function AdultGate({ a, b, onPass, onCancel }) {
  const [answer, setAnswer] = useState("");
  const [error, setError] = useState(false);
  const submit = () => {
    const v = parseInt(String(answer).replace(/[٠-٩]/g, x => x.charCodeAt(0) - 0x0660), 10);
    if (v === a * b) onPass();
    else { setError(true); setTimeout(() => setError(false), 1500); }
  };
  return (
    <div className="theme-dark ezhome ezgate ezgate-scrim">
      <div className="ezgate-card is-modal" style={s.onboardingCard}>
        <div className="ezgate-crest" aria-hidden="true"><span style={s.bigEmoji}>🔒</span></div>
        <div style={s.onboardingTitle}>تأكيد ولي الأمر</div>
        <div style={s.onboardingSubtitle}>هذا القسم مخصّص للكبار. للتأكيد أنّ وليًّا حاضر، احسب الناتج:</div>
        <div className="ezgate-sum">{a} × {b}</div>
        <input type="text" inputMode="numeric" value={answer} onChange={(e) => setAnswer(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="الجواب" autoFocus style={{ ...s.onboardingInput, textAlign: "center", borderColor: error ? "var(--a3-cyan)" : "var(--a3-line)" }} />
        {error && <div className="ezgate-err">جواب غير صحيح، حاول مرة أخرى</div>}
        <button onClick={submit} style={s.primaryBtn}>تأكيد</button>
        <button onClick={onCancel} style={s.secondaryBtn}>رجوع</button>
      </div>
    </div>
  );
}
