          const buf = await file.arrayBuffer();
          const result = await window.mammoth.extractRawText({ arrayBuffer: buf });
          extracted = (result && result.value ? result.value : '').trim();
        } catch (mErr) {
          return fail('تعذّرت قراءة ملف Word. تأكّد أنّه بصيغة ‎.docx حديثة.');
        }
        if (!extracted) return fail('لم يُعثَر على نصٍّ في ملف Word. قد يكون فارغًا أو صورًا فقط.');
        const MAXD = 100000;
        const clippedDoc = extracted.length > MAXD ? extracted.slice(0, MAXD) + '\n\n[تم اختصار بقيّة الملف]' : extracted;
        const over = attachOverBudget({ type: 'text', text: 'المستند المرفق «' + (file.name || 'ملف نصّي') + '»:\n\n' + clippedDoc }, messages, profileRef.current);
        if (over) return fail(over);
        setPendingImage({ kind: 'txt', name: file.name, media_type: 'text/plain', data: clippedDoc });
      } else if (isLegacyDoc) {
        return fail('صيغة ‎.doc القديمة غير مدعومة. الرجاء حفظه بصيغة ‎.docx ثمّ رفعه.');
      } else {
        return fail('نوع الملف غير مدعوم: ' + (rawName || 'بلا اسم') + ' | ' + (mime || 'بلا نوع'));
      }
    } catch (err) {
      return fail('تعذّرت قراءة الملف. حاول ملفًّا آخر.');
    }
    e.target.value = ''; // allow re-selecting the same file
  };

  // "Searching sources…" hint (TEXT path only). On a search question, /api/ask's round 1 is
  // non-streamed + retrieval is silent, so onDelta stays quiet for ~20-35s. This is a purely
  // CLIENT-SIDE, TIME-BASED reassurance — the client can't know from the server whether a search
  // is running (round 1 is opaque), so we use a timer, not a server signal. Cleared on the first
  // delta, on completion, on error, and on abort — never lingers.
  const clearSearchingHint = () => {
    if (searchTimerRef.current) { clearTimeout(searchTimerRef.current); searchTimerRef.current = null; }
    setSearchingSources(false);
  };

  const sendMessage = async (text) => {
    if ((!text.trim() && !pendingImage) || isLoading) return;
    // New message mid audio sequence -> cancel current audio so the new reply starts clean.
    cancelAudio();
    // Abort any in-flight stream cleanly (ties into the cancellation discipline).
    if (abortRef.current) abortRef.current.abort();
    let attachBlock = null;
    if (pendingImage) {
      if (pendingImage.kind === 'pdf') {
        attachBlock = { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: pendingImage.data } };
      } else if (pendingImage.kind === 'txt') {
        attachBlock = { type: 'text', text: 'المستند المرفق «' + (pendingImage.name || 'ملف نصّي') + '»:\n\n' + pendingImage.data };
      } else {
        attachBlock = { type: 'image', source: { type: 'base64', media_type: pendingImage.media_type, data: pendingImage.data } };
      }
    }
    const content = attachBlock
      ? [
          attachBlock,
          ...(text.trim() ? [{ type: 'text', text: text.trim() }] : [{ type: 'text', text: 'اشرح لي هذا' }]),
        ]
      : text;
    const userMsg = { role: 'user', content, timestamp: new Date().toISOString() };
    const updated = [...messages, userMsg];
    setMessages(updated);
    setInput('');
    setPendingImage(null);
    setIsLoading(true);
    setStreamingText('');
    // Sliding window: send only the last 12 messages to the API (avoids 429, fewer tokens).
    // The full `updated` stays in the UI and in localStorage for parents.
    const apiHistory = sliceHistoryForAPI(updated);
    const controller = new AbortController();
    abortRef.current = controller;
    // Arm the "searching sources…" hint: if no delta has arrived after ~4s (fast non-search
    // answers reply well before this), swap the blank dots for the reassurance text. Guarded on
    // controller ownership so a superseded send can't flip it back on.
    clearSearchingHint();
    searchTimerRef.current = setTimeout(() => {
      if (abortRef.current === controller) setSearchingSources(true);
    }, 4000);
    let reply;
    try {
      reply = await callAI(apiHistory, profile, {
        signal: controller.signal,
        // First delta = streaming has begun -> retire the searching hint and show real text.
        onDelta: (partial) => { if (abortRef.current === controller) { clearSearchingHint(); setStreamingText(partial); } },
      });
    } catch (e) {
      if (e.name === 'AbortError') {
        // Aborted (newer message, or leaving chat via the [screen] cleanup). Clear the
        // loading/typing UI so the chat isn't wedged on the dots with input/mic disabled —
        // but ONLY if this controller still owns the UI; if a newer send took over, leave it.
        // The partial reply is discarded (the assistant message is only pushed below on success).
        if (abortRef.current === controller) { clearSearchingHint(); setIsLoading(false); setStreamingText(null); }
        return;
      }
      reply = getFriendlyError('network', profile?.gender);
    }
    if (abortRef.current !== controller) return; // a newer request owns the UI — leave its state alone
    abortRef.current = null;
    clearSearchingHint();
    setStreamingText(null);
    const aiMsg = { role: 'assistant', content: reply, timestamp: new Date().toISOString() };
    const final = [...updated, aiMsg];
    setMessages(final);
    saveMessages(final);
    setIsLoading(false);
    if (voiceMode) speakReply(reply); // audio runs on the final full text — not during the stream
  };

  // ============================================================
  // Live voice-call mode (Layer 2) — ONE automatic turn
  // ============================================================
  // Reuses the existing brain (callAI + sliceHistoryForAPI + buildSystemPrompt) and audio-out
  // (speakReply / cancelAudio). A dedicated callRecognitionRef is fully isolated from the dictation
  // mic. Call onresult writes ONLY to callTranscriptRef / callHeard — never to the chat `input`.

  // ===== Layer 3: 45s inactivity auto-end (silent — no spoken goodbye) =====
  const clearInactivityTimer = () => {
    if (inactivityTimerRef.current) { clearTimeout(inactivityTimerRef.current); inactivityTimerRef.current = null; }
  };
  // Silent auto-end. setScreen('chat') fires the call useEffect cleanup, which stops rec,
  // aborts the in-flight callAI, cancels audio, and bumps callGenRef (invalidating continuations).
  const endCallSilently = () => {
    clearInactivityTimer();
    if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
    callActiveRef.current = false;
    try { callRecognitionRef.current?.stop(); } catch (e) {}
    if (abortRef.current) { try { abortRef.current.abort(); } catch (e) {} }
    cancelAudio();
    setScreen('chat');
  };
  // (Re)start the 45s idle clock. Armed on a FRESH listening turn and on detected speech only —
  // NOT on the silence self-close re-arm (that passes armIdleClock=false), so genuine silence
  // accumulates toward the 45s end instead of resetting on every engine self-close.
  const armInactivityTimer = () => {
    // The idle clock runs ONLY while we are actually listening. A late SR result arriving during
    // thinking/playback used to re-arm it, and 45s later it exited the call MID-ANSWER.
    if (!callActiveRef.current) return;
    clearInactivityTimer();
    const genAtArm = callGenRef.current;
    inactivityTimerRef.current = setTimeout(() => {
      if (callGenRef.current !== genAtArm) return; // call ended/changed → bail
      endCallSilently();
    }, 45000);
  };

  // Start (or re-arm) a listen turn. armIdleClock=true resets the 45s idle clock (a fresh turn);
  // the silence self-close re-arm passes false so silence keeps counting toward the auto-end.
  const startCallListening = (armIdleClock = true) => {
    if (callMutedRef.current) return; // muted = do not listen
    if (childVoiceBlocked()) return; // غ‑٣: مقفول ⇒ لا فتحَ ميكروفونٍ (صامت — التنبيهُ يظهر بدل الشاشة)
    if (!hasFounderToken()) return; // directive 82: no unlock token => the mic never opens
    if (CALL_STT_CLOUD) {
      callTranscriptRef.current = '';
      callBaseTextRef.current = '';
      setCallHeard('');
      callActiveRef.current = true;
      setCallState('listening');
      startCloudListening();
      if (armIdleClock) armInactivityTimer();
      return;
    }
    const rec = callRecognitionRef.current;
    if (!rec) return;
    callTranscriptRef.current = '';
    callBaseTextRef.current = '';
    setCallHeard('');
    callActiveRef.current = true;
    setCallState('listening');
    try {
      rec.start();
      if (CALL_VAD) { vadLastVoiceRef.current = Date.now(); ensureVad(); }
      if (armIdleClock) armInactivityTimer();
    } catch (e) { callActiveRef.current = false; setCallState('idle'); }
  };

  // End the active listen turn and route it to the brain. Guarded so the silence timer and
  // recognition.onend can never both fire a turn (double-send guard via callActiveRef).
  const endCallTurnNow = () => {
    if (!callActiveRef.current) return;
    callActiveRef.current = false;
    if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
    try { callRecognitionRef.current?.stop(); } catch (e) {}
    const text = collapseRepeats((callBaseTextRef.current + ' ' + callTranscriptRef.current).trim());
    if (!text) { setCallState('idle'); return; } // never send an empty turn
    if (callTurnRef.current) callTurnRef.current(text);
  };

  // One full call turn — mirrors sendMessage exactly: pushes the same user+assistant messages to
  // the SHARED messages array (so the Q&A shows in chat history and guardrails are identical), then
  // speaks the reply via the existing speakReply(). No setInput, no streamingText bubble.
  const runCallTurn = async (text) => {
    const myGen = callGenRef.current; // capture the call session; re-arm after playback only if still valid
    setCallHeard('');
    setCallState('thinking');
    clearInactivityTimer(); // child is engaged (thinking/speaking) — pause the idle clock
    cancelAudio();
    if (abortRef.current) abortRef.current.abort();
    const userMsg = { role: 'user', content: text, timestamp: new Date().toISOString() };
    const updated = [...messages, userMsg];
    // Do NOT commit the user msg to messages here. It is written together with the reply on
    // success (final = [...updated, aiMsg]). So an interrupted/superseded turn leaves NO orphan
    // user message -> fixes empty-reply-in-transcript AND the abandoned-question-answered-later bug.
    const apiHistory = sliceHistoryForAPI(updated);
    const controller = new AbortController();
    abortRef.current = controller;
    let reply;
    let callStream = null; // CALL_STREAM_SPEECH: lazily-created streaming session (off -> stays null; classic speakReply used)
    try {
      reply = await callAI(apiHistory, profile, {
        signal: controller.signal, mode: 'call',
        ...(CALL_STREAM_SPEECH ? { onDelta: (full) => { if (abortRef.current !== controller) return; if (!callStream) { callStream = createCallSpeechStream(); setCallState('speaking'); } callStream.feed(full); } } : {}),
      });
    } catch (e) {
      if (e.name === 'AbortError') return; // exited mid-turn — do not write state
      reply = getFriendlyError('network', profile?.gender);
    }
    if (abortRef.current !== controller) return; // superseded or call exited
    abortRef.current = null;
    const aiMsg = { role: 'assistant', content: reply, timestamp: new Date().toISOString() };
    const final = [...updated, aiMsg];
    setMessages(final);
    saveMessages(final);
    setCallState('speaking');
    if (CALL_STREAM_SPEECH && callStream) await callStream.finish(reply); // stream: flush remainder + await playback drain (same completion contract)
    else await speakReply(reply); // completion hook -- resolves when playback fully finishes
    // Layer 3 guarded auto-rearm. speakReply cannot reject and resolves only after playback ends.
    if (callGenRef.current !== myGen) return;                   // End/exit or session change during playback → do NOT re-arm
    if (callActiveRef.current) return;                          // a manual interrupt already re-opened the mic → don't double-arm
    if (callMutedRef.current) { setCallState('idle'); return; } // muted → idle; user re-arms manually
    if (childVoiceBlocked()) { setCallState('idle'); return; }   // غ‑٣: لا إعادةَ تسليحٍ بعد الحجب
    startCallListening();                                       // continuous: reopen the mic for the next turn
  };

  // Keep callTurnRef pointing at the latest runCallTurn so the (once-created) SR handlers always
  // see the current messages/profile rather than a stale closure.
  useEffect(() => { callTurnRef.current = runCallTurn; });

  // Mute toggle — actually gates the mic: muted = stop/suppress listening (not just visual).
  const toggleCallMute = () => {
    setIsCallMuted((m) => {
      const next = !m;
      callMutedRef.current = next;
      if (next) {
        callActiveRef.current = false;
        if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
        clearInactivityTimer(); // leaving listening (muted) — stop the idle clock; user re-arms manually
        try { callRecognitionRef.current?.stop(); } catch (e) {}
        if (CALL_STT_CLOUD) stopCloudAll(); // mute must STOP capturing, not merely ignore the audio
        setCallState((csNow) => (csNow === 'listening' ? 'idle' : csNow));
      }
      return next;
    });
  };

  // Avatar tap = "my turn". Layer 3 makes it state-aware: it is the manual interrupt (no voice
  // barge-in). Tapping during think/speak cancels the tutor and opens the mic; from idle it starts.
  const onCallTalk = () => {
    if (callMutedRef.current) return;
    if (callState === 'thinking' || callState === 'speaking') {
      // Manual interrupt: cancel the in-flight turn + tutor audio, then open the mic for the child.
      if (abortRef.current) abortRef.current.abort(); // thinking: aborts callAI -> runCallTurn bails at the AbortError guard (before re-arm)
      cancelAudio();                                  // speaking: stops playback (speakReply resolves; EDIT-A re-arm suppressed by its callActiveRef guard)
      startCallListening();
      return;
    }
    if (callState === 'idle') startCallListening();
    // 'listening' → no-op (unchanged from Layer 2)
  };

  // Call-screen lifecycle: create/tear down the dedicated recognition with the call screen.
  // On entry: force the dictation mic OFF and stop any audio so the two can never fight.
  // On exit: stop recognition, clear the timer, abort any in-flight turn, and stop audio.
  useEffect(() => {
    if (screen !== 'call') return;
    if (childVoiceBlocked()) return; // غ‑٣: لا يُبنى معرِّفُ كلامٍ أصلاً — الرسمُ يعرض التنبيهَ بدل الشاشة
    if (!hasFounderToken()) return; // directive 82: no token => the call session is never built
    callGenRef.current++; // ENTER: open a new call session (invalidates any stale continuation)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setVoiceError('🚫 متصفحك لا يدعم التعرف على الصوت. استخدم Chrome أو Safari.');
      setTimeout(() => setVoiceError(''), 6000);
      return;
    }
    // Force the dictation mic off (never modify it — just ensure it is not running).
    shouldListenRef.current = false;
    try { recognitionRef.current?.stop(); } catch (e) {}
    cancelAudio();
    callActiveRef.current = false;
    callTranscriptRef.current = '';
    setCallHeard('');
    setCallState('idle');

    const rec = new SR();
    rec.lang = 'ar-SA';
    rec.continuous = true;       // interim events keep resetting the silence timer (smoother end-of-turn)
    rec.interimResults = true;
    rec.onresult = (event) => {
      // This ar-SA engine emits multiple isFinal results where each later final RE-INCLUDES the
      // earlier final text (cumulative restatement), so concatenating all finals double-counts.
      // Merge instead: a final that extends what we have (starts with the accumulated text) REPLACES
      // it; a final already covered is skipped; only a genuinely new (non-overlapping) final is
      // appended. Correct for this cumulative engine AND standard segmented engines.
      let finalText = '', interim = '';
      for (let i = 0; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          const seg = t.trim();
          if (!seg) continue;
          if (!finalText) finalText = seg;
          else if (seg.startsWith(finalText)) finalText = seg;        // cumulative restatement -> replace
          else if (finalText.startsWith(seg)) { /* shorter prefix already covered -> skip */ }
          else finalText = finalText + ' ' + seg;                     // genuine new segment -> append
        } else {
          interim += t;
        }
      }
      callTranscriptRef.current = finalText;
      setCallHeard((finalText + interim).trim()); // feedback only — NEVER setInput
      // Layer 3: actual speech this event → child present → reset the 45s idle clock.
      if ((finalText + interim).trim()) armInactivityTimer();
      // Reset the end-of-turn debounce on any speech activity.
      if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
      silenceTimerRef.current = setTimeout(() => {
        // Fire only with a non-empty transcript; silence on an empty turn keeps listening.
        if (callActiveRef.current && (callBaseTextRef.current + callTranscriptRef.current).trim()) endCallTurnNow();
      }, vadOkRef.current ? 86400000 : CALL_SILENCE_MS);
    };
    rec.onend = () => {
      // Chrome owns onend and fires it on its own schedule (short Arabic pauses, engine timeouts).
      // It must NEVER end a turn: doing so shipped truncated questions to the model.
      // The CLIENT-OWNED silence timer is the SOLE turn-ender. onend only RESTARTS the recognizer,
      // carrying this session's transcript into callBaseTextRef first (the proven dictation pattern).
      if (!callActiveRef.current) return;                  // turn already ended, or call exited
      if (childVoiceBlocked()) {                         // غ‑٣: لا إعادةَ تشغيلٍ بعد الحجب — أوقفِ الحلقة
        callActiveRef.current = false;
        setCallState('idle');
        return;
      }
      callBaseTextRef.current = (callBaseTextRef.current + ' ' + callTranscriptRef.current).trim();
      callTranscriptRef.current = '';                      // new SR session => results[] restarts at 0
      // RESTART-GAP GUARD: the recognizer is DEAF between sessions, so that window must not be
      // counted as user silence. Re-arm the silence timer here with a longer grace deadline;
      // the first onresult of the new session restores the normal CALL_SILENCE_MS cadence.
      // The timer still SURVIVES the restart and stays the sole turn-ender - it only gets a fair
      // deadline instead of counting a window in which nobody could have been heard.
      if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
      silenceTimerRef.current = setTimeout(() => {
        if (callActiveRef.current && (callBaseTextRef.current + callTranscriptRef.current).trim()) endCallTurnNow();
      }, vadOkRef.current ? 86400000 : CALL_RESTART_GRACE_MS);
      const genAtEnd = callGenRef.current;
      const tryStart = (attempt) => {
        if (childVoiceBlocked()) return;                 // غ‑٣: الحجبُ يقطع محاولاتِ إعادةِ التشغيل الخمس
        if (callGenRef.current !== genAtEnd) return;       // call ended/changed
        if (!callActiveRef.current) return;                // turn ended during the gap
        try { rec.start(); }
        catch (e) { if (attempt < 5) setTimeout(() => tryStart(attempt + 1), 150); }  // never leave the mic dead
      };
      setTimeout(() => tryStart(0), 120);
    };
    rec.onerror = (event) => {
      if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
      callActiveRef.current = false;
      setCallState('idle');
      const fatal = ['not-allowed', 'audio-capture', 'service-not-allowed'];
      if (fatal.includes(event.error)) {
        setVoiceError('🚫 لم يُمنح إذن الميكروفون.');
        setTimeout(() => setVoiceError(''), 6000);
      }
    };
    callRecognitionRef.current = rec;
    startCallListening();    // child just enters and talks - no button

    return () => {
      callGenRef.current++; // EXIT: invalidate every in-flight continuation (re-arm / backoff / inactivity)
      callActiveRef.current = false;
      if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
      clearInactivityTimer();
      try { rec.onresult = null; rec.onend = null; rec.onerror = null; rec.stop(); } catch (e) {}
      callRecognitionRef.current = null;
      if (abortRef.current) { try { abortRef.current.abort(); } catch (e) {} }
      cancelAudio();
      callMutedRef.current = false;
      setIsCallMuted(false);
      setCallHeard('');
      setCallState('idle');
    };
  }, [screen]);

  // Toggle the parental direct-conversation lock. Locking writes 'true'; unlocking REMOVES the key
  // (absence = allowed default — we never persist 'false').
  const toggleDirectConvoLock = () => setDirectConvoLocked(prev => {
    const next = !prev;
    try { if (next) localStorage.setItem('directConvoLocked', 'true'); else localStorage.removeItem('directConvoLocked'); } catch (e) {}
    return next;
  });

  const resetAll = () => {
    if (confirm('هل أنت متأكد من حذف كل البيانات؟')) {
      localStorage.removeItem('child_profile');
      localStorage.removeItem('messages');
      localStorage.removeItem('directConvoLocked');
      localStorage.removeItem(MUSHAF_BOOKMARK_KEY);
      localStorage.removeItem('mushaf_pos_v1');   // Session 51 -- one-shot sweep of the pre-bookmark name
      // Session 82 -- the three device-local mushaf keys go with everything else. "Delete all
      // my data" has to mean the last page, the daily target and today's progress too.
      localStorage.removeItem(MUSHAF_LAST_PAGE_KEY);
      localStorage.removeItem(WIRD_TARGET_KEY);
      localStorage.removeItem(WIRD_DAY_KEY);
      // Session 84 -- the three device-local adhkar keys, added to this list and to nothing
      // else. "Delete all my data" has to mean today's counters, the favourite identifiers
      // and the per-category open counts too. Three removals; no other reset behaviour moves.
      localStorage.removeItem(ADHKAR_PROGRESS_KEY);
      localStorage.removeItem(ADHKAR_FAVORITES_KEY);
      localStorage.removeItem(ADHKAR_USAGE_KEY);
      setDirectConvoLocked(false);
      setProfile(null);
      voiceProfileRef.current = null;           // غ‑٣: حذفُ البيانات يُعيد الحاجزَ إلى المقفول
      setMessages([]);
      setScreen('onboarding');
    }
  };

  // First-run disclosure (step 4a). Shown once to anyone who has NOT acknowledged yet -- keyed on
  // the independent `disclosureAck`, NOT on profile age, so existing profiled users see it too and
  // nobody is wiped or forced to re-onboard. Gated on `profile` so it lands at the END of onboarding
  // (right after the profile is created), before entering -- never over the onboarding form itself.
  if (profile && !disclosureAck) return <DisclosureGate onAck={ackDisclosure} />;
  if (screen === 'loading') return <div style={s.loadingScreen}><div style={s.loadingSpinner}>✨</div></div>;
  if (screen === 'onboarding') return <Onboarding onStart={startChat} />;
  // قفل الإنفاق: المطالبة تظهر فقط أمام الشاشتين اللتين تُنفقان (المحادثة/المكالمة) وحين يكون القفل مفعّلاً وغير مفتوح.
  // القفل المُعطَّل (٦٤ صفراً) ⇒ spendGateOpenState=true دائماً ⇒ لا تظهر هذه السطر أبداً. أما 0b (المصحف/المحفّظ/الأذكار) فتبقى مفتوحة.
  if ((screen === 'chat' || screen === 'call') && !spendGateOpenState) return <SpendGate onUnlock={unlockSpendGate} onExit={() => setScreen('home')} />;
  if (screen === 'home') return <Home profile={profile} onOpenChat={() => setScreen('chat')} onOpenMemorize={() => setScreen('memorize')} onOpenAdhkar={() => setScreen('adhkar')} onOpenMushaf={() => setScreen('mushaf')} onOpenSettings={() => setScreen('parentGate')} />;
  if (screen === 'parentGate') return <ParentGate pinInput={pinInput} setPinInput={setPinInput} pinError={pinError} setPinError={setPinError} onSuccess={() => { setPinInput(''); setPinError(false); setScreen('parentDashboard'); }} onBack={() => { setPinInput(''); setPinError(false); setScreen('chat'); }} />;
  if (screen === 'parentDashboard') return <ParentDashboard profile={profile} messages={messages} onBack={() => setScreen('chat')} onReset={resetAll} directConvoLocked={directConvoLocked} onToggleDirectConvo={toggleDirectConvoLock} />;
  // D88: the settings sheet. Reached from the drawer's gear only; the drawer's PROFILE entry
  // keeps the ParentGate wiring it had, because no profile screen exists to send it to.
  if (screen === 'settings') return <SettingsSheet theme={theme} onTheme={chooseTheme} onBack={() => setScreen('chat')} />;
  // غ‑٣: ملفُّ طفلٍ (أو ملفٌّ يتعذّر تحديدُه) لا يدخل شاشةَ المكالمة — يُعرَض التنبيهُ ومعه طريقُ رجوع.
  if (screen === 'call' && childVoiceBlocked()) return <ChildVoiceNotice onBack={() => setScreen('chat')} />;
  // CALL UNLOCK (directive 82). Sits at the SCREEN transition, immediately AFTER the child
  // barrier above, so a child profile always gets the notice and is never shown a PIN sheet.
  // This decides only what is DISPLAYED; the mic itself is held shut by the guards inside
  // startCallListening and the call useEffect, because that effect runs on [screen] whatever
  // this chain renders -- a screen that mounts unlocked would otherwise be a mic that opens.
  if (screen === 'call' && !hasFounderToken()) return <UnlockSheet onUnlocked={() => setFounderUnlocked(true)} onBack={() => setScreen('chat')} />;
  if (screen === 'call') return <CallScreen profileName={profile?.name} gender={profile?.gender} callState={callState} heard={callHeard} isMuted={isCallMuted} onToggleMute={toggleCallMute} onTalk={onCallTalk} onExit={() => setScreen('chat')} />;
  // المحفّظ — full screen (mirrors CallScreen). Quran playback reuses the App-scoped manual
  // entry points (playVerseManual/playSurahManual) passed down as props; no new audio code.
  if (screen === 'memorize') return <MemorizeScreen profile={profile} onExit={() => setScreen('home')} onPlayVerse={playVerseManual} onPlaySurah={playSurahManual} onStopAudio={cancelAudio} />;
  if (screen === 'mushaf') return <MushafScreen selected={selectedSurah} setSelected={setSelectedSurah} onBack={() => { setSelectedSurah(null); setScreen('home'); }} onPlaySurah={playSurahManual} onStopAudio={cancelAudio} />;
  if (screen === 'adhkar') return <AdhkarScreen onBack={() => setScreen('home')} />;

  // Single-source capability flags for the chat UI. `directConvoAllowed` layers the parental lock
  // on top of the band: young is allowed unless the parent explicitly locked it; teen/adult always
  // allowed (the lock does not apply to them).
  const caps = deriveCaps(profile?.age);
  const directConvoAllowed = caps.band === 'young' ? !directConvoLocked : true;

  // Report button (step 2b). Opens the flag modal for a given assistant reply, capturing the
  // user question that preceded it (messages[i-1]) for context. Client only -- POSTs to api/report.
  const openReport = (aiMsg, prevMsg) => {
    const aiText = aiMsg && typeof aiMsg.content === 'string' ? aiMsg.content : '';
    let userText = '';
    if (prevMsg && prevMsg.role === 'user') {
      const c = prevMsg.content;
      if (typeof c === 'string') userText = c;
      else if (Array.isArray(c)) { const t = c.find(b => b && b.type === 'text'); userText = t ? t.text : ''; }
    }
    setReportFor({ ai: aiText, user: userText });
  };
  // The size guard MEASURES real UTF-8 bytes and halves ai then user until the body is under
  // 20000 bytes -- comfortably below the server 21812-byte cap -- so a 413 is structurally
  // impossible, not merely unlikely. It never assumes "1 char = 2 bytes". Returns ok|rate|fail;
  // the modal maps those to messages that NEVER claim success on anything but a real 200.
  const submitReport = async (reason, note) => {
    const R = reportFor || {};
    let a = (typeof R.ai === 'string' ? R.ai : '').slice(0, 3500);
    let u = (typeof R.user === 'string' ? R.user : '').slice(0, 3500);
    const enc = new TextEncoder();
    const build = () => JSON.stringify({ reason, note: (note || '').slice(0, 500), ai: a, user: u, band: caps.band, mode: 'chat' });
    let body = build();
    let n = 0;
    while (enc.encode(body).length > 20000 && n < 40) {
      if (n % 2 === 0) a = a.slice(0, Math.floor(a.length / 2));
      else u = u.slice(0, Math.floor(u.length / 2));
      body = build();
      n++;
    }
    try {
      const resp = await fetch('/api/report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
      if (resp.status === 200) return 'ok';
      if (resp.status === 429) return 'rate';
      return 'fail';
    } catch (e) {
      return 'fail';
    }
  };

  // D85: "new chat" -- returns the thread to the empty state. It stops anything in flight
  // (a streaming reply, playing audio) and clears the composer too, so nothing survives it.
  const newChat = () => {
    try { abortRef.current?.abort(); } catch (e) {}
    abortRef.current = null;
    cancelAudio();
    setMessages([]);
    saveMessages([]);
    setStreamingText(null);
    setIsLoading(false);
    setInput('');
    setPendingImage(null);
    setDrawerOpen(false);
  };

  return (
    <div className="theme-dark" style={s.chatContainer}>
      {/* D85: the chat top bar carries exactly ONE control -- the drawer menu. The old home,
          call, speaker and lock buttons are gone. Per-reply audio already sits beneath every
          reply, so the header speaker was redundant; the other three moved into the drawer
          (القائمة and the pinned profile/settings row). */}
      <div style={s.header}>
        <button onClick={() => setDrawerOpen(true)} style={s.settingsBtn} aria-label={'\u0641\u062a\u062d \u0627\u0644\u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u062c\u0627\u0646\u0628\u064a\u0629'}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--on-accent)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
      </div>

      <div style={s.messagesArea}>
        {messages.map((m, i) => <MessageBubble key={i} tashkeel={tashkeelOn} onToggleTashkeel={toggleTashkeel} message={m} onSuggestionClick={(sg) => sendMessage(sg)} onPlayVerse={playVerseManual} onPlaySurah={playSurahManual} onStopAudio={cancelAudio} onPlayMessage={(t) => speakReply(t)} age={profile?.age} onReport={() => openReport(m, i > 0 ? messages[i - 1] : null)} />)}
        {streamingText !== null && (
          <div style={{ ...s.messageBubble, ...s.assistantBubble, alignSelf: 'flex-end' }}>
            {formatForStreamPreview(streamingText)
              ? <div style={s.bubbleText}>{formatForStreamPreview(streamingText)}</div>
              : searchingSources
                ? <div style={s.searchingHint}>
                    <span>يبحث في المصادر…</span>
                    <span style={s.dot}>●</span>
                    <span style={{ ...s.dot, animationDelay: '0.2s' }}>●</span>
                    <span style={{ ...s.dot, animationDelay: '0.4s' }}>●</span>
                  </div>
                : <div style={s.typingDots}>
                    <span style={s.dot}>●</span>
                    <span style={{ ...s.dot, animationDelay: '0.2s' }}>●</span>
                    <span style={{ ...s.dot, animationDelay: '0.4s' }}>●</span>
                  </div>}
          </div>
        )}
        <div ref={messagesEndRef} />
      </div>

      {voiceError && <div style={s.errorBanner}>{voiceError}</div>}

      {pendingImage && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 10px' }}>
          {(pendingImage.kind === 'image' || pendingImage.kind === undefined) ? (
            <img src={`data:${pendingImage.media_type};base64,${pendingImage.data}`} style={{ height: 56, borderRadius: 8, border: '1px solid var(--line)' }} />
          ) : (
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '6px 10px', borderRadius: 8, border: '1px solid var(--line)', background: 'var(--tint)', fontSize: 14 }}>
              <span>📄</span>
              <span>{pendingImage.name}</span>
              <span style={{ color: 'var(--muted)', fontSize: 12 }}>{pendingImage.kind === 'pdf' ? 'PDF' : 'نصّ'}</span>
            </span>
          )}
          <button onClick={() => setPendingImage(null)} style={{ background: 'none', border: 'none', color: '#C44536', fontSize: 18, cursor: 'pointer' }} aria-label="إزالة الصورة">×</button>
        </div>
      )}
      <div style={s.inputBar}>
        <textarea
          ref={inputElRef}
          rows={1}
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.style.height = 'auto'; sendMessage(input); } }}
          style={s.input}
          disabled={isLoading || isListening}
        />
        <button onClick={() => sendMessage(input)} disabled={isLoading || (!input.trim() && !pendingImage)} style={{ ...s.sendBtn, opacity: isLoading || !input.trim() ? 0.4 : 1 }}>
          <SendIcon size={20} color="var(--on-accent)" />
        </button>
      </div>

      {/* D87: the tool row -- ONE line beneath the composer. The page is RTL, so the first
          group paints at the RIGHT ([+] then the model selector) and the second at the LEFT
          (mic then live call). Nothing here is new machinery. The [+] drives the SAME two
          hidden file inputs and the SAME onPickImage that already shipped. The selector is the
          SAME depthMode cycle and opens the SAME UnlockSheet through unlockAsk -- there is no
          second PIN surface. The mic is the SAME startListening/stopListening, untouched. The
          call button only sets the screen: the EXISTING screen chain then applies the child
          barrier FIRST and the founder token SECOND, so a child gets the notice and is never
          offered the PIN sheet. */}
      {/* image-only input */}
      <input ref={fileInputRef} type="file" accept="image/*" onChange={onPickImage} style={{ display: 'none' }} />
      {/* document input (PDF / TXT) */}
      <input ref={docInputRef} type="file" accept=".pdf,application/pdf,.txt,text/plain,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onChange={onPickImage} style={{ display: 'none' }} />
      <div style={s.toolBar}>
        <div style={s.toolGroup}>
          {caps.upload && (
          <div style={{ position: 'relative', display: 'inline-flex' }}>
            {attachMenuOpen && (
              <>
                {/* backdrop: closes menu on outside click */}
                <div onClick={() => setAttachMenuOpen(false)} style={{ position: 'fixed', inset: 0, zIndex: 40 }} />
                {/* menu: opens above the button (the tool row is at the bottom) */}
                <div style={{ position: 'absolute', bottom: '120%', right: 0, zIndex: 41, background: 'var(--white)', border: '1px solid var(--line)', borderRadius: 12, boxShadow: '0 6px 20px rgba(0,0,0,0.14)', padding: 6, minWidth: 168, display: 'flex', flexDirection: 'column', gap: 2 }}>
                  <button
                    onClick={() => { setAttachMenuOpen(false); if (fileInputRef.current) fileInputRef.current.click(); }}
                    style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: 'none', border: 'none', borderRadius: 8, cursor: 'pointer', fontSize: 15, color: 'var(--ink)', width: '100%', textAlign: 'right' }}
                  >
                    <span style={{ fontSize: 18 }}>{'\uD83D\uDDBC\uFE0F'}</span><span>{'\u0635\u0648\u0631\u0629'}</span>
                  </button>
                  <button
                    onClick={() => { setAttachMenuOpen(false); if (docInputRef.current) docInputRef.current.click(); }}
                    style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: 'none', border: 'none', borderRadius: 8, cursor: 'pointer', fontSize: 15, color: 'var(--ink)', width: '100%', textAlign: 'right' }}
                  >
                    <span style={{ fontSize: 18 }}>{'\uD83D\uDCC4'}</span><span>{'\u0645\u0644\u0641'}</span>
                  </button>
                </div>
              </>
            )}
            <button
              onClick={() => setAttachMenuOpen(v => !v)}
              disabled={isLoading || isListening}
              style={{ ...s.toolBtn, opacity: (isLoading || isListening) ? 0.4 : 1 }}
              aria-label={'\u0625\u0631\u0641\u0627\u0642 \u0645\u0644\u0641 \u0623\u0648 \u0635\u0648\u0631\u0629'}
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--red)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
          )}
          {/* Model selector. RENDERED FOR EVERY BAND so موجز is always available; the two deep
              tiers keep their EXISTING 18+ visibility -- a non-adult sees the chip fixed on
              موجز and cannot cycle into them. For an adult the cycle is byte-for-byte the
              one that shipped, including the UnlockSheet hand-off through setUnlockAsk. */}
          <button
            onClick={() => {
              if (caps.band !== 'adult') return;                  // 18+ visibility on the deep tiers is unchanged
              const next = depthMode === 'brief' ? 'detailed' : depthMode === 'detailed' ? (SCHOLAR_ENABLED ? 'scholar' : 'brief') : 'brief';
              // The two deep tiers additionally require the unlock token to be SELECTED. This is
              // not the lock: api/ask.js drops an unearned depth server-side no matter what the
              // UI does. It only stops a user selecting a tier that would silently do nothing.
              if ((next === 'detailed' || next === 'scholar') && !hasFounderToken()) { setUnlockAsk(next); return; }
              setDepthMode(next);
            }}
            disabled={isLoading || caps.band !== 'adult'}
            title={caps.band === 'adult' ? '\u0627\u0636\u063a\u0637 \u0644\u062a\u063a\u064a\u064a\u0631 \u0627\u0644\u0639\u0645\u0642 \u0627\u0644\u0645\u0639\u0631\u0641\u064a' : undefined}
            aria-label={depthMode === 'brief' ? '\u0645\u0648\u062c\u0632' : depthMode === 'detailed' ? '\u0645\u0641\u0635\u0651\u0644' : '\u0637\u0627\u0644\u0628 \u0627\u0644\u0639\u0644\u0645'}
            style={{
              ...s.sendBtn,
              background: depthMode === 'brief' ? 'var(--tint)' : depthMode === 'detailed' ? 'var(--red)' : 'var(--scholar)',
              opacity: isLoading ? 0.4 : 1,
              cursor: caps.band === 'adult' ? 'pointer' : 'default',
              fontSize: 13,
              fontWeight: 700,
              color: depthMode === 'brief' ? 'var(--red)' : 'var(--white)',
              minWidth: 52,
              whiteSpace: 'nowrap',
              paddingInline: 10,
            }}
          >
            {depthMode === 'brief' ? '\u0645\u0648\u062c\u0632' : depthMode === 'detailed' ? '\u0645\u0641\u0635\u0651\u0644' : '\u0637\u0627\u0644\u0628 \u0627\u0644\u0639\u0644\u0645'}
          </button>
        </div>
        <div style={s.toolGroup}>
          <button
            onClick={isListening ? stopListening : startListening}
            disabled={isLoading}
            aria-label={'\u0625\u0645\u0644\u0627\u0621 \u0635\u0648\u062a\u064a'}
            style={{
              ...s.micBtn,
              background: isListening ? 'linear-gradient(135deg, #C44536 0%, #A03828 100%)' : 'var(--tint)',
              animation: isListening ? 'pulse 1.2s ease-in-out infinite' : 'none',
              opacity: isLoading ? 0.4 : 1,
            }}
          >
            {isListening ? <MicOffIcon size={20} color="var(--on-accent)" /> : <MicIcon size={20} color="var(--red)" />}
          </button>
          {/* Live call -- the entry D85 removed, restored here. It sets the screen and NOTHING
              else, which is precisely how the guard ORDER is preserved: the screen chain runs
              childVoiceBlocked() -> ChildVoiceNotice BEFORE hasFounderToken() -> UnlockSheet.
              directConvoAllowed is the parental lock that wrapped this button before D85. */}
          {directConvoAllowed && (
          <button
            onClick={() => setScreen('call')}
            disabled={isLoading || isListening}
            aria-label={'\u0645\u0643\u0627\u0644\u0645\u0629 \u0635\u0648\u062a\u064a\u0629 \u0645\u0628\u0627\u0634\u0631\u0629'}
            style={{ ...s.toolBtn, opacity: (isLoading || isListening) ? 0.4 : 1 }}
          >
            <PhoneCallIcon size={20} color="var(--red)" />
          </button>
          )}
        </div>
      </div>
      <div style={{ textAlign: 'center', padding: '0 16px 10px', fontSize: 11, lineHeight: 1.5, color: 'var(--muted)' }}>عزك ذكاءٌ اصطناعيّ وقد يُخطئ — راجِعْ ما يهمُّك مع والديك أو مع أهل العلم.</div>
      {/* D85: the drawer. Order is fixed: new chat, القائمة (the existing home screen -- the
          mushaf, the adhkar, the memorizer and the quest are all reached from there), then the
          profile entry pinned at the bottom with settings beside it. Both pinned entries open the
          account area the home screen already opens (الحساب / الإعدادات both call it today).
          The theme settings screen is phase C and is deliberately not built here. */}
      {drawerOpen && (
        <>
          <div onClick={() => setDrawerOpen(false)} style={s.drawerOverlay} />
          <div style={s.drawerPanel} role="dialog" aria-modal="true">
            <div style={s.drawerTop}>
              <button onClick={newChat} style={s.drawerItem}>
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M21 11.5a8.5 8.5 0 0 1-11.8 7.8L3 21l1.7-6.2A8.5 8.5 0 1 1 21 11.5z" />
                  <line x1="12" y1="8" x2="12" y2="14" />
                  <line x1="9" y1="11" x2="15" y2="11" />
                </svg>
                <span>{'\u0645\u062d\u0627\u062f\u062b\u0629 \u062c\u062f\u064a\u062f\u0629'}</span>
              </button>
              <button onClick={() => { setDrawerOpen(false); setScreen('home'); }} style={s.drawerItem}>
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="3" y1="6" x2="21" y2="6" />
                  <line x1="3" y1="12" x2="21" y2="12" />
                  <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
                <span>{'\u0627\u0644\u0642\u0627\u0626\u0645\u0629'}</span>
              </button>
            </div>
            <div style={s.drawerPinned}>
              <button onClick={() => { setDrawerOpen(false); setScreen('parentGate'); }} style={s.drawerProfile}>
                <span style={s.drawerAvatar}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--on-accent)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-6 8-6s8 2 8 6" /></svg>
                </span>
                <span style={s.drawerProfileName}>{profile?.name}</span>
              </button>
              <button onClick={() => { setDrawerOpen(false); setScreen('settings'); }} style={s.drawerGear} aria-label={'\u0627\u0644\u0625\u0639\u062f\u0627\u062f\u0627\u062a'}>
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2" /></svg>
              </button>
            </div>
          </div>
        </>
      )}
      {reportFor && <ReportModal onClose={() => setReportFor(null)} onSubmit={submitReport} />}
      {unlockAsk && <UnlockSheet onUnlocked={() => { setFounderUnlocked(true); setDepthMode(unlockAsk); setUnlockAsk(null); }} onBack={() => setUnlockAsk(null)} />}
    </div>
  );
}

// Per-message listen button (opt-in TTS). Mirrors VerseCard's play/stop pattern:
// local `playing` state; unified App audio via onPlayMessage (speakReply), which
// resolves when playback ends or is cancelled; onStopAudio (cancelAudio) stops it.
// The reply is spoken through the SAME pipeline (formatForTTS -> smart tashkeel
// skip -> tts), so the shipped audio rate-limit governs it. Verses inside the
// reply are recited by the reciter exactly as in the old auto-play path.
function MessageListenButton({ text, onPlayMessage, onStopAudio }) {
  const [playing, setPlaying] = useState(false);
  if (!text || !onPlayMessage) return null;
  const toggle = () => {
    if (playing) { if (onStopAudio) onStopAudio(); setPlaying(false); return; }
    setPlaying(true);
    Promise.resolve(onPlayMessage(text))
      .then(() => setPlaying(false))
      .catch(() => setPlaying(false));
  };
  return (
    <button
      type="button"
      onClick={toggle}
      aria-label={playing ? 'إيقاف الصوت' : 'استمع للرد'}
      style={{ display: 'inline-flex', alignItems: 'center', gap: 5, background: 'transparent', color: 'var(--red)', border: '1px solid var(--line)', borderRadius: 8, padding: '4px 10px', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}
    >
      {playing ? <PauseIcon size={13} /> : <PlayIcon size={13} />}
      <span>{playing ? 'إيقاف' : 'استمع'}</span>
    </button>
  );
}

// ============================================================
// D90 -- plain-text serialization of a reply, for the copy button.
// ============================================================
// MessageBubble renders ONE component per segment type. This table produces ONE plain-text form
// per segment type, from the SAME segment objects and the SAME stores those cards read -- so the
// clipboard carries what is on the screen, in display order. It renders nothing and changes no
// component; it is a serializer only.
//
// TASHKEEL: the toggle touches PROSE ONLY. MessageBubble applies stripTashkeelOutsideQuran to
// seg.type==='text' and to NOTHING else -- every card body is drawn verbatim. So card bodies are
// copied verbatim too. Stripping an ayah or a hadith here would put on the clipboard something
// that was never on the screen, and would strip harakat from canonical scripture, which
// stripTashkeelOutsideQuran only protects when it is wrapped in U+FD3F..U+FD3E ornaments.
//
// ASYNC BODIES: verse/surah/dhikr/worship segments carry no text of their own -- their cards
// resolve it from the canonical stores after a fetch. We read the SAME module caches through the
// SAME accessors (getVerseText / __adhkarData / __worshipData). A cache not yet filled means the
// card is not showing that text either, so the body is omitted and what IS on screen is copied.
// A verse's seg.content -- the MODEL's wording -- is deliberately never used, exactly as
// VerseCard never uses it.
const REPLY_LINE = (parts) => parts.filter((x) => x && String(x).trim()).join('\n');
const REPLY_SERIALIZERS = {
  text: (sg, ctx) => (ctx.tashkeel ? sg.content : stripTashkeelOutsideQuran(sg.content)),
  verse: (sg) => {
    const sNum = resolveSurahNumber(sg.surah, sg.surahNum);
    const aNum = parseInt(sg.ayah, 10);
    const surahName = sg.surah || (sNum ? SURAH_NAMES[sNum] : '');
    const body = (sNum && aNum >= 1) ? getVerseText(sNum, aNum) : null;   // canonical only
    const meta = [surahName ? '\u0633\u0648\u0631\u0629 ' + surahName : '', sg.ayah ? '\u0622\u064A\u0629 ' + sg.ayah : '']
      .filter(Boolean).join('\u060C ');
    return REPLY_LINE(['\u0642\u064E\u0627\u0644\u064E \u0627\u0644\u0644\u0647\u064F \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649', body, meta]);
  },
  surah: (sg) => {
    const sNum = resolveSurahNumber(undefined, sg.num);
    const surahName = sNum ? SURAH_NAMES[sNum] : '';
    const head = '\u0642\u064E\u0627\u0644\u064E \u0627\u0644\u0644\u0647\u064F \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649' + (surahName ? ' \u2014 \u0633\u064F\u0648\u0631\u064E\u0629\u064F ' + surahName : '');
    const count = sNum ? getSurahAyahCount(sNum) : 0;
    let body = '', meta = '';
    if (count) {
      let f = parseInt(sg.from, 10); if (!(f >= 1)) f = 1;
      let t = parseInt(sg.to, 10); if (!(t >= 1) || t > count) t = count;
      if (f <= t) {
        const pieces = [];
        if (f === 1 && sNum !== 1 && sNum !== 9) { const b = getVerseText(1, 1); if (b) pieces.push(b); }
        let missing = false;
        for (let a = f; a <= t; a++) {
          const vt = getVerseText(sNum, a);
          if (!vt) { missing = true; break; }
          pieces.push(vt + ' \u06DD' + toArabicDigits(a));
        }
        if (!missing) body = pieces.join(' ');
        meta = (f === 1 && t === count) ? '\u0633\u0648\u0631\u0629 ' + surahName
          : '\u0633\u0648\u0631\u0629 ' + surahName + '\u060C \u0627\u0644\u0622\u064A\u0627\u062A ' + toArabicDigits(f) + '\u2013' + toArabicDigits(t);
      }
    }
    if (!meta && surahName) meta = '\u0633\u0648\u0631\u0629 ' + surahName;
    return REPLY_LINE([head, body, meta]);
  },
  hadith: (sg) => REPLY_LINE([sg.narrator ? '\u0631\u064E\u0648\u064E\u0649 ' + sg.narrator : '\u0645\u0646 \u0627\u0644\u0633\u0646\u0629 \u0627\u0644\u0646\u0628\u0648\u064A\u0629', sg.content, sg.ruling]),
  dhikr: (sg) => {
    const db = (typeof __adhkarData !== 'undefined') ? __adhkarData : null;
    const list = (db && db.byCat && db.byCat[parseInt(sg.catId, 10)]) || [];
    if (!list.length) return '';
    const head = ((list[0] && list[0].category) || '\u0630\u0643\u0631') + ' \u2014 \u062D\u0635\u0646 \u0627\u0644\u0645\u0633\u0644\u0645';
    return REPLY_LINE([head].concat(list.map((d) => REPLY_LINE([
      d.text, d.repeat > 1 ? '\u062A\u064F\u0642\u0627\u0644 ' + toArabicDigits(d.repeat) + ' \u0645\u0631\u0651\u0627\u062A' : '',
    ]))));
  },
  worship: (sg, ctx) => {
    const d = (typeof __worshipData !== 'undefined') ? __worshipData : null;
    const arm = (ctx.band === 'young') ? 'young' : 'adult';   // byte-for-byte WorshipCard's ternary
    const cell = d && d.cells && d.cells[sg.id + ':' + arm];
    return (cell && cell.text) ? cell.text : '';
  },
  source: (sg) => {
    let host = (sg.site || '').trim();
    if (!host && sg.url) { try { host = new URL(sg.url).hostname.replace(/^www\./, ''); } catch (e) { host = ''; } }
    const label = host || '\u0627\u0644\u0645\u0635\u062F\u0631';
    const text = (sg.content || '').trim();
    // The url is the REFERENCE. A fiqh answer pasted into a message without it is incomplete,
    // and the chip's own href is the only place it exists on screen.
    return REPLY_LINE([text ? label + ' \u2014 ' + text : label, sg.url || '']);
  },
  steps: (sg) => REPLY_LINE(['\u062E\u064F\u0637\u064F\u0648\u064E\u0627\u062A\u064C \u062A\u064F\u0633\u064E\u0627\u0639\u0650\u062F\u064F\u0643'].concat(
    (sg.items || []).map((it, i) => (i + 1) + '. ' + it))),   // matches the card's <ol> decimal marks
  board: (sg) => sg.content,
  document: (sg) => REPLY_LINE([sg.title || '\u0645\u0633\u062A\u0646\u062F', toPlainText(sg.content)]),
};
// Every type MessageBubble can render must have an entry above. A new card added to the renderer
// without one lands here and is announced -- loudly, and visibly in the copied text -- instead of
// vanishing from the clipboard the way every card did before this directive.
const serializeReply = (segments, ctx) => {
  const out = [];
  (segments || []).forEach((sg) => {
    const fn = sg && REPLY_SERIALIZERS[sg.type];
    if (!fn) {
      try { console.error('[copy] no serializer for segment type:', sg && sg.type); } catch (e) {}
      out.push('[' + ((sg && sg.type) || 'unknown') + ': not serialized]');
      return;
    }
    const piece = fn(sg, ctx || {});
    if (piece && String(piece).trim()) out.push(String(piece).trim());
  });
  return out.join('\n\n');
};

function MessageBubble({ message, onSuggestionClick, onPlayVerse, onPlaySurah, onStopAudio, onPlayMessage, age, onReport, tashkeel, onToggleTashkeel }) {
  const isUser = message.role === 'user';
  if (isUser) {
    const c = message.content;
    if (Array.isArray(c)) {
      const imgBlock = c.find(b => b && b.type === 'image');
      const txtBlock = c.find(b => b && b.type === 'text');
      return (
        <div style={{ ...s.messageBubble, ...s.userBubble, animation: 'fadeIn 0.3s ease-out' }}>
          {imgBlock && <img src={`data:${imgBlock.source.media_type};base64,${imgBlock.source.data}`} style={{ maxWidth: '100%', borderRadius: 10, marginBottom: txtBlock ? 8 : 0, display: 'block' }} />}
          {txtBlock && txtBlock.text}
        </div>
      );
    }
    return <div style={{ ...s.messageBubble, ...s.userBubble, animation: 'fadeIn 0.3s ease-out' }}>{c}</div>;
  }
  // رسالة الأستاذ: نحلّلها لاستخراج البطاقات
  const { segments, suggestions } = parseRichMessage(message.content, age);
  // D90: the clipboard carries EVERY rendered block, in display order. D91: it is built on the
  // TAP, not here, because the stores the cards read are still filling while this runs.
  const buildCopyText = () => serializeReply(segments, { tashkeel, band: deriveCaps(age).band });
  return (
    <div style={{ animation: 'fadeIn 0.3s ease-out', display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 8, maxWidth: '92%', alignSelf: 'flex-end' }}>
      <div style={{ ...s.assistantBubble, maxWidth: '100%', /* 13.4-b2 */ padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        {segments.map((seg, i) => {
          if (seg.type === 'text') {
            return <div key={i} style={s.bubbleText}>{tashkeel ? seg.content : stripTashkeelOutsideQuran(seg.content)}</div>;
          }
          if (seg.type === 'verse') {
            return <VerseCard key={i} surah={seg.surah} surahNum={seg.surahNum} ayah={seg.ayah} onPlayVerse={onPlayVerse} onStopAudio={onStopAudio} />;
          }
          if (seg.type === 'surah') {
            return <SurahCard key={i} num={seg.num} from={seg.from} to={seg.to} onPlaySurah={onPlaySurah} onStopAudio={onStopAudio} />;
          }
          if (seg.type === 'hadith') {
            return <HadithCard key={i} content={seg.content} narrator={seg.narrator} ruling={seg.ruling} />;
          }
          if (seg.type === 'source') {
            return <SourceCard key={i} site={seg.site} url={seg.url} content={seg.content} />;
          }
          if (seg.type === 'dhikr') {
            return <DhikrCard key={i} catId={seg.catId} />;
          }
          if (seg.type === 'worship') {
            return <WorshipCard key={i} id={seg.id} band={deriveCaps(age).band} />;
          }
          if (seg.type === 'steps') {
            return <StepsCard key={i} items={seg.items} />;
          }
          if (seg.type === 'board') {
            return <BoardCard key={i} content={seg.content} />;
          }
          if (seg.type === 'document') {
            return <DocumentCard key={i} title={seg.title} content={seg.content} age={age} />;
          }
          return null;
        })}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <MessageListenButton text={message.content} onPlayMessage={onPlayMessage} onStopAudio={onStopAudio} />
        {/* text= decides only VISIBILITY, and is deliberately store-independent: the raw reply
            always exists, so the button can no longer vanish because a fetch had not landed. */}
        <CopyReplyButton text={String(message.content || '').trim()} getText={buildCopyText} />
        <button type="button" onClick={onToggleTashkeel} aria-label={'\u062A\u0634\u0643\u064A\u0644'} style={{ ...miniBtnStyle, opacity: tashkeel ? 1 : 0.7, borderColor: tashkeel ? 'var(--red)' : 'var(--line)' }}>{'\u062A\u0634\u0643\u064A\u0644'}</button>
        <button type="button" onClick={onReport} aria-label="بلّغ عن هذا الردّ" style={{ display: 'inline-flex', alignItems: 'center', gap: 5, background: 'transparent', color: 'var(--muted)', border: '1px solid var(--line)', borderRadius: 8, padding: '4px 10px', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          <span>بلّغ</span>
        </button>
      </div>
      {suggestions && suggestions.length > 0 && (
        <div style={s.suggestionsInline}>
          {suggestions.map((sg, i) => (
            <button key={i} onClick={() => onSuggestionClick && onSuggestionClick(sg)} style={s.suggestionChipSmall}>
              {sg}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// Flag-a-reply modal (step 2b). Copies AdultGate's overlay+card pattern (the app's one existing
// floating popup) so there is no second modal idiom. The four reason keys below are the server's
// literal keys -- labels are shown, keys are sent. The result text is honest: only a real 200 says
// "delivered"; a 429 or any other outcome says it did NOT arrive (the server fails closed on
// purpose, and the client must not paper over that with a false smile).
function ReportModal({ onClose, onSubmit }) {
  const [reason, setReason] = useState('');
  const [note, setNote] = useState('');
  const [status, setStatus] = useState('idle'); // idle | sending | ok | rate | fail
  const REASON_OPTIONS = [
    { key: 'wrong_info', label: 'معلومةٌ خاطئة' },
    { key: 'wrong_ruling', label: 'حكمٌ شرعيٌّ خاطئ' },
    { key: 'inappropriate', label: 'محتوًى غيرُ مناسب' },
    { key: 'other', label: 'شيءٌ آخر' },
  ];
  const send = async () => {
    if (!reason || status === 'sending') return;
    setStatus('sending');
    const r = await onSubmit(reason, note);
    setStatus(r);
  };
  const overlay = { position: 'fixed', inset: 0, zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20, background: 'rgba(30,30,30,0.6)' };
  if (status === 'ok') {
    return (
      <div style={overlay}>
        <div style={{ ...s.onboardingCard, maxWidth: 360 }}>
          <div style={s.bigEmoji}>✅</div>
          <div style={s.onboardingTitle}>وصل بلاغُك. شكرًا لك.</div>
          <button onClick={onClose} style={s.primaryBtn}>إغلاق</button>
        </div>
      </div>
    );
  }
  return (
    <div style={overlay}>
      <div style={{ ...s.onboardingCard, maxWidth: 360 }}>
        <div style={s.bigEmoji}>🚩</div>
        <div style={s.onboardingTitle}>بلّغ عن هذا الردّ</div>
        <div style={s.onboardingSubtitle}>اختر السبب، وأضِف ملاحظةً إن شئت.</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, width: '100%', margin: '4px 0 10px' }}>
          {REASON_OPTIONS.map(o => (
            <button key={o.key} type="button" onClick={() => setReason(o.key)}
              style={{ textAlign: 'right', padding: '10px 14px', borderRadius: 12, cursor: 'pointer', fontFamily: 'inherit', fontSize: 15,
                border: reason === o.key ? '1px solid var(--red)' : '1px solid var(--line)',
                background: reason === o.key ? 'var(--tint)' : 'var(--white)', color: 'var(--ink)' }}>
              {o.label}
            </button>
          ))}
        </div>
        <textarea value={note} onChange={(e) => setNote(e.target.value)} maxLength={500} rows={3}
          placeholder="ملاحظة (اختياري)" style={{ ...s.onboardingInput, resize: 'none', textAlign: 'right', marginBottom: 12 }} />
        {status === 'rate' && <div style={{ color: 'var(--ink)', fontSize: 14, marginBottom: 10 }}>أرسلتَ بلاغاتٍ كثيرةً الآن. حاول بعد قليل.</div>}
        {status === 'fail' && <div style={{ color: 'var(--ink)', fontSize: 14, marginBottom: 10 }}>لم يصل بلاغُك. حاول لاحقًا.</div>}
        <button onClick={send} disabled={!reason || status === 'sending'} style={{ ...s.primaryBtn, opacity: (!reason || status === 'sending') ? 0.5 : 1 }}>
          {status === 'sending' ? '…' : 'أرسِل'}
        </button>
        <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'var(--muted)', fontSize: 14, marginTop: 10, cursor: 'pointer', fontFamily: 'inherit' }}>إلغاء</button>
      </div>
    </div>
  );
}

function VerseCard({ surah, surahNum, ayah, onPlayVerse, onStopAudio }) {
  const [playing, setPlaying] = useState(false);
  const [audioFailed, setAudioFailed] = useState(false);
  // نصّ الآية يأتي حصراً من المصحف الكنسي المُحمَّل، لا من النموذج.
  const [verseText, setVerseText] = useState('');
  const [textState, setTextState] = useState('loading'); // loading | ok | fail
  const audioRef = useRef(null); // fallback محلي فقط (إن لم تُمرَّر دوال المنسِّق)

  const sNum = resolveSurahNumber(surah, surahNum);
  const aNum = parseInt(ayah, 10);
  const canPlay = !!sNum && aNum >= 1;
  const surahName = surah || (sNum ? SURAH_NAMES[sNum] : '');
  const pad3 = (x) => String(x).padStart(3, '0');
  const audioUrl = canPlay
    ? `https://everyayah.com/data/${QURAN_RECITER}/${pad3(sNum)}${pad3(aNum)}.mp3`
    : null;

  // جلب نصّ الآية الكنسي مرة واحدة (مُخزَّن في الذاكرة). عند الفشل: لا نصّ —
  // نعرض المرجع وزرّ التلاوة فقط، ولا نقع أبداً على نصّ النموذج أو ترميز خام.
  useEffect(() => {
    let alive = true;
    if (!canPlay) { setTextState('fail'); return; }
    loadQuran()
      .then(() => {
        if (!alive) return;
        const t = getVerseText(sNum, aNum);
        if (t) { setVerseText(t); setTextState('ok'); }
        else { setTextState('fail'); }
      })
      .catch(() => { if (alive) setTextState('fail'); });
    return () => { alive = false; };
  }, [sNum, aNum, canPlay]);

  // إيقاف صوت fallback المحلي وتنظيفه عند إزالة البطاقة
  useEffect(() => () => { if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; } }, []);

  // إعادة تشغيل يدوية — عبر منسِّق App: يُوقف كلام المربّي أولاً ثم يُعيد التلاوة.
  // الزر الآن «تكرار» يدوي؛ التلاوة تُشغَّل تلقائياً ضمن تسلسل الردّ في App.
  const togglePlay = () => {
    // مسار المنسِّق الموحَّد (الاستخدام الفعلي في المحادثة)
    if (onPlayVerse) {
      if (playing) {
        if (onStopAudio) onStopAudio();
        setPlaying(false);
        return;
      }
      setAudioFailed(false);
      setPlaying(true);
      Promise.resolve(onPlayVerse(sNum, aNum))
        .then((res) => { setPlaying(false); if (res && res.failed) setAudioFailed(true); })
        .catch(() => { setPlaying(false); setAudioFailed(true); });
      return;
    }
    // fallback محلي (لو رُكِّبت البطاقة خارج المحادثة بدون دوال المنسِّق)
    setAudioFailed(false);
    if (!audioRef.current) {
      const audio = new Audio(audioUrl);
      audio.onended = () => setPlaying(false);
      audio.onerror = () => { setPlaying(false); setAudioFailed(true); };
      audioRef.current = audio;
    }
    const audio = audioRef.current;
    if (playing) {
      audio.pause();
      setPlaying(false);
    } else {
      setPlaying(true);
      const p = audio.play();
      if (p && p.catch) p.catch(() => { setPlaying(false); setAudioFailed(true); });
    }
  };

  return (
    <div style={s.verseCard}>
      <div style={s.verseCardLabel}>
        <span>قَالَ اللهُ تَعَالَى</span>
      </div>
      {textState === 'ok' && <div style={s.verseText}>{verseText}</div>}
      <div style={s.verseFooter}>
        {(surahName || ayah) && (
          <div style={s.verseMeta}>
            {surahName && `سورة ${surahName}`}{surahName && ayah && '، '}{ayah && `آية ${ayah}`}
          </div>
        )}
        {canPlay && (
          <button
            type="button"
            onClick={togglePlay}
            style={s.versePlayBtn}
            aria-label={playing ? 'إيقاف التلاوة' : 'تشغيل التلاوة'}
          >
            {playing ? <PauseIcon size={14} /> : <PlayIcon size={14} />}
            <span>{playing ? 'إيقاف' : 'استمع للتلاوة'}</span>
          </button>
        )}
      </div>
      {audioFailed && <div style={s.verseAudioError}>تعذّر تحميل التلاوة</div>}
    </div>
  );
}

// بطاقة السورة الكاملة (أو مدًى متّصل): نصّ واحد متّصل بأرقام آيات ۝، وزرّ تلاوة واحد.
// النصّ من المصحف الكنسي حصراً؛ عند الفشل نعرض الاسم والمدى فقط (لا نصّ نموذج ولا ترميز خام).
function SurahCard({ num, from, to, onPlaySurah, onStopAudio }) {
  const [playing, setPlaying] = useState(false);
  const [audioFailed, setAudioFailed] = useState(false);
  const [body, setBody] = useState('');
  const [state, setState] = useState('loading'); // loading | ok | fail
  const [range, setRange] = useState({ from: 0, to: 0, whole: false });

  const sNum = resolveSurahNumber(undefined, num);
  const surahName = sNum ? SURAH_NAMES[sNum] : '';

  useEffect(() => {
    let alive = true;
    if (!sNum) { setState('fail'); return; }
    loadQuran()
      .then(() => {
        if (!alive) return;
        const count = getSurahAyahCount(sNum);
        if (!count) { setState('fail'); return; }
        let f = parseInt(from, 10); if (!(f >= 1)) f = 1;
        let t = parseInt(to, 10); if (!(t >= 1) || t > count) t = count;
        if (f > t) { setState('fail'); return; }
        setRange({ from: f, to: t, whole: f === 1 && t === count });
        const pieces = [];
        // البسملة (للسورة كاملة من الآية ١) — غير مرقّمة، إلا الفاتحة (آية ١) والتوبة (لا بسملة).
        // نُعيد استخدام نصّ البسملة الكنسي getVerseText(1,1) — لا نكتب نصّاً قرآنياً يدوياً.
        if (f === 1 && sNum !== 1 && sNum !== 9) {
          const basmala = getVerseText(1, 1);
          if (basmala) pieces.push(basmala);
        }
        let missing = false;
        for (let a = f; a <= t; a++) {
          const vt = getVerseText(sNum, a);
          if (!vt) { missing = true; break; }
          pieces.push(`${vt} ۝${toArabicDigits(a)}`); // آية + رقمها داخل زخرفة نهاية الآية
        }
        if (missing) { setState('fail'); return; }
        setBody(pieces.join(' '));
        setState('ok');
      })
      .catch(() => { if (alive) setState('fail'); });
    return () => { alive = false; };
  }, [sNum, from, to]);

  const metaLabel = !surahName ? ''
    : range.whole ? `سورة ${surahName}`
    : (range.from ? `سورة ${surahName}، الآيات ${toArabicDigits(range.from)}–${toArabicDigits(range.to)}` : `سورة ${surahName}`);

  const togglePlay = () => {
    if (!onPlaySurah) return;
    if (playing) {
      if (onStopAudio) onStopAudio();
      setPlaying(false);
      return;
    }
    setAudioFailed(false);
    setPlaying(true);
    Promise.resolve(onPlaySurah(sNum, range.from || 1, range.to || null))
      .then((res) => { setPlaying(false); if (res && res.failed) setAudioFailed(true); })
      .catch(() => { setPlaying(false); setAudioFailed(true); });
  };

  return (
    <div style={s.verseCard}>
      <div style={s.verseCardLabel}>
        <span>قَالَ اللهُ تَعَالَى{surahName ? ` — سُورَةُ ${surahName}` : ''}</span>
      </div>
      {state === 'ok' && <div style={s.surahText}>{body}</div>}
      <div style={s.verseFooter}>
        {metaLabel && <div style={s.verseMeta}>{metaLabel}</div>}
        {sNum && (
          <button
            type="button"
            onClick={togglePlay}
            style={s.versePlayBtn}
            aria-label={playing ? 'إيقاف التلاوة' : 'تشغيل التلاوة كاملة'}
          >
            {playing ? <PauseIcon size={14} /> : <PlayIcon size={14} />}
            <span>{playing ? 'إيقاف' : 'استمع للتلاوة (كاملة)'}</span>
          </button>
        )}
      </div>
      {audioFailed && <div style={s.verseAudioError}>تعذّر تحميل التلاوة</div>}
    </div>
  );
}

function HadithCard({ content, narrator, ruling }) {
  return (
    <div style={s.hadithCard}>
      <div style={s.hadithCardLabel}>
        <span>{narrator ? `رَوَى ${narrator}` : 'من السنة النبوية'}</span>
      </div>
      <div style={s.hadithText}>{content}</div>
      {ruling && <div style={s.hadithMeta}>{ruling}</div>}
    </div>
  );
}

// بطاقة المصدر: شريحةُ عزوٍ قابلةٌ للنقر في نهاية الجواب — أوّلُ رابطٍ خارجيٍّ في التطبيق.
// تُظهِر اسمَ النطاق (site) ثمّ وصفاً عربيّاً موجزاً (المحتوى)، وتفتح url في تبويبٍ جديد.
function SourceCard({ site, url, content }) {
  // D92: this chip is the app's ONLY external navigation -- tapping it leaves for the system
  // browser (a Custom Tab in the standalone/TWA shell, which the web side cannot intercept, so
  // the decision has to be made here). Google's Families policy puts a parental gate exactly
  // here, and before D92 there was none. The hook sits above the missing-url early return so the
  // hook order is stable on every render.
  const [gate, setGate] = useState(null);
  // اسمُ النطاق للعرض: نُفضّل site، وإلا نشتقّه من رابط الصفحة إن أمكن.
  let host = (site || '').trim();
  if (!host && url) {
    try { host = new URL(url).hostname.replace(/^www\./, ''); } catch (e) { host = ''; }
  }
  const label = host || 'المصدر';
  const text = (content || '').trim() || host || url || '';
  const body = [
    <span key="site" style={s.sourceChipSite}>{label}</span>,
    text ? <span key="text" style={s.sourceChipText}>{text}</span> : null,
    <span key="arrow" style={s.sourceChipArrow} aria-hidden="true">↗</span>,
  ];
  // حمايةٌ من رابطٍ مفقود: بلا url نرسم شريحةً نصّيّةً غير قابلةٍ للنقر — لا <a href=""> أبداً.
  if (!url) {
    return <div style={s.sourceChip}>{body}</div>;
  }
  const chipStyle = { ...s.sourceChip, ...s.sourceChipLink };
  if (!(PARENTAL_GATE_ENABLED && childProfileActive())) {
    return (
      <a href={url} target="_blank" rel="noopener noreferrer" style={chipStyle}>
        {body}
      </a>
    );
  }
  // The href stays real, so long-press / copy-link still behave. Only the tap is intercepted:
  // the navigation happens in onPass, which is itself a button click, so no popup blocker fires.
  return (
    <>
      <a href={url} target="_blank" rel="noopener noreferrer" style={chipStyle}
        onClick={(e) => { e.preventDefault(); setGate({ a: 2 + Math.floor(Math.random() * 8), b: 2 + Math.floor(Math.random() * 8) }); }}>
        {body}
      </a>
      {gate && <AdultGate a={gate.a} b={gate.b}
        onPass={() => { setGate(null); try { window.open(url, '_blank', 'noopener,noreferrer'); } catch (e) {} }}
        onCancel={() => setGate(null)} />}
    </>
  );
}

// ONE PIN sheet, reached from two places: selecting a locked depth tier, and entering the
// call. The PIN is typed, POSTed once and discarded -- only the returned token is kept.
//
// The child barrier (CHILD_VOICE_ENABLED / childVoiceBlocked) sits ABOVE this sheet in every
// caller, so a child profile gets the "being prepared" notice and is never even offered the
// chance to unlock. This sheet is not the lock either: api/unlock.js rate-limits attempts and
// api/ask.js ignores an unearned tier regardless of what the UI shows.
function UnlockSheet({ onUnlocked, onBack }) {
  const [pin, setPin] = useState('');
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (busy || !pin) return;
    setBusy(true); setMsg('');
    try {
      const r = await fetch('/api/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ pin, deviceId: getDeviceId() }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d && d.token) { storeFounderToken(d.token); setPin(''); onUnlocked(); return; }
      // The SERVER owns the wording. A wrong code, a day lockout and an unreachable store are
      // three different truths and only it knows which -- so show its message verbatim and
      // never an invented generic line.
      setMsg((d && d.message) || '');
    } catch (e) {
      // A network failure carries no server message; leave the sheet up rather than invent a
      // second copy of wording the server owns.
      setMsg('');
    }
    setPin(''); setBusy(false);
  };
  return (
    <div style={s.onboardingContainer}>
      <div style={s.onboardingCard}>
        <div style={s.bigEmoji}>{'\uD83D\uDD10'}</div>
        <div style={s.onboardingTitle}>{'\u0627\u0644\u0631\u0645\u0632 \u0645\u0637\u0644\u0648\u0628'}</div>
        <div style={s.onboardingSubtitle}>{'\u0623\u062F\u062E\u0644 \u0631\u0645\u0632 \u0627\u0644\u0641\u062A\u062D \u0644\u0644\u0645\u062A\u0627\u0628\u0639\u0629.'}</div>
        <input type="password" inputMode="numeric" value={pin} onChange={(e) => setPin(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && submit()} placeholder="••••" autoFocus
          style={{ ...s.onboardingInput, textAlign: 'center', letterSpacing: '0.5em', borderColor: msg ? '#C44536' : '#E5EBF5' }} />
        {msg && <div style={{ color: '#C44536', fontSize: 14, marginTop: -8, marginBottom: 8, lineHeight: 1.8 }}>{msg}</div>}
        <button onClick={submit} disabled={busy} style={{ ...s.primaryBtn, opacity: busy ? 0.5 : 1 }}>{'\u0641\u062A\u062D'}</button>
        <button onClick={onBack} style={s.secondaryBtn}>{'\u0631\u062C\u0648\u0639'}</button>
      </div>
    </div>
  );
}

function Onboarding({ onStart }) {
  const [name, setName] = useState('');
  const [birthYear, setBirthYear] = useState('');
  const [gender, setGender] = useState(null);
  const toLatinDigits = (str) => String(str || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  // Neutral age screen (step 4a): we ask the BIRTH YEAR — a fact with no "right" answer —
  // never "are you an adult?". Age is DERIVED from it and passed on unchanged; the band
  // thresholds and profile shape stay untouched (startChat re-derives the same birthYear).
  const CUR_YEAR = new Date().getFullYear();
  const yearNum = parseInt(toLatinDigits(birthYear), 10);
  const derivedAge = CUR_YEAR - yearNum;
  const ageValid = Number.isInteger(yearNum) && derivedAge >= 4 && derivedAge <= 99;
  const canStart = !!(name.trim() && gender && ageValid);
  // D92: the parental gate is NOT an entry condition for anyone. Onboarding hands the derived
  // age straight to startChat -- no arithmetic at boot, on the chat, or for a teen/adult profile
  // at any point. The gate itself is untouched and still stands at the one real boundary a child
  // profile can cross: an external URL leaving the app (see SourceCard).
  const requestStart = (n) => {
    onStart(name, n, gender);
  };
  const submit = () => { if (canStart) requestStart(derivedAge); };
  return (
    <div style={s.welcomeContainer}>
      <div style={s.welcomeInner}>
        <div style={s.welcomeCard}>
        {/* S13.1b-welcome-single */}
        <div style={s.welcomeLogoSquare}>
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></svg>
        </div>
        <div style={s.welcomeTitle}>عزك</div>
        <div style={s.welcomeGreeting}>أهلاً بك</div>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="الاسم" style={s.welcomeInput} autoFocus />
        <div style={{ display: 'flex', gap: 12, marginBottom: 16 }}>
          <button onClick={() => setGender('male')} style={{ ...s.welcomePrimaryBtn, flex: 1, background: gender === 'male' ? 'var(--red)' : 'var(--white)', color: gender === 'male' ? '#FFF' : 'var(--ink)' }}>ذكر</button>
          <button onClick={() => setGender('female')} style={{ ...s.welcomePrimaryBtn, flex: 1, background: gender === 'female' ? 'var(--red)' : 'var(--white)', color: gender === 'female' ? '#FFF' : 'var(--ink)' }}>أنثى</button>
        </div>
        <input value={birthYear} onChange={(e) => setBirthYear(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') submit(); }} placeholder="سنة الميلاد — مثال ٢٠١٥" type="text" inputMode="numeric" pattern="[0-9]*" maxLength={4} style={s.welcomeInput} />
        {birthYear.trim() && !ageValid && <div style={{ color: 'var(--muted)', fontSize: 13, marginTop: -8, marginBottom: 12, textAlign: 'center' }}>اكتب سنةَ ميلادك بأربعة أرقام — مثل ٢٠١٥</div>}
        <button onClick={submit} disabled={!canStart} className="welcome-primary" style={{ ...s.welcomePrimaryBtn, opacity: canStart ? 1 : 0.4 }}>ابدأ</button>
        </div>
      </div>
    </div>
  );
