    // paragraph — everything up to a blank line or the start of another block
    const para = [line];
    i++;
    while (i < lines.length && lines[i].trim() && !ezMdIsBlockStart(lines[i]) && !ezMdTableAt(lines, i)) {
      para.push(lines[i]); i++;
    }
    const k = K();
    out.push(React.createElement('div', { key: k, style: s.mdP }, ezMdLines(para, k)));
  }
  return out;
}

// The component the bubble renders. Memoised on the string, because the whole thread re-renders
// on every streaming delta and a settled reply must not be re-parsed for each one.
const EzikMarkdown = React.memo(function EzikMarkdown({ text }) {
  const t = String(text == null ? '' : text);
  if (!t.trim()) return null;
  const blocks = ezMdBlocks(t);
  if (!blocks.length) return null;
  return React.createElement(React.Fragment, null, blocks);
});

// THE ONE PLACE A SEGMENT BECOMES AN ELEMENT.
// Lifted out of MessageBubble in S98 so the favourites screen can show a saved reply through the
// EXACT renderer the chat uses. A second, parallel renderer there is what would eventually leak a
// raw <verse …> at a reader — this makes that impossible by construction, because there is only
// one mapping and both callers go through it. Behaviour is byte-identical to the map it replaces:
// same components, same props, same index keys, same null for a folded-away prose segment.
// The JSX below is byte-for-byte the map it replaces, down to the names `tashkeel`, `age`,
// `onPlayVerse`, `onPlaySurah` and `onStopAudio` — which is deliberate. markdown-guard pins the
// exact form of the prose site and counts the display sites of EzikMarkdown; keeping the shape
// identical means this refactor moves the code without loosening a single thing that gate holds.
function ezikRenderSegments(segments, ctx) {
  const { tashkeel, age, onPlayVerse, onPlaySurah, onStopAudio } = (ctx || {});
  return (segments || []).map((seg, i) => {
    if (!seg) return null;   // S98: a folded-away prose segment, holding its index open
    if (seg.type === 'text') {
      // S93: PROSE ONLY, and the last thing that happens to it. The cards were separated above,
      // the tashkeel toggle has already had its say (it removes diacritics and touches no Markdown
      // character), and what remains is turned into layout for the eye. seg.content itself is
      // untouched — the clipboard, the voice and the stored thread all still read the raw text,
      // which is why an old saved conversation formats too: the formatting is computed here, at
      // display, from text that was never rewritten.
      // S99: `ez-prose` marks THE prose of a reply — the one surface reading mode opens up. Cards
      // do not carry it, so an ayah, a hadith and a source keep their own measured spacing.
      return <div key={i} className="ez-prose" style={s.bubbleText}><EzikMarkdown text={tashkeel ? seg.content : stripTashkeelOutsideQuran(seg.content)} /></div>;
    }
    if (seg.type === 'verse') {
      return <VerseCard key={i} surah={seg.surah} surahNum={seg.surahNum} ayah={seg.ayah} onPlayVerse={onPlayVerse} onStopAudio={onStopAudio} />;
    }
    if (seg.type === 'surah') {
      return <SurahCard key={i} num={seg.num} from={seg.from} to={seg.to} onPlaySurah={onPlaySurah} onStopAudio={onStopAudio} />;
    }
    if (seg.type === 'hadith') {
      return <HadithCard key={i} content={seg.content} narrator={seg.narrator} ruling={seg.ruling} />;
    }
    if (seg.type === 'source') {
      return <SourceCard key={i} site={seg.site} url={seg.url} content={seg.content} />;
    }
    if (seg.type === 'dhikr') {
      return <DhikrCard key={i} catId={seg.catId} />;
    }
    if (seg.type === 'worship') {
      return <WorshipCard key={i} id={seg.id} band={deriveCaps(age).band} />;
    }
    if (seg.type === 'steps') {
      return <StepsCard key={i} items={seg.items} />;
    }
    if (seg.type === 'board') {
      return <BoardCard key={i} content={seg.content} />;
    }
    if (seg.type === 'document') {
      return <DocumentCard key={i} title={seg.title} content={seg.content} age={age} />;
    }
    return null;
  });
}

// S98 PERF: MEMOISED. Every prop below is either a primitive, the message object itself (whose
// identity the thread preserves across a re-render) or a callback App pins to one identity — so a
// keystroke in the composer re-renders the composer and NOT the thread. See the note beside the
// pinned callbacks in App for the measurement that made this necessary.
const MessageBubble = React.memo(function MessageBubble({ message, index, onSuggestionClick, onPlayVerse, onPlaySurah, onStopAudio, onPlayMessage, age, onReport, tashkeel, onToggleTashkeel, onQuote, onFavorite, isFavorite, defaultOpen, foldEpoch }) {
  const isUser = message.role === 'user';
  // S97 PERF. This parse used to run on EVERY render of EVERY assistant bubble, and the chat's
  // composer state lives on App -- so a single keystroke re-parsed the whole thread. On a 120-turn
  // conversation that was ~60 full re-parses per typed character, and nothing about them changed.
  // parseRichMessage is a pure function of exactly the two inputs in the dependency list: it reads
  // the text and the viewer's age band and returns segment DESCRIPTORS. It touches no store. The
  // cards that DO read stores (dhikr, worship, verse) are separate components below and still
  // re-render and re-read on every pass, exactly as before -- so the D91 note further down ("the
  // stores the cards read are still filling while this runs") is untouched by caching descriptors.
  // TWO things about the shape of this, both load-bearing:
  //   - it sits ABOVE the isUser early return, because bubbles are keyed by INDEX: React reuses
  //     the instance at index i across conversations, and if the role at that index flips
  //     user<->assistant a hook below the return would change the hook COUNT and React would throw.
  //   - it still must not RUN for a user bubble: a user turn carrying an attachment has an ARRAY
  //     content, and parseRichMessage calls text.search() before its own typeof guard, so parsing
  //     one would throw. The branch is inside the callback, so the hook stays unconditional.
  const { segments, suggestions } = React.useMemo(
    () => (isUser ? { segments: [], suggestions: [] } : parseRichMessage(message.content, age)),
    [isUser, message.content, age]);
  // S98 THE FOLD. Two hooks, both unconditional and both ABOVE the isUser return, for the same
  // reason the memo above is: bubbles are keyed by index, so React reuses the instance at index i
  // when a conversation is replaced, and a hook below the return would change the hook COUNT the
  // moment the role at that index flipped.
  //
  // WHERE THE FOLD STARTS is App's to say (`defaultOpen`): a reply that just finished streaming in
  // this thread opens EXPANDED, everything else opens folded. WHAT THE USER DID TO IT since is
  // this component's to remember, and it overrides the default in either direction — so the button
  // works on a streamed reply exactly as it does on a restored one.
  //
  // The override carries the THREAD EPOCH as its key. Bubbles are keyed by index, so React reuses
  // the instance at index i whenever the thread is replaced; without a key, a reply the reader had
  // expanded would hand that state to whatever reply later occupied the slot — and, since a
  // reopened conversation holds the very same text at the very same index, a text key could not
  // tell the two apart either. The epoch can: it changes on exactly the two events that replace a
  // thread. Everything else appends, so an epoch that has not changed means the same thread. It is
  // UI state and it is deliberately not stored: reopening the app folds every long reply again.
  const [foldOverride, setFoldOverride] = React.useState(null);   // { epoch, open } | null
  const foldView = React.useMemo(
    () => (isUser ? null : ezikFoldSegments(segments, EZIK_FOLD_MIN_CHARS, EZIK_FOLD_HEAD_CHARS)),
    [isUser, segments]);
  if (isUser) {
    const c = message.content;
    if (Array.isArray(c)) {
      const imgBlock = c.find(b => b && b.type === 'image');
      const txtBlock = c.find(b => b && b.type === 'text');
      return (
        <div className="ez-anim" style={{ ...s.messageBubble, ...s.userBubble, animation: 'fadeIn 0.3s ease-out' }}>
          {imgBlock && <img src={`data:${imgBlock.source.media_type};base64,${imgBlock.source.data}`} style={{ maxWidth: '100%', borderRadius: 10, marginBottom: txtBlock ? 8 : 0, display: 'block' }} />}
          {txtBlock && txtBlock.text}
        </div>
      );
    }
    return <div className="ez-anim" style={{ ...s.messageBubble, ...s.userBubble, animation: 'fadeIn 0.3s ease-out' }}>{c}</div>;
  }
  // رسالة الأستاذ: بطاقاتها مفصولةٌ أعلاه قبل أن يعمل عارضُ Markdown
  // D90: the clipboard carries EVERY rendered block, in display order. D91: it is built on the
  // TAP, not here, because the stores the cards read are still filling while this runs.
  const buildCopyText = () => serializeReply(segments, { tashkeel, band: deriveCaps(age).band });
  // S98: the fold decides only what is DRAWN. buildCopyText above, the listen button below and
  // every export path all read `segments` / message.content — the WHOLE reply — so a folded reply
  // is copied, spoken and exported in full.
  const canFold = !!foldView;
  const overrideActive = !!foldOverride && foldOverride.epoch === foldEpoch;
  const foldOpen = canFold && (overrideActive ? foldOverride.open : !!defaultOpen);
  const shownSegments = (canFold && !foldOpen) ? foldView : segments;
  return (
    <div className="ez-anim" style={{ animation: 'fadeIn 0.3s ease-out', display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 8, maxWidth: '92%', alignSelf: 'flex-end' }}>
      <div style={{ ...s.assistantBubble, maxWidth: '100%', /* 13.4-b2 */ padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        {ezikRenderSegments(shownSegments, { tashkeel, age, onPlayVerse, onPlaySurah, onStopAudio })}
        {/* S98: the toggle lives INSIDE the bubble, under the prose it governs, so it reads as
            part of the reply rather than as a fourth action button. It exists only when there is
            something folded away — a short reply never grows one. */}
        {canFold && (
          <button
            type="button"
            onClick={() => setFoldOverride({ epoch: foldEpoch, open: !foldOpen })}
            aria-expanded={foldOpen ? 'true' : 'false'}
            aria-label={foldOpen ? EZIK_FOLD_HIDE : EZIK_FOLD_SHOW}
            className="ezik-focus"
            style={s.foldToggle}
          >
            <span>{foldOpen ? EZIK_FOLD_HIDE : EZIK_FOLD_SHOW}</span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, transform: foldOpen ? 'rotate(180deg)' : 'none' }}>
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
        )}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', justifyContent: 'flex-end' }}>
        <MessageListenButton text={message.content} onPlayMessage={onPlayMessage} onStopAudio={onStopAudio} />
        {/* text= decides only VISIBILITY, and is deliberately store-independent: the raw reply
            always exists, so the button can no longer vanish because a fetch had not landed. */}
        <CopyReplyButton text={String(message.content || '').trim()} getText={buildCopyText} />
        {/* S98: the quote button hands over the SAME clean text the clipboard gets (cards
            serialized, no tag ever reaches it), trimmed to a preview and dropped into the
            composer. It sends nothing. */}
        {onQuote && (
          <button type="button" onClick={() => onQuote(buildCopyText())} aria-label={EZIK_QUOTE_ARIA} className="ezik-focus" style={miniBtnStyle}>{EZIK_QUOTE_LABEL}</button>
        )}
        {/* S98: the star. `isFavorite` is a boolean handed DOWN — this component never reads a
            store, never parses JSON and never scans a list to draw it. */}
        {onFavorite && (
          <button
            type="button"
            onClick={() => onFavorite(message, index)}
            aria-pressed={isFavorite ? 'true' : 'false'}
            aria-label={isFavorite ? EZIK_FAV_DEL : EZIK_FAV_ADD}
            className="ezik-focus"
            style={{ ...miniBtnStyle, opacity: isFavorite ? 1 : 0.7, borderColor: isFavorite ? 'var(--red)' : 'var(--line)', color: isFavorite ? 'var(--red)' : 'inherit' }}
          >
            <svg width="13" height="13" viewBox="0 0 24 24" fill={isFavorite ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <path d="M12 17.3l-5.4 3 1-6-4.4-4.3 6-.9L12 3.5l2.8 5.6 6 .9-4.4 4.3 1 6z" />
            </svg>
          </button>
        )}
        <button type="button" onClick={onToggleTashkeel} aria-label={'\u062A\u0634\u0643\u064A\u0644'} style={{ ...miniBtnStyle, opacity: tashkeel ? 1 : 0.7, borderColor: tashkeel ? 'var(--red)' : 'var(--line)' }}>{'\u062A\u0634\u0643\u064A\u0644'}</button>
        <button type="button" onClick={() => onReport && onReport(index)} aria-label="بلّغ عن هذا الردّ" style={{ display: 'inline-flex', alignItems: 'center', gap: 5, background: 'transparent', color: 'var(--muted)', border: '1px solid var(--line)', borderRadius: 8, padding: '4px 10px', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          <span>بلّغ</span>
        </button>
      </div>
      {suggestions && suggestions.length > 0 && (
        <div style={s.suggestionsInline}>
          {suggestions.map((sg, i) => (
            <button key={i} onClick={() => onSuggestionClick && onSuggestionClick(sg)} style={s.suggestionChipSmall}>
              {sg}
            </button>
          ))}
        </div>
      )}
    </div>
  );
});

// ============================================================
// S98 — شاشة المفضلة (the favourites screen)
// ============================================================
// It draws ONLY what it is handed: the records, and the set of conversation ids that still exist.
// It reads no store, parses no JSON and owns no copy of anything — so it cannot disagree with the
// menu badge, and a record whose conversation was deleted is a data question answered before this
// component is reached rather than a crash inside it.
//
// A saved reply is drawn through ezikRenderSegments, the SAME renderer the chat bubble uses, so
// its ayah, hadith and source card appear here exactly as they did in the conversation and no raw
// tag can reach the reader by a second path.
// One saved reply's body, and it folds exactly as the chat bubble does — through the same
// ezikFoldSegments and the same toggle. Without it a single long favourite filled several screens
// and pushed its own copy/remove/open buttons far below the fold, which made the list unusable at
// the one length that most needs saving.
function FavoriteReplyBody({ segments, age, tashkeel }) {
  const [open, setOpen] = useState(false);
  const folded = React.useMemo(
    () => ezikFoldSegments(segments, EZIK_FOLD_MIN_CHARS, EZIK_FOLD_HEAD_CHARS),
    [segments]);
  const shown = (folded && !open) ? folded : segments;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      {ezikRenderSegments(shown, { tashkeel, age })}
      {folded && (
        <button
          type="button"
          onClick={() => setOpen(!open)}
          aria-expanded={open ? 'true' : 'false'}
          aria-label={open ? EZIK_FOLD_HIDE : EZIK_FOLD_SHOW}
          className="ezik-focus"
          style={{ ...s.foldToggle, alignSelf: 'flex-start' }}
        >
          <span>{open ? EZIK_FOLD_HIDE : EZIK_FOLD_SHOW}</span>
        </button>
      )}
    </div>
  );
}

function FavoritesScreen({ items, liveChatIds, onBack, onOpenChat, onRemove, age, tashkeel, query, onQuery, searching, total }) {
  return (
    <div style={s.favScreen}>
      <div style={s.dashboardHeader}>
        <button onClick={onBack} style={s.backBtn} className="ezik-focus">{EZIK_BACK}</button>
        <div style={s.dashboardTitle}>{EZIK_FAV_HEADING}</div>
      </div>
      <div style={s.favBody}>
        {/* S98: the same local search, over the records ALREADY IN MEMORY — this screen opens no
            store to filter itself. The box is absent while there is nothing saved to search. */}
        {total > 0 && (
          <div style={s.drawerSearchWrap}>
            <input
              type="search"
              value={query}
              onChange={(e) => onQuery(e.target.value)}
              placeholder={EZIK_FAV_SEARCH_PH}
              aria-label={EZIK_FAV_SEARCH_ARIA}
              className="ezik-focus"
              style={s.drawerSearch}
            />
          </div>
        )}
        {total === 0 && <div style={s.drawerEmpty}>{EZIK_FAV_EMPTY}</div>}
        {total > 0 && searching && items.length === 0 && <div style={s.drawerEmpty}>{EZIK_SEARCH_NONE}</div>}
        {items.map((f) => {
          const parsed = parseRichMessage(f.text, age);
          const alive = !!f.chatId && liveChatIds.has(f.chatId);
          const when = ezikFavDate(f.at);
          return (
            <div key={f.id} style={s.favCard}>
              {when && <div style={s.favMeta}>{when}</div>}
              <FavoriteReplyBody segments={parsed.segments} age={age} tashkeel={tashkeel} />
              <div style={s.favRow}>
                <CopyReplyButton
                  text={String(f.text || '').trim()}
                  getText={() => serializeReply(parsed.segments, { tashkeel, band: deriveCaps(age).band })}
                />
                <button type="button" onClick={() => onRemove(f.id)} aria-label={EZIK_FAV_DEL} className="ezik-focus" style={s.favBtn}>
                  {EZIK_FAV_REMOVE}
                </button>
                {/* The original conversation. When it is gone the row SAYS so instead of
                    offering a button that would do nothing — and nothing here can throw on a
                    missing conversation, because the only thing consulted is a Set of ids. */}
                {alive ? (
                  <button type="button" onClick={() => onOpenChat(f.chatId)} aria-label={EZIK_FAV_OPEN_CHAT} className="ezik-focus" style={s.favBtn}>
                    {EZIK_FAV_OPEN_CHAT}
                  </button>
                ) : (
                  <span style={{ ...s.favBtn, ...s.favBtnOff }}>{EZIK_FAV_CHAT_GONE}</span>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Flag-a-reply modal (step 2b). Copies AdultGate's overlay+card pattern (the app's one existing
// floating popup) so there is no second modal idiom. The four reason keys below are the server's
// literal keys -- labels are shown, keys are sent. The result text is honest: only a real 200 says
// "delivered"; a 429 or any other outcome says it did NOT arrive (the server fails closed on
// purpose, and the client must not paper over that with a false smile).
function ReportModal({ onClose, onSubmit }) {
  const [reason, setReason] = useState('');
  const [note, setNote] = useState('');
  const [status, setStatus] = useState('idle'); // idle | sending | ok | rate | fail
  const REASON_OPTIONS = [
    { key: 'wrong_info', label: 'معلومةٌ خاطئة' },
    { key: 'wrong_ruling', label: 'حكمٌ شرعيٌّ خاطئ' },
    { key: 'inappropriate', label: 'محتوًى غيرُ مناسب' },
    { key: 'other', label: 'شيءٌ آخر' },
  ];
  const send = async () => {
    if (!reason || status === 'sending') return;
    setStatus('sending');
    const r = await onSubmit(reason, note);
    setStatus(r);
  };
  const overlay = { position: 'fixed', inset: 0, zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20, background: 'rgba(30,30,30,0.6)' };
  if (status === 'ok') {
    return (
      <div style={overlay}>
        <div style={{ ...s.onboardingCard, maxWidth: 360 }}>
          <div style={s.bigEmoji}>✅</div>
          <div style={s.onboardingTitle}>وصل بلاغُك. شكرًا لك.</div>
          <button onClick={onClose} style={s.primaryBtn}>إغلاق</button>
        </div>
      </div>
    );
  }
  return (
    <div style={overlay}>
      <div style={{ ...s.onboardingCard, maxWidth: 360 }}>
        <div style={s.bigEmoji}>🚩</div>
        <div style={s.onboardingTitle}>بلّغ عن هذا الردّ</div>
        <div style={s.onboardingSubtitle}>اختر السبب، وأضِف ملاحظةً إن شئت.</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, width: '100%', margin: '4px 0 10px' }}>
          {REASON_OPTIONS.map(o => (
            <button key={o.key} type="button" onClick={() => setReason(o.key)}
              style={{ textAlign: 'right', padding: '10px 14px', borderRadius: 12, cursor: 'pointer', fontFamily: 'inherit', fontSize: 15,
                border: reason === o.key ? '1px solid var(--red)' : '1px solid var(--line)',
                background: reason === o.key ? 'var(--tint)' : 'var(--white)', color: 'var(--ink)' }}>
              {o.label}
            </button>
          ))}
        </div>
        <textarea value={note} onChange={(e) => setNote(e.target.value)} maxLength={500} rows={3}
          placeholder="ملاحظة (اختياري)" style={{ ...s.onboardingInput, resize: 'none', textAlign: 'right', marginBottom: 12 }} />
        {status === 'rate' && <div style={{ color: 'var(--ink)', fontSize: 14, marginBottom: 10 }}>أرسلتَ بلاغاتٍ كثيرةً الآن. حاول بعد قليل.</div>}
        {status === 'fail' && <div style={{ color: 'var(--ink)', fontSize: 14, marginBottom: 10 }}>لم يصل بلاغُك. حاول لاحقًا.</div>}
        <button onClick={send} disabled={!reason || status === 'sending'} style={{ ...s.primaryBtn, opacity: (!reason || status === 'sending') ? 0.5 : 1 }}>
          {status === 'sending' ? '…' : 'أرسِل'}
        </button>
        <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'var(--muted)', fontSize: 14, marginTop: 10, cursor: 'pointer', fontFamily: 'inherit' }}>إلغاء</button>
      </div>
    </div>
  );
}

function VerseCard({ surah, surahNum, ayah, onPlayVerse, onStopAudio }) {
  const [playing, setPlaying] = useState(false);
  const [audioFailed, setAudioFailed] = useState(false);
  // نصّ الآية يأتي حصراً من المصحف الكنسي المُحمَّل، لا من النموذج.
  const [verseText, setVerseText] = useState('');
  const [textState, setTextState] = useState('loading'); // loading | ok | fail
  const audioRef = useRef(null); // fallback محلي فقط (إن لم تُمرَّر دوال المنسِّق)

  const sNum = resolveSurahNumber(surah, surahNum);
  const aNum = parseInt(ayah, 10);
  const canPlay = !!sNum && aNum >= 1;
  const surahName = surah || (sNum ? SURAH_NAMES[sNum] : '');
  const pad3 = (x) => String(x).padStart(3, '0');
  const audioUrl = canPlay
    ? `https://everyayah.com/data/${QURAN_RECITER}/${pad3(sNum)}${pad3(aNum)}.mp3`
    : null;

  // جلب نصّ الآية الكنسي مرة واحدة (مُخزَّن في الذاكرة). عند الفشل: لا نصّ —
  // نعرض المرجع وزرّ التلاوة فقط، ولا نقع أبداً على نصّ النموذج أو ترميز خام.
  useEffect(() => {
    let alive = true;
    if (!canPlay) { setTextState('fail'); return; }
    loadQuran()
      .then(() => {
        if (!alive) return;
        const t = getVerseText(sNum, aNum);
        if (t) { setVerseText(t); setTextState('ok'); }
        else { setTextState('fail'); }
      })
      .catch(() => { if (alive) setTextState('fail'); });
    return () => { alive = false; };
  }, [sNum, aNum, canPlay]);

  // إيقاف صوت fallback المحلي وتنظيفه عند إزالة البطاقة
  useEffect(() => () => { if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; } }, []);

  // إعادة تشغيل يدوية — عبر منسِّق App: يُوقف كلام المربّي أولاً ثم يُعيد التلاوة.
  // الزر الآن «تكرار» يدوي؛ التلاوة تُشغَّل تلقائياً ضمن تسلسل الردّ في App.
  const togglePlay = () => {
    // مسار المنسِّق الموحَّد (الاستخدام الفعلي في المحادثة)
    if (onPlayVerse) {
      if (playing) {
        if (onStopAudio) onStopAudio();
        setPlaying(false);
        return;
      }
      setAudioFailed(false);
      setPlaying(true);
      Promise.resolve(onPlayVerse(sNum, aNum))
        .then((res) => { setPlaying(false); if (res && res.failed) setAudioFailed(true); })
        .catch(() => { setPlaying(false); setAudioFailed(true); });
      return;
    }
    // fallback محلي (لو رُكِّبت البطاقة خارج المحادثة بدون دوال المنسِّق)
    setAudioFailed(false);
    if (!audioRef.current) {
      const audio = new Audio(audioUrl);
      audio.onended = () => setPlaying(false);
      audio.onerror = () => { setPlaying(false); setAudioFailed(true); };
      audioRef.current = audio;
    }
    const audio = audioRef.current;
    if (playing) {
      audio.pause();
      setPlaying(false);
    } else {
      setPlaying(true);
      const p = audio.play();
      if (p && p.catch) p.catch(() => { setPlaying(false); setAudioFailed(true); });
    }
  };

  return (
    <div style={s.verseCard}>
      <div style={s.verseCardLabel}>
        <span>قَالَ اللهُ تَعَالَى</span>
      </div>
      {textState === 'ok' && <div style={s.verseText}>{verseText}</div>}
      <div style={s.verseFooter}>
        {(surahName || ayah) && (
          <div style={s.verseMeta}>
            {surahName && `سورة ${surahName}`}{surahName && ayah && '، '}{ayah && `آية ${ayah}`}
          </div>
        )}
        {canPlay && (
          <button
            type="button"
            onClick={togglePlay}
            style={s.versePlayBtn}
            aria-label={playing ? 'إيقاف التلاوة' : 'تشغيل التلاوة'}
          >
            {playing ? <PauseIcon size={14} /> : <PlayIcon size={14} />}
            <span>{playing ? 'إيقاف' : 'استمع للتلاوة'}</span>
          </button>
        )}
      </div>
      {audioFailed && <div style={s.verseAudioError}>تعذّر تحميل التلاوة</div>}
    </div>
  );
}

// بطاقة السورة الكاملة (أو مدًى متّصل): نصّ واحد متّصل بأرقام آيات ۝، وزرّ تلاوة واحد.
// النصّ من المصحف الكنسي حصراً؛ عند الفشل نعرض الاسم والمدى فقط (لا نصّ نموذج ولا ترميز خام).
function SurahCard({ num, from, to, onPlaySurah, onStopAudio }) {
  const [playing, setPlaying] = useState(false);
  const [audioFailed, setAudioFailed] = useState(false);
  const [body, setBody] = useState('');
  const [state, setState] = useState('loading'); // loading | ok | fail
  const [range, setRange] = useState({ from: 0, to: 0, whole: false });

  const sNum = resolveSurahNumber(undefined, num);
  const surahName = sNum ? SURAH_NAMES[sNum] : '';

  useEffect(() => {
    let alive = true;
    if (!sNum) { setState('fail'); return; }
    loadQuran()
      .then(() => {
        if (!alive) return;
        const count = getSurahAyahCount(sNum);
        if (!count) { setState('fail'); return; }
        let f = parseInt(from, 10); if (!(f >= 1)) f = 1;
        let t = parseInt(to, 10); if (!(t >= 1) || t > count) t = count;
        if (f > t) { setState('fail'); return; }
        setRange({ from: f, to: t, whole: f === 1 && t === count });
        const pieces = [];
        // البسملة (للسورة كاملة من الآية ١) — غير مرقّمة، إلا الفاتحة (آية ١) والتوبة (لا بسملة).
        // نُعيد استخدام نصّ البسملة الكنسي getVerseText(1,1) — لا نكتب نصّاً قرآنياً يدوياً.
        if (f === 1 && sNum !== 1 && sNum !== 9) {
          const basmala = getVerseText(1, 1);
          if (basmala) pieces.push(basmala);
        }
        let missing = false;
        for (let a = f; a <= t; a++) {
          const vt = getVerseText(sNum, a);
          if (!vt) { missing = true; break; }
          pieces.push(`${vt} ۝${toArabicDigits(a)}`); // آية + رقمها داخل زخرفة نهاية الآية
        }
        if (missing) { setState('fail'); return; }
        setBody(pieces.join(' '));
        setState('ok');
      })
      .catch(() => { if (alive) setState('fail'); });
    return () => { alive = false; };
  }, [sNum, from, to]);

  const metaLabel = !surahName ? ''
    : range.whole ? `سورة ${surahName}`
    : (range.from ? `سورة ${surahName}، الآيات ${toArabicDigits(range.from)}–${toArabicDigits(range.to)}` : `سورة ${surahName}`);

  const togglePlay = () => {
    if (!onPlaySurah) return;
    if (playing) {
      if (onStopAudio) onStopAudio();
      setPlaying(false);
      return;
    }
    setAudioFailed(false);
    setPlaying(true);
    Promise.resolve(onPlaySurah(sNum, range.from || 1, range.to || null))
      .then((res) => { setPlaying(false); if (res && res.failed) setAudioFailed(true); })
      .catch(() => { setPlaying(false); setAudioFailed(true); });
  };

  return (
    <div style={s.verseCard}>
      <div style={s.verseCardLabel}>
        <span>قَالَ اللهُ تَعَالَى{surahName ? ` — سُورَةُ ${surahName}` : ''}</span>
      </div>
      {state === 'ok' && <div style={s.surahText}>{body}</div>}
      <div style={s.verseFooter}>
        {metaLabel && <div style={s.verseMeta}>{metaLabel}</div>}
        {sNum && (
          <button
            type="button"
            onClick={togglePlay}
            style={s.versePlayBtn}
            aria-label={playing ? 'إيقاف التلاوة' : 'تشغيل التلاوة كاملة'}
          >
            {playing ? <PauseIcon size={14} /> : <PlayIcon size={14} />}
            <span>{playing ? 'إيقاف' : 'استمع للتلاوة (كاملة)'}</span>
          </button>
        )}
      </div>
      {audioFailed && <div style={s.verseAudioError}>تعذّر تحميل التلاوة</div>}
    </div>
  );
}

// بطاقة المصدر: شريحةُ عزوٍ قابلةٌ للنقر في نهاية الجواب — أوّلُ رابطٍ خارجيٍّ في التطبيق.
// تُظهِر اسمَ النطاق (site) ثمّ وصفاً عربيّاً موجزاً (المحتوى)، وتفتح url في تبويبٍ جديد.
function SourceCard({ site, url, content }) {
  // D92: this chip is the app's ONLY external navigation -- tapping it leaves for the system
  // browser (a Custom Tab in the standalone/TWA shell, which the web side cannot intercept, so
  // the decision has to be made here). Google's Families policy puts a parental gate exactly
  // here, and before D92 there was none. The hook sits above the missing-url early return so the
  // hook order is stable on every render.
  const [gate, setGate] = useState(null);
  // اسمُ النطاق للعرض: نُفضّل site، وإلا نشتقّه من رابط الصفحة إن أمكن.
  let host = (site || '').trim();
  if (!host && url) {
    try { host = new URL(url).hostname.replace(/^www\./, ''); } catch (e) { host = ''; }
  }
  const label = host || 'المصدر';
  const text = (content || '').trim() || host || url || '';
  const body = [
    <span key="site" style={s.sourceChipSite}>{label}</span>,
    text ? <span key="text" style={s.sourceChipText}>{text}</span> : null,
    <span key="arrow" style={s.sourceChipArrow} aria-hidden="true">↗</span>,
  ];
  // حمايةٌ من رابطٍ مفقود: بلا url نرسم شريحةً نصّيّةً غير قابلةٍ للنقر — لا <a href=""> أبداً.
  if (!url) {
    return <div style={s.sourceChip}>{body}</div>;
  }
  const chipStyle = { ...s.sourceChip, ...s.sourceChipLink };
  if (!(PARENTAL_GATE_ENABLED && childProfileActive())) {
    return (
      <a href={url} target="_blank" rel="noopener noreferrer" style={chipStyle}>
        {body}
      </a>
    );
  }
  // The href stays real, so long-press / copy-link still behave. Only the tap is intercepted:
  // the navigation happens in onPass, which is itself a button click, so no popup blocker fires.
  return (
    <>
      <a href={url} target="_blank" rel="noopener noreferrer" style={chipStyle}
        onClick={(e) => { e.preventDefault(); setGate({ a: 2 + Math.floor(Math.random() * 8), b: 2 + Math.floor(Math.random() * 8) }); }}>
        {body}
      </a>
      {gate && <AdultGate a={gate.a} b={gate.b}
        onPass={() => { setGate(null); try { window.open(url, '_blank', 'noopener,noreferrer'); } catch (e) {} }}
        onCancel={() => setGate(null)} />}
    </>
  );
}

function DhikrCard({ catId }) {
  const [items, setItems] = useState(null);
  const [title, setTitle] = useState('');
  const audioRef = useRef(null);
  const [playingId, setPlayingId] = useState(null);
  useEffect(() => {
    let alive = true;
    loadAdhkar()
      .then((db) => {
        if (!alive) return;
        const list = (db.byCat && db.byCat[parseInt(catId, 10)]) || [];
        setItems(list);
        if (list[0]) setTitle(list[0].category || '');
      })
      .catch(() => { if (alive) setItems([]); });
    return () => { alive = false; };
  }, [catId]);
  useEffect(() => () => { if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; } }, []);
  const toggle = (d) => {
    if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    if (playingId === d.id) { setPlayingId(null); return; }
    if (!d.audio) return;
    const a = new Audio(d.audio);
    audioRef.current = a;
    setPlayingId(d.id);
    a.onended = () => setPlayingId(null);
    a.onerror = () => setPlayingId(null);
    a.play().catch(() => setPlayingId(null));
  };
  if (items === null) return <div style={s.hadithCard}><div style={s.hadithText}>…</div></div>;
  if (items.length === 0) return null;
  return (
    <div style={s.hadithCard}>
      <div style={s.hadithCardLabel}>
        <span>{title || 'ذكر'} — حصن المسلم</span>
      </div>
      {items.map((d, i) => (
        <div key={d.id} style={{ marginBottom: i < items.length - 1 ? 10 : 0 }}>
          <div style={s.hadithText}>{d.text}</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 4, flexWrap: 'wrap' }}>
            {d.repeat > 1 && <span style={s.hadithMeta}>تُقال {toArabicDigits(d.repeat)} مرّات</span>}
            {d.audio && (
              <button type="button" onClick={() => toggle(d)} style={s.versePlayBtn} aria-label={playingId === d.id ? 'إيقاف' : 'استماع'}>
                {playingId === d.id ? <PauseIcon size={14} /> : <PlayIcon size={14} />}
                <span>{playingId === d.id ? 'إيقاف' : 'استماع'}</span>
              </button>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

function WorshipCard({ id, band }) {
  const [display, setDisplay] = useState(null);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    let alive = true;
    loadWorship()
      .then((d) => { if (alive) setDisplay(d); })
      .catch(() => { if (alive) setFailed(true); });
    return () => { alive = false; };
  }, []);
  // arm: byte-for-byte the prompt's own ternary (band === 'young'). A teen (13-17) takes the
  // ADULT arm. That is TODAY's behaviour — this commit changes ZERO policy.
  const arm = (band === 'young') ? 'young' : 'adult';
  // FAIL CLOSED: a missing cell renders a VISIBLE error, never model text, never empty silence.
  const errorCard = (why) => (
    <div style={{ background: 'var(--tint)', border: '1px solid var(--red)', borderRadius: 10, padding: '12px 14px', color: 'var(--red)', direction: 'ltr', textAlign: 'left', fontSize: 13, fontFamily: 'monospace' }}>

  if (failed) return errorCard('display fetch failed');
  if (display === null) return <div style={s.hadithCard}><div style={s.hadithText}>…</div></div>;
  const cell = display.cells && display.cells[id + ':' + arm];
  if (!cell || !cell.text) return errorCard('no cell for ' + id + ':' + arm);
  // Render cell.text VERBATIM: no markdown pass, no tashkeel pass, no age simplification,
  // no truncation, line breaks preserved (pre-wrap). The text is authored+guarded, not model output.
  return (
    <div style={s.stepsCard}>
      <div style={s.stepsCardLabel}>
        <ListCheckIcon size={12} color="var(--red)" />

      <div style={{ ...s.hadithText, whiteSpace: 'pre-wrap' }}>{cell.text}</div>

  );
}

// childVoiceBlocked reads its mirror. fail-closed: no readable profile => treat as a child, so a

function childProfileActive() {

// ONE PIN sheet, reached from two places: selecting a locked depth tier, and entering the
// call. The PIN is typed, POSTed once and discarded -- only the returned token is kept.
//
// The child barrier (CHILD_VOICE_ENABLED / childVoiceBlocked) sits ABOVE this sheet in every
// caller, so a child profile gets the "being prepared" notice and is never even offered the
// chance to unlock. This sheet is not the lock either: api/unlock.js rate-limits attempts and
// api/ask.js ignores an unearned tier regardless of what the UI shows.
function UnlockSheet({ onUnlocked, onBack }) {
  const [pin, setPin] = useState('');
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (busy || !pin) return;
    setBusy(true); setMsg('');
    try {
      const r = await fetch('/api/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ pin, deviceId: getDeviceId() }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d && d.token) { storeFounderToken(d.token); setPin(''); onUnlocked(); return; }
      // The SERVER owns the wording. A wrong code, a day lockout and an unreachable store are
      // three different truths and only it knows which -- so show its message verbatim and
      // never an invented generic line.
      setMsg((d && d.message) || '');
    } catch (e) {
      // A network failure carries no server message; leave the sheet up rather than invent a
      // second copy of wording the server owns.
      setMsg('');
    }
    setPin(''); setBusy(false);
  };
  return (
    <div style={s.onboardingContainer}>
      <div style={s.onboardingCard}>
        <div style={s.bigEmoji}>{'\uD83D\uDD10'}</div>
        <div style={s.onboardingTitle}>{'\u0627\u0644\u0631\u0645\u0632 \u0645\u0637\u0644\u0648\u0628'}</div>
        <div style={s.onboardingSubtitle}>{'\u0623\u062F\u062E\u0644 \u0631\u0645\u0632 \u0627\u0644\u0641\u062A\u062D \u0644\u0644\u0645\u062A\u0627\u0628\u0639\u0629.'}</div>
        <input type="password" inputMode="numeric" value={pin} onChange={(e) => setPin(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && submit()} placeholder="••••" autoFocus
          style={{ ...s.onboardingInput, textAlign: 'center', letterSpacing: '0.5em', borderColor: msg ? '#C44536' : '#E5EBF5' }} />
        {msg && <div style={{ color: '#C44536', fontSize: 14, marginTop: -8, marginBottom: 8, lineHeight: 1.8 }}>{msg}</div>}
        <button onClick={submit} disabled={busy} style={{ ...s.primaryBtn, opacity: busy ? 0.5 : 1 }}>{'\u0641\u062A\u062D'}</button>
        <button onClick={onBack} style={s.secondaryBtn}>{'\u0631\u062C\u0648\u0639'}</button>
      </div>
    </div>
  );
}

function Onboarding({ onStart }) {
  const [name, setName] = useState('');
  const [birthYear, setBirthYear] = useState('');
  const [gender, setGender] = useState(null);
  const toLatinDigits = (str) => String(str || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  // Neutral age screen (step 4a): we ask the BIRTH YEAR — a fact with no "right" answer —
  // never "are you an adult?". Age is DERIVED from it and passed on unchanged; the band
  // thresholds and profile shape stay untouched (startChat re-derives the same birthYear).
  const CUR_YEAR = new Date().getFullYear();
  const yearNum = parseInt(toLatinDigits(birthYear), 10);
  const derivedAge = CUR_YEAR - yearNum;
  const ageValid = Number.isInteger(yearNum) && derivedAge >= 4 && derivedAge <= 99;
  const canStart = !!(name.trim() && gender && ageValid);
  // D92: the parental gate is NOT an entry condition for anyone. Onboarding hands the derived
  // age straight to startChat -- no arithmetic at boot, on the chat, or for a teen/adult profile
  // at any point. The gate itself is untouched and still stands at the one real boundary a child
  // profile can cross: an external URL leaving the app (see SourceCard).
  const requestStart = (n) => {
    onStart(name, n, gender);
  };
  const submit = () => { if (canStart) requestStart(derivedAge); };
  return (
    <div style={s.welcomeContainer}>
      <div style={s.welcomeInner}>
        <div style={s.welcomeCard}>
        {/* S13.1b-welcome-single */}
        <div style={s.welcomeLogoSquare}>
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></svg>
        </div>
        <div style={s.welcomeTitle}>عزك</div>
        <div style={s.welcomeGreeting}>أهلاً بك</div>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="الاسم" style={s.welcomeInput} autoFocus />
        <div style={{ display: 'flex', gap: 12, marginBottom: 16 }}>
          <button onClick={() => setGender('male')} style={{ ...s.welcomePrimaryBtn, flex: 1, background: gender === 'male' ? 'var(--red)' : 'var(--white)', color: gender === 'male' ? '#FFF' : 'var(--ink)' }}>ذكر</button>
          <button onClick={() => setGender('female')} style={{ ...s.welcomePrimaryBtn, flex: 1, background: gender === 'female' ? 'var(--red)' : 'var(--white)', color: gender === 'female' ? '#FFF' : 'var(--ink)' }}>أنثى</button>
        </div>
        <input value={birthYear} onChange={(e) => setBirthYear(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') submit(); }} placeholder="سنة الميلاد — مثال ٢٠١٥" type="text" inputMode="numeric" pattern="[0-9]*" maxLength={4} style={s.welcomeInput} />
        {birthYear.trim() && !ageValid && <div style={{ color: 'var(--muted)', fontSize: 13, marginTop: -8, marginBottom: 12, textAlign: 'center' }}>اكتب سنةَ ميلادك بأربعة أرقام — مثل ٢٠١٥</div>}
        <button onClick={submit} disabled={!canStart} className="welcome-primary" style={{ ...s.welcomePrimaryBtn, opacity: canStart ? 1 : 0.4 }}>ابدأ</button>
        </div>
      </div>
    </div>
  );
}

function ParentGate({ pinInput, setPinInput, pinError, setPinError, onSuccess, onBack }) {
  const hasPin = (() => { try { return !!localStorage.getItem(PIN_HASH_KEY); } catch (e) { return false; } })();
  const [adultOk, setAdultOk] = useState(false);
  const [challenge] = useState(() => ({ a: 2 + Math.floor(Math.random() * 8), b: 2 + Math.floor(Math.random() * 8) })); // single digit, same as the welcome gate
  const [confirmPin, setConfirmPin] = useState('');
  const [errMsg, setErrMsg] = useState('رمز خاطئ');
  const fail = (msg) => { setErrMsg(msg); setPinError(true); setTimeout(() => setPinError(false), 1800); };
  const verify = async () => {
    try {
      const stored = localStorage.getItem(PIN_HASH_KEY);
      if (stored && (await hashPin(pinInput)) === stored) { onSuccess(); return; }
    } catch (e) {}
    fail('رمز خاطئ');
  };
  const create = async () => {
    if (!/^[0-9]{4,}$/.test(pinInput)) return fail('اختر ٤ أرقام على الأقل');
    if (pinInput !== confirmPin) return fail('الرمزان غير متطابقان');
    try { localStorage.setItem(PIN_HASH_KEY, await hashPin(pinInput)); } catch (e) { return fail('تعذّر الحفظ'); }
    setConfirmPin(''); onSuccess();
  };
  // D92: unchanged for a child profile -- this is a real boundary (the parents-only panel) and the
  // gate belongs here. An adult or teen profile setting its own PIN meets no arithmetic, per the
  // ruling that no teen or adult profile faces a challenge at any point.
  if (!hasPin && !adultOk && PARENTAL_GATE_ENABLED && childProfileActive()) return <AdultGate a={challenge.a} b={challenge.b} onPass={() => setAdultOk(true)} onCancel={onBack} />;
  return (
    <div style={s.onboardingContainer}>
      <div style={s.onboardingCard}>
        <div style={s.bigEmoji}>🔒</div>
        <div style={s.onboardingTitle}>{hasPin ? 'لوحة الأهل' : 'إنشاء رمز لوحة الأهل'}</div>
        <div style={s.onboardingSubtitle}>{hasPin ? 'أدخل رمز الدخول' : 'اختر رمزاً من ٤ أرقام على الأقل — لن يُعرض، فاحفظه في مكان آمن'}</div>
        <input type="password" inputMode="numeric" value={pinInput} onChange={(e) => setPinInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && hasPin && verify()} placeholder="••••" style={{ ...s.onboardingInput, textAlign: 'center', letterSpacing: '0.5em', borderColor: pinError ? '#C44536' : '#E5EBF5' }} autoFocus />
        {!hasPin && <input type="password" inputMode="numeric" value={confirmPin} onChange={(e) => setConfirmPin(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && create()} placeholder="أعد الرمز" style={{ ...s.onboardingInput, textAlign: 'center', letterSpacing: '0.5em', borderColor: pinError ? '#C44536' : '#E5EBF5' }} />}
        {pinError && <div style={{ color: '#C44536', fontSize: 14, marginTop: -8, marginBottom: 8 }}>{errMsg}</div>}
        <button onClick={hasPin ? verify : create} style={s.primaryBtn}>{hasPin ? 'دخول' : 'حفظ الرمز'}</button>
        <button onClick={onBack} style={s.secondaryBtn}>رجوع</button>
      </div>
    </div>
  );
}

// قفل الإنفاق — مطالبةٌ بسيطة على نمط لوحة الأهل. تُقارَن بصمة SHA-256 للرمز المُدخَل
// بالثابت SPEND_GATE_SHA256؛ لا يُخزَّن الرمز نفسه أبداً. النجاح يفتح القفل ويُحفَظ لهذا الجهاز.

// D88 -- the settings sheet. It carries .theme-dark itself so it is themed by the same scoped
// palette the chat uses; reached from the drawer's gear. The choice is written through
// applyTheme, the one code path that also runs at boot, and persisted immediately.
function SettingsSheet({ theme, onTheme, onBack, onOpenControl, a11y, onA11y, onA11yReset }) {
  // S90 -- التحكم. The single row that leads to the parental area, and the ONLY thing left in
  // the app that opens the PIN gate. Everything above it -- the theme/dark choice and the
  // interface style -- is reached without a PIN, which is the whole point of this screen: a
  // parent's lock is not a lock on the appearance of the app. The label is built from escapes in
  // a JS expression, never a quoted JSX attribute, so the file stays ASCII-safe either side.
  const A_CONTROL = '\u0627\u0644\u062A\u062D\u0643\u0645';   // U+0627 U+0644 U+062A U+062D U+0643 U+0645
  // D89: this entry is rendered ONLY while a valid founder token is held. hasFounderToken() is
  // read here, at render, and never from a cached flag -- the rule every other gate in this file
  // follows. It is a VISIBILITY rule, not the lock: api/unlock.js refuses a set-pin call that
  // arrives without a token no matter what this UI chooses to draw.
  const canSetPin = hasFounderToken();
  const [pin1, setPin1] = useState('');
  const [pin2, setPin2] = useState('');
  const [pinMsg, setPinMsg] = useState('');
  const [pinBusy, setPinBusy] = useState(false);
  const savePin = async () => {
    if (pinBusy) return;
    // The ONLY check made here, because the server is sent one value and never sees the second
    // field. Length, shape and authorisation are the server's to judge and the server's to word.
    if (pin1 !== pin2) { setPinMsg('\u0627\u0644\u0631\u0645\u0632\u0627\u0646 \u063A\u064A\u0631 \u0645\u062A\u0637\u0627\u0628\u0642\u064A\u0646.'); return; }
    setPinBusy(true); setPinMsg('');
    try {
      const r = await fetch('/api/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...capHeaders() },   // carries the founder token
        credentials: 'same-origin',
        body: JSON.stringify({ action: 'set-pin', pin: pin1, deviceId: getDeviceId() }),
      });
      const d = await r.json().catch(() => ({}));
      const good = r.ok && d && d.ok === true;
      // The SERVER owns every refusal's wording: a missing token, a short code and an
      // unreachable store are three different truths and only it knows which.
      setPinMsg(good ? '\u062A\u0645 \u062A\u063A\u064A\u064A\u0631 \u0627\u0644\u0631\u0645\u0632.' : ((d && d.message) || ''));
      if (good) { setPin1(''); setPin2(''); }
    } catch (e) {
      setPinMsg('');   // a network failure carries no server message; do not invent one
    }
    setPinBusy(false);
  };
  const Opt = ({ value, label }) => (
    <button
      onClick={() => onTheme(value)}
      aria-pressed={theme === value}
      style={{ ...s.themeOpt, ...(theme === value ? s.themeOptActive : {}) }}
    >
      <span style={{ ...s.themeSwatch, background: value === 'dark' ? '#171B24' : '#FFFFFF', borderColor: value === 'dark' ? '#2A313D' : '#E5EBF5' }} />
      <span>{label}</span>
    </button>
  );
  // Session 85/86 -- the INTERFACE STYLE choice. ONE compact card, in the position it has held
  // since it was added: immediately after the theme card. Not one other Settings control moved,
  // changed or lost a style key. The value is device-local and presentational: it is written
  // with writeEzikUiStyle and read with useEzikUiStyle, and it is never placed in a request, a
  // payload or an analytics call. Session 86 widened only its MEANING -- one press now restyles
  // the home screen and the adhkar screens together, because they read this same key.
  const uiStyle = useEzikUiStyle();
  // Two native radio semantics expressed on buttons: one radiogroup, aria-checked on each, and
  // the choice applies on the press -- the hook repaints this row, the home screen, the browse
  // screen and the reader from the same event, with no reload and no remount of the app.
  const StyleOpt = ({ value, label, preview }) => (
    <button type="button" role="radio" aria-checked={uiStyle === value ? 'true' : 'false'}
      onClick={() => writeEzikUiStyle(value)}
      style={uiStyle === value ? { ...s.designOpt, ...s.designOptOn } : s.designOpt}>
      <span style={s.designPrev} aria-hidden="true">{preview}</span>
      <span style={s.designOptLabel}>{label}</span>
      <span style={uiStyle === value ? { ...s.designDot, ...s.designDotOn } : s.designDot} aria-hidden="true" />
    </button>
  );
  // The two previews are CSS ONLY -- bordered and filled boxes, no image, no data URI, nothing
  // to fetch. Left: a ring and a path of alternating nodes. Right: three stacked cards.
  const PREV_JOURNEY = (
    <span style={s.prevBox}>
      <span style={s.prevRing} />
      <span style={{ ...s.prevNode, top: 26, right: 8 }} />
      <span style={{ ...s.prevNode, top: 40, left: 8 }} />
      <span style={{ ...s.prevNode, top: 54, right: 8 }} />
      <span style={s.prevLine} />
    </span>
  );
  // S100 -- the INDEPENDENT visual-identity control. Its own hook, its own writer, its own
  // radiogroup; it shares only the presentation keys with the layout row above it, and it
  // does not read, write or reset either the mode choice or the layout choice.
  const visualTheme = useEzikVisualTheme();
  const VtOpt = ({ value, label, preview }) => (
    <button type="button" role="radio" aria-checked={visualTheme === value ? 'true' : 'false'}
      onClick={() => writeEzikVisualTheme(value)}
      style={visualTheme === value ? { ...s.designOpt, ...s.designOptOn } : s.designOpt}>
      <span style={s.designPrev} aria-hidden="true">{preview}</span>
      <span style={s.designOptLabel}>{label}</span>
      <span style={visualTheme === value ? { ...s.designDot, ...s.designDotOn } : s.designDot} aria-hidden="true" />
    </button>

  // The two identity previews, and they show the LIGHT face of each theme on purpose: a plain

  // is the one thing a user would otherwise only discover after switching. CSS only: no

    </span>
  );
  const PREV_ISTANA = (
    <span style={{ ...s.vtpBox, ...s.vtpIBox }}>
      <span style={s.vtpIBar} />
      <span style={s.vtpICard}><span className="vtp-motif vtp-motif-i" /></span>
    </span>
  );
  const PREV_DECK = (
    <span style={s.prevBox}>
      <span style={{ ...s.prevCard, top: 10, left: 16, right: 16 }} />
      <span style={{ ...s.prevCard, top: 22, left: 10, right: 10 }} />
      <span style={{ ...s.prevCard, top: 34, left: 4, right: 4, height: 26 }} />
    </span>
  );
  return (

            stored PIN is read, displayed or defaulted into either box -- the client has no way
            to learn the current one and does not ask for it. */}
        {canSetPin && (
        <div style={{ ...s.settingsCard, marginTop: 12 }}>

          <input type="password" inputMode="numeric" autoComplete="new-password" value={pin2}
            onChange={(e) => setPin2(e.target.value)}

            placeholder={'\u062A\u0623\u0643\u064A\u062F \u0627\u0644\u0631\u0645\u0632'} style={s.settingsInput} />

// ============================================================
// Live call screen (Layer 2 — one automatic turn; presentational, driven by App state)
// ============================================================
// callState is owned by App and driven by real audio events (tap → listening → thinking →
// speaking → idle). The avatar is tap-to-talk; Mute gates the mic. No audio logic lives here.
function CallScreen({ profileName, gender, callState, heard, isMuted, error, onToggleMute, onTalk, onExit }) {
  // Accessibility: respect reduced-motion — fall back to a static (non-pulsing) ring.
  const reduceMotion = (typeof window !== 'undefined' && window.matchMedia)
    ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;

  const STATES = {
    idle:      { label: 'اضغط للتحدّث',       ring: 'rgba(255, 255, 255, 0.35)', speed: '3.6s' },
    listening: { label: 'أستمع إليك...',     ring: '#3FA66A',                 speed: '2.4s' },
    thinking:  { label: 'لحظة...',            ring: 'rgba(42, 166, 222, 0.55)', speed: '3.2s' },
    speaking:  { label: gender === 'female' ? 'عزك تتحدّث...' : 'عزك يتحدّث...',  ring: '#2AA6DE',                 speed: '1.2s' },
  };
  const cs = STATES[callState] || STATES.idle;

  const ringStyle = {
    ...s.callRing,
    borderColor: cs.ring,
    animation: reduceMotion ? 'none' : `callPulse ${cs.speed} ease-in-out infinite`,
  };

  // Layer 3: the avatar stays tappable while the tutor is thinking/speaking — tapping there is the
  // manual interrupt ("my turn"). Disabled only when muted, or during 'listening' (no-op as before).
  const canTalk = !isMuted && (callState === 'idle' || callState === 'thinking' || callState === 'speaking');

  return (
    <div style={s.callContainer}>
      <div style={s.callTopLabel}>{gender === 'female' ? 'مكالمة مع عزك' : 'مكالمة مع عزك'}</div>
      <div style={{ textAlign: 'center', maxWidth: 320, padding: '6px 16px 0', fontSize: 12, lineHeight: 1.5, color: 'rgba(255, 255, 255, 0.6)' }}>تتحدّث إلى ذكاءٍ اصطناعيّ — لا إلى إنسان.</div>
      <div style={s.callCenter}>
        <div style={{ ...s.callAvatarWrap, cursor: canTalk ? 'pointer' : 'default' }} onClick={canTalk ? onTalk : undefined}>
          <div style={ringStyle} />
          <div style={s.callAvatar}><MoonStarsIcon size={56} color="#2AA6DE" /></div>
        </div>
        {profileName && <div style={s.callSubLabel}>{profileName}</div>}
        {/* Live feedback: what the mic is hearing (interim). Empty when not listening. */}
        <div style={s.callHint}>{callState === 'listening' && heard ? heard : (isMuted ? 'الميكروفون مكتوم' : '')}</div>
        {/* A failure that cannot be seen is a failure that reads as "the app just does nothing".
            Rendered on the DARK call background, so it carries its own light-on-red styling
            rather than reusing the chat banner. */}
        {error ? <div style={s.callErrorBanner} role="alert">{error}</div> : null}
      </div>
      <div style={s.callControls}>
        <button onClick={onToggleMute} style={s.callMuteBtn}>
          {isMuted ? <MicOffIcon size={24} color="#12327A" /> : <MicIcon size={24} color="#12327A" />}
          <span style={s.callBtnLabel}>{isMuted ? 'مكتوم' : 'كتم'}</span>
        </button>
        <button onClick={onExit} style={s.callEndBtn}>
          <PhoneOffIcon size={24} color="#FFFFFF" />
          <span style={{ ...s.callBtnLabel, color: '#FFFFFF' }}>إنهاء</span>
        </button>
      </div>
    </div>
  );
}

/* 14.1 */
// Standalone mushaf reader. NOT part of MemorizeScreen -- separate tile, separate screen.
// Reuses SurahCard verbatim: it already loads the mushaf, sources the basmalah from
// getVerseText(1,1) (never hand-written), skips it for al-Fatiha (it IS ayah 1) and
// at-Tawbah (it has none), stamps every ayah with U+06DD + its Arabic-Indic number, and
// carries the full-surah recitation button. No new Quran-text path is introduced here.
/* 14.2 */
// صفحةٌ واحدةٌ من المصحف. كلُّ خانةٍ في التخطيط تُجلب كلمتَها من المصحف المحروس.
/* 14.2f2 */
// ضبطُ السطر — وهو ما يجعل الصفحة مصحفاً لا نصّاً.
// كلُّ كلمةٍ عنصرُ flex مستقلّ، و justify-content:space-between يفرد ما بينها حتى
// يمتدّ السطرُ من حافةٍ لحافة. وكان لنا حجمٌ واحدٌ للصفحة يُقاس بأضيقِ سطرٍ فيها،
// فيَنقُص ما سواه عن عرضه ويُملأ الفارقُ فراغاً. الآن لكلِّ سطرٍ حجمُه: يفي بعرضه
// بحروفه لا بفراغه، والتفاوتُ بين أسطر الصفحة محصورٌ بـ+١٨٪ فوق أصغرها — فلا
// يصغر سطرٌ عمّا كان، ولا تتبعثر الصفحة. ولا يلتفّ سطرٌ أبداً، ولا يُقصّ حرف.
// القياس يجري قبل الرسم (useLayoutEffect) فلا تُرى قفزة. ولو فشل القياس لأيّ
// سبب، نرسم بحجم الأساس — مقروءاً. لا نُخفي المصحف أبداً.
const PG_BASE_FS = 22;    // حجمُ القياس. النتيجة تُشتقّ منه ولا يُستعمل كما هو.
const PG_GAP_EM = 0.22;   // أدنى فجوةٍ بين كلمتين، نسبةً للخطّ (تكبر وتصغر معه)
const PG_LINE_H = 1.75;   // ارتفاعُ السطر. يدخل في حساب السقف الرأسيّ وفي النمط معاً.
// خطُّ المصحف في موضعٍ واحد: يستعمله النمطُ المرسوم والقياسُ الخفيّ معاً. لو افترقا
// بحرفٍ لقِسنا خطّاً ورسمنا آخر، وسقط الثابتُ العالميّ كلُّه بصمت. لا خطَّ جديداً هنا.
const PG_FONT = "'Amiri Quran', 'Amiri', serif";

/* Session 51 -- ONE font size for all 604 pages.
 * ---------------------------------------------------------------------------
 * الحجمُ كان يُشتقّ من أضيق سطرٍ *داخل الصفحة الواحدة*، فاختلف من صفحةٍ لصفحة:
 * النساء ٧٩ كبيرةٌ والتين ٥٩٧ صغيرة. والمصحفُ المطبوع حجمُه واحدٌ في الـ٦٠٤.
 * فصار المقياسُ عالمياً: أعرضُ أسطر المصحف كلِّه تُقاس مرّةً واحدة، ومنها ثابتٌ
 * واحد K يحكم كلَّ صفحة. القياسُ مرّةٌ لكلّ جلسةٍ (ولكلّ عرضِ حاوية)، لا مرّةً
 * لكلّ صفحة: فتحُ صفحةٍ لا يقيس مئةً وخمسين سطراً، بل يقرأ K المخزَّن.
 */
const PG_CAND_N = 150;    // عددُ المرشّحين. ١٥٠ لا ٤٠: تقديرُ المحارف تقريبيٌّ للعربية
const PG_AVG_CH = 0.5;    // عرضُ المحرف الوسطيّ بالـem — لتحويل الفجوة إلى «محارف»
let PG_K = null;          // الثابتُ العالميّ: أكبرُ تكبيرٍ يسعه أعرضُ سطرٍ في المصحف
let PG_K_BOX = 0;         // العرضُ الذي قيس عنده. اختلافُه ⟹ إبطالٌ وإعادةُ قياس
let PG_K_MS = 0;          // كلفةُ القياس الأولى بالمللي ثانية — للتقرير لا للمنطق
const PG_GUARD_PAGES = new Set();   // صفحاتٌ اضطرّ فيها حارسُ الفيض لتصغيرٍ خاصّ

// العلاماتُ لا تُقدّم القلم، فلا تدخل في كلفة السطر. (الحركاتُ · الصغرى · علاماتُ الوقف)
const pgAdvChars = (t) => {
  let n = 0;
  for (const ch of t) {
    const u = ch.codePointAt(0);
    if (!((u >= 0x064b && u <= 0x065f) || u === 0x0670 || (u >= 0x06d6 && u <= 0x06ed))) n++;
  }
  return n;
};

// خاناتُ السطر ← ما يُرسم فيه فعلاً. مصدرٌ واحدٌ للتصيير وللقياس معاً: لو افترقا
// لقِسنا سطراً غيرَ الذي نرسم. كلُّ حرفٍ من __quranData وحده — لا نصَّ بأيدينا.
const pgLineTokens = (ln) => {
  const parts = [];
  if (!ln || !ln.w) return parts;
  for (const loc of ln.w) {
    const a = loc.split(':');
    const sn = parseInt(a[0], 10), an = parseInt(a[1], 10), wi = parseInt(a[2], 10);
    const words = wordsOfAyah(sn, an);
    const w = words[wi - 1];
    if (w === undefined) continue;                 // لا يقع — ٧٧٤٢٩/٧٧٤٢٩ مبرهَنة
    parts.push(w);
    if (wi === words.length) parts.push('۝' + toArabicDigits(an));  // آخرُ كلمةٍ ← رقمُ الآية
  }
  return parts;
};

// زائدَ فجواتِه محسوبةً بالمحارف. تقديرٌ تقريبيّ يُرتّب فقط؛ الحكمُ للقياس الحقيقيّ

      <path d="M8 5.6 L10.4 8 L8 10.4 L5.6 8 Z" fill="var(--red-lift)" />
    </svg>
  );
  // Centre the motif on the outer rule's corner: half its own size beyond the band.
  const off = -(MUSHAF_FRAME_BAND + MUSHAF_CORNER_PX / 2);
  return (
    <React.Fragment>
      {at({ top: off, left: off })}
      {at({ top: off, right: off })}
      {at({ bottom: off, left: off })}
      {at({ bottom: off, right: off })}
    </React.Fragment>
  );
}

function MushafSheet({ page, headerSurah, needHeader, needBasmala, onSheetLoad }) {
  const [broke, setBroke] = useState(false);
  // 78 -- the prototype's own latch, and it is a SECOND one on purpose. The fallback chain
  // is three deep and each step owns its own failure:
  //   printed page image  --onError-->  official SVG page  --onError-->  verified text
  // Both useState calls run before every branch, so hook order is identical on all three.
  const [imgBroke, setImgBroke] = useState(false);
  // 81 -- unconditional, and before every branch, exactly like the two latches above: the
  // hook order is identical on all three renderers whichever one this sheet takes.
  const fill = useMadinaFill();
  const madina = madinaImgUrl(page.n);
  if (madina && !imgBroke)
    return (
      <div style={MADINA_SHEET_ST}>
        <img
          src={madina}
          alt=""
          decoding="async"
          loading="lazy"
          draggable="false"
          style={fill ? MADINA_IMG_ST : MADINA_IMG_ST_FIT}
          onLoad={() => { if (onSheetLoad) onSheetLoad(page.n); }}
          onError={() => setImgBroke(true)}
        />
      </div>
    );
  if (!MUSHAF_SVG_ON || broke)
    return <MushafPage page={page} headerSurah={headerSurah} needHeader={needHeader} needBasmala={needBasmala} />;
  // No interaction of any kind: pointerEvents none lets the strip keep the drag (the touch
  // handlers sit on pgViewport and the events pass straight through), draggable false kills
  // the native image drag. No onClick, no ayah tap, no selection. Phase one is a still page.
  // 75/D -- the frame is the positioning anchor and the ratio holder; the sheet inside it is the
  // crop window. The two rules come FIRST in DOM order on purpose: their paper tone is then
  // painted BEHIND the page image and can never sit over it. The corner motifs come last, and
  // they paint only outside the crop window.
  return (
    <div className="mushaf-paper" style={s.svgFrame}>
      <div style={s.svgRuleOuter} />
      <div style={s.svgRuleInner} />
      <div style={s.svgSheet}>
        <img
          src={mushafSvgUrl(page.n)}
          alt=""
          decoding="async"
          draggable="false"
          style={s.svgImg}
          onLoad={() => { if (onSheetLoad) onSheetLoad(page.n); }}
          onError={() => setBroke(true)}
        />
      </div>
      <SheetCorners />
    </div>
  );
}

function MushafPage({ page, headerSurah, needHeader, needBasmala }) {
  const ref = useRef(null);
  const [fit, setFit] = useState(null);   // null = لم يُقَس بعد

  React.useLayoutEffect(() => {
    if (fit) return;
    const el = ref.current;
    if (!el) return;
    // (أ) عرضُ الخانة من الصفحة نفسِها، ثمّ الثابتُ العالميّ. لا يُقاس هنا سطرٌ
    // واحدٌ لأجل الحجم: K محسوبٌ مرّةً لكلّ الجلسة، وفتحُ الصفحة يقرأه فحسب.
    const rows = el.querySelectorAll('[data-l]');
    let box = 0;
    for (let r = 0; r < rows.length; r++) { const b = rows[r].clientWidth; if (b > box) box = b; }
    if (!box) return;                                  // لم تُقَس خانةٌ ← ابقَ على الأساس
    const K = pgMeasureK(box);
    if (K === null) return;                            // عجز القياسُ ← ابقَ على الأساس
    // (ب) حجمٌ واحدٌ للمصحف كلِّه. الـ٠٫٩٩ هامشُ التقريب نفسُه الذي كان.
    let uni = Math.max(8, Math.min(40, Math.floor(PG_BASE_FS * K * 0.99)));
    // (ج) حارسُ الفيض — الثابتُ الذي لا يُخرَق. أضيقُ نسبةٍ في هذه الصفحة بعينها،
    // مقيسةً من الـDOM لا مقدَّرة. إن كانت دون العالميّ فالسطرُ سيفيض بالعالميّ،
    // فتُصغَّر هذه الصفحةُ وحدَها إلى ما يسعها. K لا يُمَسّ: صفحةٌ شاذّةٌ لا تحكم ٦٠٤.
    let guard = Infinity;
    for (let r = 0; r < rows.length; r++) {
      const kids = rows[r].children;
      const b = rows[r].clientWidth;
      if (!b || !kids.length) continue;
      let content = 0;
      for (let k = 0; k < kids.length; k++) content += kids[k].offsetWidth;
      content += (kids.length - 1) * (PG_BASE_FS * PG_GAP_EM);
      if (!(content > 0)) continue;
      const f = PG_BASE_FS * (b / content);
      if (f < guard) guard = f;
    }
    if (isFinite(guard) && guard > 0) {
      const g = Math.max(8, Math.min(40, Math.floor(guard * 0.99)));
      if (g < uni) { uni = g; PG_GUARD_PAGES.add(page.n); }
    }
    // (د) الملاءمة الرأسيّة: مجموعُ الأسطر بالحجم الواحد، مضافاً إليه ارتفاعُ ما ليس
    // سطراً (رأسٌ · بسملةٌ · فاصل) كما قيس من الـDOM. فإن فاض ضُرب الحجمُ بنسبةٍ
    // واحدة — والصفحةُ تصغر معاً ولا ينكسر تناسبُها.
    const kidsPage = el.children;
    let otherH = 0;
    for (let c = 0; c < kidsPage.length; c++)
      if (!kidsPage[c].hasAttribute('data-l')) otherH += kidsPage[c].offsetHeight;
    const room = el.clientHeight;
    const total = rows.length * uni * PG_LINE_H * 1.06 + otherH;
    if (room > 0 && total > room)
      uni = Math.max(8, Math.min(40, Math.floor(uni * (room / total) * 0.99)));
    // (هـ) الفائضُ الرأسيّ — كما استقرّ في c4393fe بلا تغيير في جوهره. الحجمُ يُقاس
    // بالعرض وحده، فيبقى في الطول فائضٌ في أكثر الصفحات. توزيعُه فراغاً يبعثر السطور،
    // وتكويمُه فوق وتحت يترك الإطارَ خاوياً — والوجهُ استهلاكُه: يرتفع تباعدُ السطر
    // وحدَه حتى يملأ النصُّ إطارَه، ولا يُمَسّ الحجم.
    // السقفُ ٢٫٠× قاطعٌ — رُفع من ١٫٥× في ١٤٫٥. الورقةُ لمّا صارت تملأ خانتَها اتّسع
    // ما تحتها من فائض، وكان السقفُ القديم يردُّه فراغاً مكوَّماً داخل الإطار؛ فرفعُه
    // يصرفه تباعداً بين السطور. ولا يُجاوز ٢٫٠ بحال: بلا سقفٍ تنفرط الصفحةُ الشحيحة —
    // سطران في خانةٍ كاملة — إلى سطرين متباعدين لا يُقرآن نصّاً واحداً.
    // avail يطرح حشوةَ الصفحة، بخلاف room أعلاه: زيادةُ التباعد لا تصغّر حجماً، أمّا
    // مسُّ room فيغيّر ما تحكم به الملاءمةُ الرأسيّة.
    let lead = PG_LINE_H;
    let pad = 0;
    try {
      const cs = window.getComputedStyle(el);
      pad = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    } catch (e) { pad = 0; }
    const avail = room - pad;
    const textH = rows.length * uni * PG_LINE_H * 1.06 + otherH;
    if (avail > 0 && textH > 0 && textH < avail) lead = Math.min(PG_LINE_H * 2.0, PG_LINE_H * (avail / textH));
    // البسملةُ تتبع الحجمَ الواحد — ولم يعد ثَمَّ وسيطٌ تتبعه، فالأسطرُ كلُّها سواء.
    setFit({ uni, lead, basmala: Math.round(uni * 0.92) });
  }, [fit]);

  // قبل القياس تُرسم الصفحة كلُّها بحجم الأساس مفرودةً — وهي حالةُ القياس نفسها.
  const basmalaFs = fit ? fit.basmala : Math.round(PG_BASE_FS * 0.92);
  const out = [];
  const done = {};   /* 14.2f4 */  // رأسٌ حُقن لهذه السورة على هذه الصفحة — فلا يُحقن مرّتين
  for (let i = 0; i < page.l.length; i++) {
    const ln = page.l[i];
    if (ln.t === 't') {
      // سطرٌ يفتتح سورةً بلا بسملةٍ في المصدر (٨١ و٨٥) ← الرأسُ ثمّ البسملةُ فوقه.
      // أمّا السور التي للمصدر بسملتُها (١٠ و٨٢ و٨٦) فرأسُها يُحقن عند سطر البسملة
      // نفسِه، فوقَه — لا هنا. وإلّا نزل الرأسُ تحت البسملة، وانقلب ترتيبُ المصحف.
      const op = ln.w[0].split(':');
      if (op[1] === '1' && op[2] === '1') {
        const sn0 = parseInt(op[0], 10);
        if (needHeader && needHeader[sn0] && !done[sn0]) {
          done[sn0] = 1;
          out.push(<div key={'h' + i} style={s.pgHeader}>{'سُورَةُ ' + SURAH_NAMES[sn0]}</div>);
        }
        if (needBasmala && needBasmala[sn0])
          out.push(<div key={'b' + i} style={{ ...s.pgBasmala, fontSize: basmalaFs }}>{getVerseText(1, 1) || ''}</div>);
      }
      // نفسُ الدالّة التي بها اختير المرشّحون وقيسوا — فلا يفترق المرسومُ عن المقيس.
      const parts = pgLineTokens(ln);
      // حجمٌ واحدٌ لكلّ سطرٍ في الصفحة، وهو نفسُه في الـ٦٠٤ إلا حيث عمل الحارس.
      // و space-between دائماً بلا استثناء: السطرُ يمتدّ من حافةٍ لحافة كالمطبوع.
      const lfs = fit ? fit.uni : PG_BASE_FS;
      out.push(
        <div key={i} data-l={i} style={{ ...s.pgLine, fontSize: lfs, lineHeight: fit ? fit.lead : PG_LINE_H, gap: PG_GAP_EM + 'em' }}>
          {parts.map((p, j) => <span key={j} style={s.pgWord}>{p}</span>)}
        </div>
      );
    } else if (ln.t === 'h') {
      const sn = headerSurah[page.n + ':' + ln.n];
      out.push(<div key={i} style={sn ? s.pgHeader : s.pgBlank}>{sn ? 'سُورَةُ ' + SURAH_NAMES[sn] : ''}</div>);
    } else {
      // ترتيبُ المصحف لا يُقلب: الرأسُ، ثمّ البسملةُ، ثمّ أوّلُ آية.
      // فإن كانت هذه بسملةَ سورةٍ أسقط المصدرُ رأسَها (١٠ يونس · ٨٢ الانفطار · ٨٦ الطارق)
      // حُقن الرأسُ هنا — فوقها. سورةُ البسملة تُشتقّ من أوّل خانةٍ بعدها، لا من لافتة.
      let sb = 0;
      for (let j = i + 1; j < page.l.length; j++) {
        const nx = page.l[j];
        if (nx.t !== 't' || !nx.w || !nx.w.length) continue;
        const b0 = nx.w[0].split(':');
        if (b0[1] === '1' && b0[2] === '1') sb = parseInt(b0[0], 10);
        break;
      }
      if (sb && needHeader && needHeader[sb] && !done[sb]) {
        done[sb] = 1;
        out.push(<div key={'h' + i} style={s.pgHeader}>{'سُورَةُ ' + SURAH_NAMES[sb]}</div>);
      }
      // البسملة من getVerseText(1,1) — لا نكتب نصّاً قرآنياً بيدنا أبداً.
      out.push(<div key={i} style={{ ...s.pgBasmala, fontSize: basmalaFs }}>{getVerseText(1, 1) || ''}</div>);
    }
  }
  // 14.5 — الورقةُ تملأ خانتَها ولا تعانق نصَّها. عناقُ الأمس كان يهبط بالإطار إلى طول
  // المحتوى فيترك فوقه وتحته شريطَين من لون الخلفيّة — ١٠٩px فوق و١٠٤px تحت في ٥٠٦
  // صفحاتٍ من الـ٦٠٤. فالإطارُ الآن ١٠٠٪ في الحالين، والفراغُ يسكن داخلَه لا حولَه:
  // justifyContent:center يوسّط الكتلةَ بين حاشيتين متساويتين، والمعيَّنُ مسمورٌ في القدم.
  // ولأنّ الطولَ لم يعد يتبدّل بعد القياس، فحالةُ القياس هي حالةُ العرض نفسُها — وهذا
  // أمتنُ ممّا كان: room يُقرأ من الخانة التي سيسكنها النصُّ فعلاً، لا من خانةٍ ستنكمش.
  const frameSt = s.pgFrame;
  const pageSt = s.pgPage;
  return (
    <div style={frameSt}>
      <div ref={ref} style={pageSt}>{out}</div>
      <PageDecor n={page.n} />
    </div>
  );
}

// Session 51 -- the page dressing: four corner brackets and the page medallion.
// It hangs off the frame WRAPPER, never off pgPage. The fit measurement divides by
// pgPage's element-child count (byHeight, ~4900), so a decorative child inside the page
// would silently shrink the Quran text on every page. pointerEvents:none throughout --
// the page drag belongs to the viewport and must pass straight through the ornament.
function PageDecor({ n }) {
  const corner = (extra) => (
    <svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="var(--red-lift)" strokeWidth="1.2" strokeLinecap="round" aria-hidden="true" style={{ position: 'absolute', pointerEvents: 'none', ...extra }}>
      <path d="M13 1H4a3 3 0 0 0-3 3v9" />
    </svg>
  );
  return (
    <React.Fragment>
      {corner({ top: 3, left: 3 })}
      {corner({ top: 3, right: 3, transform: 'scaleX(-1)' })}
      {corner({ bottom: 3, left: 3, transform: 'scaleY(-1)' })}
      {corner({ bottom: 3, right: 3, transform: 'scale(-1,-1)' })}
      <div style={s.pgMedal}>{toArabicDigits(n)}</div>
    </React.Fragment>
  );
}

// Session 51 -- the mushaf bookmark (the thread). One flat device key: the child profile
// carries no stable identifier, and adding one for this feature is out of scope. The key is
// cleared alongside the other three in resetAll, so a wiped profile inherits no bookmark.
const MUSHAF_BOOKMARK_KEY = 'mushaf_bookmark_v1';
// Returns null on the slightest doubt -- missing key, damaged JSON, non-integer or
// out-of-range page or surah -- and never surfaces an error to the reader.
function readMushafBookmark() {
  try {
    const raw = localStorage.getItem(MUSHAF_BOOKMARK_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || typeof o !== 'object') return null;
    if (!Number.isInteger(o.p) || o.p < 1 || o.p > 604) return null;
    if (!Number.isInteger(o.s) || o.s < 1 || o.s > 114) return null;
    return { p: o.p, s: o.s };
  } catch (e) { return null; }
}
function writeMushafBookmark(pg, sr) {
  try { localStorage.setItem(MUSHAF_BOOKMARK_KEY, JSON.stringify({ p: pg, s: sr })); } catch (e) {}
}

// ---------------------------------------------------------------------------
// Session 82 -- THE THREAD THAT PLACES ITSELF, and the daily wird beside it.
//
// Three device-local keys, and all three are device-local ONLY. Nothing below is read by
// any request builder, no value here is ever attached to a prompt, a header or a body, and
// no network call exists anywhere in this block. resetAll removes all three.
//
// The manual bookmark above is UNTOUCHED and stays the reader's own deliberate mark: it is
// written by one button and by nothing else. The last page is the opposite kind of thing --
// the app remembers where you were whether you asked it to or not -- so it gets its own key,
// its own reader, its own writer and its own row. The two never share storage or a glyph.
// ---------------------------------------------------------------------------
const MUSHAF_LAST_PAGE_KEY = 'mushaf_last_page_v1';
// Same shape as the bookmark and the same refusal to guess: any doubt at all -- no key,
// damaged JSON, a non-object, a non-integer or an out-of-range page or surah -- returns
// null, and the resume row simply is not drawn. Read and parse are wrapped SEPARATELY so a
// storage that throws on getItem is answered before JSON is ever asked anything.
function readMushafLastPage() {
  let raw = null;
  try { raw = localStorage.getItem(MUSHAF_LAST_PAGE_KEY); } catch (e) { return null; }
  if (!raw) return null;
  let o = null;
  try { o = JSON.parse(raw); } catch (e) { return null; }
  if (!o || typeof o !== 'object') return null;
  if (!Number.isInteger(o.p) || o.p < 1 || o.p > 604) return null;
  if (!Number.isInteger(o.s) || o.s < 1 || o.s > 114) return null;
  return { p: o.p, s: o.s };
}
// Validated BEFORE the write, so a bad pair is never persisted for the reader above to have
// to reject later. A storage that throws costs nothing: the page is still on the screen.
function writeMushafLastPage(pg, sr) {
  if (!Number.isInteger(pg) || pg < 1 || pg > 604) return;
  if (!Number.isInteger(sr) || sr < 1 || sr > 114) return;
  try { localStorage.setItem(MUSHAF_LAST_PAGE_KEY, JSON.stringify({ p: pg, s: sr })); } catch (e) {}
}

// The daily target: a decimal integer string, 1..604, and ABSENCE IS A REAL ANSWER. "No
// target" is not a broken state to be repaired on the next read -- it is the state the
// reader gets by default and the state the picker can return them to for good.
const WIRD_TARGET_KEY = 'mushaf_wird_target_v1';
// Canonical decimal only. ' 5', '5 ', '5.0', '-5', '05', '', 'abc' and Arabic-Indic digits
// as STORED text are all refused: the picker normalises before it writes, so anything
// non-canonical in the key was not written by this build and is not trusted.
function readWirdTarget() {
  let raw = null;
  try { raw = localStorage.getItem(WIRD_TARGET_KEY); } catch (e) { return null; }
  if (typeof raw !== 'string' || !/^[0-9]+$/.test(raw)) return null;
  const n = parseInt(raw, 10);
  if (!(n >= 1 && n <= 604)) return null;
  if (String(n) !== raw) return null;
  return n;
}
function writeWirdTarget(n) {
  if (!Number.isInteger(n) || n < 1 || n > 604) return;
  try { localStorage.setItem(WIRD_TARGET_KEY, String(n)); } catch (e) {}
}
function clearWirdTarget() {
  try { localStorage.removeItem(WIRD_TARGET_KEY); } catch (e) {}
}

// Today's completed pages: { d: 'YYYY-MM-DD', pages: [distinct 1..604] }.
const WIRD_DAY_KEY = 'mushaf_wird_day_v1';
// 8 seconds on the page, continuously, or it did not count. Short enough that ordinary
// reading credits every page; long enough that paging past twenty sheets looking for a
// surah credits none of them but the one you stopped on.
const WIRD_DWELL_MS = 8000;
const WIRD_TARGET_PRESETS = [1, 2, 5, 10, 20];
// DEVICE-LOCAL, and deliberately not toISOString. The day boundary a reader lives by is
// their own midnight, not UTC's: east of Greenwich toISOString would roll the wird over in
// the middle of the evening, and west of it the small hours would still count as yesterday.
// getFullYear/getMonth/getDate are the local calendar and nothing else is consulted.
function wirdDayKey(d) {
  const t = d || new Date();
  const y = t.getFullYear();
  const m = t.getMonth() + 1;
  const day = t.getDate();
  return String(y) + '-' + (m < 10 ? '0' : '') + String(m) + '-' + (day < 10 ? '0' : '') + String(day);
}
// Anything that is not today's well-formed record reads as TODAY'S EMPTY RECORD -- a record
// from another local date, damaged JSON, a missing key, a non-array `pages`, a storage that
// throws. Yesterday's wird is never today's progress and never an error message either.
// Pages are filtered, range-checked and de-duplicated on the way out, so the count can only
// be the number of distinct real pages and can never exceed 604.
function readWirdDay() {
  const today = wirdDayKey();
  let raw = null;
  try { raw = localStorage.getItem(WIRD_DAY_KEY); } catch (e) { return { d: today, pages: [] }; }
  if (!raw) return { d: today, pages: [] };
  let o = null;
  try { o = JSON.parse(raw); } catch (e) { return { d: today, pages: [] }; }
  if (!o || typeof o !== 'object') return { d: today, pages: [] };
  if (o.d !== today) return { d: today, pages: [] };
  if (!Array.isArray(o.pages)) return { d: today, pages: [] };
  const seen = Object.create(null);
  const pages = [];
  for (const v of o.pages) {
    if (!Number.isInteger(v) || v < 1 || v > 604) continue;
    if (seen[v]) continue;
    seen[v] = 1;
    pages.push(v);
  }
  return { d: today, pages: pages };
}
// The only writer of the daily key. A page already credited today writes NOTHING, so
// returning to it -- or paging back and forth over it all afternoon -- cannot inflate the
// count. An invalid page writes nothing either. localStorage only: no request, no beacon.
function markWirdPageRead(pg) {
  const rec = readWirdDay();
  if (!Number.isInteger(pg) || pg < 1 || pg > 604) return rec;
  if (rec.pages.indexOf(pg) !== -1) return rec;
  const next = { d: rec.d, pages: rec.pages.concat([pg]) };
  try { localStorage.setItem(WIRD_DAY_KEY, JSON.stringify(next)); } catch (e) {}
  return next;
}
// The picker's own normalisation. Character for character the acceptance the page-jump box
// uses -- Arabic-Indic and Latin digits, whitespace stripped -- but its OWN function, so
// that jumpGo below is left exactly as it is and the page jump cannot change behaviour.
function wirdNormalizeDigits(v) {
  return String(v == null ? '' : v).replace(/\s+/g, '').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}

function MushafScreen({ selected, setSelected, onBack, onPlaySurah, onStopAudio }) {
  const [ready, setReady] = useState(!!__quranData);
  const [counts, setCounts] = useState(null);       // { [surah]: ayahCount } -- ONE pass
  // Session 51 -- the bookmark, read once. Nothing on this screen writes it; the bar only
  // opens it or removes it. Opening goes through `selected`, the same door a surah tap uses,
  // so the back button still peels back to the index instead of leaving the mushaf.
  const [bookmark, setBookmark] = useState(readMushafBookmark);
  const [openAt, setOpenAt] = useState(null);       // set only by tapping the bar
