  // ONE view object, handed to whichever home is drawn. Both receive the same store, the same
  // filtered list, the same progress record and the same handlers -- there is nothing a home
  // component can compute that the other cannot, and nothing either of them may write.
  const view = {
    onBack: onBack,
    cats: cats,
    list: list,
    query: query,
    setQuery: setQuery,
    // The row is open while it is asked for OR while a query is live, so a filter can never be
    // in force with no visible way to clear it; closing it clears the query and restores the
    // full list. Both designs share this one handler, so a query survives a design switch.
    searchOpen: searchOpen || query.length > 0,
    onToggleSearch: () => {
      const next = !(searchOpen || query.length > 0);
      setSearchOpen(next);
      if (!next) setQuery('');
    },
    onOpen: open,
    prog: prog,
    byCat: (db && db.byCat) || {},
    usage: usage,
    favs: favs,
    done: done,
  };
  // The whole of the style switch on this screen: which component receives the state above.
  return style === EZIK_UI_STYLE_DECK ? <AdhkarDeckHome {...view} /> : <AdhkarJourneyHome {...view} />;
}

// ============================================================
// SHARED PRESENTATION PARTS. Both homes and both readers draw the same compact PURE WHITE top
// row -- there is no large filled blue band anywhere in either design, and no bitmap: the bar
// is a white surface, a hairline and line icons.
// ============================================================
function A3Bar({ children }) {
  return <div style={s.a3Bar}>{children}</div>;
}
function A3BarBtn({ onClick, label, on, pressed, children }) {
  return (
    <button type="button" className="adhkar2-focus" onClick={onClick} aria-label={label}
      aria-pressed={pressed === undefined ? undefined : (pressed ? 'true' : 'false')}
      style={on ? { ...s.a3BarBtn, ...s.a3BarBtnOn } : s.a3BarBtn}>{children}</button>
  );
}
// The search row, shared by both homes: it is the SAME input, the same handler and the same
// placeholder in either design, so a query typed under one layout filters exactly as it did.
function A3Search({ query, setQuery }) {
  return (
    <div style={s.a3SearchRow}>
      <span style={s.a3SearchIcon}>{A2_ICON_SEARCH}</span>
      <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={A2_SEARCH}
        style={s.a3SearchInput} aria-label={A2_SEARCH} />
    </div>
  );
}
// Real per-category standing, read off the SAME progress record the counter writes. A category
// the store does not resolve reports zero of zero and is drawn as untouched -- never as begun.
function a3CatStanding(prog, cat, byCat) {
  const items = byCat ? byCat[parseInt(cat.id, 10)] : null;
  const total = Array.isArray(items) ? items.length : 0;
  const done = total ? adhkarCatDone(prog, cat.id, items) : 0;
  return { total: total, done: done, full: total > 0 && done >= total, started: done > 0 };
}

// ============================================================
// DESIGN 1 -- DAILY JOURNEY (the default). One continuous vertical path: the real daily ring,
// then EVERY category the filter keeps, alternating around a thin ice-blue centre line. No
// category is hidden behind a decorative card, nothing is collapsed and nothing is ranked --
// the path is the store's own order, and each node is one direct door into one category.
// ============================================================
function AdhkarJourneyHome({ onBack, cats, list, query, setQuery, searchOpen, onToggleSearch, onOpen, prog, byCat, done }) {
  const shown = Math.min(done, ADHKAR_DAILY_GOAL);
  // The ring is one stroked circle: circumference minus the completed fraction. Both numbers
  // are the real ones -- min(completions, goal) over ADHKAR_DAILY_GOAL -- so an empty store
  // draws an empty ring and there is no place here where a completion can be invented.
  const CIRC = 2 * Math.PI * 34;
  const off = CIRC * (1 - (shown / ADHKAR_DAILY_GOAL));
  return (
    <div className="theme-dark adhkar3" style={s.a3Container}>
      {/* S85-adhkar-journey */}
      <A3Bar>
        <A3BarBtn onClick={onBack} label={A2_BACK}>{A2_ICON_BACK}</A3BarBtn>
        <div style={s.a3BarTitle}>{A2_TITLE}</div>
        <A3BarBtn onClick={onToggleSearch} label={A2_SEARCH} on={searchOpen} pressed={searchOpen}>{A2_ICON_SEARCH}</A3BarBtn>
      </A3Bar>
      {searchOpen && <A3Search query={query} setQuery={setQuery} />}
      <div style={s.a3Scroll}>
        <div style={s.a3Wrap}>
          <div style={s.a3RingCard}>
            <div style={s.a3RingBox} role="progressbar" aria-label={A2_GOAL_TITLE}
              aria-valuemin={0} aria-valuemax={ADHKAR_DAILY_GOAL} aria-valuenow={shown}>
              <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
                <circle cx="42" cy="42" r="34" fill="none" stroke="var(--a3-ice)" strokeWidth="7" />
                <circle cx="42" cy="42" r="34" fill="none" stroke="var(--a3-blue)" strokeWidth="7" strokeLinecap="round"
                  strokeDasharray={CIRC} strokeDashoffset={off} transform="rotate(-90 42 42)" />
              </svg>
              <span style={s.a3RingNums}>{toArabicDigits(shown)} / {toArabicDigits(ADHKAR_DAILY_GOAL)}</span>
            </div>
            <div style={s.a3RingSide}>
              <div style={s.a3RingTitle}>{A2_GOAL_TITLE}</div>
              <div style={s.a3RingHint}>{A2_SOURCE}</div>
            </div>
          </div>
          {cats === null ? (
            <div style={s.a3Empty}>...</div>
          ) : list.length === 0 ? (
            <div style={s.a3Empty}>{A2_EMPTY}</div>
          ) : (
            <div style={s.a3Path}>
              <span style={s.a3PathLine} aria-hidden="true" />
              {list.map((c, i) => {
                const st = a3CatStanding(prog, c, byCat);
                return (
                  <div key={c.id} style={s.a3PathRow}>
                    <span style={st.full ? { ...s.a3Mark, ...s.a3MarkDone } : (st.started ? { ...s.a3Mark, ...s.a3MarkNow } : s.a3Mark)} aria-hidden="true">
                      {st.full ? A2_ICON_CHECK : null}
                    </span>
                    <button type="button" className="adhkar2-focus" onClick={() => onOpen(c)}
                      style={{ ...s.a3Node, ...(st.full ? s.a3NodeDone : null), gridColumn: (i % 2 === 0) ? 1 : 3 }}>
                      <span style={s.a3NodeTop}>
                        <span style={s.a3NodeIcon}>{A2_ICON_BEADS}</span>
                        <span style={s.a3Pill}>{toArabicDigits(c.count)}</span>
                      </span>
                      <span style={s.a3NodeTitle}>{c.title}</span>
                      {st.total > 0 && st.done > 0 && (
                        <span style={s.a3NodeMeta}>{toArabicDigits(st.done)} / {toArabicDigits(st.total)}</span>
                      )}
                    </button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// DESIGN 2 -- STACKED CARDS. The deck is the first three categories of the REAL filtered list,
// most-opened first when this device has genuinely opened something and the store's own order
// otherwise; every one of the three is its own button with at least a 44px visible strip, and
// EVERY remaining category is in the grid underneath. Nothing is recommended, nothing is
// generated and no category can fall out of reach of a finger or of the tab key.
// ============================================================
function AdhkarDeckHome({ onBack, cats, list, query, setQuery, searchOpen, onToggleSearch, onOpen, prog, byCat, usage, favs }) {
  const favRef = useRef(null);
  const top = [];
  for (const r of adhkarMostUsed(usage, list, 3)) if (top.indexOf(r.cat) === -1) top.push(r.cat);
  for (const c of list) { if (top.length >= 3) break; if (top.indexOf(c) === -1) top.push(c); }
  const rest = list.filter((c) => top.indexOf(c) === -1);
  // FAVOURITES resolved against the real store: an identifier is kept only when it still names
  // a real item inside a real category. Nothing but the category title and the position is
  // drawn -- the stored value is two integers and the row shows exactly those two integers.
  const favRows = [];
  for (const k of (favs || [])) {
    const parts = String(k).split(':');
    const cid = parseInt(parts[0], 10);
    const at = parseInt(parts[1], 10);
    const items = byCat ? byCat[cid] : null;
    if (!Array.isArray(items) || !items[at]) continue;
    let cat = null;
    for (const c of (cats || [])) if (parseInt(c.id, 10) === cid) { cat = c; break; }
    if (!cat) continue;
    favRows.push({ k: k, cat: cat, at: at });
  }
  // S99: the home screen's jump to the favourites strip honours reduced motion too — it is the
  // only other animated scroll the app owns, and "reduce motion" that leaves one of two animated
  // scrolls animating is not a setting, it is a half-kept promise.
  const toFavs = () => { try { if (favRef.current) favRef.current.scrollIntoView({ behavior: ezikMotionReducedNow() ? 'auto' : 'smooth', block: 'start' }); } catch (e) {} };
  return (
    <div className="theme-dark adhkar3" style={s.a3Container}>
      {/* S85-adhkar-deck */}
      <A3Bar>
        <A3BarBtn onClick={onBack} label={A2_BACK}>{A2_ICON_BACK}</A3BarBtn>
        <div style={s.a3BarTitle}>{A2_TITLE}</div>
        {/* The favourites control exists only when a saved identifier really resolves. */}
        {favRows.length > 0 && <A3BarBtn onClick={toFavs} label={A2_FAV_LABEL}>{A2_ICON_HEART}</A3BarBtn>}
        <A3BarBtn onClick={onToggleSearch} label={A2_SEARCH} on={searchOpen} pressed={searchOpen}>{A2_ICON_SEARCH}</A3BarBtn>
      </A3Bar>
      {searchOpen && <A3Search query={query} setQuery={setQuery} />}
      <div style={s.a3Scroll}>
        <div style={s.a3Wrap}>
          {cats === null ? (
            <div style={s.a3Empty}>...</div>
          ) : list.length === 0 ? (
            <div style={s.a3Empty}>{A2_EMPTY}</div>
          ) : (
            <>
              <div style={{ ...s.a3Deck, height: (top.length - 1) * 44 + 140 }}>
                {top.map((c, i) => {
                  const st = a3CatStanding(prog, c, byCat);
                  const pct = st.total ? Math.round((st.done / st.total) * 100) : 0;
                  return (
                    <button key={c.id} type="button" className="adhkar2-focus" onClick={() => onOpen(c)}
                      style={{ ...s.a3DeckCard, ...(i === 0 ? s.a3DeckCardFront : null), top: (top.length - 1 - i) * 44, left: i * 12, right: i * 12, zIndex: top.length - i }}>
                      <span style={s.a3DeckHead}>
                        <span style={s.a3NodeIcon}>{A2_ICON_BEADS}</span>
                        <span style={i === 0 ? s.a3DeckTitle : s.a3DeckTitleSm}>{c.title}</span>
                        <span style={s.a3Pill}>{toArabicDigits(c.count)}</span>
                      </span>
                      {i === 0 && (
                        <span style={s.a3DeckBody}>
                          <span style={s.a3Track}><span style={{ ...s.a3TrackFill, width: pct + '%' }} /></span>
                          <span style={s.a3NodeMeta}>{toArabicDigits(st.done)} / {toArabicDigits(st.total)}</span>
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
              {rest.length > 0 && (
                <div style={s.a3Section}>
                  <div style={s.a3SectionTitle}>{A3_ALL}</div>
                  <div className="adhkar2-grid">
                    {rest.map((c) => (
                      <button key={c.id} type="button" className="adhkar2-focus" onClick={() => onOpen(c)} style={s.a3Tile}>
                        <span style={s.a3NodeTop}>
                          <span style={s.a3NodeIcon}>{A2_ICON_BEADS}</span>
                          <span style={s.a3Pill}>{toArabicDigits(c.count)}</span>
                        </span>
                        <span style={s.a3NodeTitle}>{c.title}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}
              {favRows.length > 0 && (
                <div style={s.a3Section} ref={favRef}>
                  <div style={s.a3SectionTitle}>{A2_FAV_LABEL}</div>
                  <div style={s.a3FavList}>
                    {favRows.map((r) => (
                      <button key={r.k} type="button" className="adhkar2-focus" onClick={() => onOpen(r.cat, r.at)} style={s.a3FavRow}>
                        <span style={s.a3FavIcon}>{A2_ICON_HEART_ON}</span>
                        <span style={s.a3FavTitle}>{r.cat.title}</span>
                        <span style={s.a3Pill}>{toArabicDigits(r.at + 1)}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// One category, full screen. The audio contract is DhikrCard's, kept identical on purpose:
// one <Audio> at a time, a second tap on the playing item stops it, tapping another item
// swaps to it, and ended/error both clear the playing state so a failed file cannot leave a
// stop button that never stops. The element is also paused and dropped on unmount, so
// leaving the screen mid-recitation leaves nothing playing behind it.
function AdhkarCategoryV2({ cat, startAt, onBack }) {
  // Session 85. THE LOGIC BELOW IS UNCHANGED and stays here: one loader, one audio element,
  // one counter writer, one favourite writer, one share handler. The two readers underneath
  // are presentation only -- they are handed what this component has already resolved and
  // they call back into these handlers; neither of them reads or writes storage itself.
  // Session 86: the same APPLICATION style hook the browse screen and the home screen read.
  const style = useEzikUiStyle();
  const [items, setItems] = useState(null);
  const [idx, setIdx] = useState(0);                       // the item being read, 0-based
  const [prog, setProg] = useState(readAdhkarProgress);
  const [favs, setFavs] = useState(readAdhkarFavorites);
  const [note, setNote] = useState('');                    // share feedback, announced politely
  const audioRef = useRef(null);
  const [playingId, setPlayingId] = useState(null);
  useEffect(() => {
    let alive = true;
    // The opening position is CLAMPED to the real list: a saved favourite opens at its own
    // item, and anything that does not name one of this category's positions opens at the
    // first. No index outside the store's own list can be reached from here.
    const at = (list) => {
      const n = parseInt(startAt, 10);
      if (!list.length || !Number.isFinite(n) || n < 1) return 0;
      return Math.min(n, list.length - 1);
    };
    loadAdhkar()
      .then((db) => { if (alive) { const list = (db.byCat && db.byCat[parseInt(cat.id, 10)]) || []; setItems(list); setIdx(at(list)); } })
      .catch(() => { if (alive) { setItems([]); setIdx(0); } });
    return () => { alive = false; };
  }, [cat.id]);
  useEffect(() => () => { if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; } }, []);
  // UNCHANGED audio contract -- DhikrCard's, code point for code point: one Audio at a time, a
  // second tap stops, ended/error clear the state, and the element is built from d.audio and
  // from nothing else. The control is rendered only when d.audio exists, so there is never a
  // button that pretends to a recitation the store does not have.
  const toggle = (d) => {
    if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    if (playingId === d.id) { setPlayingId(null); return; }
    if (!d.audio) return;
    const a = new Audio(d.audio);
    audioRef.current = a;
    setPlayingId(d.id);
    a.onended = () => setPlayingId(null);
    a.onerror = () => setPlayingId(null);
    a.play().catch(() => setPlayingId(null));
  };
  // Moving between items stops what is playing: the recitation belongs to the dhikr on screen.
  const go = (n) => {
    if (!items || items.length === 0) return;
    const next = Math.min(items.length - 1, Math.max(0, n));
    if (next === idx) return;
    if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    setPlayingId(null);
    setNote('');
    setIdx(next);
  };
  // SHARING. Nothing is transmitted until this handler runs, and it runs only from the share
  // control. The payload is read HERE, at the moment of the tap, off the item currently loaded
  // in the store -- no cached copy, no accumulated buffer, no other item, and no progress,
  // favourites or usage state, which never enter any payload anywhere in this file.
  const onShare = () => {
    const cur = (items && items[idx]) || null;
    const text = (cur && typeof cur.text === 'string') ? cur.text : '';
    if (!text) return;
    const fail = (e) => { if (e && e.name === 'AbortError') { setNote(''); return; } setNote(A2_SHARE_FAIL); };
    try {
      if (navigator.share) { navigator.share({ text: text }).then(() => setNote(A2_SHARE_OK)).catch(fail); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(() => setNote(A2_COPY_OK)).catch(fail); return; }
    } catch (e) { setNote(A2_SHARE_FAIL); return; }
    setNote(A2_SHARE_FAIL);
  };
  const d = (items && items[idx]) || null;
  const target = adhkarTarget(d);
  // Clamped for DISPLAY as well as on write, so a stored count larger than a target that has
  // since changed still reads as "target of target" and never as more than the target.
  const count = Math.min(adhkarCountOf(prog, cat.id, idx), target);
  const full = count >= target;
  const fkey = adhkarItemKey(cat.id, idx);
  const isFav = favs.indexOf(fkey) !== -1;
  const catDone = items ? adhkarCatDone(prog, cat.id, items) : 0;
  // ONE view object again. Every value in it was resolved above out of the store or out of the
  // progress record; every handler in it is one of this component's own. The two readers get
  // the same object and differ only in how they draw it.
  const view = {
    cat: cat,
    onBack: onBack,
    items: items,
    d: d,
    idx: idx,
    count: count,
    target: target,
    full: full,
    isFav: isFav,
    note: note,
    prog: prog,
    catDone: catDone,
    playing: !!(d && playingId === d.id),
    onPrev: () => go(idx - 1),
    onNext: () => go(idx + 1),
    // One press, one increment, and the press is refused at the target -- the cap lives here,
    // in the single call site of bumpAdhkarCount, and no reader can raise it.
    onCount: () => { if (!full) setProg(bumpAdhkarCount(cat.id, idx, target)); },
    onFav: () => setFavs(toggleAdhkarFavorite(fkey)),
    onShare: onShare,
    onAudio: () => { if (d) toggle(d); },
  };
  return style === EZIK_UI_STYLE_DECK ? <AdhkarDeckReader {...view} /> : <AdhkarJourneyReader {...view} />;
}

// The audio control, shared by both readers so the contract cannot drift between them: it is
// RENDERED ONLY when the loaded item genuinely carries d.audio, and it is the same toggle in
// both designs. No item without a recitation ever shows a listen button.
function A3AudioBtn({ d, playing, onAudio, style, styleOn }) {
  if (!d || !d.audio) return null;
  return (
    <button type="button" className="adhkar2-focus" onClick={onAudio}
      style={playing ? { ...style, ...styleOn } : style}
      aria-label={playing ? A2_STOP : A2_LISTEN}>
      {playing ? <PauseIcon size={16} /> : <PlayIcon size={16} />}
    </button>
  );
}

// ============================================================
// DESIGN 1 -- JOURNEY READER. A pure-white reading surface, a compact white top row, a slim
// rail on the RTL edge that shows the real position inside the real category, and one floating
// white dock. The dock is a laid-out row rather than an overlay, so it cannot cover a word of
// the text; the scroll area also carries its own bottom padding.
// ============================================================
function AdhkarJourneyReader(v) {
  const items = v.items;
  const d = v.d;
  const len = items ? items.length : 0;
  // At most A3_WINDOW marks whatever the length -- a nearby window, never hundreds of dots.
  const win = adhkarWindow(len, v.idx, A3_WINDOW);
  return (
    <div className="theme-dark adhkar3" style={s.a3Container}>
      {/* S85-adhkar-journey-reader */}
      <A3Bar>
        <A3BarBtn onClick={v.onBack} label={A2_BACK}>{A2_ICON_BACK}</A3BarBtn>
        <div style={s.a3BarTitleWrap}>
          {/* The category title, from adhkar.json, verbatim. */}
          <div style={s.a3BarTitleSm}>{v.cat.title}</div>
          <div style={s.a3BarSub}>{A2_SOURCE}</div>
        </div>
        <A3BarBtn onClick={v.onFav} label={v.isFav ? A2_FAV_DEL : A2_FAV_ADD} on={v.isFav} pressed={v.isFav}>
          {v.isFav ? A2_ICON_HEART_ON : A2_ICON_HEART}
        </A3BarBtn>
        <A3BarBtn onClick={v.onShare} label={A2_SHARE}>{A2_ICON_SHARE}</A3BarBtn>
      </A3Bar>
      <div style={s.a3ReadOuter}>
        {items === null ? (
          <div style={s.a3Empty}>...</div>
        ) : len === 0 || !d ? (
          <div style={s.a3Empty}>{A2_EMPTY}</div>
        ) : (
          <>
            {/* The rail sits on the RTL edge -- the right one -- and reports the real position
                out of the real length. Marks are drawn for the window only; the value it
                announces is always the true index and the true category length. */}
            <div style={s.a3Rail} role="progressbar" aria-label={v.cat.title}
              aria-valuemin={1} aria-valuemax={len} aria-valuenow={v.idx + 1}>
              {win.map((i) => {
                const doneHere = adhkarCountOf(v.prog, v.cat.id, i) >= adhkarTarget(items[i]);
                return <span key={i} style={i === v.idx ? { ...s.a3RailMark, ...s.a3RailMarkNow } : (doneHere ? { ...s.a3RailMark, ...s.a3RailMarkDone } : s.a3RailMark)} />;
              })}
            </div>
            <div style={s.a3ReadScroll}>
              <div style={s.a3ReadWrap}>
                <div style={s.a3ReadHead}>
                  <span style={s.a3ReadPos}>{toArabicDigits(v.idx + 1)} / {toArabicDigits(len)}</span>
                  <span style={s.a3ReadRule} />
                  {d.repeat > 1 && <span style={s.a3ReadRepeat}>{a2Repeat(d.repeat)}</span>}
                </div>
                {/* The stored text, rendered as a text child. No pass of any kind over it. */}
                <div style={s.a3ReadText}>{d.text}</div>
                <div style={s.a3ReadSource}>{A2_SOURCE}</div>
                {/* Live region: in the tree from the first render, only its text changes. */}
                <div style={s.a3Note} role="status" aria-live="polite">{v.note}</div>
              </div>
            </div>
          </>
        )}
      </div>
      {/* THE DOCK. RTL: previous is on the right, onward on the left, the real counter is the
          central control, and the audio button appears only for an item that has a recitation. */}
      {items !== null && len > 0 && d && (
        <div style={s.a3DockWrap}>
          <div style={s.a3Dock}>
            <button type="button" className="adhkar2-focus" onClick={v.onPrev} disabled={v.idx <= 0}
              style={v.idx <= 0 ? { ...s.a3DockBtn, ...s.a3DockBtnOff } : s.a3DockBtn} aria-label={A2_PREV}>{A2_ICON_BACK}</button>
            <A3AudioBtn d={d} playing={v.playing} onAudio={v.onAudio} style={s.a3DockBtn} styleOn={s.a3DockBtnOn} />
            <button type="button" className="adhkar2-focus" onClick={v.onCount}
              style={v.full ? { ...s.a3DockCount, ...s.a3DockCountDone } : s.a3DockCount}
              aria-label={A2_COUNT_ARIA} aria-disabled={v.full ? 'true' : 'false'}>
              <span style={s.a3DockCountNums}>{toArabicDigits(v.count)} / {toArabicDigits(v.target)}</span>
              <span style={s.a3DockCountLabel}>{v.full ? A2_ICON_CHECK : A2_ICON_PLUS}<span>{v.full ? A2_DONE : A2_COUNT}</span></span>
            </button>
            <button type="button" className="adhkar2-focus" onClick={v.onShare} style={s.a3DockBtn} aria-label={A2_SHARE}>{A2_ICON_SHARE}</button>
            <button type="button" className="adhkar2-focus" onClick={v.onFav}
              style={v.isFav ? { ...s.a3DockBtn, ...s.a3DockBtnOn } : s.a3DockBtn}

        </div>
      )}
    </div>
  );
}

// The one place the flag is spent. App still renders <AdhkarScreen onBack=... /> and knows
// nothing about either version, so ?adhkarui=0 changes this line's answer and nothing else.
function AdhkarScreen({ onBack }) {
  return ADHKAR_UI_V2_ON ? <AdhkarScreenV2 onBack={onBack} /> : <AdhkarScreenV1 onBack={onBack} />;
}

// ============================================================
// SESSION 87 -- ONE BACK HIERARCHY FOR THE WHOLE APPLICATION.
// ------------------------------------------------------------
// THE DEFECT THIS REPLACES: every non-chat screen resolved a browser/hardware back to the CHAT,
// because the chat was written as the generic fallback. Reading a dhikr and pressing back left
// the adhkar altogether; so did the mushaf's second back, and the memorizer's, and the settings
// sheet's. The hierarchy below is the one the app already looks like:
//
//   nested layer (open surah / opened adhkar category / running drill) -> its own parent screen
//   feature section (mushaf, adhkar, memorizer)                        -> HOME
//   sheet (parent gate, parent dashboard, settings)                    -> whoever opened it
//   home                                                               -> the app root, as before
//   call                                                               -> the chat, as before
//
// THE REGISTRY. A feature owns its nested layer and nothing outside it may reach into that
// state, so nothing is lifted: while a layer is open the feature REGISTERS its own closer here,
// and the application's single resolver asks the registry before it considers leaving a screen.
// The last registration is the deepest layer, closing or unmounting removes that exact entry,
// and a closed layer therefore can never answer a later press.
//
// SESSION 91 -- EVERY LAYER OWNS ITS OWN HISTORY ENTRY.
// ------------------------------------------------------------
// THE DEFECT THIS REPLACES: a nested layer (an opened dhikr, an opened mushaf page, a running
// drill) pushed NOTHING when it opened, so it was not represented in the history at all. The
// first device back therefore had no entry of its own to spend and consumed the SECTION's entry
// instead; the popstate handler then closed the layer and MINTED A REPLACEMENT entry to stand in
// for the one it had just destroyed. The web stack looked right afterwards, but the browser's
// back-forward list had been truncated and re-appended on every nested back, and a native
// WebView wrapper that caches canGoBack around that window is left holding a stale answer -- so
// the SECOND device back in the same section reached the wrapper's exit path instead of the app.
// Below, opening a layer pushes one real entry at the moment it opens, and closing it spends
// exactly that entry. Nothing is minted inside a popstate handler any more.
//
// THE LEDGER. One counter for the entries this app owns and has not yet spent, at module scope
// because two writers push into the same browser stack -- the App's screen effect and the layer
// hook below -- and they must count the same entries. `current` is that count, so it reads and
// means exactly what it always did.
const histDepthRef = { current: 0 };
function ezikHistPush(state) {
  try { window.history.pushState(state, ''); histDepthRef.current++; return true; } catch (e) { return false; }
}
// A pop already happened in the browser: just stop counting the entry it spent. Never negative.
function ezikHistSpend() { if (histDepthRef.current > 0) histDepthRef.current--; }
// Ask the browser to go back, and ONLY while an entry of ours is on the stack -- so a back can
// never reach past the app's first entry and the platform's exit at the root is untouched.
function ezikHistBack() {
  if (histDepthRef.current <= 0) return false;
  try { window.history.back(); return true; } catch (e) { return false; }
}
// The one back the WHOLE app presses. Module scope so a nested layer's own visible back button
// reaches the same resolver the device button reaches -- same route, same result -- without
// threading a callback down through every feature. App installs its resolver here.
let ezikBackHandler = null;
function ezikGoBack() { return typeof ezikBackHandler === 'function' ? ezikBackHandler() : false; }
const ezikBackLayers = [];
function ezikCloseDeepestLayer() {
  for (let i = ezikBackLayers.length - 1; i >= 0; i--) {
    const close = ezikBackLayers[i];
    if (typeof close === 'function' && close() !== false) return true;
  }
  return false;
}
// The registration hook. `open` says whether this feature currently HAS a nested layer; while it
// does, `close` peels exactly one level off it and nothing more. The closer is read through a
// ref so a re-render does not churn the registry, and the cleanup removes this entry by
// identity -- never one another feature registered.
function useEzikBackLayer(open, close) {
  const closeRef = useRef(close);
  useEffect(() => { closeRef.current = close; });
  useEffect(() => {
    if (!open) return undefined;
    // S91: THE LAYER TAKES ITS ENTRY HERE, on the closed->open edge and nowhere else. `open` is a
    // boolean and it is the whole dependency list, so changing WHICH dhikr, page or surah is being
    // read inside an already-open layer re-runs nothing and pushes nothing -- one layer, one entry.
    ezikHistPush({ layer: true });
    const entry = () => { const f = closeRef.current; if (typeof f !== 'function') return false; f(); return true; };
    ezikBackLayers.push(entry);
    return () => { const i = ezikBackLayers.indexOf(entry); if (i !== -1) ezikBackLayers.splice(i, 1); };
  }, [open]);
}
// THE DESTINATION TABLE, and it is the whole of the policy. It is a pure function of the screen
// being left and of the origin the sheets recorded, so the visible back button and the hardware
// back button cannot disagree: both ask this. `null` means "this screen has no parent inside the
// app" -- the roots -- and the caller then changes nothing at all.
const EZIK_ROOT_SCREENS = ['loading', 'onboarding', 'chat'];
// S98: «المفضلة» joins the sheets. It is opened from the chat's own drawer through openEzikSheet,
// so it records its opener on the way in and its back returns THERE — the same contract الإعدادات
// has had since S90, and the device button and the visible back button therefore agree.
const EZIK_SHEET_SCREENS = ['parentGate', 'parentDashboard', 'settings', 'favorites'];
function ezikBackTarget(cur, sheetOrigin) {
  if (EZIK_ROOT_SCREENS.indexOf(cur) !== -1) return null;
  // The call keeps its own documented exit contract: ending a call returns to the chat, and the
  // hardware button now agrees with the call screen's own button instead of contradicting it.
  if (cur === 'call') return 'chat';
  // Home is the root of the feature sections. Leaving home is the platform-level exit the app
  // has always had -- the entry underneath home is the chat the app booted into -- so this line
  // preserves that behaviour and invents no loop.
  if (cur === 'home') return 'chat';
  // A sheet returns to the screen that opened it, and to home when nothing valid was recorded.
  // S90: الإعدادات is itself an opener now -- the التحكم row opens the PIN gate from inside it --
  // so it joins the openers a sheet may be sent back to. A sheet is never sent back to itself.
  if (EZIK_SHEET_SCREENS.indexOf(cur) !== -1) {
    const known = (sheetOrigin === 'chat' || sheetOrigin === 'home' || sheetOrigin === 'settings');
    return (known && sheetOrigin !== cur) ? sheetOrigin : 'home';
  }
  // Every feature section: home, never the chat.
  return 'home';
}

// ============================================================
// S92 — المحادثات المحفوظة (saved conversations)
// ============================================================
// The chat used to hold exactly ONE thread, in the 'messages' key: opening the app restored it
// and «محادثة جديدة» overwrote it. This layer keeps a LIST instead, through the SAME storage the
// rest of the app uses — localStorage, every touch inside its own try/catch — so a locked, full
// or disabled store degrades to "no history" and can never break the chat itself.
//
// SHAPE. One small index under EZIK_CHATS_KEY — [{ id, pk, title, pinned, at }] — plus one blob
// per conversation under EZIK_CHAT_PREFIX + id holding the messages ARRAY VERBATIM. The messages
// are stored exactly as the thread holds them, which is what carries the source cards back: a
// card is parsed out of the reply TEXT at render time (see SourceCard), and that text is what is
// saved, so a restored reply renders the identical cards without storing anything about them.
//
// `pk` is the profile a conversation belongs to, and EVERY read filters on it — that is the whole
// of the isolation: a second child on the same device never sees the first one's history.
const EZIK_CHATS_KEY = 'ezik_chats_v1';
const EZIK_CHAT_PREFIX = 'ezik_chat_v1_';
const EZIK_CHAT_TITLE_MAX = 40;
const EZIK_CHATS_MAX = 60;          // oldest UNPINNED conversations are dropped past this
const EZIK_LEGACY_MSGS_KEY = 'messages';

// A random, opaque identifier — used for both conversation ids and profile ids. crypto when the
// platform has it, and a time+random fallback when it does not; either way it is only ever a
// local key, never anything a request carries.
function ezikMintId() {
  try {
    const b = new Uint8Array(8);
    window.crypto.getRandomValues(b);
    let out = '';
    for (let i = 0; i < b.length; i++) out += (b[i] + 0x100).toString(16).slice(1);
    return out;
  } catch (e) {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
}

// The profile identity a conversation is filed under. Minted ONCE and stored ON the profile
// object, so it survives every boot and is never re-derived from a field the child can see or
// change — two children who happen to share a name still get separate histories, and renaming
// could not move anyone's history even if renaming existed. Profiles created before this session
// are given one by the boot migration, beside the birthYear migration that already lives there.
function ezikProfileKey(p) {
  return (p && typeof p.pid === 'string' && p.pid) ? p.pid : 'anon';
}

function ezikReadChatIndex() {
  let raw;
  try { raw = localStorage.getItem(EZIK_CHATS_KEY); } catch (e) { return []; }
  if (!raw) return [];
  let list;
  try { list = JSON.parse(raw); } catch (e) { return []; }
  if (!Array.isArray(list)) return [];
  return list.filter((r) => r && typeof r.id === 'string' && r.id);
}
function ezikWriteChatIndex(list) {
  try { localStorage.setItem(EZIK_CHATS_KEY, JSON.stringify(list)); } catch (e) {}
}

// THE ORDER THE MENU SHOWS, and the only place it is decided: pinned first, then the most
// recently written. Both keys are read from the index alone, so the menu never has to open a
// single conversation blob to sort itself.
function ezikSortChats(list) {
  return list.slice().sort((a, b) =>
    ((b && b.pinned) ? 1 : 0) - ((a && a.pinned) ? 1 : 0) || ((b && b.at) || 0) - ((a && a.at) || 0));
}
function ezikListChats(pk) {
  return ezikSortChats(ezikReadChatIndex().filter((r) => r.pk === pk));
}

function ezikReadChatMessages(id) {
  let raw;
  try { raw = localStorage.getItem(EZIK_CHAT_PREFIX + id); } catch (e) { return []; }
  if (!raw) return [];
  try { const m = JSON.parse(raw); return Array.isArray(m) ? m : []; } catch (e) { return []; }
}

// The readable text of a message, whatever shape its content has. A plain turn is a string; an
// attachment turn is an array of blocks and only its text block is words — so a photo sent with
// «اشرح لي هذا» reads as that, and never as base64.
function ezikMessageText(m) {
  if (!m) return '';
  if (typeof m.content === 'string') return m.content;
  if (Array.isArray(m.content)) {
    return m.content
      .filter((b) => b && b.type === 'text' && typeof b.text === 'string')
      .map((b) => b.text)
      .join(' ');
  }
  return '';
}

// The title, and it is taken from the FIRST QUESTION the child asked — never from a reply, so a
// conversation is named by what was wanted rather than by what was answered. Whitespace collapses
// to single spaces, and a long question is cut on a word boundary when one falls near the limit
// so a title never ends mid-word.
function ezikChatTitle(msgs) {
  let first = null;
  for (let i = 0; i < (msgs || []).length; i++) {
    if (msgs[i] && msgs[i].role === 'user') { first = msgs[i]; break; }
  }
  let t = ezikMessageText(first).replace(/\s+/g, ' ').trim();
  if (!t) return 'محادثة';
  if (t.length > EZIK_CHAT_TITLE_MAX) {
    const cut = t.slice(0, EZIK_CHAT_TITLE_MAX);
    const sp = cut.lastIndexOf(' ');
    t = (sp > EZIK_CHAT_TITLE_MAX - 14 ? cut.slice(0, sp) : cut).trim() + '…';
  }
  return t;
}

// Past the cap, the oldest UNPINNED conversations are dropped — a pinned one is never dropped by
// age, which is what pinning is for. Dropping removes the blob too, so the store cannot fill with
// bodies whose index rows are gone.
function ezikTrimChats(list) {
  if (list.length <= EZIK_CHATS_MAX) return list;
  const sorted = ezikSortChats(list);          // pinned first, so the head is never a pinned drop
  const head = sorted.slice(0, EZIK_CHATS_MAX);
  const tail = sorted.slice(EZIK_CHATS_MAX);
  const keptTail = tail.filter((r) => r.pinned);
  tail.filter((r) => !r.pinned).forEach((r) => {
    try { localStorage.removeItem(EZIK_CHAT_PREFIX + r.id); } catch (e) {}
  });
  return head.concat(keptTail);
}

// Writing the body, and the one place a quota failure is handled. A thread carrying a photo or a
// PDF is large, so a full store is a real outcome rather than a theoretical one: the CURRENT
// conversation is the one that must survive, so on failure the oldest unpinned OTHER conversation
// is evicted and the write retried. The pool only shrinks, so the loop always terminates, and a
// store that refuses even an empty write simply returns false and the chat carries on unsaved.
// `idx` is mutated in step with the eviction so the caller writes an index that matches the store.
function ezikWriteChatBody(id, msgs, idx) {
  const payload = JSON.stringify(msgs);
  const pool = ezikSortChats(idx.filter((r) => r.id !== id && !r.pinned));
  for (;;) {
    try { localStorage.setItem(EZIK_CHAT_PREFIX + id, payload); return true; } catch (e) {}
    const victim = pool.pop();                 // sorted newest-first, so pop() is the oldest
    if (!victim) return false;
    try { localStorage.removeItem(EZIK_CHAT_PREFIX + victim.id); } catch (e2) {}
    const i = idx.indexOf(victim);
    if (i !== -1) idx.splice(i, 1);
  }
}

// THE AUTOSAVE. Called after every turn the chat commits, and it is a NO-OP until the thread
// holds a real question: an empty thread — and a thread holding nothing but the boot greeting —
// is never filed. That is exactly what "the empty chat is not saved" means, and it is enforced
// here rather than at the call sites, so no path can file an empty one by forgetting to ask.
// Returns the id the conversation was filed under, so a first save hands the chat its identity.
function ezikSaveChat(id, msgs, pk) {
  const list = (msgs || []).filter(Boolean);
  let hasQuestion = false;
  for (let i = 0; i < list.length; i++) { if (list[i].role === 'user') { hasQuestion = true; break; } }
  if (!hasQuestion) return null;
  const cid = id || ezikMintId();
  const idx = ezikReadChatIndex();
  let prev = null;
  for (let i = 0; i < idx.length; i++) { if (idx[i].id === cid) { prev = idx[i]; break; } }
  // The title is minted once, from the first question, and a later turn never renames it.
  const rec = {
    id: cid,
    pk: pk,
    title: (prev && prev.title) ? prev.title : ezikChatTitle(list),
    pinned: !!(prev && prev.pinned),
    at: Date.now(),
  };
  const rest = idx.filter((r) => r.id !== cid);
  if (!ezikWriteChatBody(cid, list, rest)) return null;   // store refused: file nothing
  ezikWriteChatIndex(ezikTrimChats([rec].concat(rest)));
  return cid;
}

function ezikDeleteChat(id) {
  try { localStorage.removeItem(EZIK_CHAT_PREFIX + id); } catch (e) {}
  ezikWriteChatIndex(ezikReadChatIndex().filter((r) => r.id !== id));
}
function ezikToggleChatPin(id) {
  ezikWriteChatIndex(ezikReadChatIndex().map((r) =>
    (r.id === id ? { id: r.id, pk: r.pk, title: r.title, pinned: !r.pinned, at: r.at } : r)));
}
// "Delete all my data" has to mean the history too — every body and the index with them.
function ezikClearAllChats() {
  ezikReadChatIndex().forEach((r) => { try { localStorage.removeItem(EZIK_CHAT_PREFIX + r.id); } catch (e) {} });
  try { localStorage.removeItem(EZIK_CHATS_KEY); } catch (e) {}
  try { localStorage.removeItem(EZIK_LEGACY_MSGS_KEY); } catch (e) {}
}

// THE PARENTS' LOG. Before this session the thread on screen WAS the child's whole record, so the
// parental dashboard could read it straight off `messages`. The chat now opens empty, which would
// have left that dashboard showing «لا توجد محادثات بعد» to a parent whose child has a full
// history -- a real loss of oversight, not a cosmetic one. So the log is assembled from the saved
// conversations instead: all of the ACTIVE profile's, oldest first, as one transcript. That is
// exactly what the dashboard displayed before, when a child could only ever have one thread, and
// no other profile's messages can enter it because the rows are filtered by pk first.
function ezikProfileTranscript(pk) {
  const rows = ezikReadChatIndex().filter((r) => r.pk === pk).sort((a, b) => ((a && a.at) || 0) - ((b && b.at) || 0));
  let out = [];
  for (let i = 0; i < rows.length; i++) out = out.concat(ezikReadChatMessages(rows[i].id));
  return out;
}

// ONE-SHOT migration of the single legacy thread. 'messages' held whatever the child was in the
// middle of when this shipped; it is filed as that profile's first saved conversation and the key
// is then removed, so nothing anyone had is lost and the migration cannot run a second time. A
// legacy thread with no question in it (a greeting alone) files nothing and the key still goes.
function ezikMigrateLegacyThread(pk) {
  let raw;
  try { raw = localStorage.getItem(EZIK_LEGACY_MSGS_KEY); } catch (e) { return; }
  if (!raw) return;
  let msgs = null;
  try { msgs = JSON.parse(raw); } catch (e) { msgs = null; }
  if (Array.isArray(msgs) && msgs.length) ezikSaveChat(null, msgs, pk);
  try { localStorage.removeItem(EZIK_LEGACY_MSGS_KEY); } catch (e) {}
}

// ============================================================
// S99 — سهولة الاستخدام (local reading preferences)
// ============================================================
// THREE PREFERENCES, ONE KEY, PER PROFILE. Text size, reading mode and reduced motion are device
// preferences, not account data: they live under their own versioned key, they are filed under the
// profile that chose them, and nothing about them ever reaches the network. The conversation store
// and the profile object are untouched — this adds a key beside them and changes neither.
//
// They are applied by moving three attributes on <html>, so the whole interface follows one write
// and no component subscribes to anything. --ez-fs is the multiplier the styles object above reads.
const EZIK_A11Y_KEY = 'ezik_reading_prefs_v1';
const EZIK_A11Y_DEFAULTS = { fontSize: 'normal', reading: false, reduceMotion: false };

function ezikReadA11yAll() {
  let raw;
  try { raw = localStorage.getItem(EZIK_A11Y_KEY); } catch (e) { return {}; }
  if (!raw) return {};
  let map;
  try { map = JSON.parse(raw); } catch (e) { return {}; }
  if (!map || typeof map !== 'object' || Array.isArray(map)) return {};
  return map;
}
// One profile's preferences, with every field validated. An unknown size, a non-boolean flag, a
// record that is not an object at all — each falls back to the default rather than reaching the
// renderer, so a corrupt file degrades to "the app as it shipped" and never to a broken screen.
function ezikReadA11y(pk) {
  const map = ezikReadA11yAll();
  const raw = map && map[pk];
  const out = { fontSize: EZIK_A11Y_DEFAULTS.fontSize, reading: false, reduceMotion: false };
  if (!raw || typeof raw !== 'object') return out;
  if (typeof raw.fontSize === 'string' && Object.prototype.hasOwnProperty.call(EZIK_FS_SCALES, raw.fontSize)) out.fontSize = raw.fontSize;
  out.reading = raw.reading === true;
  out.reduceMotion = raw.reduceMotion === true;
  return out;
}
// Writing returns whether the store actually took it, so the UI never claims a preference was
// saved when a disabled or full store refused it. A profile at defaults is REMOVED rather than
// written, so the key cannot grow a record per profile that never changed anything.
function ezikWriteA11y(pk, prefs) {
  if (!pk) return false;
  const map = ezikReadA11yAll();
  const isDefault = prefs.fontSize === EZIK_A11Y_DEFAULTS.fontSize && !prefs.reading && !prefs.reduceMotion;
  if (isDefault) delete map[pk];
  else map[pk] = { fontSize: prefs.fontSize, reading: !!prefs.reading, reduceMotion: !!prefs.reduceMotion };
  try { localStorage.setItem(EZIK_A11Y_KEY, JSON.stringify(map)); return true; } catch (e) { return false; }
}
function ezikClearAllA11y() { try { localStorage.removeItem(EZIK_A11Y_KEY); } catch (e) {} }

// THE ONE PLACE THE PREFERENCES BECOME VISIBLE. Three attributes and one custom property on the
// root element; every rule and every scaled size reads them from there. Called on load and on
// each change, and never from a render path.
function ezikApplyA11y(prefs) {
  const p = prefs || EZIK_A11Y_DEFAULTS;
  try {
    const el = document.documentElement;
    const scale = EZIK_FS_SCALES[p.fontSize] || 1;
    el.style.setProperty('--ez-fs', String(scale));
    el.setAttribute('data-ez-fs', p.fontSize || 'normal');
    if (p.reading) el.setAttribute('data-ez-read', '1'); else el.removeAttribute('data-ez-read');
    if (p.reduceMotion) el.setAttribute('data-ez-motion', 'reduce'); else el.removeAttribute('data-ez-motion');
  } catch (e) {}
}
// Does the app owe this user stillness? EITHER the local preference OR the platform one. The
// platform is asked through matchMedia at the moment of the question, never cached, so turning it
// on in the OS settings takes effect without a reload.
function ezikMotionReduced(localPref) {
  if (localPref) return true;
  try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch (e) { return false; }
}
// The same question for a component that holds no preference of its own. ezikApplyA11y has already
// put the answer on <html>, so reading it back there is reading the SAME value App holds — one
// source of truth, no second copy of the preference threaded through the tree to fall out of date.
function ezikMotionReducedNow() {
  try { if (document.documentElement.getAttribute('data-ez-motion') === 'reduce') return true; } catch (e) {}
  return ezikMotionReduced(false);
}

const EZIK_A11Y_TITLE = 'سهولة الاستخدام';
const EZIK_A11Y_FS_LABEL = 'حجم الخط';
const EZIK_A11Y_FS_NORMAL = 'عادي';
const EZIK_A11Y_FS_LARGE = 'كبير';

const EZIK_A11Y_MOTION = 'تقليل الحركة';

// ============================================================
// S98 — المفضلة المحلية (local favourite replies)
// ============================================================
// A SEPARATE STORE, and separate is the whole design. It lives under its own versioned key, it is
// never written by the conversation autosave, and the conversation autosave never reads it — so
// the shape of a saved conversation is byte-for-byte what S92 shipped and nothing here can migrate,
// reshape or corrupt it. Deleting a conversation therefore cannot take a saved reply with it,
// which is precisely why a favourite carries its OWN copy of the text.
//
// A record is the minimum that lets the favourites screen stand on its own:
//   id      — the identity of a saved reply. See ezikFavId: it is a POSITION, not a text.
//   pk      — the profile it belongs to, the same isolation every chat read applies. REQUIRED.
//   chatId  — the conversation it came from, or null for a thread not yet filed. Used to offer to
//             open THAT conversation, and it is part of the identity.
//   idx     — the reply's position in that conversation, and part of the identity.
//   at      — when it was saved.
//   snippet — a clean, tag-free line for the list.
//   text    — the reply VERBATIM, which is what keeps it readable after its conversation is gone.
const EZIK_FAVS_KEY = 'ezik_favorite_replies_v1';
const EZIK_FAVS_MAX = 200;
const EZIK_FAV_SNIPPET_MAX = 140;

// FNV-1a over a string. Cheap, stable across reloads and devices, and it needs no store of its own.
function ezikHashText(t) {
  const str = String(t == null ? '' : t);
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return 'r' + h.toString(16) + '-' + str.length.toString(36);
}

// THE IDENTITY OF A SAVED REPLY, and it is a POSITION rather than a text.
//
// It used to be the hash of the reply alone, and that was wrong in two ways that only show up on a
// real device. Two conversations can hold the SAME answer — ask the same question twice and you
// get it — and the two would have shared one star and one "open the original", so starring the
// second silently re-pointed the first. Worse, two CHILDREN on one device could produce the same
// answer, and with the id equal the second child's star would have removed the first child's
// favourite: one profile reaching into another's data, which is the one thing this app's storage
// discipline exists to prevent.
//
// So the identity is (profile, conversation, position in that conversation), and the reply's text
// hash rides along as a VERIFICATION term: if the reply at that position is not the text that was
// saved, the id does not match and no stale star is drawn. `idx` is sound as a position because a
// thread is append-only — every path that commits a turn pushes onto the end, and the only thing
// that ever removes messages is resetThread, which empties the whole thread and drops its chatId
// with it. Nothing about a MESSAGE object changes: the index is read where the thread is already
// being mapped, and no byte is written into the conversation store.
//
// chatId is null only for a thread that has not been filed yet — the boot greeting, before the
// first question mints an id. Such a favourite is honest about having no conversation to return
// to; the screen says so rather than offering a button that would do nothing.
function ezikFavId(pk, chatId, idx, text) {
  return String(pk || '') + '|' + String(chatId || '-') + '|' + String(idx) + '|' + ezikHashText(text);
}

// EVERY read is defensive, because this is a file on a device: it can be absent, it can be
// truncated, it can be hand-edited, and a half-written record can be left behind. None of those
// may reach the screen as an exception — the worst case is "no favourites".
//
// A record with no `pk`, or no `id`, is CORRUPT and is dropped. Neither can be recovered: the id
// is a position and cannot be re-derived from the text, and a record with no owner would otherwise
// have to be shown to every profile on the device — which is precisely the leak this file is
// written to prevent. The feature has never shipped, so nothing real can be lost here and no
// migration is owed to it.
function ezikReadFavs() {
  let raw;
  try { raw = localStorage.getItem(EZIK_FAVS_KEY); } catch (e) { return []; }
  if (!raw) return [];
  let list;
  try { list = JSON.parse(raw); } catch (e) { return []; }
  if (!Array.isArray(list)) return [];
  const out = [];
  for (let i = 0; i < list.length; i++) {
    const r = list[i];
    if (!r || typeof r !== 'object') continue;
    const text = typeof r.text === 'string' ? r.text : '';
    if (!text) continue;                                  // a record with no reply in it is not one
    if (typeof r.pk !== 'string' || !r.pk) continue;      // no owner: corrupt, and never shown
    if (typeof r.id !== 'string' || !r.id) continue;      // no identity: corrupt, cannot be rebuilt
    out.push({
      id: r.id,
      pk: r.pk,
      chatId: (typeof r.chatId === 'string' && r.chatId) ? r.chatId : null,
      idx: (typeof r.idx === 'number' && isFinite(r.idx)) ? r.idx : -1,
      at: (typeof r.at === 'number' && isFinite(r.at)) ? r.at : 0,
      snippet: (typeof r.snippet === 'string' && r.snippet) ? r.snippet : ezikFavSnippet(text),
      text: text,
    });
  }
  return out;
}

// Writing, and the one place a full store is handled. The list is newest-first, so the oldest
// favourite is the one dropped; the pool only shrinks, so the loop terminates. Returns the list
// ACTUALLY written — which the caller adopts, so the screen never shows a record the disk refused.
// null means the store would not take even an empty list (disabled/locked storage).
function ezikWriteFavs(list) {
  let l = (list || []).slice(0, EZIK_FAVS_MAX);
  for (;;) {
    try { localStorage.setItem(EZIK_FAVS_KEY, JSON.stringify(l)); return l; } catch (e) {}
    if (!l.length) return null;
    l = l.slice(0, l.length - 1);
  }
}

// The list line. Built from the SAME serializer the clipboard uses, so no card tag can reach it.
function ezikFavSnippet(text) {
  let clean = '';
  try {
    const parsed = parseRichMessage(String(text == null ? '' : text), 30);
    clean = serializeReply(parsed.segments, { tashkeel: true, band: 'adult' });
  } catch (e) { clean = String(text == null ? '' : text); }
  clean = clean.replace(/\s+/g, ' ').trim();
  if (clean.length > EZIK_FAV_SNIPPET_MAX) {
    clean = clean.slice(0, EZIK_FAV_SNIPPET_MAX).replace(/\s+\S*$/, '').replace(/\s+$/, '') + ' …';
  }
  return clean;
}

function ezikMakeFav(text, pk, chatId, idx) {
  const t = String(text == null ? '' : text);
  return { id: ezikFavId(pk, chatId, idx, t), pk: pk || null, chatId: chatId || null, idx: idx, at: Date.now(), snippet: ezikFavSnippet(t), text: t };
}

// "Delete all my data" has to mean the favourites too.
function ezikClearAllFavs() { try { localStorage.removeItem(EZIK_FAVS_KEY); } catch (e) {} }

const EZIK_FAV_HEADING = 'الردود المفضلة';
const EZIK_FAV_ADD = 'أضف إلى المفضلة';
const EZIK_FAV_DEL = 'إزالة من المفضلة';
const EZIK_FAV_REMOVE = 'إزالة';

// The saved date, rendered from the record's own timestamp. Arabic-Kuwait with a Gregorian
// calendar, and a record whose `at` was lost simply shows no date rather than 1970.
function ezikFavDate(at) {
  if (!at) return '';
  try { return new Date(at).toLocaleDateString('ar-KW', { year: 'numeric', month: 'long', day: 'numeric' }); }
  catch (e) { try { return new Date(at).toISOString().slice(0, 10); } catch (e2) { return ''; } }
}
// The compact form, for the dense search-results list where a spelled-out month wraps.
function ezikShortDate(at) {
  if (!at) return '';
  try { return new Date(at).toLocaleDateString('ar-KW', { year: 'numeric', month: 'numeric', day: 'numeric' }); }
  catch (e) { return ezikFavDate(at); }
}

// ============================================================
// S98 — البحث المحلي (local search, in the menu and in the favourites)
// ============================================================
// IT NEVER LEAVES THE DEVICE. There is no fetch on this path, no model call, and no index written
// to storage: the corpus is assembled in memory from the conversations already saved, held for as
// long as that list is unchanged, and thrown away with the tab. What the child types is a local
// string and goes nowhere.
//
// ITS OWN NORMALIZER, and normalizeArabic above is deliberately left alone — resolveSurahNumber
// depends on that one, and search needs two things it does not have: the ى/ي fold, and an INDEX
// MAP. The map is what lets a snippet be cut out of the ORIGINAL text after a hit was found in the
// normalized one; without it the two strings have different lengths (diacritics were dropped) and
// every snippet would be shifted by however many harakat preceded the match.
const EZIK_SNIPPET_RADIUS = 45;
const EZIK_CARD_TAG_RE = /<\/?(?:verse|surah|hadith|steps|suggestions|board|document|source|dhikr|worship)\b[^>]*>/gi;

// The searchable form of a reply: the card MARKUP goes, the words inside the cards stay — so a
// hadith or a source's own text is findable, and no tag can ever surface in a snippet.
function ezikSearchPlain(t) {
  return String(t == null ? '' : t)
    .replace(EZIK_CARD_TAG_RE, ' ')
    .replace(/<[^>\n]{0,160}>/g, ' ')
    .replace(/[ \t ]+/g, ' ');
}

// One pass that produces BOTH the normalized text and, for each of its characters, the index it
// came from in the source. Folds: harakat and the dagger alef and tatweel are dropped; آ أ إ ٱ
// become ا; ى becomes ي; runs of whitespace collapse to one space; latin letters lowercase.
function ezikSearchNormalize(src) {
  const s = String(src == null ? '' : src);
  let out = '';
  const map = [];
  let prevSpace = false;
  for (let i = 0; i < s.length; i++) {
    const code = s.charCodeAt(i);
    // 064B..0652 harakat · 0670 dagger alef · 0640 tatweel · 0653..065F extra marks · 06D6..06ED
    if ((code >= 0x064B && code <= 0x065F) || code === 0x0670 || code === 0x0640
      || (code >= 0x06D6 && code <= 0x06ED)) continue;
    let ch = s.charAt(i);
    if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r' || ch === ' ') {
      if (prevSpace) continue;
      ch = ' ';
      prevSpace = true;
    } else {
      prevSpace = false;
      if (ch === 'آ' || ch === 'أ' || ch === 'إ' || ch === 'ٱ') ch = 'ا';
      else if (ch === 'ى') ch = 'ي';
      else if (code >= 0x41 && code <= 0x5A) ch = ch.toLowerCase();
    }
    out += ch;
    map.push(i);
  }
  return { text: out, map: map };
}
const ezikSearchQuery = (q) => ezikSearchNormalize(q).text.trim();

// The line under a result. Cut from the ORIGINAL text around the hit, walked out to word
// boundaries so it never starts or ends mid-word, and marked with ellipses where it was cut.
function ezikSearchSnippet(original, map, at, qLen) {
  const src = String(original == null ? '' : original);
  if (!src) return '';
  if (at < 0 || !map.length) return src.slice(0, EZIK_SNIPPET_RADIUS * 2).replace(/\s+/g, ' ').trim();
  const oStart = map[Math.min(map.length - 1, Math.max(0, at))];
  const oEnd = map[Math.min(map.length - 1, Math.max(0, at + qLen - 1))] + 1;
  let from = Math.max(0, oStart - EZIK_SNIPPET_RADIUS);
  let to = Math.min(src.length, oEnd + EZIK_SNIPPET_RADIUS);
  while (from > 0 && !/\s/.test(src.charAt(from - 1))) from--;
  while (to < src.length && !/\s/.test(src.charAt(to))) to++;
  let out = src.slice(from, to).replace(/\s+/g, ' ').trim();
  if (from > 0) out = '… ' + out;
  if (to < src.length) out = out + ' …';
  return out;
}

// One conversation, made searchable. It reads the body the store already holds; it writes nothing.
function ezikBuildSearchRow(rec) {
  const msgs = ezikReadChatMessages(rec.id);
  const parts = [];
  for (let i = 0; i < msgs.length; i++) {
    const t = ezikSearchPlain(ezikMessageText(msgs[i])).trim();
    if (t) parts.push(t);
  }
  const body = parts.join('\n');
  const norm = ezikSearchNormalize(body);
  return {
    id: rec.id, title: rec.title, at: rec.at, pinned: rec.pinned,
    body: body, hay: norm.text, map: norm.map,
    titleHay: ezikSearchNormalize(rec.title || '').text,
  };
}

// The match. Order is the store's own — pinned first, then most recent — because the rows arrive
// already sorted and nothing here re-ranks them.
function ezikSearchChats(rows, q) {
  const out = [];
  if (!q) return out;
  for (let i = 0; i < (rows || []).length; i++) {
    const r = rows[i];
    const inTitle = r.titleHay.indexOf(q);
    const at = r.hay.indexOf(q);
    if (inTitle === -1 && at === -1) continue;
    out.push({
      id: r.id,
      title: r.title,
      at: r.at,
      pinned: r.pinned,
      snippet: at !== -1 ? ezikSearchSnippet(r.body, r.map, at, q.length) : ezikSearchSnippet(r.body, r.map, 0, 1),
    });
  }
  return out;
}

// The same match over the favourites already in memory. No store is touched at all here.
function ezikSearchFavs(favs, q) {
  const out = [];
  if (!q) return out;
  for (let i = 0; i < (favs || []).length; i++) {
    const f = favs[i];
    const plain = ezikSearchPlain(f.text);
    const norm = ezikSearchNormalize(plain);
    const at = norm.text.indexOf(q);
    if (at === -1) continue;
    out.push(Object.assign({}, f, { hit: ezikSearchSnippet(plain, norm.map, at, q.length) }));
  }
  return out;
}

function App() {
  // S100: mounted here and not only in Settings, because the 'storage' event fires in the
  // tabs that did NOT make the change -- a tab sitting on the chat has to repaint too. The
  // hook owns no screen state and renders nothing; it keeps <html> honest.
  useEzikVisualTheme();
  const [screen, setScreen] = useState('loading');
  const [selectedSurah, setSelectedSurah] = useState(null); // خطأ ٤٦: سورة المصحف المفتوحة، مرفوعة إلى App كي يقشرها زر الرجوع طبقةً طبقة
  const [profile, setProfile] = useState(null);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [depthMode, setDepthMode] = useState('brief'); // 'brief' | 'detailed' | 'scholar' — adult-only 3-state cycle
  const SCHOLAR_ENABLED = true; // scholar (طالب العلم) = adult-only 3rd depth state; ENABLED. Set false to hide it (cycle -> brief/detailed only). Server accepts scholar regardless of this flag.
  const [pendingImage, setPendingImage] = useState(null); // { media_type, data } or null
  const [attachMenuOpen, setAttachMenuOpen] = useState(false);
  const [drawerOpen, setDrawerOpen] = useState(false);   // D85: the chat drawer (menu button)
  // S92: the saved-conversation state. `chatId` is the conversation the thread on screen belongs
  // to, and NULL means the thread has not been filed yet — a brand new, empty chat. `chatIdRef`
  // is its synchronous mirror because the autosave runs after an await, inside a handler whose
  // closure was built before the first save handed the chat its id. `chatList` is what the menu
  // draws, always already ordered. `chatPendingDelete` is the row currently asking to be
  // confirmed, and only ever one at a time.
  const [chatId, setChatId] = useState(null);
  const chatIdRef = useRef(null);
  const [chatList, setChatList] = useState([]);
  const [chatPendingDelete, setChatPendingDelete] = useState(null);
  // S98: THE FAVOURITES, READ ONCE. This is the whole of the performance contract for the feature:
  // localStorage is touched here, at mount, and then never again on a render path. No bubble reads
  // the store, no bubble parses JSON, and the list of ids a bubble is asked about is a Set derived
  // once per change. `favsRef` is the synchronous mirror the toggle reads, so two taps landing in
  // the same task both see the truth instead of the same stale array.
  const [favs, setFavs] = useState(ezikReadFavs);
  const favsRef = useRef(favs);
  // S98: WHICH REPLIES ARRIVED LIVE IN THIS THREAD, by position. A long reply is watched in full
  // while it streams, so folding it the instant it settles would shrink the very text that was
  // being read — a jump, and the one thing the fold is not allowed to cause. A reply whose index
  // is in here opens EXPANDED; everything else opens folded, which is what a conversation restored
  // from the store gets. It holds numbers, it is never written to storage, and it is emptied by
  // resetThread and by openSavedChat — so a new chat, or another conversation, starts with none.
  // The membership is decided by the real streaming transition (the line that retires
  // streamingText and pushes the finished reply), never by comparing text.
  // S99: the reading preferences. Read ONCE, per profile, into state; every change goes through
  // setA11y, which writes the store and repaints the root attributes in one place. Nothing else in
  // the tree reads the store, and no render path touches localStorage.
  const [a11y, setA11yState] = useState(EZIK_A11Y_DEFAULTS);
  const a11yRef = useRef(a11y);
  const setA11y = (next) => {
    const merged = Object.assign({}, a11yRef.current, next);
    // The first time a larger size is chosen, the styles object becomes scalable. From then on the
    // multiplier alone moves it, so switching between large and كبير جدًّا costs nothing more.
    if (merged.fontSize !== 'normal') ezikEnsureScalableStyles();
    const pk = ezikProfileKey(profileRef.current || profile);
    const stored = ezikWriteA11y(pk, merged);
    // A refused store must not leave the screen claiming a preference was saved. It IS applied for
    // this session — the user asked for it and the app can honour it now — and it simply will not
    // survive a reload, which is the honest outcome for storage that cannot be written.
    a11yRef.current = merged;
    setA11yState(merged);
    ezikApplyA11y(merged);
    return stored;
  };
  const resetA11y = () => setA11y(EZIK_A11Y_DEFAULTS);
  const [streamedOpen, setStreamedOpen] = useState(() => new Set());
  // WHICH THREAD IS ON SCREEN, as a number that changes every time the thread is REPLACED — a
  // conversation opened, or a new chat started. Nothing else changes it, because nothing else
  // replaces the thread: every other path appends. A bubble carries it as the key of whatever the
  // reader did to its fold, so opening a conversation invalidates every manual expand at once and
  // a restored reply comes back folded, however identical its text is to the one just read.
  const [threadEpoch, setThreadEpoch] = useState(0);
  const newThreadEpoch = () => setThreadEpoch((n) => n + 1);
  const markStreamedOpen = (idx) => setStreamedOpen((prev) => {
    if (prev.has(idx)) return prev;
    const next = new Set(prev);
    next.add(idx);
    return next;
  });

  // with the attribute already on <html>. No effect runs at mount, so nothing can repaint.
  const [theme, setTheme] = useState(readStoredTheme);
  const chooseTheme = (t) => setTheme(applyTheme(t));
  const fileInputRef = useRef(null);

  // the adhkar's opened category, the memorizer's running drill and the mushaf's open surah; the
  // second line is a safety net for the mushaf alone, whose open surah is App state, so a first
  // back inside the mushaf peels to the index even if that screen never registered.
  const closeEzikNested = () => {
    if (ezikCloseDeepestLayer()) return true;
    if (screenRef.current === 'mushaf' && selectedSurahRef.current != null) { setSelectedSurah(null); return true; }
    return false;
  };

  // ===== goEzikBack -- THE ONE APPLICATION BACK RESOLVER =====
  // Every visible section-level back control and the browser/hardware button both end here, so
  // there is exactly one hierarchy and one place to read it. `viaPop` says the press was the
  // browser's own and has therefore ALREADY consumed a history entry; it changes the bookkeeping
  // and never the destination. It reads screenRef/refs only, so the popstate listener may keep
  // the identity it captured at mount and still resolve against the live screen.
  const resolveEzikBack = (viaPop) => {
    const cur = screenRef.current;
    // S92: the layer registry is asked FIRST on EVERY screen, root or not -- the `!rooted` guard
    // that used to stand here is gone. The chat is a root screen and it now owns a layer, the side
    // menu, so that guard would have let a press pass straight through an open menu and out of the
    // app. Nothing else changes route: no root screen registered a layer before this one, and the
    // mushaf safety net inside closeEzikNested is gated on its own screen.
    // 1. The deepest open layer closes, and NOTHING else happens: the section is retained.
    if (closeEzikNested()) {
      // S91: the entry the pop just spent BELONGED to the layer that has now closed, so there is
      // nothing to put back. The section's own entry was never touched and is still underneath,
      // which is exactly what a native wrapper reads when it asks whether it can go back.
      return true;
    }
    // 2. The screen itself leaves, to its own parent from the table -- never to the chat by default.
    const dest = ezikBackDestination(cur);
    if (!dest || dest === cur) return false;
    if (EZIK_SHEET_SCREENS.indexOf(cur) !== -1) sheetOriginRef.current.pop();   // spend this sheet's opener, not another's
    if (viaPop) backNavRef.current = true;   // the entry is gone: do not push a replacement
    else histReplaceRef.current = true;      // a visible press moves within the entry it stands on
    setScreen(dest);
    return true;
  };
  // The destination this screen's back resolves to, read without spending anything -- both the
  // resolver above and the visible-press path below ask it, so they cannot disagree.
  const ezikBackDestination = (cur) => {
    const origins = sheetOriginRef.current;
    const isSheet = EZIK_SHEET_SCREENS.indexOf(cur) !== -1;
    return ezikBackTarget(cur, isSheet ? origins[origins.length - 1] : null);
  };
  // ===== goEzikBack -- WHAT EVERY VISIBLE BACK CONTROL PRESSES =====
  // S90: it produces the SAME one-step result as the hardware button because, for a screen-level
  // back, it now asks the browser to go back and lets the popstate listener resolve it through
  // the table above. That is what keeps the depth honest: the app pops exactly one entry per
  // layer it leaves, where before a visible press RELABELLED its entry and left it on the stack,
  // so entries only ever accumulated and the hardware button then answered a run of dead presses
  // at the root before the app would close. A nested layer pushed no entry, so it still closes
  // here directly and touches no history. With nothing of ours left on the stack the direct
  // resolution is kept, so a back can never reach past the app's first entry.
  const goEzikBack = () => {
    const cur = screenRef.current;
    if (EZIK_ROOT_SCREENS.indexOf(cur) === -1) {
      // S91: a REGISTERED layer owns an entry, so its visible back takes the same route the
      // device button takes -- a real pop, resolved by the same popstate listener. The direct
      // close below is kept for the one layer that owns no entry (the mushaf's unregistered
      // safety net), and only for it.
      if (ezikBackLayers.length > 0 && ezikHistBack()) return true;
      if (closeEzikNested()) return true;
    }
    const dest = ezikBackDestination(cur);
    if (!dest || dest === cur) return false;
    if (ezikHistBack()) return true;
    return resolveEzikBack(false);
  };
  // Sheets remember their opener so their back returns THERE: home when home opened them, the
  // chat when the chat's own drawer did, الإعدادات when its own التحكم row did. Recorded on the
  // way in, spent once on the way out.
  const openEzikSheet = (target) => { sheetOriginRef.current.push(screenRef.current); setScreen(target); };
  // S90: the PIN gate and the parental screen behind it are ONE layer, not two -- passing the
  // gate spends it and there is no back TO it. Relabelling the gate's entry instead of pushing a
  // second one keeps one entry per layer, so the parental screen's back lands on الإعدادات and
  // leaves no spent entry behind to swallow a later press.
  const replaceEzikScreen = (target) => { histReplaceRef.current = true; setScreen(target); };
  // S91: publish this resolver so a nested layer's own back button presses the same one.
  useEffect(() => { ezikBackHandler = goEzikBack; });

  // ===== S92 -- THE SIDE MENU IS A BACK LAYER =====
  // The device back button has to CLOSE THE MENU FIRST, and the chat is a root screen: it owns no
  // history entry of its own, so a press there would otherwise reach the platform and leave the
  // app with the menu still on screen. Registering the menu here gives it one real entry for
  // exactly as long as it is open, through the same hook the adhkar reader and the mushaf's open
  // surah use -- one layer, one entry, spent once.
  //
  // The consequence is that EVERY visible way out of the menu has to spend that same entry, or a
  // spent-but-unclaimed entry would answer a later press with nothing. So no menu item calls
  // setDrawerOpen(false) itself: each hands its action to closeDrawerWith, which asks the
  // application back to close the menu and runs the action inside the closer -- after the pop that
  // spent the entry, so any screen the action then opens pushes its own entry cleanly on top.
  const drawerNavRef = useRef(null);
  useEzikBackLayer(drawerOpen, () => {
    setDrawerOpen(false);
    setChatPendingDelete(null);        // a half-asked delete never survives the menu closing
    const run = drawerNavRef.current;
    drawerNavRef.current = null;
    if (run) run();
  });
  const closeDrawerWith = (fn) => {
    drawerNavRef.current = (typeof fn === 'function') ? fn : null;
    // ezikHistBack is false only when this app owns nothing on the stack -- the menu's entry could
    // not be pushed at all. Then there is nothing to spend and the menu closes directly.
    if (ezikHistBack()) return;
    setDrawerOpen(false);
    setChatPendingDelete(null);
    const run = drawerNavRef.current;
    drawerNavRef.current = null;
    if (run) run();
  };
  // Opening it re-reads the list from the store, so the menu always shows what a reboot would.
  // S98: and it clears the search box, so the menu never reopens on somebody's half-typed query.
  // No corpus is built here — that happens on the first letter and not before.
  const openDrawer = () => { refreshChatList(); setChatPendingDelete(null); setChatQuery(''); setDrawerOpen(true); };

  useEffect(() => {
    const onPop = () => { ezikHistSpend(); resolveEzikBack(true); };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);
  // ONE ENTRY PER OPENED SCREEN, and never one for a back. Opening a section pushes; a back
  // relabels the entry it is standing on (replaceState) instead of stacking a second copy of the
  // parent; a pop-driven change pushes nothing at all, because the pop already spent the entry.
  // Nothing here runs during render -- this is an effect, after commit, as it always was.
  useEffect(() => {
    if (backNavRef.current) { backNavRef.current = false; return; }
    const rooted = EZIK_ROOT_SCREENS.indexOf(screen) !== -1;
    if (histReplaceRef.current) {
      histReplaceRef.current = false;
      if (!rooted) { try { window.history.replaceState({ screen }, ''); } catch (e) {} }
      return;
    }
    if (!rooted) ezikHistPush({ screen });
  }, [screen]);

  // Stop audio when leaving a screen. App never unmounts on a screen switch, so playing
  // Audio() objects in audioRef survive; this cleanup fires on every `screen` transition.
  // cancelAudio() is UNCONDITIONAL (stops greeting TTS + recitation on any transition). The
  // abort is gated to "leaving chat" only: the greeting-leak fix needs the abort when leaving
  // chat (chat→memorize/call), but on the startup onboarding→chat transition the greeting's
  // controller is set DURING that transition, so an unconditional abort here would kill the
  // just-started greeting (leaving the UI stuck on the typing dots). `leaving` captures the
  // screen this cleanup belongs to, so we abort only when that screen was 'chat'.
  useEffect(() => {
    const leaving = screen;
    return () => {
      if (leaving === 'chat') { try { abortRef.current?.abort(); } catch (e) {} }
      cancelAudio();
    };
  }, [screen]);

  // Mobile autoplay fix: with chat voice ON by default, the first spoken reply (the greeting) plays
  // after an async callAI gap, so user-activation can lapse and mobile Safari/Chrome may block it.
  // Prime the audio channel once, synchronously inside the first real gesture anywhere in the app
  // (the onboarding tap always precedes the greeting; also covers a returning user who lands in chat).
  // Best-effort and fully guarded — must never break onboarding or the greeting. Does NOT touch the
  // existing blob-play path; it only unlocks the channel.
  const unlockAudioPlayback = () => {
    if (audioUnlockedRef.current) return; // one-time only
    audioUnlockedRef.current = true;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) {
        const ctx = new Ctx();
        if (ctx.state === 'suspended' && ctx.resume) ctx.resume().catch(() => {});
        // A 1-sample silent buffer started within the gesture satisfies the user-activation requirement.
        const src = ctx.createBufferSource();
        src.buffer = ctx.createBuffer(1, 1, 22050);
        src.connect(ctx.destination);
        src.start(0);
      }
    } catch (e) { /* fail silent — never block onboarding or audio */ }
    // iOS: HTML5 <audio> has a SEPARATE activation gate from AudioContext. The blob-play path
    // uses `new Audio()`, so we must also prime an HTML5 element here, inside the gesture, or
    // iOS keeps audio muted. A 1-sample silent WAV (built inline as a Blob — no network) does it.
    try {
      const wav = new Uint8Array([82,73,70,70,38,0,0,0,87,65,86,69,102,109,116,32,16,0,0,0,1,0,1,0,64,31,0,0,128,62,0,0,2,0,16,0,100,97,116,97,2,0,0,0,0,0]);
      const url = URL.createObjectURL(new Blob([wav], { type: 'audio/wav' }));
      const u = audioElRef.current || (audioElRef.current = new Audio()); u.src = url;
      const pr = u.play();
      if (pr && pr.then) pr.then(() => { try { u.pause(); } catch (e) {} URL.revokeObjectURL(url); }).catch(() => { try { URL.revokeObjectURL(url); } catch (e) {} audioUnlockedRef.current = false; }); // play() rejected -> not actually unlocked; allow a later gesture to retry
    } catch (e) { audioUnlockedRef.current = false; /* prime threw -> allow a later gesture to retry */ }
  };

  useEffect(() => {
    const handler = () => { unlockAudioPlayback(); };
    const opts = { capture: true };
    // Stay armed: after a real success the ref guard makes each call a no-op; before success we retry on every gesture.
    window.addEventListener('pointerdown', handler, opts);
    window.addEventListener('keydown', handler, opts);
    return () => {
      window.removeEventListener('pointerdown', handler, opts);
      window.removeEventListener('keydown', handler, opts);
    };
  }, []);

  // إعداد التعرف على الصوت
  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    const recognition = new SR();
    recognition.lang = 'ar-SA';
    recognition.continuous = true;       // keep listening across pauses until the user taps the mic off
    recognition.interimResults = true;
    recognition.onresult = (event) => {
      // This ar-SA engine emits CUMULATIVE isFinal results (each later final RE-INCLUDES the
      // earlier text), so appending stacks/duplicates. Mirror the proven call-mode handler:
      // rebuild from index 0 with a prefix-merge and REPLACE the committed buffer (not +=).
      let finalText = '', interim = '';
      for (let i = 0; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
