function ParentGate({ pinInput, setPinInput, pinError, setPinError, onSuccess, onBack }) {
  const hasPin = (() => { try { return !!localStorage.getItem(PIN_HASH_KEY); } catch (e) { return false; } })();
  const [adultOk, setAdultOk] = useState(false);
  const [challenge] = useState(() => ({ a: 2 + Math.floor(Math.random() * 8), b: 2 + Math.floor(Math.random() * 8) })); // single digit, same as the welcome gate
  const [confirmPin, setConfirmPin] = useState('');
  const [errMsg, setErrMsg] = useState('رمز خاطئ');
  const fail = (msg) => { setErrMsg(msg); setPinError(true); setTimeout(() => setPinError(false), 1800); };
  const verify = async () => {
    try {
      const stored = localStorage.getItem(PIN_HASH_KEY);
      if (stored && (await hashPin(pinInput)) === stored) { onSuccess(); return; }
    } catch (e) {}
    fail('رمز خاطئ');
  };
  const create = async () => {
    if (!/^[0-9]{4,}$/.test(pinInput)) return fail('اختر ٤ أرقام على الأقل');
    if (pinInput !== confirmPin) return fail('الرمزان غير متطابقان');
    try { localStorage.setItem(PIN_HASH_KEY, await hashPin(pinInput)); } catch (e) { return fail('تعذّر الحفظ'); }
    setConfirmPin(''); onSuccess();
  };
  // D92: unchanged for a child profile -- this is a real boundary (the parents-only panel) and the
  // gate belongs here. An adult or teen profile setting its own PIN meets no arithmetic, per the
  // ruling that no teen or adult profile faces a challenge at any point.
  if (!hasPin && !adultOk && PARENTAL_GATE_ENABLED && childProfileActive()) return <AdultGate a={challenge.a} b={challenge.b} onPass={() => setAdultOk(true)} onCancel={onBack} />;
  return (
    <div style={s.onboardingContainer}>
      <div style={s.onboardingCard}>
        <div style={s.bigEmoji}>🔒</div>
        <div style={s.onboardingTitle}>{hasPin ? 'لوحة الأهل' : 'إنشاء رمز لوحة الأهل'}</div>
        <div style={s.onboardingSubtitle}>{hasPin ? 'أدخل رمز الدخول' : 'اختر رمزاً من ٤ أرقام على الأقل — لن يُعرض، فاحفظه في مكان آمن'}</div>
        <input type="password" inputMode="numeric" value={pinInput} onChange={(e) => setPinInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && hasPin && verify()} placeholder="••••" style={{ ...s.onboardingInput, textAlign: 'center', letterSpacing: '0.5em', borderColor: pinError ? '#C44536' : '#E5EBF5' }} autoFocus />
        {!hasPin && <input type="password" inputMode="numeric" value={confirmPin} onChange={(e) => setConfirmPin(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && create()} placeholder="أعد الرمز" style={{ ...s.onboardingInput, textAlign: 'center', letterSpacing: '0.5em', borderColor: pinError ? '#C44536' : '#E5EBF5' }} />}
        {pinError && <div style={{ color: '#C44536', fontSize: 14, marginTop: -8, marginBottom: 8 }}>{errMsg}</div>}
        <button onClick={hasPin ? verify : create} style={s.primaryBtn}>{hasPin ? 'دخول' : 'حفظ الرمز'}</button>
        <button onClick={onBack} style={s.secondaryBtn}>رجوع</button>
      </div>
    </div>
  );
}

// قفل الإنفاق — مطالبةٌ بسيطة على نمط لوحة الأهل. تُقارَن بصمة SHA-256 للرمز المُدخَل
// بالثابت SPEND_GATE_SHA256؛ لا يُخزَّن الرمز نفسه أبداً. النجاح يفتح القفل ويُحفَظ لهذا الجهاز.
function SpendGate({ onUnlock, onExit }) {
  const [code, setCode] = useState('');
  const [err, setErr] = useState(false);
  const submit = async () => {
    try { if ((await hashPin(code)) === SPEND_GATE_SHA256) { onUnlock(); return; } } catch (e) {}
    setErr(true); setTimeout(() => setErr(false), 1800);
  };
  return (
    <div style={s.onboardingContainer}>
      <div style={s.onboardingCard}>
        <div style={s.bigEmoji}>🔒</div>
        <div style={s.onboardingTitle}>رمز الدخول</div>
        <div style={s.onboardingSubtitle}>أدخل رمز الدخول لتفعيل المحادثة</div>
        <input type="password" inputMode="numeric" value={code} onChange={(e) => setCode(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && submit()} placeholder="••••" style={{ ...s.onboardingInput, textAlign: 'center', letterSpacing: '0.5em', borderColor: err ? '#C44536' : '#E5EBF5' }} autoFocus />
        {err && <div style={{ color: '#C44536', fontSize: 14, marginTop: -8, marginBottom: 8 }}>رمز خاطئ</div>}
        <button onClick={submit} style={s.primaryBtn}>دخول</button>
        <button onClick={onExit} style={s.secondaryBtn}>رجوع</button>
      </div>
    </div>
  );
}

// D88 -- the settings sheet. It carries .theme-dark itself so it is themed by the same scoped
// palette the chat uses; reached from the drawer's gear. The choice is written through
// applyTheme, the one code path that also runs at boot, and persisted immediately.
function SettingsSheet({ theme, onTheme, onBack }) {
  // D89: this entry is rendered ONLY while a valid founder token is held. hasFounderToken() is
  // read here, at render, and never from a cached flag -- the rule every other gate in this file
  // follows. It is a VISIBILITY rule, not the lock: api/unlock.js refuses a set-pin call that
  // arrives without a token no matter what this UI chooses to draw.
  const canSetPin = hasFounderToken();
  const [pin1, setPin1] = useState('');
  const [pin2, setPin2] = useState('');
  const [pinMsg, setPinMsg] = useState('');
  const [pinBusy, setPinBusy] = useState(false);
  const savePin = async () => {
    if (pinBusy) return;
    // The ONLY check made here, because the server is sent one value and never sees the second
    // field. Length, shape and authorisation are the server's to judge and the server's to word.
    if (pin1 !== pin2) { setPinMsg('\u0627\u0644\u0631\u0645\u0632\u0627\u0646 \u063A\u064A\u0631 \u0645\u062A\u0637\u0627\u0628\u0642\u064A\u0646.'); return; }
    setPinBusy(true); setPinMsg('');
    try {
      const r = await fetch('/api/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...capHeaders() },   // carries the founder token
        credentials: 'same-origin',
        body: JSON.stringify({ action: 'set-pin', pin: pin1, deviceId: getDeviceId() }),
      });
      const d = await r.json().catch(() => ({}));
      const good = r.ok && d && d.ok === true;
      // The SERVER owns every refusal's wording: a missing token, a short code and an
      // unreachable store are three different truths and only it knows which.
      setPinMsg(good ? '\u062A\u0645 \u062A\u063A\u064A\u064A\u0631 \u0627\u0644\u0631\u0645\u0632.' : ((d && d.message) || ''));
      if (good) { setPin1(''); setPin2(''); }
    } catch (e) {
      setPinMsg('');   // a network failure carries no server message; do not invent one
    }
    setPinBusy(false);
  };
  const Opt = ({ value, label }) => (
    <button
      onClick={() => onTheme(value)}
      aria-pressed={theme === value}
      style={{ ...s.themeOpt, ...(theme === value ? s.themeOptActive : {}) }}
    >
      <span style={{ ...s.themeSwatch, background: value === 'dark' ? '#171B24' : '#FFFFFF', borderColor: value === 'dark' ? '#2A313D' : '#E5EBF5' }} />
      <span>{label}</span>
    </button>
  );
  return (
    <div className="theme-dark" style={s.settingsContainer}>
      <div style={s.settingsHeader}>
        <button onClick={onBack} style={s.backBtn}>{'\u2190 \u0631\u062c\u0648\u0639'}</button>
        <div style={s.settingsTitle}>{'\u0627\u0644\u0625\u0639\u062f\u0627\u062f\u0627\u062a'}</div>
      </div>
      <div style={s.settingsBody}>
        <div style={s.settingsCard}>
          <div style={s.settingsLabel}>{'\u0627\u0644\u0645\u0638\u0647\u0631'}</div>
          <div style={s.themeRow}>
            <Opt value="light" label={'\u0641\u0627\u062a\u062d'} />
            <Opt value="dark" label={'\u062f\u0627\u0643\u0646'} />
          </div>
          <div style={s.settingsHint}>{'\u064a\u064f\u062d\u0641\u0638 \u0639\u0644\u0649 \u0647\u0630\u0627 \u0627\u0644\u062c\u0647\u0627\u0632'}</div>
        </div>
        {/* D89 -- change the unlock PIN. Rendered ONLY with a founder token in hand. Two fields,
            new and confirm; both are type=password so nothing is ever shown on screen, and no
            stored PIN is read, displayed or defaulted into either box -- the client has no way
            to learn the current one and does not ask for it. */}
        {canSetPin && (
        <div style={{ ...s.settingsCard, marginTop: 12 }}>
          <div style={s.settingsLabel}>{'\u062A\u063A\u064A\u064A\u0631 \u0631\u0645\u0632 \u0627\u0644\u0641\u062A\u062D'}</div>
          <input type="password" inputMode="numeric" autoComplete="new-password" value={pin1}
            onChange={(e) => setPin1(e.target.value)} placeholder={'\u0627\u0644\u0631\u0645\u0632 \u0627\u0644\u062C\u062F\u064A\u062F'} style={s.settingsInput} />
          <input type="password" inputMode="numeric" autoComplete="new-password" value={pin2}
            onChange={(e) => setPin2(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') savePin(); }}
            placeholder={'\u062A\u0623\u0643\u064A\u062F \u0627\u0644\u0631\u0645\u0632'} style={s.settingsInput} />
          {pinMsg && <div style={s.settingsMsg}>{pinMsg}</div>}
          <button onClick={savePin} disabled={pinBusy || !pin1 || !pin2}
            style={{ ...s.settingsSaveBtn, opacity: (pinBusy || !pin1 || !pin2) ? 0.5 : 1 }}>{'\u062D\u0641\u0638'}</button>
        </div>
        )}
      </div>
    </div>
  );
}

// ============================================================
// Live call screen (Layer 2 — one automatic turn; presentational, driven by App state)
// ============================================================
// callState is owned by App and driven by real audio events (tap → listening → thinking →
// speaking → idle). The avatar is tap-to-talk; Mute gates the mic. No audio logic lives here.
function CallScreen({ profileName, gender, callState, heard, isMuted, onToggleMute, onTalk, onExit }) {
  // Accessibility: respect reduced-motion — fall back to a static (non-pulsing) ring.
  const reduceMotion = (typeof window !== 'undefined' && window.matchMedia)
    ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;

  const STATES = {
    idle:      { label: 'اضغط للتحدّث',       ring: 'rgba(255, 255, 255, 0.35)', speed: '3.6s' },
    listening: { label: 'أستمع إليك...',     ring: '#3FA66A',                 speed: '2.4s' },
    thinking:  { label: 'لحظة...',            ring: 'rgba(42, 166, 222, 0.55)', speed: '3.2s' },
    speaking:  { label: gender === 'female' ? 'عزك تتحدّث...' : 'عزك يتحدّث...',  ring: '#2AA6DE',                 speed: '1.2s' },
  };
  const cs = STATES[callState] || STATES.idle;

  const ringStyle = {
    ...s.callRing,
    borderColor: cs.ring,
    animation: reduceMotion ? 'none' : `callPulse ${cs.speed} ease-in-out infinite`,
  };

  // Layer 3: the avatar stays tappable while the tutor is thinking/speaking — tapping there is the
  // manual interrupt ("my turn"). Disabled only when muted, or during 'listening' (no-op as before).
  const canTalk = !isMuted && (callState === 'idle' || callState === 'thinking' || callState === 'speaking');

  return (
    <div style={s.callContainer}>
      <div style={s.callTopLabel}>{gender === 'female' ? 'مكالمة مع عزك' : 'مكالمة مع عزك'}</div>
      <div style={{ textAlign: 'center', maxWidth: 320, padding: '6px 16px 0', fontSize: 12, lineHeight: 1.5, color: 'rgba(255, 255, 255, 0.6)' }}>تتحدّث إلى ذكاءٍ اصطناعيّ — لا إلى إنسان.</div>
      <div style={s.callCenter}>
        <div style={{ ...s.callAvatarWrap, cursor: canTalk ? 'pointer' : 'default' }} onClick={canTalk ? onTalk : undefined}>
          <div style={ringStyle} />
          <div style={s.callAvatar}><MoonStarsIcon size={56} color="#2AA6DE" /></div>
        </div>
        {profileName && <div style={s.callSubLabel}>{profileName}</div>}
        {/* Live feedback: what the mic is hearing (interim). Empty when not listening. */}
        <div style={s.callHint}>{callState === 'listening' && heard ? heard : (isMuted ? 'الميكروفون مكتوم' : '')}</div>
      </div>
      <div style={s.callControls}>
        <button onClick={onToggleMute} style={s.callMuteBtn}>
          {isMuted ? <MicOffIcon size={24} color="#12327A" /> : <MicIcon size={24} color="#12327A" />}
          <span style={s.callBtnLabel}>{isMuted ? 'مكتوم' : 'كتم'}</span>
        </button>
        <button onClick={onExit} style={s.callEndBtn}>
          <PhoneOffIcon size={24} color="#FFFFFF" />
          <span style={{ ...s.callBtnLabel, color: '#FFFFFF' }}>إنهاء</span>
        </button>
      </div>
    </div>
  );
}

/* 14.1 */
// Standalone mushaf reader. NOT part of MemorizeScreen -- separate tile, separate screen.
// Reuses SurahCard verbatim: it already loads the mushaf, sources the basmalah from
// getVerseText(1,1) (never hand-written), skips it for al-Fatiha (it IS ayah 1) and
// at-Tawbah (it has none), stamps every ayah with U+06DD + its Arabic-Indic number, and
// carries the full-surah recitation button. No new Quran-text path is introduced here.
/* 14.2 */
// صفحةٌ واحدةٌ من المصحف. كلُّ خانةٍ في التخطيط تُجلب كلمتَها من المصحف المحروس.
/* 14.2f2 */
// ضبطُ السطر — وهو ما يجعل الصفحة مصحفاً لا نصّاً.
// كلُّ كلمةٍ عنصرُ flex مستقلّ، و justify-content:space-between يفرد ما بينها حتى
// يمتدّ السطرُ من حافةٍ لحافة. وكان لنا حجمٌ واحدٌ للصفحة يُقاس بأضيقِ سطرٍ فيها،
// فيَنقُص ما سواه عن عرضه ويُملأ الفارقُ فراغاً. الآن لكلِّ سطرٍ حجمُه: يفي بعرضه
// بحروفه لا بفراغه، والتفاوتُ بين أسطر الصفحة محصورٌ بـ+١٨٪ فوق أصغرها — فلا
// يصغر سطرٌ عمّا كان، ولا تتبعثر الصفحة. ولا يلتفّ سطرٌ أبداً، ولا يُقصّ حرف.
// القياس يجري قبل الرسم (useLayoutEffect) فلا تُرى قفزة. ولو فشل القياس لأيّ
// سبب، نرسم بحجم الأساس — مقروءاً. لا نُخفي المصحف أبداً.
const PG_BASE_FS = 22;    // حجمُ القياس. النتيجة تُشتقّ منه ولا يُستعمل كما هو.
const PG_GAP_EM = 0.22;   // أدنى فجوةٍ بين كلمتين، نسبةً للخطّ (تكبر وتصغر معه)
const PG_LINE_H = 1.75;   // ارتفاعُ السطر. يدخل في حساب السقف الرأسيّ وفي النمط معاً.
// خطُّ المصحف في موضعٍ واحد: يستعمله النمطُ المرسوم والقياسُ الخفيّ معاً. لو افترقا
// بحرفٍ لقِسنا خطّاً ورسمنا آخر، وسقط الثابتُ العالميّ كلُّه بصمت. لا خطَّ جديداً هنا.
const PG_FONT = "'Amiri Quran', 'Amiri', serif";

/* Session 51 -- ONE font size for all 604 pages.
 * ---------------------------------------------------------------------------
 * الحجمُ كان يُشتقّ من أضيق سطرٍ *داخل الصفحة الواحدة*، فاختلف من صفحةٍ لصفحة:
 * النساء ٧٩ كبيرةٌ والتين ٥٩٧ صغيرة. والمصحفُ المطبوع حجمُه واحدٌ في الـ٦٠٤.
 * فصار المقياسُ عالمياً: أعرضُ أسطر المصحف كلِّه تُقاس مرّةً واحدة، ومنها ثابتٌ
 * واحد K يحكم كلَّ صفحة. القياسُ مرّةٌ لكلّ جلسةٍ (ولكلّ عرضِ حاوية)، لا مرّةً
 * لكلّ صفحة: فتحُ صفحةٍ لا يقيس مئةً وخمسين سطراً، بل يقرأ K المخزَّن.
 */
const PG_CAND_N = 150;    // عددُ المرشّحين. ١٥٠ لا ٤٠: تقديرُ المحارف تقريبيٌّ للعربية
const PG_AVG_CH = 0.5;    // عرضُ المحرف الوسطيّ بالـem — لتحويل الفجوة إلى «محارف»
let PG_K = null;          // الثابتُ العالميّ: أكبرُ تكبيرٍ يسعه أعرضُ سطرٍ في المصحف
let PG_K_BOX = 0;         // العرضُ الذي قيس عنده. اختلافُه ⟹ إبطالٌ وإعادةُ قياس
let PG_K_MS = 0;          // كلفةُ القياس الأولى بالمللي ثانية — للتقرير لا للمنطق
const PG_GUARD_PAGES = new Set();   // صفحاتٌ اضطرّ فيها حارسُ الفيض لتصغيرٍ خاصّ

// العلاماتُ لا تُقدّم القلم، فلا تدخل في كلفة السطر. (الحركاتُ · الصغرى · علاماتُ الوقف)
const pgAdvChars = (t) => {
  let n = 0;
  for (const ch of t) {
    const u = ch.codePointAt(0);
    if (!((u >= 0x064b && u <= 0x065f) || u === 0x0670 || (u >= 0x06d6 && u <= 0x06ed))) n++;
  }
  return n;
};

// خاناتُ السطر ← ما يُرسم فيه فعلاً. مصدرٌ واحدٌ للتصيير وللقياس معاً: لو افترقا
// لقِسنا سطراً غيرَ الذي نرسم. كلُّ حرفٍ من __quranData وحده — لا نصَّ بأيدينا.
const pgLineTokens = (ln) => {
  const parts = [];
  if (!ln || !ln.w) return parts;
  for (const loc of ln.w) {
    const a = loc.split(':');
    const sn = parseInt(a[0], 10), an = parseInt(a[1], 10), wi = parseInt(a[2], 10);
    const words = wordsOfAyah(sn, an);
    const w = words[wi - 1];
    if (w === undefined) continue;                 // لا يقع — ٧٧٤٢٩/٧٧٤٢٩ مبرهَنة
    parts.push(w);
    if (wi === words.length) parts.push('۝' + toArabicDigits(an));  // آخرُ كلمةٍ ← رقمُ الآية
  }
  return parts;
};

// (أ) المرشّحون — من البيانات وحدها، بلا DOM. كلفةُ السطر = محارفُه ذواتُ العرض
// زائدَ فجواتِه محسوبةً بالمحارف. تقديرٌ تقريبيّ يُرتّب فقط؛ الحكمُ للقياس الحقيقيّ
// بعده، ولذا نأخذ ١٥٠ لا الأعرضَ وحده: خطأُ الترتيب يُبتلع في الهامش.
let __pgCands = null;
const pgCandidates = () => {
  if (__pgCands) return __pgCands;
  if (!__layoutData || !__layoutData.p || !__quranData) return null;
  const gapCh = PG_GAP_EM / PG_AVG_CH;
  const all = [];
  for (const pg of __layoutData.p) {
    for (const ln of pg.l) {
      if (ln.t !== 't') continue;
      const parts = pgLineTokens(ln);
      if (!parts.length) continue;
      let cost = (parts.length - 1) * gapCh;
      for (const p of parts) cost += pgAdvChars(p);
      all.push({ cost, parts });
    }
  }
  if (!all.length) return null;
  all.sort((a, b) => b.cost - a.cost);
  __pgCands = all.slice(0, PG_CAND_N).map((x) => x.parts);
  return __pgCands;
};

    return <MushafPage page={page} headerSurah={headerSurah} needHeader={needHeader} needBasmala={needBasmala} />;
  // No interaction of any kind: pointerEvents none lets the strip keep the drag (the touch
  // handlers sit on pgViewport and the events pass straight through), draggable false kills
  // the native image drag. No onClick, no ayah tap, no selection. Phase one is a still page.
  // 75/D -- the frame is the positioning anchor and the ratio holder; the sheet inside it is the
  // crop window. The two rules come FIRST in DOM order on purpose: their paper tone is then
  // painted BEHIND the page image and can never sit over it. The corner motifs come last, and
  // they paint only outside the crop window.
  return (
    <div style={s.svgFrame}>
      <div style={s.svgRuleOuter} />
      <div style={s.svgRuleInner} />
      <div style={s.svgSheet}>
        <img
          src={mushafSvgUrl(page.n)}
          alt=""
          decoding="async"
          draggable="false"
          style={s.svgImg}
          onLoad={() => { if (onSheetLoad) onSheetLoad(page.n); }}
          onError={() => setBroke(true)}
        />
      </div>
      <SheetCorners />
    </div>
  );
}

function MushafPage({ page, headerSurah, needHeader, needBasmala }) {
  const ref = useRef(null);
  const [fit, setFit] = useState(null);   // null = لم يُقَس بعد

  React.useLayoutEffect(() => {
    if (fit) return;
    const el = ref.current;
    if (!el) return;
    // (أ) عرضُ الخانة من الصفحة نفسِها، ثمّ الثابتُ العالميّ. لا يُقاس هنا سطرٌ
    // واحدٌ لأجل الحجم: K محسوبٌ مرّةً لكلّ الجلسة، وفتحُ الصفحة يقرأه فحسب.
    const rows = el.querySelectorAll('[data-l]');
    let box = 0;
    for (let r = 0; r < rows.length; r++) { const b = rows[r].clientWidth; if (b > box) box = b; }
    if (!box) return;                                  // لم تُقَس خانةٌ ← ابقَ على الأساس
    const K = pgMeasureK(box);
    if (K === null) return;                            // عجز القياسُ ← ابقَ على الأساس
    // (ب) حجمٌ واحدٌ للمصحف كلِّه. الـ٠٫٩٩ هامشُ التقريب نفسُه الذي كان.
    let uni = Math.max(8, Math.min(40, Math.floor(PG_BASE_FS * K * 0.99)));
    // (ج) حارسُ الفيض — الثابتُ الذي لا يُخرَق. أضيقُ نسبةٍ في هذه الصفحة بعينها،
    // مقيسةً من الـDOM لا مقدَّرة. إن كانت دون العالميّ فالسطرُ سيفيض بالعالميّ،
    // فتُصغَّر هذه الصفحةُ وحدَها إلى ما يسعها. K لا يُمَسّ: صفحةٌ شاذّةٌ لا تحكم ٦٠٤.
    let guard = Infinity;
    for (let r = 0; r < rows.length; r++) {
      const kids = rows[r].children;
      const b = rows[r].clientWidth;
      if (!b || !kids.length) continue;
      let content = 0;
      for (let k = 0; k < kids.length; k++) content += kids[k].offsetWidth;
      content += (kids.length - 1) * (PG_BASE_FS * PG_GAP_EM);
      if (!(content > 0)) continue;
      const f = PG_BASE_FS * (b / content);
      if (f < guard) guard = f;
    }
    if (isFinite(guard) && guard > 0) {
      const g = Math.max(8, Math.min(40, Math.floor(guard * 0.99)));
      if (g < uni) { uni = g; PG_GUARD_PAGES.add(page.n); }
    }
    // (د) الملاءمة الرأسيّة: مجموعُ الأسطر بالحجم الواحد، مضافاً إليه ارتفاعُ ما ليس
    // سطراً (رأسٌ · بسملةٌ · فاصل) كما قيس من الـDOM. فإن فاض ضُرب الحجمُ بنسبةٍ
    // واحدة — والصفحةُ تصغر معاً ولا ينكسر تناسبُها.
    const kidsPage = el.children;
    let otherH = 0;
    for (let c = 0; c < kidsPage.length; c++)
      if (!kidsPage[c].hasAttribute('data-l')) otherH += kidsPage[c].offsetHeight;
    const room = el.clientHeight;
    const total = rows.length * uni * PG_LINE_H * 1.06 + otherH;
    if (room > 0 && total > room)
      uni = Math.max(8, Math.min(40, Math.floor(uni * (room / total) * 0.99)));
    // (هـ) الفائضُ الرأسيّ — كما استقرّ في c4393fe بلا تغيير في جوهره. الحجمُ يُقاس
    // بالعرض وحده، فيبقى في الطول فائضٌ في أكثر الصفحات. توزيعُه فراغاً يبعثر السطور،
    // وتكويمُه فوق وتحت يترك الإطارَ خاوياً — والوجهُ استهلاكُه: يرتفع تباعدُ السطر
    // وحدَه حتى يملأ النصُّ إطارَه، ولا يُمَسّ الحجم.
    // السقفُ ٢٫٠× قاطعٌ — رُفع من ١٫٥× في ١٤٫٥. الورقةُ لمّا صارت تملأ خانتَها اتّسع
    // ما تحتها من فائض، وكان السقفُ القديم يردُّه فراغاً مكوَّماً داخل الإطار؛ فرفعُه
    // يصرفه تباعداً بين السطور. ولا يُجاوز ٢٫٠ بحال: بلا سقفٍ تنفرط الصفحةُ الشحيحة —
    // سطران في خانةٍ كاملة — إلى سطرين متباعدين لا يُقرآن نصّاً واحداً.
    // avail يطرح حشوةَ الصفحة، بخلاف room أعلاه: زيادةُ التباعد لا تصغّر حجماً، أمّا
    // مسُّ room فيغيّر ما تحكم به الملاءمةُ الرأسيّة.
    let lead = PG_LINE_H;
    let pad = 0;
    try {
      const cs = window.getComputedStyle(el);
      pad = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    } catch (e) { pad = 0; }
    const avail = room - pad;
    const textH = rows.length * uni * PG_LINE_H * 1.06 + otherH;
    if (avail > 0 && textH > 0 && textH < avail) lead = Math.min(PG_LINE_H * 2.0, PG_LINE_H * (avail / textH));
    // البسملةُ تتبع الحجمَ الواحد — ولم يعد ثَمَّ وسيطٌ تتبعه، فالأسطرُ كلُّها سواء.
    setFit({ uni, lead, basmala: Math.round(uni * 0.92) });
  }, [fit]);

  // قبل القياس تُرسم الصفحة كلُّها بحجم الأساس مفرودةً — وهي حالةُ القياس نفسها.
  const basmalaFs = fit ? fit.basmala : Math.round(PG_BASE_FS * 0.92);
  const out = [];
  const done = {};   /* 14.2f4 */  // رأسٌ حُقن لهذه السورة على هذه الصفحة — فلا يُحقن مرّتين
  for (let i = 0; i < page.l.length; i++) {
    const ln = page.l[i];
    if (ln.t === 't') {
      // سطرٌ يفتتح سورةً بلا بسملةٍ في المصدر (٨١ و٨٥) ← الرأسُ ثمّ البسملةُ فوقه.
      // أمّا السور التي للمصدر بسملتُها (١٠ و٨٢ و٨٦) فرأسُها يُحقن عند سطر البسملة
      // نفسِه، فوقَه — لا هنا. وإلّا نزل الرأسُ تحت البسملة، وانقلب ترتيبُ المصحف.
      const op = ln.w[0].split(':');
      if (op[1] === '1' && op[2] === '1') {
        const sn0 = parseInt(op[0], 10);
        if (needHeader && needHeader[sn0] && !done[sn0]) {
          done[sn0] = 1;
          out.push(<div key={'h' + i} style={s.pgHeader}>{'سُورَةُ ' + SURAH_NAMES[sn0]}</div>);
        }
        if (needBasmala && needBasmala[sn0])
          out.push(<div key={'b' + i} style={{ ...s.pgBasmala, fontSize: basmalaFs }}>{getVerseText(1, 1) || ''}</div>);
      }
      // نفسُ الدالّة التي بها اختير المرشّحون وقيسوا — فلا يفترق المرسومُ عن المقيس.
      const parts = pgLineTokens(ln);
      // حجمٌ واحدٌ لكلّ سطرٍ في الصفحة، وهو نفسُه في الـ٦٠٤ إلا حيث عمل الحارس.
      // و space-between دائماً بلا استثناء: السطرُ يمتدّ من حافةٍ لحافة كالمطبوع.
      const lfs = fit ? fit.uni : PG_BASE_FS;
      out.push(
        <div key={i} data-l={i} style={{ ...s.pgLine, fontSize: lfs, lineHeight: fit ? fit.lead : PG_LINE_H, gap: PG_GAP_EM + 'em' }}>
          {parts.map((p, j) => <span key={j} style={s.pgWord}>{p}</span>)}
        </div>
      );
    } else if (ln.t === 'h') {
      const sn = headerSurah[page.n + ':' + ln.n];
      out.push(<div key={i} style={sn ? s.pgHeader : s.pgBlank}>{sn ? 'سُورَةُ ' + SURAH_NAMES[sn] : ''}</div>);
    } else {
      // ترتيبُ المصحف لا يُقلب: الرأسُ، ثمّ البسملةُ، ثمّ أوّلُ آية.
      // فإن كانت هذه بسملةَ سورةٍ أسقط المصدرُ رأسَها (١٠ يونس · ٨٢ الانفطار · ٨٦ الطارق)
      // حُقن الرأسُ هنا — فوقها. سورةُ البسملة تُشتقّ من أوّل خانةٍ بعدها، لا من لافتة.
      let sb = 0;
      for (let j = i + 1; j < page.l.length; j++) {
        const nx = page.l[j];
        if (nx.t !== 't' || !nx.w || !nx.w.length) continue;
        const b0 = nx.w[0].split(':');
        if (b0[1] === '1' && b0[2] === '1') sb = parseInt(b0[0], 10);
        break;
      }
      if (sb && needHeader && needHeader[sb] && !done[sb]) {
        done[sb] = 1;
        out.push(<div key={'h' + i} style={s.pgHeader}>{'سُورَةُ ' + SURAH_NAMES[sb]}</div>);
      }
      // البسملة من getVerseText(1,1) — لا نكتب نصّاً قرآنياً بيدنا أبداً.
      out.push(<div key={i} style={{ ...s.pgBasmala, fontSize: basmalaFs }}>{getVerseText(1, 1) || ''}</div>);
    }
  }
  // 14.5 — الورقةُ تملأ خانتَها ولا تعانق نصَّها. عناقُ الأمس كان يهبط بالإطار إلى طول
  // المحتوى فيترك فوقه وتحته شريطَين من لون الخلفيّة — ١٠٩px فوق و١٠٤px تحت في ٥٠٦
  // صفحاتٍ من الـ٦٠٤. فالإطارُ الآن ١٠٠٪ في الحالين، والفراغُ يسكن داخلَه لا حولَه:
  // justifyContent:center يوسّط الكتلةَ بين حاشيتين متساويتين، والمعيَّنُ مسمورٌ في القدم.
  // ولأنّ الطولَ لم يعد يتبدّل بعد القياس، فحالةُ القياس هي حالةُ العرض نفسُها — وهذا
  // أمتنُ ممّا كان: room يُقرأ من الخانة التي سيسكنها النصُّ فعلاً، لا من خانةٍ ستنكمش.
  const frameSt = s.pgFrame;
  const pageSt = s.pgPage;
  return (
    <div style={frameSt}>
      <div ref={ref} style={pageSt}>{out}</div>
      <PageDecor n={page.n} />
    </div>
  );
}

// Session 51 -- the page dressing: four corner brackets and the page medallion.
// It hangs off the frame WRAPPER, never off pgPage. The fit measurement divides by
// pgPage's element-child count (byHeight, ~4900), so a decorative child inside the page
// would silently shrink the Quran text on every page. pointerEvents:none throughout --
// the page drag belongs to the viewport and must pass straight through the ornament.
function PageDecor({ n }) {
  const corner = (extra) => (
    <svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="var(--red-lift)" strokeWidth="1.2" strokeLinecap="round" aria-hidden="true" style={{ position: 'absolute', pointerEvents: 'none', ...extra }}>
      <path d="M13 1H4a3 3 0 0 0-3 3v9" />
    </svg>
  );
  return (
    <React.Fragment>
      {corner({ top: 3, left: 3 })}
      {corner({ top: 3, right: 3, transform: 'scaleX(-1)' })}
      {corner({ bottom: 3, left: 3, transform: 'scaleY(-1)' })}
      {corner({ bottom: 3, right: 3, transform: 'scale(-1,-1)' })}
      <div style={s.pgMedal}>{toArabicDigits(n)}</div>
    </React.Fragment>
  );
}

// Session 51 -- the mushaf bookmark (the thread). One flat device key: the child profile
// carries no stable identifier, and adding one for this feature is out of scope. The key is
// cleared alongside the other three in resetAll, so a wiped profile inherits no bookmark.
const MUSHAF_BOOKMARK_KEY = 'mushaf_bookmark_v1';
// Returns null on the slightest doubt -- missing key, damaged JSON, non-integer or
// out-of-range page or surah -- and never surfaces an error to the reader.
function readMushafBookmark() {
  try {
    const raw = localStorage.getItem(MUSHAF_BOOKMARK_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || typeof o !== 'object') return null;
    if (!Number.isInteger(o.p) || o.p < 1 || o.p > 604) return null;
    if (!Number.isInteger(o.s) || o.s < 1 || o.s > 114) return null;
    return { p: o.p, s: o.s };
  } catch (e) { return null; }
}
function writeMushafBookmark(pg, sr) {
  try { localStorage.setItem(MUSHAF_BOOKMARK_KEY, JSON.stringify({ p: pg, s: sr })); } catch (e) {}
}

// ---------------------------------------------------------------------------
// Session 82 -- THE THREAD THAT PLACES ITSELF, and the daily wird beside it.
//
// Three device-local keys, and all three are device-local ONLY. Nothing below is read by
// any request builder, no value here is ever attached to a prompt, a header or a body, and
// no network call exists anywhere in this block. resetAll removes all three.
//
// The manual bookmark above is UNTOUCHED and stays the reader's own deliberate mark: it is
// written by one button and by nothing else. The last page is the opposite kind of thing --
// the app remembers where you were whether you asked it to or not -- so it gets its own key,
// its own reader, its own writer and its own row. The two never share storage or a glyph.
// ---------------------------------------------------------------------------
const MUSHAF_LAST_PAGE_KEY = 'mushaf_last_page_v1';
// Same shape as the bookmark and the same refusal to guess: any doubt at all -- no key,
// damaged JSON, a non-object, a non-integer or an out-of-range page or surah -- returns
// null, and the resume row simply is not drawn. Read and parse are wrapped SEPARATELY so a
// storage that throws on getItem is answered before JSON is ever asked anything.
function readMushafLastPage() {
  let raw = null;
  try { raw = localStorage.getItem(MUSHAF_LAST_PAGE_KEY); } catch (e) { return null; }
  if (!raw) return null;
  let o = null;
  try { o = JSON.parse(raw); } catch (e) { return null; }
  if (!o || typeof o !== 'object') return null;
  if (!Number.isInteger(o.p) || o.p < 1 || o.p > 604) return null;
  if (!Number.isInteger(o.s) || o.s < 1 || o.s > 114) return null;
  return { p: o.p, s: o.s };
}
// Validated BEFORE the write, so a bad pair is never persisted for the reader above to have
// to reject later. A storage that throws costs nothing: the page is still on the screen.
function writeMushafLastPage(pg, sr) {
  if (!Number.isInteger(pg) || pg < 1 || pg > 604) return;
  if (!Number.isInteger(sr) || sr < 1 || sr > 114) return;
  try { localStorage.setItem(MUSHAF_LAST_PAGE_KEY, JSON.stringify({ p: pg, s: sr })); } catch (e) {}
}

// The daily target: a decimal integer string, 1..604, and ABSENCE IS A REAL ANSWER. "No
// target" is not a broken state to be repaired on the next read -- it is the state the
// reader gets by default and the state the picker can return them to for good.
const WIRD_TARGET_KEY = 'mushaf_wird_target_v1';
// Canonical decimal only. ' 5', '5 ', '5.0', '-5', '05', '', 'abc' and Arabic-Indic digits
// as STORED text are all refused: the picker normalises before it writes, so anything
// non-canonical in the key was not written by this build and is not trusted.
function readWirdTarget() {
  let raw = null;
  try { raw = localStorage.getItem(WIRD_TARGET_KEY); } catch (e) { return null; }
  if (typeof raw !== 'string' || !/^[0-9]+$/.test(raw)) return null;
  const n = parseInt(raw, 10);
  if (!(n >= 1 && n <= 604)) return null;
  if (String(n) !== raw) return null;
  return n;
}
function writeWirdTarget(n) {
  if (!Number.isInteger(n) || n < 1 || n > 604) return;
  try { localStorage.setItem(WIRD_TARGET_KEY, String(n)); } catch (e) {}
}
function clearWirdTarget() {
  try { localStorage.removeItem(WIRD_TARGET_KEY); } catch (e) {}
}

// Today's completed pages: { d: 'YYYY-MM-DD', pages: [distinct 1..604] }.
const WIRD_DAY_KEY = 'mushaf_wird_day_v1';
// 8 seconds on the page, continuously, or it did not count. Short enough that ordinary
// reading credits every page; long enough that paging past twenty sheets looking for a
// surah credits none of them but the one you stopped on.
const WIRD_DWELL_MS = 8000;
const WIRD_TARGET_PRESETS = [1, 2, 5, 10, 20];
// DEVICE-LOCAL, and deliberately not toISOString. The day boundary a reader lives by is
// their own midnight, not UTC's: east of Greenwich toISOString would roll the wird over in
// the middle of the evening, and west of it the small hours would still count as yesterday.
// getFullYear/getMonth/getDate are the local calendar and nothing else is consulted.
function wirdDayKey(d) {
  const t = d || new Date();
  const y = t.getFullYear();
  const m = t.getMonth() + 1;
  const day = t.getDate();
  return String(y) + '-' + (m < 10 ? '0' : '') + String(m) + '-' + (day < 10 ? '0' : '') + String(day);
}
// Anything that is not today's well-formed record reads as TODAY'S EMPTY RECORD -- a record
// from another local date, damaged JSON, a missing key, a non-array `pages`, a storage that
// throws. Yesterday's wird is never today's progress and never an error message either.
// Pages are filtered, range-checked and de-duplicated on the way out, so the count can only
// be the number of distinct real pages and can never exceed 604.
function readWirdDay() {
  const today = wirdDayKey();
  let raw = null;
  try { raw = localStorage.getItem(WIRD_DAY_KEY); } catch (e) { return { d: today, pages: [] }; }
  if (!raw) return { d: today, pages: [] };
  let o = null;
  try { o = JSON.parse(raw); } catch (e) { return { d: today, pages: [] }; }
  if (!o || typeof o !== 'object') return { d: today, pages: [] };
  if (o.d !== today) return { d: today, pages: [] };
  if (!Array.isArray(o.pages)) return { d: today, pages: [] };
  const seen = Object.create(null);
  const pages = [];
  for (const v of o.pages) {
    if (!Number.isInteger(v) || v < 1 || v > 604) continue;
    if (seen[v]) continue;
    seen[v] = 1;
    pages.push(v);
  }
  return { d: today, pages: pages };
}
// The only writer of the daily key. A page already credited today writes NOTHING, so
// returning to it -- or paging back and forth over it all afternoon -- cannot inflate the
// count. An invalid page writes nothing either. localStorage only: no request, no beacon.
function markWirdPageRead(pg) {
  const rec = readWirdDay();
  if (!Number.isInteger(pg) || pg < 1 || pg > 604) return rec;
  if (rec.pages.indexOf(pg) !== -1) return rec;
  const next = { d: rec.d, pages: rec.pages.concat([pg]) };
  try { localStorage.setItem(WIRD_DAY_KEY, JSON.stringify(next)); } catch (e) {}
  return next;
}
// The picker's own normalisation. Character for character the acceptance the page-jump box
// uses -- Arabic-Indic and Latin digits, whitespace stripped -- but its OWN function, so
// that jumpGo below is left exactly as it is and the page jump cannot change behaviour.
function wirdNormalizeDigits(v) {
  return String(v == null ? '' : v).replace(/\s+/g, '').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}

// القارئ المُصفَّح — صفحةٌ لكلّ شاشة، ٦٠٤ صفحة، بأسطر مصحف المدينة.
// الاتّجاه: المصحفُ يُقلب من اليسار إلى اليمين، فجرُّ الورقة يميناً يكشف التالية.
function PagedMushaf({ startSurah, startPage, onExit }) {
  const [state, setState] = useState('loading');   // loading | ok | fail
  const [page, setPage] = useState(1);
  const [drag, setDrag] = useState(0);
  const [slide, setSlide] = useState(0);
  const [anim, setAnim] = useState(false);
  // 75/B2 -- immersive chrome: two bars the page can take the whole screen from.
  // 77 -- but they INTRODUCE THEMSELVES BEFORE THEY HIDE. They start VISIBLE for everybody,
  // so a reader opening the mushaf for the first time sees the sura name, the bookmark, the
  // page bar and the way back -- and they collapse ONCE, after that reader turns the first
  // page. The gesture teaches itself: you see the furniture, you turn a page, it makes room,
  // and a tap brings it back. Before 77 the flag decided the initial value, so from 7a4a2aa
  // -- when the flag became everybody -- a first-time reader met a page with no way back on it.
  //
  // Unconditional `true` is SAFER for the fallback, not riskier. With the flag off the tap
  // toggle is gated (see onEnd) and readerTurnedPage refuses to write, so the initialiser
  // remains the only writer the fallback ever reaches and its bars stay pinned visible
  // exactly as they are today.
  const [chromeOn, setChromeOn] = useState(true);
  // The one-shot latch is a REF, not state: a re-render cannot re-fire it, and it is never
  // read during rendering so it cannot be stale. commit() lands twice on purpose (the
  // transitionend and the fallback timer both call land), and the latch is what makes the
  // second landing free.
  //
  // It is called from the two places the READER moves the page and from nowhere else:
  // land() for a committed swipe and for the prev/next buttons, and jumpTo() for a jump.

function MushafScreen({ selected, setSelected, onBack, onPlaySurah, onStopAudio }) {
  const [ready, setReady] = useState(!!__quranData);
  const [counts, setCounts] = useState(null);       // { [surah]: ayahCount } -- ONE pass
  // Session 51 -- the bookmark, read once. Nothing on this screen writes it; the bar only
  // opens it or removes it. Opening goes through `selected`, the same door a surah tap uses,
  // so the back button still peels back to the index instead of leaving the mushaf.
  const [bookmark, setBookmark] = useState(readMushafBookmark);
  const [openAt, setOpenAt] = useState(null);       // set only by tapping the bar

  const [nav, setNav] = useState(__mushafNav);
  const openBookmark = () => { if (bookmark) { setOpenAt(bookmark); setSelected(bookmark.s); } };
  const clearBookmark = () => { try { localStorage.removeItem(MUSHAF_BOOKMARK_KEY); } catch (e) {} setBookmark(null); };
  // Session 82 -- the last page, alongside the bookmark and never instead of it. Its own
  // state, its own reader and its own opener; the bookmark two lines above is untouched.
  // Reading it here does NOT open it: entering the mushaf still lands on the index, and the
  // reader resumes by tapping a row -- one tap, chosen, never automatic.
  const [lastPage, setLastPage] = useState(readMushafLastPage);
  const openLastPage = () => { if (lastPage) { setOpenAt(lastPage); setSelected(lastPage.s); } };
  // خطأ ٤٦: `selected` (السورة المفتوحة) رُفعت إلى App لتُقشَر بزر الرجوع؛ تصل عبر props بلا تغيير سلوك

  useEffect(() => {
    let alive = true;
    loadQuran()
      .then(() => {
        if (!alive) return;
        const c = {};
        for (const k in __quranData) {
          const n = parseInt(k.split(':')[0], 10);
          c[n] = (c[n] || 0) + 1;
        }
        setCounts(c);
        setReady(true);
      })
      .catch(() => {});
    return () => { alive = false; };
  }, []);

  // 14.3 — التخطيطُ لا يحبس الفهرس: السورُ تُرسَم فوراً بلا أرقام، ثمّ تُحقن أرقامُ
  // الصفحات وتُدسّ صفوفُ الأجزاء حين يصل. وإن لم يصل بقيت القائمةُ كما كانت.
  useEffect(() => {
    let alive = true;
    loadLayout().then(() => { if (alive) setNav(buildMushafNav()); }).catch(() => {});
    return () => { alive = false; };
  }, []);

  // Session 51 -- MushafScreen never unmounts when a surah is left (only `selected` drops to
  // null), so the bar would keep showing a bookmark read at mount. Re-read whenever we are back
  // on the index -- that is the only moment the bar is about to be drawn.
  useEffect(() => { if (selected == null) setBookmark(readMushafBookmark()); }, [selected]);
  // 82 -- the same lifecycle for the last page, in its own effect so the bookmark's is left
  // exactly as it was. Coming back from the reader is precisely when this has just moved.
  useEffect(() => { if (selected == null) setLastPage(readMushafLastPage()); }, [selected]);

  // Leaving the screen must silence a running recitation.
  useEffect(() => () => { if (onStopAudio) onStopAudio(); }, []);

  const leaveSurah = () => { if (onStopAudio) onStopAudio(); setOpenAt(null); setSelected(null); };
  const leaveScreen = () => { if (onStopAudio) onStopAudio(); onBack(); };

  // 14.2 — الفهرس يفتح على صفحة السورة في المصحف المُصفَّح.
  // SurahCard انسحبت من هنا وبقيت في المحادثة، حيث وُلدت — ومعها قِشرتها.
  if (selected) return <PagedMushaf startSurah={selected} startPage={openAt && openAt.s === selected ? openAt.p : null} onExit={leaveSurah} />;

  return (
    <div style={s.memContainer}>
      <div style={s.memHeader}>
        <div style={s.memTitle}>المصحف</div>
        <button onClick={leaveScreen} style={s.memBackBtn}>رجوع</button>
      </div>
      <div style={s.mushafBody}>
        {/* 82 -- ABOVE the bookmark row and visibly not it: a curved history arrow, never a
            ribbon. Same door as every other row here -- setOpenAt + setSelected -- so the
            reader, the back button and the header all behave as they do from the index. */}
        {lastPage && (
          <button onClick={openLastPage} style={{ ...s.mushafRow, marginBottom: 8 }}>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--red-deep)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style={{ flexShrink: 0 }}><path d="M3.5 12a8.5 8.5 0 1 0 2.7-6.2" /><path d="M3.1 4.4v4.3h4.3" /><path d="M12 7.5V12l3 1.8" /></svg>
            <div style={s.mushafName}>تابِع القراءة · صفحة {toArabicDigits(lastPage.p)}</div>
          </button>
        )}
        {bookmark && (
          <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
            <button onClick={openBookmark} style={{ ...s.mushafRow, flex: 1 }}>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--red)" stroke="var(--red-deep)" strokeWidth="1.5" strokeLinejoin="round" aria-hidden="true" style={{ flexShrink: 0 }}><path d="M7 3h10a1 1 0 0 1 1 1v17l-6-4-6 4V4a1 1 0 0 1 1-1z" /></svg>
              <div style={s.mushafName}>علامتك · صفحة {toArabicDigits(bookmark.p)}</div>
            </button>
            <button onClick={clearBookmark} title="إزالة العلامة" style={{ ...s.pgNavBtn, height: 'auto' }}>×</button>
          </div>
        )}
        {!ready && <div style={s.mushafHint}>جارٍ تحميل المصحف…</div>}
        {ready && (
          <div style={s.mushafList}>
            {(nav || MUSHAF_NAV_FALLBACK).map((r) => (
              r.k === 'j' ? (
                <button key={'j' + r.n} onClick={() => { setOpenAt({ p: r.p, s: r.s }); setSelected(r.s); }} style={s.mushafJuzRow}>
                  <div style={s.mushafJuzName}>الجزء {toArabicDigits(r.n)}</div>
                  <div style={s.mushafJuzPage}>صفحة {toArabicDigits(r.p)}</div>
                </button>
              ) : (
                <button key={'s' + r.n} onClick={() => { setOpenAt(null); setSelected(r.n); }} style={s.mushafRow}>
                  <div style={s.mushafNum}>{toArabicDigits(r.n)}</div>
                  <div style={s.mushafRowMain}>
                    <div style={s.mushafName}>{SURAH_NAMES[r.n]}</div>
                    <div style={s.mushafSub}>{revelationLabel(r.n)} · {toArabicDigits(counts && counts[r.n] ? counts[r.n] : 0)} آية</div>
                  </div>
                  <div style={s.mushafPage}>{r.p ? 'صفحة ' + toArabicDigits(r.p) : ''}</div>
                </button>
              )
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function MemorizeScreen({ profile, onExit, onPlayVerse, onPlaySurah, onStopAudio }) {
  const [ready, setReady] = useState(!!__quranData); // true once the mushaf JSON is in memory
  const [counts, setCounts] = useState(null);        // { [surahNum]: ayahCount } — built once, single pass
  const [view, setView] = useState('picker');        // 'picker' | 'drill'
  const [selectedSurah, setSelectedSurah] = useState(null); // 1..114
  const [startAyah, setStartAyah] = useState(1);
  const [granularity, setGranularity] = useState('word'); // 'ayah' | 'word' (default word — one word per reveal)
  const [revealedCount, setRevealedCount] = useState(0);
  // Layer C — عدنان listen-and-repeat audio talqin (alongside the manual reveal).
  const [drillMode, setDrillMode] = useState('manual'); // 'manual' | 'adnan'
  const [adnanAyah, setAdnanAyah] = useState(null);     // current ayah playing in the loop
  const [adnanRunning, setAdnanRunning] = useState(false);
  const adnanTimeoutRef = useRef(null);                 // pending repeat-pause timer
  const runIdRef = useRef(0);                           // local loop cancel token (sequenceIdRef is App-owned, not in scope)
  // Layer B — سمِّعني recite-from-memory (own recognizer; transcript NEVER rendered/stored).
  const [reciteListening, setReciteListening] = useState(false);
  const [reciteStates, setReciteStates] = useState([]); // per-expected-word: matched|mismatch|pending
  const [reciteErr, setReciteErr] = useState('');       // graceful-fail note (no SR / mic denied)
  const reciteRecognitionRef = useRef(null);            // own SpeechRecognition (separate from chat/call refs)
  const reciteRunIdRef = useRef(0);                     // cancel token so a stale onend can't reopen the mic
  const reciteHeardRef = useRef('');                    // transient transcript — never rendered, never saved
  const [reciteAyah, setReciteAyah] = useState(null);   // current recite ayah; current = reciteAyah || startAyah
  const [reciteFinished, setReciteFinished] = useState(false); // whole range done → show finish line
  const reciteAyahRef = useRef(null);                   // live mirror so onresult reads the current ayah synchronously

  const isFemale = profile?.gender === 'female';

  // Load the mushaf once, then tally ayah counts per surah in a SINGLE pass over all keys
  // (keys are "surahNum:ayah" — the same prefix shape getSurahAyahCount relies on). This
  // avoids calling getSurahAyahCount 114 times (= 114 full scans).
  useEffect(() => {
    let alive = true;
    loadQuran()
      .then(() => {
        if (!alive) return;
        const c = {};
        for (const k in __quranData) {
          const colon = k.indexOf(':');
          if (colon < 1) continue;
          const sn = parseInt(k.slice(0, colon), 10);
          if (sn >= 1) c[sn] = (c[sn] || 0) + 1;
        }
        setCounts(c);
        setReady(true);
      })
      .catch(() => { /* fail-safe: stay on the loading string; never fall back to model text */ });
    return () => { alive = false; };
  }, []);

  // Layer C teardown — runs on MemorizeScreen unmount (leaving the memorize screen). cancelAudio
  // does NOT clear timers, so we clear the pending repeat-pause; we also bump runIdRef so a loop
  // mid-ayah bails after the App-level [screen] cleanup pauses its audio (instead of advancing).
  useEffect(() => () => {
    runIdRef.current++;
    if (adnanTimeoutRef.current) clearTimeout(adnanTimeoutRef.current);
    // Layer B: stop the recite recognizer on unmount (the App [screen] cleanup doesn't know it).
    reciteRunIdRef.current++;
    try { reciteRecognitionRef.current?.stop(); } catch (e) {}
  }, []);

  const surahCount = (counts && selectedSurah) ? (counts[selectedSurah] || 0) : 0; // last ayah of range

  // Ordered reveal units for [startAyah .. last ayah]. Ayah text is canonical only.
  // ayah granularity → one unit per ayah; word granularity → one unit per word, grouped by ayah.
  const buildUnits = () => {
    if (!ready || !selectedSurah || !surahCount) return [];
    const out = [];
    for (let a = startAyah; a <= surahCount; a++) {
      const text = getVerseText(selectedSurah, a) || '';
      if (granularity === 'word') {
        const words = text.split(/\s+/).filter(Boolean);
        words.forEach((w, wi) => out.push({ ayah: a, text: w, firstInAyah: wi === 0 }));
      } else {
        out.push({ ayah: a, text, firstInAyah: true });
      }
    }
    return out;
  };
  const units = view === 'drill' ? buildUnits() : [];
  const allRevealed = units.length > 0 && revealedCount >= units.length;
  // Focus ayah for the single-ayah "listen": the ayah holding the next hidden unit, else the last.
  const focusAyah = units.length === 0 ? startAyah
    : (revealedCount < units.length ? units[revealedCount].ayah : units[units.length - 1].ayah);
  // Light, occasional praise — every few units while drilling, NOT on every press.
  const showPraise = !allRevealed && granularity === 'ayah' && revealedCount > 0 && revealedCount % 4 === 0;

  const openPicker = () => { setView('picker'); setRevealedCount(0); };
  const startDrill = () => { setView('drill'); setRevealedCount(0); };
  const setGran = (g) => { setGranularity(g); setRevealedCount(0); }; // switching re-hides the range

  // ---------- عدنان listen-and-repeat loop ----------
  // Cancellation uses a LOCAL runIdRef (App's sequenceIdRef/cancelAudio are not in scope, and
  // playVerseManual bumps the sequence token every call so it can't be our stable loop token).
  // Audio is stopped via the onStopAudio prop (App cancelAudio). The pause between ayat is
  // proportional to the ayah's measured playback time, clamped to a sane floor/ceiling.
  const ADNAN_PAUSE_FACTOR = 1.15, ADNAN_PAUSE_FLOOR = 1500, ADNAN_PAUSE_CEIL = 9000; // ms

  const stopAdnan = () => {
    runIdRef.current++;                       // invalidate the running loop so it bails at its next guard
    if (adnanTimeoutRef.current) { clearTimeout(adnanTimeoutRef.current); adnanTimeoutRef.current = null; }
    if (onStopAudio) onStopAudio();           // App cancelAudio: pause current ayah + bump sequenceIdRef
    setAdnanRunning(false);
  };

  const startAdnan = async () => {
    if (!ready || !selectedSurah || !surahCount) return;
    if (onStopAudio) onStopAudio();           // clear any prior audio before starting fresh
    if (adnanTimeoutRef.current) { clearTimeout(adnanTimeoutRef.current); adnanTimeoutRef.current = null; }
    const myRun = ++runIdRef.current;         // local cancel token for THIS run
    setAdnanRunning(true);
    for (let a = startAyah; a <= surahCount; a++) {
      if (runIdRef.current !== myRun) return; // stopped / mode switched / screen left / restarted
      setAdnanAyah(a);
      const t0 = performance.now();
      try { await onPlayVerse(selectedSurah, a); } catch (e) {} // resolves when the ayah audio ENDS
      if (runIdRef.current !== myRun) return;
      const elapsed = performance.now() - t0;
      const pause = Math.min(ADNAN_PAUSE_CEIL, Math.max(ADNAN_PAUSE_FLOOR, elapsed * ADNAN_PAUSE_FACTOR));
      await new Promise((r) => { adnanTimeoutRef.current = setTimeout(r, pause); });
      if (runIdRef.current !== myRun) return;
    }
    if (runIdRef.current === myRun) { setAdnanRunning(false); setAdnanAyah(null); } // natural completion
  };

  const repeatAyah = async () => {
    const a = adnanAyah || startAyah;
    stopAdnan();                              // halt the loop + audio + pending pause first
    try { await onPlayVerse(selectedSurah, a); } catch (e) {} // replay this ayah once; user presses ابدأ to continue
  };

  // ---------- سمِّعني recite-from-memory ----------
  // Own ar-SA recognizer, mirroring the call handler's cumulative-finals prefix-merge. On each
  // onresult we re-match the WHOLE heard-so-far against the WHOLE expected ayah (cheap; ayat are
  // short) and recolor. The transcript lives only in reciteHeardRef — never rendered, never saved.
  const stopRecite = () => {
    reciteRunIdRef.current++;            // invalidate: a stale onend can't restart the mic
    setReciteListening(false);
    const rec = reciteRecognitionRef.current;
    if (rec) { try { rec.onresult = null; rec.onend = null; rec.onerror = null; rec.stop(); } catch (e) {} }
    // leave reciteStates as-is so the last result stays visible after stop
  };

  const startRecite = () => {
    if (childVoiceBlocked()) { setReciteErr(CHILD_VOICE_NOTICE); return; } // غ‑٣: لا ميكروفونَ لسمِّعني
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setReciteErr(RECITE_NO_SR); return; } // graceful fail, same message as chat/call
    setReciteErr('');
    setReciteFinished(false);
    setReciteAyah(startAyah);
    reciteAyahRef.current = startAyah;
    reciteHeardRef.current = '';
    setReciteStates([]);
    // Cumulative EXPECTED (Option C): expected = tokens of ayat startAyah..targetAyah, with the
    // CURRENT ayah's offset/length so we can slice its states out of the full alignment. No
    // heard-text reset on advance — heard stays cumulative and aligns against the growing expected
    // (robust to ar-SA cumulative re-segmentation; no mic teardown).
    const buildExpected = (toAyah) => {
      const tokens = [];
      let curOffset = 0, curLen = 0;
      for (let a = startAyah; a <= toAyah; a++) {
        const at = tokenizeForRecite(getVerseText(selectedSurah, a) || '');
        if (a === toAyah) { curOffset = tokens.length; curLen = at.length; }
        for (let t = 0; t < at.length; t++) tokens.push(at[t]);
      }
      return { tokens, curOffset, curLen };
    };
    const rec = new SR();
    rec.lang = 'ar-SA';
    rec.continuous = true;
    rec.interimResults = true;
    const myRun = ++reciteRunIdRef.current;
    rec.onresult = (event) => {
      // Cumulative-finals prefix-merge — identical to the call recognizer.
      let finalText = '', interim = '';
      for (let i = 0; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          const seg = t.trim();
          if (!seg) continue;
          if (!finalText) finalText = seg;
          else if (seg.startsWith(finalText)) finalText = seg;
          else if (finalText.startsWith(seg)) { /* covered */ }
          else finalText = finalText + ' ' + seg;
        } else { interim += t; }
      }
      reciteHeardRef.current = (finalText + ' ' + interim).trim();
      // Match FULL cumulative heard vs FULL cumulative expected (up to the current ayah), then
      // display + completion-check only the CURRENT ayah's slice of states.
      const cur = reciteAyahRef.current || startAyah;
      const { tokens, curOffset, curLen } = buildExpected(cur);
      const fullStates = alignRecite(tokens, tokenizeForRecite(reciteHeardRef.current));
      const currentSlice = fullStates.slice(curOffset, curOffset + curLen);
      // TEMP (error-flagging disabled): treat 'mismatch' as reached/black so red never renders and a
      // tashkeel/madd slip can't block progression. 'pending' (not-yet-reached) still gates advance.
      // alignRecite is untouched — we only reinterpret its output here. Revisit when tashkeel/madd is handled.
      const shown = currentSlice.map((x) => (x === 'mismatch' ? 'matched' : x));
      const allMatched = shown.length > 0 && shown.every((x) => x === 'matched');
      if (allMatched && cur < surahCount) {
        // Auto-advance. Set the ref synchronously so a rapid follow-up onresult can't re-advance the
        // same completion; blank the slice so the new ayah renders dim until the next onresult fills it.
        const next = cur + 1;
        reciteAyahRef.current = next;
        setReciteAyah(next);
        setReciteStates([]);
      } else {
        setReciteStates(shown);
        if (allMatched && cur >= surahCount) { setReciteFinished(true); stopRecite(); } // last ayah → finish
      }
    };
    rec.onend = () => {
      // Auto-restart only if this run is still current (stopRecite/unmount bumped the id otherwise).
      if (childVoiceBlocked()) {                         // غ‑٣: لا إعادةَ فتحٍ بعد الحجب — أوقفِ الحلقة
        reciteRunIdRef.current++;
        setReciteListening(false);
        return;
      }
      if (reciteRunIdRef.current === myRun) { try { rec.start(); } catch (e) {} }
    };
    rec.onerror = (e) => {
      const fatal = ['not-allowed', 'audio-capture', 'service-not-allowed'];
      if (fatal.includes(e.error)) { reciteRunIdRef.current++; setReciteListening(false); setReciteErr(RECITE_NO_SR); }
    };
    reciteRecognitionRef.current = rec;
    setReciteListening(true);
    try { rec.start(); } catch (e) {}
  };

  // Manual advance — freeze-proof fallback so a missed/substituted last word can't lock progress.
  const advanceReciteManual = () => {
    const cur = reciteAyahRef.current || startAyah;
    if (cur < surahCount) {
      const next = cur + 1;
      reciteAyahRef.current = next;
      setReciteAyah(next);
      setReciteStates([]); // new ayah starts dim; recomputed on the next onresult
    } else {
      setReciteFinished(true);
      stopRecite();
    }
  };

  const setMode = (m) => {
    if (m === drillMode) return;
    stopAdnan();
    stopRecite();
    if (m === 'recite') { // fresh recite session from the start of the range
      setReciteStates([]); reciteHeardRef.current = ''; setReciteErr('');
      setReciteAyah(startAyah); reciteAyahRef.current = startAyah; setReciteFinished(false);
    }
    setDrillMode(m);
  };

  // ---------- PICKER ----------
  if (view === 'picker') {
    return (
      <div style={s.memContainer}>
        <div style={s.memHeader}>
          <div style={s.memTitle}>{MEM.TITLE}</div>
          <button onClick={onExit} style={s.memBackBtn}>{MEM.BACK_BTN}</button>
        </div>
        <div style={s.memHeading}>{MEM.PICKER_HEADING}</div>
        {!ready && <div style={s.memLoading}>{MEM.LOADING}</div>}
        <div style={s.memList}>
          {Array.from({ length: 114 }, (_, i) => i + 1).map((n) => {
            const active = selectedSurah === n;
            return (
              <button
                key={n}
                onClick={() => { setSelectedSurah(n); setStartAyah(1); }}
                style={{ ...s.memRow, ...(active ? s.memRowActive : {}) }}
              >
                {/* RTL row: number badge (rightmost) · name + ayah count (center) · revelation label (leftmost) */}
                <span style={s.memRowNum}>{toArabicDigits(n)}</span>
                <span style={s.memRowNameWrap}>
                  <span style={{ ...s.memRowName, ...(active ? { color: 'var(--on-accent)' } : {}) }}>{SURAH_NAMES[n]}</span>
                  <span style={{ ...s.memRowCount, ...(active ? { color: 'rgba(255,255,255,0.8)' } : {}) }}>{counts && counts[n] ? `${toArabicDigits(counts[n])} ${MEM.GRAN_AYAH}` : ''}</span>
                </span>
                <span style={s.memRowReveal}>{revelationLabel(n)}</span>
              </button>
            );
          })}
        </div>
        {selectedSurah && (
          <div style={s.memStartBar}>
            <span style={s.memStartLabel}>{MEM.START_LABEL}</span>
            <select
              value={startAyah}
              onChange={(e) => setStartAyah(parseInt(e.target.value, 10) || 1)}
              style={s.memAyahSelect}
              disabled={!ready || !surahCount}
            >
              {Array.from({ length: surahCount || 1 }, (_, i) => i + 1).map((a) => (
                <option key={a} value={a}>{toArabicDigits(a)}</option>
              ))}
            </select>
            <button onClick={startDrill} style={{ ...s.memStartBtn, opacity: (!ready || !surahCount) ? 0.5 : 1 }} disabled={!ready || !surahCount}>{MEM.START_BTN}</button>
          </div>
        )}
      </div>
    );
  }

  // ---------- DRILL ----------
  const praiseLine = isFemale ? MEM.PRAISE_F : MEM.PRAISE_M;
  const finishLine = isFemale ? MEM.FINISH_F : MEM.FINISH_M;
  return (
    <div style={s.memContainer}>
      <div style={s.memHeader}>
        <div style={s.memTitle}>{MEM.TITLE}</div>
        <button onClick={onExit} style={s.memBackBtn}>{MEM.BACK_BTN}</button>
      </div>
      <div style={s.memSubBar}>
        <span style={s.memSurahTitle}>{SURAH_NAMES[selectedSurah]}</span>
        <span style={s.memRangeBadge}>{`${MEM.GRAN_AYAH} ${toArabicDigits(startAyah)}`}</span>
        <button onClick={openPicker} style={s.memChangeBtn}>{MEM.CHANGE_SURAH}</button>
      </div>
      {/* Drill mode switch: manual reveal · عدنان listen-and-repeat (Layer C) · سمِّعني recite (Layer B). */}
      <div style={s.memToggleRow}>
        <button onClick={() => setMode('manual')} style={{ ...s.memGranBtn, ...(drillMode === 'manual' ? s.memGranBtnActive : {}) }}>{MEM.MODE_MANUAL}</button>
        <button onClick={() => setMode('adnan')} style={{ ...s.memGranBtn, ...(drillMode === 'adnan' ? s.memGranBtnActive : {}) }}>{MEM.MODE_ADNAN}</button>
        <button onClick={() => setMode('recite')} style={{ ...s.memGranBtn, ...(drillMode === 'recite' ? s.memGranBtnActive : {}) }}>{MEM.MODE_RECITE}</button>
      </div>
      {drillMode === 'manual' && (
      <div style={s.memToggleRow}>
        <span style={s.memToggleLabel}>{MEM.REVEAL_LABEL}</span>
        <button onClick={() => setGran('ayah')} style={{ ...s.memGranBtn, ...(granularity === 'ayah' ? s.memGranBtnActive : {}) }}>{MEM.GRAN_AYAH}</button>
        <button onClick={() => setGran('word')} style={{ ...s.memGranBtn, ...(granularity === 'word' ? s.memGranBtnActive : {}) }}>{MEM.GRAN_WORD}</button>
      </div>
      )}
      {drillMode === 'manual' && (
      <div style={s.memDrillArea}>
        <div style={s.memDrillText}>
          {units.map((u, i) => {
            const revealed = i < revealedCount;
            const isNext = i === revealedCount;
            if (!revealed && !isNext) return null; // beyond the next unit stays fully hidden
            return (
              <span key={i} style={s.memUnit}>
                {u.firstInAyah && <span style={s.memAyahBadge}>{toArabicDigits(u.ayah)}</span>}
                {revealed
                  ? <span style={s.memWord}>{u.text}</span>
                  : <span style={s.memPlaceholder}>{granularity === 'word' ? '—' : '— — —'}</span>}
              </span>
            );
          })}
        </div>
        {showPraise && <div style={s.memMsg}>{praiseLine}</div>}
        {allRevealed && <div style={s.memMsg}>{finishLine}</div>}
      </div>
      )}
      {drillMode === 'manual' && (
      <div style={s.memControls}>
        <button onClick={() => onPlayVerse && onPlayVerse(selectedSurah, focusAyah)} style={s.memListenBtn}>{MEM.LISTEN_BTN}</button>
        <button onClick={() => setRevealedCount((c) => Math.min(c + 1, units.length))} style={{ ...s.memRevealBtn, opacity: allRevealed ? 0.5 : 1 }} disabled={allRevealed}>{MEM.REVEAL_BTN}</button>
        {/* Re-hide/reset the same range. */}
        <button onClick={() => setRevealedCount(0)} style={s.memListenBtn}>{MEM.HIDE}</button>
      </div>
      )}
      {drillMode === 'adnan' && (
      <div style={s.memDrillArea}>
        <div style={s.memSurahTitle}>{`${SURAH_NAMES[selectedSurah]} · ${MEM.ADNAN_AYAH_LABEL} ${toArabicDigits(adnanAyah || startAyah)}`}</div>
        <div style={s.memDrillText}>
          <span style={s.memWord}>{getVerseText(selectedSurah, adnanAyah || startAyah) || ''}</span>
        </div>
      </div>
      )}
      {drillMode === 'adnan' && (
      <div style={s.memControls}>
        <button onClick={() => (adnanRunning ? stopAdnan() : startAdnan())} style={s.memRevealBtn}>{adnanRunning ? MEM.ADNAN_STOP : MEM.ADNAN_START}</button>
        <button onClick={repeatAyah} style={s.memListenBtn}>{MEM.ADNAN_REPEAT}</button>
      </div>
      )}
      {drillMode === 'recite' && (
      <div style={s.memDrillArea}>
        <div style={s.memReciteHint}>{MEM.RECITE_HINT}</div>
        <div style={s.memSurahTitle}>{`${SURAH_NAMES[selectedSurah]} · ${MEM.ADNAN_AYAH_LABEL} ${toArabicDigits(reciteAyah || startAyah)}`}</div>
        <div style={s.memDrillText}>
          {(() => {
            // Display the CURRENT recite ayah (original diacritized words), colored by its slice of
            // states. Standalone ornament/pause glyphs normalize to '' — render dim, don't consume a
            // state, so the state index stays aligned with the matchable words. Child's words never shown.
            const displayWords = (getVerseText(selectedSurah, reciteAyah || startAyah) || '').split(/\s+/).filter(Boolean);
            let wordIdx = 0;
            return displayWords.map((dw, i) => {
              if (!normalizeForRecite(dw)) return <span key={i} style={s.memWordPending}>{dw}</span>;
              const st = reciteStates[wordIdx]; wordIdx++;
              const wstyle = st === 'matched' ? s.memWord : st === 'mismatch' ? s.memWordWrong : s.memWordPending;
              return <span key={i} style={wstyle}>{dw}</span>;
            });
          })()}
        </div>
        {reciteErr && <div style={s.memMsg}>{reciteErr}</div>}
        {reciteFinished && <div style={s.memMsg}>{finishLine}</div>}
      </div>
      )}
      {drillMode === 'recite' && (
      <div style={s.memControls}>
        <button onClick={() => (reciteListening ? stopRecite() : startRecite())} style={s.memRevealBtn}>{reciteListening ? MEM.RECITE_STOP : MEM.RECITE_START}</button>
        <button onClick={advanceReciteManual} style={s.memListenBtn}>{MEM.RECITE_NEXT}</button>
      </div>
      )}
    </div>
  );
}
