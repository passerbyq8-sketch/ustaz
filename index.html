<!-- S96: the UA reads this BEFORE any CSS parses, so it knows a dark rendering is supported and
     paints its default canvas accordingly instead of assuming white. -->
<meta name="color-scheme" content="light dark">
<!-- S96 THEME BOOT. This MUST stay above every <link rel="stylesheet">.
     It used to sit below the Google Fonts link, and that was the white-flash bug: per the HTML
     spec a <script> does not execute until all PENDING STYLESHEETS have loaded, because it might
     query computed style. So on a cold launch this script waited on fonts.googleapis.com over
     mobile data -- and for that whole second the document had no data-theme, no parsed <style>,
     and the UA painted its default WHITE canvas before the dark app appeared underneath it.
     The old comment claimed it ran "BEFORE the stylesheet that reacts to it"; that was true of
     the inline <style> below and missed the external one above.
     Three things are set here, in order of when they matter:
       colorScheme  -- the UA's own canvas/scrollbar/form default, honoured before CSS
       background   -- an inline paint on <html>, so the very first frame is already the right
                       colour even if the stylesheet has not arrived. ITEM 95: in LIGHT that
                       colour is #FFFFFF. It was #F1F6FD, the pale blue --page of the base
                       palette, and it stopped agreeing with the app the moment the visual
                       identities landed and made --vt-page #FFFFFF in both of them: the
                       stylesheet went white, this inline paint did not follow, and the root
                       kept a blue that showed in overscroll, behind the system bars and for
                       the whole of the first frame. Dark is untouched.
       data-theme   -- what the stylesheet keys off once it does arrive
     Fails to light, exactly as before. -->
<script>(function(){try{var t=localStorage.getItem('murabbi_theme_v1');if(t!=='dark'&&t!=='light'){t='light';}var d=document.documentElement;d.setAttribute('data-theme',t);d.style.colorScheme=t;d.style.background=(t==='dark'?'#0E1116':'#FFFFFF');var m=document.querySelector('meta[name="theme-color"]');if(m){m.setAttribute('content',t==='dark'?'#0E1116':'#1D4ED8');}}catch(e){}})();(function(){try{var v=localStorage.getItem('ezik_visual_theme_v2');if(v!=='istana_33'){v='istana_33';}document.documentElement.setAttribute('data-ezik-visual-theme',v);}catch(e){}})();</script>
<!-- S99: the reading preferences, applied BEFORE the first paint for the same reason the theme is.
     Read here and the interface draws once at the chosen size; read after React mounts and the
     user watches it resize. It reads the active profile's id from the profile the app already
     stores, touches nothing else, and every failure path leaves the defaults in place. -->
<script>(function(){try{var D=document.documentElement;try{if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){D.setAttribute('data-ez-motion','reduce');}}catch(e){}var p=null;try{p=JSON.parse(localStorage.getItem('child_profile')||'null');}catch(e){}var pk=(p&&typeof p.pid==='string'&&p.pid)?p.pid:'anon';var m=null;try{m=JSON.parse(localStorage.getItem('ezik_reading_prefs_v1')||'null');}catch(e){}var r=(m&&typeof m==='object'&&!Array.isArray(m))?m[pk]:null;if(!r||typeof r!=='object'){return;}var S={normal:1,large:1.14,xlarge:1.28};var f=(typeof r.fontSize==='string'&&S[r.fontSize])?r.fontSize:'normal';var d=document.documentElement;d.style.setProperty('--ez-fs',String(S[f]));d.setAttribute('data-ez-fs',f);if(r.reading===true){d.setAttribute('data-ez-read','1');}if(r.reduceMotion===true){d.setAttribute('data-ez-motion','reduce');}}catch(e){}})();</script>
<!-- S116 UI LANGUAGE BOOT. Interface language only -- it never reaches the model, the answer,
     the sources or any devotional text. Read before the first paint for the same reason the
     theme is: <html lang/dir> decided after React mounts is a visible re-layout.
     The whole policy, and it is two lines:
       1. a stored choice of exactly 'ar' or 'en' is honoured
       2. anything else -- nothing stored, a corrupted value, a value from a future build -- is ar
     THE DEVICE IS NOT CONSULTED. This app is Arabic first: a reader on an English handset is
     shown the Arabic interface until they say otherwise, and they say otherwise on the first-run
     card or in Settings. navigator.language is read nowhere in the language layer, which the
     guard asserts rather than assumes. -->
<script>(function(){try{var K='ezik_ui_lang_v1';var v=null;try{v=localStorage.getItem(K);}catch(e){}if(v!=='ar'&&v!=='en'){v='ar';}var d=document.documentElement;d.setAttribute('lang',v);d.setAttribute('dir',v==='ar'?'rtl':'ltr');d.setAttribute('data-ez-lang',v);window.__ezUiLang=v;}catch(e){}})();</script>

<style>
  :root {
    --red:#1D4ED8; --red-deep:#12327A; --red-lift:#2AA6DE; --red-soft:#E6EEFB;
    --black:#141414; --ink:#1A1A1A; --muted:#6E6E6E; --nav-off:#93A0B8;
    --white:#FFFFFF; --page:#F1F6FD; --line:#E5EBF5; --tint:#EDF1FA;
    --scholar:#6B4A2B; --radius-card:22px; --radius-btn:16px;
    /* THE WATERMARK'S OPACITY, and the only reason it is a token rather than a number in the
       .ezwm rule is that the reader is allowed to move it. It is a NUMBER, not a colour: no
       palette answers for it, dark mode does not restate it, and 0.5 is what every device that
       has never chosen gets. The stored preference is written onto the document root, where it
       shadows this line for that device only. */
    --ezwm-o:0.5;
    /* D88. Three tokens split roles that ONE token used to carry. Every light value below
       is byte-for-byte the value those sites already resolved to, so LIGHT RENDERS EXACTLY
       AS IT DID BEFORE THIS PHASE. Only the dark block gives them a second value.
       --on-accent   foreground sitting ON the blue accent   (was --white, which also means 'card')
       --accent-fill solid accent UNDER white text           (was --red, which also means 'accent text')
       --verse-ink   the ayah text on the verse card         (was --red-deep, which is also a gradient END) */
    --on-accent:#FFFFFF; --accent-fill:#1D4ED8; --verse-ink:#12327A;
    /* S95. A FOURTH split of the same kind, for the same reason. --red-deep was carrying three
       jobs at once: accent TEXT on a page or card, a solid/gradient FILL under white text, and
       a STROKE on the mushaf's hardcoded paper. Those three want opposite things the moment the
       page goes dark -- text must get lighter, fill and stroke must stay dark. --accent-ink is
       the text role, and its light value is byte-for-byte the #12327A those sites already
       resolved to, so LIGHT DOES NOT MOVE. Only the dark block gives it a second value.
       --mushaf-desk / --madina-desk: the surface the Quran sheet lies ON. The sheet itself is
       never inverted -- the desk around it is. */
    --accent-ink:#12327A; --mushaf-desk:#EDE7DB; --madina-desk:#FDFDFD;
    /* the on-colour for the .adhkar3/.ezhome accent fill. In dark that fill becomes a LIGHT
       blue, so white-on-it drops to 2.7:1 -- the ink has to darken instead. */
    --a3-on-blue:#FFFFFF;
    /* the warn banner (a failed reply, a blocked mic) and the wird pill that floats over the
       mushaf desk. Both were literals; both light values below are those literals unchanged. */
    --warn-bg:#FFF4E5; --warn-line:#F0C674; --warn-ink:#8B5A00;
    --wird-pill:rgba(255,255,255,0.92);
    /* the pre-React boot paint. The loading screen is the only thing drawn before the chat. */
    --boot-bg:linear-gradient(135deg, #F1F6FD 0%, #E5EBF5 100%);
    /* S100. Four more role splits of exactly the kind D88 and S95 made, and for the same
       reason: a visual theme has to be able to move ONE of these jobs without dragging the
       others with it. Every light value below is byte-for-byte what those sites already
       resolved to, so with no theme attribute the page renders as it did before this phase.
         --ez-ui-font    the interface face. Was the literal 'Tajawal', sans-serif, repeated
                         in 47 inline styles and in body{}. Amiri and Amiri Quran are NOT in
                         here: the Quran's own face is not a themeable choice.
         --ez-focus      the keyboard focus ring. Was --red-lift on three rules and --a3-cyan
                         on a fourth, so a theme could not repaint the ring without also
                         repainting a gradient end and a decorative dot. Now it cannot.
         --ez-radius-sig the SIGNATURE radius of the one hero component. Was the literal 18.
         --welcome-*     the first-run welcome surface. Its background was --black and its
                         text was --on-accent/--nav-off, which is why the two could never
                         move together; in dark --black even resolved LIGHT under white text. */
    --ez-ui-font:'Tajawal', sans-serif;
    --ez-focus:#2AA6DE; --ez-radius-sig:18px;
    --welcome-bg:#141414; --welcome-ink:#FFFFFF; --welcome-ink2:#93A0B8;
    /* The settings PREVIEWS. Two swatch sets, one per visual theme, so a preview can show the
       identity a user has NOT selected. They are literals on purpose -- a preview that read
       the live tokens would draw the same two cards twice -- and they are declared here rather
       than inline so no style key carries a hardcoded colour. They do not follow data-theme:
       the preview shows the LIGHT face of each theme, which is what the choice is about. */
    --vtp-q-page:#FFFFFF; --vtp-q-surface:#F8FBFA; --vtp-q-line:#D6E3DF;
    --vtp-q-accent:#006B61; --vtp-q-accent2:#C48A27; --vtp-q-ink:#123C37;
    --vtp-i-page:#FFFFFF; --vtp-i-surface:#FFFDFC; --vtp-i-line:#C8DDE2;
    --vtp-i-accent:#0B5F8E; --vtp-i-accent2:#C43E38; --vtp-i-ink:#10364E;
    color-scheme: light;
  }
  /* D88 DARK. Document level: only the boot paint and the browser's own UI colours, so a
     stored dark theme is on screen before the first pixel and there is no light flash. */
  :root[data-theme="dark"] { --boot-bg:#0E1116; color-scheme: dark; }
  :root[data-theme="dark"] body { background:#0E1116; }
  /* S95 DARK, DOCUMENT-WIDE. This block used to be `:root[data-theme="dark"] .theme-dark`, and
     that selector WAS the bug: only the chat container, the settings sheet, the home and the
     adhkar ever carried .theme-dark, so onboarding, the parental dashboard, the mushaf chrome,
     the memoriser, the call screen and every dialog kept the LIGHT palette while the user had
     asked for dark. Dark mode was opt-in per subtree, and most subtrees never opted in.
     It now sits on :root, so custom properties inherit into every screen and a surface has to
     opt OUT rather than opt in. Exactly one thing opts out, and it is named below:
       .mushaf-paper -- the Quran sheet. A page of the Quran is a page; the brief forbids
                        inverting it, so the sheet keeps its light tokens and the DESK around it
                        goes dark instead (--mushaf-desk / --madina-desk).
     .theme-dark is left on the elements that carry it: it is now inert, and removing it would
     touch markup this change has no reason to touch. */
  :root[data-theme="dark"] {
    --red:#5B8DEF; --red-deep:#2B4FA8; --red-lift:#2AA6DE; --red-soft:#18243C;
    --black:#F2F4F8; --ink:#E6EAF2; --muted:#9AA4B5; --nav-off:#6B7689;
    --white:#171B24; --page:#0E1116; --line:#2A313D; --tint:#1E242F;
    --scholar:#8A6136;
    --on-accent:#FFFFFF; --accent-fill:#2E56C4; --verse-ink:#A8C6FF;
    /* accent TEXT has to lighten as the page darkens; the FILL and the mushaf STROKE must not,
       which is why they are no longer the same token. The desk darkens; the sheet does not. */
    --accent-ink:#A8C6FF; --mushaf-desk:#15171C; --madina-desk:#15171C;
    --a3-on-blue:#0A1020;
    --warn-bg:#3A2A12; --warn-line:#7A5A1E; --warn-ink:#F5C97A;
    --wird-pill:rgba(23,27,36,0.92);
    /* S100. The welcome surface, which had no dark value at all: it painted var(--black),
       and --black INVERTS, so choosing dark turned the first-run screen #F2F4F8 while its
       title stayed --on-accent white. White on near-white. It has its own tokens now. */
    --welcome-bg:#0E1116; --welcome-ink:#F2F4F8; --welcome-ink2:#9AA4B5;
    color-scheme: dark;
  }
  /* The Quran sheet opts out, and only the sheet. Everything it paints -- the paper, the rules,
     the corner motifs, the page medal -- is measured against a light background, so the tokens
     it reads are pinned back to their light values here. This is the SAME mechanism .adhkar3
     already uses (a scoped re-declaration), not a second theme system. */
  :root[data-theme="dark"] .mushaf-paper {
    --red:#1D4ED8; --red-deep:#12327A; --red-lift:#2AA6DE; --red-soft:#E6EEFB;
    --ink:#1A1A1A; --muted:#6E6E6E; --white:#FFFFFF; --line:#E5EBF5; --tint:#EDF1FA;
    --accent-ink:#12327A; --on-accent:#FFFFFF; --accent-fill:#1D4ED8;
    color-scheme: light;
  }
  /* Session 13.1 Welcome/Onboarding reskin - press state for the red primary CTA */
  .welcome-primary:active { background: var(--red-deep) !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: var(--ez-ui-font);
    background: var(--page);
    direction: rtl;
    -webkit-font-smoothing: antialiased;
  }
  #root { height: 100vh; height: 100dvh; }
  input:focus { outline: none; border-color: var(--red-deep) !important; }
  button { font-family: inherit; }
  button:active { transform: scale(0.97); }
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  /* Live call screen ring pulse (Layer 1) */
  @keyframes callPulse {
    0%, 100% { transform: scale(0.92); opacity: 0.55; }
    50% { transform: scale(1.08); opacity: 1; }
  }
  /* S95: a rendered reply is drawn on --white, which is now dark in dark mode, so its headings
     and its table cannot stay pinned to #12327A/#EDF1FA. Light values are unchanged. */
  .doc-rendered h1{font-size:18px;color:var(--accent-ink);margin:10px 0 6px}
  .doc-rendered h2{font-size:16px;color:var(--accent-ink);margin:9px 0 5px}
  .doc-rendered h3{font-size:14.5px;color:var(--accent-ink);margin:8px 0 4px}
  .doc-rendered h4{font-size:13.5px;color:var(--accent-ink);margin:7px 0 4px}
  .doc-rendered p{margin:6px 0}
  .doc-rendered ul,.doc-rendered ol{margin:6px 1.2em 6px 0;padding:0}
  .doc-rendered li{margin:3px 0}
  .doc-rendered strong{font-weight:700}
  .doc-rendered table{border-collapse:collapse;width:100%;margin:8px 0}
  .doc-rendered th,.doc-rendered td{border:1px solid var(--line);padding:5px 8px;text-align:right}
  .doc-rendered th{background:var(--tint);color:var(--accent-ink)}
  /* Session 84 -- Adhkar UI V2. Exactly two things an inline style cannot express: a media
     query and :focus-visible. Both selectors are NEW class names used only by the two V2
     components, so ?adhkarui=0 (the S13.3-A screen, which carries neither class) renders
     byte-identically with these rules present. The grid is 2 columns on a phone and steps to
     3 then 4 on wider displays -- never more, so a tile never shrinks to a chip on a desktop. */
  .adhkar2-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media (min-width:600px){.adhkar2-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:900px){.adhkar2-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  /* Keyboard only: :focus-visible does not fire on touch, so the ring appears for a tabbing
     reader and never as a stuck outline after a tap. Drawn in a token, so it stays visible
     on the white top row, on the white cards and on the reading surface alike. */
  .adhkar2-focus:focus-visible{outline:3px solid var(--ez-focus);outline-offset:2px}
  /* S98 -- the reply controls (fold, quote, quick actions, favourites, search). The same
     keyboard-only ring the adhkar screens use, in the same token, so it stays visible on the
     bubble surface and on the drawer alike. Touch never sees it; a tabbing reader always does. */
  .ezik-focus:focus-visible{outline:3px solid var(--ez-focus);outline-offset:2px}
  /* S98 -- reduced motion. Everything this phase adds is motionless BY CONSTRUCTION: no
     keyframes, no transition, no smooth scroll, and the fold chevron flips in one step. The rule
     below is the belt to that braces -- it neutralises any animation or transition on an S98
     surface should one ever be added -- and it is scoped to the two S98 class names ALONE. A
     blanket `*{animation:none}` is deliberately NOT written: the mushaf's page turn resolves a
     promise on animationend, and freezing it would hang that screen forever (see the S-note at
     the flip-scheduler). Nothing outside these two classes is touched. */
  @media (prefers-reduced-motion: reduce) {
    .ezik-focus, .ezik-focus *, .ezik-panel, .ezik-panel * { animation: none !important; transition: none !important; }
    /* 44-ب: NOTHING IS ADDED TO THIS BLOCK, and that is a decision rather than an omission.
       chat-ux-guard requires every selector inside it to name an S98 class, because a blanket
       rule here would freeze the mushaf page turn (it resolves a promise on animationend). The
       platform reader is given the rest of the stillness through `data-ez-motion` instead --
       see ezikApplyA11y -- so there is ONE list of what reduced motion means and both triggers
       arrive at it, rather than two lists drifting apart. */
  }
  /* S99 -- READING MODE. It opens the lines up and nothing else: no colour moves, no element is
     hidden, no card or source or button is touched, and the text itself is not altered by a single
     character. Line-height is the one property that makes a long Arabic paragraph comfortable, and
     it is the only one this mode changes. Scoped to the prose surfaces by class so a card body, a
     button label and the mushaf page are all outside it. */
  :root[data-ez-read="1"] .ez-prose { line-height: 2.15 !important; letter-spacing: 0.15px; }
  :root[data-ez-read="1"] .ez-prose p,
  :root[data-ez-read="1"] .ez-prose li { margin-block: 0.5em; }
  /* S99 -- REDUCED MOTION, the LOCAL preference. The media query above answers the platform
     setting; this answers the switch in الإعدادات, and the two are deliberately separate rules so
     either one alone is enough. Both stop at DECORATION: the typing dots keep animating, because
     a loading indicator that stands still is a broken loading indicator, and the mushaf page turn
     keeps its animation because it resolves a promise on animationend and freezing it would hang
     that screen forever.

     A CLASS, NOT AN ATTRIBUTE MATCH. The first version of this rule selected the animated
     elements with [style*="fadeIn"], which forces the style engine to substring-search the inline
     style attribute of EVERY element on every recalculation. Measured, interleaved: it cost
     +0.74 ms on opening the menu (Welch t=2.41 over 325 opens a side) because the drawer is fifty
     elements with long inline styles. `ez-anim` marks the four places that actually animate, and
     the cost went with it. */
  :root[data-ez-motion="reduce"] { scroll-behavior: auto !important; }
  :root[data-ez-motion="reduce"] .ez-anim { animation: none !important; }
  /* The watermark cross-fades its opacity. It is the only CSS transition in the file that is
     pure decoration, and neither trigger was stopping it. */
  :root[data-ez-motion="reduce"] .ezwm { transition: none !important; }
  :root[data-ez-motion="reduce"] .ezik-focus,
  :root[data-ez-motion="reduce"] .ezik-focus *,
  :root[data-ez-motion="reduce"] .ezik-panel,
  :root[data-ez-motion="reduce"] .ezik-panel * { animation: none !important; transition: none !important; }
  /* S99 -- the keyboard focus ring, on every control this phase touches. Same token, same shape
     as the ring the adhkar screens and the S98 controls already use. */
  .ez-a11y-opt:focus-visible { outline: 3px solid var(--ez-focus); outline-offset: 2px; }
  /* 44-أ -- THE READER IS OUTSIDE THE TEXT SCALE, and this one line is the whole exclusion.
     Every size in the styles object becomes `calc(Npx * var(--ez-fs, 1))`; resetting the
     custom property to 1 on the reader's root makes every one of those calcs inside it
     evaluate to its original number. The page fit measures pgPage and its rows, so the reader
     must not move when someone chooses larger text elsewhere -- and MEASURED, it does not:
     `.ezmr-title` is 15px at «عادي», «كبير» and «أكبر» alike. It is a SCOPE and not a list, so
     anything rendered inside the reader later is covered without being remembered. */
  .ezmr-scope { --ez-fs: 1; }
  /* Session 85/86 -- the DUAL STYLE palette, and it is a SCOPED token set, not a global one:
     every declaration below lives on .adhkar3 and .ezhome, classes carried only by the four
     adhkar presentation components and the two home ones, so nothing outside them -- not the
     mushaf paper, not the chat, not the call screen, not DhikrCard, not V1 -- can read one of
     these values. Session 86 added the second selector and changed nothing else in the two
     rules; every value in them is the value session 85 shipped. Light is pure white cards on
     a very pale ice-blue page with royal blue, navy and a restrained cyan accent; there is no
     ivory, cream, tan, gold, brown or green in either row. Dark keeps the SAME structure on
     cool navy surfaces, so the reading surface stays usable without a warm paper anywhere. */
  /* Session 86 -- .ezhome joins the SAME scoped token set, because the selector now governs
     Home and Adhkar together and the two surfaces must not drift apart. It is a NEW class
     carried only by the two home presentation components: the chat container, the call
     screen, DhikrCard, the mushaf paper and V1 carry neither class, so not one of them can
     read a value from here. Nothing global is declared; the two selectors below are the
     whole of the addition. */
  .adhkar3,.ezhome{--a3-page:#F4F9FF;--a3-surface:#FFFFFF;--a3-line:#E1EAF9;--a3-ice:#DCEAFB;
    --a3-ink:#0B2455;--a3-muted:#5A6B8A;--a3-blue:#2454D7;--a3-navy:#0B2455;--a3-cyan:#20C7E8;
    --a3-soft:#EEF4FE;--a3-shadow:0 2px 12px rgba(36,84,215,0.07);--a3-lift:0 8px 26px rgba(36,84,215,0.11);
    /* THE ANSWER'S INK, and it is a role of its own for the reason the four splits above
       exist: the answer is the one thing on this screen a reader reads for minutes at a
       time, and it has to be able to darken without dragging every other use of the ink
       with it. It was TWO separate declarations -- the bubble read --a3-ink and the prose
       inside it read --ink -- which in this theme both resolve to --vt-ink, so the answer
       had one colour said in two places and no way to move it in one. Now it has one name.
       LIGHT IS THE ONLY VALUE THAT MOVES. Black, for the owner's reason: an answer read at
       length on a white sheet. Every other rendering keeps exactly the ink it had, below. */
    --answer-ink:#000000}
  :root[data-theme="dark"] .adhkar3,:root[data-theme="dark"] .ezhome{--a3-page:#0A1020;--a3-surface:#121A2C;--a3-line:#263554;--a3-ice:#1C2A45;
    --a3-ink:#E7EEFB;--a3-muted:#A2B2CE;--a3-blue:#6E9BFF;--a3-navy:#0A1020;--a3-cyan:#3FD6F5;
    --a3-soft:#18233A;--a3-shadow:0 2px 12px rgba(0,0,0,0.34);--a3-lift:0 8px 26px rgba(0,0,0,0.42);
    /* dark keeps the ink it had, said as the token it had: --a3-ink is --vt-ink here, which
       is what BOTH answer sites already resolved to. Nothing in dark moves by a byte. */
    --answer-ink:var(--a3-ink)}
  /* The two things an inline style cannot express, both of them scoped to .ezhome-* class
     names that exist nowhere else in this file. The journey path is two balanced columns on
     a phone already (cards alternate around the route), so a wide display only needs the
     reading column to stop being a phone-width ribbon. S87: the quick-row grid went out with
     the duplicated row it laid out -- every module is drawn once, by the deck itself. */
  .ezhome-wrap{width:100%;max-width:640px;margin:0 auto}
  @media (min-width:900px){.ezhome-wrap{max-width:900px}}
  .ezhome-focus:focus-visible{outline:3px solid var(--ez-focus);outline-offset:2px}
  /* ========================================================================
     S100 -- THE VISUAL THEMES. A THIRD SETTING, INDEPENDENT OF THE OTHER TWO.

     There are now three orthogonal choices and they compose in every combination:
       murabbi_theme_v1      light | dark              -- the COLOUR MODE
       ezik_ui_style_v1      journey | deck            -- the home/adhkar LAYOUT
       ezik_visual_theme_v1  qibla_13 | istana_33      -- the VISUAL IDENTITY (this block)
     Nothing below reads or writes either of the first two keys, and neither of them reads
     this one. 2 x 2 x 2 = eight renderings, and all eight are real.

     THE SHAPE OF IT. Each identity declares its own --vt-* namespace and NOTHING ELSE
     declares one; a second block then MAPS the app's existing role tokens onto that
     namespace. That is why no screen had to be repainted by hand and why a screen added
     later inherits the identity for free: it reads --page, --white, --ink like every other
     screen, and --page is already var(--vt-page) by the time it mounts. The mapping block
     sits AFTER :root[data-theme="dark"] and carries the same specificity, so it wins on
     order; the .adhkar3/.ezhome mapping sits after the dark .adhkar3 rule for the same
     reason. Both facts are load-bearing -- do not move these rules up the file.

     THE BACKGROUND INVARIANT. In light, --vt-page is #FFFFFF in BOTH identities, and it is
     a solid colour: there is no background-image, no gradient, no repeating anything, no
     ::before ornament and no watermark on any page root in this block. --boot-bg, which is
     a gradient in the base palette, is flattened to that same solid page. Theme geometry is
     allowed only INSIDE bounded components, which is what --vt-radius-sig is for: in
     istana_33 it turns the one hero component into an Ottoman arch, and it is a border
     radius on that component, not a pattern behind the app.

     THE QURAN OPTS OUT, in light as well as in dark. .mushaf-paper already pinned itself
     back to the base light tokens under data-theme=dark; it now does the same under a visual
     theme, so the sheet, its rules, its corner motifs and its medal are the same pixels in
     all eight renderings. The DESK the sheet lies on is chrome and does follow the identity.
     ===================================================================== */
  :root[data-ezik-visual-theme="qibla_13"]{
    --vt-page:#FFFFFF; --vt-surface:#F8FBFA; --vt-surface2:#EDF3F1;
    --vt-ink:#123C37; --vt-muted:#5E716D;
    --vt-accent:#006B61; --vt-accent2:#C48A27;
    --vt-line:#D6E3DF;
    --vt-radius:18px; --vt-radius-sig:18px;
    --vt-shadow:0 16px 48px rgba(0,84,76,.10);
    --vt-focus:#00544C;
    /* derived roles, each one a job the identity tokens above cannot do on their own:
       -ink   accent as TEXT on a light surface, which has to clear 4.5:1
       -deep  accent as the far end of a fill under white text
       -soft  accent at chip strength, a surface and never a text colour
       accent2 is the gold: at #C48A27 it is decoration, so its TEXT role is a darker gold. */
    --vt-on-accent:#FFFFFF; --vt-accent-ink:#00544C; --vt-accent2-ink:#6E4B0E;
    /* the ink ON the marker fill (the finished-dhikr chip). It darkened with the fill: at
       #0E2B27 on #A6741C it was 3.68:1, and a chip that carries a number owes 4.5:1. */
    --vt-on-accent2:#08110F;
    /* the gold at INDICATOR strength: #C48A27 is 2.88:1 on the card surface, and a dot that
       says "this one is selected" has to clear 3:1. Same hue, one step down. */
    --vt-marker:#A6741C;
    --vt-deep:#03453F; --vt-soft:#E4EFEC;
    --vt-font:'Noto Kufi Arabic', Tahoma, sans-serif;
  }
  /* Dark stays dark: the page is a deep pine, not an inverted white. Specificity (0,3,0)
     against the light block's (0,2,0), so the mode wins wherever the two disagree. */
  :root[data-theme="dark"][data-ezik-visual-theme="qibla_13"]{
    --vt-page:#0B1513; --vt-surface:#122220; --vt-surface2:#1A302B;
    --vt-ink:#E4F1ED; --vt-muted:#A9BEB9;
    --vt-accent:#5CCBBA; --vt-accent2:#E5BE73;
    --vt-line:#28453F;
    --vt-shadow:0 16px 48px rgba(0,0,0,.45);
    --vt-focus:#7BE0CE;
    --vt-on-accent:#062521; --vt-accent-ink:#7EDDCC; --vt-accent2-ink:#EFD199;
    --vt-on-accent2:#062521;
    /* on a dark card the gold is already the light end; it needs no second value. */
    --vt-marker:#E5BE73;
    /* the accent FILL, mid-tone in dark: it carries --vt-on-accent, which is dark here. */
    --vt-deep:#3FA898; --vt-soft:#16302B;
  }
  :root[data-ezik-visual-theme="istana_33"]{
    /* ITEM 95 -- THE SURFACE IS PURE WHITE. It was #FFFDFC, a 0/2/3 warm cast that the
       owner could see and this file could not defend: on a #FFFFFF page it is a fill nobody
       can name and a second white nobody asked for. It is the ground of the top bar, the
       cards, the rail, the composer dock and the drawer -- the whole of what «الخلفيّات»
       means on the home, the chat and the menu -- so one value moves all of them at once.
       --vt-surface2 (#EEF6F7) does NOT move: it is the pale blue-grey the owner kept, and
       it is the tint on the mushaf card, the masthead and the composer field, not a
       background pretending to be white. --vt-line #C8DDE2 is what draws every card and it
       is untouched, so nothing loses its edge. */
    --vt-page:#FFFFFF; --vt-surface:#FFFFFF; --vt-surface2:#EEF6F7;
    --vt-ink:#10364E; --vt-muted:#647780;
    --vt-accent:#0B5F8E; --vt-accent2:#C43E38;
    --vt-line:#C8DDE2;
    /* the signature: a normal 18px card everywhere, and ONE hero component that arches. */
    --vt-radius:18px; --vt-radius-sig:120px 120px 18px 18px;
    --vt-shadow:0 18px 45px rgba(12,78,105,.12);
    --vt-focus:#08486E;
    --vt-on-accent:#FFFFFF; --vt-accent-ink:#0A5480; --vt-accent2-ink:#9E2F2A;
    --vt-on-accent2:#FFFFFF;
    /* istana's red already clears the floor at 5.12:1, so the marker IS the accent2. */
    --vt-marker:#C43E38;
    --vt-deep:#083A57; --vt-soft:#E3EFF5;
    --vt-font:'Noto Naskh Arabic', Georgia, serif;
  }
  :root[data-theme="dark"][data-ezik-visual-theme="istana_33"]{
    --vt-page:#0A141B; --vt-surface:#101F29; --vt-surface2:#182D39;
    --vt-ink:#E6F1F7; --vt-muted:#A8BBC5;
    --vt-accent:#63B6E4; --vt-accent2:#EE8A83;
    --vt-line:#25404E;
    --vt-shadow:0 18px 45px rgba(0,0,0,.50);
    --vt-focus:#8CCDEE;
    --vt-on-accent:#04202F; --vt-accent-ink:#8CCDEE; --vt-accent2-ink:#F4B2AC;
    --vt-on-accent2:#04202F;
    --vt-marker:#EE8A83;
    /* same reason as qibla_13 above: a fill under a dark on-colour has to lighten. */
    --vt-deep:#4A9CCB; --vt-soft:#142C3A;
  }
  /* THE MAPPING. One rule, both identities, both modes -- every value on the right is a
     --vt-* token, so this block states the app's role vocabulary once and never a colour. */
  :root[data-ezik-visual-theme]{
    --page:var(--vt-page); --white:var(--vt-surface); --tint:var(--vt-surface2);
    --ink:var(--vt-ink); --black:var(--vt-ink); --muted:var(--vt-muted);
    --line:var(--vt-line); --nav-off:var(--vt-muted);
    --red:var(--vt-accent); --red-deep:var(--vt-deep); --red-lift:var(--vt-accent2);
    --red-soft:var(--vt-soft); --accent-fill:var(--vt-accent);
    --accent-ink:var(--vt-accent-ink); --verse-ink:var(--vt-accent-ink);
    --on-accent:var(--vt-on-accent); --scholar:var(--vt-accent2-ink);
    --a3-on-blue:var(--vt-on-accent);
    /* the desk under the Quran sheet is chrome and follows the identity; the SHEET does not,
       and pins itself back at the bottom of this block. */
    --mushaf-desk:var(--vt-surface2); --madina-desk:var(--vt-surface2);
    /* the launch paint stops being a gradient: the page background is solid in both. */
    --boot-bg:var(--vt-page);
    --welcome-bg:var(--vt-page); --welcome-ink:var(--vt-ink); --welcome-ink2:var(--vt-muted);
    --wird-pill:var(--vt-surface);
    --ez-ui-font:var(--vt-font); --ez-focus:var(--vt-focus);
    --radius-card:var(--vt-radius); --radius-btn:var(--vt-radius);
    --ez-radius-sig:var(--vt-radius-sig);
  }
  /* and the page root itself, said in the one place a background can be attached at all:
     a solid colour, and background-image explicitly none so nothing can be layered behind
     the app later without deleting this line. */
  :root[data-ezik-visual-theme] body{ background:var(--vt-page); background-image:none; }
  /* The scoped home/adhkar token set, mapped onto the same namespace. This rule has to sit
     after :root[data-theme="dark"] .adhkar3 -- equal specificity, later wins. --a3-cyan is
     now decoration ONLY: the focus ring it used to double as reads --ez-focus. */
  :root[data-ezik-visual-theme] .adhkar3,
  :root[data-ezik-visual-theme] .ezhome{
    --a3-page:var(--vt-page); --a3-surface:var(--vt-surface); --a3-line:var(--vt-line);
    --a3-ice:var(--vt-surface2); --a3-soft:var(--vt-surface2);
    --a3-ink:var(--vt-ink); --a3-muted:var(--vt-muted);
    /* --a3-navy is read in exactly one place, as the text ON the --a3-cyan chip, so it is
       the ON-COLOUR of the second accent and not a navy at all. */
    /* --a3-cyan is the small-INDICATOR role in this scope -- the step marker, the rail marks,
       the deck accent, the favourite icon and the selected dot -- so it reads the marker
       strength of the identity, not its decorative one. */
    --a3-blue:var(--vt-accent); --a3-navy:var(--vt-on-accent2); --a3-cyan:var(--vt-marker);
    --a3-shadow:var(--vt-shadow); --a3-lift:var(--vt-shadow);
  }
  /* THE QURAN SHEET OPTS OUT OF THE IDENTITY, exactly as it opts out of dark, and with the
     same literals it is pinned to there. Placed last so it outranks the mapping above in
     every combination of the three settings. */
  :root[data-ezik-visual-theme] .mushaf-paper{
    --red:#1D4ED8; --red-deep:#12327A; --red-lift:#2AA6DE; --red-soft:#E6EEFB;
    --ink:#1A1A1A; --muted:#6E6E6E; --white:#FFFFFF; --line:#E5EBF5; --tint:#EDF1FA;
    --accent-ink:#12327A; --on-accent:#FFFFFF; --accent-fill:#1D4ED8;
    --ez-ui-font:'Tajawal', sans-serif;
  }
  /* The two settings previews. Bounded component geometry, and the only place in this file
     where a theme motif is drawn: a compass rose for qibla_13, an Iznik tulip for istana_33.
     Both are inside a 44px box inside a card -- neither is, or can become, a page background,
     because neither selector can match <body> or :root. Reduced motion is respected by there
     being no animation here at all. */
  .vtp-motif{ position:absolute; inset:0; pointer-events:none; }
  .vtp-motif-q::before,.vtp-motif-q::after{ content:""; position:absolute; left:50%; top:50%;
    width:22px; height:2px; margin:-1px 0 0 -11px; background:var(--vtp-q-accent2); }
  .vtp-motif-q::after{ transform:rotate(90deg); }
  .vtp-motif-i::before{ content:""; position:absolute; left:50%; top:50%; width:14px; height:18px;
    margin:-9px 0 0 -7px; border:2px solid var(--vtp-i-accent2); border-radius:60% 60% 12% 12%; }
  .vtp-motif-i::after{ content:""; position:absolute; left:50%; top:50%; width:2px; height:8px;
    margin:9px 0 0 -1px; background:var(--vtp-i-accent2); }


  /* ========================================================================
     S101 -- THE ISTANA_33 HOME. Structure, not a palette over the old one.
     Every selector below begins with .ezist-, a prefix that exists nowhere else in this file,
     and NOT ONE of them can match html, body or :root -- which is what keeps the page
     background solid and ornament-free while the arch and the tulip live inside components.
     The composition is a real grid with a bounded, centred maximum width: one column on a
     phone, two from 600px, six from 1000px, and the module spans are declared per breakpoint
     so the DOM order and the reading order stay the SAME order the module array is in. No
     `order` property is used anywhere here, so tab order follows what is on screen.
     ===================================================================== */
  .ezist-nav{position:sticky;top:0;z-index:5;flex-shrink:0;background:var(--a3-surface);
    border-bottom:1px solid var(--a3-line);padding-top:env(safe-area-inset-top, 0px)}
  .ezist-nav-inner{width:100%;max-width:1100px;margin:0 auto;box-sizing:border-box;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:6px 12px;min-height:56px}
  /* S118 -- THE BAR CARRIES THE VERSE NOW, and .ezist-nav-side / .ezist-brand went with the
     four controls that used them; nothing else in the sheet reaches either class.

     THE PANEL IS NOT RESTYLED, it is UNBOXED. Every rule below removes a piece of CARD chrome
     -- the surface, the border, the shadow, the card's own corner and its card padding -- and
     not one of them touches the verse: the label, the Amiri face, the 19px size, the
     2.1 line height, the centring and the reference line are the panel's own inline styles and
     are untouched, so the words render exactly as they did in the mosaic. It takes the width
     the menu button leaves and no more, and min-width:0 lets it wrap rather than push.

     THE FIVE !important ARE NOT DECORATION. The panel carries its card chrome as INLINE style
     -- s.ezistQuran sets background, border, border-radius, box-shadow and padding on the
     element itself -- and an inline property outranks any class rule that does not say this.
     The alternative was a second variant of the component, and a variant is a second shape to
     keep in step; five declarations that say 'no card here' are the smaller thing to own. The
     panel is not forbidden !important by any rule in this file: only .ezmr-fb is. */
  .ezist-nav .ezist-quran{flex:1 1 auto;min-width:0;
    padding:2px 2px 4px !important;background:transparent !important;border:0 !important;
    border-radius:0 !important;box-shadow:none !important}
  .ezist-wrap{width:100%;max-width:1100px;margin:0 auto;box-sizing:border-box;
    padding:14px 12px calc(22px + env(safe-area-inset-bottom, 0px))}
  /* THE MASTHEAD, and the arch IS the signature radius -- 120px 120px 18px 18px under
     istana_33. overflow:hidden so nothing inside it can ever paint outside it.

     IT IS A STRIP NOW, not a hero. It was a centred column 30px+ of padding tall carrying a
     40px emblem, a 26px name and a chip stacked under a rule -- roughly a third of a phone
     screen before the first module card. Every WORD it showed it still shows, and every
     element it drew it still draws; they are laid on ONE ROW instead of five stacked ones,
     wrapping to a second row only when the width cannot hold them. The emblem, the rule and
     the chip are the same three things at strip scale. */
  /* S118 -- THE ARCH WAS EATING THE GREETING, and this is the measured cure.
     WHAT WAS MEASURED, on a live page at 320 / 360 / 390 / 430 CSS px, all four identical:
     the strip is 111px tall, the signature radius is 120px, and a browser scales a corner
     down when the sides cannot hold it -- here by 0.805, to an effective 96.5px arc on both
     top corners. At y=9, where the salutation sits, that arc is inset 55.8px from each end.
     The salutation row spanned the full content width, so THREE of its four corners fell
     outside the rounded box and were clipped; the name row lost one; and the tulip, first
     child on the row and hard against the trailing end in RTL, was sliced in half.
     WHICH OF THE TWO CURES, and it is chosen by that measurement and not by taste. A moderate
     rectangle would mean taking the masthead off --ez-radius-sig, and the arch IS the identity's
     one signature -- two assertions in theme-coverage-guard hold it there and neither was
     opened for this batch. So: the arch stays, and the CONTENT moves out from under it. It is
     centred on both axes and no longer stretches to the ends, which is the whole of the fix --
     a centred row of ~190px at the narrowest supported width sits inside the 184px the arcs
     leave clear at the salutation's own y, and every row below that has more room, not less.
     THE BOX IS NOT SHRUNK: the padding grows by 2px a side and nothing is removed, hidden or
     made smaller. Every word and every element the strip drew, it still draws. */
  .ezist-masthead{position:relative;overflow:hidden;box-sizing:border-box;
    border-radius:var(--ez-radius-sig);background:var(--a3-ice);border:1px solid var(--a3-line);
    padding:10px 14px;text-align:center;margin-bottom:12px;
    display:flex;align-items:center;align-content:center;justify-content:center;
    flex-wrap:wrap;gap:10px}
  /* the greeting line: the salutation and the name, one above the other, as one flex child --
     so the row has three items and not four, and the name can ellipsis instead of pushing the
     chip off the strip. */
  /* S118: it no longer takes the whole row. flex:1 1 auto stretched this column to both ends
     of the strip, which is exactly what pushed the salutation into the two arcs; it now sizes
     to its own text and shrinks -- with min-width:0 kept, so a long name still ellipses rather
     than widening the strip. */
  .ezist-hello{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:100%;flex:0 1 auto}
  /* ITEM 100 -- THE TULIP STOOD HERE, four rules deep: a 20x24 span holding a bordered bud, a
     2x8 stem and a 5px cyan bead. On the strip it sat at (342.22, 155.89), hard against the
     leading (right) end of the row and immediately beside «مرحباً يا ...» -- which is what the
     owner meant by «العلامة بجانب مرحبا», and it is removed.
     THE OTHER TWO MARKS ON THE ROW ARE NOT IT AND ARE NOT TOUCHED: .ezist-rule-short is the
     2x22 blue bar on the far side of the name, a separator and not a mark, and the arch of
     .ezist-masthead itself is the identity signature that two assertions hold in place. The
     greeting text and its size are untouched: 22.94px tall, the same face, the same weight. */
  /* the short rule turned through 90 degrees: it separated the name from the chip when they
     were stacked, and it separates them on the row for the same reason. */
  .ezist-rule-short{flex-shrink:0;width:2px;height:22px;background:var(--a3-blue);
    border-radius:2px;margin:0}
  .ezist-mosaic{display:grid;grid-template-columns:1fr;gap:12px}
  .ezist-mosaic>*{min-width:0}
  @media (min-width:600px){
    .ezist-mosaic{grid-template-columns:repeat(2,1fr);gap:14px}
    /* the new search section earns a full row at this width. (S118: the Quran panel had a
       span here too; it is not a cell of this grid any more -- it is the top bar.) */
    .ezist-mod-fatwa{grid-column:span 2}
  }
  @media (min-width:1000px){
    .ezist-mosaic{grid-template-columns:repeat(6,1fr);gap:16px}
    /* three modules across, then treasure beside the wider fatwa search entry. */
    .ezist-mod,.ezist-feature{grid-column:span 2}
    .ezist-mod-fatwa{grid-column:span 4}
    .ezist-masthead{padding:10px 20px}
    .ezist-nav-inner{padding:6px 20px}
  }

  /* ========================================================================
     S103 -- THE ISTANA ADHKAR CATALOGUE. Same language as the istana home: a bounded sticky
     top bar with the title centred, an arched masthead, and a real responsive catalogue.
     Every selector begins with .ezia-, a prefix used nowhere else, and none of them can
     match html, body or :root -- the arches and emblems are inside cards, never behind them.
     ===================================================================== */
  .ezia-nav{position:sticky;top:0;z-index:5;flex-shrink:0;background:var(--a3-surface);
    border-bottom:1px solid var(--a3-line);padding-top:env(safe-area-inset-top, 0px)}
  .ezia-nav-inner{width:100%;max-width:1100px;margin:0 auto;box-sizing:border-box;display:flex;
    align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;min-height:56px}
  .ezia-brand{display:inline-flex;align-items:center;gap:8px;min-width:0;
    font-family:var(--ez-ui-font);font-weight:800;font-size:16.5px;color:var(--a3-ink)}
  .ezia-brand-arch{width:14px;height:18px;flex-shrink:0;border:2px solid var(--a3-blue);
    border-radius:60% 60% 12% 12%;border-bottom-color:transparent}
  .ezia-wrap{width:100%;max-width:1100px;margin:0 auto;box-sizing:border-box;
    padding:14px 12px calc(24px + env(safe-area-inset-bottom, 0px))}
  .ezia-masthead{position:relative;overflow:hidden;box-sizing:border-box;display:flex;
    align-items:center;gap:16px;border-radius:var(--ez-radius-sig);background:var(--a3-ice);
    border:1px solid var(--a3-line);padding:26px 18px 20px;margin-bottom:14px}
  .ezia-sec{display:flex;align-items:center;gap:10px;margin:18px 2px 10px}
  .ezia-sec-rule{flex:1;height:1px;background:var(--a3-line)}
  .ezia-featured{display:grid;grid-template-columns:1fr;gap:12px}
  .ezia-catalogue{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .ezia-featured>*,.ezia-catalogue>*{min-width:0}
  @media (min-width:600px){
    .ezia-featured{grid-template-columns:repeat(3,1fr);gap:14px}
    .ezia-catalogue{grid-template-columns:repeat(3,1fr);gap:14px}
  }
  @media (min-width:1000px){
    .ezia-catalogue{grid-template-columns:repeat(4,1fr);gap:16px}
    .ezia-masthead{padding:34px 26px 28px}
    .ezia-nav-inner{padding:6px 20px}
  }
  /* the card crest: a bounded arch band across the top of a catalogue card. */
  .ezia-crest{position:absolute;top:0;right:0;left:0;height:26px;
    border-radius:16px 16px 40% 40%/16px 16px 100% 100%;background:var(--a3-ice)}
  .ezia-crest-coral{background:transparent;border-bottom:2px solid var(--a3-cyan)}
  /* the emblem: an eight-point Iznik star, two squares, inside a 22px box inside a card. */
  .ezia-star{position:relative;display:block;width:20px;height:20px}
  .ezia-star::before,.ezia-star::after{content:"";position:absolute;inset:2px;
    border:1.6px solid currentColor;border-radius:3px}
  .ezia-star::after{transform:rotate(45deg)}
  /* the reader shell */
  .ezia-read-wrap{width:100%;max-width:760px;margin:0 auto;box-sizing:border-box;padding:14px 12px 0}
  .ezia-read-panel{position:relative;overflow:hidden;box-sizing:border-box;
    border-radius:var(--ez-radius-sig);background:var(--a3-surface);border:1px solid var(--a3-line);
    padding:30px 18px 22px;text-align:center}
  .ezia-dock-inner{width:100%;max-width:760px;margin:0 auto;box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px}

  /* ========================================================================
     S105 -- THE SHARED ISTANA SHELL. One bounded top bar, one centred column, one set of
     breakpoints, for every screen that adopts it. .ezsh- is used nowhere else and none of
     these selectors can match html, body or :root, so the page stays plain while the arch
     lives inside the bar and the groups.

     Settings is its first tenant. EzikIstanaHome and the istana adhkar screens keep their own
     structures for now and are NOT refactored onto it in this commit -- the shell exists to
     be reused by the screens still to come, and rewriting two working screens to prove that
     is risk with no reward.
     ===================================================================== */
  .ezsh-nav{position:sticky;top:0;z-index:5;flex-shrink:0;background:var(--a3-surface);
    border-bottom:1px solid var(--a3-line);padding-top:env(safe-area-inset-top, 0px)}
  .ezsh-nav-inner{width:100%;max-width:1100px;margin:0 auto;box-sizing:border-box;display:flex;
    align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;min-height:56px}
  .ezsh-nav-side{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
  .ezsh-nav-side.is-end{justify-content:flex-end}
  .ezsh-brand{display:inline-flex;align-items:center;gap:8px;flex-shrink:0;min-width:0;
    font-family:var(--ez-ui-font);font-weight:800;font-size:17px;color:var(--a3-ink)}
  .ezsh-brand-arch{width:15px;height:19px;flex-shrink:0;border:2px solid var(--a3-blue);
    border-radius:60% 60% 12% 12%;border-bottom-color:transparent}
  .ezsh-wrap{width:100%;max-width:1100px;margin:0 auto;box-sizing:border-box;
    padding:14px 12px calc(24px + env(safe-area-inset-bottom, 0px))}
  /* the group grid: one column, two where the content earns it, never more -- a settings
     group read across a 2048px viewport is a worse control, not a better one. */
  .ezsh-grid{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
  .ezsh-grid>*{min-width:0}
  @media (min-width:900px){
    .ezsh-grid{grid-template-columns:repeat(2,1fr);gap:16px}
    .ezsh-group.is-wide{grid-column:span 2}
    .ezsh-wrap{padding:20px 20px calc(30px + env(safe-area-inset-bottom, 0px))}
    .ezsh-nav-inner{padding:6px 20px}
  }

  /* ========================================================================
     THE READ-ONLY FATWA SEARCH. The empty screen contains only its scholar selector and
     search control; result furniture is mounted only after a search. All colour comes from
     the same istana tokens as the rest of Ezik, and every selector is confined to .ezf-.
     ===================================================================== */
  .ezf-wrap{width:100%;max-width:900px;margin:0 auto;box-sizing:border-box;
    padding:16px 12px calc(28px + env(safe-area-inset-bottom, 0px))}
  .ezf-controls{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:18px;
    background:var(--a3-surface);border:1px solid var(--a3-line);box-shadow:var(--a3-shadow)}
  .ezf-field{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:100%;max-width:260px;
    margin-left:auto;font-family:var(--ez-ui-font);text-align:right}
  .ezf-label{font-size:.8667em;font-weight:800;color:var(--a3-ink)}
  .ezf-select,.ezf-input{box-sizing:border-box;min-height:48px;border-radius:14px;
    background:var(--a3-page);border:1px solid var(--a3-line);color:var(--a3-ink);
    font-family:var(--ez-ui-font);font-size:1em;font-weight:700}
  .ezf-select{width:100%;padding:0 12px;text-align:right;direction:rtl}
  .ezf-search{display:flex;align-items:stretch;gap:8px;width:100%}
  .ezf-input{flex:1;min-width:0;padding:0 14px;text-align:right}
  .ezf-input::placeholder{color:var(--a3-muted);opacity:1}
  .ezf-submit{min-width:82px;min-height:48px;padding:0 16px;border-radius:14px;
    background:var(--a3-blue);border:1px solid var(--a3-blue);color:var(--a3-on-blue);
    font-family:var(--ez-ui-font);font-size:.9333em;font-weight:800;cursor:pointer}
  .ezf-submit:disabled{opacity:.58;cursor:wait}
  .ezf-status{margin:14px 2px 10px;color:var(--a3-muted);font-family:var(--ez-ui-font);
    font-size:.8667em;font-weight:700;line-height:1.7;text-align:right}
  .ezf-status.is-error{color:var(--a3-cyan)}
  .ezf-results{display:flex;flex-direction:column;gap:12px}
  .ezf-card{box-sizing:border-box;padding:16px;border-radius:18px;background:var(--a3-surface);
    border:1px solid var(--a3-line);box-shadow:var(--a3-shadow);font-family:var(--ez-ui-font)}
  .ezf-card-head{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:14px}
  .ezf-title{margin:0;color:var(--a3-ink);font-size:1.2em;font-weight:800;
    line-height:1.65;text-align:right}
  .ezf-meta{display:flex;align-items:center;flex-wrap:wrap;gap:7px;color:var(--a3-muted);
    font-size:.8em;font-weight:700}
  .ezf-tag{display:inline-flex;align-items:center;min-height:28px;padding:2px 9px;border-radius:999px;
    background:var(--a3-ice);border:1px solid var(--a3-line);color:var(--a3-blue)}
  .ezf-section-title{margin:14px 0 5px;color:var(--a3-blue);
    font-size:.8667em;font-weight:800}
  .ezf-copy{margin:0;color:var(--a3-ink);font-size:1em;
    font-weight:500;line-height:2;white-space:pre-wrap;text-align:right}
  .ezf-notice{margin:0 0 4px;padding:9px 11px;border-radius:13px;background:var(--a3-ice);
    border:1px solid var(--a3-line);color:var(--a3-ink);font-family:var(--ez-ui-font);
    font-size:.8667em;line-height:1.7}
  .ezf-audio{display:block;width:100%;margin-top:14px;accent-color:var(--a3-blue)}
  .ezf-source{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
    margin-top:14px;padding:0 14px;border-radius:13px;background:var(--a3-ice);
    border:1px solid var(--a3-line);color:var(--a3-blue);font-size:.8667em;
    font-weight:800;text-decoration:none}
  .ezf-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;
    margin-top:14px;padding-top:14px;border-top:1px solid var(--a3-line)}
  .ezf-action{min-height:44px;padding:7px 10px;border-radius:13px;background:var(--a3-page);
    border:1px solid var(--a3-line);color:var(--a3-muted);font-family:var(--ez-ui-font);
    font-size:.8667em;font-weight:800}
  .ezf-action:disabled{opacity:.68;cursor:not-allowed}
  .ezf-pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px}
  .ezf-page-btn{min-height:44px;padding:0 14px;border-radius:13px;background:var(--a3-surface);
    border:1px solid var(--a3-line);color:var(--a3-blue);font-family:var(--ez-ui-font);
    font-size:.8667em;font-weight:800;cursor:pointer}
  .ezf-page-btn:disabled{opacity:.45;cursor:not-allowed}
  .ezf-page-text{min-width:72px;color:var(--a3-muted);font-family:var(--ez-ui-font);
    font-size:.8667em;font-weight:800;text-align:center}
  /* THE ALPHABETICAL SHELF. A browse row is a title and nothing else until it is
     opened; the opened fatwa is the very same .ezf-card the search already
     renders, so a fatwa never has two appearances in this app. */
  .ezf-list{display:flex;flex-direction:column;gap:8px}
  .ezf-row{box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;
    min-height:52px;padding:11px 14px;border-radius:15px;background:var(--a3-surface);
    border:1px solid var(--a3-line);color:var(--a3-ink);font-family:var(--ez-ui-font);
    font-size:.9333em;font-weight:700;line-height:1.7;text-align:right;cursor:pointer}
  .ezf-row.is-open{border-color:var(--a3-blue);background:var(--a3-ice)}
  .ezf-row-title{flex:1;min-width:0;text-align:right}
  .ezf-row-mark{flex:none;color:var(--a3-blue);font-size:.8em;font-weight:800}
  .ezf-open{margin:8px 0 4px}
  .ezf-back{min-height:44px;margin-bottom:12px;padding:0 14px;border-radius:13px;
    background:var(--a3-ice);border:1px solid var(--a3-line);color:var(--a3-blue);
    font-family:var(--ez-ui-font);font-size:.8667em;font-weight:800;cursor:pointer}
  @media (min-width:700px){
    .ezf-wrap{padding:20px 20px calc(32px + env(safe-area-inset-bottom, 0px))}
    .ezf-controls{padding:16px}
    .ezf-actions{grid-template-columns:repeat(4,minmax(0,1fr))}
  }

  /* S106 -- THE QURAN CATALOGUE. Four contained columns on a desk, never eight tiny cards:
     the measured defect was 114 surahs laid across a 2048px viewport at ~250px each. The grid
     lives inside the shell wrap, so it is bounded to 1100px before it is divided. .ezq- is
     used nowhere else and cannot match html, body or :root. */
  .ezq-cat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .ezq-cat>*{min-width:0}
  @media (min-width:600px){.ezq-cat{grid-template-columns:repeat(3,1fr);gap:12px}}
  @media (min-width:1000px){.ezq-cat{grid-template-columns:repeat(4,1fr);gap:14px}}
  /* the card crest: a bounded arch band, clipped by the card. */
  .ezq-card{position:relative;overflow:hidden}
  .ezq-crest{position:absolute;top:0;right:0;left:0;height:20px;
    border-radius:14px 14px 40% 40%/14px 14px 100% 100%;background:var(--a3-ice)}
  /* S107 -- the drill reading column. Narrower than the shell so a line of the Quran keeps a
     legible measure on a desk; it is a WIDTH, and nothing here paints over the text: no
     background, no pseudo-element, no overlay inside these bounds. */
  .ezq-read{width:100%;max-width:720px;margin:0 auto}
  .ezq-drill-acts{width:100%;max-width:720px;margin:12px auto 0}
  /* S109 -- the mushaf index. The SURAH list, and only the surah list, reuses .ezq-cat
     (2 / 3 / 4 / 4) so the Quran catalogue and the surah index are one grid vocabulary.
     S110 -- the juz used to sit INSIDE that grid at grid-column:1/-1. Every span forced a row
     break, so the surah cards standing before it were stranded beside a column of empty space.
     They are compact CONTROLS now, in a denser grid of their own that no surah card enters:
     3 on a phone, 5 on a tablet, 6 from a desk upward. Thirty of them cost eight rows at 390px
     and five at a desk, and nothing here spans. */
  .ezm-juzgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}
  .ezm-juzgrid>*{min-width:0}
  @media (min-width:600px){.ezm-juzgrid{grid-template-columns:repeat(5,1fr);gap:10px}}
  @media (min-width:1000px){.ezm-juzgrid{grid-template-columns:repeat(6,1fr);gap:12px}}
  /* the two section headings. Bounded type on the page's own ink -- no band, no background,
     nothing that could be mistaken for the masthead. */
  .ezm-sec{margin:0 0 10px;font-size:14px;font-weight:800;letter-spacing:0;color:var(--ink)}
  .ezq-masthead{position:relative;overflow:hidden;box-sizing:border-box;
    border-radius:var(--ez-radius-sig);background:var(--a3-ice);border:1px solid var(--a3-line);
    padding:24px 18px 18px;margin-bottom:14px;text-align:center}
  /* S110 -- THE STRIP. The masthead on the mushaf index carries two device-local rows, not a
     welcome; at hero height it pushed the whole index below the fold. This branch drops the
     hero padding and the centring outright and lays the rows out as ONE bounded flex row.
     Only rows that exist are rendered, so a missing bookmark leaves no gap to collapse. */
  .ezq-masthead.is-strip{padding:8px;margin-bottom:14px;min-height:0;text-align:right;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ezq-masthead.is-strip>*{flex:1 1 220px;min-width:0;margin:0}
  /* S110 -- THE READER CHROME. Two bounded overlays and nothing else, replacing the navy slab
     header and the full-width white pager the shipped reader wore. They are absolutely
     positioned SIBLINGS of the reading viewport, exactly as the two bars they replace were, so
     they still consume zero layout height: the page is measured against the same box, and
     showing or hiding them moves nothing. Each carries .ezhome for the a3 token scope -- the
     same idiom EzShell uses -- and declares no colour of its own.
     Nothing here can reach the page: no rule names the image, the viewport or the strip, and
     no pseudo-element is drawn anywhere near them. */
  .ezmr-rail,.ezmr-dockwrap{position:absolute;left:0;right:0;z-index:4;display:flex;
    justify-content:center;box-sizing:border-box;pointer-events:none}
  .ezmr-rail{top:0;padding:calc(8px + env(safe-area-inset-top,0px))
    calc(10px + env(safe-area-inset-right,0px)) 0 calc(10px + env(safe-area-inset-left,0px))}
  .ezmr-dockwrap{bottom:0;padding:0 calc(10px + env(safe-area-inset-right,0px))
    calc(8px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px))}
  /* the surfaces. A hairline, a soft lift, and a radius that arches at the outer edge -- the
     ottoman note kept to a curve, never an ornament. No backdrop blur: over a full-screen page
     image that is the one effect that costs a repaint every frame on a phone. */
  .ezmr-bar{pointer-events:auto;display:flex;align-items:center;gap:6px;box-sizing:border-box;
    width:100%;min-height:48px;padding:5px 6px;background:var(--a3-surface);
    border:1px solid var(--a3-line);box-shadow:var(--a3-shadow)}
  .ezmr-rail>.ezmr-bar{max-width:600px;border-radius:22px 22px 14px 14px}
  .ezmr-dockwrap>.ezmr-bar{max-width:420px;justify-content:space-between;
    border-radius:14px 14px 22px 22px}
  /* the loading/failed render has no page to overlay, so its rail is an ordinary flex child. */
  .ezmr-rail.is-static{position:static;flex-shrink:0}
  .ezmr-title{flex:1;min-width:0;text-align:center;font-weight:800;color:var(--a3-ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ezmr-btn{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
    min-width:42px;height:38px;padding:0 10px;border-radius:12px;background:transparent;
    border:1px solid transparent;color:var(--a3-ink);cursor:pointer;font-family:inherit;
    font-weight:700;line-height:1}
  .ezmr-btn:hover{background:var(--a3-ice)}
  .ezmr-btn:focus-visible{outline:3px solid var(--ez-focus);outline-offset:2px}
  .ezmr-btn:disabled{opacity:0.32;cursor:default}
  .ezmr-btn.is-on{background:var(--a3-ice);border-color:var(--a3-line)}
  /* S111 -- the rollback reader's bounded inner row. It is the ONLY thing added inside those two
     in-flow bars, and it is deliberately weightless: no padding, no margin, no border, no
     min-height. The bar's own height is still its padding plus its 36px controls, so the box the
     SVG paper is measured against is the box it was measured against before. */
  .ezmr-fb-inner{width:100%;max-width:1100px;margin:0 auto;min-width:0;
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ezmr-fb-btn:hover{background:var(--a3-ice)}
  .ezmr-fb-btn:focus-visible{outline:3px solid var(--ez-focus);outline-offset:2px}
  .ezmr-fb-btn:disabled{opacity:0.32;cursor:default}
  .ezmr-fb-btn.is-on{background:var(--a3-ice)}
  /* ========================================================================
     S112 -- THE ISTANA CHAT.

     The conversation screen was the last full-height legacy surface in this file: a navy
     gradient masthead laid across the whole viewport, a transcript that ran the full width
     of a 2048px desk, and a composer bar pinned edge to edge beneath it. What replaces it
     is STRUCTURE, not paint. Four bounded pieces -- rail, transcript, dock, drawer -- laid
     on ONE measure, --ezc-measure, so nothing on this screen is wider than a readable
     column however wide the display is.

     WHAT THIS BLOCK MAY NOT DO, and does not:
       * it declares no background-image, no gradient, no repeat and no url() anywhere, so
         the page stays the solid --vt-page the identity declares;
       * no selector below can match html, body or :root -- every one is a .ezc- class, and
         .ezc- exists nowhere else in the file;
       * it draws no ::before / ::after, so nothing can be painted over the transcript by a
         rule the reader cannot see.
     THE WATERMARK is deliberately NOT one of these rules. It is the app's own icon behind the
     conversation, and an image is exactly what this block may not attach -- so it is its own
     class, .ezwm, declared under this block and never under a .ezc selector. It sits at
     z-index:-1 inside the chat root's own stacking context, which is why it paints over the
     page colour and under every piece of chrome without one of those pieces being positioned.
     The one ottoman note is a BORDER RADIUS on the two bounded bars -- an arch at the outer
     edge, kept to a curve and never an ornament.

     COLOUR. The chat root carries .ezhome, which is what puts the a3 token set in scope --
     the same idiom EzShell and the mushaf reader chrome already use. So this block states
     exactly ONE colour of its own: the modal scrim, which needs an alpha no token carries
     and is declared per mode rather than inherited from a slab.
     ===================================================================== */
  .ezc{--ezc-measure:880px;--ezc-scrim:rgba(11,36,85,0.38)}
  :root[data-theme="dark"] .ezc{--ezc-scrim:rgba(2,8,14,0.62)}
  /* 1. THE TOP RAIL -- bounded and centred, ON the page rather than across it. */
  .ezc-rail{flex-shrink:0;display:flex;justify-content:center;box-sizing:border-box;
    padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px))
      8px calc(12px + env(safe-area-inset-left,0px))}
  .ezc-rail-inner{width:100%;max-width:var(--ezc-measure);box-sizing:border-box;display:flex;
    align-items:center;gap:10px;min-height:52px;padding:5px 8px;background:var(--a3-surface);
    border:1px solid var(--a3-line);border-radius:20px 20px 13px 13px;box-shadow:var(--a3-shadow)}
  .ezc-brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;
    font-family:var(--ez-ui-font);font-weight:800;font-size:16.5px;color:var(--a3-ink)}
  .ezc-brand-arch{width:14px;height:18px;flex-shrink:0;border:2px solid var(--a3-blue);
    border-radius:60% 60% 12% 12%;border-bottom-color:transparent}
  .ezc-brand-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ezc-icon{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
    width:40px;height:40px;padding:0;border-radius:12px;background:transparent;
    border:1px solid transparent;color:var(--a3-ink);cursor:pointer;font-family:inherit;line-height:1}
  .ezc-icon:hover{background:var(--a3-ice)}
  .ezc-icon:focus-visible{outline:3px solid var(--ez-focus);outline-offset:2px}
  /* 44-ج -- THE FINGER GETS 44x44; THE EYE KEEPS THE SHAPE IT ALREADY HAD.
     MEASURED at 430x932 with a coarse pointer, on the chat with a reply on it: 14 controls
     were under 44x44 -- the drawer toggle at 40x40, the reply strip (listen 67.9x32, copy
     37.3x31, quote 48.9x31, favourite 31x23, tashkeel 47x31, report 53x32), the five quick
     actions at ~41 tall, and the drawer row's pin and delete at 32x32. Every one of them
     failed on HEIGHT, which is what a thumb misses.

     THE PAINTED BOX IS NOT TOUCHED. The hit area is an ::before centred on the control and
     grown to the minimum -- `width:100%` keeps whatever the control already is, and the two
     `min-*` only ever raise it. A control that is already big enough gets an overlay exactly
     its own size, so this rule can be aimed at a whole container without auditing it first.
     It paints nothing: no background, no border, no content.

     AIMED AT THE FOUR CONTAINERS THAT HOLD THE SMALL CONTROLS, never at `button` globally:
     a 44px floor under every button on the page would collide with the tightly packed rows
     the onboarding and the settings screens use, and those controls are already large. */
  .ezc-icon, .ezc-acts button, .ezc-row button, .ez-hit button { position: relative; }
  .ezc-icon::before, .ezc-acts button::before, .ezc-row button::before, .ez-hit button::before {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 100%; height: 100%; min-width: 44px; min-height: 44px; }
  /* THE ONE PLACE THE FULL 44 DOES NOT FIT, stated rather than quietly dropped. The drawer
     row's pin and delete are 32px wide and sit 2px apart from each other and from the row
     button beside them; MEASURED, giving each a 44px-wide area made them overlap by 10px and
     steal one another's taps. They take the full 44 in HEIGHT -- the direction a thumb
     actually misses -- and in width they take exactly the space that exists (32 + 1px a side).
     Widening them further would mean MOVING them, and this item moves nothing: the shape stays
     where it is, to the pixel. */
  .ezc-row button::before { min-width: 34px; }
  /* 2. THE TRANSCRIPT. The measure is applied as the SCROLLER'S OWN PADDING -- no wrapper
     was inserted between the scroll container and the messages, so the S97 opening pin
     still measures and positions exactly the element it always did, and the ResizeObserver
     still observes the same children. */
  .ezc-scroll{box-sizing:border-box;
    padding:14px max(14px, calc((100% - var(--ezc-measure)) / 2)) 20px}
  /* THE THREAD SITS ON THE COMPOSER, not under the rail. An auto margin on the first turn
     absorbs the free space while the conversation is short, and resolves to nothing the moment
     it is not -- which is why this and not justify-content:flex-end, whose overflow escapes
     upward where no scroll can reach it. The S97 pin is untouched either way: when there is
     free space to absorb there is nothing to scroll, and when there is not the margin is 0 and
     scrollHeight is exactly what it was. */
  .ezc-scroll>*:first-child{margin-block-start:auto}
  /* STREAM-P4 §٣/١: while a question is pinned to the top, that auto margin is exactly the
     wrong rule, and it is not merely cosmetic — it makes the spacer's arithmetic circular.
     MEASURED: with a short thread the margin pushes the question DOWN, so the pin asks for a
     spacer; the spacer makes the content overflow, which resolves the margin to 0 and lifts the
     question back UP; the pin then computes that no spacer is needed, the margin returns, and
     the two swap places forever. The question never rose above 410px and the spacer never
     survived a single frame. Turning the margin off for the duration of the pin makes the
     measurement monotone: adding room below can then only ever move the question up. */
  .ezc-scroll.ezc-askpinned>*:first-child{margin-block-start:0}
  .ezc-turn{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:100%}
  .ezc-turn.is-user{align-items:flex-start}
  .ezc-turn.is-ai{align-items:stretch}
  /* the reply's reading sheet and the small rail beneath it. Both are layout only: not one
     colour, and nothing that could paint over the prose inside them. */
  .ezc-ans{min-width:0}
  .ezc-acts{min-width:0}
  /* 3. THE EMPTY STATE. Centred in the space it already has rather than given a hero of
     its own, so a new thread opens with the composer under the thumb and no dead band. */
  .ezc-empty{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:24px 16px;text-align:center}
  /* 4. THE COMPOSER DOCK -- bounded on the same measure as the transcript, in flow, so it
     can never cover the last reply. */
  .ezc-dock{flex-shrink:0;display:flex;justify-content:center;box-sizing:border-box;
    padding:0 max(12px, calc((100% - var(--ezc-measure)) / 2))
      calc(10px + env(safe-area-inset-bottom,0px))}
  .ezc-dock-inner{width:100%;max-width:var(--ezc-measure);box-sizing:border-box;display:flex;
    flex-direction:column;gap:8px;padding:8px 8px 4px;background:var(--a3-surface);
    border:1px solid var(--a3-line);border-radius:13px 13px 20px 20px;box-shadow:var(--a3-lift)}
  .ezc-note{padding:0 6px 2px;text-align:center;font-size:11px;line-height:1.5;color:var(--a3-muted)}
  /* 5. THE HISTORY DRAWER. A side drawer on a phone; from a desk upward an inset panel with
     its own bounds -- never a full-screen slab over the conversation behind it. */
  .ezc-drawer-ov{position:fixed;inset:0;z-index:60;background:var(--ezc-scrim)}
  .ezc-drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;box-sizing:border-box;display:flex;
    flex-direction:column;width:320px;max-width:86vw;background:var(--a3-surface);
    border-left:1px solid var(--a3-line);box-shadow:var(--a3-lift);
    padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
  @media (min-width:900px){
    .ezc-drawer{top:16px;right:16px;bottom:16px;width:344px;border:1px solid var(--a3-line);
      border-radius:20px 20px 14px 14px}
  }
  .ezc-drawer-head{display:flex;align-items:center;gap:8px;flex-shrink:0;padding:2px 6px 10px;
    font-family:var(--ez-ui-font);font-weight:800;font-size:16px;color:var(--a3-ink)}
  .ezc-drawer-arch{width:13px;height:17px;flex-shrink:0;border:2px solid var(--a3-blue);
    border-radius:60% 60% 12% 12%;border-bottom-color:transparent}
  .ezc-row{position:relative;border-radius:12px}
  .ezc-row.is-on{background:var(--a3-ice)}
  .ezc-row.is-pinned{border-inline-start:3px solid var(--a3-cyan)}
  /* ========================================================================
     THE WATERMARK. It is the APP ICON -- the one with the word عزك written inside the arch --
     and it is neither the app-store tile nor the bare mark.

     TWO WRONG SOURCES CAME BEFORE THIS ONE, and both are worth naming so a third is not cut.
     /icon-512.png was here first: that file is the LAUNCHER icon, a solid blue rounded plate
     carrying a star and an open book, filling its canvas edge to edge (measured: ink bounding
     box 512x512 out of 512x512), so behind a conversation it read as a slab and not as a mark.
     It was replaced by a crop of android-icon-foreground.png, and that was wrong too: the
     launcher icon's FOREGROUND LAYER is the bare chevron, so what painted behind the thread
     was an arch with no word in it at all. The app's icon has the name written in it, and the
     name is what the owner asked to see.

     WHAT IS AT THIS PATH NOW. The icon itself: 904x904, RGBA, 75.5% of its pixels fully
     transparent at alpha exactly 0, ink bounding box 828x891. They are the icon's own pixels --
     the file was cut from the iOS icon the owner sent by lifting the white ground, undoing the
     premultiply and cropping to the ink; nothing was redrawn, traced or recoloured.
     THE iOS ICON ITSELF MAY NOT BE USED HERE: its PNG colour type is 2, it carries no alpha
     channel at all, and it would paint an opaque white rectangle across the conversation.
     The path did not change because the service worker precaches this URL by name and icon.svg
     is in no list at all, so an offline reader would meet an empty box.

     THE SIZE. It was min(70vw,58vh,560px), which laid ~515px of ink across an 860px panel --
     three fifths of the width, which is a backdrop and not a watermark. It is now
     clamp(120px,38%,200px): 38% of this element's own box, and this element is inset:0 in the
     chat root, so the percentage IS the panel width on every width the panel does not cap. The
     floor keeps it readable on a narrow phone; the ceiling is what binds on a desktop, where
     38% would run away again. ONE value and not two: the second is `auto`, so the square image
     stays square and no percentage is ever resolved against this box's HEIGHT.

     WHAT DID NOT MOVE. The element, and its inset, z-index, repeat and background-position, so
     the mark is centred in the same place it was; the opacity is still --ezwm-o, still 0.5 when
     nothing was chosen, and still the one number the settings sheet writes. The source and the
     scale are the whole of the change.

     IT IS NOT A .ezc RULE, and that is the whole of why it is written here rather than above:
     the chat block may not attach an image, a gradient or a repeat to anything it owns, and
     this is an image. It owns ONE element; that element is aria-hidden and pointer-events:none
     and carries no text, no handler and no state.

     WHY z-index:-1 AND NOT 0. The composer dock may not be positioned -- it is in flow, and a
     positioned dock is the very defect that rule exists to catch -- so a watermark at z-index:0
     would paint OVER it. The chat root is made a stacking context instead; a negative layer
     inside one paints above that root's own background colour and below every in-flow piece of
     chrome, without a single other element having to move.

     The opacity is a variable because the reader owns it: --ezwm-o is written on the document
     root from the stored preference, and 0.5 is what it is when nothing was ever chosen. */
  /* Item 62. A REAL zero removes the element from the paint and from the network; the quiet
     class is the optional retreat while a reply arrives, and it fades both ways so the mark
     does not blink back at the end of every answer. */
  :root[data-ezwm="off"] .ezwm{display:none}
  .ezwm.is-quiet{opacity:0}
  .ezwm{transition:opacity .35s ease;position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:var(--ezwm-o,0.5);
    background-image:url("/icon-watermark.png");background-repeat:no-repeat;background-position:50% 50%;
    background-size:clamp(120px,38%,200px)}
  /* ========================================================================
     THE SECTION SUGGESTIONS, above the composer, on an empty thread only.

     ONE LIST, TWO SHAPES. The same three entries are drawn as full-width ROWS while the
     composer is not focused and as a scrolling row of pills while it is -- not two lists, not
     two components, and nothing hidden with display:none: the container takes a class and the
     rule below changes the axis. The third state is not a shape at all, it is absence: the
     first typed character unmounts the whole thing. (ITEM 96 took the ground, the frame and
     the corner off the first of those two shapes, so it is a line of text with a mark beside
     it. The pill is not a rectangle, was never what the owner reported, and is untouched.)

     Like the watermark, this is deliberately NOT a .ezc rule -- the chat's own block is a
     frozen inventory and this is new furniture, so it carries its own prefix and cannot be
     reached by any selector in that block. Every colour here is a token the sheet already
     declares. Nothing animates, so there is nothing for reduced motion to switch off. */
  .ezsug{display:flex;flex-direction:column;gap:8px;padding:2px 2px 8px;min-width:0}
  .ezsug.is-row{flex-direction:row;gap:8px;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:6px}
  .ezsug.is-row::-webkit-scrollbar{width:0;height:0}
  /* ITEM 96 -- UNBOXED AND SHRUNK. What changes is the CARD; not the list, not the pill, not
     one colour and not one typeface.
     MEASURED at 430x932 dpr 2 on an empty thread, all three identical: 60.30px tall on a 56px
     floor, 10px/12px of padding, a 14px corner, a filled --a3-ice ground and a 1px --a3-line
     frame -- three filled rectangles stacked over the composer, 206.89px of a 932px screen.
     THE GROUND, THE FRAME AND THE CORNER GO, so the entry reads as text with a mark beside it.
     No colour is added or changed by that: the ink is still --a3-ink, the two marks are still
     --a3-blue and --a3-muted, and `transparent` is not a palette value -- it is the absence of
     one, which is what "no box" means.
     56px -> 44px IS A FLOOR, NOT A HEIGHT. The content is 38.30px (a 20.30px title over an 18px
     line) and what is actually cut is the padding, 10px -> 4px a side. The floor stays declared
     because this is a TAP TARGET and 44px is the smallest one this app ships.
     THE FONT IS NOT TOUCHED. The item allows a smaller face "if needed" and it is not needed --
     the frames were the size, not the letters. 14.5px title and 12px sub, both unchanged. */
  /* ITEM 96, THE REST OF IT -- THE WIDTH. ed6ee0d took the ground, the frame and the corner
     off this entry and cut its padding, and it did all of that to a box still declared
     width:100%. On a phone that box is 384px and the change reads. ON A DESK IT IS 858px:
     measured at 1440x900, the three entries were 858.00 x 46.30 each, with the title at the
     right-hand end and the chevron stranded 700px away at the other -- which is exactly the
     «صفوف كبيرة بسهم» the owner photographed. The frame was gone and the ROW was still there,
     because a full-bleed row is a big rectangle whether or not anything is painted inside it.
     So the entry is sized by its own content now and aligned to the start of the column. It
