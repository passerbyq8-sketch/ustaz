<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1D4ED8">
<title>عزك</title>
<link rel="canonical" href="https://ezik.app/download.html">
<!-- ITEM 92 PART B. THE SMART LINK. download.js runs HERE, in the head, before the body is shown:
     an iPhone, iPad or iPod -- or an iPad asking for the desktop site -- is sent to the App Store,
     an Android device to Google Play, and everything else stays on this page and reads it. It is a
     normal same-origin script with no inline code, so `script-src 'self'` would serve it. -->
<script src="/download.js"></script>
<style>
  /* The same head basics about.html carries: one local font stack, no webfont, no request that
     leaves this origin. The two badge files are this origin's own. */
  :root{
    --ink:#161616;
    --muted:#6E6E6E;
    --royal:#2454D7;
    --wash:#F6F7FA;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--wash);
    color:var(--ink);
    font-family:"Segoe UI","Noto Naskh Arabic","Noto Sans Arabic",Tahoma,system-ui,-apple-system,sans-serif;
    font-size:17px;
    line-height:1.95;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  main{text-align:center;max-width:520px}
  h1{font-size:40px;line-height:1.3;margin:0 0 24px}
  /* 40px tall -- the stricter of the two vendors' minimums -- with one quarter of that as clear
     space on every side, which is the rule both Apple and Google state in the same words. */
  .badge{display:block;padding:10px}
  .badge img{height:40px;width:auto;display:block;margin:0 auto}
  .credit{color:var(--muted);font-size:13px;line-height:1.7;margin:20px 0 0}
  .home{display:inline-block;margin:20px 0 0;color:var(--royal)}
</style>
</head>
<body>
<main>
<h1>عزك</h1>
<!-- The App Store badge is FIRST. Apple's own rule, not a preference: "Whenever one or more
     badges for other app platforms appear in the layout, use the preferred black badge. Place the
     App Store badge first in the lineup of badges." Both files are the vendors' own artwork,
     used byte for byte -- neither is redrawn, recoloured, cropped or resized. -->
<a class="badge" href="https://apps.apple.com/gb/app/%D8%B9%D8%B2%D9%83/id6797100518">
<img src="/assets/store-badges/app-store-badge.svg" alt="App Store">
</a>
<a class="badge" href="https://play.google.com/store/apps/details?id=app.almurabbi.tutor&amp;hl=ar">
<img src="/assets/store-badges/google-play-badge.svg" alt="Google Play">
</a>
<!-- Apple: "When the App Store badge is used, credit both Apple and the Apple Logo." The wording
     is Apple's international format, and it is the same string the client carries as
     share.appleCredit. Google states no attribution requirement and none is invented for it. -->
<p class="credit">Apple and the Apple Logo are trademarks of Apple Inc., registered in the U.S. and other countries.</p>
<p><a class="home" href="https://ezik.app">ezik.app</a></p>
</main>
</body>
</html>
