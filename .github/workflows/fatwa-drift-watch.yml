# Daily drift watch for the fatwa contract (item 3).
# The 99 gates in gates.json are offline by design, so none of them can see the
# live fatwa service. This schedule is the only thing that calls it every day.
# --selftest runs the mirror test too: if the comparison goes blind, the run fails
# even when there is no real drift. A red run is the scream.
name: fatwa-drift-watch

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Update pins by reviewing the upstream v4 commit and action.yml, then updating
      # tests/workflow-security.test.js and running securityworkflow before merging.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-11-04
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, reviewed 2026-11-04
        with:
          node-version: '22'
      - name: Compare the pinned contract with the live service
        run: node tools/fatwa-drift-watch.cjs --selftest
