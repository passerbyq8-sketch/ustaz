<script>
(function () {
  var root = document.documentElement, status = 'pending', timer, turn = 0;
  root.classList.add('ezik-treasure-theme', 'kunuz-theme-pending');
  function fallback() {
    if (status !== 'pending') return;
    status = 'fallback';
    root.classList.remove('ezik-treasure-theme', 'kunuz-theme-pending');
    if (document.body) document.body.classList.remove('ezik-treasure-theme', 'journey-room');
    document.querySelectorAll('.journey-app,.kunuz-theme-shell').forEach(function (el) { el.remove(); });
    console.warn('[Kunuz theme] Mount timed out after 4000ms; showing playable legacy UI.');
    if (location.pathname.indexOf('hanna-laha') !== -1) {
      var nativeRoom = function () {
        ['Page-oyXYdFLk.css', 'index-BYf54ooy.css'].forEach(function (file) {
          var link = document.createElement('link'); link.rel = 'stylesheet'; link.href = '/hanna-laha/assets/' + file; document.head.append(link);
        });
        var script = document.createElement('script'); script.type = 'module'; script.src = '/hanna-laha/assets/index-iap-v1.js?v=20261025-kfix4'; document.head.append(script);
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', nativeRoom, { once: true }); else nativeRoom();
    }
  }
  window.KunuzThemeBoot = { get status() { return status; }, mounted: function () {
    if (status === 'fallback' || !document.querySelector('.journey-app main')) return;
    if (getComputedStyle(document.body).getPropertyValue('--journey-gold').trim() !== '#ffd36a') return;
    status = 'mounted'; clearTimeout(timer);
    var current = ++turn;
    root.classList.add('ezik-treasure-theme', 'kunuz-theme-pending');
    if (!document.querySelector('.kunuz-theme-shell')) {
      var shell = document.createElement('div'); shell.className = 'kunuz-theme-shell'; shell.setAttribute('role', 'status'); shell.setAttribute('aria-label', 'نجهّز مغامرتكم');
      shell.innerHTML = '<span class="kunuz-theme-spinner" aria-hidden="true"></span>'; document.body.prepend(shell);
    }
    var reveal = function () {
      if (current !== turn) return;
      root.classList.remove('ezik-treasure-theme', 'kunuz-theme-pending');
      document.querySelector('.kunuz-theme-shell')?.remove();
    };
    Promise.all([document.fonts.load('400 16px KunuzPlex'), document.fonts.load('700 16px KunuzPlex')].concat(Array.from(document.querySelectorAll('.journey-app img'), function (img) { return img.decode(); }))).then(reveal, reveal);
  } };
  timer = setTimeout(fallback, 4000);
})();
</script>

.ezik-treasure-theme.kunuz-theme-pending .kunuz-theme-spinner{width:30px;height:30px;border:3px solid #b2d4d94d;border-top-color:#ffd36a;border-radius:50%;animation:kunuz-boot-loading .85s linear infinite}
@keyframes kunuz-boot-loading{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.ezik-treasure-theme.kunuz-theme-pending .kunuz-theme-spinner{animation:none}}
</style>
