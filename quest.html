<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4FBFE">
<title>عزك — كنوز المعرفة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea0:#F4FBFE;--sea1:#E2F3FB;--sea3:#8FCDE6;
  --azraq:#1B6E9C;--ghawr:#0E4F72;--ink:#0B3B54;--muted:#5D8398;
  --white:#fff;--line:#BCDFEF;
  --hd:'Noto Sans Arabic',system-ui,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{color:var(--ink);font-family:var(--hd);font-size:16px;line-height:1.75;min-height:100vh;
  background:linear-gradient(180deg,#fff 0%,var(--sea0) 40%,var(--sea1) 100%)}
.wrap{max-width:620px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 44px}
.top{display:flex;justify-content:flex-start;margin:0 0 6px}
.home{display:inline-flex;align-items:center;gap:8px;min-height:52px;min-width:52px;padding:0 18px;
  border-radius:14px;background:var(--azraq);color:#fff;border:1px solid var(--azraq);
  font-size:1.05rem;font-weight:700;text-decoration:none}
.home:hover,.home:focus-visible{background:var(--ghawr)}
.brand{text-align:center;margin:26px 0 4px}
.brand h1{font-weight:700;font-size:2.4rem;margin:0;color:var(--ghawr)}
.brand p{margin:.35rem 0 0;color:var(--muted);font-size:.95rem}
.rule{width:56px;height:3px;background:var(--sea3);margin:16px auto 24px;border-radius:3px}
.door{display:block;background:var(--white);border:1px solid var(--line);border-radius:16px;
  padding:18px 18px;margin:0 0 12px;text-decoration:none;color:inherit;min-height:48px}
.door:hover,.door:focus-visible{border-color:var(--azraq)}
.door b{display:block;font-size:1.35rem;color:var(--ghawr);margin-bottom:2px}
.door span{display:block;color:var(--muted);font-size:.92rem;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="top" aria-label="الخروج">
    <a onclick="try{sessionStorage.setItem('ezik_resume_section_v1','home')}catch(e){}" class="home" href="/" aria-label="الرئيسية — العودة إلى عزك">🏠 الرئيسية</a>
  </nav>
  <div class="brand"><h1>كنوز المعرفة</h1>
    <p>طوران على جهاز واحد · لا يتكرّر سؤال حتّى تنفد الأسئلة</p></div>
  <div class="rule"></div>
  <a class="door" href="/quest-ghaws.html"><b>الغوص</b>
    <span>انزل قامةً بعد قامة، واطلع بحصيلتك قبل أن يخونك جواب — وحدك أو بطاقم</span></a>
  <a class="door" href="/quest-harb.html"><b>حرب الجزر</b>
    <span>لعبة مجموعات · أرخبيل من الجزر يُفتح بالجواب لا بالنرد</span></a>
</div>
</body>
</html>
